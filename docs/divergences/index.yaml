      "behavior": "Ordinary queue-only messages and explicit progress remain quiet and FIFO. Every explicit intent, including progress, requires an idempotency_key and retains the original communication and scope in durable admission metadata. Only root-directed action_required or result_ready are actionable; they may wake an active wait only when it explicitly targets the matching sender. The wake signal is body-free and matched by sender/recipient identity and queue generation. Identical retries return the original receipt; changed requests cannot reuse a key, and supersedes may name same-scope progress updates only. Legacy IDs and unmatched activity do not create an actionable wake.",
