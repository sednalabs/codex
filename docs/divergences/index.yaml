        "codex-rs/core/tests/suite/unified_exec.rs",
        ".github/validation-lanes.json",
        "justfile"
      ],
      "behavior": "Unified exec records source output in a bounded, non-draining final transcript before updating the drainable response buffer or publishing best-effort delta events. Final command events wait for bounded source closure and delta-stream ordering, and exec-server exit events start that bound even when inherited descriptors delay the source-closed event. A lagging delta receiver therefore cannot silently remove output or corrupt omission accounting in ExecCommandEnd while a descendant-held stream cannot suppress finalization indefinitely.",
      "upstream_equivalent": false,
      "introduced_in": {
        "carry_commit": null,
        "upstream_commit": null
      },
      "guardrail_lane": "codex.blocking-waits-unified-exec-targeted; rust-ci-full",
      "tests": [
        "source_transcript_preserves_exec_end_when_delta_receiver_lags",
        "failed_initial_end_for_unstored_process_prefers_source_transcript",
        "failed_exec_end_uses_fallback_when_source_transcript_is_empty",
        "unified_exec_formats_large_output_summary",
        "unified_exec_full_lifecycle_with_background_end_event",
        "unified_exec_end_event_is_bounded_when_descendant_holds_output_open"
      ],
      "owner": "downstream",
      "notes": "The final transcript remains intentionally bounded: it retains the configured head and tail and inserts an explicit marker for omitted middle bytes. Source closure uses the established exec I/O drain timeout so inherited descriptors or abnormal backend teardown cannot hang finalization; exec-server Exited starts that timeout without waiting indefinitely for Closed. Chunks recorded before that deadline remain authoritative; output produced only after the deadline is intentionally outside the completed transcript. Preserve this direct fix only until upstream has equivalent source-owned bounded aggregation, bounded source-close ordering, and regression coverage.",
      "upstreamability_tier": "upstream-pr",
      "boundary_type": "direct-upstream-fix",
      "hotspot_files": [
        "codex-rs/core/src/unified_exec/process.rs",
        "codex-rs/core/src/unified_exec/async_watcher.rs",
        "codex-rs/core/src/unified_exec/process_manager.rs"
      ],
      "extraction_target": "upstreamable unified-exec final transcript fix"
    },
