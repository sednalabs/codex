name: shell-tool-mcp CI

on:
  push:
    paths:
      - "shell-tool-mcp/**"
      - ".github/workflows/shell-tool-mcp-ci.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "shell-tool-mcp/**"
      - ".github/workflows/shell-tool-mcp-ci.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: >-
    concurrency-group::${{ github.workflow }}::${{
      github.event_name == 'merge_group' &&
      format('merge-group-{0}', github.sha) ||
      github.event_name == 'pull_request' &&
      format('pr-{0}', github.event.pull_request.number) ||
      github.ref_name
    }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref_name != 'main' && github.ref_name != 'upstream-main' }}

env:
  NODE_VERSION: 22

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm --filter @openai/codex-shell-tool-mcp run format

      - name: Run tests
        run: pnpm --filter @openai/codex-shell-tool-mcp test

      - name: Build
        run: pnpm --filter @openai/codex-shell-tool-mcp run build
