name: shell-tool-mcp CI

on:
  push:
    paths:
      - "shell-tool-mcp/**"
      - ".github/workflows/shell-tool-mcp-ci.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "shell-tool-mcp/**"
      - ".github/workflows/shell-tool-mcp-ci.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: shell-tool-mcp-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'upstream-main' }}

env:
  NODE_VERSION: 22

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm --filter @openai/codex-shell-tool-mcp run format
      - name: Run tests
        run: pnpm --filter @openai/codex-shell-tool-mcp test
      - name: Build
        run: pnpm --filter @openai/codex-shell-tool-mcp run build
