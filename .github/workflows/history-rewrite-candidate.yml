name: History rewrite candidate (w13828)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "synthetic, inventory, or rewrite"
        required: true
        default: synthetic
        type: choice
        options: [synthetic, inventory, rewrite]
      source_sha:
        description: "Exact source main commit from the frozen selected-ref map"
        required: false
        default: ""
        type: string
      workflow_harness_sha:
        description: "Exact commit containing both frozen workflows, driver, and policy"
        required: false
        type: string
      workflow_harness_tree:
        description: "Exact tree ID for workflow_harness_sha"
        required: false
        type: string
      selected_refs_gzip_b64:
        description: "gzip+base64 canonical selected-ref JSON map"
        required: false
        type: string
      selected_refs_sha256:
        description: "SHA-256 of canonical selected-ref JSON"
        required: false
        type: string
      selected_refs_count:
        description: "Exact selected-ref map entry count"
        required: false
        type: string
      selected_refs_bytes:
        description: "Exact selected-ref map UTF-8 byte length"
        required: false
        type: string
      backup_run_id:
        description: "Exact successful Recovery snapshot run using this frozen harness"
        required: false
        type: string
      age_recipient:
        description: "Public age recipient for encrypted candidate-object custody"
        required: false
        type: string
      tag_signature_ack:
        description: "Acknowledge annotated-tag signatures cannot survive rewritten commits"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  actions: read

concurrency:
  group: history-rewrite-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic:
    if: inputs.mode == 'synthetic'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned git-filter-repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          url = "https://files.pythonhosted.org/packages/60/60/d3943f0880ebcb7e0bdf79254d10dddd39c7b656eeecae32b8806ff66dec/git_filter_repo-2.47.0-py3-none-any.whl"
          expected = "2cd04929b9024e83e65db571cbe36aec65ead0cb5f9ec5abe42158654af5ad83"
          data = urllib.request.urlopen(url).read()
          if hashlib.sha256(data).hexdigest() != expected: raise SystemExit("pinned git-filter-repo digest mismatch")
          pathlib.Path("git_filter_repo-2.47.0-py3-none-any.whl").write_bytes(data)
          PY
          python3 -m pip install --disable-pip-version-check --no-warn-script-location --user --no-deps git_filter_repo-2.47.0-py3-none-any.whl
      - name: Exercise production drivers and receipt mismatch fixtures
        run: scripts/history-rewrite/fixtures/run_fixture.sh > fixture-evidence.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: history-rewrite-synthetic-${{ github.run_id }}
          path: fixture-evidence.txt
          if-no-files-found: error
          retention-days: 7

  candidate:
    if: inputs.mode != 'synthetic'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      HARNESS_SHA: ${{ inputs.workflow_harness_sha }}
      HARNESS_TREE: ${{ inputs.workflow_harness_tree }}
      SELECTED_REFS_GZIP_B64: ${{ inputs.selected_refs_gzip_b64 }}
      SELECTED_REFS_SHA256: ${{ inputs.selected_refs_sha256 }}
      SELECTED_REFS_COUNT: ${{ inputs.selected_refs_count }}
      SELECTED_REFS_BYTES: ${{ inputs.selected_refs_bytes }}
      BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
      AGE_RECIPIENT: ${{ inputs.age_recipient }}
      TAG_SIGNATURE_ACK: ${{ inputs.tag_signature_ack }}
      MODE: ${{ inputs.mode }}
      POLICY: scripts/history-rewrite/policy.json
      REPO_URL: https://github.com/${{ github.repository }}.git
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout frozen harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify frozen inputs and reviewed adapter policy
        run: |
          set -euo pipefail; umask 077
          [[ "$GITHUB_REPOSITORY" == sednalabs/codex && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HARNESS_SHA" =~ ^[0-9a-f]{40}$ && "$HARNESS_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$HARNESS_SHA"
          test "$(git rev-parse "$GITHUB_SHA^{tree}")" = "$HARNESS_TREE"
          python3 scripts/history-rewrite/adapt_review_packet.py check-policy --policy "$POLICY"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, re, subprocess
          try:
              raw = gzip.decompress(base64.b64decode(os.environ["SELECTED_REFS_GZIP_B64"], validate=True))
              refs = json.loads(raw)
          except Exception as exc:
              raise SystemExit(f"invalid gzip+base64 selected-ref map: {exc}")
          canonical = json.dumps(refs, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          if raw != canonical: raise SystemExit("selected-ref map is not canonical sorted UTF-8 JSON")
          if not isinstance(refs, dict) or not refs: raise SystemExit("selected-ref map must be a non-empty object")
          if hashlib.sha256(raw).hexdigest() != os.environ["SELECTED_REFS_SHA256"]: raise SystemExit("selected-ref map digest mismatch")
          if len(refs) != int(os.environ["SELECTED_REFS_COUNT"]) or len(raw) != int(os.environ["SELECTED_REFS_BYTES"]): raise SystemExit("selected-ref map count or byte length mismatch")
          for name, oid in refs.items():
              if not isinstance(name, str) or not (name.startswith("refs/heads/") or name.startswith("refs/tags/")): raise SystemExit("selected ref is outside heads/tags")
              if subprocess.run(["git", "check-ref-format", name], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode: raise SystemExit(f"invalid selected ref: {name!r}")
              if not isinstance(oid, str) or not re.fullmatch(r"[0-9a-f]{40}", oid): raise SystemExit(f"invalid selected object for {name!r}")
          if refs.get("refs/heads/main") != os.environ["SOURCE_SHA"]: raise SystemExit("source SHA is not the frozen original main identity")
          open("selected-refs.json", "wb").write(raw)
          PY
          mkdir -m 700 output work
          printf '%s\n' "repository=$GITHUB_REPOSITORY" "workflow_harness_sha=$HARNESS_SHA" "workflow_harness_tree=$HARNESS_TREE" \
            "source_sha=$SOURCE_SHA" "selected_refs_sha256=$SELECTED_REFS_SHA256" "selected_refs_count=$SELECTED_REFS_COUNT" \
            "selected_refs_bytes=$SELECTED_REFS_BYTES" "backup_run_id=$BACKUP_RUN_ID" > output/binding.txt
      - name: Independently verify exact backup run, receipt, and ciphertext artifact
        if: inputs.mode == 'rewrite'
        run: |
          set -euo pipefail; umask 077
          [[ "$BACKUP_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID" > work/backup-run.json
          WORKFLOW_ID=$(jq -r .workflow_id work/backup-run.json)
          [[ "$WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID" > work/backup-workflow.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID/artifacts?per_page=100" > work/backup-artifacts.json
          RECEIPT_ID=$(jq -er '[.artifacts[] | select(.name == "recovery-snapshot-receipt")] | if length == 1 then .[0].id else error("receipt artifact count mismatch") end' work/backup-artifacts.json)
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ID/zip" > work/backup-receipt.zip
          python3 scripts/recovery-snapshot/receipt.py verify --repository "$GITHUB_REPOSITORY" --run-id "$BACKUP_RUN_ID" \
            --harness-sha "$HARNESS_SHA" --source-sha "$SOURCE_SHA" --selected-refs-sha256 "$SELECTED_REFS_SHA256" \
            --selected-refs-count "$SELECTED_REFS_COUNT" --selected-refs-bytes "$SELECTED_REFS_BYTES" --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --run-json work/backup-run.json --workflow-json work/backup-workflow.json --artifacts-json work/backup-artifacts.json \
            --receipt-zip work/backup-receipt.zip --output output/verified-backup.json --selected-refs-output work/backup-selected-refs.json
          cmp -s selected-refs.json work/backup-selected-refs.json || { echo 'caller selected-ref map differs from verified backup map' >&2; exit 1; }
          mv work/backup-selected-refs.json selected-refs.json
      - name: Install pinned git-filter-repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          url = "https://files.pythonhosted.org/packages/60/60/d3943f0880ebcb7e0bdf79254d10dddd39c7b656eeecae32b8806ff66dec/git_filter_repo-2.47.0-py3-none-any.whl"
          expected = "2cd04929b9024e83e65db571cbe36aec65ead0cb5f9ec5abe42158654af5ad83"
          data = urllib.request.urlopen(url).read()
          if hashlib.sha256(data).hexdigest() != expected: raise SystemExit("pinned git-filter-repo digest mismatch")
          pathlib.Path("work/git_filter_repo-2.47.0-py3-none-any.whl").write_bytes(data)
          pathlib.Path("output/filter-repo-provenance.txt").write_text(f"version=2.47.0\nfilename=git_filter_repo-2.47.0-py3-none-any.whl\nsha256={expected}\nurl={url}\n", encoding="utf-8")
          PY
          python3 -m pip install --disable-pip-version-check --no-warn-script-location --user --no-deps work/git_filter_repo-2.47.0-py3-none-any.whl
      - name: Re-exercise production driver against synthetic fixtures
        run: scripts/history-rewrite/fixtures/run_fixture.sh > output/fixture-evidence.txt
      - name: Fetch only frozen objects into isolated refs
        run: |
          set -euo pipefail; umask 077
          rm -rf work/repo.git
          git init --bare work/repo.git >/dev/null
          git -C work/repo.git remote add source "$REPO_URL"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          refs = json.load(open("selected-refs.json", encoding="utf-8"))
          isolated = {}
          for name, oid in sorted(refs.items()):
              target = "refs/rewrites/selected/" + hashlib.sha256(name.encode("utf-8")).hexdigest()
              subprocess.run(["git", "-C", "work/repo.git", "fetch", "--no-tags", "source", f"{oid}:{target}"], check=True)
              if subprocess.check_output(["git", "-C", "work/repo.git", "rev-parse", target], text=True).strip() != oid: raise SystemExit(f"frozen object fetch mismatch: {name}")
              isolated[name] = target
          source_target = "refs/rewrites/source"
          subprocess.run(["git", "-C", "work/repo.git", "update-ref", source_target, os.environ["SOURCE_SHA"]], check=True)
          open("output/original-to-isolated-ref-map.json", "w", encoding="utf-8").write(json.dumps(isolated, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          test -z "$(git -C work/repo.git for-each-ref --format='%(refname)' | awk '$0 !~ /^refs\/rewrites\// {print}')"
      - name: Inventory bounded identities
        run: |
          set -euo pipefail
          repo=work/repo.git
          git -C "$repo" for-each-ref --format='%(refname) %(objectname)' | sha256sum > output/refs.digest
          git -C "$repo" for-each-ref --format='%(refname)' | wc -l > output/ref-count
          git -C "$repo" rev-list --all --count > output/commit-count
          git -C "$repo" rev-list --all --format='%H%x09%P%x09%s%x09%b' --no-commit-header | sha256sum > output/commit-metadata.digest
          git -C "$repo" rev-list --all --objects | sha256sum > output/object-paths.digest
          git -C "$repo" cat-file --batch-all-objects --batch-check='%(objectname) %(objecttype) %(objectsize)' | sha256sum > output/object-metadata.digest
          printf '%s\n' 'plaintext object, commit, path, tree, and blob listings are intentionally not retained' > output/content-boundary.txt
          sha256sum "$POLICY" > output/policy.digest
          python3 scripts/history-rewrite/classify.py "$repo" "$POLICY" output/classification.tsv
          sha256sum output/classification.tsv > output/classification.digest
      - name: Apply reviewed rewrite and prove exact boundaries
        if: inputs.mode == 'rewrite'
        run: |
          set -euo pipefail
          selected_has_tags=$(python3 -c 'import json; print(str(any(k.startswith("refs/tags/") for k in json.load(open("selected-refs.json")))).lower())')
          if test "$selected_has_tags" = true && test "$TAG_SIGNATURE_ACK" != true; then echo 'tag rewrite requires explicit signature acknowledgement' >&2; exit 1; fi
          git clone --mirror --no-local work/repo.git work/preimage.git >/dev/null
          python3 scripts/history-rewrite/rewrite_candidate.py apply --repo work/repo.git --preimage work/preimage.git --policy "$POLICY" --source-sha "$SOURCE_SHA" --work work --output output
          test -z "$(git -C work/repo.git for-each-ref --format='%(refname)' | awk '$0 !~ /^refs\/rewrites\// {print}')"
          python3 scripts/history-rewrite/classify.py work/repo.git "$POLICY" output/classification-after.tsv
          python3 - "$POLICY" output/classification.tsv output/classification-after.tsv <<'PY'
          import json, sys
          policy, before, after = sys.argv[1:]
          def counts(path): return {line.rstrip().split("\t")[1]: int(line.rstrip().split("\t")[2]) for line in open(path, encoding="utf-8") if line.startswith("#count\t")}
          old_counts, new_counts = counts(before), counts(after)
          rules = json.load(open(policy, encoding="utf-8"))["rules"]
          canonical_paths = {path for rule in rules if rule["kind"] == "exact_blob_replacement" for path in rule["target_paths"]}
          for rule in rules:
              if rule["kind"] == "exact_blob_replacement": continue
              if rule["scope"] == "blob" and canonical_paths.intersection(rule["target_paths"]): continue
              old, new = rule["id"] + ":old", rule["id"] + ":new"
              if new_counts.get(old, 0) != 0 or new_counts.get(new, 0) - old_counts.get(new, 0) != old_counts.get(old, 0): raise SystemExit(f"rewrite match-count delta failed for {rule['id']}")
          PY
      - name: Install pinned age for candidate custody
        if: inputs.mode == 'rewrite'
        run: |
          set -euo pipefail; umask 077
          [[ "$AGE_RECIPIENT" =~ ^age1[0-9a-z]+$ ]]
          mkdir -p work/age-tool
          curl --fail --location --silent --show-error --retry 3 --output work/age-tool/age.tar.gz \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          test "$(stat -c '%s' work/age-tool/age.tar.gz)" = 19405817
          test "$(sha256sum work/age-tool/age.tar.gz | cut -d' ' -f1)" = cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
          tar -xzf work/age-tool/age.tar.gz -C work/age-tool age/age
      - name: Encrypt recoverable generated Git objects
        if: inputs.mode == 'rewrite'
        id: encrypt_candidate
        run: |
          set -euo pipefail; umask 077
          git -C work/repo.git bundle create "$GITHUB_WORKSPACE/work/history-rewrite-candidate.bundle" --all
          BUNDLE_HEADS=$(git bundle list-heads work/history-rewrite-candidate.bundle)
          test -n "$BUNDLE_HEADS"
          test -z "$(printf '%s\n' "$BUNDLE_HEADS" | awk '$2 !~ /^refs\/rewrites\// {print}')"
          git init --bare work/candidate-restore.git >/dev/null
          git -C work/candidate-restore.git fetch "$GITHUB_WORKSPACE/work/history-rewrite-candidate.bundle" 'refs/rewrites/*:refs/rewrites/*'
          git -C work/candidate-restore.git fsck --full --no-reflogs
          python3 - <<'PY'
          import hashlib, json, subprocess
          refs = {}
          for line in subprocess.check_output(["git", "-C", "work/candidate-restore.git", "for-each-ref", "--format=%(refname) %(objectname)"], text=True).splitlines():
              name, oid = line.split(); refs[name] = oid
          if not refs or any(not name.startswith("refs/rewrites/") for name in refs): raise SystemExit("candidate custody contains a canonical or empty ref set")
          raw = json.dumps(refs, sort_keys=True, separators=(",", ":")).encode()
          open("work/candidate-ref-map.json", "wb").write(raw)
          open("output/candidate-object-identity.json", "w", encoding="utf-8").write(json.dumps({"ref_count":len(refs),"ref_map_sha256":hashlib.sha256(raw).hexdigest()}, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf work/history-rewrite-candidate.tar.gz -C work history-rewrite-candidate.bundle candidate-ref-map.json
          work/age-tool/age/age -r "$AGE_RECIPIENT" -o history-rewrite-candidate.age work/history-rewrite-candidate.tar.gz
          echo "inner_sha256=$(sha256sum work/history-rewrite-candidate.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "inner_size=$(stat -c '%s' work/history-rewrite-candidate.tar.gz)" >> "$GITHUB_OUTPUT"
          echo "ciphertext_sha256=$(sha256sum history-rewrite-candidate.age | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "ciphertext_size=$(stat -c '%s' history-rewrite-candidate.age)" >> "$GITHUB_OUTPUT"
          echo "recipient_sha256=$(printf '%s' "$AGE_RECIPIENT" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "age_version=$(work/age-tool/age/age --version)" >> "$GITHUB_OUTPUT"
          rm -rf work/preimage.git work/candidate-restore.git work/history-rewrite-candidate.bundle work/history-rewrite-candidate.tar.gz work/candidate-ref-map.json
      - id: upload_candidate
        if: inputs.mode == 'rewrite'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: history-rewrite-candidate-ciphertext
          path: history-rewrite-candidate.age
          retention-days: 3
          if-no-files-found: error
      - name: Bind candidate ciphertext artifact API receipt
        if: inputs.mode == 'rewrite'
        env:
          ARTIFACT_ID: ${{ steps.upload_candidate.outputs.artifact-id }}
          CIPHERTEXT_SHA: ${{ steps.encrypt_candidate.outputs.ciphertext_sha256 }}
          CIPHERTEXT_SIZE: ${{ steps.encrypt_candidate.outputs.ciphertext_size }}
          INNER_SHA: ${{ steps.encrypt_candidate.outputs.inner_sha256 }}
          INNER_SIZE: ${{ steps.encrypt_candidate.outputs.inner_size }}
          RECIPIENT_SHA: ${{ steps.encrypt_candidate.outputs.recipient_sha256 }}
          AGE_VERSION: ${{ steps.encrypt_candidate.outputs.age_version }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > work/candidate-artifact.json
          jq -e --argjson id "$ARTIFACT_ID" --arg sha "$CIPHERTEXT_SHA" --argjson size "$CIPHERTEXT_SIZE" \
            --arg inner_sha "$INNER_SHA" --argjson inner_size "$INNER_SIZE" --arg recipient_sha "$RECIPIENT_SHA" --arg age "$AGE_VERSION" \
            'if .id == $id and .name == "history-rewrite-candidate-ciphertext" and .expired == false and (.digest | startswith("sha256:")) then {schema:"history-rewrite-custody-v1",inner_sha256:$inner_sha,inner_size:$inner_size,ciphertext_sha256:$sha,ciphertext_size:$size,recipient_sha256:$recipient_sha,age_version:$age,artifact_id:.id,artifact_api_digest:.digest,artifact_api_size:.size_in_bytes,expires_at:.expires_at} else error("candidate artifact API mismatch") end' \
            work/candidate-artifact.json > output/candidate-custody-receipt.json
      - name: Finalize identity-only metadata manifest
        run: sha256sum output/* > output/manifest.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: history-rewrite-${{ inputs.mode }}-${{ github.run_id }}
          path: output
          if-no-files-found: error
          retention-days: 7
      - name: Remove all candidate staging
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -f history-rewrite-candidate.age selected-refs.json
          rm -rf work output
