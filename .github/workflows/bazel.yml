          ${{ fromJSON(github.repository == 'sednalabs/codex' &&
            '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"macos-15","target":"aarch64-apple-darwin"}]' ||
            '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"macos-15","target":"aarch64-apple-darwin"},{"os":"windows-2022","target":"x86_64-pc-windows-gnullvm"}]') }}
    runs-on: ${{ matrix.os }}
    name: Bazel clippy on ${{ matrix.os }} for ${{ matrix.target }}
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: ${{ matrix.os == 'windows-2022' && '1' || '' }}
