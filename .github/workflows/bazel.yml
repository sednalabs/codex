name: Native core proxy event diagnostic (validation host)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact native source commit to validate
        required: true
        type: string
      expected_workflow_host_sha:
        description: Exact commit containing this validation workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-830-proxy-event-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  core-all-test:
    name: GNU core all-test unfiltered diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILDBUDDY_API_KEY: ''
    steps:
      - name: Verify fixed validation-host identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          expected_ref='validation/host-830-proxy-event-17bd4f9e'
          if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch ||
                "${GITHUB_REPOSITORY}" != sednalabs/codex ||
                "${GITHUB_REF_NAME}" != "${expected_ref}" ||
                "${GITHUB_SHA}" != "${EXPECTED_HOST_SHA}" ]]; then
            echo 'Dispatch does not match the fixed host ref and requested host SHA.' >&2
            exit 1
          fi

      - name: Check out exact native source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source, host-parent, and base identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          expected_source_sha='17bd4f9e5845f99fe38a4238121236881fd65499'
          expected_source_tree='3ae397232f2306b0c576dcb0c454b4bb004ef375'
          expected_source_parent='1b3032eab6a9deed0f138831fa0b2a6cef020871'
          expected_source_ref='validation/native-830-proxy-event-17bd4f9e'
          expected_host_ref='validation/host-830-proxy-event-17bd4f9e'
          expected_base='83086188ae0614bd882818ff1aa23f3194962012'

          [[ "${SOURCE_SHA}" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD)" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "${expected_source_tree}" ]]
          [[ "$(git rev-parse HEAD^)" == "${expected_source_parent}" ]]
          git cat-file -e "${EXPECTED_HOST_SHA}^{commit}"
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}^")" == "${expected_source_sha}" ]]
          git merge-base --is-ancestor "${expected_base}" "${expected_source_sha}"
          git show-ref --verify --quiet "refs/remotes/origin/${expected_source_ref}"
          [[ "$(git rev-parse "refs/remotes/origin/${expected_source_ref}")" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}")" == "${GITHUB_SHA}" ]]
          [[ "${GITHUB_REF_NAME}" == "${expected_host_ref}" ]]

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: native-830-proxy-event-unfiltered-${{ inputs.source_sha }}

      - name: Run unfiltered core all-test with default shard and test concurrency
        id: run_core_all
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          unset BUILDBUDDY_API_KEY
          umask 077
          test_log="${RUNNER_TEMP}/native-core-all-test.log"
          receipt="${RUNNER_TEMP}/native-core-all-test-receipt.json"

          set +e
          ./.github/scripts/run-bazel-ci.sh -- \
            test \
            --nocache_test_results \
            --test_output=all \
            -- \
            //codex-rs/core:core-all-test 2>&1 | tee "${test_log}" >/dev/null
          statuses=("${PIPESTATUS[@]}")
          set -e
          bazel_exit="${statuses[0]}"
          tee_exit="${statuses[1]}"

          source_worktree_clean=1
          if [[ -n "$(git status --porcelain)" ]]; then
            source_worktree_clean=0
          fi

          python3 - "${test_log}" "${receipt}" "${HOST_SHA}" "${SOURCE_SHA}" \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" \
            "${bazel_exit}" "${tee_exit}" "${source_worktree_clean}" <<'PY'
          import json
          import re
          import sys

          (
              log_path,
              receipt_path,
              host_sha,
              source_sha,
              run_id,
              run_attempt,
              bazel_exit_text,
              tee_exit_text,
              source_clean_text,
          ) = sys.argv[1:]

          target = "//codex-rs/core:core-all-test"
          test_name = "suite::network_approval::agent_started_proxy_denies_brokered_provider_alias"
          test_line = re.compile(rf"^test {re.escape(test_name)} \.\.\. (ok|FAILED)$")
          ansi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          wait_diagnostic = re.compile(
              r"stage=waiting_for_turn_complete boundary=(timeout|stream_ended) "
              r"event_count=(\d+) nonterminal_event_count=(\d+) "
              r"exec_begin_count=(\d+) exec_end_count=(\d+) "
              r"last_event_class=(none|exec_begin|exec_end|other|error) "
              r"model_request_capture_count=(\d+) "
              r"command_exit_category=(missing|running|exit_zero|exit_nonzero|unclassified)"
          )
          turn_error_diagnostic = re.compile(
              r"stage=turn_error codex_error_info=.*? event_count=(\d+) "
              r"nonterminal_event_count=(\d+) exec_begin_count=(\d+) "
              r"exec_end_count=(\d+) last_event_class=(none|exec_begin|exec_end|other|error) "
              r"model_request_capture_count=(\d+) "
              r"command_exit_category=(missing|running|exit_zero|exit_nonzero|unclassified)"
          )

          passed = 0
          failed = 0
          diagnostics = []
          with open(log_path, encoding="utf-8", errors="replace") as log_file:
              for raw_line in log_file:
                  line = ansi.sub("", raw_line.rstrip("\r\n"))
                  test_match = test_line.fullmatch(line)
                  if test_match is not None:
                      if test_match.group(1) == "ok":
                          passed += 1
                      else:
                          failed += 1

                  match = wait_diagnostic.search(line)
                  if match is not None and len(diagnostics) < 8:
                      diagnostics.append(
                          {
                              "stage": "waiting_for_turn_complete",
                              "boundary": match.group(1),
                              "event_count": int(match.group(2)),
                              "nonterminal_event_count": int(match.group(3)),
                              "exec_begin_count": int(match.group(4)),
                              "exec_end_count": int(match.group(5)),
                              "last_event_class": match.group(6),
                              "model_request_capture_count": int(match.group(7)),
                              "command_exit_category": match.group(8),
                          }
                      )
                      continue

                  match = turn_error_diagnostic.search(line)
                  if match is not None and len(diagnostics) < 8:
                      diagnostics.append(
                          {
                              "stage": "turn_error",
                              "event_count": int(match.group(1)),
                              "nonterminal_event_count": int(match.group(2)),
                              "exec_begin_count": int(match.group(3)),
                              "exec_end_count": int(match.group(4)),
                              "last_event_class": match.group(5),
                              "model_request_capture_count": int(match.group(6)),
                              "command_exit_category": match.group(7),
                          }
                      )

          if failed == 0:
              diagnostics = []
          bazel_exit = int(bazel_exit_text)
          tee_exit = int(tee_exit_text)
          source_worktree_clean = source_clean_text == "1"
          if failed:
              status = "failed-observed"
          elif passed == 1 and bazel_exit == 0 and tee_exit == 0 and source_worktree_clean:
              status = "executed-pass"
          elif passed > 1:
              status = "multiple-observations"
          elif passed == 0 and failed == 0:
              status = "test-not-observed"
          else:
              status = "command-or-receipt-failure"

          receipt = {
              "schema_version": 1,
              "workflow_host_ref": "validation/host-830-proxy-event-17bd4f9e",
              "workflow_host_sha": host_sha,
              "validation_target_ref": "validation/native-830-proxy-event-17bd4f9e",
              "source_sha": source_sha,
              "source_tree": "3ae397232f2306b0c576dcb0c454b4bb004ef375",
              "source_parent": "1b3032eab6a9deed0f138831fa0b2a6cef020871",
              "base_sha": "83086188ae0614bd882818ff1aa23f3194962012",
              "run_id": run_id,
              "run_attempt": run_attempt,
              "mode": "standard-hosted-ubuntu24-local-gnu-unfiltered-default-shards",
              "target": target,
              "test_name": test_name,
              "test_pass_lines": passed,
              "test_failure_lines": failed,
              "source_worktree_clean": source_worktree_clean,
              "bazel_exit": bazel_exit,
              "tee_exit": tee_exit,
              "failure_diagnostics": diagnostics,
              "status": status,
          }
          with open(receipt_path, "w", encoding="utf-8") as receipt_file:
              json.dump(receipt, receipt_file, separators=(",", ":"))
          print(json.dumps(receipt, separators=(",", ":")))
          if status != "executed-pass":
              raise SystemExit(1)
          PY

      - name: Upload compact diagnostic receipt
        if: always() && !cancelled() && steps.run_core_all.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-core-proxy-event-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-core-all-test-receipt.json
          if-no-files-found: error
