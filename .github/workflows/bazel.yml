name: Bazel

# Note this workflow was originally derived from:
# https://github.com/cerisier/toolchains_llvm_bootstrapped/blob/main/.github/workflows/ci.yaml

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      w14939_focused_tests:
        description: Run the focused PR 995 Linux regression set
        required: false
        type: boolean
        default: false
      w14939_snapshot_capture:
        description: Capture the normalized enterprise lifecycle snapshot only
        required: false
        type: boolean
        default: false

concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    # PRs use the sharded Windows cross-compiled test jobs below. Post-merge
    # pushes to main also run the native Windows test job for broader Windows
    # signal without putting PR latency back on the critical path. When
    # Code-mode unit tests run on every Bazel target. When authenticated RBE
    # is available, the Windows-cross shards exercise the source-built V8 path.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.w14939_focused_tests) && '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","timeout_minutes":90,"test_timeout_minutes":80}]' || '[{"os":"macos-15","target":"aarch64-apple-darwin","timeout_minutes":165,"test_timeout_minutes":150},{"os":"macos-15","target":"x86_64-apple-darwin","timeout_minutes":165,"test_timeout_minutes":150},{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","timeout_minutes":135,"test_timeout_minutes":120},{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","timeout_minutes":135,"test_timeout_minutes":120}]') }}

    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Bazel test on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}

      - name: Check rusty_v8 MODULE.bazel checksums
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          python3 .github/scripts/rusty_v8_bazel.py check-module-bazel
          just test-github-scripts

      - name: Check MODULE.bazel.lock is up to date
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: ./scripts/check-module-bazel-lock.sh

      - name: Resolve app-server/exec-server compatibility releases
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases="$(python3 .github/scripts/resolve_exec_server_releases.py)"
          echo "CODEX_COMPAT_RELEASES=$releases" >> "$GITHUB_ENV"

      - name: Run Bazel tests
        # Keep time for test-log upload and cache cleanup before the job limit.
        timeout-minutes: ${{ matrix.test_timeout_minutes }}
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          W14939_FOCUSED_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.w14939_focused_tests }}
          W14939_SNAPSHOT_CAPTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.w14939_snapshot_capture }}
        shell: bash
        run: |
          bazel_targets=(
            //...
            # Keep standalone V8 library targets out of the ordinary Bazel CI
            # path. V8 consumers under `//codex-rs/...` still participate
            # transitively through `//...`.
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )

          bazel_wrapper_args=(
            --print-failed-action-summary
            --print-failed-test-logs
          )
          bazel_test_args=(
            test
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
          )
          if [[ "${W14939_FOCUSED_TESTS}" == "true" ]]; then
            unset BUILDBUDDY_API_KEY
            echo "Focused validation uses the hosted runner only; remote execution is disabled."
            focused_status=0
            expected_product_source="ef0fdb777eb159d105c4e7e825fd370bf07b1fbe"
            workflow_host_sha="$(git rev-parse HEAD)"
            product_source_sha="$(git cat-file commit HEAD | awk '$1 == "parent" { print $2; exit }')"
            if [[ "${workflow_host_sha}" != "${GITHUB_SHA}" || "${product_source_sha}" != "${expected_product_source}" ]]; then
              echo "Focused source identity mismatch: host=${workflow_host_sha}, source=${product_source_sha}" >&2
              exit 1
            fi
            echo "Focused product source: ${product_source_sha} (workflow host: ${workflow_host_sha})"
            if [[ "${W14939_SNAPSHOT_CAPTURE}" == "true" ]]; then
              snapshot_path=codex-rs/core/tests/suite/snapshots/all__suite__scenarios__mcp_ema__enterprise_revocation_preserves_history_and_ordinary_tools.snap
              snapshot_artifact_dir="${RUNNER_TEMP}/w14939-normalized-snapshots"
              mkdir -p "${snapshot_artifact_dir}"
              snapshot_status=0
              ./.github/scripts/run-bazel-ci.sh \
                --print-failed-test-logs \
                --print-failed-action-summary \
                -- \
                test \
                --test_tag_filters=-argument-comment-lint \
                --test_verbose_timeout_warnings \
                --test_output=summary \
                --test_env=INSTA_UPDATE=always \
                --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
                --test_arg=--exact \
                --test_arg=suite::scenarios::mcp_ema::enterprise_lifecycle_preserves_history_and_ordinary_tools::policy \
                -- \
                //codex-rs/core:core-all-test || snapshot_status=$?
              if ! git diff --quiet -- "${snapshot_path}"; then
                cp "${snapshot_path}" "${snapshot_artifact_dir}/$(basename "${snapshot_path}")"
              else
                echo "The enterprise policy snapshot did not change as expected." >&2
                snapshot_status=1
              fi
              if [[ "${snapshot_status}" -eq 0 ]]; then
                ./.github/scripts/run-bazel-ci.sh \
                  --print-failed-test-logs \
                  --print-failed-action-summary \
                  -- \
                  test \
                  --test_tag_filters=-argument-comment-lint \
                  --test_verbose_timeout_warnings \
                  --test_output=summary \
                  --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
                  --test_arg=--exact \
                  --test_arg=suite::scenarios::mcp_ema::enterprise_lifecycle_preserves_history_and_ordinary_tools::policy \
                  -- \
                  //codex-rs/core:core-all-test || snapshot_status=$?
              fi
              git restore -- "${snapshot_path}"
              rm -f "${snapshot_path}.new"
              exit "${snapshot_status}"
            fi
            ./.github/scripts/run-bazel-ci.sh \
              --print-failed-test-logs \
              --print-failed-action-summary \
              -- \
              test \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
              -- \
              //codex-rs/rollout:rollout-alternate-group-materialization-test || focused_status=$?
            ./.github/scripts/run-bazel-ci.sh \
              --print-failed-test-logs \
              --print-failed-action-summary \
              -- \
              test \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
              --test_arg=--exact \
              --test_arg=suite::managed_proxy::managed_proxy_mode_routes_through_bridge_and_blocks_direct_egress \
              -- \
              //codex-rs/linux-sandbox:linux-sandbox-all-test || focused_status=$?
            ./.github/scripts/run-bazel-ci.sh \
              --print-failed-test-logs \
              --print-failed-action-summary \
              -- \
              test \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --test_output=all \
              --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
              --test_arg=--exact \
              --test_arg=session::tests::isolated_guardian_sessions_skip_agent_mailbox_hooks \
              -- \
              //codex-rs/core:core-unit-tests || focused_status=$?
            ./.github/scripts/run-bazel-ci.sh \
              --print-failed-test-logs \
              --print-failed-action-summary \
              -- \
              test \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --test_output=all \
              --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
              --test_arg=suite::pending_input::input_interrupts_wait_agent_and_is_sent_in_follow_up_request \
              -- \
              //codex-rs/core:core-all-test || focused_status=$?
            ./.github/scripts/run-bazel-ci.sh \
              --print-failed-test-logs \
              --print-failed-action-summary \
              -- \
              test \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --test_output=all \
              --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
              --test_arg=--exact \
              --test_arg=app::tests::session_lifecycle_requests::startup_defaults_tests::fresh_startup_falls_back_only_for_unsupported_config_read \
              -- \
              //codex-rs/tui:tui-unit-tests || focused_status=$?
            snapshot_path=codex-rs/core/tests/suite/snapshots/all__suite__scenarios__frozen_cloud_skills__frozen_cloud_skills_with_named_executor_request_history.snap
            ./.github/scripts/run-bazel-ci.sh \
              -- \
              test \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --test_output=summary \
              --test_env=INSTA_UPDATE=always \
              --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
              --test_arg=--exact \
              --test_arg=suite::scenarios::frozen_cloud_skills::frozen_cloud_skills_with_named_executor_request_history \
              -- \
              //codex-rs/core:core-all-test || focused_status=$?
            if ! git diff --quiet -- "$snapshot_path"; then
              snapshot_artifact_dir="${RUNNER_TEMP}/w14939-normalized-snapshots"
              mkdir -p "$snapshot_artifact_dir"
              cp "$snapshot_path" "$snapshot_artifact_dir/$(basename "$snapshot_path")"
              ./.github/scripts/run-bazel-ci.sh \
                -- \
                test \
                --test_tag_filters=-argument-comment-lint \
                --test_verbose_timeout_warnings \
                --test_output=summary \
                --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
                --test_arg=--exact \
                --test_arg=suite::scenarios::frozen_cloud_skills::frozen_cloud_skills_with_named_executor_request_history \
                -- \
                //codex-rs/core:core-all-test || focused_status=$?
              git restore -- "$snapshot_path"
            fi
            for selector in \
              suite::client::configured_reasoning_summary_is_sent \
              suite::client::history_dedupes_streamed_and_final_messages_across_turns \
              suite::client::sends_audio_urls_to_responses \
              suite::items::plan_mode_strips_plan_from_agent_messages \
              suite::multi_agent_mode::catalog_proactive_mode_is_ultra_only::ultra_uses_proactive_override \
              suite::otel::record_responses_sets_span_fields_for_response_events \
              suite::prompt_caching::prefixes_context_and_instructions_once_and_consistently_across_requests \
              suite::remote_models::remote_models_long_model_slug_is_sent_with_supported_reasoning::custom \
              suite::request_compression::request_body_is_zstd_compressed_for_codex_backend_when_enabled \
              suite::scenarios::mcp_ema::enterprise_lifecycle_preserves_history_and_ordinary_tools::policy; do
              ./.github/scripts/run-bazel-ci.sh \
                --print-failed-test-logs \
                --print-failed-action-summary \
                -- \
                test \
                --test_tag_filters=-argument-comment-lint \
                --test_verbose_timeout_warnings \
                --test_output=all \
                --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
                --test_arg=--exact \
                --test_arg="${selector}" \
                -- \
                //codex-rs/core:core-all-test || focused_status=$?
            done
            ./.github/scripts/run-bazel-ci.sh \
              --print-failed-test-logs \
              --print-failed-action-summary \
              -- \
              test \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --test_output=all \
              --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
              --test_arg=multi_agent_v2_interrupted_native_work_settles_before_followup_all_join \
              -- \
              //codex-rs/core:core-unit-tests || focused_status=$?
            ./.github/scripts/run-bazel-ci.sh \
              --print-failed-test-logs \
              --print-failed-action-summary \
              -- \
              test \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --test_output=all \
              --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
              --test_arg=client_owned_mode_snapshot \
              -- \
              //codex-rs/core:core-unit-tests || focused_status=$?
            ./.github/scripts/run-bazel-ci.sh \
              --print-failed-test-logs \
              --print-failed-action-summary \
              -- \
              test \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --test_output=all \
              --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
              -- \
              //codex-rs/ext/mcp:mcp-unit-tests || focused_status=$?
            ./.github/scripts/run-bazel-ci.sh \
              --print-failed-test-logs \
              --print-failed-action-summary \
              -- \
              test \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --test_output=all \
              --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
              -- \
              //codex-rs/memories/write:write-unit-tests || focused_status=$?
            ./.github/scripts/run-bazel-ci.sh \
              --print-failed-test-logs \
              --print-failed-action-summary \
              -- \
              test \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --test_output=all \
              --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
              --test_arg=--exact \
              --test_arg=suite::v2::guardian_v2::guardian_v2_propagates_root_user_input_to_worker_reviews::root_answer_survives_parent_compaction \
              -- \
              //codex-rs/app-server:app-server-all-test || focused_status=$?
            exit "${focused_status}"
          fi
          ./.github/scripts/run-bazel-ci.sh \
            "${bazel_wrapper_args[@]}" \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/bazel-execution-logs
            ${{ runner.temp }}/w14939-normalized-snapshots
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-windows-shard:
    # Split the Windows Bazel test leg across separate Windows hosts. Jobs with
    # trusted BuildBuddy credentials use Linux RBE for build actions; test
    # execution remains on a Windows runner.
    if: ${{ github.repository != 'sednalabs/codex' && (github.event_name != 'workflow_dispatch' || !inputs.w14939_focused_tests) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    runs-on: windows-2022
    name: Bazel test on windows-latest for x86_64-pc-windows-gnullvm shard ${{ matrix.shard }}/4
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: "1"
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test BuildBuddy Bazel wrapper
        if: matrix.shard == 1
        shell: pwsh
        run: python .github/scripts/test_run_bazel_with_buildbuddy.py

      - name: Test Windows Bazel target selector
        if: matrix.shard == 1
        shell: pwsh
        run: python -m unittest discover -s .github/scripts -p test_select_windows_bazel_targets.py

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          # Reuse the former monolithic Windows test cache for restores. Do
          # not save it from every shard below; duplicate uploads would sit on
          # the PR-blocking critical path after the useful test work is done.
          cache-scope: bazel-test

      - name: bazel test shard
        env:
          BAZEL_TEST_SHARD: ${{ matrix.shard }}
          BAZEL_TEST_SHARD_COUNT: 4
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          bazel_test_query='tests(//...) except tests(//third_party/v8:all) except attr(tags, "manual", tests(//...))'
          bazel_targets_file="$(mktemp)"
          selected_targets_file="$(mktemp)"
          trap 'rm -f "${bazel_targets_file}" "${selected_targets_file}"' EXIT

          # Keep query and selection in the foreground so failures cannot leave
          # different jobs assigning different partial target lists.
          ./.github/scripts/run-bazel-query-ci.sh --output=label -- "${bazel_test_query}" \
            | LC_ALL=C sort > "${bazel_targets_file}"
          python .github/scripts/select_windows_bazel_targets.py \
            --shard "${BAZEL_TEST_SHARD}" \
            --shard-count "${BAZEL_TEST_SHARD_COUNT}" \
            < "${bazel_targets_file}" > "${selected_targets_file}"
          mapfile -t selected_targets < "${selected_targets_file}"

          bazel_test_args=(
            test
            --skip_incompatible_explicit_targets
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_windows_test_shard=${BAZEL_TEST_SHARD}
          )

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-cross-compile \
            --remote-download-toplevel \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${selected_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-x86_64-pc-windows-gnullvm-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-windows:
    # Preserve the existing required-check surface while the real work happens
    # in the sharded Windows jobs above.
    if: always() && (github.event_name != 'workflow_dispatch' || !inputs.w14939_focused_tests)
    needs: test-windows-shard
    runs-on: ubuntu-24.04
    name: ${{ github.repository == 'sednalabs/codex' && 'Windows Bazel CI deferred (unqualified)' || 'Bazel test on windows-latest for x86_64-pc-windows-gnullvm' }}

    steps:
      - name: Report Windows CI deferral for this fork
        if: github.repository == 'sednalabs/codex'
        shell: bash
        run: echo 'Windows Bazel tests are deferred and unqualified for sednalabs/codex.' >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm Windows Bazel test shards passed
        if: github.repository != 'sednalabs/codex'
        shell: bash
        run: |
          if [[ "${{ needs.test-windows-shard.result }}" != "success" ]]; then
            echo "Windows Bazel test shards finished with result: ${{ needs.test-windows-shard.result }}" >&2
            exit 1
          fi

  test-windows-native-main:
    # Native Windows Bazel tests are slower and frequently approach the
    # 30-minute PR budget. Run this only for post-merge commits to main and give
    # it a larger timeout. Also allow manual runs for native toolchain changes.
    if: >-
      github.repository != 'sednalabs/codex' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && !inputs.w14939_focused_tests)
      )
    timeout-minutes: 40
    runs-on: windows-2022
    name: Bazel test on windows-latest for x86_64-pc-windows-msvc (native main)
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-${{ github.job }}

      - name: bazel test //...
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_targets=(
            //...
            # Keep standalone V8 library targets out of the ordinary Bazel CI
            # path. V8 consumers under `//codex-rs/...` still participate
            # transitively through `//...`.
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )

          bazel_test_args=(
            test
            --config=ci-windows-msvc
            --platforms=//:windows_x86_64_msvc
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_windows_native_main=true
          )

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-windows-native-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
