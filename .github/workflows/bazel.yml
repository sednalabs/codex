name: Native daemon fallback contract (validation host)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact native candidate commit to validate
        required: true
        type: string
      expected_workflow_host_sha:
        description: Exact commit containing this validation workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-830-daemon-contract-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  focused-daemon:
    name: TUI daemon fallback contract on musl
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILDBUDDY_API_KEY: ''
    steps:
      - name: Verify fixed validation-host identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          expected_ref='validation/host-830-daemon-contract-52b89d58'
          if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch ||
                "${GITHUB_REPOSITORY}" != sednalabs/codex ||
                "${GITHUB_REF_NAME}" != "${expected_ref}" ||
                "${GITHUB_SHA}" != "${EXPECTED_HOST_SHA}" ]]; then
            echo 'Dispatch does not match the fixed host ref and requested host SHA.' >&2
            exit 1
          fi

      - name: Check out exact native candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source, host-parent, base, and target identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          expected_source_sha='52b89d582160437cf3de0f2ff47df46565358b93'
          expected_source_tree='f3568b204b57df572d3d8cf96a715fcc1260c04c'
          expected_source_parent='988269a4f1fc7da83a64f85b8a73691bae71241f'
          expected_source_ref='validation/native-830-daemon-contract-52b89d58'
          expected_host_ref='validation/host-830-daemon-contract-52b89d58'
          expected_main_base='7ed71c6d59fc28e37e222adb7449e05e31ea10cd'
          expected_native_base='83086188ae0614bd882818ff1aa23f3194962012'

          [[ "${SOURCE_SHA}" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD)" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "${expected_source_tree}" ]]
          [[ "$(git rev-parse HEAD^)" == "${expected_source_parent}" ]]
          git cat-file -e "${EXPECTED_HOST_SHA}^{commit}"
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}^")" == "${expected_source_sha}" ]]
          git merge-base --is-ancestor "${expected_main_base}" "${expected_source_sha}"
          git merge-base --is-ancestor "${expected_native_base}" "${expected_source_sha}"
          git show-ref --verify --quiet "refs/remotes/origin/${expected_source_ref}"
          [[ "$(git rev-parse "refs/remotes/origin/${expected_source_ref}")" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}")" == "${GITHUB_SHA}" ]]
          [[ "${GITHUB_REF_NAME}" == "${expected_host_ref}" ]]

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-musl
          cache-scope: native-830-daemon-contract-${{ inputs.source_sha }}

      - name: Run exact daemon fallback selector
        id: run_selector
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          unset BUILDBUDDY_API_KEY
          HOST_TREE="$(git rev-parse "${HOST_SHA}^{tree}")"
          HOST_WORKFLOW_BLOB="$(git rev-parse "${HOST_SHA}:.github/workflows/bazel.yml")"
          selector='daemon_startup_tests::daemon_feature_compatibility_respects_required_and_optional_attachment'
          target='//codex-rs/tui:tui-unit-tests'
          log="${RUNNER_TEMP}/daemon-fallback-selector.log"

          set +e
          ./.github/scripts/run-bazel-ci.sh \
            -- \
            test \
            --test_sharding_strategy=disabled \
            --nocache_test_results \
            --test_output=all \
            --test_arg=--exact \
            "--test_arg=${selector}" \
            -- \
            "${target}" 2>&1 | tee "${log}" >/dev/null
          statuses=("${PIPESTATUS[@]}")
          set -e

          source_worktree_clean=1
          if [[ -n "$(git status --porcelain)" ]]; then
            source_worktree_clean=0
          fi

          receipt="${RUNNER_TEMP}/daemon-fallback-selector-receipt.json"
          python3 - "${receipt}" "${HOST_SHA}" "${HOST_TREE}" "${HOST_WORKFLOW_BLOB}" \
            "${SOURCE_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" \
            "${source_worktree_clean}" "${statuses[0]}" "${statuses[1]}" \
            "${selector}" "${target}" "${log}" <<'PY'
          import json
          import re
          import sys

          (
              path,
              host_sha,
              host_tree,
              host_workflow_blob,
              source_sha,
              run_id,
              run_attempt,
              source_clean,
              bazel_exit_text,
              tee_exit_text,
              selector,
              target,
              log_path,
          ) = sys.argv[1:]
          source_tree = "f3568b204b57df572d3d8cf96a715fcc1260c04c"
          source_parent = "988269a4f1fc7da83a64f85b8a73691bae71241f"
          host_parent = "52b89d582160437cf3de0f2ff47df46565358b93"
          pr_base = "7ed71c6d59fc28e37e222adb7449e05e31ea10cd"
          native_base = "83086188ae0614bd882818ff1aa23f3194962012"
          bazel_exit = int(bazel_exit_text)
          tee_exit = int(tee_exit_text)
          source_worktree_clean = source_clean == "1"
          exact_result = re.compile(rf"^test {re.escape(selector)} \.\.\. (ok|FAILED)$")
          summary_pattern = re.compile(
              r"^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;"
          )
          exact_ok_line_count = 0
          exact_failed_line_count = 0
          summaries = []
          skip_marker_seen = False
          with open(log_path, encoding="utf-8", errors="replace") as log_file:
              for raw_line in log_file:
                  line = raw_line.rstrip("\r\n")
                  result_match = exact_result.fullmatch(line)
                  if result_match:
                      if result_match.group(1) == "ok":
                          exact_ok_line_count += 1
                      else:
                          exact_failed_line_count += 1
                  summary_match = summary_pattern.match(line)
                  if summary_match:
                      summaries.append(
                          {
                              "result": summary_match.group(1),
                              "passed": int(summary_match.group(2)),
                              "failed": int(summary_match.group(3)),
                              "ignored": int(summary_match.group(4)),
                          }
                      )
                  if "Skipping test because it cannot execute when network is disabled in a Codex sandbox." in line:
                      skip_marker_seen = True

          strict_pass = (
              bazel_exit == 0
              and tee_exit == 0
              and exact_ok_line_count == 1
              and exact_failed_line_count == 0
              and len(summaries) == 1
              and summaries[0] == {"result": "ok", "passed": 1, "failed": 0, "ignored": 0}
              and not skip_marker_seen
              and source_worktree_clean
          )
          if strict_pass:
              status = "executed-pass"
              failure_category = None
          elif exact_failed_line_count:
              status = "observed-failure"
              failure_category = "executed_test_failure_observed"
          elif skip_marker_seen:
              status = "environment-guard-skip"
              failure_category = "environment_guard_skip"
          elif exact_ok_line_count + exact_failed_line_count > 1 or len(summaries) > 1:
              status = "multiple-observations"
              failure_category = "multiple_observations"
          elif exact_ok_line_count + exact_failed_line_count == 0 and bazel_exit != 0:
              status = "not-observed"
              failure_category = "build_or_harness_failure"
          else:
              status = "unreconciled"
              failure_category = "summary_unreconciled"

          receipt_data = {
              "host_sha": host_sha,
              "host_tree": host_tree,
              "host_workflow_blob": host_workflow_blob,
              "host_parent": host_parent,
              "source_sha": source_sha,
              "source_tree": source_tree,
              "source_parent": source_parent,
              "pr_base_sha": pr_base,
              "native_base_sha": native_base,
              "run_id": run_id,
              "run_attempt": int(run_attempt),
              "execution_mode": "standard-hosted-ubuntu24-local-musl",
              "target": target,
              "selector": selector,
              "bazel_exit": bazel_exit,
              "tee_exit": tee_exit,
              "source_worktree_clean": source_worktree_clean,
              "exact_ok_line_count": exact_ok_line_count,
              "exact_failed_line_count": exact_failed_line_count,
              "summary_count": len(summaries),
              "summaries": summaries,
              "skip_marker_seen": skip_marker_seen,
              "status": status,
              "failure_category": failure_category,
          }
          with open(path, "w", encoding="utf-8") as receipt_file:
              json.dump(receipt_data, receipt_file, separators=(",", ":"))
          print(json.dumps(receipt_data, separators=(",", ":")))
          if not strict_pass:
              raise SystemExit(1)
          PY

      - name: Upload compact selector receipt
        if: always() && !cancelled() && steps.run_selector.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-daemon-contract-receipt-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daemon-fallback-selector-receipt.json
          if-no-files-found: error
