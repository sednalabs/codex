name: macOS Intel doctor selector (validation host)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact native source commit to validate
        required: true
        type: string
      expected_workflow_host_sha:
        description: Exact commit containing this validation workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-830-macos-doctor-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  macos-intel-doctor:
    name: macOS 15 Intel doctor path-safety selector
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      BUILDBUDDY_API_KEY: ''
    steps:
      - name: Verify fixed validation-host identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          expected_ref='validation/host-830-doctor-05481e58'
          if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch ||
                "${GITHUB_REPOSITORY}" != sednalabs/codex ||
                "${GITHUB_REF_NAME}" != "${expected_ref}" ||
                "${GITHUB_SHA}" != "${EXPECTED_HOST_SHA}" ||
                "${RUNNER_OS}" != macOS ||
                "${RUNNER_ARCH}" != X64 ]]; then
            echo 'Dispatch does not match the fixed macOS Intel validation host.' >&2
            exit 1
          fi

      - name: Check out exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source, host-parent, and base identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          expected_source_sha='05481e58a3852615cff72180d5643c802c09b6b6'
          expected_source_tree='ec42569f3c017e0b040eabf3128f59f61671475d'
          expected_source_parent='6114b8f9a2467413cf18b30f2ee43097edf87727'
          expected_source_ref='validation/native-830-doctor-05481e58'
          expected_host_ref='validation/host-830-doctor-05481e58'
          expected_current_main_base='f53268d170818054547ac19197223c220a75be1a'
          native_830_ancestor='83086188ae0614bd882818ff1aa23f3194962012'

          [[ "${SOURCE_SHA}" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD)" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "${expected_source_tree}" ]]
          [[ "$(git rev-parse HEAD^)" == "${expected_source_parent}" ]]
          git cat-file -e "${EXPECTED_HOST_SHA}^{commit}"
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}^")" == "${expected_source_sha}" ]]
          git merge-base --is-ancestor "${expected_current_main_base}" "${expected_source_sha}"
          git merge-base --is-ancestor "${native_830_ancestor}" "${expected_source_sha}"
          git show-ref --verify --quiet "refs/remotes/origin/${expected_source_ref}"
          [[ "$(git rev-parse "refs/remotes/origin/${expected_source_ref}")" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}")" == "${GITHUB_SHA}" ]]
          [[ "${GITHUB_REF_NAME}" == "${expected_host_ref}" ]]

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-apple-darwin
          cache-scope: native-830-macos-doctor-${{ inputs.source_sha }}

      - name: Run exact macOS Intel doctor selector
        id: run_selector
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          unset BUILDBUDDY_API_KEY
          umask 077

          selector='interactive_tmux_startup_does_not_execute_workspace_helpers'
          target='//codex-rs/cli:cli-doctor_path_safety-test'
          log="${RUNNER_TEMP}/native-macos-doctor-selector.log"
          outcomes="${RUNNER_TEMP}/native-macos-doctor-selector.tsv"
          : > "${outcomes}"

          set +e
          ./.github/scripts/run-bazel-ci.sh -- \
            test \
            --test_sharding_strategy=disabled \
            --nocache_test_results \
            --test_output=all \
            --test_arg=--exact \
            "--test_arg=${selector}" \
            -- \
            "${target}" 2>&1 | tee "${log}" >/dev/null
          statuses=("${PIPESTATUS[@]}")
          set -e
          exact_ok="$(grep -Fxc "test ${selector} ... ok" "${log}" || true)"
          exact_failed="$(grep -Fxc "test ${selector} ... FAILED" "${log}" || true)"
          summary_line="$(grep -E '^test result: (ok|FAILED)\. [0-9]+ passed; [0-9]+ failed; [0-9]+ ignored;' "${log}" | tail -n 1 || true)"
          passed_count='null'
          failed_count='null'
          ignored_count='null'
          summary_ok=0
          if [[ -n "${summary_line}" ]]; then
            passed_count="$(sed -E 's/^test result: (ok|FAILED)\. ([0-9]+) passed;.*/\2/' <<< "${summary_line}")"
            failed_count="$(sed -E 's/^test result: (ok|FAILED)\. [0-9]+ passed; ([0-9]+) failed;.*/\2/' <<< "${summary_line}")"
            ignored_count="$(sed -E 's/^test result: (ok|FAILED)\. [0-9]+ passed; [0-9]+ failed; ([0-9]+) ignored;.*/\2/' <<< "${summary_line}")"
            summary_ok=1
          fi
          exact_test_observed=0
          if [[ "${exact_ok}" != 0 || "${exact_failed}" != 0 ]]; then
            exact_test_observed=1
          fi

          selector_status='failed/unreconciled'
          if [[ "${statuses[0]}" -eq 0 &&
                "${statuses[1]}" -eq 0 &&
                "${exact_ok}" -eq 1 &&
                "${exact_failed}" -eq 0 &&
                "${summary_ok}" -eq 1 &&
                "${passed_count}" -eq 1 &&
                "${failed_count}" -eq 0 &&
                "${ignored_count}" -eq 0 ]]; then
            selector_status='executed-pass'
          fi

          failure_stage='null'
          if [[ "${selector_status}" != 'executed-pass' ]]; then
            matched_stages=()
            if grep -Fq -- 'TUI exited before trust prompt' "${log}"; then
              matched_stages+=('exit-before-prompt')
            fi
            if grep -Fq -- 'trust prompt timed out:' "${log}"; then
              matched_stages+=('trust-prompt-timeout')
            fi
            if grep -Fq -- 'TUI did not exit after declining directory trust:' "${log}"; then
              matched_stages+=('refusal-exit-timeout')
            fi
            if grep -Fq -- 'expected safe Ghostty/tmux keyboard flags:' "${log}"; then
              matched_stages+=('keyboard-assertion')
            fi
            if grep -Fq -- 'interactive startup executed a workspace helper' "${log}"; then
              matched_stages+=('workspace-helper-assertion')
            fi
            if [[ "${#matched_stages[@]}" -eq 1 ]]; then
              failure_stage="${matched_stages[0]}"
            else
              failure_stage='unknown'
            fi
          fi

          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "${target}" "${selector}" "${statuses[0]}" "${statuses[1]}" \
            "${selector_status}" "${exact_test_observed}" \
            "${passed_count}" "${failed_count}" "${ignored_count}" \
            "${failure_stage}" >> "${outcomes}"

          source_worktree_clean=1
          if [[ -n "$(git status --porcelain)" ]]; then
            source_worktree_clean=0
          fi

          receipt="${RUNNER_TEMP}/native-macos-doctor-selector-receipt.json"
          python3 - "${receipt}" "${outcomes}" "${HOST_SHA}" "${SOURCE_SHA}" \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${RUNNER_OS}" "${RUNNER_ARCH}" \
            "${source_worktree_clean}" <<'PY'
          import json
          import sys

          (
              receipt_path,
              outcomes_path,
              host_sha,
              source_sha,
              run_id,
              run_attempt,
              runner_os,
              runner_arch,
              source_clean,
          ) = sys.argv[1:]

          selectors = []
          with open(outcomes_path, encoding="utf-8") as outcomes_file:
              for line in outcomes_file:
                  (
                      target,
                      name,
                      bazel_exit,
                      tee_exit,
                      status,
                      exact_test_observed,
                      passed,
                      failed,
                      ignored,
                      failure_stage,
                  ) = line.rstrip("\n").split("\t")
                  selectors.append(
                      {
                          "target": target,
                          "name": name,
                          "bazel_exit": int(bazel_exit),
                          "tee_exit": int(tee_exit),
                          "status": status,
                          "exact_test_observed": exact_test_observed == "1",
                          "passed": None if passed == "null" else int(passed),
                          "failed": None if failed == "null" else int(failed),
                          "ignored": None if ignored == "null" else int(ignored),
                          "failure_stage": None if failure_stage == "null" else failure_stage,
                      }
                  )

          if len(selectors) != 1:
              raise SystemExit(f"expected 1 selector outcome, found {len(selectors)}")
          source_worktree_clean = source_clean == "1"
          all_passed = all(row["status"] == "executed-pass" for row in selectors)
          receipt = {
              "schema_version": 1,
              "workflow_host_ref": "validation/host-830-doctor-05481e58",
              "workflow_host_sha": host_sha,
              "validation_target_ref": "validation/native-830-doctor-05481e58",
              "source_sha": source_sha,
              "source_tree": "ec42569f3c017e0b040eabf3128f59f61671475d",
              "source_parent": "6114b8f9a2467413cf18b30f2ee43097edf87727",
              "base_sha": "f53268d170818054547ac19197223c220a75be1a",
              "native_830_ancestor_sha": "83086188ae0614bd882818ff1aa23f3194962012",
              "run_id": run_id,
              "run_attempt": run_attempt,
              "runner_os": runner_os,
              "runner_arch": runner_arch,
              "mode": "standard-hosted-macos15-intel-local-bazel",
              "target_platform": "x86_64-apple-darwin",
              "source_worktree_clean": source_worktree_clean,
              "selectors": selectors,
              "overall_status": "passed" if all_passed and source_worktree_clean else "failed",
          }
          with open(receipt_path, "w", encoding="utf-8") as receipt_file:
              json.dump(receipt, receipt_file, separators=(",", ":"))
          print(json.dumps(receipt, separators=(",", ":")))
          if receipt["overall_status"] != "passed":
              raise SystemExit(1)
          PY

      - name: Upload compact selector receipt
        if: always() && !cancelled() && steps.run_selector.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-macos-doctor-selector-receipt-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-macos-doctor-selector-receipt.json
          if-no-files-found: error
