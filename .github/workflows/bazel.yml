name: Bazel

# Note this workflow was originally derived from:
# https://github.com/cerisier/toolchains_llvm_bootstrapped/blob/main/.github/workflows/ci.yaml

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan Bazel CI mode
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      run_bazel: ${{ steps.resolve.outputs.run_bazel }}
    steps:
      # Use GitHub's exact comparison API rather than a checkout-based diff.
      # The response supplies at most 300 files, so any result that might be
      # truncated is deliberately treated as incomplete and runs full CI.
      - name: Compare exact changed files
        id: compare
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const full = (reason) => {
              core.warning(`Bazel CI will run in full mode: ${reason}`);
              core.setOutput("comparison_complete", "false");
              core.setOutput("files_json", "[]");
            };

            const isPullRequest = context.eventName === "pull_request";
            const base = isPullRequest
              ? context.payload.pull_request?.base?.sha
              : context.payload.merge_group?.base_sha;
            const expectedHead = isPullRequest
              ? context.payload.pull_request?.head?.sha
              : context.sha;
            if (!base || !expectedHead) {
              full("the event did not provide exact base and head SHAs");
              return;
            }

            try {
              const { data } = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${base}...${expectedHead}`,
                per_page: 100,
              });
              const commits = Array.isArray(data.commits) ? data.commits : [];
              const completeCommitList =
                Number(data.ahead_by) === commits.length &&
                Number(data.total_commits) === commits.length;
              const returnedHead = commits.at(-1)?.sha;
              if (
                !completeCommitList ||
                !returnedHead ||
                returnedHead.toLowerCase() !== expectedHead.toLowerCase()
              ) {
                full("the comparison response did not prove the expected complete head");
                return;
              }

              const files = data.files;
              if (!Array.isArray(files) || files.length === 0 || files.length >= 300) {
                full("the changed-file response was empty or may have been truncated");
                return;
              }

              const names = [];
              for (const file of files) {
                if (!file || typeof file.filename !== "string") {
                  full("the changed-file response contained a malformed filename");
                  return;
                }
                names.push(file.filename);
                if (file.previous_filename !== undefined) {
                  if (typeof file.previous_filename !== "string") {
                    full("the changed-file response contained a malformed previous filename");
                    return;
                  }
                  names.push(file.previous_filename);
                }
              }

              core.setOutput("comparison_complete", "true");
              core.setOutput("files_json", JSON.stringify(names));
            } catch (error) {
              full(`the compare API failed: ${error.message}`);
            }

      - name: Default non-comparison events to full Bazel CI
        id: default_to_full
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        shell: bash
        run: |
          echo "comparison_complete=false" >> "${GITHUB_OUTPUT}"
          echo "files_json=[]" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve Bazel CI mode
        id: resolve
        shell: bash
        env:
          COMPARISON_COMPLETE: ${{ steps.compare.outputs.comparison_complete || steps.default_to_full.outputs.comparison_complete }}
          FILES_JSON: ${{ steps.compare.outputs.files_json || steps.default_to_full.outputs.files_json }}
        run: |
          python3 .github/scripts/resolve_bazel_ci_mode.py \
            --comparison-complete "${COMPARISON_COMPLETE}" \
            --files-json "${FILES_JSON}" \
            --github-output "${GITHUB_OUTPUT}"

  docs-only:
    name: Check docs-only changes
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'docs_only' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check markdown links
        shell: bash
        run: python3 .github/scripts/check_markdown_links.py

  test:
    # PRs use the sharded Windows cross-compiled test jobs below. Post-merge
    # pushes to main also run the native Windows test job for broader Windows
    # signal without putting PR latency back on the critical path. When
    # Code-mode unit tests run on every Bazel target. When authenticated RBE
    # is available, the Windows-cross shards exercise the source-built V8 path.
    # macOS runners keep test actions local; full-tree PR validation can exceed
    # the default window while build actions execute remotely.
    needs: plan
    if: ${{ needs.plan.outputs.run_bazel == 'true' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin

          # Linux
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          # 2026-02-27 Bazel tests have been flaky on arm in CI.
          # Disable until we can investigate and stabilize them.
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-musl
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Bazel test on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}

      - name: Check rusty_v8 MODULE.bazel checksums
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          python3 .github/scripts/rusty_v8_bazel.py check-module-bazel
          just test-github-scripts

      - name: Check MODULE.bazel.lock is up to date
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: ./scripts/check-module-bazel-lock.sh

      - name: bazel test //...
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_targets=(
            //...
            # Keep standalone V8 library targets out of the ordinary Bazel CI
            # path. V8 consumers under `//codex-rs/...` still participate
            # transitively through `//...`.
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )

          bazel_wrapper_args=(
            --print-failed-action-summary
            --print-failed-test-logs
          )
          bazel_test_args=(
            test
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
          )
          ./.github/scripts/run-bazel-ci.sh \
            "${bazel_wrapper_args[@]}" \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true' && steps.prepare_bazel.outputs.repository-cache-write-enabled == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-windows-shard:
    # Split the Windows Bazel test leg across separate Windows hosts. Jobs with
    # BuildBuddy credentials use Linux RBE for build actions; test execution
    # remains on a Windows runner.
    needs: plan
    if: ${{ needs.plan.outputs.run_bazel == 'true' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    runs-on: windows-2022
    name: Bazel test on windows-latest for x86_64-pc-windows-gnullvm shard ${{ matrix.shard }}/4
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Test BuildBuddy Bazel wrapper
        if: matrix.shard == 1
        shell: pwsh
        run: python .github/scripts/test_run_bazel_with_buildbuddy.py

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          # Reuse the former monolithic Windows test cache for restores. Do
          # not save it from every shard below; duplicate uploads would sit on
          # the PR-blocking critical path after the useful test work is done.
          cache-scope: bazel-test

      - name: bazel test shard
        env:
          BAZEL_TEST_SHARD: ${{ matrix.shard }}
          BAZEL_TEST_SHARD_COUNT: 4
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          bazel_test_query='tests(//...) except tests(//third_party/v8:all) except attr(tags, "manual", tests(//...))'
          mapfile -t bazel_targets < <(
            ./.github/scripts/run-bazel-query-ci.sh --output=label -- "${bazel_test_query}" \
              | LC_ALL=C sort
          )

          selected_targets=()
          for bazel_target in "${bazel_targets[@]}"; do
            target_bucket="$(
              printf '%s\n' "${bazel_target}" \
                | cksum \
                | awk -v shard_count="${BAZEL_TEST_SHARD_COUNT}" '{ print ($1 % shard_count) + 1 }'
            )"
            if [[ "${target_bucket}" == "${BAZEL_TEST_SHARD}" ]]; then
              selected_targets+=("${bazel_target}")
            fi
          done

          if [[ ${#selected_targets[@]} -eq 0 ]]; then
            echo "No Bazel test targets selected for Windows shard ${BAZEL_TEST_SHARD}/${BAZEL_TEST_SHARD_COUNT}." >&2
            exit 1
          fi

          echo "Selected ${#selected_targets[@]} of ${#bazel_targets[@]} Bazel test targets for Windows shard ${BAZEL_TEST_SHARD}/${BAZEL_TEST_SHARD_COUNT}."

          bazel_test_args=(
            test
            --skip_incompatible_explicit_targets
            # Windows sandbox identities, ACLs, and firewall rules are
            # host-global; overlapping local test actions can invalidate one
            # another's policy assertions.
            --local_test_jobs=1
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_windows_test_shard=${BAZEL_TEST_SHARD}
          )

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-cross-compile \
            --remote-download-toplevel \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${selected_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-x86_64-pc-windows-gnullvm-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-windows:
    # Preserve the existing required-check surface while the real work happens
    # in the sharded Windows jobs above.
    if: ${{ always() && needs.plan.outputs.run_bazel == 'true' }}
    needs: [plan, test-windows-shard]
    runs-on: ubuntu-24.04
    name: Bazel test on windows-latest for x86_64-pc-windows-gnullvm

    steps:
      - name: Confirm Windows Bazel test shards passed
        shell: bash
        run: |
          if [[ "${{ needs.test-windows-shard.result }}" != "success" ]]; then
            echo "Windows Bazel test shards finished with result: ${{ needs.test-windows-shard.result }}" >&2
            exit 1
          fi

  test-windows-native-main:
    # Native Windows Bazel tests are slower and frequently approach the
    # 30-minute PR budget. Run this for post-merge commits to main or an
    # explicit hosted-validation dispatch, and give it a larger timeout.
    needs: plan
    if: >-
      ${{ needs.plan.outputs.run_bazel == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    timeout-minutes: 40
    runs-on: windows-2022
    name: Bazel test on windows-latest for x86_64-pc-windows-gnullvm (native main)
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          cache-scope: bazel-${{ github.job }}

      - name: bazel test //...
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_targets=(
            //...
            # Keep standalone V8 library targets out of the ordinary Bazel CI
            # path. V8 consumers under `//codex-rs/...` still participate
            # transitively through `//...`.
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )

          bazel_test_args=(
            test
            # The upstream native-main job runs on a stable dedicated runner.
            # Hosted Windows image changes can make cached Rust proc-macro DLLs
            # unloadable even when Bazel fully materializes them. Rebuild only
            # Rust actions locally while retaining remote cache reuse elsewhere.
            --modify_execution_info=Rustc=+no-remote-cache
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_windows_native_main=true
          )

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-windows-native-x86_64-pc-windows-gnullvm
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true' && steps.prepare_bazel.outputs.repository-cache-write-enabled == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  clippy:
    needs: plan
    if: ${{ needs.plan.outputs.run_bazel == 'true' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep Linux lint coverage on x64 and add the arm64 macOS path that
          # the Bazel test job already exercises. Add Windows gnullvm as well
          # so PRs get Bazel-native lint signal on the same Windows toolchain
          # that the Bazel test job uses.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-gnullvm
            runs_on: windows-2022
    runs-on: ${{ matrix.runs_on || matrix.os }}
    name: Bazel clippy on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}

      - name: bazel build --config=clippy lint targets
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_clippy_args=(
            --config=clippy
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_job=clippy
          )
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            # Hosted macOS runners can exhaust the Bazel client thread/process
            # ceiling when inheriting the high remote-execution job count.
            bazel_clippy_args+=(--jobs=96 --loading_phase_threads=8)
          fi
          bazel_wrapper_args=()
          bazel_target_list_args=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # Keep this aligned with the fast Windows Bazel test job: use
            # Linux RBE for clippy build actions while targeting Windows
            # gnullvm. Fork/community PRs without the BuildBuddy secret fall
            # back inside `run-bazel-ci.sh` to the previous local Windows MSVC
            # host-platform shape.
            bazel_wrapper_args+=(--windows-cross-compile)
            bazel_target_list_args+=(--windows-cross-compile)
            if [[ -z "${BUILDBUDDY_API_KEY:-}" ]]; then
              # The fork fallback can see incompatible explicit Windows-cross
              # internal test binaries in the generated target list. Preserve
              # the old local-fallback behavior there.
              bazel_clippy_args+=(--skip_incompatible_explicit_targets)
            fi
          fi

          bazel_target_lines="$(./scripts/list-bazel-clippy-targets.sh "${bazel_target_list_args[@]}")"
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            "${bazel_wrapper_args[@]}" \
            -- \
            build \
            "${bazel_clippy_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-clippy-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true' && steps.prepare_bazel.outputs.repository-cache-write-enabled == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  verify-release-build:
    needs: plan
    if: ${{ needs.plan.outputs.run_bazel == 'true' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-gnullvm
            runs_on: windows-2022
    runs-on: ${{ matrix.runs_on || matrix.os }}
    name: Verify release build on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}

      - name: bazel build verify-release-build targets
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          # This job exists to compile Rust code behind
          # `cfg(not(debug_assertions))` so PR CI catches failures that would
          # otherwise show up only in a release build. We do not need the full
          # optimizer and debug-info work that normally comes with a release
          # build to get that signal, so keep Bazel in `fastbuild` and disable
          # Rust debug assertions explicitly.
          bazel_wrapper_args=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # This is build-only signal, so use the same Linux-RBE
            # cross-compile path as the fast Windows test and clippy jobs.
            # Fork/community PRs without the BuildBuddy secret fall back
            # inside `run-bazel-ci.sh` to the previous local Windows MSVC
            # host-platform shape.
            bazel_wrapper_args+=(--windows-cross-compile)
          fi

          bazel_build_args=(
            --compilation_mode=fastbuild
            --@rules_rust//rust/settings:extra_rustc_flag=-Cdebug-assertions=no
            --@rules_rust//rust/settings:extra_exec_rustc_flag=-Cdebug-assertions=no
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_job=verify-release-build
            --build_metadata=TAG_rust_debug_assertions=off
          )
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            # Hosted macOS runners can exhaust the Bazel client thread/process
            # ceiling when inheriting the high remote-execution job count.
            bazel_build_args+=(--jobs=96 --loading_phase_threads=8)
          fi

          bazel_target_lines="$(bash ./scripts/list-bazel-release-targets.sh)"
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"

          ./.github/scripts/run-bazel-ci.sh \
            "${bazel_wrapper_args[@]}" \
            -- \
            build \
            "${bazel_build_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Verify Bazel builds bwrap
        if: runner.os == 'Linux'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          ./.github/scripts/run-bazel-ci.sh \
            --remote-download-toplevel \
            --print-failed-action-summary \
            -- \
            build \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            --build_metadata=TAG_job=verify-bwrap \
            -- \
            //codex-rs/bwrap:bwrap

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-verify-release-build-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true' && steps.prepare_bazel.outputs.repository-cache-write-enabled == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  results:
    name: Bazel required gate
    needs:
      - plan
      - docs-only
      - test
      - test-windows-shard
      - test-windows
      - test-windows-native-main
      - clippy
      - verify-release-build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected Bazel CI mode
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])

          def require(name, expected):
              actual = (needs.get(name) or {}).get("result")
              if actual != expected:
                  print(f"{name} finished as {actual!r}; expected {expected!r}", file=sys.stderr)
                  raise SystemExit(1)

          require("plan", "success")
          mode = (needs.get("plan") or {}).get("outputs", {}).get("mode")
          normal_jobs = [
              "test",
              "test-windows-shard",
              "test-windows",
              "test-windows-native-main",
              "clippy",
              "verify-release-build",
          ]
          if mode == "docs_only":
              require("docs-only", "success")
              for job in normal_jobs:
                  require(job, "skipped")
          elif mode == "full":
              require("docs-only", "skipped")
              for job in [
                  "test",
                  "test-windows-shard",
                  "test-windows",
                  "clippy",
                  "verify-release-build",
              ]:
                  require(job, "success")
              native_is_expected = os.environ["EVENT_NAME"] == "workflow_dispatch" or (
                  os.environ["EVENT_NAME"] == "push" and os.environ["REF"] == "refs/heads/main"
              )
              require("test-windows-native-main", "success" if native_is_expected else "skipped")
          else:
              print(f"unsupported Bazel CI mode: {mode!r}", file=sys.stderr)
              raise SystemExit(1)
          PY
