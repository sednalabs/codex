name: Native network denial selector (validation host)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact native candidate commit to validate
        required: true
        type: string
      expected_workflow_host_sha:
        description: Exact commit containing this validation workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-830-policy-denial-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  focused-denial:
    name: GNU native network denial contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUILDBUDDY_API_KEY: ''
    steps:
      - name: Verify fixed validation-host identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          expected_ref='validation/host-830-policy-denial-fc001f84'
          if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch ||
                "${GITHUB_REPOSITORY}" != sednalabs/codex ||
                "${GITHUB_REF_NAME}" != "${expected_ref}" ||
                "${GITHUB_SHA}" != "${EXPECTED_HOST_SHA}" ]]; then
            echo 'Dispatch does not match the fixed host ref and requested host SHA.' >&2
            exit 1
          fi

      - name: Check out exact native candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source, host-parent, base, and target identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          expected_source_sha='fc001f843aff842b36e885e43f33b5b59a86ce24'
          expected_source_tree='377d3f49b5beae54ca241626fabf1c68c9bc04b6'
          expected_source_parent='3f3075d8095aec8e04352f478fd3591c15d0ad82'
          expected_source_ref='validation/native-830-policy-denial-fc001f84'
          expected_host_ref='validation/host-830-policy-denial-fc001f84'
          expected_main_base='f53268d170818054547ac19197223c220a75be1a'
          expected_native_base='83086188ae0614bd882818ff1aa23f3194962012'

          [[ "${SOURCE_SHA}" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD)" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "${expected_source_tree}" ]]
          [[ "$(git rev-parse HEAD^)" == "${expected_source_parent}" ]]
          git cat-file -e "${EXPECTED_HOST_SHA}^{commit}"
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}^")" == "${expected_source_sha}" ]]
          git merge-base --is-ancestor "${expected_main_base}" "${expected_source_sha}"
          git merge-base --is-ancestor "${expected_native_base}" "${expected_source_sha}"
          git show-ref --verify --quiet "refs/remotes/origin/${expected_source_ref}"
          [[ "$(git rev-parse "refs/remotes/origin/${expected_source_ref}")" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}")" == "${GITHUB_SHA}" ]]
          [[ "${GITHUB_REF_NAME}" == "${expected_host_ref}" ]]

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: native-830-policy-denial-${{ inputs.source_sha }}

      - name: Run exact network denial contract
        id: run_selector
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          unset BUILDBUDDY_API_KEY

          selector='suite::network_approval::failed_network_policy_amendment_denies_request_and_does_not_approve_host'
          log="${RUNNER_TEMP}/network-denial-selector.log"
          outcomes="${RUNNER_TEMP}/network-denial-selector.tsv"
          : > "${outcomes}"

          set +e
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            -- \
            test \
            --test_sharding_strategy=disabled \
            --nocache_test_results \
            --test_output=all \
            --test_arg=--exact \
            "--test_arg=${selector}" \
            -- \
            //codex-rs/core:core-all-test 2>&1 | tee "${log}" >/dev/null
          statuses=("${PIPESTATUS[@]}")
          set -e

          exact_ok="$(grep -Fxc "test ${selector} ... ok" "${log}" || true)"
          exact_failed="$(grep -Fxc "test ${selector} ... FAILED" "${log}" || true)"
          summary_line="$(grep -E '^test result: (ok|FAILED)\. [0-9]+ passed; [0-9]+ failed; [0-9]+ ignored;' "${log}" | tail -n 1 || true)"
          passed_count='null'
          failed_count='null'
          ignored_count='null'
          summary_ok=0
          if [[ -n "${summary_line}" ]]; then
            passed_count="$(sed -E 's/^test result: (ok|FAILED)\. ([0-9]+) passed;.*/\2/' <<< "${summary_line}")"
            failed_count="$(sed -E 's/^test result: (ok|FAILED)\. [0-9]+ passed; ([0-9]+) failed;.*/\2/' <<< "${summary_line}")"
            ignored_count="$(sed -E 's/^test result: (ok|FAILED)\. [0-9]+ passed; [0-9]+ failed; ([0-9]+) ignored;.*/\2/' <<< "${summary_line}")"
            summary_ok=1
          fi

          network_skip_seen=0
          if grep -Fq 'Skipping test because it cannot execute when network is disabled in a Codex sandbox.' "${log}"; then
            network_skip_seen=1
          fi
          sandbox_skip_seen=0
          if grep -Fq " is set to 'seatbelt', skipping test." "${log}"; then
            sandbox_skip_seen=1
          fi

          exact_test_observed=0
          if [[ "${exact_ok}" != 0 || "${exact_failed}" != 0 ]]; then
            exact_test_observed=1
          fi

          selector_status='failed/unreconciled'
          failure_category='summary_unreconciled'
          if [[ "${exact_failed}" -eq 1 && "${summary_ok}" -eq 1 ]]; then
            failure_category='executed_test_failure'
          elif [[ "${network_skip_seen}" -eq 1 || "${sandbox_skip_seen}" -eq 1 ]]; then
            failure_category='environment_guard_skip'
          elif [[ "${statuses[0]}" -ne 0 && "${exact_test_observed}" -eq 0 ]]; then
            failure_category='build_or_harness_failure'
          fi

          if [[ "${statuses[0]}" -eq 0 &&
                "${statuses[1]}" -eq 0 &&
                "${exact_ok}" -eq 1 &&
                "${exact_failed}" -eq 0 &&
                "${summary_ok}" -eq 1 &&
                "${passed_count}" -eq 1 &&
                "${failed_count}" -eq 0 &&
                "${ignored_count}" -eq 0 &&
                "${network_skip_seen}" -eq 0 &&
                "${sandbox_skip_seen}" -eq 0 ]]; then
            selector_status='executed-pass'
            failure_category='none'
          fi

          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "${selector}" "${statuses[0]}" "${statuses[1]}" \
            "${selector_status}" "${exact_test_observed}" \
            "${passed_count}" "${failed_count}" "${ignored_count}" \
            "${network_skip_seen}" "${sandbox_skip_seen}" "${failure_category}" \
            "${SOURCE_SHA}" >> "${outcomes}"

          source_worktree_clean=1
          if [[ -n "$(git status --porcelain)" ]]; then
            source_worktree_clean=0
          fi

          receipt="${RUNNER_TEMP}/network-denial-selector-receipt.json"
          python3 - "${receipt}" "${outcomes}" "${HOST_SHA}" "${SOURCE_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${source_worktree_clean}" <<'PY'
          import json
          import sys

          path, outcomes_path, host_sha, source_sha, run_id, run_attempt, source_clean = sys.argv[1:]
          rows = []
          with open(outcomes_path, encoding="utf-8") as outcomes_file:
              for line in outcomes_file:
                  (
                      name,
                      bazel_exit,
                      tee_exit,
                      status,
                      exact_test_observed,
                      passed,
                      failed,
                      ignored,
                      network_skip_seen,
                      sandbox_skip_seen,
                      failure_category,
                      recorded_source_sha,
                  ) = line.rstrip("\n").split("\t")
                  rows.append(
                      {
                          "selector": name,
                          "bazel_exit": int(bazel_exit),
                          "tee_exit": int(tee_exit),
                          "status": status,
                          "exact_test_observed": exact_test_observed == "1",
                          "passed": None if passed == "null" else int(passed),
                          "failed": None if failed == "null" else int(failed),
                          "ignored": None if ignored == "null" else int(ignored),
                          "network_skip_marker_seen": network_skip_seen == "1",
                          "sandbox_skip_marker_seen": sandbox_skip_seen == "1",
                          "failure_category": None if failure_category == "none" else failure_category,
                          "source_sha": recorded_source_sha,
                      }
                  )
          if len(rows) != 1:
              raise SystemExit(f"expected 1 selector outcome, found {len(rows)}")
          row = rows[0]
          source_worktree_clean = source_clean == "1"
          passed = (
              row["status"] == "executed-pass"
              and row["passed"] == 1
              and row["failed"] == 0
              and row["ignored"] == 0
              and row["bazel_exit"] == 0
              and row["tee_exit"] == 0
              and row["exact_test_observed"]
              and not row["network_skip_marker_seen"]
              and not row["sandbox_skip_marker_seen"]
              and row["source_sha"] == source_sha
              and source_worktree_clean
          )
          receipt = {
              "host_sha": host_sha,
              "source_sha": source_sha,
              "source_tree": "377d3f49b5beae54ca241626fabf1c68c9bc04b6",
              "source_parent": "3f3075d8095aec8e04352f478fd3591c15d0ad82",
              "pr_base_sha": "f53268d170818054547ac19197223c220a75be1a",
              "native_base_sha": "83086188ae0614bd882818ff1aa23f3194962012",
              "run_id": run_id,
              "run_attempt": int(run_attempt),
              "execution_mode": "standard-hosted-ubuntu24-local-gnu",
              "target": "//codex-rs/core:core-all-test",
              "source_worktree_clean": source_worktree_clean,
              "selector_result": row,
              "overall_status": "passed" if passed else "failed",
          }
          with open(path, "w", encoding="utf-8") as receipt_file:
              json.dump(receipt, receipt_file, separators=(",", ":"))
          print(json.dumps(receipt, separators=(",", ":")))
          if not passed:
              raise SystemExit(1)
          PY

      - name: Upload compact selector receipt
        if: always() && !cancelled() && steps.run_selector.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-network-denial-receipt-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-denial-selector-receipt.json
          if-no-files-found: error
