name: macOS browser and daemon selectors (validation host)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source candidate commit to validate
        required: true
        type: string
      expected_workflow_host_sha:
        description: Exact commit containing this validation workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-830-macos-selectors-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  macos-selectors:
    name: macOS 15 ARM64 Browser and daemon selectors
    runs-on: macos-15
    timeout-minutes: 180
    env:
      BUILDBUDDY_API_KEY: ''
    steps:
      - name: Verify fixed validation-host identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          expected_ref='validation/host-830-macos-daemon-febe3a38'
          if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch ||
                "${GITHUB_REPOSITORY}" != sednalabs/codex ||
                "${GITHUB_REF_NAME}" != "${expected_ref}" ||
                "${GITHUB_SHA}" != "${EXPECTED_HOST_SHA}" ||
                "${RUNNER_OS}" != macOS ||
                "${RUNNER_ARCH}" != ARM64 ]]; then
            echo 'Dispatch does not match the fixed macOS validation host.' >&2
            exit 1
          fi

      - name: Check out exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source, host-parent, and base identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          expected_source_sha='febe3a38e0b0fa23959066a76508e6f70af64470'
          expected_source_tree='c900106fa4f09e497accb721a8b2a91a54b787df'
          expected_source_parent='abcee2cb1f096c77af844c1be18ca8ddd5f9edd3'
          expected_source_ref='validation/native-830-macos-daemon-febe3a38'
          expected_host_ref='validation/host-830-macos-daemon-febe3a38'
          expected_base='316c9459fee2343643ae555817e80cce81906675'

          [[ "${SOURCE_SHA}" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD)" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "${expected_source_tree}" ]]
          [[ "$(git rev-parse HEAD^)" == "${expected_source_parent}" ]]
          git cat-file -e "${EXPECTED_HOST_SHA}^{commit}"
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}^")" == "${expected_source_sha}" ]]
          git merge-base --is-ancestor "${expected_base}" "${expected_source_sha}"
          git show-ref --verify --quiet "refs/remotes/origin/${expected_source_ref}"
          [[ "$(git rev-parse "refs/remotes/origin/${expected_source_ref}")" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}")" == "${GITHUB_SHA}" ]]
          [[ "${GITHUB_REF_NAME}" == "${expected_host_ref}" ]]

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: aarch64-apple-darwin
          cache-scope: native-830-macos-selectors-${{ inputs.source_sha }}

      - name: Run exact macOS selectors locally
        id: run_selectors
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          unset BUILDBUDDY_API_KEY

          selectors=(
            'tests::closing_thread_cancels_in_flight_browser_action_without_replay'
            'tests::cancelled_browser_action_closes_before_same_profile_retry'
            'tests::cancelled_pending_launch_closes_late_context_before_retry'
            'tests::unconfirmed_browser_cleanup_retains_lock_and_rejects_retry'
            'tests::playwright_provider_keeps_thread_state_and_returns_typed_image'
            'discovered_managed_daemon_can_restart_with_auto_start_disabled'
          )
          targets=(
            '//codex-rs/browser-computer-use:browser-computer-use-unit-tests'
            '//codex-rs/browser-computer-use:browser-computer-use-unit-tests'
            '//codex-rs/browser-computer-use:browser-computer-use-unit-tests'
            '//codex-rs/browser-computer-use:browser-computer-use-unit-tests'
            '//codex-rs/browser-computer-use:browser-computer-use-unit-tests'
            '//codex-rs/cli:cli-daemon_startup-test'
          )
          logs_dir="${RUNNER_TEMP}/native-macos-selector-logs"
          outcomes="${RUNNER_TEMP}/native-macos-selector-outcomes.tsv"
          mkdir -p "${logs_dir}"
          : > "${outcomes}"

          for index in "${!selectors[@]}"; do
            selector="${selectors[$index]}"
            target="${targets[$index]}"
            log="${logs_dir}/selector-${index}.log"

            set +e
            ./.github/scripts/run-bazel-ci.sh -- \
              test \
              --test_sharding_strategy=disabled \
              --nocache_test_results \
              --test_output=all \
              --test_arg=--exact \
              "--test_arg=${selector}" \
              -- \
              "${target}" 2>&1 | tee "${log}"
            statuses=("${PIPESTATUS[@]}")
            set -e
            exact_ok="$(grep -Fxc "test ${selector} ... ok" "${log}" || true)"
            exact_failed="$(grep -Fxc "test ${selector} ... FAILED" "${log}" || true)"
            summary_line="$(grep -E '^test result: (ok|FAILED)\. [0-9]+ passed; [0-9]+ failed; [0-9]+ ignored;' "${log}" | tail -n 1 || true)"
            passed_count='null'
            failed_count='null'
            ignored_count='null'
            summary_ok=0
            if [[ -n "${summary_line}" ]]; then
              passed_count="$(sed -E 's/^test result: (ok|FAILED)\. ([0-9]+) passed;.*/\2/' <<< "${summary_line}")"
              failed_count="$(sed -E 's/^test result: (ok|FAILED)\. [0-9]+ passed; ([0-9]+) failed;.*/\2/' <<< "${summary_line}")"
              ignored_count="$(sed -E 's/^test result: (ok|FAILED)\. [0-9]+ passed; [0-9]+ failed; ([0-9]+) ignored;.*/\2/' <<< "${summary_line}")"
              summary_ok=1
            fi
            exact_test_observed=0
            if [[ "${exact_ok}" != 0 || "${exact_failed}" != 0 ]]; then
              exact_test_observed=1
            fi

            selector_status='failed/unreconciled'
            if [[ "${statuses[0]}" -eq 0 &&
                  "${statuses[1]}" -eq 0 &&
                  "${exact_ok}" -eq 1 &&
                  "${exact_failed}" -eq 0 &&
                  "${summary_ok}" -eq 1 &&
                  "${passed_count}" -eq 1 &&
                  "${failed_count}" -eq 0 &&
                  "${ignored_count}" -eq 0 ]]; then
              selector_status='executed-pass'
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "${target}" "${selector}" "${statuses[0]}" "${statuses[1]}" \
              "${selector_status}" "${exact_test_observed}" \
              "${passed_count}" "${failed_count}" "${ignored_count}" >> "${outcomes}"
          done

          source_worktree_clean=1
          if [[ -n "$(git status --porcelain)" ]]; then
            source_worktree_clean=0
            git status --short >&2
          fi

          receipt="${RUNNER_TEMP}/native-macos-selector-receipt.json"
          python3 - "${receipt}" "${outcomes}" "${HOST_SHA}" "${SOURCE_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${source_worktree_clean}" <<'PY'
          import json
          import sys

          path, outcomes_path, host_sha, source_sha, run_id, run_attempt, source_clean = sys.argv[1:]
          selector_rows = []
          with open(outcomes_path, encoding="utf-8") as outcomes_file:
              for line in outcomes_file:
                  (
                      target,
                      name,
                      bazel_exit,
                      tee_exit,
                      status,
                      exact_test_observed,
                      passed,
                      failed,
                      ignored,
                  ) = line.rstrip("\n").split("\t")
                  selector_rows.append(
                      {
                          "target": target,
                          "name": name,
                          "bazel_exit": int(bazel_exit),
                          "tee_exit": int(tee_exit),
                          "status": status,
                          "exact_test_observed": exact_test_observed == "1",
                          "passed": None if passed == "null" else int(passed),
                          "failed": None if failed == "null" else int(failed),
                          "ignored": None if ignored == "null" else int(ignored),
                      }
                  )
          if len(selector_rows) != 6:
              raise SystemExit(f"expected 6 selector outcomes, found {len(selector_rows)}")
          all_passed = all(row["status"] == "executed-pass" for row in selector_rows)
          source_worktree_clean = source_clean == "1"
          receipt = {
              "host_sha": host_sha,
              "source_sha": source_sha,
              "source_tree": "c900106fa4f09e497accb721a8b2a91a54b787df",
              "source_parent": "abcee2cb1f096c77af844c1be18ca8ddd5f9edd3",
              "base_sha": "316c9459fee2343643ae555817e80cce81906675",
              "run_id": run_id,
              "run_attempt": run_attempt,
              "workflow_host_ref": "validation/host-830-macos-daemon-febe3a38",
              "validation_source_ref": "validation/native-830-macos-daemon-febe3a38",
              "mode": "standard-hosted-macos15-arm64-local-bazel",
              "source_worktree_clean": source_worktree_clean,
              "selectors": selector_rows,
              "overall_status": "passed" if all_passed and source_worktree_clean else "failed",
          }
          with open(path, "w", encoding="utf-8") as receipt_file:
              json.dump(receipt, receipt_file, separators=(",", ":"))
          print(json.dumps(receipt, separators=(",", ":")))
          if receipt["overall_status"] != "passed":
              raise SystemExit(1)
          PY

      - name: Upload selector receipt
        if: always() && !cancelled() && steps.run_selectors.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-macos-selector-receipt-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-macos-selector-receipt.json
          if-no-files-found: error
