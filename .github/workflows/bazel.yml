name: Native network denial selector (validation host)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact native candidate commit to validate
        required: true
        type: string
      expected_workflow_host_sha:
        description: Exact commit containing this validation workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-830-policy-denial-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  focused-denial:
    name: GNU native network denial contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUILDBUDDY_API_KEY: ''
    steps:
      - name: Verify fixed validation-host identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          expected_ref='validation/host-830-policy-denial-observability-fc001f84'
          if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch ||
                "${GITHUB_REPOSITORY}" != sednalabs/codex ||
                "${GITHUB_REF_NAME}" != "${expected_ref}" ||
                "${GITHUB_SHA}" != "${EXPECTED_HOST_SHA}" ]]; then
            echo 'Dispatch does not match the fixed host ref and requested host SHA.' >&2
            exit 1
          fi

      - name: Check out exact native candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source, host-parent, base, and target identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          expected_source_sha='fc001f843aff842b36e885e43f33b5b59a86ce24'
          expected_source_tree='377d3f49b5beae54ca241626fabf1c68c9bc04b6'
          expected_source_parent='3f3075d8095aec8e04352f478fd3591c15d0ad82'
          expected_source_ref='validation/native-830-policy-denial-fc001f84'
          expected_host_ref='validation/host-830-policy-denial-observability-fc001f84'
          expected_main_base='f53268d170818054547ac19197223c220a75be1a'
          expected_native_base='83086188ae0614bd882818ff1aa23f3194962012'

          [[ "${SOURCE_SHA}" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD)" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "${expected_source_tree}" ]]
          [[ "$(git rev-parse HEAD^)" == "${expected_source_parent}" ]]
          git cat-file -e "${EXPECTED_HOST_SHA}^{commit}"
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}^")" == "${expected_source_sha}" ]]
          git merge-base --is-ancestor "${expected_main_base}" "${expected_source_sha}"
          git merge-base --is-ancestor "${expected_native_base}" "${expected_source_sha}"
          git show-ref --verify --quiet "refs/remotes/origin/${expected_source_ref}"
          [[ "$(git rev-parse "refs/remotes/origin/${expected_source_ref}")" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}")" == "${GITHUB_SHA}" ]]
          [[ "${GITHUB_REF_NAME}" == "${expected_host_ref}" ]]

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: native-830-policy-denial-${{ inputs.source_sha }}

      - name: Run exact network denial contract
        id: run_selector
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          unset BUILDBUDDY_API_KEY

          selector='suite::network_approval::failed_network_policy_amendment_denies_request_and_does_not_approve_host'
          log="${RUNNER_TEMP}/network-denial-selector.log"

          set +e
          ./.github/scripts/run-bazel-ci.sh \
            -- \
            test \
            --test_sharding_strategy=disabled \
            --nocache_test_results \
            --test_output=all \
            --test_arg=--exact \
            "--test_arg=${selector}" \
            -- \
            //codex-rs/core:core-all-test 2>&1 | tee "${log}" >/dev/null
          statuses=("${PIPESTATUS[@]}")
          set -e

          source_worktree_clean=1
          if [[ -n "$(git status --porcelain)" ]]; then
            source_worktree_clean=0
          fi

          receipt="${RUNNER_TEMP}/network-denial-selector-receipt.json"
          python3 - "${receipt}" "${log}" "${selector}" "${HOST_SHA}" "${SOURCE_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${statuses[0]}" "${statuses[1]}" "${source_worktree_clean}" <<'PY'
          import json
          import re
          import sys

          (
              path,
              log_path,
              selector,
              host_sha,
              source_sha,
              run_id,
              run_attempt,
              bazel_exit,
              tee_exit,
              source_clean,
          ) = sys.argv[1:]
          exact_result = re.compile(rf"^test {re.escape(selector)} \.\.\. (ok|FAILED)$")
          summary_pattern = re.compile(
              r"^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;"
          )
          network_category_pattern = re.compile(r"network_output_category=([A-Za-z0-9_-]+)")
          network_categories = {
              "policy_denial": 0,
              "proxy_policy_denial": 0,
              "synthetic_success": 0,
              "other": 0,
          }
          fixed_signals = {
              "network_approval_before_completion": 0,
              "event_wait_timeout": 0,
              "event_stream_ended": 0,
              "failed_amendment_output_missing": 0,
          }
          exact_ok_line_count = 0
          exact_failed_line_count = 0
          unrecognized_network_category_count = 0
          summaries = []
          network_skip_seen = False
          sandbox_skip_seen = False
          with open(log_path, encoding="utf-8", errors="replace") as log_file:
              for raw_line in log_file:
                  line = raw_line.rstrip("\r\n")
                  result_match = exact_result.fullmatch(line)
                  if result_match:
                      if result_match.group(1) == "ok":
                          exact_ok_line_count += 1
                      else:
                          exact_failed_line_count += 1
                  summary_match = summary_pattern.match(line)
                  if summary_match:
                      summaries.append(
                          {
                              "result": summary_match.group(1),
                              "passed": int(summary_match.group(2)),
                              "failed": int(summary_match.group(3)),
                              "ignored": int(summary_match.group(4)),
                          }
                      )
                  for category_match in network_category_pattern.finditer(line):
                      category = category_match.group(1)
                      if category in network_categories:
                          network_categories[category] += 1
                      else:
                          unrecognized_network_category_count += 1
                  if "expected network approval request before completion" in line:
                      fixed_signals["network_approval_before_completion"] += 1
                  if "timeout waiting for event" in line:
                      fixed_signals["event_wait_timeout"] += 1
                  if "stream ended unexpectedly" in line:
                      fixed_signals["event_stream_ended"] += 1
                  if "expected the failed policy amendment to reject the network request" in line:
                      fixed_signals["failed_amendment_output_missing"] += 1
                  if "Skipping test because it cannot execute when network is disabled in a Codex sandbox." in line:
                      network_skip_seen = True
                  if " is set to 'seatbelt', skipping test." in line:
                      sandbox_skip_seen = True

          exact_test_observed = exact_ok_line_count + exact_failed_line_count > 0
          observation_count = exact_ok_line_count + exact_failed_line_count
          observation_state = "none" if observation_count == 0 else "single" if observation_count == 1 else "multiple"
          summary_line_count = len(summaries)
          summary_state = "missing" if summary_line_count == 0 else "single" if summary_line_count == 1 else "multiple"
          strict_pass = (
              int(bazel_exit) == 0
              and int(tee_exit) == 0
              and exact_ok_line_count == 1
              and exact_failed_line_count == 0
              and summary_line_count == 1
              and summaries[0] == {"result": "ok", "passed": 1, "failed": 0, "ignored": 0}
              and not network_skip_seen
              and not sandbox_skip_seen
          )
          if strict_pass:
              selector_status = "executed-pass"
              failure_category = None
              failure_stage = None
              failure_diagnostics = None
          else:
              if exact_failed_line_count > 0:
                  selector_status = "observed-failure"
                  failure_category = "executed_test_failure_observed"
              elif network_skip_seen or sandbox_skip_seen:
                  selector_status = "environment-guard-skip"
                  failure_category = "environment_guard_skip"
              elif observation_count > 1 or summary_line_count > 1:
                  selector_status = "multiple-observations"
                  failure_category = "multiple_observations"
              elif observation_count == 0 and int(bazel_exit) != 0:
                  selector_status = "not-observed"
                  failure_category = "build_or_harness_failure"
              elif observation_count == 0:
                  selector_status = "not-observed"
                  failure_category = "summary_unreconciled"
              else:
                  selector_status = "unreconciled"
                  failure_category = "summary_unreconciled"

              diagnostic_classes = [
                  f"network_output_{category}"
                  for category, count in network_categories.items()
                  if count > 0
              ]
              if unrecognized_network_category_count > 0:
                  diagnostic_classes.append("network_output_unknown")
              diagnostic_classes.extend(
                  category for category, count in fixed_signals.items() if count > 0
              )
              diagnostic_classes = sorted(set(diagnostic_classes))
              failure_stage = diagnostic_classes[0] if len(diagnostic_classes) == 1 else "unknown"
              failure_diagnostics = {
                  "network_output_category_counts": {
                      **network_categories,
                      "unrecognized": unrecognized_network_category_count,
                  },
                  "fixed_signal_counts": fixed_signals,
                  "matched_diagnostic_classes": diagnostic_classes,
              }

          source_worktree_clean = source_clean == "1"
          passed = (
              selector_status == "executed-pass"
              and source_sha == "fc001f843aff842b36e885e43f33b5b59a86ce24"
              and source_worktree_clean
          )
          row = {
              "selector": selector,
              "bazel_exit": int(bazel_exit),
              "tee_exit": int(tee_exit),
              "status": selector_status,
              "exact_ok_line_count": exact_ok_line_count,
              "exact_failed_line_count": exact_failed_line_count,
              "exact_test_observed": exact_test_observed,
              "test_observation_count": observation_count,
              "test_observation_state": observation_state,
              "libtest_summary_line_count": summary_line_count,
              "libtest_summary_state": summary_state,
              "libtest_summaries": summaries,
              "network_skip_marker_seen": network_skip_seen,
              "sandbox_skip_marker_seen": sandbox_skip_seen,
              "failure_category": failure_category,
              "failure_stage": failure_stage,
              "failure_diagnostics": failure_diagnostics,
              "source_sha": source_sha,
          }
          receipt = {
              "host_sha": host_sha,
              "source_sha": source_sha,
              "source_tree": "377d3f49b5beae54ca241626fabf1c68c9bc04b6",
              "source_parent": "3f3075d8095aec8e04352f478fd3591c15d0ad82",
              "pr_base_sha": "f53268d170818054547ac19197223c220a75be1a",
              "native_base_sha": "83086188ae0614bd882818ff1aa23f3194962012",
              "run_id": run_id,
              "run_attempt": int(run_attempt),
              "execution_mode": "standard-hosted-ubuntu24-local-gnu",
              "target": "//codex-rs/core:core-all-test",
              "source_worktree_clean": source_worktree_clean,
              "selector_result": row,
              "overall_status": "passed" if passed else "failed",
          }
          with open(path, "w", encoding="utf-8") as receipt_file:
              json.dump(receipt, receipt_file, separators=(",", ":"))
          print(json.dumps(receipt, separators=(",", ":")))
          if not passed:
              raise SystemExit(1)
          PY

      - name: Upload compact selector receipt
        if: always() && !cancelled() && steps.run_selector.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-network-denial-receipt-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-denial-selector-receipt.json
          if-no-files-found: error
