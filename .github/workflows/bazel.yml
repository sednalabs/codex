name: Native network denial wrapper selectors (validation host)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact native candidate commit to validate
        required: true
        type: string
      expected_workflow_host_sha:
        description: Exact commit containing this validation workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-830-denial-wrapper-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  focused-denial:
    name: GNU native network denial wrapper contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILDBUDDY_API_KEY: ''
    steps:
      - name: Verify fixed validation-host identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          expected_ref='validation/host-830-denial-wrapper-d0137b89'
          if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch ||
                "${GITHUB_REPOSITORY}" != sednalabs/codex ||
                "${GITHUB_REF_NAME}" != "${expected_ref}" ||
                "${GITHUB_SHA}" != "${EXPECTED_HOST_SHA}" ]]; then
            echo 'Dispatch does not match the fixed host ref and requested host SHA.' >&2
            exit 1
          fi

      - name: Check out exact native candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source, host-parent, base, and target identity
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          expected_source_sha='d0137b8901d94ecb8b51811a7073f0a9f4d35a2b'
          expected_source_tree='ae8786154d8c9d26b8dbe5ed700c4d8e26702d3d'
          expected_source_parent='b7e2d1cd2644f029705493cc9b2029b2b6f3bb29'
          expected_source_ref='validation/native-830-denial-wrapper-d0137b89'
          expected_host_ref='validation/host-830-denial-wrapper-d0137b89'
          expected_main_base='b4940c27d00184afdcdf9e34afe47efc5777ac9a'
          expected_native_base='83086188ae0614bd882818ff1aa23f3194962012'

          [[ "${SOURCE_SHA}" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD)" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "${expected_source_tree}" ]]
          [[ "$(git rev-parse HEAD^)" == "${expected_source_parent}" ]]
          git cat-file -e "${EXPECTED_HOST_SHA}^{commit}"
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}^")" == "${expected_source_sha}" ]]
          git merge-base --is-ancestor "${expected_main_base}" "${expected_source_sha}"
          git merge-base --is-ancestor "${expected_native_base}" "${expected_source_sha}"
          git show-ref --verify --quiet "refs/remotes/origin/${expected_source_ref}"
          [[ "$(git rev-parse "refs/remotes/origin/${expected_source_ref}")" == "${expected_source_sha}" ]]
          [[ "$(git rev-parse "${EXPECTED_HOST_SHA}")" == "${GITHUB_SHA}" ]]
          [[ "${GITHUB_REF_NAME}" == "${expected_host_ref}" ]]

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: native-830-denial-wrapper-${{ inputs.source_sha }}

      - name: Run exact network denial selector suite
        id: run_selector
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          unset BUILDBUDDY_API_KEY
          HOST_TREE="$(git rev-parse "${HOST_SHA}^{tree}")"
          HOST_WORKFLOW_BLOB="$(git rev-parse "${HOST_SHA}:.github/workflows/bazel.yml")"

          selectors=(
            'suite::network_approval::failed_network_policy_amendment_denies_request_and_does_not_approve_host'
            'suite::network_approval::failed_amendment_network_output_category_matches_only_exact_denials'
            'suite::network_approval::failed_amendment_network_output_shape_is_closed_and_payload_free'
          )
          logs=()
          bazel_exits=()
          tee_exits=()
          for index in "${!selectors[@]}"; do
            selector="${selectors[${index}]}"
            log="${RUNNER_TEMP}/network-denial-selector-${index}.log"
            set +e
            ./.github/scripts/run-bazel-ci.sh \
              -- \
              test \
              --test_sharding_strategy=disabled \
              --nocache_test_results \
              --test_output=all \
              --test_arg=--exact \
              "--test_arg=${selector}" \
              -- \
              //codex-rs/core:core-all-test 2>&1 | tee "${log}" >/dev/null
            statuses=("${PIPESTATUS[@]}")
            set -e
            logs+=("${log}")
            bazel_exits+=("${statuses[0]}")
            tee_exits+=("${statuses[1]}")
          done

          source_worktree_clean=1
          if [[ -n "$(git status --porcelain)" ]]; then
            source_worktree_clean=0
          fi

          receipt="${RUNNER_TEMP}/network-denial-selector-receipt.json"
          python3 - "${receipt}" "${HOST_SHA}" "${HOST_TREE}" "${HOST_WORKFLOW_BLOB}" "${SOURCE_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${source_worktree_clean}" \
            "${logs[0]}" "${bazel_exits[0]}" "${tee_exits[0]}" \
            "${logs[1]}" "${bazel_exits[1]}" "${tee_exits[1]}" \
            "${logs[2]}" "${bazel_exits[2]}" "${tee_exits[2]}" <<'PY'
          import json
          import re
          import sys

          (
              path,
              host_sha,
              host_tree,
              host_workflow_blob,
              source_sha,
              run_id,
              run_attempt,
              source_clean,
              *run_results,
          ) = sys.argv[1:]
          selectors = [
              "suite::network_approval::failed_network_policy_amendment_denies_request_and_does_not_approve_host",
              "suite::network_approval::failed_amendment_network_output_category_matches_only_exact_denials",
              "suite::network_approval::failed_amendment_network_output_shape_is_closed_and_payload_free",
          ]
          summary_pattern = re.compile(
              r"^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;"
          )
          network_category_pattern = re.compile(r"network_output_category=([A-Za-z0-9_-]+)")
          network_shape_pattern = re.compile(r"network_output_shape=([A-Za-z0-9_-]+)")
          network_categories = {
              "policy_denial": 0,
              "proxy_policy_denial": 0,
              "synthetic_success": 0,
              "other": 0,
          }
          network_shapes = {
              "exec_process_failed": 0,
              "exec_other_error": 0,
              "exec_output_header": 0,
              "exec_output_exited": 0,
              "exec_output_running": 0,
              "bare_network_access": 0,
              "empty": 0,
              "opaque": 0,
          }
          fixed_signals = {
              "network_approval_before_completion": 0,
              "event_wait_timeout": 0,
              "event_stream_ended": 0,
              "failed_amendment_output_missing": 0,
          }
          if len(run_results) != 9:
              raise SystemExit("expected three log and exit tuples")
          result_tuples = [run_results[index : index + 3] for index in range(0, 9, 3)]
          source_worktree_clean = source_clean == "1"
          rows = []
          for selector_index, selector in enumerate(selectors):
              log_path, bazel_exit_text, tee_exit_text = result_tuples[selector_index]
              bazel_exit = int(bazel_exit_text)
              tee_exit = int(tee_exit_text)
              exact_result = re.compile(rf"^test {re.escape(selector)} \.\.\. (ok|FAILED)$")
              exact_ok_line_count = 0
              exact_failed_line_count = 0
              summaries = []
              network_skip_seen = False
              sandbox_skip_seen = False
              category_counts = {key: 0 for key in network_categories}
              shape_counts = {key: 0 for key in network_shapes}
              unrecognized_category_count = 0
              unrecognized_shape_count = 0
              fixed_signal_counts = {key: 0 for key in fixed_signals}
              with open(log_path, encoding="utf-8", errors="replace") as log_file:
                  for raw_line in log_file:
                      line = raw_line.rstrip("\r\n")
                      result_match = exact_result.fullmatch(line)
                      if result_match:
                          if result_match.group(1) == "ok":
                              exact_ok_line_count += 1
                          else:
                              exact_failed_line_count += 1
                      summary_match = summary_pattern.match(line)
                      if summary_match:
                          summaries.append(
                              {
                                  "result": summary_match.group(1),
                                  "passed": int(summary_match.group(2)),
                                  "failed": int(summary_match.group(3)),
                                  "ignored": int(summary_match.group(4)),
                              }
                          )
                      if selector_index == 0:
                          for match in network_category_pattern.finditer(line):
                              category = match.group(1)
                              if category in category_counts:
                                  category_counts[category] += 1
                              else:
                                  unrecognized_category_count += 1
                          for match in network_shape_pattern.finditer(line):
                              shape = match.group(1)
                              if shape in shape_counts:
                                  shape_counts[shape] += 1
                              else:
                                  unrecognized_shape_count += 1
                          if "expected network approval request before completion" in line:
                              fixed_signal_counts["network_approval_before_completion"] += 1
                          if "timeout waiting for event" in line:
                              fixed_signal_counts["event_wait_timeout"] += 1
                          if "stream ended unexpectedly" in line:
                              fixed_signal_counts["event_stream_ended"] += 1
                          if "expected the failed policy amendment to reject the network request" in line:
                              fixed_signal_counts["failed_amendment_output_missing"] += 1
                      if "Skipping test because it cannot execute when network is disabled in a Codex sandbox." in line:
                          network_skip_seen = True
                      if " is set to 'seatbelt', skipping test." in line:
                          sandbox_skip_seen = True

              summary_count = len(summaries)
              strict_pass = (
                  bazel_exit == 0
                  and tee_exit == 0
                  and exact_ok_line_count == 1
                  and exact_failed_line_count == 0
                  and summary_count == 1
                  and summaries[0] == {"result": "ok", "passed": 1, "failed": 0, "ignored": 0}
                  and not network_skip_seen
                  and not sandbox_skip_seen
                  and source_worktree_clean
              )
              if strict_pass:
                  selector_status = "executed-pass"
                  failure_category = None
              elif exact_failed_line_count > 0:
                  selector_status = "observed-failure"
                  failure_category = "executed_test_failure_observed"
              elif network_skip_seen or sandbox_skip_seen:
                  selector_status = "environment-guard-skip"
                  failure_category = "environment_guard_skip"
              elif exact_ok_line_count + exact_failed_line_count > 1 or summary_count > 1:
                  selector_status = "multiple-observations"
                  failure_category = "multiple_observations"
              elif exact_ok_line_count + exact_failed_line_count == 0 and bazel_exit != 0:
                  selector_status = "not-observed"
                  failure_category = "build_or_harness_failure"
              else:
                  selector_status = "unreconciled"
                  failure_category = "summary_unreconciled"

              diagnostics = None
              if selector_index == 0 and not strict_pass:
                  diagnostics = {
                      "network_output_category_counts": {
                          **category_counts,
                          "unrecognized": unrecognized_category_count,
                      },
                      "network_output_shape_counts": {
                          **shape_counts,
                          "unrecognized": unrecognized_shape_count,
                      },
                      "fixed_signal_counts": fixed_signal_counts,
                  }
              rows.append(
                  {
                      "selector": selector,
                      "bazel_exit": bazel_exit,
                      "tee_exit": tee_exit,
                      "status": selector_status,
                      "exact_ok_line_count": exact_ok_line_count,
                      "exact_failed_line_count": exact_failed_line_count,
                      "observation_count": exact_ok_line_count + exact_failed_line_count,
                      "summary_count": summary_count,
                      "summaries": summaries,
                      "network_skip_marker_seen": network_skip_seen,
                      "sandbox_skip_marker_seen": sandbox_skip_seen,
                      "failure_category": failure_category,
                      "failure_diagnostics": diagnostics,
                  }
              )

          passed = all(row["status"] == "executed-pass" for row in rows)
          receipt_data = {
              "host_sha": host_sha,
              "host_tree": host_tree,
              "host_workflow_blob": host_workflow_blob,
              "source_sha": source_sha,
              "host_parent": "d0137b8901d94ecb8b51811a7073f0a9f4d35a2b",
              "source_tree": "ae8786154d8c9d26b8dbe5ed700c4d8e26702d3d",
              "source_parent": "b7e2d1cd2644f029705493cc9b2029b2b6f3bb29",
              "pr_base_sha": "b4940c27d00184afdcdf9e34afe47efc5777ac9a",
              "native_base_sha": "83086188ae0614bd882818ff1aa23f3194962012",
              "run_id": run_id,
              "run_attempt": int(run_attempt),
              "execution_mode": "standard-hosted-ubuntu24-local-gnu",
              "target": "//codex-rs/core:core-all-test",
              "source_worktree_clean": source_worktree_clean,
              "selectors": rows,
              "overall_status": "passed" if passed else "failed",
          }
          with open(path, "w", encoding="utf-8") as receipt_file:
              json.dump(receipt_data, receipt_file, separators=(",", ":"))
          print(json.dumps(receipt_data, separators=(",", ":")))
          if not passed:
              raise SystemExit(1)
          PY

      - name: Upload compact selector receipt
        if: always() && !cancelled() && steps.run_selector.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-network-denial-wrapper-receipt-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-denial-selector-receipt.json
          if-no-files-found: error
