name: Bazel

# Note this workflow was originally derived from:
# https://github.com/cerisier/toolchains_llvm_bootstrapped/blob/main/.github/workflows/ci.yaml

on:
  workflow_call:
  workflow_dispatch:

env:
  CODEX_BAZEL_LOCAL_ONLY: "1"
  BUILDBUDDY_API_KEY: ""

concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    # GNU retains the complete target set. Musl excludes only the unsupported
    # native voice aliases and their query-derived dependents, listed below.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin

          # Linux
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          # 2026-02-27 Bazel tests have been flaky on arm in CI.
          # Disable until we can investigate and stabilize them.
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-musl
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Bazel test on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}
          windows-voice-tools: ${{ runner.os == 'Windows' }}

      - name: Check rusty_v8 MODULE.bazel checksums
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          python3 .github/scripts/rusty_v8_bazel.py check-module-bazel
          just test-github-scripts

      - name: Check MODULE.bazel.lock is up to date
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: ./scripts/check-module-bazel-lock.sh

      - name: Reclaim unused GNU runner trees and capture baseline
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="${RUNNER_TEMP}/gnu-runner-resource-baseline"
          mkdir -p "${baseline_dir}"
          baseline_file="${baseline_dir}/baseline.txt"
          : > "${baseline_file}"

          sample_reclaim_state() {
            local phase="$1"
            {
              printf 'phase=%s\n' "${phase}"
              printf 'filesystem_bytes.root='
              df -B1 --output=size,used,avail,pcent / | tail -n 1
              printf 'filesystem_inodes.root='
              df --output=itotal,iused,iavail,ipcent / | tail -n 1
              for entry in 'android_sdk:/usr/local/lib/android' 'dotnet_sdk:/usr/share/dotnet'; do
                local label="${entry%%:*}"
                local path="${entry#*:}"
                if [[ -d "${path}" && ! -L "${path}" ]]; then
                  local bytes
                  bytes="$(du -s -B1 -- "${path}" | awk 'NR == 1 { print $1 }')"
                  printf 'directory_bytes.%s=%s\n' "${label}" "${bytes}"
                else
                  printf 'directory_bytes.%s=absent_or_not_plain_directory\n' "${label}"
                fi
              done
            } >> "${baseline_file}"
          }

          sample_reclaim_state before
          for path in /usr/local/lib/android /usr/share/dotnet; do
            if [[ -L "${path}" ]]; then
              echo "Refusing to reclaim symlink at expected hosted tool path: ${path}" >&2
              exit 1
            fi
            if [[ -e "${path}" && ! -d "${path}" ]]; then
              echo "Refusing to reclaim non-directory at expected hosted tool path: ${path}" >&2
              exit 1
            fi
          done

          for path in /usr/local/lib/android /usr/share/dotnet; do
            if [[ -d "${path}" ]]; then
              sudo rm -rf -- "${path}"
            fi
          done
          sample_reclaim_state after

          sample_filesystem() {
            local label="$1"
            local path="$2"
            [[ -e "${path}" ]] || return 0
            printf 'filesystem_bytes.%s=' "${label}"
            df -B1 --output=size,used,avail,pcent "${path}" | tail -n 1
            printf 'filesystem_inodes.%s=' "${label}"
            df --output=itotal,iused,iavail,ipcent "${path}" | tail -n 1
          }

          sample_directory() {
            local label="$1"
            local path="$2"
            if [[ -d "${path}" ]]; then
              local bytes
              bytes="$(du -x -s -B1 -- "${path}/." 2>/dev/null | awk 'NR == 1 { print $1 }' || true)"
              printf 'directory_bytes.%s=%s\n' "${label}" "${bytes:-unavailable}"
            else
              printf 'directory_bytes.%s=absent\n' "${label}"
            fi
          }

          {
            printf 'captured_utc=%s\n' "$(date -u +%FT%TZ)"
            sample_filesystem root /
            sample_filesystem ci_build_root "${CI_BUILD_ROOT}"
            sample_filesystem runner_temp "${RUNNER_TEMP}"
            sample_filesystem workspace "${GITHUB_WORKSPACE}"

            sample_directory ci_build_root "${CI_BUILD_ROOT}"
            sample_directory bazel_output_base "${BAZEL_OUTPUT_BASE}"
            sample_directory bazel_output_user_root "${BAZEL_OUTPUT_USER_ROOT}"
            sample_directory bazel_repository_cache "${BAZEL_REPOSITORY_CACHE}"
            sample_directory bazel_repo_contents_cache "${BAZEL_REPO_CONTENTS_CACHE}"
            sample_directory cargo_target_dir "${CARGO_TARGET_DIR}"
            sample_directory ci_tmp "${TMP}"
            sample_directory runner_temp "${RUNNER_TEMP}"
            sample_directory workspace "${GITHUB_WORKSPACE}"
            sample_directory runner_diagnostic_cache "${HOME}/actions-runner/cached"

            sample_directory hosted_tool_cache "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
            sample_directory android_sdk /usr/local/lib/android/sdk
            sample_directory dotnet_sdk /usr/share/dotnet
            sample_directory ghc /opt/ghc
            sample_directory chromium /usr/local/share/chromium
          } >> "${baseline_file}"

      - name: Upload GNU hosted-runner resource baseline
        if: always() && !cancelled() && matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gnu-runner-resource-baseline-${{ github.run_id }}-${{ github.run_attempt }}-test
          path: ${{ runner.temp }}/gnu-runner-resource-baseline/baseline.txt
          if-no-files-found: error
          retention-days: 3

      - name: bazel test //...
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          bazel_targets=(
            //...
            # Keep standalone V8 library targets out of the ordinary Bazel CI
            # path. V8 consumers under `//codex-rs/...` still participate
            # transitively through `//...`.
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )

          if [[ "${TARGET}" == "x86_64-unknown-linux-musl" ]]; then
            # These aliases have GNU/macOS/MSVC branches, but no musl branch.
            # Unconfigured reverse dependencies name every necessary exclusion;
            # all of them remain in the complete GNU lane above.
            target_query='//... except attr(tags, "manual", //...) except //third_party/v8:all except //codex-rs/v8-poc:v8-poc-unit-tests'
            voice_query='rdeps(//..., set(//third_party/voice:native_prefix //third_party/voice:native_runtime //third_party/voice:native_link //third_party/voice:native_sdk))'
            coverage_dir="${RUNNER_TEMP}/musl-coverage"
            mkdir -p "${coverage_dir}"
            ./.github/scripts/run-bazel-query-ci.sh \
              --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
              --output=label -- "${target_query}" \
              | LC_ALL=C sort -u > "${coverage_dir}/all-targets.txt"
            ./.github/scripts/run-bazel-query-ci.sh \
              --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
              --output=label -- "(${target_query}) intersect ${voice_query}" \
              | LC_ALL=C sort -u > "${coverage_dir}/voice-exclusions.txt"
            LC_ALL=C comm -23 "${coverage_dir}/all-targets.txt" "${coverage_dir}/voice-exclusions.txt" \
              > "${coverage_dir}/musl-targets.txt"
            mapfile -t bazel_targets < "${coverage_dir}/musl-targets.txt"
            if [[ ${#bazel_targets[@]} -eq 0 ]]; then
              echo "Musl target selection is empty; refusing an empty proof." >&2
              exit 1
            fi
            {
              echo '### Genuine musl coverage'
              echo 'Native voice aliases lack musl configuration. Their exact reverse dependencies remain covered by GNU.'
              printf 'Target query: `%s`\n\nExclusion query: `%s`\n' "${target_query}" "${voice_query}"
              echo '```text'
              cat "${coverage_dir}/voice-exclusions.txt"
              echo '```'
              printf 'Selected labels: %s; excluded labels: %s\n' \
                "${#bazel_targets[@]}" "$(wc -l < "${coverage_dir}/voice-exclusions.txt")"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

          bazel_wrapper_args=(
            --print-failed-action-summary
            --print-failed-test-logs
          )
          bazel_test_args=(
            test
            --platforms=@rules_rs//rs/platforms:${TARGET}
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
          )
          if [[ "${RUNNER_OS:-}" == "Linux" ]]; then
            bazel_test_args+=(--repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1)
          fi
          if [[ "${TARGET}" == "x86_64-unknown-linux-musl" ]]; then
            # Explicit query labels retain the wildcard's platform filtering.
            bazel_test_args+=(--skip_incompatible_explicit_targets)
          fi
          if [[ "${TARGET}" == "x86_64-unknown-linux-gnu" ]]; then
            report_gnu_disk_state() {
              echo "GNU Bazel disk sample ($1) at $(date -u +%FT%TZ)"
              for path in "$CI_BUILD_ROOT" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" /tmp; do
                [[ -e "$path" ]] || continue
                echo "Filesystem containing $path:"
                df -B1 --output=size,used,avail,pcent,itotal,iused,iavail,ipcent "$path" 2>&1 | tail -n 1 || true
              done
            }
            report_gnu_directory_sizes() {
              echo "GNU Bazel directory sizes ($1) at $(date -u +%FT%TZ)"
              for path in "$BAZEL_OUTPUT_BASE" "$BAZEL_OUTPUT_USER_ROOT" "$BAZEL_REPOSITORY_CACHE" "$BAZEL_REPO_CONTENTS_CACHE" "$CARGO_TARGET_DIR" "$TMP" /tmp "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bazel-execution-logs" "$HOME"/actions-runner/cached/*/_diag; do
                [[ -d "$path" ]] || continue
                echo "Directory $path:"
                du -x -s -B1 -- "$path" 2>&1 || true
              done
            }
            report_gnu_disk_state before
            report_gnu_directory_sizes before
            (
              sleep_pid=""
              trap 'if [[ -n "$sleep_pid" ]]; then kill "$sleep_pid" 2>/dev/null || true; fi; exit 0' INT TERM
              while true; do
                sleep 30 &
                sleep_pid=$!
                wait "$sleep_pid" || exit 0
                report_gnu_disk_state periodic
              done
            ) &
            disk_sampler_pid=$!
            trap 'kill -TERM "$disk_sampler_pid" 2>/dev/null || true; wait "$disk_sampler_pid" 2>/dev/null || true' EXIT
            bazel_status=0
            if ./.github/scripts/run-bazel-ci.sh \
              "${bazel_wrapper_args[@]}" \
              -- \
              "${bazel_test_args[@]}" \
              -- \
              "${bazel_targets[@]}"; then
              bazel_status=0
            else
              bazel_status=$?
            fi
            kill -TERM "$disk_sampler_pid" 2>/dev/null || true
            wait "$disk_sampler_pid" 2>/dev/null || true
            trap - EXIT
            report_gnu_disk_state after
            if [[ "$bazel_status" -ne 0 ]]; then
              report_gnu_directory_sizes failure-before-artifact-upload
            fi
            exit "$bazel_status"
          fi
          ./.github/scripts/run-bazel-ci.sh \
            "${bazel_wrapper_args[@]}" \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload exact musl coverage selection
        if: always() && !cancelled() && matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: musl-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/musl-coverage
          if-no-files-found: error

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-windows-shard:
    # Split native Windows/MSVC tests across standard Windows hosts. Build actions and
    # test execution both remain on the assigned GitHub-hosted runner.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    runs-on: windows-2025
    name: Bazel test on windows-latest for x86_64-pc-windows-msvc shard ${{ matrix.shard }}/4
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test BuildBuddy Bazel wrapper
        if: matrix.shard == 1
        shell: pwsh
        run: python .github/scripts/test_run_bazel_with_buildbuddy.py

      - name: Test Windows Bazel target selector
        if: matrix.shard == 1
        shell: pwsh
        run: python -m unittest discover -s .github/scripts -p test_select_windows_bazel_targets.py

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          windows-voice-tools: "true"
          # Reuse the former monolithic Windows test cache for restores. Do
          # not save it from every shard below; duplicate uploads would sit on
          # the PR-blocking critical path after the useful test work is done.
          cache-scope: bazel-test

      - name: bazel test shard
        env:
          BAZEL_TEST_SHARD: ${{ matrix.shard }}
          BAZEL_TEST_SHARD_COUNT: 4
        shell: bash
        run: |
          set -euo pipefail

          bazel_test_query='tests(//...) except tests(//third_party/v8:all) except attr(tags, "manual", tests(//...))'
          bazel_targets_file="$(mktemp)"
          selected_targets_file="$(mktemp)"
          trap 'rm -f "${bazel_targets_file}" "${selected_targets_file}"' EXIT

          # Keep query and selection in the foreground so failures cannot leave
          # different jobs assigning different partial target lists.
          ./.github/scripts/run-bazel-query-ci.sh \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --output=label -- "${bazel_test_query}" \
            | LC_ALL=C sort > "${bazel_targets_file}"
          python .github/scripts/select_windows_bazel_targets.py \
            --shard "${BAZEL_TEST_SHARD}" \
            --shard-count "${BAZEL_TEST_SHARD_COUNT}" \
            < "${bazel_targets_file}" > "${selected_targets_file}"
          mapfile -t selected_targets < "${selected_targets_file}"

          bazel_test_args=(
            test
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1
            --workspace_status_command=./scripts/workspace-status.cmd
            --skip_incompatible_explicit_targets
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_windows_test_shard=${BAZEL_TEST_SHARD}
          )

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            --remote-download-toplevel \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${selected_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-x86_64-pc-windows-msvc-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-windows:
    # Preserve the required aggregation while naming the real native ABI.
    if: always()
    needs: test-windows-shard
    runs-on: ubuntu-24.04
    name: Bazel test on windows-latest for x86_64-pc-windows-msvc

    steps:
      - name: Confirm Windows Bazel test shards passed
        shell: bash
        run: |
          if [[ "${{ needs.test-windows-shard.result }}" != "success" ]]; then
            echo "Windows Bazel test shards finished with result: ${{ needs.test-windows-shard.result }}" >&2
            exit 1
          fi

  test-windows-native-main:
    # Keep the unsharded native Windows path post-merge.
    # PRs use the four shards above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 40
    runs-on: windows-2025
    name: Bazel test on windows-latest for x86_64-pc-windows-msvc (native main)
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          windows-voice-tools: "true"
          cache-scope: bazel-${{ github.job }}

      - name: bazel test //...
        shell: bash
        run: |
          bazel_targets=(
            //...
            # Keep standalone V8 library targets out of the ordinary Bazel CI
            # path. V8 consumers under `//codex-rs/...` still participate
            # transitively through `//...`.
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )

          bazel_test_args=(
            test
            --platforms=//:windows_x86_64_msvc
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_windows_native_main=true
          )

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-windows-native-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  clippy:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep Linux lint coverage on x64 and add the arm64 macOS path that
          # the Bazel test job already exercises. Add native Windows/MSVC as well
          # so PRs get Bazel-native lint signal on the same Windows toolchain
          # that the Bazel test job uses.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    name: Bazel clippy on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}
          windows-voice-tools: ${{ runner.os == 'Windows' }}

      - name: Reclaim unused GNU runner trees and capture baseline
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="${RUNNER_TEMP}/gnu-runner-resource-baseline"
          mkdir -p "${baseline_dir}"
          baseline_file="${baseline_dir}/baseline.txt"
          : > "${baseline_file}"

          sample_state() {
            local phase="$1"
            {
              printf 'phase=%s\n' "${phase}"
              printf 'filesystem_bytes.root='
              df -B1 --output=size,used,avail,pcent / | tail -n 1
              printf 'filesystem_inodes.root='
              df --output=itotal,iused,iavail,ipcent / | tail -n 1
              for entry in 'android_sdk:/usr/local/lib/android' 'dotnet_sdk:/usr/share/dotnet'; do
                local label="${entry%%:*}"
                local path="${entry#*:}"
                if [[ -d "${path}" && ! -L "${path}" ]]; then
                  local bytes
                  bytes="$(du -s -B1 -- "${path}" | awk 'NR == 1 { print $1 }')"
                  printf 'directory_bytes.%s=%s\n' "${label}" "${bytes}"
                else
                  printf 'directory_bytes.%s=absent_or_not_plain_directory\n' "${label}"
                fi
              done
            } >> "${baseline_file}"
          }

          sample_state before
          for path in /usr/local/lib/android /usr/share/dotnet; do
            if [[ -L "${path}" ]]; then
              echo "Refusing to reclaim symlink at expected hosted tool path: ${path}" >&2
              exit 1
            fi
            if [[ -e "${path}" && ! -d "${path}" ]]; then
              echo "Refusing to reclaim non-directory at expected hosted tool path: ${path}" >&2
              exit 1
            fi
          done

          for path in /usr/local/lib/android /usr/share/dotnet; do
            if [[ -d "${path}" ]]; then
              sudo rm -rf -- "${path}"
            fi
          done
          sample_state after

      - name: Upload GNU hosted-runner resource baseline
        if: always() && !cancelled() && matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gnu-runner-resource-baseline-${{ github.run_id }}-${{ github.run_attempt }}-clippy
          path: ${{ runner.temp }}/gnu-runner-resource-baseline/baseline.txt
          if-no-files-found: error
          retention-days: 3

      - name: bazel build --config=clippy lint targets
        env:
          BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: ${{ matrix.target != 'aarch64-apple-darwin' && '1' || '' }}
        shell: bash
        run: |
          bazel_clippy_args=(
            --config=clippy
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_job=clippy
          )
          bazel_wrapper_args=()
          bazel_target_list_args=()
          if [[ -n "${BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA}" ]]; then
            bazel_target_list_args+=(--repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1)
          fi
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            bazel_wrapper_args+=(--windows-msvc-host-platform)
            bazel_clippy_args+=(--platforms=//:windows_x86_64_msvc --skip_incompatible_explicit_targets)
            bazel_clippy_args+=(--workspace_status_command=./scripts/workspace-status.cmd)
          else
            bazel_clippy_args+=(--platforms=@rules_rs//rs/platforms:${{ matrix.target }})
          fi
          if [[ -n "${BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA}" ]]; then
            bazel_clippy_args+=(--repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1)
          fi

          bazel_target_lines="$(./scripts/list-bazel-clippy-targets.sh "${bazel_target_list_args[@]}")"
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            "${bazel_wrapper_args[@]}" \
            -- \
            build \
            "${bazel_clippy_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-clippy-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  verify-release-build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    name: Verify release build on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}
          windows-voice-tools: ${{ runner.os == 'Windows' }}

      - name: Reclaim unused GNU runner trees and capture baseline
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="${RUNNER_TEMP}/gnu-runner-resource-baseline"
          mkdir -p "${baseline_dir}"
          baseline_file="${baseline_dir}/baseline.txt"
          : > "${baseline_file}"

          sample_state() {
            local phase="$1"
            {
              printf 'phase=%s\n' "${phase}"
              printf 'filesystem_bytes.root='
              df -B1 --output=size,used,avail,pcent / | tail -n 1
              printf 'filesystem_inodes.root='
              df --output=itotal,iused,iavail,ipcent / | tail -n 1
              for entry in 'android_sdk:/usr/local/lib/android' 'dotnet_sdk:/usr/share/dotnet'; do
                local label="${entry%%:*}"
                local path="${entry#*:}"
                if [[ -d "${path}" && ! -L "${path}" ]]; then
                  local bytes
                  bytes="$(du -s -B1 -- "${path}" | awk 'NR == 1 { print $1 }')"
                  printf 'directory_bytes.%s=%s\n' "${label}" "${bytes}"
                else
                  printf 'directory_bytes.%s=absent_or_not_plain_directory\n' "${label}"
                fi
              done
            } >> "${baseline_file}"
          }

          sample_state before
          for path in /usr/local/lib/android /usr/share/dotnet; do
            if [[ -L "${path}" ]]; then
              echo "Refusing to reclaim symlink at expected hosted tool path: ${path}" >&2
              exit 1
            fi
            if [[ -e "${path}" && ! -d "${path}" ]]; then
              echo "Refusing to reclaim non-directory at expected hosted tool path: ${path}" >&2
              exit 1
            fi
          done

          for path in /usr/local/lib/android /usr/share/dotnet; do
            if [[ -d "${path}" ]]; then
              sudo rm -rf -- "${path}"
            fi
          done
          sample_state after

      - name: Upload GNU hosted-runner resource baseline
        if: always() && !cancelled() && matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gnu-runner-resource-baseline-${{ github.run_id }}-${{ github.run_attempt }}-verify-release-build
          path: ${{ runner.temp }}/gnu-runner-resource-baseline/baseline.txt
          if-no-files-found: error
          retention-days: 3

      - name: bazel build verify-release-build targets
        shell: bash
        run: |
          # This job exists to compile Rust code behind
          # `cfg(not(debug_assertions))` so PR CI catches failures that would
          # otherwise show up only in a release build. We do not need the full
          # optimizer and debug-info work that normally comes with a release
          # build to get that signal, so keep Bazel in `fastbuild` and disable
          # Rust debug assertions explicitly.
          bazel_wrapper_args=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # Compile assertions-off source on the same native MSVC path.
            # This job does not produce a Windows release package.
            bazel_wrapper_args+=(--windows-msvc-host-platform)
          fi

          bazel_build_args=(
            --compilation_mode=fastbuild
            --@rules_rust//rust/settings:extra_rustc_flag=-Cdebug-assertions=no
            --@rules_rust//rust/settings:extra_exec_rustc_flag=-Cdebug-assertions=no
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_job=verify-release-build
            --build_metadata=TAG_rust_debug_assertions=off
          )
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            bazel_build_args+=(--workspace_status_command=./scripts/workspace-status.cmd)
          fi
          if [[ "${RUNNER_OS}" != "Windows" ]]; then
            bazel_build_args+=(--platforms=@rules_rs//rs/platforms:${{ matrix.target }})
          fi
          if [[ "${{ matrix.target }}" != "aarch64-apple-darwin" ]]; then
            bazel_build_args+=(--repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1)
          fi

          bazel_target_lines="$(bash ./scripts/list-bazel-release-targets.sh)"
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"

          ./.github/scripts/run-bazel-ci.sh \
            "${bazel_wrapper_args[@]}" \
            -- \
            build \
            "${bazel_build_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Verify Bazel builds bwrap
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./.github/scripts/run-bazel-ci.sh \
            --remote-download-toplevel \
            --print-failed-action-summary \
            -- \
            build \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            --build_metadata=TAG_job=verify-bwrap \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            -- \
            //codex-rs/bwrap:bwrap

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-verify-release-build-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
