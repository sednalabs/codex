name: Bazel

# Note this workflow was originally derived from:
# https://github.com/cerisier/toolchains_llvm_bootstrapped/blob/main/.github/workflows/ci.yaml

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    # Code-mode unit tests run on every supported Bazel target. Split the
    # inventory into deterministic target shards to keep standard-hosted jobs
    # within their existing limits without dropping coverage.
    timeout-minutes: ${{ startsWith(matrix.os, 'macos-') && 180 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-15
            target: aarch64-apple-darwin
            shard: 1
            shard_count: 2
          - os: macos-15
            target: aarch64-apple-darwin
            shard: 2
            shard_count: 2
          - os: macos-15-intel
            target: x86_64-apple-darwin
            shard: 1
            shard_count: 2
          - os: macos-15-intel
            target: x86_64-apple-darwin
            shard: 2
            shard_count: 2

          # Linux
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            shard: 1
            shard_count: 4
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            shard: 2
            shard_count: 4
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            shard: 3
            shard_count: 4
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            shard: 4
            shard_count: 4
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            shard: 1
            shard_count: 4
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            shard: 2
            shard_count: 4
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            shard: 3
            shard_count: 4
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            shard: 4
            shard_count: 4
          # 2026-02-27 Bazel tests have been flaky on arm in CI.
          # Disable until we can investigate and stabilize them.
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-musl
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Bazel test on ${{ matrix.os }} for ${{ matrix.target }}${{ matrix.shard && format(' shard {0}/{1}', matrix.shard, matrix.shard_count) || '' }}
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: ${{ matrix.shard && format('bazel-{0}-{1}-shard-{2}-of-{3}', github.job, matrix.target, matrix.shard, matrix.shard_count) || format('bazel-{0}', github.job) }}

      - name: Check rusty_v8 MODULE.bazel checksums
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu' && matrix.shard == 1
        shell: bash
        run: |
          python3 .github/scripts/rusty_v8_bazel.py check-module-bazel
          just test-github-scripts

      - name: Check MODULE.bazel.lock is up to date
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu' && matrix.shard == 1
        shell: bash
        run: ./scripts/check-module-bazel-lock.sh

      - name: ${{ matrix.shard && format('bazel test shard {0}/{1}', matrix.shard, matrix.shard_count) || 'bazel test //...' }}
        shell: bash
        env:
          BAZEL_TEST_SHARD: ${{ matrix.shard }}
          BAZEL_TEST_SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          bazel_targets=()
          if [[ -z "${BAZEL_TEST_SHARD:-}" ]]; then
            bazel_targets=(
              //...
              # Keep standalone V8 library targets out of the ordinary Bazel CI
              # path. V8 consumers under `//codex-rs/...` still participate
              # transitively through `//...`.
              -//third_party/v8:all
              -//codex-rs/v8-poc:v8-poc-unit-tests
              # Retain retired Windows-under-Wine fixtures for explicit use, not
              # as supported Linux/macOS product qualification.
              -//bazel/rules/testing/wine:wine-test-support-unit-tests
              -//codex-rs/core/tests/remote_env_windows:smoke-test
            )
          else
            shard_tmp_dir="$(mktemp -d)"
            trap 'rm -rf -- "${shard_tmp_dir}"' EXIT
            bazel_test_query='(//... except //third_party/v8:all except //codex-rs/v8-poc:v8-poc-unit-tests except //bazel/rules/testing/wine:wine-test-support-unit-tests except //codex-rs/core/tests/remote_env_windows:smoke-test) except attr(tags, "(\[|, )manual(,|\])", //...)'
            ./.github/scripts/run-bazel-query-ci.sh --output=label -- "${bazel_test_query}" \
              | LC_ALL=C sort > "${shard_tmp_dir}/targets.txt"
            : > "${shard_tmp_dir}/empty-durations.tsv"
            all_shard_files=()
            for ((shard = 1; shard <= BAZEL_TEST_SHARD_COUNT; shard++)); do
              python3 .github/scripts/select_windows_bazel_targets.py \
                --shard "${shard}" \
                --shard-count "${BAZEL_TEST_SHARD_COUNT}" \
                --durations "${shard_tmp_dir}/empty-durations.tsv" \
                < "${shard_tmp_dir}/targets.txt" \
                > "${shard_tmp_dir}/shard-${shard}.txt"
              all_shard_files+=("${shard_tmp_dir}/shard-${shard}.txt")
            done
            cat "${all_shard_files[@]}" | LC_ALL=C sort > "${shard_tmp_dir}/all-selected.txt"
            if ! diff -u "${shard_tmp_dir}/targets.txt" "${shard_tmp_dir}/all-selected.txt"; then
              echo "Bazel shard assignment does not cover the exact target inventory" >&2
              exit 1
            fi
            mapfile -t bazel_targets < "${shard_tmp_dir}/shard-${BAZEL_TEST_SHARD}.txt"
          fi

          bazel_wrapper_args=(
            --print-failed-action-summary
            --print-failed-test-logs
          )
          bazel_test_args=(
            test
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
          )
          if [[ -n "${BAZEL_TEST_SHARD:-}" ]]; then
            # Explicit query results must retain wildcard handling of targets
            # incompatible with this GNU or musl platform.
            bazel_test_args+=(--skip_incompatible_explicit_targets)
          fi
          ./.github/scripts/run-bazel-ci.sh \
            "${bazel_wrapper_args[@]}" \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-${{ matrix.target }}${{ matrix.shard && format('-shard-{0}-of-{1}', matrix.shard, matrix.shard_count) || '' }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  clippy:
    timeout-minutes: ${{ startsWith(matrix.os, 'macos-') && 180 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep Linux lint coverage on x64 and the arm64 macOS path exercised
          # by the Bazel test job.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    name: Bazel clippy on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}

      - name: bazel build --config=clippy lint targets
        shell: bash
        run: |
          bazel_clippy_args=(
            --config=clippy
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_job=clippy
          )
          bazel_target_lines="$(./scripts/list-bazel-clippy-targets.sh)"
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            -- \
            build \
            "${bazel_clippy_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-clippy-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  verify-release-build:
    timeout-minutes: ${{ startsWith(matrix.os, 'macos-') && 180 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    name: Verify release build on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}

      - name: bazel build verify-release-build targets
        shell: bash
        run: |
          # This job exists to compile Rust code behind
          # `cfg(not(debug_assertions))` so PR CI catches failures that would
          # otherwise show up only in a release build. We do not need the full
          # optimizer and debug-info work that normally comes with a release
          # build to get that signal, so keep Bazel in `fastbuild` and disable
          # Rust debug assertions explicitly.
          bazel_build_args=(
            --compilation_mode=fastbuild
            --@rules_rust//rust/settings:extra_rustc_flag=-Cdebug-assertions=no
            --@rules_rust//rust/settings:extra_exec_rustc_flag=-Cdebug-assertions=no
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_job=verify-release-build
            --build_metadata=TAG_rust_debug_assertions=off
          )
          bazel_target_lines="$(bash ./scripts/list-bazel-release-targets.sh)"
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"

          ./.github/scripts/run-bazel-ci.sh \
            -- \
            build \
            "${bazel_build_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Verify Bazel builds bwrap
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./.github/scripts/run-bazel-ci.sh \
            --remote-download-toplevel \
            --print-failed-action-summary \
            -- \
            build \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            --build_metadata=TAG_job=verify-bwrap \
            -- \
            //codex-rs/bwrap:bwrap

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-verify-release-build-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
