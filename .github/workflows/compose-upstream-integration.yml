name: Compose upstream integration candidate

on:
  push:
    branches:
      - integration/upstream-main-sync-20260906
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact integration branch head to compose from
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: compose-upstream-integration-integration-upstream-main-sync-20260906-008bbd5884122dc95aaece19ecfe0fc6a59dcf36
  cancel-in-progress: false

env:
  INTEGRATION_BRANCH: integration/upstream-main-sync-20260906
  UPSTREAM_URL: https://github.com/openai/codex.git
  UPSTREAM_SHA: 008bbd5884122dc95aaece19ecfe0fc6a59dcf36
  UPSTREAM_TREE: 721cd395f53962482b3f6d140d0b9942fef3baac

jobs:
  compose:
    if: github.event_name == 'workflow_dispatch' || github.event.before == 'b188e8016b2920351737f04bb7b2b30da56733cb'
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize composition receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p composition-receipt

      - name: Verify repository, branch, and expected head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "sednalabs/codex"
          test "${GITHUB_REF_NAME}" = "${INTEGRATION_BRANCH}"
          test "${EXPECTED_HEAD}" = "${GITHUB_SHA}" || {
            echo "dispatch expected_head must equal the selected run SHA" >&2
            exit 1
          }
          remote_head="$(git ls-remote origin "refs/heads/${INTEGRATION_BRANCH}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Fetch and verify pinned upstream cut
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          github_basic_auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${github_basic_auth}" \
            fetch --no-tags "${UPSTREAM_URL}" "${UPSTREAM_SHA}"
          test "$(git rev-parse "${UPSTREAM_SHA}^{commit}")" = "${UPSTREAM_SHA}"
          test "$(git rev-parse "${UPSTREAM_SHA}^{tree}")" = "${UPSTREAM_TREE}"

      - name: Compose hosted merge candidate
        id: compose
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          github_basic_auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          base_tree="$(git rev-parse HEAD^{tree})"
          upstream_tree="$(git rev-parse "${UPSTREAM_SHA}^{tree}")"
          remote_readback="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${github_basic_auth}" ls-remote origin "refs/heads/${INTEGRATION_BRANCH}" | awk '{print $1}')"
          if git merge-base --is-ancestor "${UPSTREAM_SHA}" HEAD; then
            echo "upstream cut is already composed into HEAD" >&2
            exit 1
          fi
          candidate_tree="${base_tree}"
          base_sha="$(git rev-parse HEAD)"
          materialized_sha=""
          materialized_tree=""
          export BASE_SHA="${base_sha}" BASE_TREE="${base_tree}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-ff --no-edit "${UPSTREAM_SHA}"; then
            merge_sha="$(git rev-parse HEAD)"
            merge_tree="$(git rev-parse HEAD^{tree})"
            candidate_tree="${merge_tree}"
            status="clean"
            conflict=false
          else
            status="conflict"
            conflict=true
            git status --short > composition-receipt/status.txt || true
            git diff --no-ext-diff > composition-receipt/diff.patch || true
            git diff --no-ext-diff --name-only --diff-filter=U > composition-receipt/unmerged.txt || true
            git diff --cached --no-ext-diff --binary --diff-filter=ACDMRTXB > composition-receipt/staged-auto-merge.patch || true
            git diff --cached --no-ext-diff --name-only --diff-filter=ACDMRTXB |
              LC_ALL=C sort -u > composition-receipt/staged-auto-merge.txt || true
            python3 - <<'PY'
          if True:
            import hashlib, json, os

            with open("composition-receipt/unmerged.txt") as f:
                paths = sorted({line.strip() for line in f if line.strip()})
            path_bytes = ("\n".join(paths) + ("\n" if paths else "")).encode()
            path_digest = hashlib.sha256(path_bytes).hexdigest()
            with open("composition-receipt/staged-auto-merge.txt", "rb") as f:
                staged_paths_bytes = f.read()
            staged_paths = [line for line in staged_paths_bytes.splitlines() if line]
            staged_path_digest = hashlib.sha256(staged_paths_bytes).hexdigest()
            with open("composition-receipt/staged-auto-merge.patch", "rb") as f:
                staged_patch_digest = hashlib.sha256(f.read()).hexdigest()

            def build_ci_path(p):
                root_name = p.rsplit("/", 1)[-1]
                return (p.startswith((".github/", ".codex/", "build/", "defs/")) or
                        root_name in {"BUILD", "BUILD.bazel"} or
                        root_name.endswith((".bzl", ".bazel")) or
                        ("/" not in p and (root_name in {
                            "Cargo.lock", "Makefile", "Justfile", "justfile", "MODULE.bazel",
                            "pnpm-lock.yaml", "package-lock.json", "yarn.lock", "bun.lockb", "Cargo.toml",
                            "package.json", "WORKSPACE", "WORKSPACE.bazel", ".bazelrc", "BUILD", "BUILD.bazel",
                            "go.mod", "go.sum", "requirements.txt", "pyproject.toml", "rust-toolchain.toml",
                        } or root_name.endswith((".lock", ".lockb")))))

            cohort_specs = [
                ("build-ci-generated", build_ci_path, "build-ci-owner",
                 "preserve workflow/build graph/lock/generated source-of-truth behavior",
                 "hosted docs/attestation/artifact/repo-checks/lock/generated checks"),
                ("sdk-public-contract", lambda p: p.startswith("sdk/"), "sdk-owner",
                 "preserve public SDK API/serialization behavior", "hosted sdk/package checks"),
                ("app-server-protocol-transport", lambda p: p.startswith(("app-server-protocol/", "codex-rs/app-server", "codex-rs/codex-api/", "codex-rs/codex-mcp/", "codex-rs/realtime-webrtc/")), "app-server-owner",
                 "preserve schema/transport/auth/retry/account/history behavior", "hosted ui-protocol/startup-sync/product-surfaces/schema checks"),
                ("tui-history", lambda p: p.startswith(("codex-rs/tui/", "codex-rs/core/src/session/")), "tui-owner",
                 "preserve transcript/history/queue/interrupt/usage/resume behavior", "hosted ui-protocol/subagents/ledger lanes"),
                ("core-agent-lifecycle", lambda p: p.startswith("codex-rs/"), "core-agent-owner",
                 "preserve fork-owned agent/session/permission/provider behavior", "hosted core/agent/session targeted lanes plus current carry-ledger evidence"),
                ("docs-policy", lambda p: p.startswith(("docs/", "patches/")), "docs-policy-owner",
                 "preserve operator-facing policy/provenance", "hosted docs/attestation checks"),
                ("unclassified-user-judgment", lambda p: True, "user-judgment-owner",
                 "preserve by deferral", "no proof until authority decision"),
            ]
            cohorts = []
            remaining = paths[:]
            for name, matches, owner, preserved, proof in cohort_specs:
                selected = [p for p in remaining if matches(p)]
                remaining = [p for p in remaining if p not in selected]
                selected_bytes = ("\n".join(selected) + ("\n" if selected else "")).encode()
                cohorts.append({
                    "name": name,
                    "path_count": len(selected),
                    "path_set_sha256": hashlib.sha256(selected_bytes).hexdigest(),
                    "representative_paths": selected[:12],
                    "authority_owner": owner,
                    "equivalence_sources": [
                        "docs/carry-divergence-ledger.md#Current Live Divergences (43 headings)",
                        "docs/upstream-sync/2026-07-28.md (historical harvest seed only)",
                        "Ops w11999#56611",
                    ],
                    "preserved_behaviors": preserved,
                    "hosted_proof_requirements": proof,
                    "resolution_mode": "defer_pending_authority" if name == "unclassified-user-judgment" else "manual_authority_review",
                    "user_judgment": name == "unclassified-user-judgment",
                    "equivalence_status": "remains_to_be_checked_against_exact_current_cut",
                })
            manifest = {
                "schema": "hosted-conflict-manifest",
                "version": 1,
                "repository": os.environ["GITHUB_REPOSITORY"],
                "branch": os.environ["INTEGRATION_BRANCH"],
                "expected_head": os.environ["EXPECTED_HEAD"],
                "run_id": os.environ["GITHUB_RUN_ID"],
                "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                "event": os.environ["GITHUB_EVENT_NAME"],
                "base_sha": os.environ["BASE_SHA"],
                "base_tree": os.environ["BASE_TREE"],
                "upstream_sha": os.environ["UPSTREAM_SHA"],
                "upstream_tree": os.environ["UPSTREAM_TREE"],
                "total_unmerged_path_count": len(paths),
                "path_set_sha256": path_digest,
                "staged_auto_merge_patch": "composition-receipt/staged-auto-merge.patch",
                "staged_auto_merge_patch_sha256": staged_patch_digest,
                "staged_auto_merge_path_list": "composition-receipt/staged-auto-merge.txt",
                "staged_auto_merge_path_count": len(staged_paths),
                "staged_auto_merge_path_set_sha256": staged_path_digest,
                "cohorts": cohorts,
                "resolution_notice": "No path-name-only merge decision; automatic ours/theirs resolution is not implied.",
            }
            with open("composition-receipt/conflict-manifest.json", "w") as f:
                json.dump(manifest, f, indent=2, sort_keys=True)
                f.write("\n")
            with open("composition-receipt/manifest-summary.env", "w") as f:
                f.write(
                    f"MANIFEST_TOTAL={len(paths)}\n"
                    f"MANIFEST_DIGEST={path_digest}\n"
                    f"STAGED_AUTO_MERGE_TOTAL={len(staged_paths)}\n"
                    f"STAGED_AUTO_MERGE_DIGEST={staged_path_digest}\n"
                    f"STAGED_AUTO_MERGE_PATCH_DIGEST={staged_patch_digest}\n"
                )
          PY
          test -s composition-receipt/staged-auto-merge.patch
          test -s composition-receipt/manifest-summary.env
          . composition-receipt/manifest-summary.env
          staged_path_digest="${STAGED_AUTO_MERGE_DIGEST}"
          test -n "${staged_path_digest}"
          materialize_dir="${RUNNER_TEMP}/upstream-preconflict-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git worktree add --detach --force "${materialize_dir}" "${base_sha}"
          cleanup_materialize() {
            git worktree remove --force "${materialize_dir}" || true
          }
          trap cleanup_materialize EXIT
          git -C "${materialize_dir}" apply --index --binary --whitespace=nowarn "${GITHUB_WORKSPACE}/composition-receipt/staged-auto-merge.patch"
          test -z "$(git -C "${materialize_dir}" ls-files --unmerged)"
          materialized_paths_digest="$(git -C "${materialize_dir}" diff --cached --name-only --diff-filter=ACDMRTXB | LC_ALL=C sort -u | sha256sum | awk '{print $1}')"
          test "${materialized_paths_digest}" = "${staged_path_digest}"
          git -C "${materialize_dir}" config user.name "github-actions[bot]"
          git -C "${materialize_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${materialize_dir}" commit -m "chore: materialize upstream pre-conflict base"
          materialized_sha="$(git -C "${materialize_dir}" rev-parse HEAD)"
          materialized_tree="$(git -C "${materialize_dir}" rev-parse HEAD^{tree})"
          export materialized_sha materialized_tree
          {
            echo "- pre-conflict materialized SHA/tree: ${materialized_sha} (${materialized_tree})"
            echo "- pre-conflict materialized transport: github-actions-artifact"
          } >> "$GITHUB_STEP_SUMMARY"
          merge_sha=""
          merge_tree=""
          fi
          manifest_total=0
          manifest_digest=""
          staged_auto_merge_total=0
          staged_auto_merge_digest=""
          staged_auto_merge_patch_digest=""
          if test -f composition-receipt/manifest-summary.env; then
            . composition-receipt/manifest-summary.env
            manifest_total="${MANIFEST_TOTAL}"
            manifest_digest="${MANIFEST_DIGEST}"
            staged_auto_merge_total="${STAGED_AUTO_MERGE_TOTAL}"
            staged_auto_merge_digest="${STAGED_AUTO_MERGE_DIGEST}"
            staged_auto_merge_patch_digest="${STAGED_AUTO_MERGE_PATCH_DIGEST}"
          fi
          if test "${conflict}" = true; then
            test -n "${staged_path_digest}"
            test "${staged_path_digest}" = "${staged_auto_merge_digest}"
          fi
          export base_tree upstream_tree remote_readback merge_sha merge_tree candidate_tree status conflict
          export materialized_sha materialized_tree
          export manifest_total manifest_digest staged_auto_merge_total staged_auto_merge_digest staged_auto_merge_patch_digest
          python3 - <<'PY'
          import json, os
          receipt = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["INTEGRATION_BRANCH"],
              "expected_head": os.environ["EXPECTED_HEAD"],
              "base_sha": os.environ["BASE_SHA"],
              "base_tree": os.environ["base_tree"],
              "candidate_tree": os.environ["candidate_tree"],
              "upstream_url": os.environ["UPSTREAM_URL"],
              "upstream_sha": os.environ["UPSTREAM_SHA"],
              "upstream_tree": os.environ["upstream_tree"],
              "merge_candidate_sha": os.environ.get("merge_sha", ""),
              "merge_candidate_tree": os.environ.get("merge_tree", ""),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "pre_merge_remote_readback": os.environ["remote_readback"],
              "status": os.environ["status"],
              "conflict": os.environ["conflict"] == "true",
              "conflict_manifest": "composition-receipt/conflict-manifest.json" if os.environ["conflict"] == "true" else "",
              "total_unmerged_path_count": int(os.environ.get("manifest_total", "0")),
              "unmerged_path_set_sha256": os.environ.get("manifest_digest", ""),
              "staged_auto_merge_patch": "composition-receipt/staged-auto-merge.patch" if os.environ["conflict"] == "true" else "",
              "staged_auto_merge_patch_sha256": os.environ.get("staged_auto_merge_patch_digest", ""),
              "staged_auto_merge_path_list": "composition-receipt/staged-auto-merge.txt" if os.environ["conflict"] == "true" else "",
              "staged_auto_merge_path_count": int(os.environ.get("staged_auto_merge_total", "0")),
              "staged_auto_merge_path_set_sha256": os.environ.get("staged_auto_merge_digest", ""),
              "pre_conflict_materialized_sha": os.environ.get("materialized_sha", ""),
              "pre_conflict_materialized_tree": os.environ.get("materialized_tree", ""),
              "pre_conflict_materialized_transport": "github-actions-artifact" if os.environ.get("materialized_sha", "") else "",
          }
          with open("composition-receipt/receipt.json", "w") as f:
              json.dump(receipt, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          if test -n "${materialized_sha}"; then
            test -n "${materialized_tree}"
            bundle_ref_prefix="refs/w13825-materialized-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            bundle_materialized_ref="${bundle_ref_prefix}/materialized"
            bundle_base_ref="${bundle_ref_prefix}/base"
            bundle_upstream_ref="${bundle_ref_prefix}/upstream"
            cleanup_bundle_refs() {
              cleanup_materialize
              git update-ref -d "${bundle_materialized_ref}" || true
              git update-ref -d "${bundle_base_ref}" || true
              git update-ref -d "${bundle_upstream_ref}" || true
            }
            trap cleanup_bundle_refs EXIT
            git update-ref "${bundle_materialized_ref}" "${materialized_sha}"
            git update-ref "${bundle_base_ref}" "${base_sha}"
            git update-ref "${bundle_upstream_ref}" "${UPSTREAM_SHA}"
            test "$(git rev-parse "${bundle_materialized_ref}")" = "${materialized_sha}"
            test "$(git rev-parse "${bundle_base_ref}")" = "${base_sha}"
            test "$(git rev-parse "${bundle_upstream_ref}")" = "${UPSTREAM_SHA}"
            git bundle create composition-receipt/materialized.bundle \
              "${bundle_materialized_ref}" "${bundle_base_ref}" "${bundle_upstream_ref}"
            git bundle verify composition-receipt/materialized.bundle
            bundle_sha256="$(sha256sum composition-receipt/materialized.bundle | awk '{print $1}')"
            receipt_sha256="$(sha256sum composition-receipt/receipt.json | awk '{print $1}')"
            manifest_sha256=""
            if test -f composition-receipt/conflict-manifest.json; then
              manifest_sha256="$(sha256sum composition-receipt/conflict-manifest.json | awk '{print $1}')"
            fi
            staged_patch_sha256=""
            if test -f composition-receipt/staged-auto-merge.patch; then
              staged_patch_sha256="$(sha256sum composition-receipt/staged-auto-merge.patch | awk '{print $1}')"
            fi
            staged_paths_sha256=""
            if test -f composition-receipt/staged-auto-merge.txt; then
              staged_paths_sha256="$(sha256sum composition-receipt/staged-auto-merge.txt | awk '{print $1}')"
            fi
            export bundle_sha256 receipt_sha256 manifest_sha256 staged_patch_sha256 staged_paths_sha256
            python3 - <<'PY'
          import json, os
          metadata = {
              "schema": "hosted-materialized-provenance",
              "version": 1,
              "signed": False,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_head": os.environ["EXPECTED_HEAD"],
              "base_sha": os.environ["BASE_SHA"],
              "base_tree": os.environ["base_tree"],
              "upstream_sha": os.environ["UPSTREAM_SHA"],
              "upstream_tree": os.environ["upstream_tree"],
              "materialized_sha": os.environ["materialized_sha"],
              "materialized_tree": os.environ["materialized_tree"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "bundle": "composition-receipt/materialized.bundle",
              "bundle_sha256": os.environ["bundle_sha256"],
              "receipt": "composition-receipt/receipt.json",
              "receipt_sha256": os.environ["receipt_sha256"],
              "conflict_manifest": "composition-receipt/conflict-manifest.json" if os.environ.get("manifest_sha256") else "",
              "conflict_manifest_sha256": os.environ.get("manifest_sha256", ""),
              "staged_auto_merge_patch": "composition-receipt/staged-auto-merge.patch" if os.environ.get("staged_patch_sha256") else "",
              "staged_auto_merge_patch_sha256": os.environ.get("staged_patch_sha256", ""),
              "staged_auto_merge_path_list": "composition-receipt/staged-auto-merge.txt" if os.environ.get("staged_paths_sha256") else "",
              "staged_auto_merge_path_list_sha256": os.environ.get("staged_paths_sha256", ""),
              "consumer_contract": [
                  "download the exact upstream-composition-${run_id}-${run_attempt} artifact",
                  "verify run/attempt, repository, all SHA-256 digests, and materialized SHA/tree",
                  "verify the Git bundle before importing its materialized commit into a hosted ref",
                  "do not merge, resolve, or archive-extract locally",
              ],
          }
          with open("composition-receipt/provenance.json", "w") as f:
              json.dump(metadata, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
            test -s composition-receipt/materialized.bundle
            test -s composition-receipt/provenance.json
            python3 - <<'PY'
          import hashlib, json, os
          def digest(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          with open("composition-receipt/provenance.json") as f:
              metadata = json.load(f)
          with open("composition-receipt/receipt.json") as f:
              receipt = json.load(f)
          required = {
              "workflow_head": os.environ["EXPECTED_HEAD"],
              "base_sha": os.environ["BASE_SHA"],
              "base_tree": os.environ["base_tree"],
              "upstream_sha": os.environ["UPSTREAM_SHA"],
              "upstream_tree": os.environ["upstream_tree"],
              "materialized_sha": os.environ["materialized_sha"],
              "materialized_tree": os.environ["materialized_tree"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          for key, value in required.items():
              if metadata.get(key) != value:
                  raise SystemExit(f"provenance mismatch: {key}")
          if metadata.get("signed") is not False:
              raise SystemExit("provenance must remain explicitly unsigned")
          if metadata["bundle_sha256"] != digest(metadata["bundle"]):
              raise SystemExit("materialized bundle digest mismatch")
          if metadata["receipt_sha256"] != digest(metadata["receipt"]):
              raise SystemExit("receipt digest mismatch")
          if receipt.get("pre_conflict_materialized_sha") != metadata["materialized_sha"] or receipt.get("pre_conflict_materialized_tree") != metadata["materialized_tree"]:
              raise SystemExit("receipt/materialized identity mismatch")
          for key, path_key in (("conflict_manifest_sha256", "conflict_manifest"), ("staged_auto_merge_patch_sha256", "staged_auto_merge_patch"), ("staged_auto_merge_path_list_sha256", "staged_auto_merge_path_list")):
              if metadata.get(path_key):
                  if metadata.get(key) != digest(metadata[path_key]):
                      raise SystemExit(f"evidence digest mismatch: {path_key}")
          PY
          fi
          {
            echo "### Hosted upstream composition"
            echo "- repository: ${GITHUB_REPOSITORY}"
            echo "- branch: ${INTEGRATION_BRANCH}"
            echo "- expected head: ${EXPECTED_HEAD}"
            echo "- base tree: ${base_tree}"
            echo "- candidate tree: ${candidate_tree}"
            echo "- upstream URL: ${UPSTREAM_URL}"
            echo "- upstream SHA/tree: ${UPSTREAM_SHA} (${upstream_tree})"
            echo "- merge candidate SHA/tree: ${merge_sha:-} (${merge_tree:-})"
            echo "- run ID/attempt: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo "- event: ${GITHUB_EVENT_NAME}"
            echo "- remote readback: ${remote_readback}"
            echo "- result: ${status}"
            if test "${conflict}" = true; then
              echo "- conflict manifest: composition-receipt/conflict-manifest.json"
              echo "- total unmerged paths: ${manifest_total}"
              echo "- overall path-set SHA-256: ${manifest_digest}"
              echo "- staged auto-merge patch: composition-receipt/staged-auto-merge.patch"
              echo "- staged auto-merge patch SHA-256: ${staged_auto_merge_patch_digest}"
              echo "- staged auto-merge paths: composition-receipt/staged-auto-merge.txt"
              echo "- staged auto-merge path count: ${staged_auto_merge_total}"
              echo "- staged auto-merge path-set SHA-256: ${staged_auto_merge_digest}"
            else
              echo "- conflict manifest: not generated (clean merge)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test "${conflict}" = false

      - name: Re-read remote and push candidate
        if: steps.compose.outcome == 'success'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          github_basic_auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          remote_head="$(git ls-remote origin "refs/heads/${INTEGRATION_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${EXPECTED_HEAD}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${github_basic_auth}" \
            push origin "HEAD:refs/heads/${INTEGRATION_BRANCH}"
          post_push_remote_readback="$(git ls-remote origin "refs/heads/${INTEGRATION_BRANCH}" | awk '{print $1}')"
          merge_candidate_sha="$(git rev-parse HEAD)"
          test "${post_push_remote_readback}" = "${merge_candidate_sha}"
          python3 - "${post_push_remote_readback}" <<'PY'
          import json, sys
          path = "composition-receipt/receipt.json"
          with open(path) as f:
              receipt = json.load(f)
          receipt["post_push_remote_readback"] = sys.argv[1]
          with open(path, "w") as f:
              json.dump(receipt, f, indent=2, sort_keys=True)
              f.write("\n")
          PY

      - name: Upload composition evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: upstream-composition-${{ github.run_id }}-${{ github.run_attempt }}
          path: composition-receipt
          if-no-files-found: error

  verify-hosted-artifact:
    needs: compose
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.before == 'b188e8016b2920351737f04bb7b2b30da56733cb')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact workflow candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: verifier-checkout

      - name: Download exact composition evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-composition-${{ github.run_id }}-${{ github.run_attempt }}
          path: composition-receipt

      - name: Verify hosted composition evidence
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head || github.sha }}
        run: |
          set -euo pipefail
          EXPECTED_BASE_SHA="$(git -C verifier-checkout rev-parse HEAD)"
          EXPECTED_BASE_TREE="$(git -C verifier-checkout rev-parse HEAD^{tree})"
          export EXPECTED_BASE_SHA EXPECTED_BASE_TREE
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import tempfile

          root = pathlib.Path("composition-receipt")
          expected_head = os.environ["EXPECTED_HEAD"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          expected_base_sha = os.environ["EXPECTED_BASE_SHA"]
          expected_base_tree = os.environ["EXPECTED_BASE_TREE"]
          expected = {
              "bundle": root / "materialized.bundle",
              "receipt": root / "receipt.json",
              "provenance": root / "provenance.json",
              "manifest": root / "conflict-manifest.json",
              "staged_patch": root / "staged-auto-merge.patch",
              "staged_paths": root / "staged-auto-merge.txt",
              "summary": root / "manifest-summary.env",
          }
          for name, path in expected.items():
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty evidence: {name}")

          def load(name):
              with expected[name].open() as stream:
                  return json.load(stream)

          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          receipt = load("receipt")
          provenance = load("provenance")
          manifest = load("manifest")
          if provenance.get("signed") is not False:
              raise SystemExit("provenance must remain explicitly unsigned")
          if provenance.get("repository") != "sednalabs/codex":
              raise SystemExit("repository mismatch")
          required_provenance = {
              "workflow_head": expected_head,
              "base_sha": expected_base_sha,
              "base_tree": expected_base_tree,
              "upstream_sha": "008bbd5884122dc95aaece19ecfe0fc6a59dcf36",
              "upstream_tree": "721cd395f53962482b3f6d140d0b9942fef3baac",
              "run_id": run_id,
              "run_attempt": run_attempt,
          }
          for key, value in required_provenance.items():
              if str(provenance.get(key)) != value:
                  raise SystemExit(f"provenance mismatch: {key}")
          if not provenance.get("materialized_sha") or not provenance.get("materialized_tree"):
              raise SystemExit("materialized identity is empty")

          required_receipt = {
              "repository": "sednalabs/codex",
              "expected_head": expected_head,
              "base_sha": expected_base_sha,
              "base_tree": required_provenance["base_tree"],
              "upstream_sha": required_provenance["upstream_sha"],
              "upstream_tree": required_provenance["upstream_tree"],
              "run_id": run_id,
              "run_attempt": run_attempt,
              "pre_conflict_materialized_sha": provenance["materialized_sha"],
              "pre_conflict_materialized_tree": provenance["materialized_tree"],
          }
          for key, value in required_receipt.items():
              if str(receipt.get(key)) != value:
                  raise SystemExit(f"receipt mismatch: {key}")

          digest_fields = {
              "bundle": "bundle_sha256",
              "receipt": "receipt_sha256",
              "manifest": "conflict_manifest_sha256",
              "staged_patch": "staged_auto_merge_patch_sha256",
              "staged_paths": "staged_auto_merge_path_list_sha256",
          }
          digests = {name: digest(path) for name, path in expected.items() if name in digest_fields}
          for name, field in digest_fields.items():
              if provenance.get(field) != digests[name]:
                  raise SystemExit(f"digest mismatch: {field}")
          if receipt.get("staged_auto_merge_patch_sha256") != digests["staged_patch"] or receipt.get("staged_auto_merge_path_set_sha256") != digests["staged_paths"]:
              raise SystemExit("receipt evidence digest mismatch")
          if manifest.get("total_unmerged_path_count") != 427 or manifest.get("path_set_sha256") != "7568a0be65dc7c05f591197a49b0b4e18f2c4435b951097d206cb37626233b62":
              raise SystemExit("conflict manifest identity mismatch")
          required_cohorts = {
              "build-ci-generated",
              "sdk-public-contract",
              "app-server-protocol-transport",
              "tui-history",
              "core-agent-lifecycle",
              "docs-policy",
          }
          cohorts = manifest.get("cohorts")
          if not isinstance(cohorts, list) or not required_cohorts.issubset({c.get("name") for c in cohorts}):
              raise SystemExit("required conflict cohorts missing")
          if sum(int(c.get("path_count", -1)) for c in cohorts) != 427:
              raise SystemExit("conflict cohort counts do not sum to 427")

          bundle = str(expected["bundle"])
          with tempfile.TemporaryDirectory(prefix="hosted-artifact-verify-") as directory:
              bare = pathlib.Path(directory) / "repo.git"
              subprocess.run(["git", "init", "--bare", str(bare)], check=True, stdout=subprocess.DEVNULL)
              verify = subprocess.run(["git", "-C", str(bare), "bundle", "verify", bundle], check=True, text=True, capture_output=True)
              list_heads = subprocess.check_output(["git", "-C", str(bare), "bundle", "list-heads", bundle], text=True).strip().splitlines()
              prefix = f"refs/w13825-materialized-{run_id}-{run_attempt}"
              expected_refs = {
                  f"{prefix}/materialized": provenance["materialized_sha"],
                  f"{prefix}/base": provenance["base_sha"],
                  f"{prefix}/upstream": provenance["upstream_sha"],
              }
              listed = {}
              for line in list_heads:
                  oid, ref = line.split()
                  listed[ref] = oid
              if listed != expected_refs:
                  raise SystemExit("bundle heads do not match exact run-scoped refs")
              for ref, target in ((f"{prefix}/materialized", "materialized"), (f"{prefix}/base", "base"), (f"{prefix}/upstream", "upstream")):
                  subprocess.run(["git", "-C", str(bare), "fetch", bundle, f"+{ref}:refs/import/{target}"], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              imported = {name: subprocess.check_output(["git", "-C", str(bare), "rev-parse", f"refs/import/{name}"], text=True).strip() for name in ("materialized", "base", "upstream")}
              if imported != {"materialized": provenance["materialized_sha"], "base": provenance["base_sha"], "upstream": provenance["upstream_sha"]}:
                  raise SystemExit("imported ref identity mismatch")
              materialized_tree = subprocess.check_output(["git", "-C", str(bare), "rev-parse", "refs/import/materialized^{tree}"], text=True).strip()
              if materialized_tree != provenance["materialized_tree"]:
                  raise SystemExit("materialized tree mismatch")
              parent = subprocess.check_output(["git", "-C", str(bare), "rev-parse", "refs/import/materialized^"], text=True).strip()
              if parent != provenance["base_sha"]:
                  raise SystemExit("materialized parent does not equal current base")

          result = {
              "repository": "sednalabs/codex",
              "expected_head": expected_head,
              "base_tree": provenance["base_tree"],
              "upstream_sha": provenance["upstream_sha"],
              "upstream_tree": provenance["upstream_tree"],
              "materialized_sha": provenance["materialized_sha"],
              "materialized_tree": provenance["materialized_tree"],
              "run_id": run_id,
              "run_attempt": run_attempt,
              "bundle_sha256": digests["bundle"],
              "receipt_sha256": digests["receipt"],
              "manifest_sha256": digests["manifest"],
              "staged_patch_sha256": digests["staged_patch"],
              "staged_paths_sha256": digests["staged_paths"],
              "bundle_heads": listed,
          }
          line = "HOSTED_ARTIFACT_VERIFICATION=" + json.dumps(result, sort_keys=True, separators=(",", ":"))
          print(line)
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write(line + "\n")
          PY
