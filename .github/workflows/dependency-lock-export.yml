name: Temporary RustSec 2026-0387 lock export

on:
  push:
    branches:
      - codex/w14939-rustsec-2026-0387-lock-export

permissions:
  contents: read

jobs:
  export:
    name: Export Cargo and Bazel locks on hosted Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

      - name: Resolve the approved consumer versions
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path codex-rs/Cargo.toml -p rtc@0.20.3 --precise 0.21.1
          cargo metadata --manifest-path codex-rs/Cargo.toml --format-version 1 --locked >/dev/null

      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.30.0

      - name: Resolve Bazel module lock
        shell: bash
        run: bazel mod deps --lockfile_mode=update

      - name: Validate and package the lock delta
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git status --short --untracked-files=all)"
          expected=$' M MODULE.bazel.lock\n M codex-rs/Cargo.lock'
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected generated paths or missing lock updates:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          git diff --check
          git diff --binary -- MODULE.bazel.lock codex-rs/Cargo.lock > "$RUNNER_TEMP/crypto-lock-delta.patch"

      - name: Upload generated lock files and dependency diff
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rustsec-2026-0387-lock-export
          if-no-files-found: error
          path: |
            MODULE.bazel.lock
            codex-rs/Cargo.lock
            ${{ runner.temp }}/crypto-lock-delta.patch
