name: validation-named-tests

run-name: >-
  ${{ inputs.core_runtime_diagnostic_only
      && 'core-runtime-diagnostic-only/not-whole-target'
      || inputs.runtime_preparation_only
      && 'runtime-preflight-only'
      || format('validation-named-tests/{0}', inputs.profile) }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character candidate commit SHA to validate
        required: true
        type: string
      base_ref:
        description: Comparison base ref recorded in the H/B/T receipt
        required: true
        default: main
        type: string
      base_sha:
        description: Exact 40-character comparison base commit SHA (B)
        required: true
        type: string
      profile:
        description: Hosted environment profile
        required: true
        type: choice
        options:
          - rust_minimal
          - rust_integration
        default: rust_minimal
      request_json:
        description: JSON rust-tests-v1 typed request (no shell commands or flags)
        required: true
        type: string
      runtime_preparation_only:
        description: >-
          Build only the fixed codex-core integration runtime prerequisites;
          does not run tests
        required: false
        type: boolean
        default: false
      core_runtime_diagnostic_only:
        description: Sample only the fixed two core diagnostic cases; never qualifies the full target
        required: false
        type: boolean
        default: false

concurrency:
  group: validation-named-tests/${{ inputs.target_sha }}/${{ inputs.base_ref }}/${{ inputs.profile }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  named_tests:
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_ref }}
      base_sha: ${{ inputs.base_sha }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      request_json: ${{ inputs.request_json }}
      runtime_preparation_only: ${{ inputs.runtime_preparation_only }}
      core_runtime_diagnostic_only: ${{ inputs.core_runtime_diagnostic_only }}
      artifact_name: validation-named-tests-${{ github.run_id }}
