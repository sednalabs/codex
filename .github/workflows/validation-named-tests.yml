name: validation-named-tests

run-name: >-
  validation-named-tests/${{ inputs.profile }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character candidate commit SHA to validate
        required: true
        type: string
      base_ref:
        description: Comparison base ref recorded in the H/B/T receipt
        required: true
        default: main
        type: string
      profile:
        description: Hosted environment profile
        required: true
        type: choice
        options:
          - rust_minimal
          - rust_integration
        default: rust_minimal
      prepare_codex_cli_for_exact_usage_test:
        description: Stage the exact ae94 package binaries for the fixed usage integration selector set
        required: false
        type: boolean
        default: false
      run_ae94_android_helper_tests:
        description: Run the fixed ae94 Android helper library test set
        required: false
        type: boolean
        default: false
      run_ae94_tui_provider_tests:
        description: Run the fixed ae94 TUI Browser, Android, and Desktop provider test set
        required: false
        type: boolean
        default: false
      run_d0_active_wait_test:
        description: Run the fixed d0 active-wait test for operator-steer wakeup
        required: false
        type: boolean
        default: false
      request_json:
        description: JSON rust-tests-v1 typed request (no shell commands or flags)
        required: true
        type: string

concurrency:
  group: validation-named-tests/${{ inputs.target_sha }}/${{ inputs.base_ref }}/${{ inputs.profile }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reject_conflicting_modes:
    if: >-
      ${{
        (inputs.prepare_codex_cli_for_exact_usage_test == true && inputs.run_ae94_android_helper_tests == true) ||
        (inputs.prepare_codex_cli_for_exact_usage_test == true && inputs.run_ae94_tui_provider_tests == true) ||
        (inputs.prepare_codex_cli_for_exact_usage_test == true && inputs.run_d0_active_wait_test == true) ||
        (inputs.run_ae94_android_helper_tests == true && inputs.run_ae94_tui_provider_tests == true) ||
        (inputs.run_ae94_android_helper_tests == true && inputs.run_d0_active_wait_test == true) ||
        (inputs.run_ae94_tui_provider_tests == true && inputs.run_d0_active_wait_test == true)
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: none
    steps:
      - name: Reject conflicting special modes
        shell: bash
        run: |
          echo "Select only one fixed special validation mode." >&2
          exit 1

  named_tests:
    if: >-
      ${{ inputs.prepare_codex_cli_for_exact_usage_test != true && inputs.run_ae94_android_helper_tests != true && inputs.run_ae94_tui_provider_tests != true && inputs.run_d0_active_wait_test != true }}
    permissions:
      contents: read
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_ref }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      prepare_codex_cli_for_exact_usage_test: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
      run_ae94_android_helper_tests: ${{ inputs.run_ae94_android_helper_tests }}
      run_ae94_tui_provider_tests: ${{ inputs.run_ae94_tui_provider_tests }}
      run_d0_active_wait_test: ${{ inputs.run_d0_active_wait_test }}
      request_json: ${{ inputs.request_json }}
      artifact_name: validation-named-tests-${{ github.run_id }}

  named_tests_with_exact_package:
    if: >-
      ${{ inputs.prepare_codex_cli_for_exact_usage_test == true && inputs.run_ae94_android_helper_tests != true && inputs.run_ae94_tui_provider_tests != true && inputs.run_d0_active_wait_test != true }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_ref }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      prepare_codex_cli_for_exact_usage_test: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
      run_ae94_android_helper_tests: ${{ inputs.run_ae94_android_helper_tests }}
      run_ae94_tui_provider_tests: ${{ inputs.run_ae94_tui_provider_tests }}
      run_d0_active_wait_test: ${{ inputs.run_d0_active_wait_test }}
      request_json: ${{ inputs.request_json }}
      artifact_name: validation-named-tests-${{ github.run_id }}

  named_tests_for_ae94_android:
    if: >-
      ${{ inputs.run_ae94_android_helper_tests == true && inputs.prepare_codex_cli_for_exact_usage_test != true && inputs.run_ae94_tui_provider_tests != true && inputs.run_d0_active_wait_test != true }}
    permissions:
      contents: read
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_ref }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      prepare_codex_cli_for_exact_usage_test: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
      run_ae94_android_helper_tests: ${{ inputs.run_ae94_android_helper_tests }}
      run_ae94_tui_provider_tests: ${{ inputs.run_ae94_tui_provider_tests }}
      run_d0_active_wait_test: ${{ inputs.run_d0_active_wait_test }}
      request_json: ${{ inputs.request_json }}
      artifact_name: validation-named-tests-${{ github.run_id }}

  named_tests_for_ae94_tui_providers:
    if: >-
      ${{ inputs.run_ae94_tui_provider_tests == true && inputs.prepare_codex_cli_for_exact_usage_test != true && inputs.run_ae94_android_helper_tests != true && inputs.run_d0_active_wait_test != true }}
    permissions:
      contents: read
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_ref }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      prepare_codex_cli_for_exact_usage_test: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
      run_ae94_android_helper_tests: ${{ inputs.run_ae94_android_helper_tests }}
      run_ae94_tui_provider_tests: ${{ inputs.run_ae94_tui_provider_tests }}
      run_d0_active_wait_test: ${{ inputs.run_d0_active_wait_test }}
      request_json: ${{ inputs.request_json }}
      artifact_name: validation-named-tests-${{ github.run_id }}

  named_tests_for_d0_active_wait:
    if: >-
      ${{ inputs.run_d0_active_wait_test == true && inputs.prepare_codex_cli_for_exact_usage_test != true && inputs.run_ae94_android_helper_tests != true && inputs.run_ae94_tui_provider_tests != true }}
    permissions:
      contents: read
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_ref }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      prepare_codex_cli_for_exact_usage_test: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
      run_ae94_android_helper_tests: ${{ inputs.run_ae94_android_helper_tests }}
      run_ae94_tui_provider_tests: ${{ inputs.run_ae94_tui_provider_tests }}
      run_d0_active_wait_test: ${{ inputs.run_d0_active_wait_test }}
      request_json: ${{ inputs.request_json }}
      artifact_name: validation-named-tests-${{ github.run_id }}
