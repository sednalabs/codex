name: validation-responses-attribution-compat

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: validation-responses-attribution-compat-82f3bef4
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "8388608"
      SOURCE_SHA: 82f3bef4826a0552f5070ec7431f670443b60bec
      BASE_SHA: e20b2dc9a96c08b9ae7f38298d098ed01af68e87
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 82f3bef4826a0552f5070ec7431f670443b60bec
          persist-credentials: false
      - name: Verify exact source and fetch comparison runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA"
          mkdir evidence
          printf 'source=%s\nbase=%s\nworkflow=%s\n' "$SOURCE_SHA" "$BASE_SHA" "$GITHUB_SHA" > evidence/identity.txt
      - uses: ./.github/actions/setup-ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Bind Node runtime
        shell: bash
        run: echo "CODEX_JS_REPL_NODE_PATH=$(command -v node)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Install native build prerequisites
        shell: bash
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
      - name: Verify and consume the exact packaged Code Mode host
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 5d5a60c151d617eafffe203fd02b733e03e01788
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import types

          helper_sha = "5d5a60c151d617eafffe203fd02b733e03e01788"
          source = subprocess.check_output(["git", "show", f"{helper_sha}:scripts/install_branch_artifact"])
          blob = hashlib.sha1(f"blob {len(source)}\0".encode() + source).hexdigest()
          assert blob == "28b0c8f9c3de72f87f541bab1d88f4d7e472a6ec"
          module = types.ModuleType("pinned_branch_installer")
          module.__file__ = "scripts/install_branch_artifact"
          sys.modules[module.__name__] = module
          exec(compile(source, module.__file__, "exec"), module.__dict__)
          api = module.GitHubApi(module.github_token())
          run = module.fetch_run(api, 38667463865)
          record = api.json("/repos/sednalabs/codex/actions/artifacts/11943777510")
          assert record["id"] == 11943777510
          assert record["digest"] == "sha256:294d6da1413fada60e1337fbc353ed3ef571418b465f699ce99aae79c86e2fc6"
          destination = Path(os.environ["RUNNER_TEMP"]) / "verified-package"
          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as temporary:
              artifact = module.read_artifact(api, run, record, "x86_64-unknown-linux-gnu", Path(temporary))
              assert artifact.source_sha == os.environ["SOURCE_SHA"]
              assert artifact.ref == os.environ["SOURCE_SHA"]
              files, manifest = module.package_files(artifact, destination)
          host = files["codex-code-mode-host"]
          assert host.is_file() and os.access(host, os.X_OK)
          Path("evidence/package.json").write_text(json.dumps(manifest, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"CARGO_BIN_EXE_codex_code_mode_host={host}\n")
          PY
      - name: Prove regression against the comparison runtime
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # Keep the exact new regression fixture; replace only its runtime subject.
          git show "$BASE_SHA:codex-rs/core/src/client.rs" > core/src/client.rs
          set +e
          cargo test --locked -p codex-core --lib client::tests::responses_requests_omit_optional_attribution_preserving_metadata -- --exact --test-threads=1 2>&1 | tee ../evidence/base-unit.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'test client::tests::responses_requests_omit_optional_attribution_preserving_metadata ... FAILED' ../evidence/base-unit.log
          grep -F 'test result: FAILED. 0 passed; 1 failed;' ../evidence/base-unit.log
          grep -F 'content_item_metadata' ../evidence/base-unit.log
          git show "$SOURCE_SHA:codex-rs/core/src/client.rs" > core/src/client.rs
          git diff --exit-code -- core/src/client.rs
      - name: Prove fixed serialization and unchanged local input
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-core --lib client::tests::responses_requests_omit_optional_attribution_preserving_metadata -- --exact --test-threads=1 2>&1 | tee ../evidence/fixed-unit.log
          grep -F 'test result: ok. 1 passed; 0 failed;' ../evidence/fixed-unit.log
      - name: Exercise both complete request formats
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CODEX_SANDBOX_NETWORK_DISABLED+x}"
          cargo test --locked -p codex-core --test all suite::responses_lite::base_instructions_use_input_items -- --nocapture --test-threads=1 2>&1 | tee ../evidence/request-formats.log
          grep -F 'test result: ok. 2 passed; 0 failed;' ../evidence/request-formats.log
          if grep -F 'Skipping test because' ../evidence/request-formats.log; then
            exit 1
          fi
          git diff --exit-code
      - name: Upload bounded regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: responses-attribution-regression-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
