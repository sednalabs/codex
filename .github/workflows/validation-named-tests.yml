name: validation-named-tests

run-name: >-
  validation-named-tests/${{ inputs.profile }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character candidate commit SHA to validate
        required: true
        type: string
      base_ref:
        description: Comparison base ref recorded in the H/B/T receipt
        required: true
        default: main
        type: string
      profile:
        description: Hosted environment profile
        required: true
        type: choice
        options:
          - rust_minimal
          - rust_integration
        default: rust_minimal
      prepare_codex_cli_for_exact_usage_test:
        description: Stage the exact a89 package binaries for the fixed usage integration selector set
        required: false
        type: boolean
        default: false
      run_ae94_android_helper_tests:
        description: Run the fixed ae94 Android helper library test set
        required: false
        type: boolean
        default: false
      run_ae94_tui_provider_tests:
        description: Run the fixed ae94 TUI Browser, Android, and Desktop provider test set
        required: false
        type: boolean
        default: false
      run_d0_active_wait_test:
        description: Run the fixed d0 active-wait test for operator-steer wakeup
        required: false
        type: boolean
        default: false
      run_ac392_android_protocol_test:
        description: Run the fixed ac392 packaged Android client protocol consumer
        required: false
        type: boolean
        default: false
      run_a89_android_png_fixture_preflight:
        description: Validate the two fixed a89 Android protocol PNG fixtures without running the package or provider
        required: false
        type: boolean
        default: false
      run_native_browser_source_validation:
        description: Run the fixed synthetic native Browser source selector
        required: false
        type: boolean
        default: false
      windows_validation_mode:
        description: One fixed native Windows receiver validation
        required: true
        type: choice
        options:
          - none
          - delete_diagnostic
          - voice_runtime
          - rollout_identity
          - mailbox_events
        default: none
      expected_workflow_host_sha:
        description: Exact workflow-host commit SHA required by fixed validation modes
        required: false
        type: string
        default: ""
      request_json:
        description: JSON rust-tests-v1 typed request (no shell commands or flags)
        required: true
        type: string

concurrency:
  group: validation-named-tests/${{ github.ref }}/${{ inputs.target_sha }}/${{ inputs.base_ref }}/${{ inputs.profile }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reject_conflicting_modes:
    if: >-
      ${{
        (inputs.prepare_codex_cli_for_exact_usage_test == true && inputs.run_ae94_android_helper_tests == true) ||
        (inputs.prepare_codex_cli_for_exact_usage_test == true && inputs.run_ae94_tui_provider_tests == true) ||
        (inputs.prepare_codex_cli_for_exact_usage_test == true && inputs.run_d0_active_wait_test == true) ||
        (inputs.prepare_codex_cli_for_exact_usage_test == true && inputs.run_ac392_android_protocol_test == true) ||
        (inputs.run_ae94_android_helper_tests == true && inputs.run_ae94_tui_provider_tests == true) ||
        (inputs.run_ae94_android_helper_tests == true && inputs.run_d0_active_wait_test == true) ||
        (inputs.run_ae94_android_helper_tests == true && inputs.run_ac392_android_protocol_test == true) ||
        (inputs.run_ae94_tui_provider_tests == true && inputs.run_d0_active_wait_test == true) ||
        (inputs.run_ae94_tui_provider_tests == true && inputs.run_ac392_android_protocol_test == true) ||
        (inputs.run_d0_active_wait_test == true && inputs.run_ac392_android_protocol_test == true) ||
        (inputs.run_a89_android_png_fixture_preflight == true && (
          inputs.prepare_codex_cli_for_exact_usage_test == true ||
          inputs.run_ae94_android_helper_tests == true ||
          inputs.run_ae94_tui_provider_tests == true ||
          inputs.run_d0_active_wait_test == true ||
          inputs.run_ac392_android_protocol_test == true
        )) ||
        (inputs.run_native_browser_source_validation == true && (
          inputs.prepare_codex_cli_for_exact_usage_test == true ||
          inputs.run_ae94_android_helper_tests == true ||
          inputs.run_ae94_tui_provider_tests == true ||
          inputs.run_d0_active_wait_test == true ||
          inputs.run_ac392_android_protocol_test == true ||
          inputs.run_a89_android_png_fixture_preflight == true ||
          inputs.windows_validation_mode != 'none'
        )) ||
        (inputs.windows_validation_mode != 'none' && (
          inputs.prepare_codex_cli_for_exact_usage_test == true ||
          inputs.run_ae94_android_helper_tests == true ||
          inputs.run_ae94_tui_provider_tests == true ||
          inputs.run_d0_active_wait_test == true ||
          inputs.run_ac392_android_protocol_test == true ||
          inputs.run_a89_android_png_fixture_preflight == true
        ))
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: none
    steps:
      - name: Reject conflicting special modes
        shell: bash
        run: |
          echo "Select only one fixed special validation mode." >&2
          exit 1

  named_tests:
    if: >-
      ${{ inputs.windows_validation_mode == 'none' && inputs.prepare_codex_cli_for_exact_usage_test != true && inputs.run_ae94_android_helper_tests != true && inputs.run_ae94_tui_provider_tests != true && inputs.run_d0_active_wait_test != true && inputs.run_ac392_android_protocol_test != true && inputs.run_a89_android_png_fixture_preflight != true && inputs.run_native_browser_source_validation != true }}
    permissions:
      contents: read
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_ref }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      prepare_codex_cli_for_exact_usage_test: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
      run_ae94_android_helper_tests: ${{ inputs.run_ae94_android_helper_tests }}
      run_ae94_tui_provider_tests: ${{ inputs.run_ae94_tui_provider_tests }}
      run_d0_active_wait_test: ${{ inputs.run_d0_active_wait_test }}
      run_ac392_android_protocol_test: ${{ inputs.run_ac392_android_protocol_test }}
      run_a89_android_png_fixture_preflight: ${{ inputs.run_a89_android_png_fixture_preflight }}
      request_json: ${{ inputs.request_json }}
      artifact_name: validation-named-tests-${{ github.run_id }}

  named_tests_with_exact_package:
    if: >-
      ${{ inputs.windows_validation_mode == 'none' && inputs.prepare_codex_cli_for_exact_usage_test == true && inputs.run_ae94_android_helper_tests != true && inputs.run_ae94_tui_provider_tests != true && inputs.run_d0_active_wait_test != true && inputs.run_ac392_android_protocol_test != true && inputs.run_a89_android_png_fixture_preflight != true && inputs.run_native_browser_source_validation != true }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_ref }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      prepare_codex_cli_for_exact_usage_test: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
      run_ae94_android_helper_tests: ${{ inputs.run_ae94_android_helper_tests }}
      run_ae94_tui_provider_tests: ${{ inputs.run_ae94_tui_provider_tests }}
      run_d0_active_wait_test: ${{ inputs.run_d0_active_wait_test }}
      run_ac392_android_protocol_test: ${{ inputs.run_ac392_android_protocol_test }}
      run_a89_android_png_fixture_preflight: ${{ inputs.run_a89_android_png_fixture_preflight }}
      request_json: ${{ inputs.request_json }}
      artifact_name: validation-named-tests-${{ github.run_id }}

  named_tests_for_ae94_android:
    if: >-
      ${{ inputs.windows_validation_mode == 'none' && inputs.run_ae94_android_helper_tests == true && inputs.prepare_codex_cli_for_exact_usage_test != true && inputs.run_ae94_tui_provider_tests != true && inputs.run_d0_active_wait_test != true && inputs.run_ac392_android_protocol_test != true && inputs.run_a89_android_png_fixture_preflight != true && inputs.run_native_browser_source_validation != true }}
    permissions:
      contents: read
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_ref }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      prepare_codex_cli_for_exact_usage_test: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
      run_ae94_android_helper_tests: ${{ inputs.run_ae94_android_helper_tests }}
      run_ae94_tui_provider_tests: ${{ inputs.run_ae94_tui_provider_tests }}
      run_d0_active_wait_test: ${{ inputs.run_d0_active_wait_test }}
      run_ac392_android_protocol_test: ${{ inputs.run_ac392_android_protocol_test }}
      run_a89_android_png_fixture_preflight: ${{ inputs.run_a89_android_png_fixture_preflight }}
      request_json: ${{ inputs.request_json }}
      artifact_name: validation-named-tests-${{ github.run_id }}

  named_tests_for_ae94_tui_providers:
    if: >-
      ${{ inputs.windows_validation_mode == 'none' && inputs.run_ae94_tui_provider_tests == true && inputs.prepare_codex_cli_for_exact_usage_test != true && inputs.run_ae94_android_helper_tests != true && inputs.run_d0_active_wait_test != true && inputs.run_ac392_android_protocol_test != true && inputs.run_a89_android_png_fixture_preflight != true && inputs.run_native_browser_source_validation != true }}
    permissions:
      contents: read
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_ref }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      prepare_codex_cli_for_exact_usage_test: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
      run_ae94_android_helper_tests: ${{ inputs.run_ae94_android_helper_tests }}
      run_ae94_tui_provider_tests: ${{ inputs.run_ae94_tui_provider_tests }}
      run_d0_active_wait_test: ${{ inputs.run_d0_active_wait_test }}
      run_ac392_android_protocol_test: ${{ inputs.run_ac392_android_protocol_test }}
      run_a89_android_png_fixture_preflight: ${{ inputs.run_a89_android_png_fixture_preflight }}
      request_json: ${{ inputs.request_json }}
      artifact_name: validation-named-tests-${{ github.run_id }}

  named_tests_for_d0_active_wait:
    if: >-
      ${{ inputs.windows_validation_mode == 'none' && inputs.run_d0_active_wait_test == true && inputs.prepare_codex_cli_for_exact_usage_test != true && inputs.run_ae94_android_helper_tests != true && inputs.run_ae94_tui_provider_tests != true && inputs.run_ac392_android_protocol_test != true && inputs.run_a89_android_png_fixture_preflight != true && inputs.run_native_browser_source_validation != true }}
    permissions:
      contents: read
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_ref }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      prepare_codex_cli_for_exact_usage_test: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
      run_ae94_android_helper_tests: ${{ inputs.run_ae94_android_helper_tests }}
      run_ae94_tui_provider_tests: ${{ inputs.run_ae94_tui_provider_tests }}
      run_d0_active_wait_test: ${{ inputs.run_d0_active_wait_test }}
      run_ac392_android_protocol_test: ${{ inputs.run_ac392_android_protocol_test }}
      run_a89_android_png_fixture_preflight: ${{ inputs.run_a89_android_png_fixture_preflight }}
      request_json: ${{ inputs.request_json }}
      artifact_name: validation-named-tests-${{ github.run_id }}

  named_tests_for_ac392_android_protocol:
    if: >-
      ${{ inputs.windows_validation_mode == 'none' && inputs.run_ac392_android_protocol_test == true && inputs.prepare_codex_cli_for_exact_usage_test != true && inputs.run_ae94_android_helper_tests != true && inputs.run_ae94_tui_provider_tests != true && inputs.run_d0_active_wait_test != true && inputs.run_a89_android_png_fixture_preflight != true && inputs.run_native_browser_source_validation != true }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_ref }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      prepare_codex_cli_for_exact_usage_test: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
      run_ae94_android_helper_tests: ${{ inputs.run_ae94_android_helper_tests }}
      run_ae94_tui_provider_tests: ${{ inputs.run_ae94_tui_provider_tests }}
      run_d0_active_wait_test: ${{ inputs.run_d0_active_wait_test }}
      run_ac392_android_protocol_test: ${{ inputs.run_ac392_android_protocol_test }}
      run_a89_android_png_fixture_preflight: ${{ inputs.run_a89_android_png_fixture_preflight }}
      request_json: ${{ inputs.request_json }}
      artifact_name: validation-named-tests-${{ github.run_id }}

  named_tests_for_a89_android_png_fixture_preflight:
    if: >-
      ${{ inputs.windows_validation_mode == 'none' &&
          inputs.run_a89_android_png_fixture_preflight == true &&
          inputs.prepare_codex_cli_for_exact_usage_test != true &&
          inputs.run_ae94_android_helper_tests != true &&
          inputs.run_ae94_tui_provider_tests != true &&
          inputs.run_d0_active_wait_test != true &&
          inputs.run_ac392_android_protocol_test != true &&
          inputs.run_native_browser_source_validation != true }}
    permissions:
      contents: read
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_ref }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      run_a89_android_png_fixture_preflight: ${{ inputs.run_a89_android_png_fixture_preflight }}
      request_json: ${{ inputs.request_json }}
      artifact_name: validation-named-tests-${{ github.run_id }}

  native_browser_source_validation:
    name: Native Browser exact synthetic diagnostic selector
    if: >-
      ${{ inputs.run_native_browser_source_validation == true &&
          inputs.windows_validation_mode == 'none' &&
          inputs.prepare_codex_cli_for_exact_usage_test != true &&
          inputs.run_ae94_android_helper_tests != true &&
          inputs.run_ae94_tui_provider_tests != true &&
          inputs.run_d0_active_wait_test != true &&
          inputs.run_ac392_android_protocol_test != true &&
          inputs.run_a89_android_png_fixture_preflight != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - name: Check out exact Browser source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 2
          persist-credentials: false
          path: validation-target

      - name: Check out exact trusted workflow host
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: validation-host

      - name: Verify fixed Browser source, base, and workflow-host identity
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          PROFILE: ${{ inputs.profile }}
          WORKFLOW_HOST_SHA: ${{ github.sha }}
          WORKFLOW_HOST_REF: ${{ github.ref }}
          EXPECTED_WORKFLOW_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          expected_target="312efecb2169058c051cf902c02fea6198561ea0"
          expected_tree="59291b19b1e042e99778f8ae79cbaa58a388e897"
          expected_parent="b9630c6f9fe3cfda7434d882ef98763d78725e92"
          expected_base="a8778ccc83d615b403e4c01370ff8cb5f47677d0"
          expected_source_ref="refs/heads/validation/browser-fixture-312efecb"
          expected_host_ref="refs/heads/validation/receiver-exact-cargo-20261016"
          actual_target="$(git -C validation-target rev-parse HEAD)"
          actual_tree="$(git -C validation-target rev-parse 'HEAD^{tree}')"
          actual_parent="$(git -C validation-target rev-parse 'HEAD^')"
          actual_host="$(git -C validation-host rev-parse HEAD)"
          actual_source_ref="$(git -C validation-target ls-remote --refs origin "${expected_source_ref}" | awk 'NR == 1 { print $1 }')"
          if [[ "${WORKFLOW_HOST_REF}" != "${expected_host_ref}" ]]; then
            echo "Browser validation must run from the fixed validation-host ref." >&2
            exit 1
          fi
          if [[ ! "${WORKFLOW_HOST_SHA}" =~ ^[0-9a-f]{40}$ || "${EXPECTED_WORKFLOW_HOST_SHA}" != "${WORKFLOW_HOST_SHA}" || "${actual_host}" != "${WORKFLOW_HOST_SHA}" ]]; then
            echo "workflow host SHA does not match the exact expected host commit." >&2
            exit 1
          fi
          if [[ "${PROFILE}" != "rust_integration" || "${BASE_REF}" != "${expected_base}" ]]; then
            echo "Browser validation profile or comparison base does not match the fixed source contract." >&2
            exit 1
          fi
          if [[ "${actual_source_ref}" != "${expected_target}" ]]; then
            echo "Browser validation source ref does not resolve to the fixed candidate." >&2
            exit 1
          fi
          if [[ "${TARGET_SHA}" != "${expected_target}" || "${actual_target}" != "${expected_target}" ]]; then
            echo "Browser validation target does not match the fixed source commit." >&2
            exit 1
          fi
          if [[ "${actual_tree}" != "${expected_tree}" || "${actual_parent}" != "${expected_parent}" ]]; then
            echo "Browser validation target tree or direct parent does not match the reviewed source." >&2
            exit 1
          fi
          {
            echo "VALIDATION_TARGET_SHA=${actual_target}"
            echo "VALIDATION_HARNESS_SHA=${actual_host}"
          } >> "${GITHUB_ENV}"
          echo "workflow_host_sha=${actual_host}"
          echo "target_sha=${actual_target}"
          echo "target_tree=${actual_tree}"
          echo "target_parent=${actual_parent}"
          echo "base_sha=${expected_base}"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # pinned action revision
        with:
          toolchain: 1.96.0
          targets: x86_64-unknown-linux-gnu

      - name: Run fixed synthetic Browser diagnostic selector
        shell: bash
        working-directory: validation-target
        run: bash ../validation-host/.github/scripts/validation-lanes/native-browser-evidence.sh

  windows_exact_receiver_validation:
    name: Native Windows exact receiver validation (${{ inputs.windows_validation_mode }})
    if: >-
      ${{ inputs.windows_validation_mode != 'none' &&
          inputs.prepare_codex_cli_for_exact_usage_test != true &&
          inputs.run_ae94_android_helper_tests != true &&
          inputs.run_ae94_tui_provider_tests != true &&
          inputs.run_d0_active_wait_test != true &&
          inputs.run_ac392_android_protocol_test != true &&
          inputs.run_a89_android_png_fixture_preflight != true &&
          inputs.run_native_browser_source_validation != true }}
    runs-on: ${{ inputs.windows_validation_mode == 'mailbox_events' && 'windows-2025' || 'windows-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CODEX_BAZEL_LOCAL_ONLY: "1"
    steps:
      - name: Check out exact validation target
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 39
          persist-credentials: false

      - name: Verify fixed source, base, and workflow-host identity
        shell: bash
        env:
          WINDOWS_VALIDATION_MODE: ${{ inputs.windows_validation_mode }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          WORKFLOW_HOST_SHA: ${{ github.sha }}
          WORKFLOW_HOST_REF: ${{ github.ref }}
          EXPECTED_WORKFLOW_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          expected_base="a89b02855334af7c0521882271cb97b818981d1a"
          expected_host_ref="refs/heads/validation/receiver-exact-cargo-20261016"
          case "${WINDOWS_VALIDATION_MODE}" in
            delete_diagnostic)
              expected_base="6bdf5e8a98b8c29ad7c63cfbc86afd24d4914287"
              expected_host_ref="refs/heads/validation/host-windows-delete-83b550b9"
              expected_target="83b550b9cb80801112bf33db73b52efc66ebb9ef"
              expected_tree="71a902cdd17275eca3e45f2c9944d94637d806ef"
              expected_parent="6bdf5e8a98b8c29ad7c63cfbc86afd24d4914287"
              expected_base_depth=1
              ;;
            rollout_identity)
              expected_base="6bdf5e8a98b8c29ad7c63cfbc86afd24d4914287"
              expected_host_ref="refs/heads/validation/host-windows-rollout-80560f45"
              expected_target="80560f458e220ca59830e739c7df5d1ef2c83ccf"
              expected_tree="7fa4a32dacac3918b65657d21f398fae1066b618"
              expected_parent="de4d8f19af203b2129142bdec359a66f4c7c5b0e"
              expected_base_depth=3
              ;;
            voice_runtime)
              expected_target="1f769231c112a57a67800431aa472256a7e11697"
              expected_tree="94ba4af639460c414bc0d93f5b17dccabef3fd29"
              expected_parent="1d85af37b85157729f6fd9d7e5f0bc3301012f9f"
              expected_base_depth=2
              ;;
            mailbox_events)
              expected_base="6496a38e73c849bb9d882c1474b0b59b9f1f6e1a"
              expected_host_ref="refs/heads/validation/host-windows-events-256e15f9"
              expected_target="256e15f97a561628fff7f93fb099a3cb2a727827"
              expected_tree="2db702b26e472502b5667a8c1f5e18d4b5c3a347"
              expected_parent="6496a38e73c849bb9d882c1474b0b59b9f1f6e1a"
              expected_base_depth=1
              ;;
            *)
              echo "Windows receiver validation mode is unsupported." >&2
              exit 1
              ;;
          esac
          actual_target="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          actual_parent="$(git rev-parse 'HEAD^')"
          actual_base="$(git rev-parse "HEAD~${expected_base_depth}")"
          if [[ "${WORKFLOW_HOST_REF}" != "${expected_host_ref}" ]]; then
            echo "Windows receiver validation must run from the fixed validation-host ref." >&2
            exit 1
          fi
          if [[ ! "${WORKFLOW_HOST_SHA}" =~ ^[0-9a-f]{40}$ || "${EXPECTED_WORKFLOW_HOST_SHA}" != "${WORKFLOW_HOST_SHA}" ]]; then
            echo "workflow host SHA does not match the exact expected host commit." >&2
            exit 1
          fi
          if [[ "${TARGET_SHA}" != "${expected_target}" || "${actual_target}" != "${expected_target}" ]]; then
            echo "Windows receiver target does not match the fixed source commit." >&2
            exit 1
          fi
          if [[ "${BASE_REF}" != "${expected_base}" || "${actual_base}" != "${expected_base}" ]]; then
            echo "Windows receiver comparison base does not match the fixed source base." >&2
            exit 1
          fi
          if [[ "${actual_tree}" != "${expected_tree}" || "${actual_parent}" != "${expected_parent}" ]]; then
            echo "Windows receiver target tree or direct parent does not match the reviewed source." >&2
            exit 1
          fi
          echo "workflow_host_sha=${WORKFLOW_HOST_SHA}"
          echo "target_sha=${actual_target}"
          echo "target_tree=${actual_tree}"
          echo "base_sha=${actual_base}"
          echo "mode=${WINDOWS_VALIDATION_MODE}"

      - name: Set up native MSVC Rust toolchain
        if: ${{ inputs.windows_validation_mode == 'delete_diagnostic' || inputs.windows_validation_mode == 'rollout_identity' }}
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Resolve actual Windows SystemRoot for Bazel actions
        if: ${{ inputs.windows_validation_mode == 'voice_runtime' || inputs.windows_validation_mode == 'mailbox_events' }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SystemRoot) -or -not (Test-Path -LiteralPath $env:SystemRoot -PathType Container)) {
            throw "The Windows runner did not provide a valid SystemRoot directory."
          }
          if ([string]::IsNullOrWhiteSpace($env:PROCESSOR_ARCHITECTURE)) {
            throw "The Windows runner did not provide its process architecture."
          }
          "WINDOWS_SYSTEM_ROOT=$env:SystemRoot" >> $env:GITHUB_ENV
          "WINDOWS_PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE" >> $env:GITHUB_ENV

      - name: Inventory the token diagnostic and unchanged DELETE contract
        if: ${{ inputs.windows_validation_mode == 'delete_diagnostic' }}
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          inventory="${RUNNER_TEMP}/windows-delete-diagnostic-inventory.txt"
          cargo test --locked -p codex-windows-sandbox --lib -- --list | tee "${inventory}"
          selectors=(
            "token::tests::legacy_deletion_token_access_diagnostic"
            "unified_exec::tests::legacy_workspace_write_delete_is_limited_to_writable_roots"
          )
          for selector in "${selectors[@]}"; do
            matches="$(grep -Fxc "${selector}: test" "${inventory}" || true)"
            if [[ "${matches}" != "1" ]]; then
              echo "Expected exactly one matching fixed Windows test; observed ${matches}." >&2
              exit 1
            fi
          done

      - name: Run the finite token-access discriminator
        if: ${{ inputs.windows_validation_mode == 'delete_diagnostic' }}
        shell: bash
        working-directory: codex-rs
        run: >-
          cargo test --locked -p codex-windows-sandbox --lib
          token::tests::legacy_deletion_token_access_diagnostic
          -- --exact --nocapture --test-threads=1

      - name: Run the exact DELETE diagnostic without waiving its assertion
        if: ${{ inputs.windows_validation_mode == 'delete_diagnostic' }}
        shell: bash
        working-directory: codex-rs
        run: >-
          cargo test --locked -p codex-windows-sandbox --lib
          unified_exec::tests::legacy_workspace_write_delete_is_limited_to_writable_roots
          -- --exact --test-threads=1

      - name: Inventory and run the fixed rollout-writer identity selectors
        if: ${{ inputs.windows_validation_mode == 'rollout_identity' }}
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          selectors=(
            "append_state::tests::owned_append_retries_only_suffix_after_repeated_partial_progress"
            "append_state::tests::owned_append_acknowledges_full_line_after_flush_error_without_duplication"
            "append_state::tests::owned_append_conflicts_are_sticky_and_never_modify_foreign_bytes"
            "recorder::tests::append_repair_terminates_nonempty_rollout_tail"
            "recorder::tests::opening_existing_rollout_preserves_modified_time"
            "recorder::tests::writer_state_retries_write_error_before_reporting_flush_success"
            "recorder::tests::writer_state_retains_serialized_meta_and_ordinals_across_real_io_failures"
            "recorder::tests::writer_state_worker_panic_retains_checkpoint_and_fails_closed"
            "recorder::tests::append_open_preserves_unterminated_tail_on_rejection"
            "recorder::tests::resumed_paginated_rollout_terminates_complete_valid_tail"
            "recorder::tests::resumed_paginated_rollout_rejects_unknown_malformed_tail"
            "compression::tests::physical_fence_blocks_materialization_and_bound_helper_does_not_relock"
            "compression::tests::worker_skips_physical_writer_until_its_fence_is_released"
            "writer_lock::tests::writer_locks_reject_competing_owners_and_release_their_files"
            "writer_lock::tests::first_acquisition_removes_stale_locks_without_removing_active_locks"
            "writer_lock::tests::publication_skips_live_writers_and_keeps_coordination_locked"
            "file_identity::tests::file_identity_matches_cloned_and_reopened_handles"
            "file_identity::tests::file_identity_distinguishes_same_content_files"
            "file_identity::tests::file_identity_detects_same_content_replacement_with_original_handle_retained"
            "file_identity::tests::windows_file_identity_compares_all_128_bits"
            "file_identity::tests::windows_file_identity_rejects_unusable_id_sentinels"
          )
          inventory="${RUNNER_TEMP}/windows-rollout-identity-inventory.txt"
          cargo test --locked -p codex-rollout --lib -- --list | tee "${inventory}"
          for selector in "${selectors[@]}"; do
            matches="$(grep -Fxc "${selector}: test" "${inventory}" || true)"
            if [[ "${matches}" != "1" ]]; then
              echo "Expected exactly one matching fixed rollout test; observed ${matches}." >&2
              exit 1
            fi
          done
          for selector in "${selectors[@]}"; do
            cargo test --locked -p codex-rollout --lib "${selector}" -- --exact --test-threads=1
          done

      - name: Prepare native Windows Bazel environment
        if: ${{ inputs.windows_validation_mode == 'voice_runtime' || inputs.windows_validation_mode == 'mailbox_events' }}
        id: prepare_voice_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: ${{ inputs.windows_validation_mode == 'mailbox_events' && 'validation-windows-mailbox-events' || 'validation-windows-voice-runtime' }}

      - name: Run fixed voice-host Windows DLL runtime selectors
        if: ${{ inputs.windows_validation_mode == 'voice_runtime' }}
        shell: bash
        env:
          VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${WINDOWS_SYSTEM_ROOT:-}" || -z "${WINDOWS_PROCESSOR_ARCHITECTURE:-}" ]]; then
            echo "A required fixed Windows analysis environment value is missing." >&2
            exit 1
          fi
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            --remote-download-toplevel \
            -- \
            test \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --workspace_status_command=./scripts/workspace-status.cmd \
            --skip_incompatible_explicit_targets \
            --test_tag_filters=-argument-comment-lint \
            --test_verbose_timeout_warnings \
            --local_test_jobs=1 \
            --test_env=CODEX_BAZEL_LOCAL_ONLY=1 \
            "--action_env=SystemRoot=${WINDOWS_SYSTEM_ROOT}" \
            "--host_action_env=SystemRoot=${WINDOWS_SYSTEM_ROOT}" \
            "--action_env=PROCESSOR_ARCHITECTURE=${WINDOWS_PROCESSOR_ARCHITECTURE}" \
            "--host_action_env=PROCESSOR_ARCHITECTURE=${WINDOWS_PROCESSOR_ARCHITECTURE}" \
            "--build_metadata=COMMIT_SHA=${VALIDATION_TARGET_SHA}" \
            -- \
            //codex-rs/voice-host:codex-voice-host-bin-unit-tests \
            //codex-rs/voice-host:voice-host-installed_client-test \
            //codex-rs/voice-host:voice-host-lifecycle-test

      - name: Inventory fixed Windows mailbox event selectors
        if: ${{ inputs.windows_validation_mode == 'mailbox_events' }}
        shell: bash
        working-directory: codex-rs
        env:
          VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          inventory="${RUNNER_TEMP}/windows-mailbox-events-inventory.txt"
          ../.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            --remote-download-toplevel \
            -- \
            test \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --workspace_status_command=./scripts/workspace-status.cmd \
            --skip_incompatible_explicit_targets \
            --test_tag_filters=-argument-comment-lint \
            --test_verbose_timeout_warnings \
            --test_sharding_strategy=disabled \
            --local_test_jobs=1 \
            --test_output=all \
            --test_env=CODEX_BAZEL_LOCAL_ONLY=1 \
            "--action_env=SystemRoot=${WINDOWS_SYSTEM_ROOT}" \
            "--host_action_env=SystemRoot=${WINDOWS_SYSTEM_ROOT}" \
            "--action_env=PROCESSOR_ARCHITECTURE=${WINDOWS_PROCESSOR_ARCHITECTURE}" \
            "--host_action_env=PROCESSOR_ARCHITECTURE=${WINDOWS_PROCESSOR_ARCHITECTURE}" \
            "--build_metadata=COMMIT_SHA=${VALIDATION_TARGET_SHA}" \
            --test_arg=--list \
            -- \
            //codex-rs/core:core-all-test > "${inventory}"
          selectors=(
            "suite::subagent_notifications::guardian_subagent_notification_tests::guardian_circuit_breaker_notifies_parent::strict_notifies_parent"
            "suite::scenarios::agent_message_board::board_unsubscribe_survives_post_and_resume_until_resubscribed::channels_only"
          )
          for selector in "${selectors[@]}"; do
            matches="$(grep -Fxc "${selector}: test" "${inventory}" || true)"
            if [[ "${matches}" != "1" ]]; then
              echo "Expected exactly one matching fixed mailbox event test; observed ${matches}." >&2
              exit 1
            fi
            echo "Verified fixed selector: ${selector}"
          done

      - name: Run fixed Windows mailbox event selectors sequentially
        if: ${{ inputs.windows_validation_mode == 'mailbox_events' }}
        shell: bash
        working-directory: codex-rs
        env:
          VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          selectors=(
            "suite::subagent_notifications::guardian_subagent_notification_tests::guardian_circuit_breaker_notifies_parent::strict_notifies_parent"
            "suite::scenarios::agent_message_board::board_unsubscribe_survives_post_and_resume_until_resubscribed::channels_only"
          )
          failed=0
          for selector in "${selectors[@]}"; do
            if ../.github/scripts/run-bazel-ci.sh \
              --print-failed-action-summary \
              --print-failed-test-logs \
              --windows-msvc-host-platform \
              --remote-download-toplevel \
              -- \
              test \
              --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
              --workspace_status_command=./scripts/workspace-status.cmd \
              --skip_incompatible_explicit_targets \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --test_sharding_strategy=disabled \
              --local_test_jobs=1 \
              --test_env=CODEX_BAZEL_LOCAL_ONLY=1 \
              "--action_env=SystemRoot=${WINDOWS_SYSTEM_ROOT}" \
              "--host_action_env=SystemRoot=${WINDOWS_SYSTEM_ROOT}" \
              "--action_env=PROCESSOR_ARCHITECTURE=${WINDOWS_PROCESSOR_ARCHITECTURE}" \
              "--host_action_env=PROCESSOR_ARCHITECTURE=${WINDOWS_PROCESSOR_ARCHITECTURE}" \
              "--build_metadata=COMMIT_SHA=${VALIDATION_TARGET_SHA}" \
              "--test_arg=${selector}" \
              --test_arg=--exact \
              --test_arg=--nocapture \
              --test_arg=--test-threads=1 \
              -- \
              //codex-rs/core:core-all-test; then
              :
            else
              echo "Fixed mailbox event selector failed: ${selector}" >&2
              failed=1
            fi
          done
          exit "${failed}"
