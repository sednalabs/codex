name: validation-named-tests

run-name: >-
  validation-named-tests/${{ inputs.profile }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character candidate commit SHA to validate
        required: true
        type: string
      base_sha:
        description: Exact full comparison-base commit SHA
        required: true
        type: string
      profile:
        description: Hosted environment profile
        required: true
        type: choice
        options:
          - rust_minimal
          - rust_integration
        default: rust_minimal
      request_json:
        description: JSON rust-tests-v1 typed request (no shell commands or flags)
        required: true
        type: string

concurrency:
  group: validation-named-tests/${{ inputs.target_sha }}/${{ inputs.base_sha }}/${{ inputs.profile }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  named_tests:
    uses: ./.github/workflows/_validation-named-tests.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      base_ref: ${{ inputs.base_sha }}
      base_sha: ${{ inputs.base_sha }}
      harness_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
      request_json: ${{ inputs.request_json }}
      artifact_name: validation-named-tests-${{ github.run_id }}
