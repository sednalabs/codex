name: format-artifact
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact source commit to format
        required: true
        type: string
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate source identity
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - name: Verify checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: 'test "$(git rev-parse HEAD)" = "$TARGET_SHA"'
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Format source without building
        run: cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --config imports_granularity=Item
      - name: Capture reviewable patch and identity
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          mkdir -p format-artifact
          git diff --binary -- codex-rs > format-artifact/generated.patch
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          root = Path('format-artifact')
          receipt = {
              'source_sha': os.environ['TARGET_SHA'],
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'workflow_host_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'patch_sha256': hashlib.sha256((root / 'generated.patch').read_bytes()).hexdigest(),
              'purpose': 'formatting artifact only; not compile or runtime proof',
          }
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: format-${{ inputs.target_sha }}
          path: format-artifact/
          if-no-files-found: error
