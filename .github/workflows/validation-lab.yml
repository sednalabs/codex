      cache_policy: ${{ inputs.supersession_mode != 'auto' && 'write-fallback' || 'restore-only' }}

  nextest_archives:
    name: Validation-lab nextest archive (${{ matrix.archive_cohort }})
    needs:
      - metadata
    if: >-
      ${{
        needs.metadata.result == 'success' &&
        needs.metadata.outputs.dedupe_should_skip != 'true' &&
        fromJson(needs.metadata.outputs.selected_nextest_archive_count) > 0
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_IDLE_TIMEOUT: "0"
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.metadata.outputs.rust_integration_max_parallel) }}
      matrix: ${{ fromJson(needs.metadata.outputs.selected_nextest_archive_matrix) }}
    steps:
      # Validation-target checkout runs with read-only permissions and no persisted credentials.
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ matrix.checkout_fetch_depth }}
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - name: Check out workflow helpers
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .workflow-src

      - name: Reclaim runner disk headroom
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail

          soft_threshold_bytes=$((12 * 1024 * 1024 * 1024))
          hard_threshold_bytes=$((6 * 1024 * 1024 * 1024))

          available_bytes() {
            df --block-size=1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d '[:space:]'
          }

          before_bytes="$(available_bytes)"
          if [[ "${before_bytes}" -lt "${soft_threshold_bytes}" ]]; then
            echo "::warning title=Low runner disk before archive setup::Available disk is $(numfmt --to=iec "${before_bytes}") before dependency setup; reclaiming headroom."
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
            sudo apt-get clean || true
            sudo rm -rf /var/lib/apt/lists/* || true
          fi

          after_bytes="$(available_bytes)"
          if [[ "${after_bytes}" -lt "${hard_threshold_bytes}" ]]; then
            echo "::error title=Insufficient runner disk::Available disk after cleanup is $(numfmt --to=iec "${after_bytes}"), below the 6 GiB safety floor for validation lanes."
            exit 1
          fi

      - name: Set up Node.js
        if: ${{ matrix.needs_node }}
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Bind js_repl Node runtime
        if: ${{ matrix.needs_node }}
        shell: bash
        run: echo "CODEX_JS_REPL_NODE_PATH=$(command -v node)" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: ${{ matrix.needs_linux_build_deps }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Install DotSlash
        if: ${{ matrix.needs_dotslash }}
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Compute lockfile hash
        id: lockhash
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum codex-rs/Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum codex-rs/rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.rusty_v8/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-linux-rust-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Install sccache
        if: ${{ matrix.needs_sccache }}
        uses: taiki-e/install-action@8b3c737da4b541bf0fb5a3e0488ff20535badac9 # v2
        with:
          tool: sccache

      - name: Configure sccache backend
        id: sccache_backend
        if: ${{ matrix.needs_sccache }}
        shell: bash
        run: bash .workflow-src/.github/scripts/configure_sccache_backend.sh "${{ inputs.supersession_mode != 'auto' && 'write-fallback' || 'restore-only' }}"

      - name: Enable sccache wrapper and reset stats
        if: ${{ matrix.needs_sccache && steps.sccache_backend.outputs.backend != 'off' }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(command -v sccache)"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Restore sccache cache (fallback)
        if: ${{ matrix.needs_sccache && steps.sccache_backend.outputs.backend == 'fallback' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-linux-rust-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}
          restore-keys: |
            sccache-linux-rust-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-
            sccache-linux-rust-${{ steps.lockhash.outputs.hash }}-

      - uses: taiki-e/install-action@8b3c737da4b541bf0fb5a3e0488ff20535badac9 # v2
        with:
          tool: nextest@0.9.103

      - name: Build nextest archive
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ matrix.working_directory }}
          BUILD_SCRIPT_PATH: ${{ matrix.build_script_path }}
          VALIDATION_LAB_NEXTEST_ARCHIVE_FILE: ${{ runner.temp }}/validation-lab-nextest-archives/${{ matrix.archive_file_name }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${VALIDATION_LAB_NEXTEST_ARCHIVE_FILE}")"
          if [[ '${{ matrix.needs_sccache }}' == 'true' && '${{ steps.sccache_backend.outputs.backend }}' != 'off' ]]; then
            export RUSTC_WRAPPER="${RUSTC_WRAPPER:-$(command -v sccache)}"
          fi
          python3 .workflow-src/.github/scripts/run_validation_lane.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --working-directory "${WORKING_DIRECTORY}" \
            --script-path "${BUILD_SCRIPT_PATH}" \
            --script-args-json '[]'

      - name: Upload nextest archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/validation-lab-nextest-archives/${{ matrix.archive_file_name }}
          if-no-files-found: error
          retention-days: 3

      - name: Check post-archive disk headroom
        if: ${{ always() && !cancelled() && runner.os == 'Linux' }}
        id: disk_guard
        shell: bash
        run: |
          set -euo pipefail
          save_floor_bytes=$((8 * 1024 * 1024 * 1024))
          available_bytes="$(df --block-size=1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d '[:space:]')"
          {
            echo "available_bytes=${available_bytes}"
            if [[ "${available_bytes}" -lt "${save_floor_bytes}" ]]; then
              echo "skip_cache_save=true"
            else
              echo "skip_cache_save=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Save cargo home cache
        if: ${{ always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true' && steps.disk_guard.outputs.skip_cache_save != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.rusty_v8/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-linux-rust-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache (fallback)
        if: ${{ always() && !cancelled() && matrix.needs_sccache && steps.sccache_backend.outputs.backend == 'fallback' && steps.sccache_backend.outputs.policy == 'write-fallback' && steps.disk_guard.outputs.skip_cache_save != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-linux-rust-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}

      - name: sccache stats
        if: ${{ always() && matrix.needs_sccache && steps.sccache_backend.outputs.backend != 'off' }}
        continue-on-error: true
        shell: bash
        run: sccache --show-stats || true

  rust_integration_archive_lanes:
    name: Validation-lab archive-backed rust integration
    needs:
      - metadata
      - nextest_archives
    if: >-
      ${{
        always() &&
        needs.metadata.result == 'success' &&
        needs.metadata.outputs.dedupe_should_skip != 'true' &&
        needs.nextest_archives.result == 'success' &&
        fromJson(needs.metadata.outputs.selected_rust_integration_archive_lane_count) > 0
      }}
    strategy:
      fail-fast: ${{ fromJson(needs.metadata.outputs.matrix_fail_fast) }}
      max-parallel: ${{ fromJson(needs.metadata.outputs.rust_integration_max_parallel) }}
      matrix: ${{ fromJson(needs.metadata.outputs.selected_rust_integration_archive_matrix) }}
    uses: ./.github/workflows/_validation-lane-rust-integration.yml
    with:
      checkout_ref: ${{ needs.metadata.outputs.checkout_ref }}
      checkout_fetch_depth: ${{ matrix.checkout_fetch_depth }}
      lane_id: ${{ matrix.lane_id }}
      lane_phase: downstream_lanes
      summary_title: ${{ matrix.lane_id }}
      status_class: ${{ matrix.status_class }}
      frontier_default: ${{ matrix.frontier_default }}
      setup_class: ${{ matrix.setup_class }}
      frontier_role: ${{ matrix.frontier_role }}
      summary_family: ${{ matrix.summary_family }}
      cost_class: ${{ matrix.cost_class }}
      working_directory: ${{ matrix.working_directory }}
      script_path: ${{ matrix.script_path }}
      script_args_json: ${{ toJson(matrix.script_args) }}
      needs_just: ${{ matrix.needs_just }}
      needs_node: ${{ matrix.needs_node }}
      needs_nextest: ${{ matrix.needs_nextest }}
      needs_linux_build_deps: ${{ matrix.needs_linux_build_deps }}
      needs_dotslash: ${{ matrix.needs_dotslash }}
      needs_sccache: ${{ matrix.needs_sccache }}
      cache_policy: ${{ inputs.supersession_mode != 'auto' && 'write-fallback' || 'restore-only' }}
      nextest_archive_artifact_name: ${{ matrix.nextest_archive_artifact_name }}
      nextest_archive_file_name: ${{ matrix.nextest_archive_file_name }}

  rust_integration_lanes:
    needs:
      - metadata
    if: >-
      ${{
        needs.metadata.result == 'success' &&
        needs.metadata.outputs.dedupe_should_skip != 'true' &&
        fromJson(needs.metadata.outputs.selected_rust_integration_lane_count) > 0
      }}
    strategy:
      fail-fast: ${{ fromJson(needs.metadata.outputs.matrix_fail_fast) }}
      max-parallel: ${{ fromJson(needs.metadata.outputs.rust_integration_max_parallel) }}
      matrix: ${{ fromJson(needs.metadata.outputs.selected_rust_integration_matrix) }}
    uses: ./.github/workflows/_validation-lane-rust-integration.yml
    with:
      checkout_ref: ${{ needs.metadata.outputs.checkout_ref }}
      checkout_fetch_depth: ${{ matrix.checkout_fetch_depth }}
      lane_id: ${{ matrix.lane_id }}
      lane_phase: downstream_lanes
      summary_title: ${{ matrix.lane_id }}
      status_class: ${{ matrix.status_class }}
      frontier_default: ${{ matrix.frontier_default }}
      setup_class: ${{ matrix.setup_class }}
      frontier_role: ${{ matrix.frontier_role }}
      summary_family: ${{ matrix.summary_family }}
      cost_class: ${{ matrix.cost_class }}
      working_directory: ${{ matrix.working_directory }}
      script_path: ${{ matrix.script_path }}
      script_args_json: ${{ toJson(matrix.script_args) }}
      needs_just: ${{ matrix.needs_just }}
      needs_node: ${{ matrix.needs_node }}
      needs_nextest: ${{ matrix.needs_nextest }}
      needs_linux_build_deps: ${{ matrix.needs_linux_build_deps }}
      needs_dotslash: ${{ matrix.needs_dotslash }}
      needs_sccache: ${{ matrix.needs_sccache }}
      cache_policy: ${{ inputs.supersession_mode != 'auto' && 'write-fallback' || 'restore-only' }}

  rust_integration_batches:
    needs:
      - metadata
    if: >-
      ${{
        needs.metadata.result == 'success' &&
        needs.metadata.outputs.dedupe_should_skip != 'true' &&
        fromJson(needs.metadata.outputs.selected_rust_integration_batch_count) > 0
      }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.metadata.outputs.rust_integration_max_parallel) }}
      matrix: ${{ fromJson(needs.metadata.outputs.selected_rust_integration_batch_matrix) }}
    uses: ./.github/workflows/_validation-lane-rust-batch.yml
    with:
      checkout_ref: ${{ needs.metadata.outputs.checkout_ref }}
      checkout_fetch_depth: ${{ matrix.checkout_fetch_depth }}
      batch_id: ${{ matrix.batch_id }}
      batch_index: ${{ matrix.batch_index }}
      setup_class: ${{ matrix.setup_class }}
      lane_ids_json: ${{ matrix.lane_ids_json }}
      needs_just: ${{ matrix.needs_just }}
      needs_node: ${{ matrix.needs_node }}
      needs_nextest: ${{ matrix.needs_nextest }}
      needs_linux_build_deps: ${{ matrix.needs_linux_build_deps }}
      needs_dotslash: ${{ matrix.needs_dotslash }}
      needs_sccache: ${{ matrix.needs_sccache }}
      cache_policy: ${{ inputs.supersession_mode != 'auto' && 'write-fallback' || 'restore-only' }}

  release_lanes:
    needs:
      - metadata
    if: >-
      ${{
        needs.metadata.result == 'success' &&
        needs.metadata.outputs.dedupe_should_skip != 'true' &&
        fromJson(needs.metadata.outputs.selected_release_lane_count) > 0
      }}
    strategy:
      fail-fast: ${{ fromJson(needs.metadata.outputs.matrix_fail_fast) }}
      max-parallel: ${{ fromJson(needs.metadata.outputs.release_max_parallel) }}
      matrix: ${{ fromJson(needs.metadata.outputs.selected_release_matrix) }}
    uses: ./.github/workflows/_validation-lane-release.yml
    with:
      checkout_ref: ${{ needs.metadata.outputs.checkout_ref }}
      checkout_fetch_depth: ${{ matrix.checkout_fetch_depth }}
      lane_id: ${{ matrix.lane_id }}
      lane_phase: downstream_lanes
      summary_title: ${{ matrix.lane_id }}
      status_class: ${{ matrix.status_class }}
      frontier_default: ${{ matrix.frontier_default }}
      setup_class: ${{ matrix.setup_class }}
      frontier_role: ${{ matrix.frontier_role }}
      summary_family: ${{ matrix.summary_family }}
      cost_class: ${{ matrix.cost_class }}
      working_directory: ${{ matrix.working_directory }}
      script_path: ${{ matrix.script_path }}
      script_args_json: ${{ toJson(matrix.script_args) }}
      needs_just: ${{ matrix.needs_just }}
      needs_node: ${{ matrix.needs_node }}
      needs_nextest: ${{ matrix.needs_nextest }}
      needs_linux_build_deps: ${{ matrix.needs_linux_build_deps }}
      needs_dotslash: ${{ matrix.needs_dotslash }}
      needs_sccache: ${{ matrix.needs_sccache }}
      cache_policy: ${{ inputs.supersession_mode != 'auto' && 'write-fallback' || 'restore-only' }}

  artifact:
    needs:
      - metadata
      - smoke_workflow_lanes
      - smoke_node_lanes
      - smoke_rust_minimal_lanes
      - smoke_rust_integration_lanes
      - smoke_release_lanes
      - workflow_lanes
      - node_lanes
      - rust_minimal_lanes
      - rust_minimal_batches
      - nextest_archives
      - rust_integration_archive_lanes
      - rust_integration_lanes
      - rust_integration_batches
      - release_lanes
    if: >-
      ${{
        always() &&
        needs.metadata.result == 'success' &&
        needs.metadata.outputs.dedupe_should_skip != 'true' &&
        needs.metadata.outputs.run_artifact == 'true' &&
        (needs.smoke_workflow_lanes.result == 'success' || needs.smoke_workflow_lanes.result == 'skipped') &&
        (needs.smoke_node_lanes.result == 'success' || needs.smoke_node_lanes.result == 'skipped') &&
        (needs.smoke_rust_minimal_lanes.result == 'success' || needs.smoke_rust_minimal_lanes.result == 'skipped') &&
        (needs.smoke_rust_integration_lanes.result == 'success' || needs.smoke_rust_integration_lanes.result == 'skipped') &&
        (needs.smoke_release_lanes.result == 'success' || needs.smoke_release_lanes.result == 'skipped') &&
        (needs.workflow_lanes.result == 'success' || needs.workflow_lanes.result == 'skipped') &&
        (needs.node_lanes.result == 'success' || needs.node_lanes.result == 'skipped') &&
        (needs.rust_minimal_lanes.result == 'success' || needs.rust_minimal_lanes.result == 'skipped') &&
        (needs.rust_minimal_batches.result == 'success' || needs.rust_minimal_batches.result == 'skipped') &&
        (needs.nextest_archives.result == 'success' || needs.nextest_archives.result == 'skipped') &&
        (needs.rust_integration_archive_lanes.result == 'success' || needs.rust_integration_archive_lanes.result == 'skipped') &&
        (needs.rust_integration_lanes.result == 'success' || needs.rust_integration_lanes.result == 'skipped') &&
        (needs.rust_integration_batches.result == 'success' || needs.rust_integration_batches.result == 'skipped') &&
        (needs.release_lanes.result == 'success' || needs.release_lanes.result == 'skipped')
      }}
    uses: ./.github/workflows/_validation-lane-release.yml
    with:
      checkout_ref: ${{ needs.metadata.outputs.checkout_ref }}
      checkout_fetch_depth: 1
      lane_phase: artifact_build
      summary_title: Validation lab artifact build
      setup_class: release
      release_version: ${{ needs.metadata.outputs.preview_version }}
      artifact_name: ${{ needs.metadata.outputs.artifact_name }}
      artifact_path: dist/*
      working_directory: .
      script_path: .github/scripts/validation-lanes/artifact-build.sh
      script_args_json: "[]"
      needs_just: false
      needs_node: false
      needs_nextest: false
      needs_linux_build_deps: true
      needs_dotslash: false
      needs_sccache: true
      cache_policy: ${{ inputs.supersession_mode != 'auto' && 'write-fallback' || 'restore-only' }}

  summary:
    name: Validation-lab summary
    needs:
      - metadata
      - smoke_workflow_lanes
      - smoke_node_lanes
      - smoke_rust_minimal_lanes
      - smoke_rust_integration_lanes
      - smoke_release_lanes
      - workflow_lanes
      - node_lanes
      - rust_minimal_lanes
      - rust_minimal_batches
      - nextest_archives
      - rust_integration_archive_lanes
      - rust_integration_lanes
      - rust_integration_batches
      - release_lanes
      - artifact
    if: ${{ always() && needs.metadata.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download lane summary artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: validation-lane-summary-*
          path: ${{ runner.temp }}/validation-lane-summaries
          merge-multiple: true

      - name: Record Actions cache occupancy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache_occupancy_file="${RUNNER_TEMP}/actions-cache-occupancy.json"
          cache_occupancy_markdown="${RUNNER_TEMP}/actions-cache-occupancy.md"
          python3 .github/scripts/report_actions_cache_occupancy.py \
            --repo "${GITHUB_REPOSITORY}" \
            --output "${cache_occupancy_file}" \
            --markdown-output "${cache_occupancy_markdown}"
          cat "${cache_occupancy_markdown}" >> "$GITHUB_STEP_SUMMARY"
          echo "CACHE_OCCUPANCY_FILE=${cache_occupancy_file}" >> "$GITHUB_ENV"

      - name: Build validation summary artifact
        shell: bash
        env:
          RUST_MINIMAL_RESULT: ${{ needs.rust_minimal_lanes.result || 'skipped' }}
          RUST_MINIMAL_BATCH_RESULT: ${{ needs.rust_minimal_batches.result || 'skipped' }}
          NEXTEST_ARCHIVE_RESULT: ${{ needs.nextest_archives.result || 'skipped' }}
          RUST_INTEGRATION_ARCHIVE_RESULT: ${{ needs.rust_integration_archive_lanes.result || 'skipped' }}
          RUST_INTEGRATION_RESULT: ${{ needs.rust_integration_lanes.result || 'skipped' }}
          RUST_INTEGRATION_BATCH_RESULT: ${{ needs.rust_integration_batches.result || 'skipped' }}
        run: |
          set -euo pipefail
          summary_file="${RUNNER_TEMP}/validation-summary.json"
          smoke_gate_result="skipped"
          if [[ "${{ needs.metadata.outputs.run_smoke_gate }}" == "true" ]]; then
            if [[ "${{ needs.smoke_workflow_lanes.result || 'skipped' }}" == "failure" || "${{ needs.smoke_node_lanes.result || 'skipped' }}" == "failure" || "${{ needs.smoke_rust_minimal_lanes.result || 'skipped' }}" == "failure" || "${{ needs.smoke_rust_integration_lanes.result || 'skipped' }}" == "failure" || "${{ needs.smoke_release_lanes.result || 'skipped' }}" == "failure" ]]; then
              smoke_gate_result="failure"
            elif [[ "${{ needs.smoke_workflow_lanes.result || 'skipped' }}" == "cancelled" || "${{ needs.smoke_node_lanes.result || 'skipped' }}" == "cancelled" || "${{ needs.smoke_rust_minimal_lanes.result || 'skipped' }}" == "cancelled" || "${{ needs.smoke_rust_integration_lanes.result || 'skipped' }}" == "cancelled" || "${{ needs.smoke_release_lanes.result || 'skipped' }}" == "cancelled" ]]; then
              smoke_gate_result="cancelled"
            elif [[ "${{ needs.smoke_workflow_lanes.result || 'skipped' }}" == "success" || "${{ needs.smoke_node_lanes.result || 'skipped' }}" == "success" || "${{ needs.smoke_rust_minimal_lanes.result || 'skipped' }}" == "success" || "${{ needs.smoke_rust_integration_lanes.result || 'skipped' }}" == "success" || "${{ needs.smoke_release_lanes.result || 'skipped' }}" == "success" ]]; then
              smoke_gate_result="success"
            fi
          fi
          combined_result() {
            local first="$1"
            local second="$2"
            if [[ "${first}" == "failure" || "${second}" == "failure" ]]; then
              echo "failure"
            elif [[ "${first}" == "cancelled" || "${second}" == "cancelled" ]]; then
              echo "cancelled"
            elif [[ "${first}" == "success" || "${second}" == "success" ]]; then
              echo "success"
            else
              echo "skipped"
            fi
          }
          rust_minimal_result="$(combined_result "${RUST_MINIMAL_RESULT}" "${RUST_MINIMAL_BATCH_RESULT}")"
          rust_integration_result="$(combined_result "${NEXTEST_ARCHIVE_RESULT}" "${RUST_INTEGRATION_ARCHIVE_RESULT}" "${RUST_INTEGRATION_RESULT}" "${RUST_INTEGRATION_BATCH_RESULT}")"
          python3 .github/scripts/aggregate_validation_summary.py \
            --repo "${GITHUB_REPOSITORY}" \
            --host-ref "${{ needs.metadata.outputs.host_ref }}" \
            --display-ref "${{ needs.metadata.outputs.display_ref }}" \
            --checkout-ref "${{ needs.metadata.outputs.checkout_ref }}" \
            --head-sha "${{ needs.metadata.outputs.head_sha }}" \
            --latest-head-sha "${{ needs.metadata.outputs.head_sha }}" \
            --profile "${{ inputs.profile }}" \
            --lane-set "${{ inputs.lane_set }}" \
            --profile-intent "${{ needs.metadata.outputs.profile_intent }}" \
            --profile-notes "${{ needs.metadata.outputs.profile_notes }}" \
            --lane-summary "${{ needs.metadata.outputs.lane_summary }}" \
            --planner-fingerprint "${{ needs.metadata.outputs.planner_fingerprint }}" \
            --planned-matrix-json '${{ needs.metadata.outputs.planned_matrix }}' \
            --selected-lane-ids-json '${{ needs.metadata.outputs.selected_lane_ids }}' \
            --explicit-lanes "${{ inputs.lanes }}" \
            --supersession-mode "${{ inputs.supersession_mode }}" \
            --supersession-key "${{ inputs.supersession_key }}" \
            --dedupe-should-skip "${{ needs.metadata.outputs.dedupe_should_skip }}" \
            --dedupe-reason "${{ needs.metadata.outputs.dedupe_reason }}" \
            --dedupe-matched-run-id "${{ needs.metadata.outputs.dedupe_matched_run_id }}" \
            --dedupe-matched-run-url "${{ needs.metadata.outputs.dedupe_matched_run_url }}" \
            --notes-supplied "false" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --run-selected-lanes "${{ needs.metadata.outputs.run_selected_lanes }}" \
            --run-smoke-gate "${{ needs.metadata.outputs.run_smoke_gate }}" \
            --smoke-gate-kind "${{ needs.metadata.outputs.smoke_gate_kind }}" \
            --smoke-gate-result "${smoke_gate_result}" \
            --workflow-result "${{ needs.workflow_lanes.result || 'skipped' }}" \
            --node-result "${{ needs.node_lanes.result || 'skipped' }}" \
            --rust-minimal-result "${rust_minimal_result}" \
            --rust-integration-result "${rust_integration_result}" \
            --release-result "${{ needs.release_lanes.result || 'skipped' }}" \
            --run-artifact "${{ needs.metadata.outputs.run_artifact }}" \
            --artifact-result "${{ needs.artifact.result || 'skipped' }}" \
            --matrix-fail-fast "${{ needs.metadata.outputs.matrix_fail_fast }}" \
            --rust-batching-mode "${{ needs.metadata.outputs.rust_batching_mode }}" \
            --rust-batching-reason "${{ needs.metadata.outputs.rust_batching_reason }}" \
            --cache-occupancy-json "${CACHE_OCCUPANCY_FILE:-}" \
            --lane-summary-dir "${RUNNER_TEMP}/validation-lane-summaries" \
            --output "${summary_file}"
          echo "SUMMARY_FILE=${summary_file}" >> "$GITHUB_ENV"

      - name: Upload validation summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: validation-summary
          path: ${{ env.SUMMARY_FILE }}
          overwrite: true
          retention-days: 3

      - name: Append validation summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' "${SUMMARY_FILE}" >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          summary = payload["summary"]
          print("### Validation summary")
          print()
          print(f"- Overall conclusion: `{summary['overall_conclusion']}`")
          print(f"- Profile: `{payload['selection']['profile']}`")
          print(f"- Lane set: `{payload['selection']['lane_set']}`")
          print(f"- Lane count: `{summary['lane_count']}`")
          print(f"- Total recorded lane runtime (ms): `{summary.get('total_duration_ms', 0)}`")
          print(f"- Rust batching: `{payload['selection'].get('rust_batching_mode') or 'off'}`")
          dedupe = payload.get("dedupe") or {}
          if dedupe.get("should_skip"):
              print(f"- Exact-plan reuse: `skipped`, reused {dedupe.get('matched_run_url') or 'prior run'}")
          elif dedupe.get("matched_run_url"):
              print(f"- Exact-plan reuse: `advisory`, prior match {dedupe.get('matched_run_url')}")
          head_freshness = summary.get("head_freshness") or {}
          if head_freshness:
              print(f"- Failed-lane freshness: `{head_freshness.get('failed_lane_classification', 'unknown')}`")
              rerun = head_freshness.get("recommended_rerun") or {}
              if rerun.get("needed"):
                  lanes = ", ".join(rerun.get("lane_ids") or []) or "selected lane"
                  print(f"- Latest-head proof: `{rerun.get('profile', 'targeted')}` lanes `{lanes}`")
          timing_breakdown = summary.get("timing_breakdown_ms") or {}
          if timing_breakdown:
              print("- Timing breakdown (ms):")
              for key, value in timing_breakdown.items():
                  print(f"  - `{key}`: `{value}`")
          setup_rows = summary.get("setup_classes") or []
          if setup_rows:
              print("- Setup class results:")
              for row in setup_rows:
                  print(
                      f"  - `{row['setup_class']}`: job `{row['job_result']}`, "
                      f"`{row['selected_lane_count']}` lanes"
                  )
          first_failure = summary.get("first_failure")
          if first_failure:
              print(f"- First surfaced blocker: `{first_failure.get('lane_id', 'unknown')}`")
              signal = first_failure.get("signal")
              if signal:
                  print(f"- First blocker signal: `{signal}`")
          PY
