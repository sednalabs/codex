name: Temporary V8 Cargo lock export

on:
  push:
    branches:
      - validation/w13825-v8-cargo-lock-20260907

permissions:
  contents: read

jobs:
  export:
    name: Export exact V8 Cargo lock product
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source freeze
        uses: actions/checkout@v7
        with:
          ref: 277aa00228367f1ba47214961bc26a05c1da2483
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity and preimages
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = 277aa00228367f1ba47214961bc26a05c1da2483
          test "$actual_tree" = db3ce92f08776e69fc2ec6b73b77d507a7a307b0
          test "$(git rev-parse HEAD:MODULE.bazel)" = ea89c1d5152f8dbe007f23ca63e07dd59c054ae1
          test "$(git rev-parse HEAD:codex-rs/Cargo.toml)" = 141880c1b07806929ebcb6a4c622898cf65b5435
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = 5117062519706acb938639c20c1e56c2dfe03274
          test "$(git rev-parse HEAD:third_party/v8/rusty_v8_150_4_0.sha256)" = fc884c8ebc1e2f36154a12ecbcd4cbe509d3bbc5
          git diff --quiet
          printf 'source_sha=%s\nsource_tree=%s\n' "$actual_sha" "$actual_tree" > v8-cargo-lock-export.identity

      - name: Regenerate the precise V8 Cargo lock product
        working-directory: codex-rs
        shell: bash
        run: cargo update -p v8@149.2.0 --precise 150.4.0

      - name: Normalize known prost-build resolver edges
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import subprocess
          import tomllib
          from pathlib import Path

          lock_path = Path("Cargo.lock")
          preimage_text = subprocess.check_output(
              ["git", "show", "HEAD:codex-rs/Cargo.lock"],
              text=True,
          )
          raw_text = lock_path.read_text(encoding="utf-8")
          preimage_doc = tomllib.loads(preimage_text)
          raw_doc = tomllib.loads(raw_text)

          def top_level(document):
              return {key: value for key, value in document.items() if key != "package"}

          def encoded_packages(document):
              return collections.Counter(
                  json.dumps(package, sort_keys=True, separators=(",", ":"))
                  for package in document.get("package", [])
              )

          def package_delta(old_document, new_document):
              old_packages = encoded_packages(old_document)
              new_packages = encoded_packages(new_document)
              removed = [
                  json.loads(package)
                  for package in (old_packages - new_packages).elements()
              ]
              added = [
                  json.loads(package)
                  for package in (new_packages - old_packages).elements()
              ]
              return removed, added

          def package(
              name,
              version,
              checksum,
              dependencies,
          ):
              return {
                  "name": name,
                  "version": version,
                  "source": "registry+https://github.com/rust-lang/crates.io-index",
                  "checksum": checksum,
                  "dependencies": dependencies,
              }

          preimage_targets = [
              package(
                  "prost-build",
                  "0.12.6",
                  "22505a5c94da8e3b7c2996394d1c933236c4d743e81a410bcca4e6989fc066a4",
                  [
                      "bytes",
                      "heck 0.4.1",
                      "itertools 0.12.1",
                      "log",
                      "multimap",
                      "once_cell",
                      "petgraph 0.6.5",
                      "prettyplease",
                      "prost 0.12.6",
                      "prost-types 0.12.6",
                      "regex",
                      "syn 2.0.119",
                      "tempfile",
                  ],
              ),
              package(
                  "prost-build",
                  "0.14.4",
                  "03da047801ff44bb6a4d407d4860c05fd70bb81714e6b2f3812603d5b145b042",
                  [
                      "heck 0.4.1",
                      "itertools 0.14.0",
                      "log",
                      "multimap",
                      "petgraph 0.8.3",
                      "prettyplease",
                      "prost 0.14.4",
                      "prost-types 0.14.4",
                      "regex",
                      "syn 2.0.119",
                      "tempfile",
                  ],
              ),
          ]
          raw_targets = [
              {
                  **target,
                  "dependencies": [
                      "heck 0.5.0" if dependency == "heck 0.4.1" else dependency
                      for dependency in target["dependencies"]
                  ],
              }
              for target in preimage_targets
          ]
          old_v8 = package(
              "v8",
              "149.2.0",
              "46dccf61a364b61bbaac70a8ba64a1a1006e87123b7d62eaeec999a3ba31ecdb",
              [
                  "bindgen",
                  "bitflags 2.13.1",
                  "fslock",
                  "gzip-header",
                  "home",
                  "miniz_oxide",
                  "paste",
                  "temporal_capi",
                  "which 6.0.3",
              ],
          )
          new_v8 = {
              **old_v8,
              "version": "150.4.0",
              "checksum": "42a978ff11f15b24e5c05a7123cf2b68f41e763546699781a924ef4e2cf43a49",
          }

          if top_level(preimage_doc) != top_level(raw_doc):
              raise SystemExit("unexpected raw top-level Cargo.lock change")
          raw_removed, raw_added = package_delta(preimage_doc, raw_doc)
          if encoded_packages({"package": raw_removed}) != encoded_packages(
              {"package": [*preimage_targets, old_v8]}
          ):
              raise SystemExit("unexpected raw removed-package set")
          if encoded_packages({"package": raw_added}) != encoded_packages(
              {"package": [*raw_targets, new_v8]}
          ):
              raise SystemExit("unexpected raw added-package set")

          preimage_packages = preimage_doc.get("package", [])
          raw_packages = raw_doc.get("package", [])
          for expected_preimage, expected_raw in zip(
              preimage_targets,
              raw_targets,
              strict=True,
          ):
              preimage_matches = [
                  item
                  for item in preimage_packages
                  if item.get("name") == expected_preimage["name"]
                  and item.get("version") == expected_preimage["version"]
              ]
              raw_matches = [
                  item
                  for item in raw_packages
                  if item.get("name") == expected_raw["name"]
                  and item.get("version") == expected_raw["version"]
              ]
              if preimage_matches != [expected_preimage]:
                  raise SystemExit(
                      f"unexpected preimage package record: "
                      f"{expected_preimage['name']}@{expected_preimage['version']}"
                  )
              if raw_matches != [expected_raw]:
                  raise SystemExit(
                      f"unexpected raw package record: "
                      f"{expected_raw['name']}@{expected_raw['version']}"
                  )

          lines = raw_text.splitlines(keepends=True)
          package_starts = [
              index for index, line in enumerate(lines) if line == "[[package]]\n"
          ]
          spans = [
              (start, package_starts[index + 1] if index + 1 < len(package_starts) else len(lines))
              for index, start in enumerate(package_starts)
          ]
          changed_indexes = []
          for expected_raw in raw_targets:
              matching_spans = []
              for start, end in spans:
                  parsed = tomllib.loads("".join(lines[start:end]))
                  packages = parsed.get("package", [])
                  if packages == [expected_raw]:
                      matching_spans.append((start, end))
              if len(matching_spans) != 1:
                  raise SystemExit(
                      f"expected one exact raw text block for "
                      f"{expected_raw['name']}@{expected_raw['version']}"
                  )
              start, end = matching_spans[0]
              edge_indexes = [
                  index
                  for index in range(start, end)
                  if lines[index] == ' "heck 0.5.0",\n'
              ]
              if len(edge_indexes) != 1:
                  raise SystemExit(
                      f"expected one exact raw heck edge for "
                      f"{expected_raw['name']}@{expected_raw['version']}"
                  )
              edge_index = edge_indexes[0]
              lines[edge_index] = ' "heck 0.4.1",\n'
              changed_indexes.append(edge_index)

          normalized_text = "".join(lines)
          changed_lines = [
              index
              for index, (raw_line, normalized_line) in enumerate(
                  zip(
                      raw_text.splitlines(keepends=True),
                      normalized_text.splitlines(keepends=True),
                      strict=True,
                  )
              )
              if raw_line != normalized_line
          ]
          if changed_lines != changed_indexes or len(changed_lines) != 2:
              raise SystemExit("normalization changed other text")

          normalized_doc = tomllib.loads(normalized_text)
          if top_level(normalized_doc) != top_level(preimage_doc):
              raise SystemExit("normalized top-level Cargo.lock metadata changed")
          normalized_removed, normalized_added = package_delta(
              preimage_doc,
              normalized_doc,
          )
          if normalized_removed != [old_v8] or normalized_added != [new_v8]:
              raise SystemExit("normalized package delta is not exact V8-only")

          lock_path.write_text(normalized_text, encoding="utf-8")
          evidence = {
              "preimage_sha256": hashlib.sha256(preimage_text.encode()).hexdigest(),
              "raw_sha256": hashlib.sha256(raw_text.encode()).hexdigest(),
              "normalized_sha256": hashlib.sha256(normalized_text.encode()).hexdigest(),
              "raw_removed_packages": raw_removed,
              "raw_added_packages": raw_added,
              "restored_packages": [
                  {
                      "name": preimage["name"],
                      "version": preimage["version"],
                      "preimage_dependencies": preimage["dependencies"],
                      "raw_dependencies": raw["dependencies"],
                  }
                  for preimage, raw in zip(preimage_targets, raw_targets, strict=True)
              ],
              "normalized_removed_packages": normalized_removed,
              "normalized_added_packages": normalized_added,
          }
          Path("../v8-cargo-lock-export.normalization.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify generated Cargo lock
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Attribute the complete generated delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only > v8-cargo-lock-export.paths
          test "$(cat v8-cargo-lock-export.paths)" = codex-rs/Cargo.lock
          git diff --binary -- codex-rs/Cargo.lock > v8-cargo-lock-export.patch
          git diff --numstat -- codex-rs/Cargo.lock > v8-cargo-lock-export.numstat
          python3 - <<'PY'
          import collections
          import json
          import subprocess
          import tomllib
          from pathlib import Path

          old_doc = tomllib.loads(
              subprocess.check_output(
                  ["git", "show", "HEAD:codex-rs/Cargo.lock"],
                  text=True,
              )
          )
          new_doc = tomllib.loads(
              Path("codex-rs/Cargo.lock").read_text(encoding="utf-8")
          )

          def encoded_packages(document):
              return [
                  json.dumps(package, sort_keys=True, separators=(",", ":"))
                  for package in document.get("package", [])
              ]

          old_packages = collections.Counter(encoded_packages(old_doc))
          new_packages = collections.Counter(encoded_packages(new_doc))
          removed = list((old_packages - new_packages).elements())
          added = list((new_packages - old_packages).elements())
          payload = {
              "old_top_level": {
                  key: value for key, value in old_doc.items() if key != "package"
              },
              "new_top_level": {
                  key: value for key, value in new_doc.items() if key != "package"
              },
              "removed_packages": [json.loads(package) for package in removed],
              "added_packages": [json.loads(package) for package in added],
          }
          Path("v8-cargo-lock-export.attribution.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          {
            cat v8-cargo-lock-export.identity
            printf 'changed_paths=%s\n' "$(paste -sd, v8-cargo-lock-export.paths)"
            printf 'diff_stat=%s\n' "$(git diff --stat -- codex-rs/Cargo.lock | tr '\n' ' ')"
            sha256sum v8-cargo-lock-export.patch
            wc -c v8-cargo-lock-export.patch
            sha256sum v8-cargo-lock-export.attribution.json
            wc -c v8-cargo-lock-export.attribution.json
            sha256sum v8-cargo-lock-export.normalization.json
            wc -c v8-cargo-lock-export.normalization.json
          } > v8-cargo-lock-export.proof

      - name: Upload generated product and attribution
        uses: actions/upload-artifact@v7
        with:
          name: v8-cargo-lock-export-150.4.0
          path: |
            v8-cargo-lock-export.patch
            v8-cargo-lock-export.paths
            v8-cargo-lock-export.numstat
            v8-cargo-lock-export.identity
            v8-cargo-lock-export.attribution.json
            v8-cargo-lock-export.normalization.json
            v8-cargo-lock-export.proof
          if-no-files-found: error
          retention-days: 7

      - name: Enforce the admitted V8 package scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("v8-cargo-lock-export.attribution.json").read_text(encoding="utf-8")
          )
          removed = payload["removed_packages"]
          added = payload["added_packages"]
          if len(removed) != 1 or len(added) != 1:
              raise SystemExit("unexpected material package scope; inspect uploaded attribution")
          old = removed[0]
          new = added[0]
          expected_old = {
              "name": "v8",
              "version": "149.2.0",
              "checksum": "46dccf61a364b61bbaac70a8ba64a1a1006e87123b7d62eaeec999a3ba31ecdb",
          }
          expected_new = {
              "name": "v8",
              "version": "150.4.0",
              "checksum": "42a978ff11f15b24e5c05a7123cf2b68f41e763546699781a924ef4e2cf43a49",
          }
          for key, value in expected_old.items():
              if old.get(key) != value:
                  raise SystemExit(f"unexpected old v8 {key}: {old.get(key)!r}")
          for key, value in expected_new.items():
              if new.get(key) != value:
                  raise SystemExit(f"unexpected new v8 {key}: {new.get(key)!r}")
          if old.get("dependencies") != new.get("dependencies"):
              raise SystemExit("unexpected material v8 dependency-list change")
          PY
