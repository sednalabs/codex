name: Temporary model-switch snapshot proof

on:
  push:
    branches:
      - validation/w14939-snapshot-c51a477
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f5b20685d2a12161626e8f4c4a5d2c059c71dccd
          persist-credentials: false
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = f5b20685d2a12161626e8f4c4a5d2c059c71dccd
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
      - name: Diagnose dynamic tool event ordering
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo test --locked -p codex-core --test all tool_result_history_keeps_originating_model_across_switch_and_replay -- --nocapture
      - name: Run turn usage accounting tests
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo test --locked -p codex-core --lib record_token_usage_ -- --nocapture
      - name: Run overlapping compaction integration scenarios
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo test --locked -p codex-core --test all async_compaction_reuses_pending_work -- --nocapture
