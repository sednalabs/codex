name: Temporary model-switch snapshot proof

on:
  push:
    branches:
      - validation/w14939-snapshot-c51a477
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4d66a3f37dd69f448adda4c9aec1bc8b8b3445f9
          persist-credentials: false
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = 4d66a3f37dd69f448adda4c9aec1bc8b8b3445f9
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
      - name: Diagnose dynamic tool event ordering
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo test --locked -p codex-core --test all tool_result_history_keeps_originating_model_across_switch_and_replay -- --nocapture
