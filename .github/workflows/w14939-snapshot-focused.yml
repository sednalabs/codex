name: Temporary model-switch snapshot proof

on:
  push:
    branches:
      - validation/w14939-snapshot-c51a477
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1229c1099fe3a2a049112b72a17f9e776ec7b41b
          persist-credentials: false
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = 1229c1099fe3a2a049112b72a17f9e776ec7b41b
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
      - name: Run model-switch integration variants
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo test --locked -p codex-core --test all incremental_tools_append_changed_catalog_without_rewriting_history -- --nocapture
      - name: Run capacity retry and effort regression
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo test --locked -p codex-core --test all reasoning_effort_override_retry_after_terminal_error_keeps_latest_adjacent_update -- --nocapture
