name: Temporary model-switch snapshot proof

on:
  push:
    branches:
      - validation/w14939-snapshot-c51a477
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c0b4d623d31e4f06929d9f5177e68b1ffe097c31
          persist-credentials: false
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = c0b4d623d31e4f06929d9f5177e68b1ffe097c31
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
      - name: Run turn usage accounting tests
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo test --locked -p codex-core --lib record_token_usage_ -- --nocapture
      - name: Run overlapping compaction integration scenarios
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo test --locked -p codex-core --test all async_compaction_reuses_pending_work -- --nocapture
