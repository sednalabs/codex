name: Apply diagnostic spawn-boundary refinement

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 656 &&
      github.head_ref == 'diag/goal-error-continuation-probe-20260821' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: diag/goal-error-continuation-probe-20260821
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          python3 .github/scripts/diag_multi_agent_stress_refine.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --all

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/core/src/tools/handlers/multi_agents_v2/spawn.rs \
                  codex-rs/core/src/agent/control/spawn.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: trace V2 child work submission boundary"
          git push origin HEAD:diag/goal-error-continuation-probe-20260821
