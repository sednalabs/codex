name: Runtime consumer qualification

on:
  push:
    branches: [validation/runtime-consumer-20261030]

permissions:
  contents: read
  actions: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d
        with:
          toolchain: 1.96.0
      - name: Compile fixture while producer builds
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git fetch --no-tags --depth=1 origin 4c8f1a3843d1a8af194192b755ec8c04aa27f16b
          git diff --quiet 4c8f1a3843d1a8af194192b755ec8c04aa27f16b HEAD -- codex-rs ':(exclude)codex-rs/cli/tests/runtime_execution_proof.rs' ':(exclude)codex-rs/cli/tests/runtime_execution_proof/support.rs'
          export CARGO_BUILD_JOBS=2
          cargo test --locked -p codex-runtime-proof --lib outcome_projection::tests
          cargo test --locked -p codex-runtime-proof --lib mcp_model_selection_is_policy_versioned_and_scoped
          cargo test --locked -p codex-exec --lib protected_runtime_accepts_only_the_fixed_four_tool_profile
          cargo test --locked -p codex-cli --test runtime_execution_proof --no-run --message-format=json > "$RUNNER_TEMP/consumer-build.jsonl"
      - name: Await exact producer package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 41625340040 --repo "$GITHUB_REPOSITORY" --interval 120 --exit-status
      - name: Download exact producer package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 41625340040
          name: sedna-branch-4c8f1a3843d1a8af194192b755ec8c04aa27f16b-4c8f1a38-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/producer-package
      - name: Bind package to corrected consumer source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/producer-package"
          mapfile -t manifests < <(find . -maxdepth 1 -name '*.json' -type f)
          mapfile -t archives < <(find . -maxdepth 1 -name '*.tar.gz' -type f)
          test "${#manifests[@]}" -eq 1
          test "${#archives[@]}" -eq 1
          jq -e '.commit == "4c8f1a3843d1a8af194192b755ec8c04aa27f16b"' "${manifests[0]}" >/dev/null
          mkdir -p "$RUNNER_TEMP/producer-unpacked"
          tar -xzf "${archives[0]}" -C "$RUNNER_TEMP/producer-unpacked"
          sha256sum "${archives[0]}" "$RUNNER_TEMP/producer-unpacked/codex" "$RUNNER_TEMP/producer-unpacked/codex-runtime-proof-launcher" "$RUNNER_TEMP/producer-unpacked/install_runtime_proof_launcher" "$RUNNER_TEMP/producer-unpacked/systemd/codex-runtime-proof-claim.service"
          test "$(sha256sum "$RUNNER_TEMP/producer-unpacked/codex-runtime-proof-launcher" | cut -d' ' -f1)" = "$(jq -r .runtimeProofLauncherSha256 "${manifests[0]}")"
          test "$(sha256sum "$RUNNER_TEMP/producer-unpacked/install_runtime_proof_launcher" | cut -d' ' -f1)" = "$(jq -r .runtimeProofLauncherInstallerSha256 "${manifests[0]}")"
          test "$(sha256sum "$RUNNER_TEMP/producer-unpacked/systemd/codex-runtime-proof-claim.service" | cut -d' ' -f1)" = "$(git -C "$GITHUB_WORKSPACE" show 4c8f1a3843d1a8af194192b755ec8c04aa27f16b:codex-rs/runtime-proof/systemd/codex-runtime-proof-claim.service | sha256sum | cut -d' ' -f1)"
      - name: Build and run targeted consumer checks
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          test_binary="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "runtime_execution_proof" and .profile.test == true and .executable != null) | .executable' "$RUNNER_TEMP/consumer-build.jsonl")"
          test -n "$test_binary"
          test -f "$RUNNER_TEMP/producer-unpacked/codex"
          sudo install -d -m 0755 /usr/local/libexec/codex-consumer-fixture
          sudo install -m 0755 "$test_binary" /usr/local/libexec/codex-consumer-fixture/test
          sudo install -m 0755 "$RUNNER_TEMP/producer-unpacked/codex" /usr/local/libexec/codex-consumer-fixture/codex
          test "$(sha256sum "$RUNNER_TEMP/producer-unpacked/codex" | cut -d' ' -f1)" = "$(sha256sum /usr/local/libexec/codex-consumer-fixture/codex | cut -d' ' -f1)"
          printf '%s' synthetic | sudo tee /usr/local/libexec/codex-consumer-fixture/credential >/dev/null
          printf '%s' '{}' | sudo tee /usr/local/libexec/codex-consumer-fixture/policy.json >/dev/null
          if getent group codex-runtime-proof >/dev/null; then exit 1; fi
          sudo groupadd --non-unique --gid 981 codex-runtime-proof
      - name: Exercise consumer under fixed unit profile
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          unit=codex-consumer-fixture.service
          sed -E \
            -e 's|^ConditionPathExists=.*|ConditionPathExists=/usr/local/libexec/codex-consumer-fixture/policy.json|' \
            -e 's|^(LoadCredential=[^:]+)(:.*)?$|\1:/usr/local/libexec/codex-consumer-fixture/credential|' \
            -e 's|^StandardOutput=null$|StandardOutput=journal|' \
            -e 's|^ExecStart=.*|Environment=CARGO_BIN_EXE_codex=/usr/local/libexec/codex-consumer-fixture/codex\nExecStart=/usr/local/libexec/codex-consumer-fixture/test --exact protected_cli_starts_with_launcher_home_and_four_tool_profile --ignored --nocapture --test-threads=1|' \
            runtime-proof/systemd/codex-runtime-proof-claim.service > "$RUNNER_TEMP/$unit"
          sudo install -m 0644 "$RUNNER_TEMP/$unit" "/etc/systemd/system/$unit"
          sudo systemctl daemon-reload
          rc=0
          sudo systemctl start "$unit" || rc=$?
          sudo systemctl show --no-pager "$unit" \
            --property=LoadState --property=ActiveState --property=SubState \
            --property=ConditionResult --property=Result --property=StatusText \
            --property=ExecMainCode --property=ExecMainStatus --property=User --property=Group || true
          sudo journalctl -u "$unit" --no-pager -o cat |
            grep -Ei 'runtime-proof-root-stage:|runtime-proof-root-cli-failure:|runtime-proof-root-startup-failure:|runtime-proof-root-ack-failure:|launcher-layout-|test result:|failed at step|main process exited|failed with result|failed to start|permission denied|no such file|not found|invalid argument|timed out|status=.*(failure|timeout|signal)' |
            tail -n 80 || true
          exit "$rc"
