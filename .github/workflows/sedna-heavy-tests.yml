name: sedna-heavy-tests
run-name: >-
  sedna-heavy-tests
  ${{ github.event_name == 'workflow_dispatch' && ' [manual]' ||
      github.event_name == 'pull_request' && format(' [pr={0}]', github.event.pull_request.number) ||
      ' [branch]' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate
        required: false
        type: string
      lane:
        description: Downstream regression lane
        required: true
        type: choice
        options:
          - all
          - core-compile-smoke
          - core-carry-core-smoke
          - codex.nextest-archive-core-carry-pilot
          - core-carry-ui-smoke
          - core-ledger-smoke
          - core-runtime-surface-smoke
          - codex.external-agent-session-migration-targeted
          - codex.external-agent-migration-containment-targeted
          - codex.skill-loader-fixture-hermeticity-targeted
          - codex.core-startup-sync-targeted
          - codex.core-subagent-surface-targeted
          - codex.core-subagent-inspect-tree-fallback-targeted
          - codex.core-subagent-notification-contract-targeted
          - codex.core-subagent-notification-visibility-targeted
          - codex.tui-thread-session-policy-targeted
          - codex.tui-esc-interrupt-targeted
          - codex.tui-front-queue-submit-targeted
          - codex.tui-transcript-viewport-targeted
          - codex.tui-brokered-tool-replay-targeted
          - codex.tui-config-refresh-session-targeted
          - codex.tui-agent-picker-usage-targeted
          - codex.tui-agent-picker-targeted
          - codex.tui-agent-picker-model-surface-targeted
          - codex.spawn-agent-tool-model-surface-targeted
          - codex.spawn-agent-description-model-surface-targeted
          - codex.tui-agent-picker-tree-targeted
          - codex.tui-agent-usage-totals-targeted
          - codex.tui-weekly-pacing-status-line-targeted
          - codex.core-multi-agent-orchestration-targeted
          - codex.blocking-waits-core-targeted
          - codex.blocking-waits-unified-exec-targeted
          - codex.blocking-waits-app-server-targeted
          - codex.blocking-waits-mcp-targeted
          - codex.custom-prompts-targeted
          - codex.mcp-tool-exposure-targeted
          - codex.mcp-safety-targeted
          - codex.mcp-device-login-targeted
          - codex.core-subagent-model-pinning-targeted
          - codex.core-persisted-subagent-descendants-targeted
          - codex.core-context-serialization-targeted
          - codex.core-attestation-targeted
          - codex.state-spawn-lineage-contract-targeted
          - codex.state-migration-repair-targeted
          - codex.code-mode-declaration-targeted
          - codex.inference-observation-contract-targeted
          - codex.app-server-protocol-test
          - codex.app-server-computer-use-targeted
          - codex.tui-native-computer-use-targeted
          - codex.exec-native-computer-use-targeted
          - codex.native-computer-use-tool-registry-targeted
          - codex.native-computer-use-doctor-targeted
          - codex.app-server-thread-cwd-targeted
          - codex.app-server-v2-contract-targeted
          - codex.mcp-server-contract-targeted
          - codex.exec-server-targeted
          - codex.cli-surface-targeted
          - codex.workflow-security-targeted
          - codex.sdk-python-targeted
          - codex.sdk-typescript-targeted
          - codex.agent-workflow-sanity
          - codex.shell-tool-mcp-ci
          - codex.build-policy-sanity
          - codex.workflow-ci-sanity
          - codex.argument-comment-lint
          - codex.downstream-docs-check
          - codex.downstream-divergence-audit
          - sedna.release-linux-smoke
          - downstream-ledger-seam
        default: all
      rust_batching:
        description: Batch downstream Rust lanes to reuse runner-local build artifacts
        required: false
        type: choice
        options:
          - auto
          - "off"
          - force
        default: auto
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
#  schedule:
#    - cron: "15 16 * * *"
concurrency:
  group: >-
    ${{
      github.workflow
    }}-${{
      github.event_name == 'workflow_dispatch' &&
      format('{0}-{1}', inputs.ref || github.ref_name, inputs.lane || 'all') ||
      github.event_name == 'pull_request' &&
      format('pr-{0}', github.event.pull_request.number) ||
      github.ref_name
    }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_name != 'main' && github.ref_name != 'upstream-main' }}

permissions:
  actions: read
  contents: read

jobs:
  metadata:
    name: Resolve heavy-test checkout ref and lane selection
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (
          (github.event.action != 'labeled' || github.event.label.name == 'ci:heavy') &&
          (github.event.pull_request.draft == false || github.event.label.name == 'ci:heavy')
        )
      }}
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      checkout_sha: ${{ steps.meta.outputs.checkout_sha }}
      display_ref: ${{ steps.meta.outputs.display_ref }}
      event_policy: ${{ steps.meta.outputs.event_policy }}
      planner_fingerprint: ${{ steps.meta.outputs.planner_fingerprint }}
      dedupe_reason: ${{ steps.meta.outputs.dedupe_reason }}
      smoke_gate_kind: ${{ steps.meta.outputs.smoke_gate_kind }}
      smoke_matrix: ${{ steps.meta.outputs.smoke_matrix }}
      smoke_workflow_matrix: ${{ steps.meta.outputs.smoke_workflow_matrix }}
      smoke_node_matrix: ${{ steps.meta.outputs.smoke_node_matrix }}
      smoke_rust_minimal_matrix: ${{ steps.meta.outputs.smoke_rust_minimal_matrix }}
      smoke_rust_integration_matrix: ${{ steps.meta.outputs.smoke_rust_integration_matrix }}
      smoke_release_matrix: ${{ steps.meta.outputs.smoke_release_matrix }}
      smoke_workflow_lane_count: ${{ steps.meta.outputs.smoke_workflow_lane_count }}
      smoke_node_lane_count: ${{ steps.meta.outputs.smoke_node_lane_count }}
      smoke_rust_minimal_lane_count: ${{ steps.meta.outputs.smoke_rust_minimal_lane_count }}
      smoke_rust_integration_lane_count: ${{ steps.meta.outputs.smoke_rust_integration_lane_count }}
      smoke_release_lane_count: ${{ steps.meta.outputs.smoke_release_lane_count }}
      run_smoke_gate: ${{ steps.meta.outputs.run_smoke_gate }}
      run_selected_lanes: ${{ steps.meta.outputs.run_selected_lanes }}
      planned_matrix: ${{ steps.meta.outputs.planned_matrix }}
      selected_matrix: ${{ steps.meta.outputs.selected_matrix }}
      selected_workflow_matrix: ${{ steps.meta.outputs.selected_workflow_matrix }}
      selected_node_matrix: ${{ steps.meta.outputs.selected_node_matrix }}
      selected_rust_minimal_matrix: ${{ steps.meta.outputs.selected_rust_minimal_matrix }}
      selected_rust_integration_matrix: ${{ steps.meta.outputs.selected_rust_integration_matrix }}
      selected_release_matrix: ${{ steps.meta.outputs.selected_release_matrix }}
      selected_rust_minimal_batch_matrix: ${{ steps.meta.outputs.selected_rust_minimal_batch_matrix }}
      selected_rust_integration_batch_matrix: ${{ steps.meta.outputs.selected_rust_integration_batch_matrix }}
      selected_lane_ids: ${{ steps.meta.outputs.selected_lane_ids }}
      selected_workflow_lane_count: ${{ steps.meta.outputs.selected_workflow_lane_count }}
      selected_node_lane_count: ${{ steps.meta.outputs.selected_node_lane_count }}
      selected_rust_minimal_lane_count: ${{ steps.meta.outputs.selected_rust_minimal_lane_count }}
      selected_rust_integration_lane_count: ${{ steps.meta.outputs.selected_rust_integration_lane_count }}
      selected_release_lane_count: ${{ steps.meta.outputs.selected_release_lane_count }}
      selected_rust_minimal_batch_count: ${{ steps.meta.outputs.selected_rust_minimal_batch_count }}
      selected_rust_integration_batch_count: ${{ steps.meta.outputs.selected_rust_integration_batch_count }}
      rust_batching_mode: ${{ steps.meta.outputs.rust_batching_mode }}
      rust_batching_reason: ${{ steps.meta.outputs.rust_batching_reason }}
      matrix_fail_fast: ${{ steps.meta.outputs.matrix_fail_fast }}
      continue_after_smoke_failure: ${{ steps.meta.outputs.continue_after_smoke_failure }}
      eager_release_lanes: ${{ steps.meta.outputs.eager_release_lanes }}
      workflow_max_parallel: ${{ steps.meta.outputs.workflow_max_parallel }}
      node_max_parallel: ${{ steps.meta.outputs.node_max_parallel }}
      rust_minimal_max_parallel: ${{ steps.meta.outputs.rust_minimal_max_parallel }}
      rust_integration_max_parallel: ${{ steps.meta.outputs.rust_integration_max_parallel }}
      release_max_parallel: ${{ steps.meta.outputs.release_max_parallel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Resolve lane selection from the workflow revision itself so manual runs
          # can target older refs that predate this planner script.
          ref: ${{ github.workflow_sha || github.sha }}

      - name: Compute checkout ref
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ github.sha }}
          DISPLAY_REF: ${{ github.ref_name }}
          INPUT_REF: ${{ inputs.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REQUESTED_LANE: ${{ inputs.lane }}
          INPUT_RUST_BATCHING: ${{ inputs.rust_batching || 'auto' }}
          INPUT_RUST_BATCHING_OVERRIDE: ${{ vars.SEDNA_HEAVY_RUST_BATCHING }}
        run: |
          set -euo pipefail

          # BEGIN checkout identity
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              event_policy="pull_request_exact_head_lane_fingerprint"
              ;;
            workflow_dispatch)
              event_policy="workflow_dispatch_exact_head_manual"
              ;;
            *)
              echo "unsupported event for sedna-heavy-tests checkout identity: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          resolve_checkout_identity() {
            checkout_ref="${CHECKOUT_REF}"
            checkout_sha="${CHECKOUT_REF}"
            display_ref="${DISPLAY_REF}"

            case "${GITHUB_EVENT_NAME}" in
              pull_request)
                checkout_ref="${PR_HEAD_SHA}"
                checkout_sha="${PR_HEAD_SHA}"
                display_ref="${PR_HEAD_REF}"
                ;;
              workflow_dispatch)
                if [[ -n "${INPUT_REF}" ]]; then
                  checkout_ref="${INPUT_REF}"
                  display_ref="${INPUT_REF}"
                fi
                ;;
            esac

            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_REF}" ]]; then
              if [[ "${INPUT_REF}" == -* || "${INPUT_REF}" =~ [[:cntrl:]] ]]; then
                echo "unsafe checkout ref input rejected" >&2
                return 1
              fi
              if [[ ! "${INPUT_REF}" =~ ^[0-9a-fA-F]{40}$ ]] && ! git check-ref-format --allow-onelevel "${INPUT_REF}" 2>/dev/null; then
                echo "invalid checkout ref input rejected" >&2
                return 1
              fi
              if [[ "${checkout_ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
                if ! resolved_checkout_sha="$(git rev-parse --verify "${checkout_ref}^{commit}" 2>/dev/null)"; then
                  if ! git fetch --no-tags --depth=1 origin -- "${checkout_ref}"; then
                    echo "unable to fetch checkout ref: ${checkout_ref}" >&2
                    return 1
                  fi
                  if ! resolved_checkout_sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}' 2>/dev/null)"; then
                    echo "unable to resolve checkout ref to a commit: ${checkout_ref}" >&2
                    return 1
                  fi
                fi
              else
                if ! git fetch --no-tags --depth=1 origin -- "${checkout_ref}"; then
                  echo "unable to fetch checkout ref: ${checkout_ref}" >&2
                  return 1
                fi
                if ! resolved_checkout_sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}' 2>/dev/null)"; then
                  echo "unable to resolve checkout ref to a commit: ${checkout_ref}" >&2
                  return 1
                fi
              fi
              if [[ ! "${resolved_checkout_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "unable to resolve checkout ref to a commit: ${checkout_ref}" >&2
                return 1
              fi
              checkout_sha="${resolved_checkout_sha}"
              checkout_ref="${resolved_checkout_sha}"
            else
              checkout_ref="${checkout_sha}"
            fi
          }

          resolve_checkout_identity
          {
            echo "checkout_ref=${checkout_ref}"
            echo "checkout_sha=${checkout_sha}"
            echo "display_ref=${display_ref}"
            echo "event_policy=${event_policy}"
          } >> "$GITHUB_OUTPUT"
          # END checkout identity

          run_all_lanes=false
          run_core_family=false
          run_attestation_family=false
          run_workflow_family=false
          run_ui_protocol_family=false
          run_docs_family=false
          files=()

          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci:heavy') }}" == 'true' ]]; then
              run_all_lanes=true
            fi

            BASE_SHA='${{ github.event.pull_request.base.sha }}'
            HEAD_SHA='${{ github.event.pull_request.head.sha }}'
            mapfile -t files < <(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
          else
            run_all_lanes=true
          fi

          for f in "${files[@]}"; do
            case "$f" in
              codex-rs/Cargo.toml|codex-rs/Cargo.lock)
                run_core_family=true
                run_ui_protocol_family=true
                ;;
              codex-rs/memories/write/src/phase2.rs|codex-rs/memories/write/src/phase2_attestation.rs|codex-rs/memories/write/src/phase2_attestation_tests.rs|codex-rs/memories/write/src/startup_tests.rs|codex-rs/state/src/runtime/phase2_attestation.rs|codex-rs/state/migrations/0024_phase2_attestation_roots.sql|codex-rs/state/migrations/0038_phase2_attested_baselines.sql)
                run_core_family=true
                run_attestation_family=true
                ;;
              codex-rs/cli/*|codex-rs/common/*|codex-rs/core/*|codex-rs/hooks/*|codex-rs/linux-sandbox/*|codex-rs/state/*|codex-rs/windows-sandbox-rs/*)
                run_core_family=true
                ;;
              codex-rs/code-mode/*)
                run_core_family=true
              ;;
              codex-rs/app-server/*|codex-rs/app-server-protocol/*|codex-rs/protocol/*|codex-rs/tui/*)
                run_ui_protocol_family=true
                ;;
              docs/carry-divergence-ledger.md|docs/downstream-regression-matrix.md|docs/downstream-tool-surface-matrix.md|docs/downstream.md)
                run_docs_family=true
                ;;
              .github/*|justfile)
                run_workflow_family=true
                ;;
            esac
          done

          changed_files_json_path="${RUNNER_TEMP:-.}/sedna-heavy-changed-files.json"
          if ((${#files[@]} == 0)); then
            printf '[]\n' > "${changed_files_json_path}"
          else
            printf '%s\n' "${files[@]}" | jq -R . | jq -sc . > "${changed_files_json_path}"
          fi
          selection_meta="$(
            env -i \
              HOME="${HOME:-}" \
              PATH="${PATH}" \
              python3 .github/scripts/resolve_validation_plan.py heavy --event-name "${GITHUB_EVENT_NAME}" --requested-lane "${REQUESTED_LANE}" --run-all-lanes "${run_all_lanes}" --run-core-family "${run_core_family}" --run-attestation-family "${run_attestation_family}" --run-workflow-family "${run_workflow_family}" --run-ui-protocol-family "${run_ui_protocol_family}" --run-docs-family "${run_docs_family}" --changed-files-json-file "${changed_files_json_path}" --rust-batching "${INPUT_RUST_BATCHING}" --rust-batching-override "${INPUT_RUST_BATCHING_OVERRIDE}"
          )"
          selection_meta_path="${RUNNER_TEMP:-.}/sedna-heavy-selection-meta.json"
          printf '%s\n' "${selection_meta}" > "${selection_meta_path}"

          parse_meta() {
            local field="$1"
            env -i PATH="${PATH}" SELECTION_META_PATH="${selection_meta_path}" python3 - "$field" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          field = sys.argv[1]
          meta = json.loads(Path(os.environ["SELECTION_META_PATH"]).read_text(encoding="utf-8"))
          value = meta[field]
          if isinstance(value, (dict, list)):
              print(json.dumps(value, separators=(",", ":")))
          else:
              print(value)
          PY
          }

          run_smoke_gate="$(parse_meta "run_smoke_gate")"
          smoke_gate_kind="$(parse_meta "smoke_gate_kind")"
          smoke_json="$(parse_meta "smoke_matrix")"
          smoke_workflow_json="$(parse_meta "smoke_workflow_matrix")"
          smoke_node_json="$(parse_meta "smoke_node_matrix")"
          smoke_rust_minimal_json="$(parse_meta "smoke_rust_minimal_matrix")"
          smoke_rust_integration_json="$(parse_meta "smoke_rust_integration_matrix")"
          smoke_release_json="$(parse_meta "smoke_release_matrix")"
          planned_json="$(parse_meta "planned_matrix")"
          selected_json="$(parse_meta "selected_matrix")"
          selected_workflow_json="$(parse_meta "selected_workflow_matrix")"
          selected_node_json="$(parse_meta "selected_node_matrix")"
          selected_rust_minimal_json="$(parse_meta "selected_rust_minimal_matrix")"
          selected_rust_integration_json="$(parse_meta "selected_rust_integration_matrix")"
          selected_release_json="$(parse_meta "selected_release_matrix")"
          selected_rust_minimal_batch_json="$(parse_meta "selected_rust_minimal_batch_matrix")"
          selected_rust_integration_batch_json="$(parse_meta "selected_rust_integration_batch_matrix")"
          selected_lane_ids_json="$(parse_meta "selected_lane_ids")"
          smoke_workflow_lane_count="$(parse_meta "smoke_workflow_lane_count")"
          smoke_node_lane_count="$(parse_meta "smoke_node_lane_count")"
          smoke_rust_minimal_lane_count="$(parse_meta "smoke_rust_minimal_lane_count")"
          smoke_rust_integration_lane_count="$(parse_meta "smoke_rust_integration_lane_count")"
          smoke_release_lane_count="$(parse_meta "smoke_release_lane_count")"
          selected_workflow_lane_count="$(parse_meta "selected_workflow_lane_count")"
          selected_node_lane_count="$(parse_meta "selected_node_lane_count")"
          selected_rust_minimal_lane_count="$(parse_meta "selected_rust_minimal_lane_count")"
          selected_rust_integration_lane_count="$(parse_meta "selected_rust_integration_lane_count")"
          selected_release_lane_count="$(parse_meta "selected_release_lane_count")"
          selected_rust_minimal_batch_count="$(parse_meta "selected_rust_minimal_batch_count")"
          selected_rust_integration_batch_count="$(parse_meta "selected_rust_integration_batch_count")"
          rust_batching_mode="$(parse_meta "rust_batching_mode")"
          rust_batching_reason="$(parse_meta "rust_batching_reason")"
          eager_release_lanes="$(parse_meta "eager_release_lanes")"
          workflow_max_parallel="$(parse_meta "workflow_max_parallel")"
          node_max_parallel="$(parse_meta "node_max_parallel")"
          rust_minimal_max_parallel="$(parse_meta "rust_minimal_max_parallel")"
          rust_integration_max_parallel="$(parse_meta "rust_integration_max_parallel")"
          release_max_parallel="$(parse_meta "release_max_parallel")"
          matrix_fail_fast="$(parse_meta "matrix_fail_fast")"
          continue_after_smoke_failure="$(parse_meta "continue_after_smoke_failure")"
          planner_fingerprint="$(env -i PATH="${PATH}" REQUESTED_LANE="${REQUESTED_LANE}" SELECTION_META_PATH="${selection_meta_path}" python3 -c 'import hashlib, json, os; from pathlib import Path; payload = json.loads(Path(os.environ["SELECTION_META_PATH"]).read_text(encoding="utf-8")); source = json.dumps({"requested_lane": os.environ["REQUESTED_LANE"], "run_smoke_gate": payload["run_smoke_gate"], "selected_lane_ids": payload["selected_lane_ids"]}, sort_keys=True, separators=(",", ":")); print(hashlib.sha256(source.encode("utf-8")).hexdigest()[:16])')"
          dedupe_reason=""
          run_selected_lanes="true"

          if [[ '${{ github.event_name }}' == 'pull_request' && '${{ github.event.action }}' == 'ready_for_review' ]]; then
            mkdir -p "${RUNNER_TEMP}/ready-for-review-proof"
            duplicate_run_id="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/sedna-heavy-tests.yml/runs?event=pull_request&status=success&per_page=100" \
                --jq '
                  first(
                    .workflow_runs[]
                    | select(.id != ('"${GITHUB_RUN_ID}"' | tonumber))
                    | select(.head_sha == "'"${checkout_sha}"'")
                    | select(any(.pull_requests[]?; .number == ('"${{ github.event.pull_request.number }}"' | tonumber)))
                    | select(.status == "completed" and .conclusion == "success")
                    | .id
                  ) // ""
                ' 2>/dev/null || true
            )"
            duplicate_run=""
            if [[ -n "${duplicate_run_id}" ]] && gh run download "${duplicate_run_id}" \
                --repo "${GITHUB_REPOSITORY}" \
                --name validation-summary \
                --dir "${RUNNER_TEMP}/ready-for-review-proof" >/dev/null 2>&1; then
              duplicate_summary="$(
                find "${RUNNER_TEMP}/ready-for-review-proof" -type f -name '*.json' | sort | head -n 1
              )"
              if [[ -n "${duplicate_summary}" ]]; then
                duplicate_run="$(
                  jq -r \
                    --arg sha "${checkout_sha}" \
                    --arg lane "${{ inputs.lane || 'all' }}" \
                    --arg planner "${planner_fingerprint}" '
                    select(.ci_proof_v1.schema_version == "ci-proof-v1")
                    | select(.ci_proof_v1.head_sha == $sha)
                    | select(.ci_proof_v1.lane == $lane)
                    | select(.ci_proof_v1.planner_fingerprint == $planner)
                    | select(.ci_proof_v1.conclusion == "success")
                    | .ci_proof_v1.run_url // ""
                    ' "${duplicate_summary}" 2>/dev/null || true
                )"
              fi
            fi
            if [[ -n "${duplicate_run}" ]]; then
              dedupe_reason="ready_for_review duplicate skipped; equivalent heavy evidence already exists for ${checkout_sha} (${duplicate_run})"
              run_smoke_gate="false"
              run_selected_lanes="false"
              smoke_gate_kind=""
              smoke_json='{"include":[]}'
              smoke_workflow_json='{"include":[]}'
              smoke_node_json='{"include":[]}'
              smoke_rust_minimal_json='{"include":[]}'
              smoke_rust_integration_json='{"include":[]}'
              smoke_release_json='{"include":[]}'
              planned_json='{"include":[]}'
              selected_json='{"include":[]}'
              selected_workflow_json='{"include":[]}'
              selected_node_json='{"include":[]}'
              selected_rust_minimal_json='{"include":[]}'
              selected_rust_integration_json='{"include":[]}'
              selected_release_json='{"include":[]}'
              selected_rust_minimal_batch_json='{"include":[]}'
              selected_rust_integration_batch_json='{"include":[]}'
              selected_lane_ids_json='[]'
              smoke_workflow_lane_count='0'
              smoke_node_lane_count='0'
              smoke_rust_minimal_lane_count='0'
              smoke_rust_integration_lane_count='0'
              smoke_release_lane_count='0'
              selected_workflow_lane_count='0'
              selected_node_lane_count='0'
              selected_rust_minimal_lane_count='0'
              selected_rust_integration_lane_count='0'
              selected_release_lane_count='0'
              selected_rust_minimal_batch_count='0'
              selected_rust_integration_batch_count='0'
              eager_release_lanes='false'
            fi
          fi

          {
            echo "planner_fingerprint=${planner_fingerprint}"
            echo "dedupe_reason=${dedupe_reason}"
            echo "smoke_gate_kind=${smoke_gate_kind}"
            echo "smoke_matrix=${smoke_json}"
            echo "smoke_workflow_matrix=${smoke_workflow_json}"
            echo "smoke_node_matrix=${smoke_node_json}"
            echo "smoke_rust_minimal_matrix=${smoke_rust_minimal_json}"
            echo "smoke_rust_integration_matrix=${smoke_rust_integration_json}"
            echo "smoke_release_matrix=${smoke_release_json}"
            echo "smoke_workflow_lane_count=${smoke_workflow_lane_count}"
            echo "smoke_node_lane_count=${smoke_node_lane_count}"
            echo "smoke_rust_minimal_lane_count=${smoke_rust_minimal_lane_count}"
            echo "smoke_rust_integration_lane_count=${smoke_rust_integration_lane_count}"
            echo "smoke_release_lane_count=${smoke_release_lane_count}"
            echo "run_smoke_gate=${run_smoke_gate}"
            echo "matrix_fail_fast=${matrix_fail_fast}"
            echo "continue_after_smoke_failure=${continue_after_smoke_failure}"
