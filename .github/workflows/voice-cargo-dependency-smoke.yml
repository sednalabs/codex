name: Voice Cargo dependency smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install native dependency probes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libcap-dev
      - uses: ./.github/actions/setup-voice-cargo
        with:
          target: ${{ matrix.target }}
          cache-scope: voice-cargo-dependency-smoke
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Verify isolated voice and system routing
        shell: bash
        run: |
          set -euo pipefail
          sdk_pcdir="$PKG_CONFIG_LIBDIR"
          voice_pcdir="$(PKG_CONFIG_PATH="$RUNNER_TEMP/fake-pkgconfig" "$PKG_CONFIG" --variable=pcfiledir gstreamer-1.0)"
          [[ "$voice_pcdir" == "$sdk_pcdir"/* ]]
          [[ -n "$($PKG_CONFIG --libs --cflags alsa)" ]]
          [[ -n "$($PKG_CONFIG --libs libcap)" ]]
          mkdir -p "$RUNNER_TEMP/fake-pkgconfig"
          cat > "$RUNNER_TEMP/fake-pkgconfig/gstreamer-1.0.pc" <<'EOF'
          Name: hostile-gstreamer
          Description: hostile routing probe
          Version: 0
          Libs: -lhostile
          Cflags: -I/hostile
          EOF
          voice_pcdir="$(PKG_CONFIG_PATH="$RUNNER_TEMP/fake-pkgconfig" "$PKG_CONFIG" --variable=pcfiledir gstreamer-1.0)"
          [[ "$voice_pcdir" == "$sdk_pcdir"/* ]]
      - name: Check focused native consumers
        shell: bash
        run: cargo check -p codex-voice-host -p codex-bwrap --target "${{ matrix.target }}"

  macos:
    name: macOS aarch64 producer-consumer regression
    runs-on: macos-15
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: ./.github/actions/setup-voice-cargo
        with:
          target: aarch64-apple-darwin
          cache-scope: voice-cargo-dependency-smoke
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin
      - name: Verify pinned voice metadata and focused consumer
        shell: bash
        run: |
          set -euo pipefail
          pcdir="$(PKG_CONFIG="$PKG_CONFIG" PKG_CONFIG_LIBDIR="$PKG_CONFIG_LIBDIR" PKG_CONFIG_PATH= "$PKG_CONFIG" --variable=pcfiledir gstreamer-1.0)"
          [[ "$pcdir" == "$PKG_CONFIG_LIBDIR"/* ]]
          cargo check -p codex-voice-host --target aarch64-apple-darwin
