name: Sedna Linux Release

on:
  workflow_dispatch:
    inputs:
      package-version:
        description: Exact Cargo workspace version to publish.
        required: true
        type: string
      channel:
        description: Sedna release channel.
        required: true
        type: choice
        options:
          - stable
          - prerelease

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release identity
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
        run: |
          set -euo pipefail
          cargo_version="$(sed -n -E 's/^version = "([^"]+)"$/\1/p' codex-rs/Cargo.toml | head -n 1)"
          [[ "$PACKAGE_VERSION" == "$cargo_version" ]]
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
      - name: Build and smoke-test canonical package
        uses: ./.github/actions/build-codex-packages
        with:
          target: ${{ matrix.target }}
          package-version: ${{ inputs.package-version }}
          build-mode: release
          build-system: cargo
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-${{ matrix.target }}
          path: dist/${{ matrix.target }}/codex-package-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sedna-*
          path: dist
          merge-multiple: true
      - name: Create release metadata and checksums
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          source_tree="$(git rev-parse HEAD^{tree})"
          mkdir -p release-assets
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            archive="dist/codex-package-${target}.tar.gz"
            [[ -f "$archive" ]]
            archive_sha="$(sha256sum "$archive" | awk '{print $1}')"
            TARGET="$target" ARCHIVE_SHA="$archive_sha" SOURCE_TREE="$source_tree" python3 - <<'PY'
          import json, os
          from pathlib import Path
          target = os.environ["TARGET"]
          version = os.environ["PACKAGE_VERSION"]
          metadata = {
              "schemaVersion": 1,
              "repository": "sednalabs/codex",
              "releaseTag": f"rust-v{version}",
              "packageVersion": version,
              "nativeVersion": version,
              "channel": os.environ["CHANNEL"],
              "target": target,
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "sourceTree": os.environ["SOURCE_TREE"],
              "workflowHostCommit": os.environ["SOURCE_COMMIT"],
              "workflowHostTree": os.environ["SOURCE_TREE"],
              "workflowRunId": os.environ["WORKFLOW_RUN_ID"],
              "archive": {
                  "name": f"codex-package-{target}.tar.gz",
                  "sha256": os.environ["ARCHIVE_SHA"],
              },
          }
          Path(f"release-assets/RELEASE-METADATA-{target}.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          PY
            cp "$archive" release-assets/
          done
          (cd release-assets && sha256sum codex-package-*.tar.gz > codex-package_SHA256SUMS)
      - name: Publish Sedna release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.package-version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          tag="rust-v${PACKAGE_VERSION}"
          prerelease_args=()
          if [[ "$CHANNEL" == prerelease ]]; then prerelease_args+=(--prerelease); fi
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Codex ${PACKAGE_VERSION} (Sedna ${CHANNEL})" \
            --notes "Sedna ${CHANNEL} Linux packages for ${PACKAGE_VERSION}." \
            "${prerelease_args[@]}"
