name: sedna-release
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && 'manual release request' ||
    github.ref_type == 'tag' && format('tag release {0}', github.ref_name) ||
    'main release gate'
  }}

on:
  push:
    branches:
      - main
    tags:
      - "v*-sedna.*"
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit to release. Defaults to the selected ref.
        required: false
        type: string
      channel:
        description: Release channel for resolver validation.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - stable
          - prerelease
      release_tag:
        description: Optional expected Sedna release tag. The resolver must compute the same tag.
        required: false
        type: string
      draft:
        description: Create the GitHub release as a draft. Manual/debug use only.
        required: false
        default: false
        type: boolean
      macos_release_mode:
        description: "Intel macOS assets: omit, publish an ad-hoc signed preview, or require Developer ID notarization."
        required: true
        default: off
        type: choice
        options:
          - off
          - preview
          - notarized

permissions: {}

jobs:
  route:
    name: Release request gate
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    outputs:
      release_requested: ${{ steps.route.outputs.release_requested }}
      reason: ${{ steps.route.outputs.reason }}
      channel: ${{ steps.route.outputs.channel }}
      target_sha: ${{ steps.route.outputs.target_sha }}
    steps:
      - name: Resolve release request
        id: route
        shell: bash
        env:
          EVENT_AFTER: ${{ github.event.after || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail

          emit() {
            {
              echo "release_requested=$1"
              echo "reason=$2"
              echo "target_sha=$3"
              echo "channel=$4"
            } >> "$GITHUB_OUTPUT"

            echo "release_requested=$1"
            echo "reason=$2"
            echo "target_sha=$3"
            echo "channel=$4"
          }

          if [[ "${EVENT_NAME}" != "push" ]]; then
            if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${EVENT_REF}" != "refs/heads/main" ]]; then
              echo "Manual releases must be dispatched from the protected main branch; got ${EVENT_REF}." >&2
              exit 1
            fi
            emit true "${EVENT_NAME}" "${EVENT_SHA}" ""
            exit 0
          fi

          if [[ "${EVENT_REF}" == refs/tags/* ]]; then
            emit true tag "${EVENT_SHA}" ""
            exit 0
          fi
          if [[ "${EVENT_REF}" != "refs/heads/main" ]]; then
            emit false unsupported_ref "" ""
            exit 0
          fi
          if [[ -z "${EVENT_AFTER}" || "${EVENT_AFTER}" =~ ^0+$ ]]; then
            emit false deleted_ref "" ""
            exit 0
          fi

          markers=()
          while IFS= read -r line || [[ -n "${line}" ]]; do
            if [[ "${line}" =~ ^Sedna-Release:[[:space:]]*([A-Za-z0-9_.-]+)[[:space:]]*$ ]]; then
              markers+=("${BASH_REMATCH[1],,}")
            fi
          done <<< "${HEAD_MESSAGE}"

          if [[ "${#markers[@]}" -eq 0 ]]; then
            emit false missing_sedna_release_marker "${EVENT_AFTER}" ""
            exit 0
          fi
          if [[ "${#markers[@]}" -gt 1 ]]; then
            echo "commit has more than one Sedna-Release marker" >&2
            exit 1
          fi

          channel="${markers[0]}"
          if [[ "${channel}" != "stable" && "${channel}" != "prerelease" ]]; then
            echo "Sedna-Release marker must be either 'stable' or 'prerelease'" >&2
            exit 1
          fi

          emit true release_marker "${EVENT_AFTER}" "${channel}"

      - name: Summarize release gate
        if: ${{ always() }}
        shell: bash
        env:
          RELEASE_REQUESTED: ${{ steps.route.outputs.release_requested }}
          RELEASE_CHANNEL: ${{ steps.route.outputs.channel }}
          ROUTE_REASON: ${{ steps.route.outputs.reason }}
          TARGET_SHA: ${{ steps.route.outputs.target_sha }}
        run: |
          if [[ "${RELEASE_REQUESTED:-false}" == "true" ]]; then
            decision="publish"
            publisher_job="will run"
          else
            decision="skip"
            publisher_job="skipped"
          fi

          case "${ROUTE_REASON:-unknown}" in
            release_marker)
              reason_label="release marker"
              ;;
            missing_sedna_release_marker)
              reason_label="no release marker"
              ;;
            workflow_dispatch)
              reason_label="manual dispatch"
              ;;
            tag)
              reason_label="release tag"
              ;;
            *)
              reason_label="${ROUTE_REASON:-unknown}"
              ;;
          esac

          {
            echo "## Sedna release gate"
            echo
            echo "- Decision: ${decision}"
            echo "- Reason: ${reason_label}"
            echo "- Publisher job: ${publisher_job}"
            if [[ "${RELEASE_REQUESTED:-false}" == "true" ]]; then
              echo "- Release channel: ${RELEASE_CHANNEL:-auto}"
              echo "- Target commit: ${TARGET_SHA}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  resolve:
    name: Resolve release metadata
    needs: route
    if: ${{ needs.route.outputs.release_requested == 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build_provenance: ${{ steps.meta.outputs.build_provenance }}
      downstream_commit: ${{ steps.meta.outputs.downstream_commit }}
      downstream_commit_short: ${{ steps.meta.outputs.downstream_commit_short }}
      draft: ${{ steps.meta.outputs.draft }}
      github_prerelease: ${{ steps.meta.outputs.github_prerelease }}
      release_channel: ${{ steps.meta.outputs.release_channel }}
      release_build_required: ${{ steps.meta.outputs.release_build_required }}
      release_marker: ${{ steps.meta.outputs.release_marker }}
      macos_release_mode: ${{ steps.meta.outputs.macos_release_mode }}
      release_requested: ${{ steps.meta.outputs.release_requested }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      release_work_skip_reason: ${{ steps.meta.outputs.release_work_skip_reason }}
      skip_reason: ${{ steps.meta.outputs.skip_reason }}
      target_commit: ${{ steps.meta.outputs.target_commit }}
      upstream_base_commit: ${{ steps.meta.outputs.upstream_base_commit }}
      upstream_base_commit_short: ${{ steps.meta.outputs.upstream_base_commit_short }}
      upstream_base_tag: ${{ steps.meta.outputs.upstream_base_tag }}
      upstream_base_tag_exact: ${{ steps.meta.outputs.upstream_base_tag_exact }}
      upstream_distance_from_tag: ${{ steps.meta.outputs.upstream_distance_from_tag }}
      upstream_position: ${{ steps.meta.outputs.upstream_position }}
      upstream_track: ${{ steps.meta.outputs.upstream_track }}
      version_display: ${{ steps.meta.outputs.version_display }}
      version_policy: ${{ steps.meta.outputs.version_policy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch release refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/upstream-main:refs/remotes/origin/upstream-main
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/openai/codex.git
          fi
          git fetch origin --tags
          git fetch upstream --tags

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_MACOS_RELEASE_MODE: ${{ inputs.macos_release_mode }}
          HOST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          args=(
            --repo "${GITHUB_WORKSPACE}"
            --repository "${GITHUB_REPOSITORY}"
            --main-ref refs/remotes/origin/main
            --upstream-ref refs/remotes/origin/upstream-main
            --github-releases required
            --format json
          )

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            target_sha="${INPUT_TARGET_SHA:-${HOST_SHA}}"
            if [[ "${target_sha}" != "${HOST_SHA}" ]]; then
              echo "Manual release target_sha must equal the exact workflow host SHA ${HOST_SHA}; got ${target_sha}." >&2
              exit 1
            fi
            args+=(--target-sha "${target_sha}" --channel "${INPUT_CHANNEL}")
            if [[ -n "${INPUT_RELEASE_TAG}" ]]; then
              args+=(--release-tag "${INPUT_RELEASE_TAG}")
            else
              args+=(--require-marker --missing-marker error)
            fi
            {
              echo "draft=${INPUT_DRAFT}"
              echo "macos_release_mode=${INPUT_MACOS_RELEASE_MODE:-off}"
            } >> "${GITHUB_OUTPUT}"
          elif [[ "${REF_TYPE}" == "tag" ]]; then
            args+=(
              --target-sha "${GITHUB_SHA}"
              --channel auto
              --release-tag "${REF_NAME}"
              --current-release-tag "${REF_NAME}"
            )
            {
              echo "draft=false"
              echo "macos_release_mode=off"
            } >> "${GITHUB_OUTPUT}"
          else
            args+=(--target-sha "${GITHUB_SHA}" --channel auto --require-marker)
            {
              echo "draft=false"
              echo "macos_release_mode=off"
            } >> "${GITHUB_OUTPUT}"
          fi

          meta_json="${RUNNER_TEMP}/sedna-release-metadata.json"
          python3 .github/scripts/resolve_sedna_release_version.py "${args[@]}" | tee "${meta_json}"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' "${meta_json}" >> "${GITHUB_OUTPUT}"

          macos_release_mode="${INPUT_MACOS_RELEASE_MODE:-off}"
          if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            macos_release_mode="off"
          fi
          if [[ "${macos_release_mode}" == "preview" ]] && [[ "$(jq -r '.github_prerelease' "${meta_json}")" != "true" ]]; then
            echo "Ad-hoc signed Intel macOS assets may only be attached to prereleases." >&2
            exit 1
          fi

          release_build_required="true"
          release_work_skip_reason=""
          release_tag="$(jq -r '.release_tag // empty' "${meta_json}")"
          target_commit="$(jq -r '.target_commit // empty' "${meta_json}")"

          normalize_commit() {
            git rev-parse --verify "$1^{commit}" 2>/dev/null || printf '%s\n' "$1"
          }

          if [[ "${REF_TYPE}" == "tag" && -n "${release_tag}" ]]; then
            existing_target="$(
              gh release view "${release_tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json targetCommitish \
                --jq '.targetCommitish' 2>/dev/null || true
            )"
            if [[ -n "${existing_target}" ]]; then
              existing_target_commit="$(normalize_commit "${existing_target}")"
              target_commit_normalized="$(normalize_commit "${target_commit}")"
              if [[ "${existing_target_commit}" != "${target_commit_normalized}" ]]; then
                echo "Release ${release_tag} already exists for ${existing_target_commit}, not ${target_commit_normalized}." >&2
                exit 1
              fi

              release_build_required="false"
              release_work_skip_reason="existing_release_same_target"
              {
                echo "### Sedna release duplicate tag"
                echo
                echo "- Release: \`${release_tag}\`"
                echo "- Existing target: \`${existing_target_commit}\`"
                echo "- Decision: skip duplicate tag-triggered build/publish"
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
          fi

          {
            echo "release_build_required=${release_build_required}"
            echo "release_work_skip_reason=${release_work_skip_reason}"
          } >> "${GITHUB_OUTPUT}"

  release-linux:
    name: Build Linux release artifacts (${{ matrix.target }})
    needs: resolve
    if: ${{ needs.resolve.outputs.release_requested == 'true' && needs.resolve.outputs.release_build_required == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: sedna-release-linux-x86_64-unknown-linux-gnu
            checksum_name: SHA256SUMS.txt
            metadata_json_name: RELEASE-METADATA.json
            metadata_text_name: RELEASE-METADATA.txt
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: sedna-release-linux-aarch64-unknown-linux-gnu
            checksum_name: SHA256SUMS-aarch64-unknown-linux-gnu.txt
            metadata_json_name: RELEASE-METADATA-aarch64-unknown-linux-gnu.json
            metadata_text_name: RELEASE-METADATA-aarch64-unknown-linux-gnu.txt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-${{ needs.resolve.outputs.release_tag }}-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_IDLE_TIMEOUT: "0"
      TARGET: ${{ matrix.target }}

    steps:
      - name: Check for existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to rebuild or clobber official assets."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out release target
        shell: bash
        env:
          TARGET_COMMIT: ${{ needs.resolve.outputs.target_commit }}
        run: |
          set -euo pipefail
          git checkout --detach "${TARGET_COMMIT}"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ env.TARGET }}

      - name: Compute lockfile hash
        id: lockhash
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum codex-rs/Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum codex-rs/rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.rusty_v8/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-linux-rust-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Install sccache
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: sccache

      - name: Configure sccache backend
        id: sccache_backend
        shell: bash
        run: bash .github/scripts/configure_sccache_backend.sh write-fallback

      - name: Enable sccache wrapper and reset stats
        if: ${{ steps.sccache_backend.outputs.backend != 'off' }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(command -v sccache)"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Restore sccache cache (fallback)
        if: ${{ steps.sccache_backend.outputs.backend == 'fallback' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-linux-rust-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}
          restore-keys: |
            sccache-linux-rust-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-
            sccache-linux-rust-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-

      - name: Build release binaries
        id: build_release
        shell: bash
        working-directory: codex-rs
        env:
          CODEX_RELEASE_REPOSITORY: ${{ github.repository }}
          CODEX_RELEASE_TAG_PREFIX: v
          CODEX_RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          CODEX_UPSTREAM_TRACK: ${{ needs.resolve.outputs.upstream_track }}
          CODEX_UPSTREAM_BASE_COMMIT: ${{ needs.resolve.outputs.upstream_base_commit_short }}
          CODEX_UPSTREAM_BASE_TAG: ${{ needs.resolve.outputs.upstream_base_tag }}
          CODEX_UPSTREAM_DISTANCE_FROM_TAG: ${{ needs.resolve.outputs.upstream_distance_from_tag }}
          CODEX_DOWNSTREAM_COMMIT: ${{ needs.resolve.outputs.downstream_commit_short }}
        run: |
          set -euo pipefail
          cargo build --locked --target "${TARGET}" --release --bin codex --bin codex-responses-api-proxy

      - name: Check post-build disk headroom
        if: ${{ always() && !cancelled() }}
        id: disk_guard
        shell: bash
        run: |
          set -euo pipefail
          save_floor_bytes=$((8 * 1024 * 1024 * 1024))
          available_bytes="$(df --block-size=1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d '[:space:]')"
          {
            echo "available_bytes=${available_bytes}"
            if [[ "${available_bytes}" -lt "${save_floor_bytes}" ]]; then
              echo "skip_cache_save=true"
            else
              echo "skip_cache_save=false"
            fi
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release build cache save"
            echo
            echo "- Available disk: $(numfmt --to=iec "${available_bytes}")"
            if [[ "${available_bytes}" -lt "${save_floor_bytes}" ]]; then
              echo "- Cache save decision: \`skip\`"
            else
              echo "- Cache save decision: \`allow\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${available_bytes}" -lt "${save_floor_bytes}" ]]; then
            echo "::warning title=Skipping cache save on low disk::Available disk is $(numfmt --to=iec "${available_bytes}") before cache archival; skipping cache save steps to avoid runner exhaustion."
          fi

      - name: Save cargo home cache
        if: ${{ always() && !cancelled() && steps.build_release.outcome == 'success' && steps.cache_cargo_home_restore.outputs.cache-hit != 'true' && steps.disk_guard.outputs.skip_cache_save != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.rusty_v8/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-linux-rust-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache (fallback)
        if: ${{ always() && !cancelled() && steps.build_release.outcome == 'success' && steps.sccache_backend.outputs.backend == 'fallback' && steps.sccache_backend.outputs.policy == 'write-fallback' && steps.disk_guard.outputs.skip_cache_save != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-linux-rust-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}

      - name: sccache stats
        if: ${{ always() && steps.sccache_backend.outputs.backend != 'off' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          stats_file="${RUNNER_TEMP}/sccache-stats.txt"
          : > "${stats_file}"
          sccache --show-stats | tee "${stats_file}" || true
          {
            echo "### sccache stats"
            echo
            echo '```text'
            cat "${stats_file}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign Linux binaries
        uses: ./.github/actions/linux-code-sign
        with:
          target: ${{ env.TARGET }}
          artifacts-dir: ${{ github.workspace }}/codex-rs/target/${{ env.TARGET }}/release

      - name: Stage release assets
        shell: bash
        working-directory: codex-rs
        env:
          BUILD_PROVENANCE: ${{ needs.resolve.outputs.build_provenance }}
          DOWNSTREAM_COMMIT_FULL: ${{ needs.resolve.outputs.downstream_commit }}
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.release_channel }}
          RELEASE_MARKER: ${{ needs.resolve.outputs.release_marker }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          REPOSITORY: ${{ github.repository }}
          TARGET_COMMIT: ${{ needs.resolve.outputs.target_commit }}
          UPSTREAM_BASE_COMMIT_FULL: ${{ needs.resolve.outputs.upstream_base_commit }}
          UPSTREAM_BASE_TAG: ${{ needs.resolve.outputs.upstream_base_tag }}
          UPSTREAM_BASE_TAG_EXACT: ${{ needs.resolve.outputs.upstream_base_tag_exact }}
          UPSTREAM_DISTANCE_FROM_TAG: ${{ needs.resolve.outputs.upstream_distance_from_tag }}
          UPSTREAM_POSITION: ${{ needs.resolve.outputs.upstream_position }}
          UPSTREAM_TRACK: ${{ needs.resolve.outputs.upstream_track }}
          VERSION_DISPLAY: ${{ needs.resolve.outputs.version_display }}
          VERSION_POLICY: ${{ needs.resolve.outputs.version_policy }}
          CHECKSUM_NAME: ${{ matrix.checksum_name }}
          METADATA_JSON_NAME: ${{ matrix.metadata_json_name }}
          METADATA_TEXT_NAME: ${{ matrix.metadata_text_name }}
        run: |
          set -euo pipefail

          dist_dir="${GITHUB_WORKSPACE}/dist"
          stage_dir="${GITHUB_WORKSPACE}/codex-rs/stage/${TARGET}"
          archive_base="codex-sedna-${RELEASE_VERSION}-${TARGET}"

          rm -rf "${stage_dir}"
          mkdir -p "${dist_dir}" "${stage_dir}"

          install -Dm 0755 "target/${TARGET}/release/codex" "${stage_dir}/codex"
          install -Dm 0755 "target/${TARGET}/release/codex-responses-api-proxy" "${stage_dir}/codex-responses-api-proxy"

          cp "target/${TARGET}/release/codex.sigstore" "${dist_dir}/${archive_base}-codex.sigstore"
          cp "target/${TARGET}/release/codex-responses-api-proxy.sigstore" "${dist_dir}/${archive_base}-codex-responses-api-proxy.sigstore"

          tar -C "${stage_dir}" -czf "${dist_dir}/${archive_base}.tar.gz" .
          install -m 0644 Cargo.toml Cargo.lock "${stage_dir}/"

          cat > "${dist_dir}/${METADATA_TEXT_NAME}" <<EOF
          release_tag=${RELEASE_TAG}
          release_version=${RELEASE_VERSION}
          version_policy=${VERSION_POLICY}
          version_display=${VERSION_DISPLAY}
          build_provenance=${BUILD_PROVENANCE}
          release_channel=${RELEASE_CHANNEL}
          release_marker=${RELEASE_MARKER}
          upstream_track=${UPSTREAM_TRACK}
          upstream_base_commit=${UPSTREAM_BASE_COMMIT_FULL}
          upstream_base_tag=${UPSTREAM_BASE_TAG}
          upstream_base_tag_exact=${UPSTREAM_BASE_TAG_EXACT}
          upstream_distance_from_tag=${UPSTREAM_DISTANCE_FROM_TAG}
          upstream_position=${UPSTREAM_POSITION}
          downstream_commit=${DOWNSTREAM_COMMIT_FULL}
          target_commit=${TARGET_COMMIT}
          repository=${REPOSITORY}
          target=${TARGET}
          git_describe=$(git describe --tags --always)
          EOF

          python3 - <<'PY' > "${dist_dir}/${METADATA_JSON_NAME}"
          import json
          import os

          json.dump(
              {
                  "release_tag": os.environ["RELEASE_TAG"],
                  "release_version": os.environ["RELEASE_VERSION"],
                  "version_policy": os.environ["VERSION_POLICY"],
                  "version_display": os.environ["VERSION_DISPLAY"],
                  "build_provenance": os.environ["BUILD_PROVENANCE"],
                  "release_channel": os.environ["RELEASE_CHANNEL"],
                  "release_marker": os.environ["RELEASE_MARKER"] or None,
                  "upstream_track": os.environ["UPSTREAM_TRACK"],
                  "upstream_base_commit": os.environ["UPSTREAM_BASE_COMMIT_FULL"],
                  "upstream_base_tag": os.environ["UPSTREAM_BASE_TAG"] or None,
                  "upstream_base_tag_exact": os.environ["UPSTREAM_BASE_TAG_EXACT"] == "true",
                  "upstream_distance_from_tag": int(os.environ["UPSTREAM_DISTANCE_FROM_TAG"]),
                  "upstream_position": os.environ["UPSTREAM_POSITION"],
                  "downstream_commit": os.environ["DOWNSTREAM_COMMIT_FULL"],
                  "target_commit": os.environ["TARGET_COMMIT"],
                  "repository": os.environ["REPOSITORY"],
                  "target": os.environ["TARGET"],
              },
              fp=os.sys.stdout,
              indent=2,
              sort_keys=True,
          )
          os.sys.stdout.write("\n")
          PY

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: codex-rs/stage/${{ matrix.target }}
          format: spdx-json
          output-file: ${{ github.workspace }}/dist/codex-sedna-${{ needs.resolve.outputs.release_version }}-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Attest Linux archive and SBOM provenance
        id: attest_linux
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ github.workspace }}/dist/codex-sedna-${{ needs.resolve.outputs.release_version }}-${{ matrix.target }}.tar.gz
            ${{ github.workspace }}/dist/codex-sedna-${{ needs.resolve.outputs.release_version }}-${{ matrix.target }}.spdx.json
            ${{ github.workspace }}/dist/${{ matrix.metadata_json_name }}
            ${{ github.workspace }}/dist/${{ matrix.metadata_text_name }}

      - name: Stage provenance bundle and checksums
        shell: bash
        env:
          ARCHIVE_BASE: codex-sedna-${{ needs.resolve.outputs.release_version }}-${{ matrix.target }}
          ATTESTATION_BUNDLE: ${{ steps.attest_linux.outputs.bundle-path }}
          CHECKSUM_NAME: ${{ matrix.checksum_name }}
          DIST_DIR: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          cp "${ATTESTATION_BUNDLE}" "${DIST_DIR}/${ARCHIVE_BASE}.intoto.jsonl"
          (
            cd "${DIST_DIR}"
            find . -maxdepth 1 -type f ! -name "${CHECKSUM_NAME}" -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > "${CHECKSUM_NAME}"
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ github.workspace }}/dist/*
          retention-days: 3

  release-macos-signing-preflight:
    name: Check Intel macOS release signing configuration
    needs: resolve
    if: >-
      ${{
        needs.resolve.outputs.release_requested == 'true' &&
        needs.resolve.outputs.release_build_required == 'true' &&
        needs.resolve.outputs.macos_release_mode == 'notarized'
      }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment:
      name: codesigning
      deployment: false
    permissions: {}
    steps:
      - name: Check Intel macOS signing configuration
        shell: bash
        env:
          AKV_CODESIGN_RCODESIGN_BLOB_URI: ${{ secrets.AKV_CODESIGN_RCODESIGN_BLOB_URI }}
          AKV_CODESIGN_RCODESIGN_SHA256: ${{ secrets.AKV_CODESIGN_RCODESIGN_SHA256 }}
          AKV_CODESIGN_PKCS11_LIBRARY_BLOB_URI: ${{ secrets.AKV_CODESIGN_PKCS11_LIBRARY_BLOB_URI }}
          AKV_CODESIGN_PKCS11_LIBRARY_SHA256: ${{ secrets.AKV_CODESIGN_PKCS11_LIBRARY_SHA256 }}
          AKV_CODESIGN_AZURE_CLIENT_ID: ${{ secrets.AKV_CODESIGN_AZURE_CLIENT_ID }}
          AKV_CODESIGN_TENANT: ${{ secrets.AKV_CODESIGN_TENANT }}
          AKV_CODESIGN_SUBSCRIPTION: ${{ secrets.AKV_CODESIGN_SUBSCRIPTION }}
          AKV_CODESIGN_KEY_VAULT_NAME: ${{ secrets.AKV_CODESIGN_KEY_VAULT_NAME }}
          AKV_CODESIGN_KEY_NAME: ${{ secrets.AKV_CODESIGN_KEY_NAME }}
          APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for variable_name in \
            AKV_CODESIGN_RCODESIGN_BLOB_URI \
            AKV_CODESIGN_RCODESIGN_SHA256 \
            AKV_CODESIGN_PKCS11_LIBRARY_BLOB_URI \
            AKV_CODESIGN_PKCS11_LIBRARY_SHA256 \
            AKV_CODESIGN_AZURE_CLIENT_ID \
            AKV_CODESIGN_TENANT \
            AKV_CODESIGN_SUBSCRIPTION \
            AKV_CODESIGN_KEY_VAULT_NAME \
            AKV_CODESIGN_KEY_NAME \
            APPLE_NOTARIZATION_KEY_P8 \
            APPLE_NOTARIZATION_KEY_ID \
            APPLE_NOTARIZATION_ISSUER_ID
          do
            if [[ -z "${!variable_name:-}" ]]; then
              missing+=("${variable_name}")
            fi
          done
          if ((${#missing[@]} > 0)); then
            printf 'Missing Intel macOS release signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

  release-macos-build:
    name: Build Intel macOS release binaries
    needs:
      - resolve
      - release-macos-signing-preflight
    if: >-
      ${{
        always() &&
        needs.resolve.result == 'success' &&
        needs.resolve.outputs.release_requested == 'true' &&
        needs.resolve.outputs.release_build_required == 'true' &&
        needs.resolve.outputs.macos_release_mode != 'off' &&
        (
          needs.resolve.outputs.macos_release_mode == 'preview' ||
          needs.release-macos-signing-preflight.result == 'success'
        )
      }}
    runs-on: macos-15-intel
    timeout-minutes: 210
    concurrency:
      group: ${{ github.workflow }}-${{ needs.resolve.outputs.release_tag }}-macos-build
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
      SCCACHE_CACHE_SIZE: 2G
      TARGET: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out release target
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          TARGET_COMMIT: ${{ needs.resolve.outputs.target_commit }}
        run: |
          set -euo pipefail
          git checkout --detach "${TARGET_COMMIT}"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-apple-darwin

      - name: Compute Rust cache keys
        id: lockhash
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(shasum -a 256 Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(shasum -a 256 rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.rusty_v8/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-macos-15-intel-x86_64-apple-darwin-release-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-macos-15-intel-x86_64-apple-darwin-release-

      - name: Install sccache
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: sccache

      - name: Configure sccache backend
        id: sccache_backend
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/configure_sccache_backend.sh write-fallback

      - name: Enable sccache wrapper and reset stats
        if: ${{ steps.sccache_backend.outputs.backend != 'off' }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(command -v sccache)"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Restore sccache cache
        if: ${{ steps.sccache_backend.outputs.backend == 'fallback' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-macos-15-intel-x86_64-apple-darwin-release-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}
          restore-keys: |
            sccache-macos-15-intel-x86_64-apple-darwin-release-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-
            sccache-macos-15-intel-x86_64-apple-darwin-release-${{ steps.lockhash.outputs.hash }}-
            sccache-macos-15-intel-x86_64-apple-darwin-release-

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-apple-darwin

      - name: Build Intel macOS release binaries
        id: build_macos_release
        shell: bash
        env:
          CODEX_RELEASE_REPOSITORY: ${{ github.repository }}
          CODEX_RELEASE_TAG_PREFIX: v
          CODEX_RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --target "${TARGET}" \
            --release \
            --bin codex \
            --bin codex-code-mode-host \
            --bin codex-responses-api-proxy

      - name: Stage unsigned Intel macOS binaries
        shell: bash
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE}/unsigned-macos"
          mkdir -p "${dest}"
          for binary in codex codex-code-mode-host codex-responses-api-proxy; do
            source_path="target/${TARGET}/release/${binary}"
            test -x "${source_path}"
            zstd -T0 -19 --stdout "${source_path}" > "${dest}/${binary}-${TARGET}-unsigned.zst"
          done

      - name: Upload unsigned Intel macOS binaries
        uses: actions/upload-artifact@v7
        with:
          name: sedna-release-macos-x64-unsigned
          path: unsigned-macos/*
          if-no-files-found: error
          retention-days: 3

      - name: Report sccache statistics
        if: ${{ always() && steps.sccache_backend.outputs.backend != 'off' }}
        continue-on-error: true
        shell: bash
        run: sccache --show-stats || true

      - name: Save Cargo home cache
        if: ${{ always() && !cancelled() && steps.build_macos_release.outcome == 'success' && steps.cache_cargo_home_restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.rusty_v8/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-macos-15-intel-x86_64-apple-darwin-release-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache
        if: ${{ always() && !cancelled() && steps.build_macos_release.outcome == 'success' && steps.sccache_backend.outputs.backend == 'fallback' && steps.sccache_backend.outputs.policy == 'write-fallback' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-macos-15-intel-x86_64-apple-darwin-release-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}

  release-macos-preview-package:
    name: Package Intel macOS prerelease preview
    needs:
      - resolve
      - release-macos-build
    if: ${{ needs.resolve.outputs.macos_release_mode == 'preview' }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download unsigned Intel macOS binaries
        uses: actions/download-artifact@v8
        with:
          name: sedna-release-macos-x64-unsigned
          path: ${{ runner.temp }}/unsigned-macos

      - name: Ad-hoc sign and package Intel macOS preview
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          REPOSITORY: ${{ github.repository }}
          TARGET_COMMIT: ${{ needs.resolve.outputs.target_commit }}
        run: |
          set -euo pipefail
          input_dir="${RUNNER_TEMP}/unsigned-macos"
          stage_dir="${RUNNER_TEMP}/sedna-release-preview/${TARGET}"
          dist_dir="${GITHUB_WORKSPACE}/dist-macos-preview"
          archive_name="codex-sedna-${RELEASE_VERSION}-${TARGET}-UNNOTARIZED-PREVIEW.tar.gz"
          metadata_name="RELEASE-METADATA-${TARGET}-UNNOTARIZED-PREVIEW.json"
          checksum_name="SHA256SUMS-${TARGET}-UNNOTARIZED-PREVIEW.txt"
          rm -rf "${stage_dir}" "${dist_dir}"
          mkdir -p "${stage_dir}" "${dist_dir}"

          for binary in codex codex-code-mode-host codex-responses-api-proxy; do
            staged_path="${stage_dir}/${binary}"
            zstd -d --stdout "${input_dir}/${binary}-${TARGET}-unsigned.zst" > "${staged_path}"
            chmod 0755 "${staged_path}"
            entitlements="${GITHUB_WORKSPACE}/.github/scripts/macos-signing/${binary}.entitlements.plist"
            .github/scripts/macos-signing/sign_macos_code.sh \
              --target "${staged_path}" \
              --identity - \
              --deep false \
              --identifier "${binary}" \
              --options runtime \
              --timestamp none \
              --entitlements "${entitlements}"
            lipo "${staged_path}" -verify_arch x86_64
            codesign --verify --strict --verbose=2 "${staged_path}"
            codesign -dvvv "${staged_path}" 2>&1 | grep -F "Signature=adhoc"
          done
          "${stage_dir}/codex" --version | grep -F "${RELEASE_VERSION}"

          tar -C "${stage_dir}" -czf "${dist_dir}/${archive_name}" \
            codex codex-responses-api-proxy

          python3 - <<'PY' > "${dist_dir}/${metadata_name}"
          import json
          import os
          import sys

          json.dump(
              {
                  "release_tag": os.environ["RELEASE_TAG"],
                  "release_version": os.environ["RELEASE_VERSION"],
                  "repository": os.environ["REPOSITORY"],
                  "target_commit": os.environ["TARGET_COMMIT"],
                  "target": os.environ["TARGET"],
                  "distribution": "preview",
                  "signing": "ad-hoc",
                  "notarized": False,
                  "gatekeeper_ready": False,
              },
              sys.stdout,
              indent=2,
              sort_keys=True,
          )
          sys.stdout.write("\n")
          PY

          (
            cd "${dist_dir}"
            shasum -a 256 "${archive_name}" "${metadata_name}" > "${checksum_name}"
          )

      - name: Upload Intel macOS preview assets
        uses: actions/upload-artifact@v7
        with:
          name: sedna-release-macos-x64-preview
          path: dist-macos-preview/*
          if-no-files-found: error
          retention-days: 3

  release-macos-sign:
    name: Sign and notarize Intel macOS binaries
    needs:
      - resolve
      - release-macos-build
    if: ${{ needs.resolve.outputs.macos_release_mode == 'notarized' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: codesigning
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download unsigned Intel macOS binaries
        uses: actions/download-artifact@v8
        with:
          name: sedna-release-macos-x64-unsigned
          path: ${{ runner.temp }}/unsigned-macos

      - name: Set up AKV PKCS11 macOS signing
        uses: ./.github/actions/setup-akv-pkcs11-codesigning
        with:
          rcodesign-blob-uri: ${{ secrets.AKV_CODESIGN_RCODESIGN_BLOB_URI }}
          rcodesign-sha256: ${{ secrets.AKV_CODESIGN_RCODESIGN_SHA256 }}
          akv-pkcs11-library-blob-uri: ${{ secrets.AKV_CODESIGN_PKCS11_LIBRARY_BLOB_URI }}
          akv-pkcs11-library-sha256: ${{ secrets.AKV_CODESIGN_PKCS11_LIBRARY_SHA256 }}
          azure-client-id: ${{ secrets.AKV_CODESIGN_AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AKV_CODESIGN_TENANT }}
          azure-subscription-id: ${{ secrets.AKV_CODESIGN_SUBSCRIPTION }}
          key-vault-name: ${{ secrets.AKV_CODESIGN_KEY_VAULT_NAME }}
          key-name: ${{ secrets.AKV_CODESIGN_KEY_NAME }}
          key-version: ${{ secrets.AKV_CODESIGN_KEY_VERSION || '' }}
          certificate-sha256: ${{ secrets.AKV_CODESIGN_CERTIFICATE_SHA256 || '' }}

      - name: Sign and notarize Intel macOS binaries
        shell: bash
        env:
          APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          TARGET: x86_64-apple-darwin
        run: |
          set -euo pipefail
          input_dir="${RUNNER_TEMP}/unsigned-macos"
          output_dir="${GITHUB_WORKSPACE}/signed-macos"
          report_dir="${GITHUB_WORKSPACE}/macos-signing-verification"
          mkdir -p "${output_dir}" "${report_dir}"

          for binary in codex codex-code-mode-host codex-responses-api-proxy; do
            signed_path="${output_dir}/${binary}"
            zstd -d --stdout "${input_dir}/${binary}-${TARGET}-unsigned.zst" > "${signed_path}"
            chmod 0755 "${signed_path}"
            entitlements="${GITHUB_WORKSPACE}/.github/scripts/macos-signing/${binary}.entitlements.plist"
            .github/scripts/macos-signing/sign_macos_code.sh \
              --target "${signed_path}" \
              --identity unused \
              --deep false \
              --identifier "${binary}" \
              --options runtime \
              --timestamp true \
              --entitlements "${entitlements}"
            mkdir -p "${report_dir}/${binary}"
            rcodesign print-signature-info "${signed_path}" > "${report_dir}/${binary}/signature-info.yaml"
            .github/scripts/macos-signing/notarize_macos_binary_with_rcodesign.sh \
              --binary "${signed_path}" \
              --report-dir "${report_dir}/${binary}"
          done

      - name: Upload signed Intel macOS binaries
        uses: actions/upload-artifact@v7
        with:
          name: sedna-release-macos-x64-signed-binaries
          path: signed-macos/*
          if-no-files-found: error
          retention-days: 3

      - name: Upload Intel macOS binary signing verification
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sedna-release-macos-x64-binary-signing-verification
          path: macos-signing-verification/
          if-no-files-found: warn
          retention-days: 3

  release-macos-package:
    name: Package Intel macOS release assets
    needs:
      - resolve
      - release-macos-sign
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download signed Intel macOS binaries
        uses: actions/download-artifact@v8
        with:
          name: sedna-release-macos-x64-signed-binaries
          path: ${{ runner.temp }}/signed-macos

      - name: Package Intel macOS release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          REPOSITORY: ${{ github.repository }}
          TARGET_COMMIT: ${{ needs.resolve.outputs.target_commit }}
        run: |
          set -euo pipefail
          signed_dir="${RUNNER_TEMP}/signed-macos"
          stage_dir="${RUNNER_TEMP}/sedna-release/${TARGET}"
          dist_dir="${GITHUB_WORKSPACE}/dist-macos"
          archive_base="codex-sedna-${RELEASE_VERSION}-${TARGET}"
          dmg_path="${dist_dir}/codex-sedna-${RELEASE_VERSION}-${TARGET}.dmg"
          rm -rf "${stage_dir}" "${dist_dir}"
          mkdir -p "${stage_dir}" "${dist_dir}"

          for binary in codex codex-code-mode-host codex-responses-api-proxy; do
            install -m 0755 "${signed_dir}/${binary}" "${stage_dir}/${binary}"
            lipo "${stage_dir}/${binary}" -verify_arch x86_64
            codesign --verify --strict --verbose=2 "${stage_dir}/${binary}"
          done
          "${stage_dir}/codex" --version
          tar -C "${stage_dir}" -czf "${dist_dir}/${archive_base}.tar.gz" \
            codex codex-responses-api-proxy
          hdiutil create -volname "Codex Intel" -srcfolder "${stage_dir}" -format UDZO -ov "${dmg_path}"

          python3 - <<'PY' > "${dist_dir}/RELEASE-METADATA-${TARGET}.json"
          import json
          import os
          import sys

          json.dump(
              {
                  "release_tag": os.environ["RELEASE_TAG"],
                  "release_version": os.environ["RELEASE_VERSION"],
                  "repository": os.environ["REPOSITORY"],
                  "target_commit": os.environ["TARGET_COMMIT"],
                  "target": os.environ["TARGET"],
                  "signing": "developer-id",
                  "notarized": True,
              },
              sys.stdout,
              indent=2,
              sort_keys=True,
          )
          sys.stdout.write("\n")
          PY

      - name: Upload packaged Intel macOS assets
        uses: actions/upload-artifact@v7
        with:
          name: sedna-release-macos-x64-packaged
          path: dist-macos/*
          if-no-files-found: error
          retention-days: 3

  release-macos-sign-dmg:
    name: Sign, notarize, and staple Intel macOS DMG
    needs:
      - resolve
      - release-macos-package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: codesigning
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download packaged Intel macOS assets
        uses: actions/download-artifact@v8
        with:
          name: sedna-release-macos-x64-packaged
          path: ${{ runner.temp }}/packaged-macos

      - name: Set up AKV PKCS11 macOS signing
        uses: ./.github/actions/setup-akv-pkcs11-codesigning
        with:
          rcodesign-blob-uri: ${{ secrets.AKV_CODESIGN_RCODESIGN_BLOB_URI }}
          rcodesign-sha256: ${{ secrets.AKV_CODESIGN_RCODESIGN_SHA256 }}
          akv-pkcs11-library-blob-uri: ${{ secrets.AKV_CODESIGN_PKCS11_LIBRARY_BLOB_URI }}
          akv-pkcs11-library-sha256: ${{ secrets.AKV_CODESIGN_PKCS11_LIBRARY_SHA256 }}
          azure-client-id: ${{ secrets.AKV_CODESIGN_AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AKV_CODESIGN_TENANT }}
          azure-subscription-id: ${{ secrets.AKV_CODESIGN_SUBSCRIPTION }}
          key-vault-name: ${{ secrets.AKV_CODESIGN_KEY_VAULT_NAME }}
          key-name: ${{ secrets.AKV_CODESIGN_KEY_NAME }}
          key-version: ${{ secrets.AKV_CODESIGN_KEY_VERSION || '' }}
          certificate-sha256: ${{ secrets.AKV_CODESIGN_CERTIFICATE_SHA256 || '' }}

      - name: Sign, notarize, and staple Intel macOS DMG
        shell: bash
        env:
          APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          TARGET: x86_64-apple-darwin
        run: |
          set -euo pipefail
          dmg_path="${RUNNER_TEMP}/packaged-macos/codex-sedna-${RELEASE_VERSION}-${TARGET}.dmg"
          report_dir="${GITHUB_WORKSPACE}/macos-dmg-signing-verification"
          .github/scripts/macos-signing/sign_macos_code.sh \
            --target "${dmg_path}" \
            --identity unused \
            --deep false \
            --timestamp true
          mkdir -p "${report_dir}"
          rcodesign print-signature-info "${dmg_path}" > "${report_dir}/signature-info-before-notarization.yaml"
          .github/scripts/macos-signing/notarize_macos_dmg_with_rcodesign.sh \
            --dmg "${dmg_path}" \
            --report-dir "${report_dir}"
          rcodesign print-signature-info "${dmg_path}" > "${report_dir}/signature-info.yaml"

      - name: Upload signed Intel macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: sedna-release-macos-x64-signed-dmg
          path: ${{ runner.temp }}/packaged-macos/*.dmg
          if-no-files-found: error
          retention-days: 3

      - name: Upload Intel macOS DMG signing verification
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sedna-release-macos-x64-dmg-signing-verification
          path: macos-dmg-signing-verification/
          if-no-files-found: warn
          retention-days: 3

  release-macos-finalize:
    name: Verify Intel macOS release assets
    needs:
      - resolve
      - release-macos-package
      - release-macos-sign-dmg
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download packaged Intel macOS assets
        uses: actions/download-artifact@v8
        with:
          name: sedna-release-macos-x64-packaged
          path: dist-macos

      - name: Download signed Intel macOS DMG
        uses: actions/download-artifact@v8
        with:
          name: sedna-release-macos-x64-signed-dmg
          path: ${{ runner.temp }}/signed-dmg

      - name: Verify Intel macOS release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: |
          set -euo pipefail
          archive="dist-macos/codex-sedna-${RELEASE_VERSION}-${TARGET}.tar.gz"
          verify_dir="${RUNNER_TEMP}/verify-macos"
          dmg_name="codex-sedna-${RELEASE_VERSION}-${TARGET}.dmg"
          dmg_path="${RUNNER_TEMP}/signed-dmg/${dmg_name}"
          mount_dir="${RUNNER_TEMP}/codex-dmg-mount-${TARGET}"
          rm -rf "${verify_dir}"
          mkdir -p "${verify_dir}"
          tar -xzf "${archive}" -C "${verify_dir}"

          verify_signed_binary() {
            local path="$1"
            local binary="$2"
            local actual_entitlements expected_entitlements normalized_actual normalized_expected

            chmod 0755 "${path}"
            lipo "${path}" -verify_arch x86_64
            codesign --verify --strict --verbose=2 "${path}"
            expected_entitlements="${GITHUB_WORKSPACE}/.github/scripts/macos-signing/${binary}.entitlements.plist"
            test -f "${expected_entitlements}"
            actual_entitlements="$(mktemp)"
            normalized_actual="$(mktemp)"
            normalized_expected="$(mktemp)"
            codesign -d --entitlements :- "${path}" > "${actual_entitlements}"
            plutil -convert xml1 -o "${normalized_actual}" "${actual_entitlements}"
            plutil -convert xml1 -o "${normalized_expected}" "${expected_entitlements}"
            diff -u "${normalized_expected}" "${normalized_actual}"
            rm -f "${actual_entitlements}" "${normalized_actual}" "${normalized_expected}"
          }

          for binary in codex codex-responses-api-proxy; do
            verify_signed_binary "${verify_dir}/${binary}" "${binary}"
          done
          "${verify_dir}/codex" --version | grep -F "${RELEASE_VERSION}"

          hdiutil verify "${dmg_path}"
          codesign --verify --strict --verbose=2 "${dmg_path}"
          xcrun stapler validate "${dmg_path}"

          rm -rf "${mount_dir}"
          mkdir -p "${mount_dir}"
          hdiutil attach "${dmg_path}" -nobrowse -readonly -mountpoint "${mount_dir}"
          cleanup_mount() {
            hdiutil detach "${mount_dir}" >/dev/null
          }
          trap cleanup_mount EXIT
          for binary in codex codex-code-mode-host codex-responses-api-proxy; do
            verify_signed_binary "${mount_dir}/${binary}" "${binary}"
          done
          cleanup_mount
          trap - EXIT

          cp "${dmg_path}" "dist-macos/${dmg_name}"
          (
            cd dist-macos
            shasum -a 256 \
              "codex-sedna-${RELEASE_VERSION}-${TARGET}.tar.gz" \
              "${dmg_name}" \
              "RELEASE-METADATA-${TARGET}.json" \
              > "SHA256SUMS-${TARGET}.txt"
          )

      - name: Upload verified Intel macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: sedna-release-macos-x64
          path: dist-macos/*
          if-no-files-found: error
          retention-days: 3

  publish-release:
    name: Publish GitHub release
    needs:
      - resolve
      - release-linux
      - release-macos-preview-package
      - release-macos-finalize
    if: >-
      ${{
        always() &&
        needs.resolve.result == 'success' &&
        needs.resolve.outputs.release_requested == 'true' &&
        needs.resolve.outputs.release_build_required == 'true' &&
        needs.release-linux.result == 'success' &&
        (
          needs.resolve.outputs.macos_release_mode == 'off' ||
          (
            needs.resolve.outputs.macos_release_mode == 'preview' &&
            needs.release-macos-preview-package.result == 'success'
          ) ||
          (
            needs.resolve.outputs.macos_release_mode == 'notarized' &&
            needs.release-macos-finalize.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: release
    concurrency:
      group: ${{ github.workflow }}-${{ needs.resolve.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      actions: read
    steps:
      - name: Download Linux x86-64 release artifacts
        uses: actions/download-artifact@v8
        with:
          name: sedna-release-linux-x86_64-unknown-linux-gnu
          path: dist

      - name: Download Linux Arm64 release artifacts
        uses: actions/download-artifact@v8
        with:
          name: sedna-release-linux-aarch64-unknown-linux-gnu
          path: dist

      - name: Download Intel macOS release artifacts
        if: ${{ needs.resolve.outputs.macos_release_mode == 'notarized' }}
        uses: actions/download-artifact@v8
        with:
          name: sedna-release-macos-x64
          path: dist

      - name: Download Intel macOS preview artifacts
        if: ${{ needs.resolve.outputs.macos_release_mode == 'preview' }}
        uses: actions/download-artifact@v8
        with:
          name: sedna-release-macos-x64-preview
          path: dist

      - name: Check release publisher app configuration
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.SEDNA_RELEASE_PUBLISHER_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SEDNA_RELEASE_PUBLISHER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          missing=()
          if [[ -z "${APP_CLIENT_ID}" ]]; then
            missing+=("SEDNA_RELEASE_PUBLISHER_APP_CLIENT_ID")
          fi
          if [[ -z "${APP_PRIVATE_KEY}" ]]; then
            missing+=("SEDNA_RELEASE_PUBLISHER_APP_PRIVATE_KEY")
          fi

          if ((${#missing[@]} > 0)); then
            printf 'Missing release publisher GitHub App configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Generate release publisher app token
        id: release_publisher_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.SEDNA_RELEASE_PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.SEDNA_RELEASE_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: write

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_publisher_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_DRAFT: ${{ needs.resolve.outputs.draft }}
          RELEASE_PRERELEASE: ${{ needs.resolve.outputs.github_prerelease }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          MACOS_RELEASE_MODE: ${{ needs.resolve.outputs.macos_release_mode }}
          TARGET_COMMIT: ${{ needs.resolve.outputs.target_commit }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to clobber official assets."
            exit 1
          fi

          assets=(dist/*)
          if ((${#assets[@]} == 0)); then
            echo "No release assets found"
            exit 1
          fi

          draft_flag=()
          if [[ "${RELEASE_DRAFT}" == "true" ]]; then
            draft_flag+=(--draft)
          fi

          prerelease_flag=()
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            prerelease_flag+=(--prerelease)
          fi

          notes_flag=()
          if [[ "${MACOS_RELEASE_MODE}" == "preview" ]]; then
            preview_notes="### Intel macOS preview"$'\n\n'
            preview_notes+="The Intel macOS asset is ad-hoc signed and **not Developer ID signed or notarized by Apple**. "
            preview_notes+="It is a preview artifact, may be blocked by Gatekeeper, and is not an official supported macOS distribution."
            notes_flag+=(--notes "${preview_notes}")
          fi

          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --repo "${GH_REPO}" \
            --title "Codex Sedna ${RELEASE_VERSION}" \
            --generate-notes \
            --target "${TARGET_COMMIT}" \
            "${prerelease_flag[@]}" \
            "${notes_flag[@]}" \
            "${draft_flag[@]}"

      - name: Dispatch release asset verifier
        if: ${{ needs.resolve.outputs.draft != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_publisher_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRERELEASE: ${{ needs.resolve.outputs.github_prerelease }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          MACOS_RELEASE_MODE: ${{ needs.resolve.outputs.macos_release_mode }}
        run: |
          set -euo pipefail

          gh workflow run sedna-release-install.yml \
            --repo "${GH_REPO}" \
            --ref "${RELEASE_TAG}" \
            -f "release_tag=${RELEASE_TAG}" \
            -f "dry_run=true" \
            -f "allow_prerelease=${RELEASE_PRERELEASE}" \
            -f "require_linux_arm64=true" \
            -f "macos_release_mode=${MACOS_RELEASE_MODE}"

      - name: Summarize release decision
        if: ${{ always() }}
        shell: bash
        env:
          RELEASE_REQUESTED: ${{ needs.resolve.outputs.release_requested }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          MACOS_RELEASE_MODE: ${{ needs.resolve.outputs.macos_release_mode }}
          SKIP_REASON: ${{ needs.resolve.outputs.skip_reason }}
          TARGET_COMMIT: ${{ needs.resolve.outputs.target_commit }}
          UPSTREAM_BASE_TAG: ${{ needs.resolve.outputs.upstream_base_tag }}
          UPSTREAM_DISTANCE_FROM_TAG: ${{ needs.resolve.outputs.upstream_distance_from_tag }}
        run: |
          {
            echo "## Sedna release"
            echo
            echo "- Release requested: ${RELEASE_REQUESTED:-unknown}"
            if [[ "${RELEASE_REQUESTED:-false}" == "true" ]]; then
              echo "- Release tag: ${RELEASE_TAG}"
              echo "- Release version: ${RELEASE_VERSION}"
              echo "- Intel macOS mode: ${MACOS_RELEASE_MODE}"
              echo "- Target commit: ${TARGET_COMMIT}"
              echo "- Upstream base tag: ${UPSTREAM_BASE_TAG}"
              echo "- Upstream distance from tag: ${UPSTREAM_DISTANCE_FROM_TAG}"
            else
              echo "- Skip reason: ${SKIP_REASON:-unknown}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
