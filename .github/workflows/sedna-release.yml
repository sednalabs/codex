name: sedna-release

on:
  workflow_dispatch:
    inputs:
      package-version:
        description: Exact Cargo workspace version to publish.
        required: true
        type: string
      channel:
        description: Sedna release channel.
        required: true
        type: choice
        options:
          - stable
          - prerelease

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release identity
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          [[ "$SOURCE_COMMIT" == "$WORKFLOW_SHA" ]]
          git diff --quiet HEAD --
          cargo_version="$(sed -n -E 's/^version = "([^"]+)"$/\1/p' codex-rs/Cargo.toml | head -n 1)"
          [[ "$PACKAGE_VERSION" == "$cargo_version" ]]
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          case "$CHANNEL" in
            stable) [[ "${PACKAGE_VERSION%%+*}" != *-* ]] ;;
            prerelease) [[ "${PACKAGE_VERSION%%+*}" == *-* ]] ;;
            *) exit 1 ;;
          esac
      - name: Build and smoke-test canonical package
        uses: ./.github/actions/build-codex-packages
        with:
          target: ${{ matrix.target }}
          package-version: ${{ inputs.package-version }}
          build-mode: release
          build-system: cargo
      - name: Record exact-source package metadata
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE_VERSION: ${{ inputs.package-version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha || github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          [[ "$SOURCE_COMMIT" == "$WORKFLOW_SHA" ]]
          git diff --quiet HEAD --
          archive="dist/${TARGET}/codex-package-${TARGET}.tar.gz"
          [[ -f "$archive" && ! -L "$archive" ]]
          archive_sha="$(sha256sum "$archive" | awk '{print $1}')"
          ARCHIVE_SHA="$archive_sha" SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          target = os.environ["TARGET"]
          version = os.environ["PACKAGE_VERSION"]
          metadata = {
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseTag": f"rust-v{version}",
              "packageVersion": version,
              "nativeVersion": version,
              "channel": os.environ["CHANNEL"],
              "target": target,
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "sourceTree": os.environ["SOURCE_TREE"],
              "workflowHostCommit": os.environ["WORKFLOW_SHA"],
              "workflowHostTree": os.environ["SOURCE_TREE"],
              "workflowRunId": os.environ["WORKFLOW_RUN_ID"],
              "archive": {
                  "name": f"codex-package-{target}.tar.gz",
                  "sha256": os.environ["ARCHIVE_SHA"],
              },
          }
          Path(f"dist/{target}/RELEASE-METADATA-{target}.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Attest exact-source archive and metadata
        id: attest_package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/dist/${{ matrix.target }}/codex-package-${{ matrix.target }}.tar.gz
            ${{ github.workspace }}/dist/${{ matrix.target }}/RELEASE-METADATA-${{ matrix.target }}.json
      - name: Stage attestation bundle and checksums
        env:
          TARGET: ${{ matrix.target }}
          ATTESTATION_BUNDLE: ${{ steps.attest_package.outputs.bundle-path }}
        run: |
          set -euo pipefail
          archive_dir="dist/${TARGET}"
          install -m 0644 "$ATTESTATION_BUNDLE" "$archive_dir/codex-package-${TARGET}.intoto.jsonl"
          (
            cd "$archive_dir"
            sha256sum \
              "codex-package-${TARGET}.tar.gz" \
              "RELEASE-METADATA-${TARGET}.json" \
              "codex-package-${TARGET}.intoto.jsonl" \
              > "SHA256SUMS-${TARGET}"
          )
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/codex-package-${{ matrix.target }}.tar.gz
            dist/${{ matrix.target }}/RELEASE-METADATA-${{ matrix.target }}.json
            dist/${{ matrix.target }}/codex-package-${{ matrix.target }}.intoto.jsonl
            dist/${{ matrix.target }}/SHA256SUMS-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    concurrency:
      group: ${{ github.workflow }}-rust-v${{ inputs.package-version }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download Linux x86-64 release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sedna-x86_64-unknown-linux-musl
          path: dist
      - name: Download Linux Arm64 release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sedna-aarch64-unknown-linux-musl
          path: dist
      - name: Verify exact-source release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.package-version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha || github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          [[ "$SOURCE_COMMIT" == "$WORKFLOW_SHA" ]]
          git diff --quiet HEAD --
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            archive="dist/codex-package-${target}.tar.gz"
            metadata="dist/RELEASE-METADATA-${target}.json"
            bundle="dist/codex-package-${target}.intoto.jsonl"
            checksums="dist/SHA256SUMS-${target}"
            for file in "$archive" "$metadata" "$bundle" "$checksums"; do
              [[ -f "$file" && ! -L "$file" ]]
            done
            for subject in "$archive" "$metadata"; do
              gh attestation verify "$subject" \
                --bundle "$bundle" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/sedna-release.yml" \
                --signer-digest "$WORKFLOW_SHA" \
                --source-digest "$SOURCE_COMMIT" \
                --source-ref refs/heads/main \
                --deny-self-hosted-runners
            done
          done
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')" python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          targets = ("x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl")
          source = Path("dist")
          expected_files = set()
          verified_files = []
          try:
              for target in targets:
                  archive_name = f"codex-package-{target}.tar.gz"
                  metadata_name = f"RELEASE-METADATA-{target}.json"
                  bundle_name = f"codex-package-{target}.intoto.jsonl"
                  checksum_name = f"SHA256SUMS-{target}"
                  names = (archive_name, metadata_name, bundle_name, checksum_name)
                  expected_files.update(names)
                  for name in names:
                      path = source / name
                      if path.is_symlink() or not path.is_file():
                          raise ValueError("invalid release file")
                  with (source / archive_name).open("rb") as handle:
                      archive_sha = hashlib.file_digest(handle, "sha256").hexdigest()
                  version = os.environ["PACKAGE_VERSION"]
                  expected_metadata = {
                      "schemaVersion": 1,
                      "repository": os.environ["GITHUB_REPOSITORY"],
                      "releaseTag": f"rust-v{version}",
                      "packageVersion": version,
                      "nativeVersion": version,
                      "channel": os.environ["CHANNEL"],
                      "target": target,
                      "sourceCommit": os.environ["SOURCE_COMMIT"],
                      "sourceTree": os.environ["SOURCE_TREE"],
                      "workflowHostCommit": os.environ["WORKFLOW_SHA"],
                      "workflowHostTree": os.environ["SOURCE_TREE"],
                      "workflowRunId": os.environ["WORKFLOW_RUN_ID"],
                      "archive": {"name": archive_name, "sha256": archive_sha},
                  }
                  metadata = json.loads((source / metadata_name).read_text(encoding="utf-8"))
                  if metadata != expected_metadata:
                      raise ValueError("release metadata mismatch")
                  checksum_lines = []
                  for name in (archive_name, metadata_name, bundle_name):
                      with (source / name).open("rb") as handle:
                          digest = hashlib.file_digest(handle, "sha256").hexdigest()
                      checksum_lines.append(f"{digest}  {name}\n")
                  if (source / checksum_name).read_text(encoding="utf-8") != "".join(checksum_lines):
                      raise ValueError("release checksum mismatch")
                  verified_files.extend(names)
              if {path.name for path in source.iterdir()} != expected_files:
                  raise ValueError("unexpected release files")
              destination = Path("release-assets")
              destination.mkdir()
              for name in verified_files:
                  shutil.copyfile(source / name, destination / name)
          except Exception:
              raise SystemExit("Release artifact identity verification failed") from None
          PY
      - name: Check release publisher app configuration
        env:
          APP_CLIENT_ID: ${{ vars.SEDNA_RELEASE_PUBLISHER_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SEDNA_RELEASE_PUBLISHER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$APP_CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]] || {
            echo "Release publisher app configuration is required." >&2
            exit 1
          }
      - name: Generate release publisher app token
        id: release_publisher_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.SEDNA_RELEASE_PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.SEDNA_RELEASE_PUBLISHER_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Publish verified Sedna release
        env:
          GH_TOKEN: ${{ steps.release_publisher_token.outputs.token }}
          PACKAGE_VERSION: ${{ inputs.package-version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="rust-v${PACKAGE_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite official assets." >&2
            exit 1
          fi
          assets=()
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            assets+=(
              "release-assets/codex-package-${target}.tar.gz"
              "release-assets/RELEASE-METADATA-${target}.json"
              "release-assets/codex-package-${target}.intoto.jsonl"
              "release-assets/SHA256SUMS-${target}"
            )
          done
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${tag}" -f "sha=${SOURCE_COMMIT}" >/dev/null
          prerelease_args=()
          if [[ "$CHANNEL" == prerelease ]]; then prerelease_args+=(--prerelease); fi
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$SOURCE_COMMIT" \
            --title "Codex ${PACKAGE_VERSION} (Sedna ${CHANNEL})" \
            --notes "Sedna ${CHANNEL} Linux packages for ${PACKAGE_VERSION}." \
            "${prerelease_args[@]}"
