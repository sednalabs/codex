# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up periodic OSV-Scanner scanning for vulnerabilities,
# in addition to a PR check which fails if new vulnerabilities are introduced.
#
# For more examples and options, including how to ignore specific vulnerabilities,
# see https://google.github.io/osv-scanner/github-action/

name: OSV-Scanner

on:
  pull_request:
    branches: ["main", "upstream-main"]
  merge_group:
    branches: ["main", "upstream-main"]
  schedule:
    - cron: "28 6 * * 2"
  push:
    branches: ["main", "upstream-main"]

permissions:
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Read commit contents
  contents: read

# Keep future-enabled OSV runs isolated by immutable attempt identity. The
# workflow is presently disabled in repository settings, but this avoids
# reintroducing a ref-name cancellation race when it is enabled again.
concurrency:
  group: >-
    concurrency-group::${{ github.workflow }}::${{
      github.event_name == 'merge_group' &&
      format('merge-group-{0}', github.sha) ||
      github.event_name == 'pull_request' &&
      format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'push' &&
      format('push-{0}', github.sha) ||
      format('{0}-{1}', github.event_name, github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2" # v2.3.8
    with:
      # Example of specifying custom arguments
      scan-args: |-
        -r
        --skip-git
        ./
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2" # v2.3.8
    with:
      # Example of specifying custom arguments
      scan-args: |-
        -r
        --skip-git
        ./
