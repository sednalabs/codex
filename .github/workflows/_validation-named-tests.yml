name: _validation-named-tests

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: false
        type: string
        default: ""
      harness_sha:
        required: true
        type: string
      profile:
        required: true
        type: string
      request_json:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: validation-named-tests
      repetitions:
        description: Exact-test observations on this runner (bounded to 1 or 3)
        required: false
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  run:
    name: Run exact named Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "8388608"
      VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
      VALIDATION_BASE_REF: ${{ inputs.base_ref }}
      VALIDATION_EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
      VALIDATION_EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
      VALIDATION_PROFILE: ${{ inputs.profile }}
      RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
      VALIDATION_REPETITIONS: ${{ inputs.repetitions }}
      VALIDATION_ARTIFACT_NAME: ${{ inputs.artifact_name }}
    steps:
      - name: Check out trusted workflow helpers
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          path: .workflow-src

      - name: Materialize exact B/T worktrees
        working-directory: .workflow-src
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "${BASE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]; then
            echo "base_ref must be a safe repository ref" >&2
            exit 1
          fi
          if [[ -n "${EXPECTED_BASE_SHA}" && ! "${EXPECTED_BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "base_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "${TARGET_SHA}"
          target_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "${target_sha}" != "${TARGET_SHA}" ]]; then
            echo "target fetch did not resolve to requested target SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "${BASE_REF}"
          base_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ -n "${EXPECTED_BASE_SHA}" && "${base_sha}" != "${EXPECTED_BASE_SHA}" ]]; then
            echo "base fetch does not match requested base SHA" >&2
            exit 1
          fi
          git worktree add --detach "${GITHUB_WORKSPACE}/validation-target" "${target_sha}"
          git worktree add --detach "${GITHUB_WORKSPACE}/validation-base" "${base_sha}"
          {
            echo "MATERIALIZED_TARGET_SHA=${target_sha}"
            echo "MATERIALIZED_BASE_SHA=${base_sha}"
          } >> "${GITHUB_ENV}"

      - name: Verify H/B/T checkout identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VALIDATION_TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "${VALIDATION_EXPECTED_HARNESS_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "harness_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          harness_sha="$(git -C .workflow-src rev-parse HEAD)"
          if [[ "${MATERIALIZED_TARGET_SHA}" != "${VALIDATION_TARGET_SHA}" ]]; then
            echo "target checkout does not match requested target SHA" >&2
            exit 1
          fi
          if [[ "${harness_sha}" != "${VALIDATION_EXPECTED_HARNESS_SHA}" ]]; then
            echo "workflow helper checkout does not match requested harness SHA" >&2
            exit 1
          fi
          if [[ -n "${VALIDATION_EXPECTED_BASE_SHA}" && "${MATERIALIZED_BASE_SHA}" != "${VALIDATION_EXPECTED_BASE_SHA}" ]]; then
            echo "comparison-base checkout does not match requested base SHA" >&2
            exit 1
          fi
          {
            echo "VALIDATION_TARGET_SHA=${MATERIALIZED_TARGET_SHA}"
            echo "VALIDATION_BASE_SHA=${MATERIALIZED_BASE_SHA}"
            echo "VALIDATION_HARNESS_SHA=${harness_sha}"
          } >> "${GITHUB_ENV}"

      - name: Preflight named-test harness tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${VALIDATION_REPETITIONS}" != "1" && "${VALIDATION_REPETITIONS}" != "3" ]]; then
            echo "repetitions must be exactly 1 or 3" >&2
            exit 1
          fi
          if ! output="$(python3 .workflow-src/.github/scripts/test_run_named_rust_tests.py 2>&1)"; then
            printf '%s\n' "${output}"
            exit 1
          fi
          printf '%s\n' "${output}"
          if ! grep -Eq '^Ran [1-9][0-9]* tests? in ' <<< "${output}"; then
            echo "named-test harness preflight executed zero tests" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bind js_repl Node runtime
        shell: bash
        run: echo "CODEX_JS_REPL_NODE_PATH=$(command -v node)" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Inventory and run exact named tests
        id: named_tests
        continue-on-error: true
        working-directory: validation-target
        env:
          VALIDATION_REPETITIONS: ${{ inputs.repetitions }}
          VALIDATION_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "../.workflow-src/.github/scripts")
          from test_frontier_soak_contract import run_frontier_observation

          repetitions = int(os.environ["VALIDATION_REPETITIONS"])
          artifact_name = os.environ["VALIDATION_ARTIFACT_NAME"]
          runner = ["python3", "../.workflow-src/.github/scripts/run_named_rust_tests.py"]
          result_path = Path("rust-tests-v1-results.json")
          manifest_path = Path("../.workflow-src/.github/validation-frontier-soak.json")
          manifest_sha256 = ""
          if manifest_path.is_file():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              canonical = json.dumps(
                  manifest, ensure_ascii=False, separators=(",", ":")
              ).encode("utf-8")
              manifest_sha256 = hashlib.sha256(canonical).hexdigest()
          catalog_path = Path(".github/validation-named-tests.json")
          catalog_sha256 = (
              hashlib.sha256(catalog_path.read_bytes()).hexdigest()
              if catalog_path.is_file()
              else ""
          )

          failure = False
          for iteration in range(1, repetitions + 1):
              if repetitions == 1:
                  output_path = result_path
              else:
                  output_path = Path("frontier-results") / f"iteration-{iteration}.json"
              iteration_failed = run_frontier_observation(
                  runner=runner,
                  result_path=result_path,
                  output_path=output_path,
                  iteration=iteration,
                  repetitions=repetitions,
                  artifact_name=artifact_name,
                  manifest_sha256=manifest_sha256,
                  catalog_sha256=catalog_sha256,
              )
              failure = failure or iteration_failed

          raise SystemExit(1 if failure else 0)
          PY

      - name: Append named-test evidence
        if: ${{ always() }}
        shell: bash
        env:
          VALIDATION_REPETITIONS: ${{ inputs.repetitions }}
          VALIDATION_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          RESULTS_DIRECTORY: ${{ github.workspace }}/validation-target
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          from pathlib import Path

          results = Path(os.environ["RESULTS_DIRECTORY"])
          repetitions = int(os.environ["VALIDATION_REPETITIONS"])
          for iteration in range(1, repetitions + 1):
              path = (
                  results / "rust-tests-v1-results.json"
                  if repetitions == 1
                  else results / "frontier-results" / f"iteration-{iteration}.json"
              )
              if not path.exists():
                  print(f"### Named test evidence — iteration {iteration}")
                  print("- No result artifact was produced.")
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              identity = payload.get("identity") or {}
              tests = payload.get("tests") or []
              observed = [
                  test for test in tests
                  if any(outcome in ("ok", "FAILED", "ignored")
                         for outcome in test.get("observed_outcomes", []))
              ]
              ignored = sum(
                  1 for test in tests if "ignored" in test.get("observed_outcomes", [])
              )
              not_run = sum(1 for test in tests if test.get("status") == "not_run")
              print(f"### Named test evidence — iteration {iteration}/{repetitions}")
              print(f"- Lane/artifact: `{os.environ['VALIDATION_ARTIFACT_NAME']}`")
              print(f"- Status: `{payload.get('status', 'unknown')}`")
              print(f"- Request fingerprint: `{payload.get('request_fingerprint', '')}`")
              print(f"- Harness SHA: `{identity.get('harness_sha', '')}`")
              print(f"- Base SHA: `{identity.get('base_sha', '')}`")
              print(f"- Candidate SHA: `{identity.get('target_sha', '')}`")
              frontier = payload.get("frontier_iteration") or {}
              if frontier.get("manifest_sha256"):
                  print(f"- Manifest SHA-256: `{frontier['manifest_sha256']}`")
                  print(f"- Target catalog SHA-256: `{frontier.get('target_catalog_sha256', '')}`")
                  print(f"- Elapsed monotonic ms: `{frontier.get('elapsed_ns', 0) / 1_000_000:.3f}`")
              print(f"- Selected tests: `{len((payload.get('request') or {}).get('tests') or [])}`")
              print(f"- Executed outcomes: `{len(observed)}`")
              print(f"- Ignored tests: `{ignored}`")
              print(f"- Not run: `{not_run}`")
              if payload.get("failure_code"):
                  print(f"- Failure code: `{payload['failure_code']}`")
          PY

      - name: Upload named-test evidence (single observation)
        if: ${{ always() && inputs.repetitions == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: validation-target/rust-tests-v1-results.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload frontier observation 1
        if: ${{ always() && inputs.repetitions == '3' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-iteration-1
          path: validation-target/frontier-results/iteration-1.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload frontier observation 2
        if: ${{ always() && inputs.repetitions == '3' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-iteration-2
          path: validation-target/frontier-results/iteration-2.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload frontier observation 3
        if: ${{ always() && inputs.repetitions == '3' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-iteration-3
          path: validation-target/frontier-results/iteration-3.json
          if-no-files-found: error
          retention-days: 3

      - name: Preserve failed exact-test result
        if: ${{ steps.named_tests.outcome == 'failure' }}
        shell: bash
        run: exit 1
