                      result["inventory"]["failure_class"] = "compile_failure"
                  elif "no space left on device" in inventory_lower:
                      result["inventory"]["failure_class"] = "runner_storage_failure"
                  elif "timed out" in inventory_lower or "timeout" in inventory_lower:
                      result["inventory"]["failure_class"] = "inventory_timeout"
