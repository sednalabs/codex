        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          target = Path.cwd()
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          host = workspace / ".workflow-src"
          base = workspace / "validation-base"
          output_dir = Path(os.environ["OUTPUT_DIR"])
          expected_target = "43dfc7894b59db6992ab7b6f57f36c5d9fd7f39f"
          expected_tree = "d5e6ce716827e065992c438215b69e1d270062aa"
          expected_parent = "aeb563872125eb5b93bd80dbdaf2685a8fa39c20"
          expected_base = "a319e05bad22a5b2870c9bfad3f49ac74dc0bef3"

          def git_value(root, *arguments):
              return subprocess.check_output(
                  ["git", "-C", str(root), *arguments],
                  text=True,
                  stdin=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).strip()

          raw_target_commit = subprocess.check_output(
              ["git", "-C", str(target), "cat-file", "commit", "HEAD"],
              stdin=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          target_header, header_separator, _ = raw_target_commit.partition(b"\n\n")
          target_parents = []
          if header_separator:
              target_parents = [
                  line[len(b"parent "):].decode("ascii")
                  for line in target_header.splitlines()
                  if line.startswith(b"parent ")
              ]
          identities = {
              "harness_sha": git_value(host, "rev-parse", "HEAD"),
              "harness_tree": git_value(host, "rev-parse", "HEAD^{tree}"),
              "target_sha": git_value(target, "rev-parse", "HEAD"),
              "target_tree": git_value(target, "rev-parse", "HEAD^{tree}"),
              "target_parent": target_parents[0] if len(target_parents) == 1 else "",
              "base_sha": git_value(base, "rev-parse", "HEAD"),
              "base_tree": git_value(base, "rev-parse", "HEAD^{tree}"),
          }
          if (
              identities["harness_sha"] != os.environ["VALIDATION_EXPECTED_HARNESS_SHA"]
              or identities["harness_sha"] != os.environ["GITHUB_SHA"]
              or identities["target_sha"] != expected_target
              or identities["target_tree"] != expected_tree
              or target_parents != [expected_parent]
              or identities["base_sha"] != expected_base
              or os.environ["VALIDATION_TARGET_SHA"] != expected_target
              or os.environ["VALIDATION_BASE_REF"] != expected_base
              or os.environ.get("VALIDATION_EXPECTED_BASE_SHA", "") not in ("", expected_base)
              or os.environ["VALIDATION_PROFILE"] != "rust_minimal"
              or os.environ["GITHUB_REPOSITORY"] != "sednalabs/codex"
              or git_value(host, "status", "--porcelain", "--untracked-files=no")
              or git_value(target, "status", "--porcelain", "--untracked-files=no")
              or git_value(base, "status", "--porcelain", "--untracked-files=no")
          ):
              raise SystemExit("Fixed usage-report source identity mismatch.")

          output_dir.mkdir(mode=0o700, parents=False, exist_ok=False)
          exit_code = None
          stdout = b""
          stderr = b""
          failure_code = ""
          try:
              completed = subprocess.run(
                  [sys.executable, "scripts/test_codex_usage_report_exact_root.py"],
                  cwd=target,
                  env={
                      "PATH": os.environ.get("PATH", ""),
                      "PYTHONDONTWRITEBYTECODE": "1",
                      "PYTHONNOUSERSITE": "1",
                  },
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  timeout=600,
                  check=False,
              )
              exit_code = completed.returncode
              stdout = completed.stdout
              stderr = completed.stderr
          except subprocess.TimeoutExpired:
              failure_code = "synthetic_test_timeout"
          except OSError:
              failure_code = "synthetic_test_launch_failed"
          summary = None
          for output in (stdout, stderr):
              for line in output.splitlines():
                  try:
                      candidate = json.loads(line)
                  except (UnicodeDecodeError, ValueError):
                      continue
                  if candidate == {"status": "passed", "cases": 14}:
                      summary = candidate
          passed = exit_code == 0 and summary is not None
          if not failure_code:
              if exit_code != 0:
                  failure_code = "synthetic_tests_failed"
              elif summary is None:
                  failure_code = "synthetic_test_summary_missing"

          known_report_reasons = {
              "actual_credit_coverage_incomplete",
              "attribution_text_accounting_unavailable",
              "bounded_text_limit_unavailable",
              "call_limit_exceeded",
              "configured_model_attribution_conflict",
              "cross_ledger_reconciliation_limited_by_source_coverage",
              "database_unavailable",
              "deadline_exceeded",
              "instruction_limit_exceeded",
              "ledger_busy",
              "ledger_schema_mismatch",
              "lineage_cycle",
              "lineage_depth_limit_exceeded",
              "lineage_incomplete",
              "lineage_metadata_changed_during_snapshot",
              "lineage_metadata_duplicate_id",
              "lineage_metadata_invalid",
              "lineage_node_limit_exceeded",
              "lineage_scan_row_limit_exceeded",
              "lineage_scan_text_limit_exceeded",
              "output_group_limit_exceeded",
              "physical_call_deduplication_incomplete",
              "rate_policy_row_limit_exceeded",
              "rate_policy_key_limit_exceeded",
              "read_only_policy_denied_query",
              "required_reporting_index_missing",
              "required_spawn_request_index_missing",
              "selected_attribution_text_limit_exceeded",
              "selected_source_text_limit_exceeded",
              "serialized_error_limit_exceeded",
              "serialized_json_limit_exceeded",
              "source_identity_field_limit_exceeded",
              "source_text_field_limit_exceeded",
              "spawn_request_metadata_limit_exceeded",
              "sqlite_value_limit_exceeded",
              "standard_scenario_coverage_incomplete",
              "thread_metadata_missing",
              "token_coverage_incomplete",
              "unknown_thread_id",
              "unsupported_timestamp_encoding",
              "sqlite_query_failed",
              "sqlite_read_failed",
              "all_time_requires_exact_thread_scope",
          }
          known_exception_classes = {
              "AssertionError",
              "AttributeError",
              "DataError",
              "DatabaseError",
              "DecimalException",
              "Error",
              "Exception",
              "FileNotFoundError",
              "IndexError",
              "IntegrityError",
              "InterfaceError",
              "InternalError",
              "JSONDecodeError",
              "KeyError",
              "KeyboardInterrupt",
              "NotSupportedError",
              "OperationalError",
              "OSError",
              "PermissionError",
              "ProgrammingError",
              "ReportProblem",
              "RuntimeError",
              "SystemExit",
              "TimeoutError",
              "TimeoutExpired",
              "TypeError",
              "UnicodeDecodeError",
              "ValueError",
              "WorkLimitReached",
              "ZoneInfoNotFoundError",
          }
          diagnostic_pattern = re.compile(
              rb"^AssertionError: expected incomplete only for missing actual-model rate; "
              rb"stage=single_ledger_cli expected_exit=2 "
              rb"observed_exit=([0-9]{1,3}) "
              rb"report_status=(complete|incomplete|unavailable) "
              rb"error_reason=([a-z_]{1,80}) "
              rb"reason_codes=(none|[a-z_,]{1,512}) "
              rb"source_line=(none|[0-9]{1,4}) "
              rb"exception_class=([A-Za-z][A-Za-z0-9_]{0,47})$"
          )

          def safe_test_diagnostic(captured_stderr):
              matches = [
                  match
                  for line in captured_stderr.splitlines()
                  if (match := diagnostic_pattern.fullmatch(line)) is not None
              ]
              if len(matches) != 1:
                  return "unmatched"
              match = matches[0]
              observed_exit = int(match.group(1))
              error_reason = match.group(3).decode("ascii")
              reason_text = match.group(4).decode("ascii")
              source_line_text = match.group(5).decode("ascii")
              exception_text = match.group(6).decode("ascii")
              reason_codes = [] if reason_text == "none" else reason_text.split(",")
              if (
                  observed_exit > 255
                  or (error_reason != "none" and error_reason not in known_report_reasons)
                  or len(reason_codes) > 8
                  or len(reason_codes) != len(set(reason_codes))
                  or any(reason not in known_report_reasons for reason in reason_codes)
              ):
                  return "unmatched"
              source_line = None
              if source_line_text != "none":
                  source_line = int(source_line_text)
                  if not 1 <= source_line <= 4000:
                      return "unmatched"
              return {
                  "stage": "single_ledger_cli",
                  "expected_exit": 2,
                  "observed_exit": observed_exit,
                  "report_status": match.group(2).decode("ascii"),
                  "error_reason": error_reason,
                  "reason_codes": reason_codes,
                  "source_line": source_line,
                  "exception_class": (
                      exception_text
                      if exception_text in known_exception_classes or exception_text == "none"
                      else "other"
                  ),
              }

          receipt = {
              "schema_version": "usage-report-exact-root-result-v1",
              "status": "success" if passed else "failure",
              "failure_code": "" if passed else failure_code,
              "test_diagnostic": "" if passed else safe_test_diagnostic(stderr),
              "identity": {
                  **identities,
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "profile": os.environ["VALIDATION_PROFILE"],
              },
              "command": "python3 scripts/test_codex_usage_report_exact_root.py",
              "exit_code": exit_code,
              "cases": summary["cases"] if summary is not None else 0,
          }
          result_path = output_dir / "usage-report-exact-root-results.json"
          descriptor = os.open(
              result_path,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
              0o600,
          )
          with os.fdopen(descriptor, "w", encoding="utf-8") as result_file:
              result_file.write(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("generated=true\n")
          print(json.dumps({"status": receipt["status"], "failure_code": receipt["failure_code"], "cases": receipt["cases"]}, sort_keys=True))
          if not passed:
              raise SystemExit(1)
          PY

