          ansi_csi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          outcome_re = re.compile(
              r"^test (?P<name>[A-Za-z0-9_:]+) \.\.\. (?P<status>ok|FAILED|ignored)$",
              re.MULTILINE,
          )
          summary_re = re.compile(
              r"test result:\s+\w+\.\s+(?P<passed>\d+) passed;\s+(?P<failed>\d+) failed;\s+(?P<ignored>\d+) ignored;\s+(?P<measured>\d+) measured;\s+(?P<filtered>\d+) filtered out"
          )
          panic_re = re.compile(r"panicked at .*?([^/\\\s]+\.rs):(\d+):(\d+)")

          def bounded_diagnostic(stdout, stderr):
              text = ansi_csi.sub("", (stderr or "") + "\n" + (stdout or ""))
              for key in ("GITHUB_WORKSPACE", "RUNNER_TEMP", "HOME"):
                  value = os.environ.get(key, "")
                  if value:
                      text = text.replace(value, f"<{key.lower()}>")
              text = re.sub(r"/home/runner/work/[^\s:]+", "<runner-path>", text)
              text = re.sub(r"/tmp/[^\s:]+", "<temporary-path>", text)
              text = re.sub(r"https?://[^\s/@:]+:[^\s/@]+@", "https://<redacted>@", text)
              text = re.sub(r"(?i)(authorization:\s*bearer\s+)[^\s]+", r"\1<redacted>", text)
              text = re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})\b", "<redacted-token>", text)
              return text[-4000:].strip()

          if (
              identity["target_sha"] != expected_target
              or identity["base_ref"] != "main"
              or identity["base_sha"] != expected_base
              or os.environ.get("VALIDATION_PROFILE") != expected_profile
          ):
              fail("fixed_identity_mismatch", "The TUI provider route is restricted to its exact target, base, and profile.")
          elif request != expected_request:
              fail("fixed_selector_mismatch", "The TUI provider request does not match the fixed selector set.")
          else:
              inventory_command = [
                  "cargo", "test", "--manifest-path", "codex-rs/Cargo.toml", "--locked",
                  "-p", "codex-tui", "--lib", "--", "--list",
              ]
              inventory = subprocess.run(
                  inventory_command,
                  text=True,
                  capture_output=True,
                  check=False,
                  shell=False,
              )
              observed_inventory = re.findall(r"^([A-Za-z0-9_:]+): test$", inventory.stdout, re.MULTILINE)
              inventory_counts = {name: observed_inventory.count(name) for name in expected_tests}
              result["inventory"] = {
                  "status": "success" if inventory.returncode == 0 else "failure",
                  "command_argv": inventory_command,
                  "test_count": len(observed_inventory),
                  "selected_counts": inventory_counts,
                  "exit_code": inventory.returncode,
              }
              missing = [name for name, count in inventory_counts.items() if count == 0]
              ambiguous = [name for name, count in inventory_counts.items() if count != 1]
              if inventory.returncode != 0:
                  fail("inventory_command_failed", "Cargo could not inventory the fixed TUI provider library tests.")
                  inventory_output = inventory.stderr + "\n" + inventory.stdout
                  inventory_lower = inventory_output.lower()
                  if "could not compile" in inventory_lower or "error[e" in inventory_lower:
                      result["inventory"]["failure_class"] = "compile_failure"
                  elif "no space left on device" in inventory_lower:
                      result["inventory"]["failure_class"] = "runner_storage_failure"
                  elif "timed out" in inventory_lower or "timeout" in inventory_lower:
                      result["inventory"]["failure_class"] = "inventory_timeout"
                  else:
                      result["inventory"]["failure_class"] = "cargo_inventory_failure"
                  result["inventory"]["diagnostic_tail"] = bounded_diagnostic(
                      inventory.stdout, inventory.stderr
                  )
              elif missing or ambiguous:
                  fail("inventory_reconciliation_failed", "The candidate does not contain each fixed TUI selector exactly once.")
                  result["inventory"]["missing_tests"] = missing
                  result["inventory"]["ambiguous_tests"] = ambiguous
              else:
                  for expected_test in expected_tests:
                      command = [
                          "cargo", "test", "--manifest-path", "codex-rs/Cargo.toml", "--locked",
                          "-p", "codex-tui", "--lib", "--", expected_test, "--exact", "--test-threads=1",
                      ]
                      completed = subprocess.run(
                          command,
                          text=True,
                          capture_output=True,
                          check=False,
                          shell=False,
                      )
                      combined = ansi_csi.sub("", completed.stdout + "\n" + completed.stderr)
                      outcomes = outcome_re.findall(combined)
                      summaries = list(summary_re.finditer(combined))
                      counts = None
                      if summaries:
                          counts = {key: int(summaries[-1].group(key)) for key in ("passed", "failed", "ignored", "measured", "filtered")}
                      passed = (
                          completed.returncode == 0
                          and outcomes == [(expected_test, "ok")]
                          and counts == {
                              "passed": 1,
                              "failed": 0,
                              "ignored": 0,
                              "measured": 0,
                              "filtered": len(observed_inventory) - 1,
                          }
                      )
                      receipt = {
                          "name": expected_test,
                          "status": "ok" if passed else "failed",
                          "exit_code": completed.returncode,
                          "command_argv": command,
                          "result_counts": counts,
                      }
                      if not passed:
                          reason = "test_outcome_mismatch" if counts is not None else "execution_no_summary"
                          if completed.returncode != 0 and counts is None:
                              lower = combined.lower()
                              if "could not compile" in lower:
                                  reason = "compile_failure"
                              elif "stack overflow" in lower:
                                  reason = "stack_overflow"
                          receipt["failure_reason"] = reason
                          receipt["panic_sites"] = [
                              {"file": file_name, "line": int(line), "column": int(column)}
                              for file_name, line, column in panic_re.findall(combined)[-3:]
                          ]
                          result["failure_code"] = "test_execution_mismatch"
                          result["message"] = "A fixed TUI selector did not execute exactly once as a passing test."
                          result["result_counts"]["failed"] += 1
                      else:
                          result["result_counts"]["passed"] += 1
                      result["tests"].append(receipt)
                      if completed.returncode != 0 and counts is None:
                          break
                  success = (
                      len(result["tests"]) == len(expected_tests)
                      and all(receipt["status"] == "ok" for receipt in result["tests"])
                      and result["result_counts"] == {
                          "passed": len(expected_tests), "failed": 0, "ignored": 0, "measured": 0
                      }
                  )
                  if success:
                      result["status"] = "success"
                      result["message"] = "All fixed TUI provider selectors passed exactly once."
                  elif not result["failure_code"]:
                      fail("test_execution_mismatch", "The fixed TUI provider selector set was incomplete.")

          Path("rust-tests-v1-results.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "status": result["status"],
              "failure_code": result["failure_code"],
              "inventory_count": result["inventory"]["test_count"],
              "inventory_failure_class": result["inventory"].get("failure_class", ""),
              "inventory_diagnostic_tail": result["inventory"].get("diagnostic_tail", ""),
              "test_count": len(result["tests"]),
              "result_counts": result["result_counts"],
          }, sort_keys=True))
          if result["status"] != "success":
              raise SystemExit(1)
          PY

