name: _validation-named-tests

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: false
        type: string
        default: ""
      harness_sha:
        required: true
        type: string
      profile:
        required: true
        type: string
      prepare_codex_cli_for_exact_usage_test:
        required: false
        type: boolean
        default: false
      run_ae94_android_helper_tests:
        required: false
        type: boolean
        default: false
      run_ae94_tui_provider_tests:
        required: false
        type: boolean
        default: false
      run_d0_active_wait_test:
        required: false
        type: boolean
        default: false
      run_ac392_android_protocol_test:
        required: false
        type: boolean
        default: false
      run_a89_android_png_fixture_preflight:
        required: false
        type: boolean
        default: false
      request_json:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: validation-named-tests

jobs:
  run:
    name: Run exact named Rust tests
    if: ${{ inputs.run_a89_android_png_fixture_preflight != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "8388608"
      VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
      VALIDATION_BASE_REF: ${{ inputs.base_ref }}
      VALIDATION_EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
      VALIDATION_EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
      VALIDATION_PROFILE: ${{ inputs.profile }}
      RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
    steps:
      - name: Check out trusted workflow helpers
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          path: .workflow-src

      - name: Verify named-test command builder
        if: ${{ inputs.run_ac392_android_protocol_test != true }}
        working-directory: .workflow-src
        shell: bash
        run: python3 .github/scripts/test_run_named_rust_tests.py

      - name: Materialize exact B/T worktrees
        working-directory: .workflow-src
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "${BASE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]; then
            echo "base_ref must be a safe repository ref" >&2
            exit 1
          fi
          if [[ -n "${EXPECTED_BASE_SHA}" && ! "${EXPECTED_BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "base_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "${TARGET_SHA}"
          target_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "${target_sha}" != "${TARGET_SHA}" ]]; then
            echo "target fetch did not resolve to requested target SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "${BASE_REF}"
          base_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ -n "${EXPECTED_BASE_SHA}" && "${base_sha}" != "${EXPECTED_BASE_SHA}" ]]; then
            echo "base fetch does not match requested base SHA" >&2
            exit 1
          fi
          git worktree add --detach "${GITHUB_WORKSPACE}/validation-target" "${target_sha}"
          git worktree add --detach "${GITHUB_WORKSPACE}/validation-base" "${base_sha}"
          {
            echo "MATERIALIZED_TARGET_SHA=${target_sha}"
            echo "MATERIALIZED_BASE_SHA=${base_sha}"
          } >> "${GITHUB_ENV}"

      - name: Verify H/B/T checkout identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VALIDATION_TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "${VALIDATION_EXPECTED_HARNESS_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "harness_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          harness_sha="$(git -C .workflow-src rev-parse HEAD)"
          if [[ "${MATERIALIZED_TARGET_SHA}" != "${VALIDATION_TARGET_SHA}" ]]; then
            echo "target checkout does not match requested target SHA" >&2
            exit 1
          fi
          if [[ "${harness_sha}" != "${VALIDATION_EXPECTED_HARNESS_SHA}" ]]; then
            echo "workflow helper checkout does not match requested harness SHA" >&2
            exit 1
          fi
          if [[ -n "${VALIDATION_EXPECTED_BASE_SHA}" && "${MATERIALIZED_BASE_SHA}" != "${VALIDATION_EXPECTED_BASE_SHA}" ]]; then
            echo "comparison-base checkout does not match requested base SHA" >&2
            exit 1
          fi
          {
            echo "VALIDATION_TARGET_SHA=${MATERIALIZED_TARGET_SHA}"
            echo "VALIDATION_BASE_SHA=${MATERIALIZED_BASE_SHA}"
            echo "VALIDATION_HARNESS_SHA=${harness_sha}"
          } >> "${GITHUB_ENV}"

      - name: Validate fixed ac392 Android package-consumer request
        if: ${{ inputs.run_ac392_android_protocol_test }}
        shell: bash
        env:
          VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
          VALIDATION_BASE_REF: ${{ inputs.base_ref }}
          VALIDATION_PROFILE: ${{ inputs.profile }}
          RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          if [[ "${VALIDATION_TARGET_SHA}" != "ac392c2ef51171dbd5ca5a524ccc8cf060ec1aa1" || "${VALIDATION_BASE_REF}" != "a8778ccc83d615b403e4c01370ff8cb5f47677d0" || "${VALIDATION_PROFILE}" != "rust_integration" ]]; then
            echo "Android package consumer is restricted to the fixed ac392 target and hosted base." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os

          expected = {
              "schema_version": "ac392-android-protocol-v1",
              "profile": "rust_integration",
              "target": "x86_64-unknown-linux-gnu",
              "package_run_id": 38905431732,
              "artifact_id": 12052154895,
              "consumer": "packaged-android-step-install-protocol",
          }
          try:
              request = json.loads(os.environ["RUST_TEST_REQUEST_JSON"])
          except (KeyError, json.JSONDecodeError) as error:
              raise SystemExit("Android package-consumer request is malformed.") from error
          if request != expected:
              raise SystemExit("Android package-consumer request differs from the fixed accepted selector.")
          PY

      - name: Download exact ac392 x86 package artifact
        if: ${{ inputs.run_ac392_android_protocol_test }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "12052154895"
          repository: sednalabs/codex
          run-id: "38905431732"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ac392-x86-package
          digest-mismatch: error

      - name: Verify exact ac392 package identity and archives
        if: ${{ inputs.run_ac392_android_protocol_test }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_DIR: ${{ runner.temp }}/ac392-x86-package
        run: |
          set -euo pipefail
          artifact_metadata="$(gh api repos/sednalabs/codex/actions/artifacts/12052154895)"
          ARTIFACT_METADATA_JSON="${artifact_metadata}" DIST_DIR="${DIST_DIR}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact = json.loads(os.environ["ARTIFACT_METADATA_JSON"])
          expected_artifact = {
              "id": 12052154895,
              "name": "sedna-first-package-ac392c2e-x86_64-38905431732",
              "size_in_bytes": 1199481611,
              "digest": "sha256:9631ba758693eb3065bafff97018b590113e68a86eb35c5f13f77a1220b45912",
              "expired": False,
          }
          for key, expected in expected_artifact.items():
              if artifact.get(key) != expected:
                  raise SystemExit(f"Exact ac392 package artifact metadata mismatch for {key}.")
          producer = artifact.get("workflow_run") or {}
          if producer.get("id") != 38905431732 or producer.get("head_sha") != "ac392c2ef51171dbd5ca5a524ccc8cf060ec1aa1":
              raise SystemExit("Package artifact is not bound to the exact ac392 producer run and source.")

          dist = Path(os.environ["DIST_DIR"])
          expected_files = {
              "SHA256SUMS.txt",
              "codex-app-server-x86_64-unknown-linux-gnu.tar.gz",
              "codex-cli-x86_64-unknown-linux-gnu.tar.gz",
              "codex-responses-api-proxy",
              "release-manifest.json",
              "symbols.tar.gz",
          }
          entries = list(dist.iterdir())
          if any(not path.is_file() for path in entries) or {path.name for path in entries} != expected_files:
              raise SystemExit("Exact ac392 package file set does not match the accepted x86 package.")

          manifest = json.loads((dist / "release-manifest.json").read_text(encoding="utf-8"))
          expected_manifest = {
              "repository": "sednalabs/codex",
              "sourceCommit": "ac392c2ef51171dbd5ca5a524ccc8cf060ec1aa1",
              "sourceTree": "e364120b0782c1424a6d99d1dd0e068d458614be",
              "workflowRunId": "38905431732",
              "target": "x86_64-unknown-linux-gnu",
          }
          for key, expected in expected_manifest.items():
              if manifest.get(key) != expected:
                  raise SystemExit(f"Exact ac392 package manifest mismatch for {key}.")

          listed = {}
          for line in (dist / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split("  ", 1)
              if filename in listed:
                  raise SystemExit("Exact ac392 package checksum list contains a duplicate member.")
              if filename != "release-manifest.json":
                  listed[filename] = digest
          if manifest.get("artifacts") != listed:
              raise SystemExit("Exact ac392 package manifest digests do not match the checksum list.")
          PY
          (cd "${DIST_DIR}" && sha256sum -c SHA256SUMS.txt)
          {
            echo "AC392_PACKAGE_DIR=${DIST_DIR}"
            echo "AC392_CLI_ARCHIVE=${DIST_DIR}/codex-cli-x86_64-unknown-linux-gnu.tar.gz"
            echo "AC392_APPSERVER_ARCHIVE=${DIST_DIR}/codex-app-server-x86_64-unknown-linux-gnu.tar.gz"
            echo "AC392_SYMBOLS_ARCHIVE=${DIST_DIR}/symbols.tar.gz"
          } >> "${GITHUB_ENV}"

      - name: Set up Python package consumer environment
        if: ${{ inputs.run_ac392_android_protocol_test }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned uv for package consumer
        if: ${{ inputs.run_ac392_android_protocol_test }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.3"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bind js_repl Node runtime
        shell: bash
        run: echo "CODEX_JS_REPL_NODE_PATH=$(command -v node)" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Validate the fixed usage integration selector set
        if: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
        shell: bash
        env:
          VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
          VALIDATION_BASE_REF: ${{ inputs.base_ref }}
          VALIDATION_PROFILE: ${{ inputs.profile }}
          RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          if [[ "${VALIDATION_TARGET_SHA}" != "a89b02855334af7c0521882271cb97b818981d1a" || "${VALIDATION_BASE_REF}" != "e135df532669849b682dfac712c3f59aded039ba" || "${VALIDATION_PROFILE}" != "rust_integration" ]]; then
            echo "CLI preparation is restricted to the fixed usage integration target" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os

          expected = {
              "schema_version": "rust-tests-v1",
              "profile": "rust_integration",
              "package": "codex-core",
              "target_kind": "integration",
              "target": "all",
              "tests": [
                  "suite::token_usage_rollout::completed_response_usage_reaches_sqlite_lineage_and_credit_views_after_reopen",
                  "suite::compact::manual_compact_records_durable_and_local_token_usage",
                  "suite::compact_remote::remote_compact_v2_records_usage_before_output_validation",
                  "suite::compact_remote::remote_mid_turn_compact_v2_sends_turn_state_over_http",
              ],
              "execution_mode": "exact",
          }
          request = json.loads(os.environ["RUST_TEST_REQUEST_JSON"])
          if request != expected:
              raise SystemExit("CLI preparation request does not match the fixed exact selector set")
          PY

      - name: Download the exact a89 x86 package artifact
        if: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "12035327373"
          repository: sednalabs/codex
          run-id: "38867176145"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/a89-usage-package
          digest-mismatch: error

      - name: Verify package identity and stage exact binaries
        if: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_DIR: ${{ runner.temp }}/a89-usage-package
          CLI_DIR: ${{ runner.temp }}/a89-usage-cli
        run: |
          set -euo pipefail
          artifact_metadata="$(gh api repos/sednalabs/codex/actions/artifacts/12035327373)"
          ARTIFACT_METADATA_JSON="${artifact_metadata}" python3 - <<'PY'
          import json
          import os

          artifact = json.loads(os.environ["ARTIFACT_METADATA_JSON"])
          expected = {
              "id": 12035327373,
              "name": "sedna-first-package-a89b0285-x86_64-38867176145",
              "size_in_bytes": 1200010231,
              "digest": "sha256:077a704fb9391c17f359af9856f31faf8fb2013defd85813dd556e4560319512",
              "expired": False,
          }
          for key, value in expected.items():
              if artifact.get(key) != value:
                  raise SystemExit(f"Exact package artifact metadata mismatch for {key}.")
          workflow_run = artifact.get("workflow_run") or {}
          if workflow_run.get("id") != 38867176145 or workflow_run.get("head_sha") != "a89b02855334af7c0521882271cb97b818981d1a":
              raise SystemExit("Package artifact is not bound to the exact a89 producer run and source.")
          PY

          (cd "${DIST_DIR}" && sha256sum -c SHA256SUMS.txt)
          DIST_DIR="${DIST_DIR}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          dist = Path(os.environ["DIST_DIR"])
          expected_files = {
              "SHA256SUMS.txt",
              "codex-app-server-x86_64-unknown-linux-gnu.tar.gz",
              "codex-cli-x86_64-unknown-linux-gnu.tar.gz",
              "codex-responses-api-proxy",
              "release-manifest.json",
              "symbols.tar.gz",
          }
          actual_entries = list(dist.iterdir())
          if any(not path.is_file() for path in actual_entries) or {path.name for path in actual_entries} != expected_files:
              raise SystemExit("Exact package artifact file set does not match the expected x86 package.")

          manifest = json.loads((dist / "release-manifest.json").read_text(encoding="utf-8"))
          expected_manifest = {
              "repository": "sednalabs/codex",
              "sourceCommit": "a89b02855334af7c0521882271cb97b818981d1a",
              "sourceTree": "8cd1fcbec6101003dba32e2ee8b115c354678e01",
              "workflowRunId": "38867176145",
              "target": "x86_64-unknown-linux-gnu",
          }
          for key, value in expected_manifest.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Exact package manifest mismatch for {key}.")

          checksum_artifacts = {}
          for line in (dist / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split("  ", 1)
              if filename != "release-manifest.json":
                  checksum_artifacts[filename] = digest
          if manifest.get("artifacts") != checksum_artifacts:
              raise SystemExit("Package manifest digests do not match the checksum file.")
          PY

          mkdir -p "${CLI_DIR}"
          tar -xzf "${DIST_DIR}/codex-cli-x86_64-unknown-linux-gnu.tar.gz" -C "${CLI_DIR}"
          codex_binary="${CLI_DIR}/bin/codex"
          code_mode_host_binary="${CLI_DIR}/bin/codex-code-mode-host"
          if [[ ! -x "${codex_binary}" || ! -x "${code_mode_host_binary}" || ! -d "${CLI_DIR}/codex-resources" || ! -d "${CLI_DIR}/codex-path" ]]; then
            echo "Exact package is missing a required executable or resource directory." >&2
            exit 1
          fi
          printf 'CARGO_BIN_EXE_codex=%s\n' "${codex_binary}" >> "${GITHUB_ENV}"
          printf 'CARGO_BIN_EXE_codex-code-mode-host=%s\n' "${code_mode_host_binary}" >> "${GITHUB_ENV}"

      - name: Install the existing pinned DotSlash runtime for the fixed GNU diagnostic
        if: ${{ inputs.target_sha == 'dd7b5eaa57ed80abb44c9626b8eaa50b1672f0e7' && inputs.profile == 'rust_integration' && fromJSON(inputs.request_json).package == 'codex-core' }}
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Prepare the fixed GNU zsh diagnostic without accepting a fixture skip
        if: ${{ inputs.target_sha == 'dd7b5eaa57ed80abb44c9626b8eaa50b1672f0e7' && inputs.profile == 'rust_integration' && fromJSON(inputs.request_json).package == 'codex-core' }}
        working-directory: validation-target/codex-rs
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          cargo build --locked -p codex-shell-escalation --bin codex-execve-wrapper
          ./app-server/tests/suite/zsh -fc 'builtin print -r -- zsh-dotslash-ready' >/dev/null
          if EXEC_WRAPPER=/usr/bin/false ./app-server/tests/suite/zsh -fc /usr/bin/true >/dev/null 2>&1; then
            echo "zsh EXEC_WRAPPER intercept preflight failed" >&2
            exit 1
          fi

      - name: Inventory and run exact named tests
        id: named_tests
        if: ${{ inputs.run_ae94_android_helper_tests != true && inputs.run_ae94_tui_provider_tests != true && inputs.run_d0_active_wait_test != true && inputs.run_ac392_android_protocol_test != true }}
        continue-on-error: true
        working-directory: validation-target
        shell: bash
        run: |
          set -euo pipefail
          python3 ../.workflow-src/.github/scripts/run_named_rust_tests.py

      - name: Run the fixed ae94 Android helper test set
        id: android_helper_tests
        if: ${{ inputs.run_ae94_android_helper_tests == true }}
        continue-on-error: true
        working-directory: validation-target
        shell: bash
        env:
          VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
          VALIDATION_BASE_REF: ${{ inputs.base_ref }}
          VALIDATION_PROFILE: ${{ inputs.profile }}
          RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          expected_target = "ae94a802f4ca31130c1f1be5d4703c9062b84560"
          expected_base = "e135df532669849b682dfac712c3f59aded039ba"
          expected_profile = "rust_integration"
          expected_tests = [
              "tests::canonical_actions_prefers_actions_array",
              "tests::action_failure_summary_lists_completed_actions_without_payload_echo",
              "tests::mutation_transport_failures_never_recommend_replaying_uncertain_requests",
              "tests::install_build_from_run_gets_extended_provider_timeout",
              "tests::install_args_applies_default_serial",
              "tests::summarize_install_result_keeps_large_provider_payloads_out_of_transcript",
              "tests::tool_result_preserves_images_when_structured_content_exists",
              "tests::tool_result_parses_json_text_without_dropping_mcp_image_content",
              "tests::visual_response_without_native_image_is_failed_loudly",
              "tests::visual_response_without_text_retains_missing_image_diagnostic",
              "tests::append_text_preserves_empty_and_native_image_content",
              "tests::visual_response_with_native_image_remains_successful",
              "tests::multi_touch_args_preserves_the_atomic_provider_contract",
              "tests::multi_touch_args_rejects_invalid_pointer_shapes_and_duration",
          ]
          identity = {
              "harness_sha": os.environ.get("VALIDATION_HARNESS_SHA", ""),
              "base_ref": os.environ.get("VALIDATION_BASE_REF", ""),
              "base_sha": os.environ.get("VALIDATION_BASE_SHA", ""),
              "target_sha": os.environ.get("VALIDATION_TARGET_SHA", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
          }
          request_text = os.environ.get("RUST_TEST_REQUEST_JSON", "")
          result = {
              "schema_version": "rust-tests-v1",
              "status": "failure",
              "failure_code": "",
              "message": "",
              "request_fingerprint": hashlib.sha256(request_text.encode()).hexdigest(),
              "identity": identity,
              "inventory": {"status": "not-run", "tests": []},
              "tests": [],
          }

          def fail(code, message):
              result["failure_code"] = code
              result["message"] = message

          def bounded_tail(value):
              text = str(value or "")
              for variable, replacement in (("GITHUB_WORKSPACE", "<workspace>"), ("HOME", "<runner-home>")):
                  prefix = os.environ.get(variable)
                  if prefix:
                      text = text.replace(prefix, replacement)
              return text[-4096:]

          expected_request = {
              "schema_version": "rust-tests-v1",
              "profile": expected_profile,
              "package": "codex-android-computer-use",
              "target_kind": "lib",
              "target": "",
              "tests": expected_tests,
              "execution_mode": "exact",
          }

          try:
              request = json.loads(request_text)
          except (json.JSONDecodeError, TypeError):
              request = None

          if (
              identity["target_sha"] != expected_target
              or identity["base_ref"] != expected_base
              or identity["base_sha"] != expected_base
              or os.environ.get("VALIDATION_PROFILE") != expected_profile
          ):
              fail("fixed_identity_mismatch", "The Android helper route is restricted to its exact candidate, base, and profile.")
          elif request != expected_request:
              fail("fixed_selector_mismatch", "The Android helper request does not match the fixed 14-test selector set.")
          else:
              inventory = subprocess.run(
                  ["cargo", "test", "--manifest-path", "codex-rs/Cargo.toml", "--locked", "-p", "codex-android-computer-use", "--lib", "--", "--list"],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              observed_inventory = re.findall(r"^(tests::[A-Za-z0-9_:]+): test$", inventory.stdout, re.MULTILINE)
              result["inventory"] = {
                  "status": "success" if inventory.returncode == 0 else "failure",
                  "tests": observed_inventory,
                  "exit_code": inventory.returncode,
              }
              if inventory.returncode != 0:
                  fail("inventory_command_failed", "Cargo could not inventory the fixed Android helper library tests.")
                  result["diagnostics"] = {
                      "stdout_tail": bounded_tail(inventory.stdout),
                      "stderr_tail": bounded_tail(inventory.stderr),
                  }
              elif any(test_name not in observed_inventory for test_name in expected_tests) or len(set(observed_inventory)) != len(observed_inventory):
                  fail("inventory_mismatch", "The candidate Android helper test inventory differs from the fixed accepted set.")
                  result["inventory"]["expected_tests"] = expected_tests
                  result["inventory"]["missing_expected_tests"] = [
                      test_name for test_name in expected_tests if test_name not in observed_inventory
                  ]
              else:
                  test_receipts = []
                  diagnostics = []
                  for expected_test in expected_tests:
                      test_run = subprocess.run(
                          [
                              "cargo", "test", "--manifest-path", "codex-rs/Cargo.toml", "--locked",
                              "-p", "codex-android-computer-use", "--lib", "--",
                              expected_test, "--exact", "--test-threads=1",
                          ],
                          text=True,
                          capture_output=True,
                          check=False,
                      )
                      combined = test_run.stdout + "\n" + test_run.stderr
                      outcomes = re.findall(
                          r"^test (?P<name>tests::[A-Za-z0-9_:]+) \.\.\. (?P<status>ok|FAILED|ignored)$",
                          combined,
                          re.MULTILINE,
                      )
                      summaries = list(re.finditer(
                          r"test result:\s+\w+\.\s+(?P<passed>\d+) passed;\s+(?P<failed>\d+) failed;\s+(?P<ignored>\d+) ignored;\s+(?P<measured>\d+) measured;\s+(?P<filtered>\d+) filtered out",
                          combined,
                      ))
                      counts = None
                      if summaries:
                          match = summaries[-1]
                          counts = {key: int(match.group(key)) for key in ("passed", "failed", "ignored", "measured", "filtered")}
                      passed = (
                          test_run.returncode == 0
                          and outcomes == [(expected_test, "ok")]
                          and counts == {
                              "passed": 1,
                              "failed": 0,
                              "ignored": 0,
                              "measured": 0,
                              "filtered": len(observed_inventory) - 1,
                          }
                      )
                      test_receipts.append({
                          "name": expected_test,
                          "status": "ok" if passed else "failed",
                          "exit_code": test_run.returncode,
                          "counts": counts,
                      })
                      if not passed:
                          diagnostics.append({
                              "name": expected_test,
                              "stdout_tail": bounded_tail(test_run.stdout),
                              "stderr_tail": bounded_tail(test_run.stderr),
                          })
                          if counts is None and test_run.returncode != 0:
                              break

                  result["tests"] = test_receipts
                  result["result_counts"] = {
                      key: sum((receipt["counts"] or {}).get(key, 0) for receipt in test_receipts)
                      for key in ("passed", "failed", "ignored", "measured")
                  }
                  result["result_counts"]["filtered"] = 0
                  if diagnostics:
                      result["diagnostics"] = diagnostics
                  success = (
                      len(test_receipts) == len(expected_tests)
                      and all(receipt["status"] == "ok" for receipt in test_receipts)
                      and result["result_counts"] == {
                          "passed": 14,
                          "failed": 0,
                          "ignored": 0,
                          "measured": 0,
                          "filtered": 0,
                      }
                  )
                  result["execution_complete"] = len(test_receipts) == len(expected_tests)
                  if success:
                      result["status"] = "success"
                      result["message"] = "All fixed Android helper tests passed exactly once."
                  else:
                      fail("test_execution_mismatch", "The fixed Android helper selector did not produce exactly 14 passing tests.")
          Path("rust-tests-v1-results.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "status": result["status"],
              "failure_code": result["failure_code"],
              "inventory_count": len(result["inventory"].get("tests", [])),
              "test_count": len(result["tests"]),
              "result_counts": result.get("result_counts"),
          }, sort_keys=True))
          if result["status"] != "success":
              raise SystemExit(1)
          PY

