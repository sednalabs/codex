name: _validation-named-tests

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: false
        type: string
        default: ""
      harness_sha:
        required: true
        type: string
      profile:
        required: true
        type: string
      request_json:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: validation-named-tests

permissions:
  contents: read

jobs:
  run:
    name: Run exact named Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "8388608"
      VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
      VALIDATION_BASE_REF: ${{ inputs.base_ref }}
      VALIDATION_EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
      VALIDATION_EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
      VALIDATION_PROFILE: ${{ inputs.profile }}
      RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
    steps:
      - name: Check out trusted workflow helpers
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          path: .workflow-src

      - name: Test named-test runner
        working-directory: .workflow-src
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_run_named_rust_tests.py'

      - name: Materialize exact B/T worktrees
        working-directory: .workflow-src
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "${BASE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]; then
            echo "base_ref must be a safe repository ref" >&2
            exit 1
          fi
          if [[ -n "${EXPECTED_BASE_SHA}" && ! "${EXPECTED_BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "base_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "${TARGET_SHA}"
          target_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "${target_sha}" != "${TARGET_SHA}" ]]; then
            echo "target fetch did not resolve to requested target SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "${BASE_REF}"
          base_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ -n "${EXPECTED_BASE_SHA}" && "${base_sha}" != "${EXPECTED_BASE_SHA}" ]]; then
            echo "base fetch does not match requested base SHA" >&2
            exit 1
          fi
          git worktree add --detach "${GITHUB_WORKSPACE}/validation-target" "${target_sha}"
          git worktree add --detach "${GITHUB_WORKSPACE}/validation-base" "${base_sha}"
          {
            echo "MATERIALIZED_TARGET_SHA=${target_sha}"
            echo "MATERIALIZED_BASE_SHA=${base_sha}"
          } >> "${GITHUB_ENV}"

      - name: Verify H/B/T checkout identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VALIDATION_TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "${VALIDATION_EXPECTED_HARNESS_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "harness_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          harness_sha="$(git -C .workflow-src rev-parse HEAD)"
          if [[ "${MATERIALIZED_TARGET_SHA}" != "${VALIDATION_TARGET_SHA}" ]]; then
            echo "target checkout does not match requested target SHA" >&2
            exit 1
          fi
          if [[ "${harness_sha}" != "${VALIDATION_EXPECTED_HARNESS_SHA}" ]]; then
            echo "workflow helper checkout does not match requested harness SHA" >&2
            exit 1
          fi
          if [[ -n "${VALIDATION_EXPECTED_BASE_SHA}" && "${MATERIALIZED_BASE_SHA}" != "${VALIDATION_EXPECTED_BASE_SHA}" ]]; then
            echo "comparison-base checkout does not match requested base SHA" >&2
            exit 1
          fi
          {
            echo "VALIDATION_TARGET_SHA=${MATERIALIZED_TARGET_SHA}"
            echo "VALIDATION_BASE_SHA=${MATERIALIZED_BASE_SHA}"
            echo "VALIDATION_HARNESS_SHA=${harness_sha}"
          } >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bind js_repl Node runtime
        shell: bash
        run: echo "CODEX_JS_REPL_NODE_PATH=$(command -v node)" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Set up remote test env (Docker)
        if: ${{ runner.os == 'Linux' && contains(inputs.request_json, 'suite::unified_exec::unified_exec_runs_under_sandbox') }}
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_TEST_REMOTE_ENV_CONTAINER_NAME="codex-named-tests-${GITHUB_RUN_ID}"
          source "${GITHUB_WORKSPACE}/validation-target/scripts/test-remote-env.sh"
          test_codex_binary="${GITHUB_WORKSPACE}/validation-target/codex-rs/target/debug/codex"
          test_codex_binary_sha="$(sha256sum "${test_codex_binary}" | awk '{print $1}')"
          remote_test_codex_binary_sha="$(docker exec "${CODEX_TEST_REMOTE_ENV_CONTAINER_NAME}" sha256sum /tmp/codex-remote-env/codex | awk '{print $1}')"
          test "${test_codex_binary_sha}" = "${remote_test_codex_binary_sha}"
          printf 'test_codex_binary_sha256=%s\n' "${test_codex_binary_sha}"
          docker exec "${CODEX_TEST_REMOTE_ENV_CONTAINER_NAME}" sh -lc '
            set -eu
            bwrap_path="$(command -v bwrap)"
            bwrap_realpath="$(readlink -f "${bwrap_path}")"
            test -x "${bwrap_realpath}"
            printf "bubblewrap_path=%s\\n" "${bwrap_path}"
            printf "bubblewrap_realpath=%s\\n" "${bwrap_realpath}"
            sha256sum "${bwrap_realpath}"
            "${bwrap_path}" --version
            "${bwrap_path}" --unshare-user --unshare-pid --unshare-ipc --ro-bind / / --proc /proc -- /bin/true
          '
          {
            echo "CODEX_TEST_ENVIRONMENT=${CODEX_TEST_ENVIRONMENT}"
            echo "CODEX_TEST_REMOTE_ENV=${CODEX_TEST_REMOTE_ENV}"
            echo "CODEX_TEST_REMOTE_ENV_CONTAINER_NAME=${CODEX_TEST_REMOTE_ENV_CONTAINER_NAME}"
            echo "CODEX_TEST_REMOTE_EXEC_SERVER_URL=${CODEX_TEST_REMOTE_EXEC_SERVER_URL}"
          } >> "${GITHUB_ENV}"

      - name: Build the stdio test server for core integration tests
        if: ${{ contains(inputs.request_json, '"package":"codex-core"') && contains(inputs.request_json, '"target_kind":"integration"') }}
        working-directory: validation-target/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p codex-rmcp-client --bin test_stdio_server
          echo "CARGO_BIN_EXE_test_stdio_server=${GITHUB_WORKSPACE}/validation-target/codex-rs/target/debug/test_stdio_server" >> "${GITHUB_ENV}"

      - name: Inventory and run exact named tests
        id: named_tests
        continue-on-error: true
        working-directory: validation-target
        shell: bash
        run: |
          set -euo pipefail
          python3 ../.workflow-src/.github/scripts/run_named_rust_tests.py

      - name: Tear down remote test env
        if: ${{ always() && runner.os == 'Linux' && contains(inputs.request_json, 'suite::unified_exec::unified_exec_runs_under_sandbox') }}
        shell: bash
        env:
          TEST_STEP_OUTCOME: ${{ steps.named_tests.outcome }}
        run: |
          set +e
          container_name="codex-named-tests-${GITHUB_RUN_ID}"
          if [[ "${TEST_STEP_OUTCOME}" != "success" ]]; then
            docker logs "${container_name}" || true
          fi
          docker rm -f "${container_name}" >/dev/null 2>&1 || true

      - name: Append named-test evidence
        if: ${{ always() }}
        shell: bash
        env:
          RESULT_PATH: ${{ github.workspace }}/validation-target/rust-tests-v1-results.json
        run: |
          set -euo pipefail
          RESULT_PATH="${RESULT_PATH}" python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RESULT_PATH"])
          if not path.exists():
              print("### Named test evidence\n- No result artifact was produced.")
          else:
              payload = json.loads(path.read_text(encoding="utf-8"))
              identity = payload.get("identity") or {}
              print("### Named test evidence")
              print(f"- Status: `{payload.get('status', 'unknown')}`")
              print(f"- Request fingerprint: `{payload.get('request_fingerprint', '')}`")
              print(f"- Harness SHA: `{identity.get('harness_sha', '')}`")
              print(f"- Base SHA: `{identity.get('base_sha', '')}`")
              print(f"- Candidate SHA: `{identity.get('target_sha', '')}`")
              print(f"- Executed tests: `{len(payload.get('tests') or [])}`")
              if payload.get("failure_code"):
                  print(f"- Failure code: `{payload['failure_code']}`")
          PY

      - name: Upload named-test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: validation-target/rust-tests-v1-results.json
          if-no-files-found: error
          retention-days: 3

      - name: Preserve failed exact-test result
        if: ${{ steps.named_tests.outcome == 'failure' }}
        shell: bash
        run: exit 1
