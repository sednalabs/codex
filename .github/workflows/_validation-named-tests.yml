name: _validation-named-tests

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: false
        type: string
        default: ""
      harness_sha:
        required: true
        type: string
      profile:
        required: true
        type: string
      request_json:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: validation-named-tests
      resolve_sha2_lock_edge:
        required: false
        type: boolean
        default: false
      resolve_libz_sys_advisory:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    name: Run exact named Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "8388608"
      VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
      VALIDATION_BASE_REF: ${{ inputs.base_ref }}
      VALIDATION_EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
      VALIDATION_EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
      VALIDATION_PROFILE: ${{ inputs.profile }}
      RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
    steps:
      - name: Check out trusted workflow helpers
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          path: .workflow-src

      - name: Materialize exact B/T worktrees
        working-directory: .workflow-src
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "${BASE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]; then
            echo "base_ref must be a safe repository ref" >&2
            exit 1
          fi
          if [[ -n "${EXPECTED_BASE_SHA}" && ! "${EXPECTED_BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "base_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "${TARGET_SHA}"
          target_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "${target_sha}" != "${TARGET_SHA}" ]]; then
            echo "target fetch did not resolve to requested target SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "${BASE_REF}"
          base_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ -n "${EXPECTED_BASE_SHA}" && "${base_sha}" != "${EXPECTED_BASE_SHA}" ]]; then
            echo "base fetch does not match requested base SHA" >&2
            exit 1
          fi
          git worktree add --detach "${GITHUB_WORKSPACE}/validation-target" "${target_sha}"
          git worktree add --detach "${GITHUB_WORKSPACE}/validation-base" "${base_sha}"
          {
            echo "MATERIALIZED_TARGET_SHA=${target_sha}"
            echo "MATERIALIZED_BASE_SHA=${base_sha}"
          } >> "${GITHUB_ENV}"

      - name: Verify H/B/T checkout identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VALIDATION_TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "${VALIDATION_EXPECTED_HARNESS_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "harness_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          harness_sha="$(git -C .workflow-src rev-parse HEAD)"
          if [[ "${MATERIALIZED_TARGET_SHA}" != "${VALIDATION_TARGET_SHA}" ]]; then
            echo "target checkout does not match requested target SHA" >&2
            exit 1
          fi
          if [[ "${harness_sha}" != "${VALIDATION_EXPECTED_HARNESS_SHA}" ]]; then
            echo "workflow helper checkout does not match requested harness SHA" >&2
            exit 1
          fi
          if [[ -n "${VALIDATION_EXPECTED_BASE_SHA}" && "${MATERIALIZED_BASE_SHA}" != "${VALIDATION_EXPECTED_BASE_SHA}" ]]; then
            echo "comparison-base checkout does not match requested base SHA" >&2
            exit 1
          fi
          {
            echo "VALIDATION_TARGET_SHA=${MATERIALIZED_TARGET_SHA}"
            echo "VALIDATION_BASE_SHA=${MATERIALIZED_BASE_SHA}"
            echo "VALIDATION_HARNESS_SHA=${harness_sha}"
          } >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bind js_repl Node runtime
        shell: bash
        run: echo "CODEX_JS_REPL_NODE_PATH=$(command -v node)" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Set up Bazel for the exact target lockfile
        if: ${{ inputs.resolve_libz_sys_advisory }}
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1

      - name: Resolve and validate the focused sha2 lock edge
        if: ${{ inputs.resolve_sha2_lock_edge }}
        working-directory: validation-target
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path codex-rs/Cargo.toml --package sha2@0.10.9
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          before_text = subprocess.run(
              ["git", "show", "HEAD:codex-rs/Cargo.lock"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          after_text = Path("codex-rs/Cargo.lock").read_text(encoding="utf-8")
          before = tomllib.loads(before_text)
          after = tomllib.loads(after_text)

          def package_map(lock):
              return {
                  (item["name"], item["version"], item.get("source")): item
                  for item in lock.get("package", [])
              }

          old_packages = package_map(before)
          new_packages = package_map(after)
          if old_packages.keys() != new_packages.keys():
              raise SystemExit("Cargo.lock package identities changed unexpectedly")

          core_key = ("codex-core", "0.0.0", None)
          if core_key not in old_packages:
              raise SystemExit("Cargo.lock does not contain the expected codex-core entry")

          for key, old in old_packages.items():
              new = new_packages[key]
              if key != core_key:
                  if old != new:
                      raise SystemExit(f"unexpected Cargo.lock change in package {key[0]}")
                  continue
              old_dependencies = set(old.get("dependencies", []))
              new_dependencies = set(new.get("dependencies", []))
              added = new_dependencies - old_dependencies
              removed = old_dependencies - new_dependencies
              if removed or len(added) != 1 or not next(iter(added), "").startswith("sha2 "):
                  raise SystemExit(
                      "expected only one new codex-core dependency on sha2 0.10.x"
                  )
              old_without_dependencies = {k: v for k, v in old.items() if k != "dependencies"}
              new_without_dependencies = {k: v for k, v in new.items() if k != "dependencies"}
              if old_without_dependencies != new_without_dependencies:
                  raise SystemExit("unexpected non-dependency codex-core lock change")

          print(f"accepted focused lock edge: {next(iter(added))}")
          PY
          mkdir -p "${RUNNER_TEMP}/sha2-lock"
          git diff --no-ext-diff --binary -- codex-rs/Cargo.lock > "${RUNNER_TEMP}/sha2-lock/codex-core-sha2.lock.patch"
          test -s "${RUNNER_TEMP}/sha2-lock/codex-core-sha2.lock.patch"
          printf 'target_sha=%s\n' "${VALIDATION_TARGET_SHA}" > "${RUNNER_TEMP}/sha2-lock/metadata.txt"
          sha256sum "${RUNNER_TEMP}/sha2-lock/codex-core-sha2.lock.patch" >> "${RUNNER_TEMP}/sha2-lock/metadata.txt"

      - name: Upload focused sha2 lock patch
        if: ${{ inputs.resolve_sha2_lock_edge }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-sha2-lock-${{ github.run_id }}
          path: ${{ runner.temp }}/sha2-lock
          if-no-files-found: error
          retention-days: 3

      - name: Resolve and validate the libz-sys advisory lock update
        if: ${{ inputs.resolve_libz_sys_advisory }}
        working-directory: validation-target
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path codex-rs/Cargo.toml --package libz-sys --precise 1.1.31
          bazel mod deps --lockfile_mode=update
          python3 - <<'PY'
          import copy
          import json
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          def git_text(path):
              return subprocess.run(
                  ["git", "show", f"HEAD:{path}"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout

          before_cargo = tomllib.loads(git_text("codex-rs/Cargo.lock"))
          after_cargo = tomllib.loads(Path("codex-rs/Cargo.lock").read_text(encoding="utf-8"))

          def package_map(lock):
              return {
                  (item["name"], item["version"], item.get("source")): item
                  for item in lock.get("package", [])
              }

          old_packages = package_map(before_cargo)
          new_packages = package_map(after_cargo)
          old_libz = [item for item in old_packages.values() if item["name"] == "libz-sys"]
          new_libz = [item for item in new_packages.values() if item["name"] == "libz-sys"]
          if len(old_libz) != 1 or old_libz[0]["version"] != "1.1.29":
              raise SystemExit("expected exactly one input libz-sys 1.1.29 package")
          if len(new_libz) != 1 or new_libz[0]["version"] != "1.1.31":
              raise SystemExit("Cargo did not resolve exactly one libz-sys 1.1.31 package")
          if old_libz[0].get("source") != new_libz[0].get("source"):
              raise SystemExit("libz-sys registry source changed unexpectedly")
          if not new_libz[0].get("checksum"):
              raise SystemExit("resolved libz-sys package has no registry checksum")

          old_key = (old_libz[0]["name"], old_libz[0]["version"], old_libz[0].get("source"))
          new_key = (new_libz[0]["name"], new_libz[0]["version"], new_libz[0].get("source"))
          if set(old_packages) - {old_key} != set(new_packages) - {new_key}:
              raise SystemExit("unexpected Cargo.lock package identity change")

          def normalized_package(item):
              value = copy.deepcopy(item)
              value["dependencies"] = [
                  dependency.replace("libz-sys 1.1.29", "libz-sys 1.1.31")
                  for dependency in value.get("dependencies", [])
              ]
              return value

          for key in set(old_packages) - {old_key}:
              if normalized_package(old_packages[key]) != normalized_package(new_packages[key]):
                  raise SystemExit(f"unexpected Cargo.lock change outside libz-sys: {key[0]}")
          old_libz_metadata = {k: v for k, v in old_libz[0].items() if k not in {"version", "checksum"}}
          new_libz_metadata = {k: v for k, v in new_libz[0].items() if k not in {"version", "checksum"}}
          if old_libz_metadata != new_libz_metadata:
              raise SystemExit("libz-sys package metadata changed beyond version/checksum")

          before_bazel = json.loads(git_text("MODULE.bazel.lock"))
          after_bazel = json.loads(Path("MODULE.bazel.lock").read_text(encoding="utf-8"))
          crate_key = "@@rules_rs+//rs:extensions.bzl%crate"
          old_crate = before_bazel["facts"][crate_key]
          new_crate = after_bazel["facts"][crate_key]
          old_libz_keys = {key for key in old_crate if key.startswith("libz-sys_")}
          new_libz_keys = {key for key in new_crate if key.startswith("libz-sys_")}
          if "libz-sys_1.1.29" not in old_libz_keys:
              raise SystemExit("Bazel crate facts do not contain input libz-sys 1.1.29")
          expected_new_keys = (old_libz_keys - {"libz-sys_1.1.29"}) | {"libz-sys_1.1.31"}
          if new_libz_keys != expected_new_keys:
              raise SystemExit(f"unexpected Bazel libz-sys crate identities: {old_libz_keys} -> {new_libz_keys}")

          def normalize_crate_facts(facts):
              result = {}
              for key, value in facts.items():
                  normalized_key = key.replace("libz-sys_1.1.29", "libz-sys_1.1.31")
                  normalized_value = value.replace("libz-sys_1.1.29", "libz-sys_1.1.31")
                  if normalized_key in result:
                      raise SystemExit(f"duplicate normalized Bazel crate fact: {normalized_key}")
                  result[normalized_key] = normalized_value
              return result

          if normalize_crate_facts(old_crate) != new_crate:
              raise SystemExit("unexpected Bazel crate facts changed outside the libz-sys version reference")
          old_other_facts = {key: value for key, value in before_bazel["facts"].items() if key != crate_key}
          new_other_facts = {key: value for key, value in after_bazel["facts"].items() if key != crate_key}
          if old_other_facts != new_other_facts:
              raise SystemExit("unrelated Bazel extension facts changed")
          before_bazel.pop("facts")
          after_bazel.pop("facts")
          if before_bazel != after_bazel:
              raise SystemExit("Bazel lock state changed outside the Cargo crate facts")

          changed_paths = subprocess.run(
              ["git", "diff", "--name-only"], check=True, capture_output=True, text=True
          ).stdout.splitlines()
          if set(changed_paths) != {"codex-rs/Cargo.lock", "MODULE.bazel.lock"}:
              raise SystemExit(f"unexpected lock-update paths: {changed_paths}")

          output = Path(os.environ["RUNNER_TEMP"]) / "libz-sys-lock"
          output.mkdir(parents=True, exist_ok=True)
          patch_path = output / "libz-sys-advisory.lock.patch"
          patch_path.write_bytes(subprocess.run(
              ["git", "diff", "--no-ext-diff", "--binary", "--", "codex-rs/Cargo.lock", "MODULE.bazel.lock"],
              check=True,
              capture_output=True,
          ).stdout)
          if not patch_path.stat().st_size:
              raise SystemExit("lock update produced an empty patch")
          metadata = output / "metadata.txt"
          metadata.write_text(
              f"target_sha={os.environ['VALIDATION_TARGET_SHA']}\n"
              "cargo_libz_sys=1.1.29->1.1.31\n"
              "bazel_crate_libz_sys=1.1.29->1.1.31\n",
              encoding="utf-8",
          )
          digest = subprocess.run(
              ["sha256sum", str(patch_path)], check=True, capture_output=True, text=True
          ).stdout
          metadata.write_text(metadata.read_text(encoding="utf-8") + digest, encoding="utf-8")
          print(f"validated two-lock advisory delta: {patch_path.stat().st_size} bytes")
          PY

      - name: Upload libz-sys advisory lock delta
        if: ${{ inputs.resolve_libz_sys_advisory }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-libz-sys-lock-${{ github.run_id }}
          path: ${{ runner.temp }}/libz-sys-lock
          if-no-files-found: error
          retention-days: 3

      - name: Inventory and run exact named tests
        if: ${{ inputs.resolve_sha2_lock_edge != true && inputs.resolve_libz_sys_advisory != true }}
        id: named_tests
        continue-on-error: true
        working-directory: validation-target
        shell: bash
        run: |
          set -euo pipefail
          python3 ../.workflow-src/.github/scripts/run_named_rust_tests.py

      - name: Append named-test evidence
        if: ${{ always() && inputs.resolve_sha2_lock_edge != true && inputs.resolve_libz_sys_advisory != true }}
        shell: bash
        env:
          RESULT_PATH: ${{ github.workspace }}/validation-target/rust-tests-v1-results.json
        run: |
          set -euo pipefail
          RESULT_PATH="${RESULT_PATH}" python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RESULT_PATH"])
          if not path.exists():
              print("### Named test evidence\n- No result artifact was produced.")
          else:
              payload = json.loads(path.read_text(encoding="utf-8"))
              identity = payload.get("identity") or {}
              print("### Named test evidence")
              print(f"- Status: `{payload.get('status', 'unknown')}`")
              print(f"- Request fingerprint: `{payload.get('request_fingerprint', '')}`")
              print(f"- Harness SHA: `{identity.get('harness_sha', '')}`")
              print(f"- Base SHA: `{identity.get('base_sha', '')}`")
              print(f"- Candidate SHA: `{identity.get('target_sha', '')}`")
              print(f"- Executed tests: `{len(payload.get('tests') or [])}`")
              if payload.get("failure_code"):
                  print(f"- Failure code: `{payload['failure_code']}`")
          PY

      - name: Upload named-test evidence
        if: ${{ always() && inputs.resolve_sha2_lock_edge != true && inputs.resolve_libz_sys_advisory != true }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: validation-target/rust-tests-v1-results.json
          if-no-files-found: error
          retention-days: 3

      - name: Preserve failed exact-test result
        if: ${{ inputs.resolve_sha2_lock_edge != true && inputs.resolve_libz_sys_advisory != true && steps.named_tests.outcome == 'failure' }}
        shell: bash
        run: exit 1
