          }

          def fail(code, message):
              result["failure_code"] = code
              result["message"] = message

          ansi_csi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          outcome_re = re.compile(
              r"^test (?P<name>[A-Za-z0-9_:]+) \.\.\. (?P<status>ok|FAILED|ignored)$",
              re.MULTILINE,
          )
          summary_re = re.compile(
              r"test result:\s+\w+\.\s+(?P<passed>\d+) passed;\s+(?P<failed>\d+) failed;\s+(?P<ignored>\d+) ignored;\s+(?P<measured>\d+) measured;\s+(?P<filtered>\d+) filtered out"
          )
          panic_re = re.compile(r"panicked at .*?([^/\\\s]+\.rs):(\d+):(\d+)")

          def bounded_diagnostic(stdout, stderr):
              text = ansi_csi.sub("", (stderr or "") + "\n" + (stdout or ""))
              for key in ("GITHUB_WORKSPACE", "RUNNER_TEMP", "HOME"):
                  value = os.environ.get(key, "")
                  if value:
                      text = text.replace(value, f"<{key.lower()}>")
              text = re.sub(r"/home/runner/work/[^\s:]+", "<runner-path>", text)
              text = re.sub(r"/tmp/[^\s:]+", "<temporary-path>", text)
              text = re.sub(r"https?://[^\s/@:]+:[^\s/@]+@", "https://<redacted>@", text)
              text = re.sub(r"(?i)(authorization:\s*bearer\s+)[^\s]+", r"\1<redacted>", text)
              text = re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})\b", "<redacted-token>", text)
              return text[-4000:].strip()

          if (
              identity["target_sha"] != expected_target
              or identity["base_ref"] != "main"
              or identity["base_sha"] != expected_base
              or os.environ.get("VALIDATION_PROFILE") != expected_profile
          ):
              fail("fixed_identity_mismatch", "The TUI provider route is restricted to its exact target, base, and profile.")
          elif request != expected_request:
              fail("fixed_selector_mismatch", "The TUI provider request does not match the fixed selector set.")
