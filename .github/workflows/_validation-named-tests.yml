          VALIDATION_PROFILE: ${{ inputs.profile }}
          RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          smoke_project="scripts/codex_package/smoke_tests"
          test_path="${smoke_project}/first_binary/test_d0_android_protocol_acceptance.py"
          if [[ -e "${test_path}" ]]; then
            echo "The fixed Android consumer test path unexpectedly exists in the product target." >&2
            exit 1
          fi
          cp ../.workflow-src/.github/scripts/test_d0_android_protocol_acceptance.py "${test_path}"
          uv sync --project "${smoke_project}" --frozen
          log_path="${RUNNER_TEMP}/ac392-android-pytest.log"
          set +e
          uv run --project "${smoke_project}" --frozen --no-sync pytest -q \
            "${test_path}" \
            --compression gzip \
            --package-target "x86_64-unknown-linux-gnu" \
            --cli-archive "${AC392_CLI_ARCHIVE}" \
            --app-server-archive "${AC392_APPSERVER_ARCHIVE}" \
            --symbols-archive "${AC392_SYMBOLS_ARCHIVE}" > "${log_path}" 2>&1
          test_exit=$?
          set -e
          DIAGNOSTIC_PATH="${log_path}" python3 - <<'PY'
          import os
          from pathlib import Path

          text = Path(os.environ["DIAGNOSTIC_PATH"]).read_text(encoding="utf-8", errors="replace")
          for key, replacement in (("GITHUB_WORKSPACE", "<workspace>"), ("RUNNER_TEMP", "<runner-temp>"), ("HOME", "<runner-home>")):
              value = os.environ.get(key, "")
              if value:
                  text = text.replace(value, replacement)
          print(text, end="")
          PY
          RESULT_ENV_TEST_EXIT="${test_exit}" \
          RESULT_ENV_LOG_PATH="${log_path}" \
          RESULT_ENV_PATH="${GITHUB_WORKSPACE}/validation-target/rust-tests-v1-results.json" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          log = Path(os.environ["RESULT_ENV_LOG_PATH"]).read_text(encoding="utf-8", errors="replace")
          passed = sum(int(value) for value in re.findall(r"\b(\d+) passed\b", log))
          failed = sum(int(value) for value in re.findall(r"\b(\d+) failed\b", log))
          skipped = sum(int(value) for value in re.findall(r"\b(\d+) skipped\b", log))
          expected_request = {
              "schema_version": "ac392-android-protocol-v1",
              "profile": "rust_integration",
              "target": "x86_64-unknown-linux-gnu",
            "package_run_id": 38905431732,
            "artifact_id": 12052154895,
              "consumer": "packaged-android-step-install-protocol",
          }
          request = json.loads(os.environ["RUST_TEST_REQUEST_JSON"])
          result = {
              "schema_version": "ac392-android-package-consumer-v1",
              "status": "success" if os.environ["RESULT_ENV_TEST_EXIT"] == "0" and passed == 1 and failed == 0 and skipped == 0 else "failure",
              "failure_code": "" if os.environ["RESULT_ENV_TEST_EXIT"] == "0" and passed == 1 and failed == 0 and skipped == 0 else "consumer_execution_mismatch",
              "identity": {
                  "harness_sha": os.environ["VALIDATION_HARNESS_SHA"],
                  "base_ref": os.environ["VALIDATION_BASE_REF"],
                  "base_sha": os.environ["VALIDATION_BASE_SHA"],
                  "target_sha": os.environ["VALIDATION_TARGET_SHA"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
              },
              "artifact": {
                  "producer_run_id": 38905431732,
                  "artifact_id": 12052154895,
                  "sha256": "9631ba758693eb3065bafff97018b590113e68a86eb35c5f13f77a1220b45912",
                  "target": "x86_64-unknown-linux-gnu",
              },
              "request": request,
              "request_fingerprint": hashlib.sha256(json.dumps(request, sort_keys=True, separators=(",", ":")).encode()).hexdigest(),
              "expected_test_count": 1,
              "tests": [{
                  "name": "test_packaged_android_step_and_install_protocol",
                  "status": "ok" if os.environ["RESULT_ENV_TEST_EXIT"] == "0" and passed == 1 and failed == 0 and skipped == 0 else "failed",
              }],
              "result_counts": {"passed": passed, "failed": failed, "ignored": skipped, "measured": 0},
              "diagnostic_policy": "Synthetic loopback provider only; no device, account, or live provider was contacted.",
          }
          if request != expected_request:
              result["status"] = "failure"
              result["failure_code"] = "request_identity_mismatch"
          Path(os.environ["RESULT_ENV_PATH"]).write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"status": result["status"], "failure_code": result["failure_code"], "tests": result["tests"], "result_counts": result["result_counts"]}, sort_keys=True))
          PY
          result_status="$(python3 -c 'import json; print(json.load(open("rust-tests-v1-results.json"))["status"])')"
          if [[ "${test_exit}" -ne 0 || "${result_status}" != "success" ]]; then
            exit 1
          fi

      - name: Run the exact ac392 Android install-timeout selector
        id: ac392_android_timeout_test
        if: ${{ inputs.run_ac392_android_protocol_test == true && steps.ac392_android_protocol_test.outcome == 'success' }}
        continue-on-error: true
        working-directory: validation-target
        shell: bash
        env:
          VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
          VALIDATION_BASE_REF: ${{ inputs.base_ref }}
          VALIDATION_HARNESS_SHA: ${{ inputs.harness_sha }}
          VALIDATION_PROFILE: ${{ inputs.profile }}
          RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          expected_target = "ac392c2ef51171dbd5ca5a524ccc8cf060ec1aa1"
          expected_base = "a8778ccc83d615b403e4c01370ff8cb5f47677d0"
          expected_profile = "rust_integration"
          package = "codex-android-computer-use"
          test_name = "tests::install_build_from_run_gets_extended_provider_timeout"
          expected_request = {
              "schema_version": "ac392-android-protocol-v1",
              "profile": expected_profile,
              "target": "x86_64-unknown-linux-gnu",
              "package_run_id": 38905431732,
              "artifact_id": 12052154895,
              "consumer": "packaged-android-step-install-protocol",
          }
          try:
              request = json.loads(os.environ.get("RUST_TEST_REQUEST_JSON", ""))
          except (json.JSONDecodeError, TypeError):
              request = None

          identity = {
              "harness_sha": os.environ.get("VALIDATION_HARNESS_SHA", ""),
              "base_ref": os.environ.get("VALIDATION_BASE_REF", ""),
              "base_sha": os.environ.get("VALIDATION_BASE_SHA", ""),
              "target_sha": os.environ.get("VALIDATION_TARGET_SHA", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
          }
          request_fingerprint = hashlib.sha256(
              json.dumps(request, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest() if isinstance(request, dict) else ""
          result = {
              "schema_version": "ac392-android-timeout-test-v1",
              "status": "failure",
              "failure_code": "",
              "identity": identity,
              "package": package,
              "test": test_name,
              "expected_timeout_seconds": 300,
              "request_fingerprint": request_fingerprint,
              "inventory": {"status": "not_run", "test_count": 0, "selected_count": 0},
              "execution": {"status": "not_run", "exit_code": None, "passed": 0, "failed": 0, "ignored": 0, "measured": 0, "filtered": 0},
          }

          def bounded_tail(value):
              text = str(value or "")
              for variable, replacement in (("GITHUB_WORKSPACE", "<workspace>"), ("RUNNER_TEMP", "<runner-temp>"), ("HOME", "<runner-home>")):
                  prefix = os.environ.get(variable, "")
                  if prefix:
                      text = text.replace(prefix, replacement)
              text = re.sub(r"/home/runner/work/[^\s:]+", "<runner-path>", text)
              text = re.sub(r"/tmp/[^\s:]+", "<temporary-path>", text)
              return text[-3000:]

          if (
              identity["target_sha"] != expected_target
              or identity["base_ref"] != expected_base
              or identity["base_sha"] != expected_base
              or os.environ.get("VALIDATION_PROFILE") != expected_profile
              or request != expected_request
          ):
              result["failure_code"] = "fixed_identity_or_request_mismatch"
          else:
              inventory = subprocess.run(
                  ["cargo", "test", "--manifest-path", "codex-rs/Cargo.toml", "--locked", "-p", package, "--lib", "--", "--list"],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              inventory_names = re.findall(r"^(tests::[A-Za-z0-9_:]+): test$", inventory.stdout, re.MULTILINE)
              selected_count = inventory_names.count(test_name)
              result["inventory"] = {
                  "status": "success" if inventory.returncode == 0 and selected_count == 1 and len(set(inventory_names)) == len(inventory_names) else "failure",
                  "test_count": len(inventory_names),
                  "selected_count": selected_count,
                  "exit_code": inventory.returncode,
              }
              if inventory.returncode != 0:
                  result["failure_code"] = "fixed_test_inventory_failed"
                  result["diagnostic_tail"] = bounded_tail(inventory.stderr or inventory.stdout)
              elif selected_count != 1 or len(set(inventory_names)) != len(inventory_names):
                  result["failure_code"] = "fixed_test_inventory_mismatch"
              else:
                  completed = subprocess.run(
                      ["cargo", "test", "--manifest-path", "codex-rs/Cargo.toml", "--locked", "-p", package, "--lib", "--", test_name, "--exact", "--test-threads=1"],
                      text=True,
                      capture_output=True,
                      check=False,
                  )
                  combined = completed.stdout + "\n" + completed.stderr
                  matched = re.findall(r"^test (tests::[A-Za-z0-9_:]+) \.\.\. (ok|FAILED|ignored)$", combined, re.MULTILINE)
                  summaries = list(re.finditer(r"test result:\s+\w+\.\s+(?P<passed>\d+) passed;\s+(?P<failed>\d+) failed;\s+(?P<ignored>\d+) ignored;\s+(?P<measured>\d+) measured;\s+(?P<filtered>\d+) filtered out", combined))
                  counts = None
                  if summaries:
                      summary = summaries[-1]
                      counts = {key: int(summary.group(key)) for key in ("passed", "failed", "ignored", "measured", "filtered")}
                  passed = (
                      completed.returncode == 0
                      and matched == [(test_name, "ok")]
                      and counts == {"passed": 1, "failed": 0, "ignored": 0, "measured": 0, "filtered": len(inventory_names) - 1}
                  )
                  result["execution"] = {
                      "status": "success" if passed else "failure",
                      "exit_code": completed.returncode,
                      **(counts or {"passed": 0, "failed": 0, "ignored": 0, "measured": 0, "filtered": 0}),
                  }
                  if passed:
                      result["status"] = "success"
                      result["failure_code"] = ""
                  else:
                      result["failure_code"] = "exact_test_did_not_pass_once"
                      result["diagnostic_tail"] = bounded_tail(completed.stdout or completed.stderr)

          result_path = Path("android-timeout-selector-results.json")
          result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"status": result["status"], "failure_code": result["failure_code"], "test": result["test"], "inventory": result["inventory"], "execution": result["execution"]}, sort_keys=True))
          if result["status"] != "success":
              raise SystemExit(1)
          PY

      - name: Append named-test evidence
        if: ${{ always() }}
        shell: bash
        env:
          RESULT_PATH: ${{ github.workspace }}/validation-target/rust-tests-v1-results.json
        run: |
          set -euo pipefail
          RESULT_PATH="${RESULT_PATH}" python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RESULT_PATH"])
          if not path.exists():
              print("### Named test evidence\n- No result artifact was produced.")
          else:
              payload = json.loads(path.read_text(encoding="utf-8"))
              identity = payload.get("identity") or {}
              print("### Named test evidence")
              print(f"- Status: `{payload.get('status', 'unknown')}`")
              print(f"- Request fingerprint: `{payload.get('request_fingerprint', '')}`")
              print(f"- Harness SHA: `{identity.get('harness_sha', '')}`")
              print(f"- Base SHA: `{identity.get('base_sha', '')}`")
              print(f"- Candidate SHA: `{identity.get('target_sha', '')}`")
              print(f"- Executed tests: `{len(payload.get('tests') or [])}`")
              if payload.get("failure_code"):
                  print(f"- Failure code: `{payload['failure_code']}`")
          PY

      - name: Upload named-test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: validation-target/rust-tests-v1-results.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload ac392 Android install-timeout test evidence
        if: ${{ always() && inputs.run_ac392_android_protocol_test == true && hashFiles('validation-target/android-timeout-selector-results.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ac392-android-timeout-test-${{ github.run_id }}
          path: validation-target/android-timeout-selector-results.json
          if-no-files-found: error
          retention-days: 3

      - name: Preserve failed exact-test result
        if: ${{ steps.named_tests.outcome == 'failure' || steps.android_helper_tests.outcome == 'failure' || steps.tui_provider_tests.outcome == 'failure' || steps.d0_active_wait_test.outcome == 'failure' || steps.ac392_android_protocol_test.outcome == 'failure' || steps.ac392_android_timeout_test.outcome == 'failure' }}
        shell: bash
        run: exit 1

  a89_android_png_fixture_preflight:
    name: Validate fixed a89 Android PNG fixtures
    if: ${{ inputs.run_a89_android_png_fixture_preflight == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
      VALIDATION_BASE_SHA: ${{ inputs.base_ref }}
      VALIDATION_HARNESS_SHA: ${{ inputs.harness_sha }}
      VALIDATION_PROFILE: ${{ inputs.profile }}
      RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
    steps:
      - name: Check out exact workflow helper source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.harness_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .workflow-src

      - name: Check out exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: validation-target

      - name: Check out exact comparison base
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 1
          persist-credentials: false
          path: validation-base

      - name: Verify fixed target, base, host, and request identity
        shell: bash
        env:
          VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
          VALIDATION_BASE_SHA: ${{ inputs.base_ref }}
          VALIDATION_HARNESS_SHA: ${{ inputs.harness_sha }}
          VALIDATION_PROFILE: ${{ inputs.profile }}
          RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          expected = {
              "schema_version": "a89-android-png-preflight-v1",
              "profile": "rust_integration",
              "target_sha": "a89b02855334af7c0521882271cb97b818981d1a",
              "base_sha": "e135df532669849b682dfac712c3f59aded039ba",
              "consumer": "android-png-fixture-preflight",
          }
          identities = {
              "target_sha": ("validation-target", os.environ["VALIDATION_TARGET_SHA"]),
              "base_sha": ("validation-base", os.environ["VALIDATION_BASE_SHA"]),
              "harness_sha": (".workflow-src", os.environ["VALIDATION_HARNESS_SHA"]),
          }
          for directory, expected_sha in identities.values():
              observed = subprocess.check_output(
                  ["git", "-C", directory, "rev-parse", "HEAD"], text=True
              ).strip()
              if observed != expected_sha:
                  raise SystemExit("Checked-out source identity does not match the requested SHA.")
          if os.environ["VALIDATION_PROFILE"] != expected["profile"]:
              raise SystemExit("Preflight is restricted to the fixed hosted profile.")
          if os.environ["VALIDATION_TARGET_SHA"] != expected["target_sha"]:
              raise SystemExit("Preflight is restricted to the exact a89 candidate.")
          if os.environ["VALIDATION_BASE_SHA"] != expected["base_sha"]:
              raise SystemExit("Preflight is restricted to the exact comparison base.")
          try:
              request = json.loads(os.environ["RUST_TEST_REQUEST_JSON"])
          except (KeyError, json.JSONDecodeError) as error:
              raise SystemExit("PNG preflight request is malformed.") from error
          if request != expected:
              raise SystemExit("PNG preflight request differs from the fixed source selector.")
          PY

      - name: Validate the synthetic and source PNG fixtures
        shell: bash
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          VALIDATION_TARGET_DIR: ${{ github.workspace }}/validation-target
          VALIDATION_HELPER_DIR: ${{ github.workspace }}/.workflow-src
          VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
          VALIDATION_BASE_SHA: ${{ inputs.base_ref }}
          VALIDATION_HARNESS_SHA: ${{ inputs.harness_sha }}
        run: python3 .workflow-src/.github/scripts/preflight_a89_android_png_fixtures.py

      - name: Upload fixed fixture preflight result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: a89-android-png-fixture-preflight-${{ github.run_id }}
          path: android-png-fixture-preflight-results.json
          if-no-files-found: ignore
          retention-days: 3
