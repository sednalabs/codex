          }
          request_text = os.environ.get("RUST_TEST_REQUEST_JSON", "")
          result = {
              "schema_version": "rust-tests-v1",
              "status": "failure",
              "failure_code": "",
              "message": "",
              "request_fingerprint": hashlib.sha256(request_text.encode()).hexdigest(),
              "identity": identity,
              "inventory": {"status": "not-run", "tests": []},
              "tests": [],
          }

          def fail(code, message):
              result["failure_code"] = code
              result["message"] = message

          def bounded_tail(value):
              text = str(value or "")
              for variable, replacement in (("GITHUB_WORKSPACE", "<workspace>"), ("HOME", "<runner-home>")):
                  prefix = os.environ.get(variable)
                  if prefix:
                      text = text.replace(prefix, replacement)
              return text[-4096:]

          expected_request = {
              "schema_version": "rust-tests-v1",
              "profile": expected_profile,
              "package": "codex-android-computer-use",
              "target_kind": "lib",
              "target": "",
              "tests": expected_tests,
              "execution_mode": "exact",
          }

          try:
              request = json.loads(request_text)
          except (json.JSONDecodeError, TypeError):
              request = None

          if (
              identity["target_sha"] != expected_target
              or identity["base_ref"] != expected_base
              or identity["base_sha"] != expected_base
              or os.environ.get("VALIDATION_PROFILE") != expected_profile
          ):
              fail("fixed_identity_mismatch", "The Android helper route is restricted to its exact candidate, base, and profile.")
          elif request != expected_request:
              fail("fixed_selector_mismatch", "The Android helper request does not match the fixed 14-test selector set.")
          else:
              inventory = subprocess.run(
                  ["cargo", "test", "--manifest-path", "codex-rs/Cargo.toml", "--locked", "-p", "codex-android-computer-use", "--lib", "--", "--list"],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              observed_inventory = re.findall(r"^(tests::[A-Za-z0-9_:]+): test$", inventory.stdout, re.MULTILINE)
              result["inventory"] = {
                  "status": "success" if inventory.returncode == 0 else "failure",
                  "tests": observed_inventory,
                  "exit_code": inventory.returncode,
              }
              if inventory.returncode != 0:
                  fail("inventory_command_failed", "Cargo could not inventory the fixed Android helper library tests.")
                  result["diagnostics"] = {
                      "stdout_tail": bounded_tail(inventory.stdout),
                      "stderr_tail": bounded_tail(inventory.stderr),
                  }
              elif any(test_name not in observed_inventory for test_name in expected_tests) or len(set(observed_inventory)) != len(observed_inventory):
                  fail("inventory_mismatch", "The candidate Android helper test inventory differs from the fixed accepted set.")
                  result["inventory"]["expected_tests"] = expected_tests
                  result["inventory"]["missing_expected_tests"] = [
                      test_name for test_name in expected_tests if test_name not in observed_inventory
                  ]
              else:
                  test_receipts = []
                  diagnostics = []
                  for expected_test in expected_tests:
                      test_run = subprocess.run(
                          [
                              "cargo", "test", "--manifest-path", "codex-rs/Cargo.toml", "--locked",
                              "-p", "codex-android-computer-use", "--lib", "--",
                              expected_test, "--exact", "--test-threads=1",
                          ],
                          text=True,
                          capture_output=True,
                          check=False,
                      )
                      combined = test_run.stdout + "\n" + test_run.stderr
                      outcomes = re.findall(
                          r"^test (?P<name>tests::[A-Za-z0-9_:]+) \.\.\. (?P<status>ok|FAILED|ignored)$",
                          combined,
                          re.MULTILINE,
                      )
                      summaries = list(re.finditer(
                          r"test result:\s+\w+\.\s+(?P<passed>\d+) passed;\s+(?P<failed>\d+) failed;\s+(?P<ignored>\d+) ignored;\s+(?P<measured>\d+) measured;\s+(?P<filtered>\d+) filtered out",
                          combined,
                      ))
                      counts = None
                      if summaries:
                          match = summaries[-1]
                          counts = {key: int(match.group(key)) for key in ("passed", "failed", "ignored", "measured", "filtered")}
                      passed = (
                          test_run.returncode == 0
                          and outcomes == [(expected_test, "ok")]
                          and counts == {
                              "passed": 1,
                              "failed": 0,
                              "ignored": 0,
                              "measured": 0,
                              "filtered": len(observed_inventory) - 1,
                          }
                      )
                      test_receipts.append({
                          "name": expected_test,
                          "status": "ok" if passed else "failed",
                          "exit_code": test_run.returncode,
                          "counts": counts,
                      })
                      if not passed:
                          diagnostics.append({
                              "name": expected_test,
                              "stdout_tail": bounded_tail(test_run.stdout),
                              "stderr_tail": bounded_tail(test_run.stderr),
                          })
                          if counts is None and test_run.returncode != 0:
                              break

                  result["tests"] = test_receipts
                  result["result_counts"] = {
                      key: sum((receipt["counts"] or {}).get(key, 0) for receipt in test_receipts)
                      for key in ("passed", "failed", "ignored", "measured")
                  }
                  result["result_counts"]["filtered"] = 0
                  if diagnostics:
                      result["diagnostics"] = diagnostics
                  success = (
                      len(test_receipts) == len(expected_tests)
                      and all(receipt["status"] == "ok" for receipt in test_receipts)
                      and result["result_counts"] == {
                          "passed": 14,
                          "failed": 0,
                          "ignored": 0,
                          "measured": 0,
                          "filtered": 0,
                      }
                  )
                  result["execution_complete"] = len(test_receipts) == len(expected_tests)
                  if success:
                      result["status"] = "success"
                      result["message"] = "All fixed Android helper tests passed exactly once."
                  else:
                      fail("test_execution_mismatch", "The fixed Android helper selector did not produce exactly 14 passing tests.")
          Path("rust-tests-v1-results.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "status": result["status"],
              "failure_code": result["failure_code"],
              "inventory_count": len(result["inventory"].get("tests", [])),
              "test_count": len(result["tests"]),
              "result_counts": result.get("result_counts"),
          }, sort_keys=True))
          if result["status"] != "success":
              raise SystemExit(1)
          PY

