name: _validation-named-tests

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: false
        type: string
        default: ""
      harness_sha:
        required: true
        type: string
      profile:
        required: true
        type: string
      request_json:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: validation-named-tests
      generate_app_server_schema_patch:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    name: Run exact named Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "8388608"
      VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
      VALIDATION_BASE_REF: ${{ inputs.base_ref }}
      VALIDATION_EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
      VALIDATION_EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
      VALIDATION_PROFILE: ${{ inputs.profile }}
      RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
    steps:
      - name: Check out trusted workflow helpers
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          path: .workflow-src

      - name: Materialize exact B/T worktrees
        working-directory: .workflow-src
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "${BASE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]; then
            echo "base_ref must be a safe repository ref" >&2
            exit 1
          fi
          if [[ -n "${EXPECTED_BASE_SHA}" && ! "${EXPECTED_BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "base_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "${TARGET_SHA}"
          target_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "${target_sha}" != "${TARGET_SHA}" ]]; then
            echo "target fetch did not resolve to requested target SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "${BASE_REF}"
          base_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ -n "${EXPECTED_BASE_SHA}" && "${base_sha}" != "${EXPECTED_BASE_SHA}" ]]; then
            echo "base fetch does not match requested base SHA" >&2
            exit 1
          fi
          git worktree add --detach "${GITHUB_WORKSPACE}/validation-target" "${target_sha}"
          git worktree add --detach "${GITHUB_WORKSPACE}/validation-base" "${base_sha}"
          {
            echo "MATERIALIZED_TARGET_SHA=${target_sha}"
            echo "MATERIALIZED_BASE_SHA=${base_sha}"
          } >> "${GITHUB_ENV}"

      - name: Verify H/B/T checkout identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VALIDATION_TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "${VALIDATION_EXPECTED_HARNESS_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "harness_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          harness_sha="$(git -C .workflow-src rev-parse HEAD)"
          if [[ "${MATERIALIZED_TARGET_SHA}" != "${VALIDATION_TARGET_SHA}" ]]; then
            echo "target checkout does not match requested target SHA" >&2
            exit 1
          fi
          if [[ "${harness_sha}" != "${VALIDATION_EXPECTED_HARNESS_SHA}" ]]; then
            echo "workflow helper checkout does not match requested harness SHA" >&2
            exit 1
          fi
          if [[ -n "${VALIDATION_EXPECTED_BASE_SHA}" && "${MATERIALIZED_BASE_SHA}" != "${VALIDATION_EXPECTED_BASE_SHA}" ]]; then
            echo "comparison-base checkout does not match requested base SHA" >&2
            exit 1
          fi
          {
            echo "VALIDATION_TARGET_SHA=${MATERIALIZED_TARGET_SHA}"
            echo "VALIDATION_BASE_SHA=${MATERIALIZED_BASE_SHA}"
            echo "VALIDATION_HARNESS_SHA=${harness_sha}"
          } >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bind js_repl Node runtime
        shell: bash
        run: echo "CODEX_JS_REPL_NODE_PATH=$(command -v node)" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2
        if: ${{ inputs.generate_app_server_schema_patch }}
        with:
          tool: just

      - name: Materialize clean app-server schema generation target
        if: ${{ inputs.generate_app_server_schema_patch }}
        working-directory: .workflow-src
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach \
            "${GITHUB_WORKSPACE}/schema-generation-target" \
            "${MATERIALIZED_TARGET_SHA}"
          actual_sha="$(git -C "${GITHUB_WORKSPACE}/schema-generation-target" rev-parse HEAD)"
          if [[ "${actual_sha}" != "${VALIDATION_TARGET_SHA}" ]]; then
            echo "schema generation checkout does not match requested target SHA" >&2
            exit 1
          fi
          if [[ -n "$(git -C "${GITHUB_WORKSPACE}/schema-generation-target" status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "schema generation checkout must start clean" >&2
            exit 1
          fi

      - name: Generate canonical app-server schema patch
        if: ${{ inputs.generate_app_server_schema_patch }}
        id: app_server_schema
        working-directory: schema-generation-target
        shell: bash
        env:
          PATCH_PATH: ${{ runner.temp }}/app-server-schema.patch
          MANIFEST_PATH: ${{ runner.temp }}/app-server-schema-generation.json
          PATHS_PATH: ${{ runner.temp }}/app-server-schema-paths.txt
        run: |
          set -euo pipefail
          generator_exit=0
          if just write-app-server-schema; then
            generator_exit=0
          else
            generator_exit=$?
          fi

          path_validation_exit=0
          if PATHS_PATH="${PATHS_PATH}" python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          schema_root = "codex-rs/app-server-protocol/schema/"
          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-z", "--untracked-files=all"]
          )
          fields = raw.decode("utf-8", errors="strict").split("\0")
          paths = []
          index = 0
          while index < len(fields):
              field = fields[index]
              index += 1
              if not field:
                  continue
              if len(field) < 4:
                  raise SystemExit(f"malformed git status entry: {field!r}")
              status = field[:2]
              paths.append(field[3:])
              if "R" in status or "C" in status:
                  if index >= len(fields) or not fields[index]:
                      raise SystemExit("malformed rename/copy status entry")
                  paths.append(fields[index])
                  index += 1

          changed_paths = sorted(set(paths))
          outside = [path for path in changed_paths if not path.startswith(schema_root)]
          if outside:
              print("generator changed paths outside the schema root:", file=os.sys.stderr)
              for path in outside:
                  print(path, file=os.sys.stderr)
              raise SystemExit(1)
          Path(os.environ["PATHS_PATH"]).write_text(
              "".join(f"{path}\n" for path in changed_paths), encoding="utf-8"
          )
          PY
          then
            path_validation_exit=0
          else
            path_validation_exit=$?
          fi

          patch_materialization_exit=0
          if [[ "${path_validation_exit}" -eq 0 ]]; then
            if git add -N -- codex-rs/app-server-protocol/schema; then
              if git diff --binary --full-index -- \
                codex-rs/app-server-protocol/schema > "${PATCH_PATH}"
              then
                patch_materialization_exit=0
              else
                patch_materialization_exit=$?
              fi
            else
              patch_materialization_exit=$?
              : > "${PATCH_PATH}"
            fi
          else
            : > "${PATCH_PATH}"
          fi

          patch_sha256="$(sha256sum "${PATCH_PATH}" | awk '{print $1}')"
          patch_bytes="$(wc -c < "${PATCH_PATH}" | tr -d '[:space:]')"
          GENERATOR_EXIT="${generator_exit}" \
          PATH_VALIDATION_EXIT="${path_validation_exit}" \
          PATCH_MATERIALIZATION_EXIT="${patch_materialization_exit}" \
          PATCH_SHA256="${patch_sha256}" \
          PATCH_BYTES="${patch_bytes}" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          paths_path = Path(os.environ["PATHS_PATH"])
          changed_paths = (
              paths_path.read_text(encoding="utf-8").splitlines()
              if paths_path.exists()
              else []
          )
          payload = {
              "schema_version": "app-server-schema-generation-v1",
              "command": ["just", "write-app-server-schema"],
              "workflow_host_sha": os.environ["VALIDATION_HARNESS_SHA"],
              "requested_target_sha": os.environ["VALIDATION_TARGET_SHA"],
              "materialized_target_sha": os.environ["MATERIALIZED_TARGET_SHA"],
              "base_ref": os.environ["VALIDATION_BASE_REF"],
              "base_sha": os.environ["MATERIALIZED_BASE_SHA"],
              "generator_exit_code": int(os.environ["GENERATOR_EXIT"]),
              "path_validation_exit_code": int(os.environ["PATH_VALIDATION_EXIT"]),
              "patch_materialization_exit_code": int(
                  os.environ["PATCH_MATERIALIZATION_EXIT"]
              ),
              "changed_paths": changed_paths,
              "patch_bytes": int(os.environ["PATCH_BYTES"]),
              "patch_sha256": os.environ["PATCH_SHA256"],
          }
          Path(os.environ["MANIFEST_PATH"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          if [[ "${generator_exit}" -ne 0 ]]; then
            echo "just write-app-server-schema failed with exit ${generator_exit}" >&2
            exit "${generator_exit}"
          fi
          if [[ "${path_validation_exit}" -ne 0 ]]; then
            exit "${path_validation_exit}"
          fi
          if [[ "${patch_materialization_exit}" -ne 0 ]]; then
            exit "${patch_materialization_exit}"
          fi

      - name: Verify app-server schema generation evidence
        if: ${{ always() && inputs.generate_app_server_schema_patch }}
        id: app_server_schema_evidence
        shell: bash
        env:
          PATCH_PATH: ${{ runner.temp }}/app-server-schema.patch
          MANIFEST_PATH: ${{ runner.temp }}/app-server-schema-generation.json
        run: |
          set -euo pipefail
          test -f "${PATCH_PATH}"
          test -s "${MANIFEST_PATH}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          patch_path = Path(os.environ["PATCH_PATH"])
          manifest_path = Path(os.environ["MANIFEST_PATH"])
          patch = patch_path.read_bytes()
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          required = {
              "schema_version",
              "command",
              "workflow_host_sha",
              "requested_target_sha",
              "materialized_target_sha",
              "base_ref",
              "base_sha",
              "generator_exit_code",
              "path_validation_exit_code",
              "patch_materialization_exit_code",
              "changed_paths",
              "patch_bytes",
              "patch_sha256",
          }
          missing = sorted(required - manifest.keys())
          if missing:
              raise SystemExit(f"schema evidence manifest missing fields: {missing}")
          if manifest["command"] != ["just", "write-app-server-schema"]:
              raise SystemExit("schema evidence command identity is invalid")
          if manifest["requested_target_sha"] != manifest["materialized_target_sha"]:
              raise SystemExit("schema evidence target identity mismatch")
          if manifest["patch_bytes"] != len(patch):
              raise SystemExit("schema evidence patch byte count mismatch")
          digest = hashlib.sha256(patch).hexdigest()
          if manifest["patch_sha256"] != digest:
              raise SystemExit("schema evidence patch digest mismatch")
          PY

      - name: Upload app-server schema generation evidence
        if: ${{ always() && inputs.generate_app_server_schema_patch && steps.app_server_schema_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-server-schema-generation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/app-server-schema.patch
            ${{ runner.temp }}/app-server-schema-generation.json
          if-no-files-found: error
          retention-days: 3

      - name: Inventory and run exact named tests
        id: named_tests
        continue-on-error: true
        working-directory: validation-target
        shell: bash
        run: |
          set -euo pipefail
          python3 ../.workflow-src/.github/scripts/run_named_rust_tests.py

      - name: Append named-test evidence
        if: ${{ always() }}
        shell: bash
        env:
          RESULT_PATH: ${{ github.workspace }}/validation-target/rust-tests-v1-results.json
        run: |
          set -euo pipefail
          RESULT_PATH="${RESULT_PATH}" python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RESULT_PATH"])
          if not path.exists():
              print("### Named test evidence\n- No result artifact was produced.")
          else:
              payload = json.loads(path.read_text(encoding="utf-8"))
              identity = payload.get("identity") or {}
              print("### Named test evidence")
              print(f"- Status: `{payload.get('status', 'unknown')}`")
              print(f"- Request fingerprint: `{payload.get('request_fingerprint', '')}`")
              print(f"- Harness SHA: `{identity.get('harness_sha', '')}`")
              print(f"- Base SHA: `{identity.get('base_sha', '')}`")
              print(f"- Candidate SHA: `{identity.get('target_sha', '')}`")
              print(f"- Executed tests: `{len(payload.get('tests') or [])}`")
              if payload.get("failure_code"):
                  print(f"- Failure code: `{payload['failure_code']}`")
          PY

      - name: Upload named-test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: validation-target/rust-tests-v1-results.json
          if-no-files-found: error
          retention-days: 3

      - name: Preserve failed exact-test result
        if: ${{ steps.named_tests.outcome == 'failure' }}
        shell: bash
        run: exit 1
