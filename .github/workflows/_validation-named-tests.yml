name: _validation-named-tests

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: false
        type: string
        default: ""
      harness_sha:
        required: true
        type: string
      profile:
        required: true
        type: string
      prepare_codex_cli_for_exact_usage_test:
        required: false
        type: boolean
        default: false
      run_ae94_android_helper_tests:
        required: false
        type: boolean
        default: false
      run_ae94_tui_provider_tests:
        required: false
        type: boolean
        default: false
      run_d0_active_wait_test:
        required: false
        type: boolean
        default: false
      run_ac392_android_protocol_test:
        required: false
        type: boolean
        default: false
      run_a89_android_png_fixture_preflight:
        required: false
        type: boolean
        default: false
      request_json:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: validation-named-tests

jobs:
  run:
    name: Run exact named Rust tests
    if: ${{ inputs.run_a89_android_png_fixture_preflight != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "8388608"
      VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
      VALIDATION_BASE_REF: ${{ inputs.base_ref }}
      VALIDATION_EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
      VALIDATION_EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
      VALIDATION_PROFILE: ${{ inputs.profile }}
      RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
    steps:
      - name: Check out trusted workflow helpers
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          path: .workflow-src

      - name: Classify fixed source-bound request
        id: request_kind
        shell: bash
        env:
          SPECIAL_MODE_SELECTED: ${{ inputs.prepare_codex_cli_for_exact_usage_test || inputs.run_ae94_android_helper_tests || inputs.run_ae94_tui_provider_tests || inputs.run_d0_active_wait_test || inputs.run_ac392_android_protocol_test || inputs.run_a89_android_png_fixture_preflight }}
        run: |
          python3 - <<'PY'
          import json
          import os

          raw = os.environ.get("RUST_TEST_REQUEST_JSON", "")
          try:
              payload = json.loads(raw) if len(raw) <= 65536 else None
          except (ValueError, RecursionError):
              payload = None
          schema_request = (
              isinstance(payload, dict)
              and payload.get("schema_version") == "codex-config-schema-v1"
          )
          usage_report_request = (
              isinstance(payload, dict)
              and payload.get("schema_version") == "usage-report-exact-root-v1"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"schema_generation={str(schema_request).lower()}\n")
              output.write(f"usage_report_synthetic={str(usage_report_request).lower()}\n")
          if schema_request and (
              payload != {"schema_version": "codex-config-schema-v1"}
              or os.environ["VALIDATION_TARGET_SHA"] != "46014d2f9ad7d7cdf8d9c62da99ea9d2ee1e6c9b"
              or os.environ["VALIDATION_PROFILE"] != "rust_minimal"
              or os.environ.get("SPECIAL_MODE_SELECTED") != "false"
          ):
              raise SystemExit("Fixed schema generation request rejected.")
          if usage_report_request and (
              payload != {"schema_version": "usage-report-exact-root-v1"}
              or os.environ["VALIDATION_TARGET_SHA"] != "43dfc7894b59db6992ab7b6f57f36c5d9fd7f39f"
              or os.environ["VALIDATION_BASE_REF"] != "a319e05bad22a5b2870c9bfad3f49ac74dc0bef3"
              or os.environ.get("VALIDATION_EXPECTED_BASE_SHA", "") not in ("", "a319e05bad22a5b2870c9bfad3f49ac74dc0bef3")
              or os.environ["VALIDATION_PROFILE"] != "rust_minimal"
              or os.environ.get("SPECIAL_MODE_SELECTED") != "false"
          ):
              raise SystemExit("Fixed usage-report synthetic request rejected.")
          PY

      - name: Verify named-test command builder
        if: ${{ inputs.run_ac392_android_protocol_test != true && steps.request_kind.outputs.schema_generation != 'true' && steps.request_kind.outputs.usage_report_synthetic != 'true' }}
        working-directory: .workflow-src
        shell: bash
        run: python3 .github/scripts/test_run_named_rust_tests.py

      - name: Materialize exact B/T worktrees
        working-directory: .workflow-src
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "${BASE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]; then
            echo "base_ref must be a safe repository ref" >&2
            exit 1
          fi
          if [[ -n "${EXPECTED_BASE_SHA}" && ! "${EXPECTED_BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "base_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "${TARGET_SHA}"
          target_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "${target_sha}" != "${TARGET_SHA}" ]]; then
            echo "target fetch did not resolve to requested target SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "${BASE_REF}"
          base_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ -n "${EXPECTED_BASE_SHA}" && "${base_sha}" != "${EXPECTED_BASE_SHA}" ]]; then
            echo "base fetch does not match requested base SHA" >&2
            exit 1
          fi
          git worktree add --detach "${GITHUB_WORKSPACE}/validation-target" "${target_sha}"
          git worktree add --detach "${GITHUB_WORKSPACE}/validation-base" "${base_sha}"
          {
            echo "MATERIALIZED_TARGET_SHA=${target_sha}"
            echo "MATERIALIZED_BASE_SHA=${base_sha}"
          } >> "${GITHUB_ENV}"

      - name: Verify H/B/T checkout identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VALIDATION_TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "${VALIDATION_EXPECTED_HARNESS_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "harness_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          harness_sha="$(git -C .workflow-src rev-parse HEAD)"
          if [[ "${MATERIALIZED_TARGET_SHA}" != "${VALIDATION_TARGET_SHA}" ]]; then
            echo "target checkout does not match requested target SHA" >&2
            exit 1
          fi
          if [[ "${harness_sha}" != "${VALIDATION_EXPECTED_HARNESS_SHA}" ]]; then
            echo "workflow helper checkout does not match requested harness SHA" >&2
            exit 1
          fi
          if [[ -n "${VALIDATION_EXPECTED_BASE_SHA}" && "${MATERIALIZED_BASE_SHA}" != "${VALIDATION_EXPECTED_BASE_SHA}" ]]; then
            echo "comparison-base checkout does not match requested base SHA" >&2
            exit 1
          fi
          {
            echo "VALIDATION_TARGET_SHA=${MATERIALIZED_TARGET_SHA}"
            echo "VALIDATION_BASE_SHA=${MATERIALIZED_BASE_SHA}"
            echo "VALIDATION_HARNESS_SHA=${harness_sha}"
          } >> "${GITHUB_ENV}"

      - name: Validate fixed ac392 Android package-consumer request
        if: ${{ inputs.run_ac392_android_protocol_test }}
        shell: bash
        env:
          VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
          VALIDATION_BASE_REF: ${{ inputs.base_ref }}
          VALIDATION_PROFILE: ${{ inputs.profile }}
          RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          if [[ "${VALIDATION_TARGET_SHA}" != "ac392c2ef51171dbd5ca5a524ccc8cf060ec1aa1" || "${VALIDATION_BASE_REF}" != "a8778ccc83d615b403e4c01370ff8cb5f47677d0" || "${VALIDATION_PROFILE}" != "rust_integration" ]]; then
            echo "Android package consumer is restricted to the fixed ac392 target and hosted base." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os

          expected = {
              "schema_version": "ac392-android-protocol-v1",
              "profile": "rust_integration",
              "target": "x86_64-unknown-linux-gnu",
              "package_run_id": 38905431732,
              "artifact_id": 12052154895,
              "consumer": "packaged-android-step-install-protocol",
          }
          try:
              request = json.loads(os.environ["RUST_TEST_REQUEST_JSON"])
          except (KeyError, json.JSONDecodeError) as error:
              raise SystemExit("Android package-consumer request is malformed.") from error
          if request != expected:
              raise SystemExit("Android package-consumer request differs from the fixed accepted selector.")
          PY

      - name: Download exact ac392 x86 package artifact
        if: ${{ inputs.run_ac392_android_protocol_test }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "12052154895"
          repository: sednalabs/codex
          run-id: "38905431732"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ac392-x86-package
          digest-mismatch: error

      - name: Verify exact ac392 package identity and archives
        if: ${{ inputs.run_ac392_android_protocol_test }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_DIR: ${{ runner.temp }}/ac392-x86-package
        run: |
          set -euo pipefail
          artifact_metadata="$(gh api repos/sednalabs/codex/actions/artifacts/12052154895)"
          ARTIFACT_METADATA_JSON="${artifact_metadata}" DIST_DIR="${DIST_DIR}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact = json.loads(os.environ["ARTIFACT_METADATA_JSON"])
          expected_artifact = {
              "id": 12052154895,
              "name": "sedna-first-package-ac392c2e-x86_64-38905431732",
              "size_in_bytes": 1199481611,
              "digest": "sha256:9631ba758693eb3065bafff97018b590113e68a86eb35c5f13f77a1220b45912",
              "expired": False,
          }
          for key, expected in expected_artifact.items():
              if artifact.get(key) != expected:
                  raise SystemExit(f"Exact ac392 package artifact metadata mismatch for {key}.")
          producer = artifact.get("workflow_run") or {}
          if producer.get("id") != 38905431732 or producer.get("head_sha") != "ac392c2ef51171dbd5ca5a524ccc8cf060ec1aa1":
              raise SystemExit("Package artifact is not bound to the exact ac392 producer run and source.")

          dist = Path(os.environ["DIST_DIR"])
          expected_files = {
              "SHA256SUMS.txt",
              "codex-app-server-x86_64-unknown-linux-gnu.tar.gz",
              "codex-cli-x86_64-unknown-linux-gnu.tar.gz",
              "codex-responses-api-proxy",
              "release-manifest.json",
              "symbols.tar.gz",
          }
          entries = list(dist.iterdir())
          if any(not path.is_file() for path in entries) or {path.name for path in entries} != expected_files:
              raise SystemExit("Exact ac392 package file set does not match the accepted x86 package.")

          manifest = json.loads((dist / "release-manifest.json").read_text(encoding="utf-8"))
          expected_manifest = {
              "repository": "sednalabs/codex",
              "sourceCommit": "ac392c2ef51171dbd5ca5a524ccc8cf060ec1aa1",
              "sourceTree": "e364120b0782c1424a6d99d1dd0e068d458614be",
              "workflowRunId": "38905431732",
              "target": "x86_64-unknown-linux-gnu",
          }
          for key, expected in expected_manifest.items():
              if manifest.get(key) != expected:
                  raise SystemExit(f"Exact ac392 package manifest mismatch for {key}.")

          listed = {}
          for line in (dist / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split("  ", 1)
              if filename in listed:
                  raise SystemExit("Exact ac392 package checksum list contains a duplicate member.")
              if filename != "release-manifest.json":
                  listed[filename] = digest
          if manifest.get("artifacts") != listed:
              raise SystemExit("Exact ac392 package manifest digests do not match the checksum list.")
          PY
          (cd "${DIST_DIR}" && sha256sum -c SHA256SUMS.txt)
          {
            echo "AC392_PACKAGE_DIR=${DIST_DIR}"
            echo "AC392_CLI_ARCHIVE=${DIST_DIR}/codex-cli-x86_64-unknown-linux-gnu.tar.gz"
            echo "AC392_APPSERVER_ARCHIVE=${DIST_DIR}/codex-app-server-x86_64-unknown-linux-gnu.tar.gz"
            echo "AC392_SYMBOLS_ARCHIVE=${DIST_DIR}/symbols.tar.gz"
          } >> "${GITHUB_ENV}"

      - name: Set up Python package consumer environment
        if: ${{ inputs.run_ac392_android_protocol_test }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned uv for package consumer
        if: ${{ inputs.run_ac392_android_protocol_test }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.3"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bind js_repl Node runtime
        shell: bash
        run: echo "CODEX_JS_REPL_NODE_PATH=$(command -v node)" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Validate the fixed usage integration selector set
        if: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
        shell: bash
        env:
          VALIDATION_TARGET_SHA: ${{ inputs.target_sha }}
          VALIDATION_BASE_REF: ${{ inputs.base_ref }}
          VALIDATION_PROFILE: ${{ inputs.profile }}
          RUST_TEST_REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          if [[ "${VALIDATION_TARGET_SHA}" != "4ad9c8dcc71d901ba8610c35c11d916ba253f168" || "${VALIDATION_BASE_REF}" != "970a5edd1c2521eb70d7d7264b732ec323552c79" || "${VALIDATION_PROFILE}" != "rust_integration" ]]; then
            echo "CLI preparation is restricted to the fixed usage integration target" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os

          expected = {
              "schema_version": "rust-tests-v1",
              "profile": "rust_integration",
              "package": "codex-core",
              "target_kind": "integration",
              "target": "all",
              "tests": [
                  "suite::token_usage_rollout::completed_response_usage_reaches_sqlite_lineage_and_credit_views_after_reopen",
                  "suite::compact::manual_compact_records_durable_and_local_token_usage",
                  "suite::compact_remote::remote_compact_v2_records_usage_before_output_validation",
                  "suite::compact_remote::remote_mid_turn_compact_v2_sends_turn_state_over_http",
              ],
              "execution_mode": "exact",
          }
          request = json.loads(os.environ["RUST_TEST_REQUEST_JSON"])
          if request != expected:
              raise SystemExit("CLI preparation request does not match the fixed exact selector set")
          PY

      - name: Download the exact 4ad9 x86 package artifact
        if: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "12101887037"
          repository: sednalabs/codex
          run-id: "39027328625"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/4ad9-usage-package
          digest-mismatch: error

      - name: Verify package identity and stage exact binaries
        if: ${{ inputs.prepare_codex_cli_for_exact_usage_test }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_DIR: ${{ runner.temp }}/4ad9-usage-package
          CLI_DIR: ${{ runner.temp }}/4ad9-usage-cli
        run: |
          set -euo pipefail
          artifact_metadata="$(gh api repos/sednalabs/codex/actions/artifacts/12101887037)"
          ARTIFACT_METADATA_JSON="${artifact_metadata}" python3 - <<'PY'
          import json
          import os

          artifact = json.loads(os.environ["ARTIFACT_METADATA_JSON"])
          expected = {
              "id": 12101887037,
              "name": "sedna-first-package-4ad9c8dc-x86_64-39027328625",
              "size_in_bytes": 1202301675,
              "digest": "sha256:1ab29765b18117569e82812b5c54c6c802d51bc4381f358ecbce56484f08b1ec",
              "expired": False,
          }
          for key, value in expected.items():
              if artifact.get(key) != value:
                  raise SystemExit(f"Exact package artifact metadata mismatch for {key}.")
          workflow_run = artifact.get("workflow_run") or {}
          if workflow_run.get("id") != 39027328625 or workflow_run.get("head_sha") != "4ad9c8dcc71d901ba8610c35c11d916ba253f168":
              raise SystemExit("Package artifact is not bound to the exact 4ad9 producer run and source.")
          PY

          (cd "${DIST_DIR}" && sha256sum -c SHA256SUMS.txt)
          DIST_DIR="${DIST_DIR}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          dist = Path(os.environ["DIST_DIR"])
          expected_files = {
              "SHA256SUMS.txt",
              "codex-app-server-x86_64-unknown-linux-gnu.tar.gz",
              "codex-cli-x86_64-unknown-linux-gnu.tar.gz",
              "codex-responses-api-proxy",
              "release-manifest.json",
              "symbols.tar.gz",
          }
          actual_entries = list(dist.iterdir())
          if any(not path.is_file() for path in actual_entries) or {path.name for path in actual_entries} != expected_files:
              raise SystemExit("Exact package artifact file set does not match the expected x86 package.")

          manifest = json.loads((dist / "release-manifest.json").read_text(encoding="utf-8"))
          expected_manifest = {
              "repository": "sednalabs/codex",
              "sourceCommit": "4ad9c8dcc71d901ba8610c35c11d916ba253f168",
              "sourceTree": "fb58ee125d7b86cdbbb125b388dc73e3cc8137db",
              "workflowRunId": "39027328625",
              "target": "x86_64-unknown-linux-gnu",
          }
          for key, value in expected_manifest.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Exact package manifest mismatch for {key}.")

          checksum_artifacts = {}
          for line in (dist / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split("  ", 1)
              if filename != "release-manifest.json":
                  checksum_artifacts[filename] = digest
          if manifest.get("artifacts") != checksum_artifacts:
              raise SystemExit("Package manifest digests do not match the checksum file.")
          PY

          mkdir -p "${CLI_DIR}"
          tar -xzf "${DIST_DIR}/codex-cli-x86_64-unknown-linux-gnu.tar.gz" -C "${CLI_DIR}"
          codex_binary="${CLI_DIR}/bin/codex"
          code_mode_host_binary="${CLI_DIR}/bin/codex-code-mode-host"
          if [[ ! -x "${codex_binary}" || ! -x "${code_mode_host_binary}" || ! -d "${CLI_DIR}/codex-resources" || ! -d "${CLI_DIR}/codex-path" ]]; then
            echo "Exact package is missing a required executable or resource directory." >&2
            exit 1
          fi
          printf 'CARGO_BIN_EXE_codex=%s\n' "${codex_binary}" >> "${GITHUB_ENV}"
          printf 'CARGO_BIN_EXE_codex-code-mode-host=%s\n' "${code_mode_host_binary}" >> "${GITHUB_ENV}"

      - name: Inventory and run exact named tests
        id: named_tests
        if: ${{ inputs.run_ae94_android_helper_tests != true && inputs.run_ae94_tui_provider_tests != true && inputs.run_d0_active_wait_test != true && inputs.run_ac392_android_protocol_test != true && steps.request_kind.outputs.schema_generation != 'true' && steps.request_kind.outputs.usage_report_synthetic != 'true' }}
        continue-on-error: true
        working-directory: validation-target
        shell: bash
        run: |
          set -euo pipefail
          python3 ../.workflow-src/.github/scripts/run_named_rust_tests.py

      - name: Generate complete exact-source config schema
        id: config_schema
        if: ${{ steps.request_kind.outputs.schema_generation == 'true' }}
        working-directory: validation-target
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess

          target = Path.cwd()
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          host = workspace / ".workflow-src"
          base = workspace / "validation-base"
          expected_target = "46014d2f9ad7d7cdf8d9c62da99ea9d2ee1e6c9b"
          expected_base = "43e3a00e105c3675b3e086c7f0d59788b506b8c4"

          def git_value(root, *arguments):
              return subprocess.check_output(
                  ["git", "-C", str(root), *arguments],
                  text=True,
                  stderr=subprocess.DEVNULL,
              ).strip()

          def identity():
              identities = {
                  "harness_sha": git_value(host, "rev-parse", "HEAD"),
                  "harness_tree": git_value(host, "rev-parse", "HEAD^{tree}"),
                  "target_sha": git_value(target, "rev-parse", "HEAD"),
                  "target_tree": git_value(target, "rev-parse", "HEAD^{tree}"),
                  "base_sha": git_value(base, "rev-parse", "HEAD"),
                  "base_tree": git_value(base, "rev-parse", "HEAD^{tree}"),
              }
              if (
                  identities["harness_sha"] != os.environ["VALIDATION_EXPECTED_HARNESS_SHA"]
                  or identities["target_sha"] != expected_target
                  or identities["base_sha"] != expected_base
                  or os.environ["VALIDATION_HARNESS_SHA"] != identities["harness_sha"]
                  or os.environ["VALIDATION_TARGET_SHA"] != expected_target
                  or os.environ["VALIDATION_BASE_SHA"] != expected_base
                  or os.environ["VALIDATION_PROFILE"] != "rust_minimal"
                  or git_value(host, "status", "--porcelain", "--untracked-files=no")
                  or git_value(target, "status", "--porcelain", "--untracked-files=no")
              ):
                  raise ValueError("identity")
              return identities

          try:
              before = identity()
              output_dir = Path(os.environ["RUNNER_TEMP"]) / "codex-config-schema-output"
              output_dir.mkdir(mode=0o700, exist_ok=False)
              schema = output_dir / "config.schema.json"
              completed = subprocess.run(
                  [
                      "cargo", "run", "--locked", "-p", "codex-config-schema",
                      "--bin", "codex-write-config-schema", "--", "--out", str(schema),
                  ],
                  cwd=target / "codex-rs",
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              if completed.returncode != 0:
                  raise ValueError("producer")
              with os.fdopen(os.open(schema, os.O_RDONLY | os.O_NOFOLLOW), "rb") as source:
                  metadata = os.fstat(source.fileno())
                  if not stat.S_ISREG(metadata.st_mode) or not 0 < metadata.st_size <= 4 * 1024 * 1024:
                      raise ValueError("output")
                  content = source.read(4 * 1024 * 1024 + 1)
              if len(content) != metadata.st_size or identity() != before:
                  raise ValueError("output identity")
              receipt = {
                  "schema_version": "codex-config-schema-result-v1",
                  "status": "success",
                  "identity": {
                      **before,
                      "repository": os.environ["GITHUB_REPOSITORY"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                  },
                  "producer": "codex-config-schema/codex-write-config-schema",
                  "output": {
                      "file": "config.schema.json",
                      "bytes": len(content),
                      "sha256": hashlib.sha256(content).hexdigest(),
                  },
              }
