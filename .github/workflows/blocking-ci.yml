name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  # Protected merge-queue entries require this workflow to emit the canonical
  # `CI required` producer on the synthetic queue head. Keep the event narrow
  # so ordinary pushes and pull requests retain their existing behavior.
  merge_group:
    types: [checks_requested]
  pull_request: {}
  push:
    branches: [main, upstream-main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact product candidate commit SHA validated by this dispatch
        required: true
        type: string
      candidate_tree:
        description: Exact product candidate tree SHA validated by this dispatch
        required: true
        type: string
      base_sha:
        description: Exact comparison base commit used by the blob-size policy
        required: true
        type: string

# Queue attempts use generated refs, so scope concurrency to the immutable
# synthetic SHA and never cancel one queue attempt because another was created.
# Pull-request reruns may still supersede an older head; all other event types
# use a unique run fallback.
concurrency:
  group: >-
    concurrency-group::${{ github.workflow }}::${{
      github.event_name == 'merge_group' &&
      format('merge-group-{0}', github.sha) ||
      github.event_name == 'pull_request' &&
      format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'push' &&
      format('push-{0}', github.sha) ||
      format('{0}-{1}', github.event_name, github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    with:
      base_sha: ${{ inputs.base_sha }}
      head_sha: ${{ inputs.candidate_sha }}
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      candidate_tree: ${{ inputs.candidate_tree }}
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same combined revision as the child workflows so
      # the merge gate evaluates the exact candidate they validated.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
