name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  merge_group:
    types: [checks_requested]
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # Classify pull-request and merge-queue paths once for reusable workflows
  # that do not have their own planner. Pushes intentionally run the full
  # scope. Any classifier failure also fails open to full validation rather
  # than silently dropping a lane.
  scope:
    name: Blocking CI scope
    runs-on: ubuntu-24.04
    outputs:
      clippy: ${{ steps.scope.outputs.clippy }}
      cargo_deny: ${{ steps.scope.outputs.cargo_deny }}
      repo_policy: ${{ steps.scope.outputs.repo_policy }}
      repo_package: ${{ steps.scope.outputs.repo_package }}
      repo_format: ${{ steps.scope.outputs.repo_format }}
      repo_readme: ${{ steps.scope.outputs.repo_readme }}
      sdk_python: ${{ steps.scope.outputs.sdk_python }}
      sdk_typescript: ${{ steps.scope.outputs.sdk_typescript }}
    steps:
      - name: Checkout PR head for path classification
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Classify blocking CI scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          set_full_scope() {
            {
              echo "clippy=true"
              echo "cargo_deny=true"
              echo "repo_policy=true"
              echo "repo_package=true"
              echo "repo_format=true"
              echo "repo_readme=true"
              echo "sdk_python=true"
              echo "sdk_typescript=true"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ '${{ github.event_name }}' != 'pull_request' && '${{ github.event_name }}' != 'merge_group' ]]; then
            set_full_scope
            exit 0
          fi

          if ! git fetch --no-tags --depth=1 origin "${BASE_SHA}"; then
            echo "::warning title=CI scope classification::Unable to fetch PR base; running full blocking CI."
            set_full_scope
            exit 0
          fi

          if ! python3 .github/scripts/test_classify_ci_paths.py; then
            echo "::warning title=CI scope classification::Classifier self-tests failed; running full blocking CI."
            set_full_scope
            exit 0
          fi

          if ! plan="$(python3 .github/scripts/classify_ci_paths.py --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}")"; then
            echo "::warning title=CI scope classification::Unable to classify PR paths; running full blocking CI."
            set_full_scope
            exit 0
          fi

          PLAN_JSON="${plan}" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          plan = json.loads(os.environ["PLAN_JSON"])
          for key in (
              "clippy",
              "cargo_deny",
              "repo_policy",
              "repo_package",
              "repo_format",
              "repo_readme",
              "sdk_python",
              "sdk_typescript",
          ):
              print(f"{key}={'true' if plan[key] else 'false'}")
          PY

  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml

  clippy-required:
    name: Linux full Clippy
    needs: scope
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify Clippy scope classification
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_CLIPPY: ${{ needs.scope.outputs.clippy || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SCOPE_RESULT}" == "success" ]] || {
            echo "Blocking CI scope classification did not succeed: ${SCOPE_RESULT}" >&2
            exit 1
          }
          case "${RUN_CLIPPY}" in
            true) echo "Rust-affecting or CI-surface changes require Linux full Clippy." ;;
            false) echo "No Rust-affecting or CI-surface changes; required Clippy lane is intentionally skipped." ;;
            *) echo "Unknown Clippy scope classification: ${RUN_CLIPPY}" >&2; exit 1 ;;
          esac

      - name: Checkout candidate
        if: ${{ needs.scope.outputs.clippy == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare hosted Rust build
        if: ${{ needs.scope.outputs.clippy == 'true' }}
        uses: ./.github/actions/setup-ci

      - name: Install Linux build dependencies
        if: ${{ needs.scope.outputs.clippy == 'true' }}
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Install Rust toolchain
        if: ${{ needs.scope.outputs.clippy == 'true' }}
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          target: x86_64-unknown-linux-gnu
          components: clippy

      - name: Ensure Rust target installed
        if: ${{ needs.scope.outputs.clippy == 'true' }}
        shell: bash
        working-directory: codex-rs
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Configure rusty_v8 artifact overrides and verify checksums
        if: ${{ needs.scope.outputs.clippy == 'true' }}
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: cargo clippy --target x86_64-unknown-linux-gnu --all-features --tests --profile dev -- -D warnings
        if: ${{ needs.scope.outputs.clippy == 'true' }}
        shell: bash
        working-directory: codex-rs
        run: cargo clippy --target x86_64-unknown-linux-gnu --all-features --tests --profile dev -- -D warnings

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - clippy-required
      - repo-checks
      - rust-ci
      - sdk
      - scope
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same combined revision as the child workflows so
      # the merge gate evaluates the exact candidate they validated.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
