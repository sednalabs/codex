name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main/upstream-main so the same check family stays grouped in
# the Actions UI.
on:
  merge_group:
    types: [checks_requested]
  pull_request: {}
  push:
    branches: [main, upstream-main]

# Merge-queue attempts share a generated branch name, so the immutable queue
# SHA must be part of the concurrency key. A retry of one attempt must not
# cancel a newer attempt that happens to use the same generated ref.
concurrency:
  group: >-
    concurrency-group::${{ github.workflow }}::${{
      github.event_name == 'merge_group' &&
      format('merge-group-{0}', github.sha) ||
      github.event_name == 'pull_request' &&
      format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'push' &&
      format('push-{0}', github.sha) ||
      format('{0}-{1}', github.event_name, github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classify PR paths once for reusable workflows that do not have their own
  # planner. Pushes and merge-queue attempts intentionally run the full scope.
  # Any classifier failure also fails open to full validation rather than
  # silently dropping a lane.
  scope:
    name: Blocking CI scope
    runs-on: ubuntu-24.04
    outputs:
      cargo_deny: ${{ steps.scope.outputs.cargo_deny }}
      repo_policy: ${{ steps.scope.outputs.repo_policy }}
      repo_package: ${{ steps.scope.outputs.repo_package }}
      repo_format: ${{ steps.scope.outputs.repo_format }}
      repo_readme: ${{ steps.scope.outputs.repo_readme }}
      sdk_python: ${{ steps.scope.outputs.sdk_python }}
      sdk_typescript: ${{ steps.scope.outputs.sdk_typescript }}
    steps:
      - name: Checkout PR head for path classification
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Classify blocking CI scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          set_full_scope() {
            {
              echo "cargo_deny=true"
              echo "repo_policy=true"
              echo "repo_package=true"
              echo "repo_format=true"
              echo "repo_readme=true"
              echo "sdk_python=true"
              echo "sdk_typescript=true"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ '${{ github.event_name }}' != 'pull_request' ]]; then
            set_full_scope
            exit 0
          fi

          if ! git fetch --no-tags --depth=1 origin "${BASE_SHA}"; then
            echo "::warning title=CI scope classification::Unable to fetch PR base; running full blocking CI."
            set_full_scope
            exit 0
          fi

          if ! python3 .github/scripts/test_classify_ci_paths.py; then
            echo "::warning title=CI scope classification::Classifier self-tests failed; running full blocking CI."
            set_full_scope
            exit 0
          fi

          if ! plan="$(python3 .github/scripts/classify_ci_paths.py --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}")"; then
            echo "::warning title=CI scope classification::Unable to classify PR paths; running full blocking CI."
            set_full_scope
            exit 0
          fi

          PLAN_JSON="${plan}" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          plan = json.loads(os.environ["PLAN_JSON"])
          for key in (
              "cargo_deny",
              "repo_policy",
              "repo_package",
              "repo_format",
              "repo_readme",
              "sdk_python",
              "sdk_typescript",
          ):
              print(f"{key}={'true' if plan[key] else 'false'}")
          PY

  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    needs: scope
    uses: ./.github/workflows/cargo-deny.yml
    with:
      run_cargo_deny: ${{ needs.scope.outputs.cargo_deny == 'true' }}
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    needs: scope
    uses: ./.github/workflows/repo-checks.yml
    with:
      run_policy: ${{ needs.scope.outputs.repo_policy == 'true' }}
      run_package: ${{ needs.scope.outputs.repo_package == 'true' }}
      run_format: ${{ needs.scope.outputs.repo_format == 'true' }}
      run_readme: ${{ needs.scope.outputs.repo_readme == 'true' }}
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    needs: scope
    uses: ./.github/workflows/sdk.yml
    with:
      run_python: ${{ needs.scope.outputs.sdk_python == 'true' }}
      run_typescript: ${{ needs.scope.outputs.sdk_typescript == 'true' }}
    secrets: inherit

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
      - scope
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same revision as the caller and child workflows.
      # CI workflow uploads are restricted, so this repository does not need a
      # separate trusted-base checkout for the terminal policy step. Using the
      # PR head also lets the introducing PR exercise a newly added helper.
      #
      # During the initial rollout, PR branches created before
      # check_ci_results.py exists must rebase onto main before this gate can
      # run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
