name: Runtime lifecycle targeted qualification

on:
  push:
    branches: [validation/runtime-lifecycle-20261030]

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: eba6416d13e9e6292b2fd6e7089d8f76afc244fa
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Test fail-closed lifecycle source
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cargo test --locked -p codex-runtime-proof
