name: Format automatic-turn provenance

on:
  push:
    paths:
      - '.github/auto-turn-format/apply'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: nightly-2025-09-18
          components: rustfmt
      - name: Apply repository Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt -- --config imports_granularity=Item
          cd ..
          allowed='^(codex-rs/core/src/state/service.rs|codex-rs/protocol/src/automatic_turn.rs|codex-rs/protocol/src/lib.rs|codex-rs/state/src/runtime/extension_storage.rs|codex-rs/state/src/runtime/extension_storage/automatic_turns.rs|codex-rs/tui/src/app/thread_routing.rs|codex-rs/tui/src/app_command.rs|codex-rs/tui/src/app_server_session.rs|codex-rs/tui/src/chatwidget/automatic_turn_provenance.rs|codex-rs/tui/src/chatwidget/input_submission.rs|codex-rs/tui/src/chatwidget/tests.rs|codex-rs/tui/src/chatwidget/tests/automatic_turn.rs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'rustfmt touched unexpected files:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'already formatted'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs
          git commit -m 'style: format automatic-turn provenance telemetry'
          git push origin "HEAD:${GITHUB_REF_NAME}"
