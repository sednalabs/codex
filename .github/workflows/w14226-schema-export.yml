name: w14226 schema export (temporary)

on:
  push:
    branches:
      - repair/w14226-agent-action-identity-hosted
  workflow_dispatch:
    inputs:
      ref:
        required: true
        type: string

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Generate app-server schema fixtures
        run: cargo run --manifest-path codex-rs/Cargo.toml -p codex-app-server-protocol --bin write_schema_fixtures
      - name: Upload generated schema fixtures
        uses: actions/upload-artifact@v4
        with:
          name: w14226-generated-schema-fixtures
          path: codex-rs/app-server-protocol/schema
