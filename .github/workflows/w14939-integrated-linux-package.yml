name: w14939 integrated Linux proof and packages

on:
  push:
    branches:
      - codex/w14939-package-validation-970111-20261026

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.arch }} focused proof and package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: x86_64
            binary_kind: x86-64
            loader: /lib64/ld-linux-x86-64.so.2
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: aarch64
            binary_kind: ARM aarch64
            loader: /lib/ld-linux-aarch64.so.1
    env:
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "8388608"
      CODEX_REPO_ROOT: ${{ github.workspace }}
      PRODUCT_SOURCE_SHA: 62e3b1d504425f0359c0b4cafa9bd27e75cc6c66
      STABLE_GIT_COMMIT: 62e3b1d504425f0359c0b4cafa9bd27e75cc6c66
      VALIDATION_HARNESS_SHA: 97a955ba03218ee9afe43dd0a03834dad1b2c0e5
      VALIDATION_PROFILE: rust_integration
      TARGET: ${{ matrix.target }}
      BINARY_KIND: ${{ matrix.binary_kind }}
      LOADER: ${{ matrix.loader }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the exact named-test harness
        uses: actions/checkout@v7
        with:
          repository: sednalabs/codex
          ref: 97a955ba03218ee9afe43dd0a03834dad1b2c0e5
          path: .workflow-src
          fetch-depth: 1
          persist-credentials: false

      - name: Test named-test harness
        working-directory: .workflow-src
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_run_named_rust_tests.py'

      - name: Bind exact source, tree, version, and workflow host
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          workflow_host_sha="${GITHUB_SHA}"
          harness_sha="$(git -C .workflow-src rev-parse HEAD)"
          [[ "${source_sha}" == "${PRODUCT_SOURCE_SHA}" ]] || {
            echo "The product checkout does not match the exact requested source SHA." >&2
            exit 1
          }
          [[ "${harness_sha}" == "${VALIDATION_HARNESS_SHA}" ]] || {
            echo "The named-test harness checkout does not match its exact requested SHA." >&2
            exit 1
          }
          [[ -z "$(git status --porcelain --untracked-files=normal -- . ':(exclude).workflow-src')" ]] || {
            echo "Refusing to validate a dirty source checkout." >&2
            git status --short >&2
            exit 1
          }
          workspace_version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("codex-rs/Cargo.toml").open("rb") as stream:
              print(tomllib.load(stream)["workspace"]["package"]["version"])
          PY
          )"
          [[ "${workspace_version}" == "0.164.0-dev" ]] || {
            echo "Unexpected committed workspace version: ${workspace_version}" >&2
            exit 1
          }
          source_short="${source_sha:0:12}"
          package_version="${workspace_version}.sedna.1+u970111f6.g${source_short}.ci${GITHUB_RUN_NUMBER}"
          {
            echo "source_sha=${source_sha}"
            echo "source_tree=${source_tree}"
            echo "workflow_host_sha=${workflow_host_sha}"
            echo "source_short=${source_short}"
            echo "workspace_version=${workspace_version}"
            echo "package_version=${package_version}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Exact source package identity"
            echo
            echo "- Product source: ${source_sha}"
            echo "- Source tree: ${source_tree}"
            echo "- Workflow host: ${workflow_host_sha}"
            echo "- Named-test harness: ${harness_sha}"
            echo "- Target: ${TARGET}"
            echo "- Workspace version: ${workspace_version}"
            echo "- Package version: ${package_version}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install Linux package build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils pkg-config libcap-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Set up Codex CI tools
        uses: ./.github/actions/setup-ci

      - name: Configure source-matched rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Compile changed Rust consumers and all targets
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --target "${TARGET}" --all-targets \
            -p codex-agent-mailbox \
            -p codex-protocol \
            -p codex-app-server-protocol \
            -p codex-core \
            -p codex-app-server \
            -p codex-tui \
            -p codex-cli

      - name: Build stdio fixture for MCP lifecycle tests
        id: stdio_fixture
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          host_target_dir="$(realpath "${CARGO_TARGET_DIR}/${TARGET}")"
          CARGO_TARGET_DIR="${host_target_dir}" cargo build --locked -p codex-rmcp-client --bin test_stdio_server
          fixture="${host_target_dir}/debug/test_stdio_server"
          [[ -x "${fixture}" ]] || {
            echo "The MCP lifecycle fixture was not produced at the expected host path." >&2
            exit 1
          }
          echo "W14939_TEST_CARGO_TARGET_DIR=${host_target_dir}" >> "${GITHUB_ENV}"
          echo "CARGO_BIN_EXE_test_stdio_server=${fixture}" >> "${GITHUB_ENV}"

      - name: Run exact codex-core library tests
        id: core_lib_tests
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        continue-on-error: true
        env:
          RUST_TEST_REQUEST_JSON: >-
            {"schema_version":"rust-tests-v1","profile":"rust_integration","package":"codex-core","target_kind":"lib","target":"","tests":["session::tests::model_baseline_overlay_reaches_fresh_root_and_child_request_payloads","client::tests::incremental_model_baseline_overlay_preserves_notice_and_history","agent::control::tests::native_send_message_returns_stable_request_id_and_accepts_exact_reply","session::input_queue::tests::quiet_durable_mail_does_not_preempt_but_legacy_and_actionable_mail_do"]}
        shell: bash
        run: |
          set -euo pipefail
          rm -f rust-tests-v1-results.json
          export VALIDATION_TARGET_SHA="${PRODUCT_SOURCE_SHA}"
          export VALIDATION_PROFILE
          export CARGO_TARGET_DIR="${W14939_TEST_CARGO_TARGET_DIR}"
          set +e
          python3 .workflow-src/.github/scripts/run_named_rust_tests.py
          test_status="$?"
          set -e
          result_file="${RUNNER_TEMP}/codex-core-lib-results.json"
          if [[ -f rust-tests-v1-results.json ]]; then
            cp rust-tests-v1-results.json "${result_file}"
          else
            echo "The named-test harness did not produce its result file." >&2
            exit 2
          fi
          printf 'exit_code=%s\n' "${test_status}" >> "${GITHUB_OUTPUT}"
          exit "${test_status}"

      - name: Run exact codex-core MCP integration tests
        id: core_integration_tests
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        continue-on-error: true
        env:
          RUST_TEST_REQUEST_JSON: >-
            {"schema_version":"rust-tests-v1","profile":"rust_integration","package":"codex-core","target_kind":"integration","target":"all","tests":["suite::mcp_refresh_cleanup::refresh_reaps_superseded_mcp_server_after_in_flight_call_finishes","suite::mcp_refresh_cleanup::shutdown_cancels_pending_mcp_startup_while_in_flight_call_finishes"]}
        shell: bash
        run: |
          set -euo pipefail
          rm -f rust-tests-v1-results.json
          export VALIDATION_TARGET_SHA="${PRODUCT_SOURCE_SHA}"
          export VALIDATION_PROFILE
          export CARGO_TARGET_DIR="${W14939_TEST_CARGO_TARGET_DIR}"
          set +e
          python3 .workflow-src/.github/scripts/run_named_rust_tests.py
          test_status="$?"
          set -e
          result_file="${RUNNER_TEMP}/codex-core-integration-results.json"
          if [[ -f rust-tests-v1-results.json ]]; then
            cp rust-tests-v1-results.json "${result_file}"
          else
            echo "The named-test harness did not produce its result file." >&2
            exit 2
          fi
          printf 'exit_code=%s\n' "${test_status}" >> "${GITHUB_OUTPUT}"
          exit "${test_status}"

      - name: Require exact focused test outcomes
        if: ${{ always() && matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ env.PRODUCT_SOURCE_SHA }}
          STDIO_FIXTURE_OUTCOME: ${{ steps.stdio_fixture.outcome }}
          CORE_LIB_RESULTS: ${{ runner.temp }}/codex-core-lib-results.json
          CORE_INTEGRATION_RESULTS: ${{ runner.temp }}/codex-core-integration-results.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_source = os.environ["EXPECTED_SOURCE_SHA"]
          if os.environ["STDIO_FIXTURE_OUTCOME"] != "success":
              print("::error::MCP stdio fixture build did not succeed")
              raise SystemExit(1)
          required = (
              ("codex-core library", Path(os.environ["CORE_LIB_RESULTS"])),
              ("codex-core integration", Path(os.environ["CORE_INTEGRATION_RESULTS"])),
          )
          failures = []
          for label, path in required:
              if not path.is_file():
                  failures.append(f"{label}: result file missing")
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              requested = (payload.get("request") or {}).get("tests") or []
              outcomes = payload.get("tests") or []
              if payload.get("candidate_sha") != expected_source:
                  failures.append(f"{label}: candidate SHA did not match the requested source")
              if payload.get("status") != "success":
                  failures.append(f"{label}: harness status was {payload.get('status')!r}")
              if len(outcomes) != len(requested) or not requested:
                  failures.append(f"{label}: selected test count did not reconcile")
              if [item.get("name") for item in outcomes] != requested:
                  failures.append(f"{label}: outcome names did not match the selected names")
              for item in outcomes:
                  counts = item.get("result_counts") or {}
                  selected = sum(counts.get(key, 0) for key in ("passed", "failed", "ignored", "measured"))
                  if (
                      item.get("status") != "success"
                      or item.get("exit_code") != 0
                      or item.get("execution_reconciled") is not True
                      or item.get("exact_filter") is not True
                      or selected != 1
                      or counts.get("filtered") != item.get("expected_filtered_count")
                  ):
                      failures.append(f"{label}: selected test did not have one exact successful outcome: {item.get('name')}")
              print(f"{label}: {len(outcomes)}/{len(requested)} exact selected outcomes; status={payload.get('status')}")
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)
          PY

      - name: Upload exact focused-test results
        if: ${{ always() && matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: actions/upload-artifact@v7
        with:
          name: codex-w14939-focused-tests-${{ steps.identity.outputs.source_short }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codex-core-lib-results.json
            ${{ runner.temp }}/codex-core-integration-results.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Build and assemble exact CLI package
        working-directory: codex-rs
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.identity.outputs.package_version }}
          SOURCE_TREE: ${{ steps.identity.outputs.source_tree }}
          WORKFLOW_HOST_SHA: ${{ steps.identity.outputs.workflow_host_sha }}
          SOURCE_SHORT: ${{ steps.identity.outputs.source_short }}
          DIST_DIR: ${{ runner.temp }}/w14939-dist
        run: |
          set -euo pipefail
          mkdir -p "${DIST_DIR}"
          cargo build --locked --target "${TARGET}" --release --bin bwrap
          bwrap_path="${CARGO_TARGET_DIR}/${TARGET}/release/bwrap"
          [[ -f "${bwrap_path}" ]]
          just --justfile ../justfile assemble-codex-package \
            --target "${TARGET}" \
            --variant codex \
            --package-version "${PACKAGE_VERSION}" \
            --cargo-profile release \
            --package-dir "${RUNNER_TEMP}/codex-package-${TARGET}" \
            --archive-output "${DIST_DIR}/codex-cli-${TARGET}.tar.gz" \
            --bwrap-bin "${bwrap_path}" \
            --force

          package_dir="${RUNNER_TEMP}/codex-package-${TARGET}"
          manifest_version="$(MANIFEST_PATH="${package_dir}/codex-package.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          print(json.loads(Path(os.environ["MANIFEST_PATH"]).read_text(encoding="utf-8"))["version"])
          PY
          )"
          [[ "${manifest_version}" == "${PACKAGE_VERSION}" ]] || {
            echo "Package manifest version does not match the requested exact version." >&2
            exit 1
          }
          binary_version="$("${package_dir}/bin/codex" --version)"
          printf '%s\n' "${binary_version}"
          [[ "${binary_version}" == *"${manifest_version}"* ]] || {
            echo "Packaged CLI --version does not match codex-package.json." >&2
            exit 1
          }
          "${package_dir}/bin/codex" --help >/dev/null
          file "${package_dir}/bin/codex" | grep -F "${BINARY_KIND}"
          readelf -l "${package_dir}/bin/codex" | grep -F "${LOADER}"

          unpack_dir="${RUNNER_TEMP}/codex-package-consume-${TARGET}"
          mkdir -p "${unpack_dir}"
          tar -xzf "${DIST_DIR}/codex-cli-${TARGET}.tar.gz" -C "${unpack_dir}"
          cmp "${package_dir}/codex-package.json" "${unpack_dir}/codex-package.json"
          archive_version="$("${unpack_dir}/bin/codex" --version)"
          [[ "${archive_version}" == *"${manifest_version}"* ]] || {
            echo "Downloaded archive CLI --version does not match its manifest." >&2
            exit 1
          }
          sha256sum "${DIST_DIR}/codex-cli-${TARGET}.tar.gz" > "${DIST_DIR}/codex-cli-${TARGET}.tar.gz.sha256"

          python3 - <<'PY' > "${DIST_DIR}/PROVENANCE.txt"
          import os

          print("Codex integrated Linux progressive package")
          print(f"Product source commit: {os.environ['PRODUCT_SOURCE_SHA']}")
          print(f"Product source tree: {os.environ['SOURCE_TREE']}")
          print(f"Workflow host commit: {os.environ['WORKFLOW_HOST_SHA']}")
          print(f"Target: {os.environ['TARGET']}")
          print(f"Package version: {os.environ['PACKAGE_VERSION']}")
          print("Version basis: committed 0.164.0-dev workspace identity plus a local development package suffix.")
          print("Validation: changed-consumer all-target compile on both architectures; focused mailbox, MCP lifecycle, and overlay tests on x86_64.")
          print("Scope: progressive source package; not protected-main landing or live-consumer acceptance.")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: codex-w14939-integrated-${{ matrix.arch }}-${{ steps.identity.outputs.source_short }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/w14939-dist/codex-cli-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/w14939-dist/codex-cli-${{ matrix.target }}.tar.gz.sha256
            ${{ runner.temp }}/w14939-dist/PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30
