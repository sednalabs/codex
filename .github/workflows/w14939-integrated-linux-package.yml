name: w14939 integrated Linux proof and packages

on:
  push:
    branches:
      - codex/w14939-package-validation-970111-20261026

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.arch }} focused proof and package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: x86_64
            binary_kind: x86-64
            loader: /lib64/ld-linux-x86-64.so.2
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: aarch64
            binary_kind: ARM aarch64
            loader: /lib/ld-linux-aarch64.so.1
    env:
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "8388608"
      CODEX_REPO_ROOT: ${{ github.workspace }}
      PRODUCT_SOURCE_SHA: 67042e2c4dc2bf725a4914e0bedb0af85b27f0ee
      STABLE_GIT_COMMIT: 67042e2c4dc2bf725a4914e0bedb0af85b27f0ee
      TARGET: ${{ matrix.target }}
      BINARY_KIND: ${{ matrix.binary_kind }}
      LOADER: ${{ matrix.loader }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source, tree, version, and workflow host
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          workflow_host_sha="${GITHUB_SHA}"
          [[ "${source_sha}" == "${PRODUCT_SOURCE_SHA}" ]] || {
            echo "The product checkout does not match the exact requested source SHA." >&2
            exit 1
          }
          [[ -z "$(git status --porcelain --untracked-files=normal)" ]] || {
            echo "Refusing to validate a dirty source checkout." >&2
            git status --short >&2
            exit 1
          }
          workspace_version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("codex-rs/Cargo.toml").open("rb") as stream:
              print(tomllib.load(stream)["workspace"]["package"]["version"])
          PY
          )"
          [[ "${workspace_version}" == "0.164.0-dev" ]] || {
            echo "Unexpected committed workspace version: ${workspace_version}" >&2
            exit 1
          }
          source_short="${source_sha:0:12}"
          package_version="${workspace_version}.sedna.1+u970111f6.g${source_short}.ci${GITHUB_RUN_NUMBER}"
          {
            echo "source_sha=${source_sha}"
            echo "source_tree=${source_tree}"
            echo "workflow_host_sha=${workflow_host_sha}"
            echo "source_short=${source_short}"
            echo "workspace_version=${workspace_version}"
            echo "package_version=${package_version}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Exact source package identity"
            echo
            echo "- Product source: ${source_sha}"
            echo "- Source tree: ${source_tree}"
            echo "- Workflow host: ${workflow_host_sha}"
            echo "- Target: ${TARGET}"
            echo "- Workspace version: ${workspace_version}"
            echo "- Package version: ${package_version}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install Linux package build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils pkg-config libcap-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Set up Codex CI tools
        uses: ./.github/actions/setup-ci

      - name: Configure source-matched rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Compile changed Rust consumers and all targets
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --target "${TARGET}" --all-targets \
            -p codex-agent-mailbox \
            -p codex-protocol \
            -p codex-app-server-protocol \
            -p codex-core \
            -p codex-app-server \
            -p codex-tui \
            -p codex-cli

      - name: Run focused mailbox, MCP lifecycle, and overlay tests
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          failure_count=0
          test_index=0

          run_filtered_test() {
            local package="$1"
            local target_kind="$2"
            local filter="$3"
            local log_file="${RUNNER_TEMP}/focused-test-${test_index}-${filter//[^A-Za-z0-9_-]/_}.log"
            local -a cmd=(cargo test --locked --target "${TARGET}" -p "${package}")
            local status
            local count
            test_index=$((test_index + 1))
            if [[ "${target_kind}" == "lib" ]]; then
              cmd+=(--lib)
            else
              cmd+=(--test all)
            fi
            cmd+=("${filter}" -- --format=terse)

            set +e
            "${cmd[@]}" 2>&1 | tee "${log_file}"
            status="${PIPESTATUS[0]}"
            set -e

            count="$(grep -Ec '^test .* \.\.\. (ok|FAILED)$' "${log_file}" || true)"
            if [[ "${status}" != "0" || "${count}" != "1" ]] || ! grep -Fq "${filter} ... ok" "${log_file}"; then
              echo "Focused test did not pass exactly once: package=${package} target=${target_kind} filter=${filter} exit=${status} matches=${count}" >&2
              failure_count=$((failure_count + 1))
            else
              echo "Focused test passed: ${filter}"
            fi
          }

          set +e
          cargo test --locked --target "${TARGET}" -p codex-agent-mailbox --lib -- --format=terse 2>&1 | tee "${RUNNER_TEMP}/agent-mailbox-tests.log"
          mailbox_status="${PIPESTATUS[0]}"
          set -e
          if [[ "${mailbox_status}" != "0" ]] || ! grep -Eq 'test result: ok\. [1-9][0-9]* passed' "${RUNNER_TEMP}/agent-mailbox-tests.log"; then
            echo "The durable mailbox library test suite failed or ran no tests." >&2
            failure_count=$((failure_count + 1))
          fi

          run_filtered_test codex-core lib model_baseline_overlay_reaches_fresh_root_and_child_request_payloads
          run_filtered_test codex-core lib incremental_model_baseline_overlay_preserves_notice_and_history
          run_filtered_test codex-core lib native_send_message_returns_stable_request_id_and_accepts_exact_reply
          run_filtered_test codex-core lib quiet_durable_mail_does_not_preempt_but_legacy_and_actionable_mail_do
          run_filtered_test codex-core all refresh_reaps_superseded_mcp_server_after_in_flight_call_finishes
          run_filtered_test codex-core all shutdown_cancels_pending_mcp_startup_while_in_flight_call_finishes

          if [[ "${failure_count}" != "0" ]]; then
            echo "${failure_count} focused test group(s) failed; all selected cases were attempted." >&2
            exit 1
          fi

      - name: Build and assemble exact CLI package
        working-directory: codex-rs
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.identity.outputs.package_version }}
          SOURCE_TREE: ${{ steps.identity.outputs.source_tree }}
          WORKFLOW_HOST_SHA: ${{ steps.identity.outputs.workflow_host_sha }}
          SOURCE_SHORT: ${{ steps.identity.outputs.source_short }}
          DIST_DIR: ${{ runner.temp }}/w14939-dist
        run: |
          set -euo pipefail
          mkdir -p "${DIST_DIR}"
          cargo build --locked --target "${TARGET}" --release --bin bwrap
          bwrap_path="${CARGO_TARGET_DIR}/${TARGET}/release/bwrap"
          [[ -f "${bwrap_path}" ]]
          just --justfile ../justfile assemble-codex-package \
            --target "${TARGET}" \
            --variant codex \
            --package-version "${PACKAGE_VERSION}" \
            --cargo-profile release \
            --package-dir "${RUNNER_TEMP}/codex-package-${TARGET}" \
            --archive-output "${DIST_DIR}/codex-cli-${TARGET}.tar.gz" \
            --bwrap-bin "${bwrap_path}" \
            --force

          package_dir="${RUNNER_TEMP}/codex-package-${TARGET}"
          manifest_version="$(MANIFEST_PATH="${package_dir}/codex-package.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          print(json.loads(Path(os.environ["MANIFEST_PATH"]).read_text(encoding="utf-8"))["version"])
          PY
          )"
          [[ "${manifest_version}" == "${PACKAGE_VERSION}" ]] || {
            echo "Package manifest version does not match the requested exact version." >&2
            exit 1
          }
          binary_version="$("${package_dir}/bin/codex" --version)"
          printf '%s\n' "${binary_version}"
          [[ "${binary_version}" == *"${manifest_version}"* ]] || {
            echo "Packaged CLI --version does not match codex-package.json." >&2
            exit 1
          }
          "${package_dir}/bin/codex" --help >/dev/null
          file "${package_dir}/bin/codex" | grep -F "${BINARY_KIND}"
          readelf -l "${package_dir}/bin/codex" | grep -F "${LOADER}"

          unpack_dir="${RUNNER_TEMP}/codex-package-consume-${TARGET}"
          mkdir -p "${unpack_dir}"
          tar -xzf "${DIST_DIR}/codex-cli-${TARGET}.tar.gz" -C "${unpack_dir}"
          cmp "${package_dir}/codex-package.json" "${unpack_dir}/codex-package.json"
          archive_version="$("${unpack_dir}/bin/codex" --version)"
          [[ "${archive_version}" == *"${manifest_version}"* ]] || {
            echo "Downloaded archive CLI --version does not match its manifest." >&2
            exit 1
          }
          sha256sum "${DIST_DIR}/codex-cli-${TARGET}.tar.gz" > "${DIST_DIR}/codex-cli-${TARGET}.tar.gz.sha256"

          python3 - <<'PY' > "${DIST_DIR}/PROVENANCE.txt"
          import os

          print("Codex integrated Linux progressive package")
          print(f"Product source commit: {os.environ['PRODUCT_SOURCE_SHA']}")
          print(f"Product source tree: {os.environ['SOURCE_TREE']}")
          print(f"Workflow host commit: {os.environ['WORKFLOW_HOST_SHA']}")
          print(f"Target: {os.environ['TARGET']}")
          print(f"Package version: {os.environ['PACKAGE_VERSION']}")
          print("Version basis: committed 0.164.0-dev workspace identity plus a local development package suffix.")
          print("Validation: changed-consumer all-target compile on both architectures; focused mailbox, MCP lifecycle, and overlay tests on x86_64.")
          print("Scope: progressive source package; not protected-main landing or live-consumer acceptance.")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: codex-w14939-integrated-${{ matrix.arch }}-${{ steps.identity.outputs.source_short }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/w14939-dist/codex-cli-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/w14939-dist/codex-cli-${{ matrix.target }}.tar.gz.sha256
            ${{ runner.temp }}/w14939-dist/PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30
