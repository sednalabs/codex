name: w14939 integrated Linux package

on:
  push:
    branches:
      - codex/w14939-integrated-linux-package-20261025

concurrency:
  group: w14939-integrated-linux-package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }} focused proof and package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}/product-source

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact product source and workflow host
        id: identity
        shell: bash
        env:
          PRODUCT_SHA: 3fe3424553e801d24d50a9242c710d3faeef5a32
          PRODUCT_TREE: ee20c450e1796500e49396fc3db096a75c222fd6
          UPSTREAM_SHA: 970111f6cb62cc02fe36a82ea7d71b37a2889c97
          EXPECTED_REF: refs/heads/codex/w14939-integrated-linux-package-20261025
        run: |
          set -euo pipefail
          assert_equal() {
            local label="$1" expected="$2" actual="$3"
            if [[ "${expected}" != "${actual}" ]]; then
              printf 'identity mismatch (%s): expected <%s>, got <%s>\n' \
                "${label}" "${expected}" "${actual}" >&2
              exit 1
            fi
          }
          assert_equal "workflow ref" "${EXPECTED_REF}" "${GITHUB_REF}"
          git fetch --no-tags --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${PRODUCT_SHA}"
          source_dir="${GITHUB_WORKSPACE}/product-source"
          [[ ! -e "${source_dir}" ]] || {
            echo "Exact product source directory already exists; refusing ambiguous checkout." >&2
            exit 1
          }
          git worktree add --detach "${source_dir}" "${PRODUCT_SHA}"
          source_sha="$(git -C "${source_dir}" rev-parse HEAD)"
          source_tree="$(git -C "${source_dir}" rev-parse 'HEAD^{tree}')"
          assert_equal "checked-out source commit" "${PRODUCT_SHA}" "${source_sha}"
          assert_equal "checked-out source tree" "${PRODUCT_TREE}" "${source_tree}"
          dirty_paths="$(git -C "${source_dir}" status --porcelain --untracked-files=normal)"
          assert_equal "checked-out source status" "" "${dirty_paths}"

          {
            printf 'product_sha=%s\n' "${source_sha}"
            printf 'product_tree=%s\n' "${source_tree}"
            printf 'product_short=%s\n' "${source_sha:0:12}"
            printf 'upstream_sha=%s\n' "${UPSTREAM_SHA}"
            printf 'workflow_host_sha=%s\n' "${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Linux package build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils pkg-config libcap-dev

      - name: Set up Codex CI tools
        uses: ./product-source/.github/actions/setup-ci

      - name: Bind build commands to exact product source
        shell: bash
        run: printf 'CODEX_REPO_ROOT=%s\n' "${GITHUB_WORKSPACE}/product-source" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Configure source-matched rusty_v8 artifacts
        uses: ./product-source/.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Run accepted usage-tree adapter tests
        shell: bash
        working-directory: product-source
        run: python3 scripts/test_codex_usage_tree.py

      - name: Compile changed Rust consumers and test targets
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        working-directory: product-source
        env:
          TARGET: ${{ matrix.target }}
          STABLE_GIT_COMMIT: ${{ steps.identity.outputs.product_sha }}
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path codex-rs/Cargo.toml --target "${TARGET}" \
            --all-targets -p codex-tui -p codex-cli -p codex-app-server

      - name: Build and fingerprint the packaged bwrap resource
        shell: bash
        working-directory: product-source
        env:
          TARGET: ${{ matrix.target }}
          STABLE_GIT_COMMIT: ${{ steps.identity.outputs.product_sha }}
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path codex-rs/Cargo.toml --target "${TARGET}" \
            --release --bin bwrap
          bwrap_path="${CARGO_TARGET_DIR}/${TARGET}/release/bwrap"
          [[ -f "${bwrap_path}" ]]
          strip --strip-debug --strip-unneeded "${bwrap_path}"
          digest="$(sha256sum "${bwrap_path}" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "${GITHUB_ENV}"

      - name: Compile packaged CLI consumers before assembly
        shell: bash
        working-directory: product-source
        env:
          TARGET: ${{ matrix.target }}
          STABLE_GIT_COMMIT: ${{ steps.identity.outputs.product_sha }}
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path codex-rs/Cargo.toml --target "${TARGET}" \
            --profile release --bin codex --bin codex-code-mode-host

      - name: Assemble and verify the integrated CLI package
        shell: bash
        working-directory: product-source
        env:
          TARGET: ${{ matrix.target }}
          PRODUCT_SHA: ${{ steps.identity.outputs.product_sha }}
          PRODUCT_TREE: ${{ steps.identity.outputs.product_tree }}
          PRODUCT_SHORT: ${{ steps.identity.outputs.product_short }}
          UPSTREAM_SHA: ${{ steps.identity.outputs.upstream_sha }}
          WORKFLOW_HOST_SHA: ${{ steps.identity.outputs.workflow_host_sha }}
          STABLE_GIT_COMMIT: ${{ steps.identity.outputs.product_sha }}
        run: |
          set -euo pipefail
          package_version="0.164.0-dev.sedna.1+u970111f6.g${PRODUCT_SHORT}.ci${GITHUB_RUN_NUMBER}"
          package_dir="${GITHUB_WORKSPACE}/dist/package-${TARGET}"
          archive="${GITHUB_WORKSPACE}/dist/codex-package-${TARGET}.tar.gz"
          bwrap_path="${CARGO_TARGET_DIR}/${TARGET}/release/bwrap"
          mkdir -p "${GITHUB_WORKSPACE}/dist"

          just assemble-codex-package \
            --target "${TARGET}" \
            --variant codex \
            --package-version "${package_version}" \
            --cargo-profile release \
            --package-dir "${package_dir}" \
            --archive-output "${archive}" \
            --bwrap-bin "${bwrap_path}" \
            --force

          python3 - "${package_dir}/codex-package.json" "${package_version}" "${TARGET}" <<'PY'
          import json
          import sys

          path, expected_version, expected_target = sys.argv[1:]
          with open(path, encoding="utf-8") as package_file:
              manifest = json.load(package_file)
          assert manifest["version"] == expected_version, manifest
          assert manifest["target"] == expected_target, manifest
          assert manifest["variant"] == "codex", manifest
          PY

          actual_version="$("${package_dir}/bin/codex" --version)"
          expected_version="codex-cli ${package_version}"
          [[ "${actual_version}" == "${expected_version}" ]] || {
            echo "Packaged CLI version does not match package manifest: ${actual_version}" >&2
            exit 1
          }
          "${package_dir}/bin/codex" --help >/dev/null
          "${package_dir}/bin/codex" mcp login --help >/dev/null
          [[ -f "${package_dir}/codex-resources/bwrap" ]]
          packaged_bwrap_sha="$(sha256sum "${package_dir}/codex-resources/bwrap" | awk '{print $1}')"
          [[ "${packaged_bwrap_sha}" == "${CODEX_BWRAP_SHA256}" ]]
          sha256sum "${archive}" > "${archive}.sha256"
          echo "CARGO_BIN_EXE_codex=${package_dir}/bin/codex" >> "${GITHUB_ENV}"

          printf '%s\n' \
            "Codex Linux integrated progressive package" \
            "Product source commit: ${PRODUCT_SHA}" \
            "Product source tree: ${PRODUCT_TREE}" \
            "Exact upstream base: ${UPSTREAM_SHA}" \
            "Workflow host commit: ${WORKFLOW_HOST_SHA}" \
            "Target: ${TARGET}" \
            "Package and executable version: ${package_version}" \
            "Version basis: Sedna development-series identity; not a claim of upstream release equivalence." \
            "Included: device authentication, V2 mailbox opt-in, weekly pacing, same-model capacity retry, targeted client instruction overlays, and read-only usage-tree adapter." \
            "Not established: protected-main landing, live account usage availability, or consumer/session acceptance." \
            "Excluded: Browser and Android MCP consumer adoption." \
            "Included: retired-MCP connection cleanup and in-flight completion carry from current main." \
            > "${GITHUB_WORKSPACE}/dist/PROVENANCE-${TARGET}.txt"

      - name: Run focused device-auth package tests
        shell: bash
        working-directory: product-source
        env:
          TARGET: ${{ matrix.target }}
          STABLE_GIT_COMMIT: ${{ steps.identity.outputs.product_sha }}
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml --target "${TARGET}" \
            -p codex-rmcp-client -p codex-mcp --lib
          cargo test --locked --manifest-path codex-rs/Cargo.toml --target "${TARGET}" \
            -p codex-cli --test mcp_device_login
          [[ -z "$(git -C "${CODEX_REPO_ROOT}" status --porcelain --untracked-files=normal)" ]]

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-integrated-${{ matrix.target }}-${{ steps.identity.outputs.product_short }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/codex-package-${{ matrix.target }}.tar.gz
            dist/codex-package-${{ matrix.target }}.tar.gz.sha256
            dist/PROVENANCE-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 30
