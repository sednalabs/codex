name: Diagnose PR 937 status startup overflow once
run-name: >-
  status startup GDB [pr=${{ github.event.pull_request.number }}
  source=2881fdfa host=${{ github.sha }}]

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-pr937-status-startup-overflow.yml"
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: status-startup-gdb-pr937-once
  cancel-in-progress: false

jobs:
  stacktrace:
    name: Capture one exact status startup backtrace
    if: ${{ github.event.pull_request.number == 937 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'integration/be2e-e926-20261009' && github.event.pull_request.head.repo.full_name == 'sednalabs/codex' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CODEX_BAZEL_LOCAL_ONLY: "1"
      BUILDBUDDY_API_KEY: ""
      DIAGNOSTIC_SOURCE_SHA: 2881fdfa94c0bf69bc6088901ddd683623e592da
      DIAGNOSTIC_SOURCE_TREE: 097b7de61a8cf94d12be1924867135413dc1f4ff
      DIAGNOSTIC_TEST: status::tests::status_snapshot_shows_chatgpt_plan_without_email
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_HOST_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact diagnostic source and PR boundary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PR_NUMBER}" != "937" || "${PR_BASE_REF}" != "main" || \
                "${PR_BASE_REPOSITORY}" != "${GITHUB_REPOSITORY}" || \
                "${PR_HEAD_REF}" != "integration/be2e-e926-20261009" || \
                "${PR_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "Refusing to run outside the exact same-repository PR boundary." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${PR_HEAD_SHA}" ]]; then
            echo "The checkout does not match the exact PR head." >&2
            exit 1
          fi
          parent_line="$(git rev-list --parents -n 1 "${PR_HEAD_SHA}")"
          if [[ "${parent_line}" != "${PR_HEAD_SHA} ${DIAGNOSTIC_SOURCE_SHA}" ]]; then
            echo "The diagnostic event is not the single direct successor of the authorized source." >&2
            exit 1
          fi
          changed_paths="$(git diff-tree --no-commit-id --name-only -r "${PR_HEAD_SHA}")"
          if [[ "${changed_paths}" != ".github/workflows/diagnose-pr937-status-startup-overflow.yml" ]]; then
            echo "The diagnostic event does not contain exactly the one authorized workflow path." >&2
            exit 1
          fi
          git cat-file -e "${DIAGNOSTIC_SOURCE_SHA}^{commit}"
          if [[ "$(git rev-parse "${DIAGNOSTIC_SOURCE_SHA}^{tree}")" != "${DIAGNOSTIC_SOURCE_TREE}" ]]; then
            echo "The diagnostic source tree does not match the frozen identity." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${DIAGNOSTIC_SOURCE_SHA}" "${PR_HEAD_SHA}"; then
            echo "The exact diagnostic source is not an ancestor of this PR head." >&2
            exit 1
          fi
          printf 'workflow_host_sha=%s\npr_head_sha=%s\ndiagnostic_source_sha=%s\ndiagnostic_source_tree=%s\n' \
            "${WORKFLOW_HOST_SHA}" "${PR_HEAD_SHA}" "${DIAGNOSTIC_SOURCE_SHA}" "${DIAGNOSTIC_SOURCE_TREE}"
          git checkout --detach "${DIAGNOSTIC_SOURCE_SHA}"
          if [[ "$(git rev-parse HEAD)" != "${DIAGNOSTIC_SOURCE_SHA}" || \
                -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "The exact diagnostic checkout is not clean." >&2
            exit 1
          fi

      - name: Set up standard Linux CI tools and Bazel
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Configure source-matched rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Set up Python for source preparation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.3"

      - name: Reproduce exact-source preparation before the test binary
        shell: bash
        run: |
          set -euo pipefail
          (cd codex-rs && cargo update --workspace)
          just write-config-schema

      - name: Build only the exact test binary without executing it
        id: test-binary
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test -p codex-tui --lib --no-run --message-format=json "${DIAGNOSTIC_TEST}" \
            > "${RUNNER_TEMP}/status-gdb-cargo-messages.jsonl"
          python3 - "${RUNNER_TEMP}/status-gdb-cargo-messages.jsonl" <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import sys

          artifacts = set()
          with open(sys.argv[1], encoding="utf-8") as messages:
              for line in messages:
                  try:
                      message = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  target = message.get("target", {})
                  if (
                      message.get("reason") == "compiler-artifact"
                      and target.get("test") is True
                      and "lib" in target.get("kind", [])
                      and message.get("executable")
                  ):
                      artifacts.add(message["executable"])
          if len(artifacts) != 1:
              raise SystemExit(f"Expected exactly one library test binary, found {len(artifacts)}")
          print(f"test_binary={next(iter(artifacts))}")
          PY

      - name: Install GDB on the standard hosted runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
          gdb --version | head -n 1

      - name: Capture one backtrace at the stack-overflow signal
        shell: bash
        env:
          TEST_BINARY: ${{ steps.test-binary.outputs.test_binary }}
          INSTA_UPDATE: always
          CODEX_TEST_STATUS_START_DIAGNOSTIC: "1"
        run: |
          set -euo pipefail
          ulimit -c 0
          trace_file="${RUNNER_TEMP}/status-startup-gdb.log"
          set +e
          gdb -q --batch \
            --nx \
            -ex 'set pagination off' \
            -ex 'set confirm off' \
            -ex 'set print address off' \
            -ex 'set print frame-arguments none' \
            -ex 'set inferior-tty /dev/null' \
            -ex 'handle SIGSEGV nostop noprint pass' \
            -ex 'handle SIGBUS nostop noprint pass' \
            -ex 'handle SIGABRT stop print nopass' \
            -ex run \
            -ex 'bt 64' \
            --args "${TEST_BINARY}" --exact "${DIAGNOSTIC_TEST}" --nocapture --test-threads=1 \
            > "${RUNNER_TEMP}/status-startup-gdb-raw.log" 2>&1
          gdb_status="$?"
          set -e
          echo "gdb_exit=${gdb_status}"
          raw_trace="${RUNNER_TEMP}/status-startup-gdb-raw.log"
          if ! grep -Eq 'received signal SIGABRT|Program received signal SIGABRT' "${raw_trace}"; then
            echo "GDB did not capture the expected stack-overflow signal." >&2
            exit 1
          fi
          frame_count="$(grep -Ec '^#[0-9]+[[:space:]]' "${raw_trace}" || true)"
          if [[ "${frame_count}" == "0" ]]; then
            echo "GDB did not produce a backtrace frame." >&2
            exit 1
          fi
          {
            echo "captured_signal=SIGABRT"
            echo "backtrace_frames=${frame_count}"
            grep -E '^#[0-9]+[[:space:]]' "${raw_trace}" | head -n 64 \
              | sed -E 's#/home/runner/work/[^/]+/[^/]+/#codex/#g'
          } > "${trace_file}"
          echo "Captured the single authorized signal backtrace; this diagnostic is not a test pass."

      - name: Preserve the bounded backtrace log
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: status-startup-gdb-2881-${{ github.run_id }}
          path: ${{ runner.temp }}/status-startup-gdb.log
          if-no-files-found: warn
          retention-days: 3
