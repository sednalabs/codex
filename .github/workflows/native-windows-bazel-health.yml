name: Focused native Windows Bazel validation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Focused selectors or Voice PE dependency inspection.
        required: true
        default: selectors
        type: choice
        options:
          - selectors
          - voice-loader-diagnostic
      source_sha:
        description: Exact source commit for this focused validation.
        required: true
        type: string
      expected_host_sha:
        description: Exact workflow-host commit read back before dispatch.
        required: true
        type: string

permissions:
  contents: read

jobs:
  focused-current-ci-local-msvc:
    if: inputs.operation == 'selectors'
    name: Focused required-CI selectors on Windows 2025 local MSVC
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_HOST_SHA: ${{ inputs.expected_host_sha }}
      CANDIDATE_SHA: 62789f783eb4a6be6fe53c499be4ec5eb5cffbb2
      CANDIDATE_TREE: 0f112e9eca38123986259e6ab629bef8c497a2ae
      BASE_SHA: 83086188ae0614bd882818ff1aa23f3194962012
      BUILDBUDDY_API_KEY: ''

    steps:
      - name: Validate dispatch identity before checkout
        shell: bash
        run: |
          set -euo pipefail
          expected_ref="refs/heads/validation/pr965-voice-loader-dbd4-20261021"
          expected_workflow_ref="sednalabs/codex/.github/workflows/native-windows-bazel-health.yml@${expected_ref}"
          [[ "${GITHUB_REPOSITORY}" == "sednalabs/codex" ]]
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${GITHUB_REF}" == "${expected_ref}" ]]
          [[ "${GITHUB_WORKFLOW_REF}" == "${expected_workflow_ref}" ]]
          [[ "${SOURCE_SHA}" == "${CANDIDATE_SHA}" ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_HOST_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_SHA}" == "${EXPECTED_HOST_SHA}" ]]
          [[ "${EXPECTED_HOST_SHA}" != "${SOURCE_SHA}" ]]
          native_test_report="${RUNNER_TEMP}/native-windows-fixed-selectors-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tsv"
          printf 'NATIVE_TEST_REPORT=%s\n' "${native_test_report}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity and record run provenance
        id: verify_source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD)"
          actual_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          [[ "${actual_sha}" == "${CANDIDATE_SHA}" ]]
          [[ "${actual_tree}" == "${CANDIDATE_TREE}" ]]
          git merge-base --is-ancestor "${BASE_SHA}" "${actual_sha}"
          {
            printf 'schema\tfocused-native-windows-v2\n'
            printf 'repository\t%s\n' "${GITHUB_REPOSITORY}"
            printf 'workflow_ref\t%s\n' "${GITHUB_WORKFLOW_REF}"
            printf 'workflow_host_sha\t%s\n' "${EXPECTED_HOST_SHA}"
            printf 'workflow_run_id\t%s\n' "${GITHUB_RUN_ID}"
            printf 'workflow_run_attempt\t%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'source_sha\t%s\n' "${actual_sha}"
            printf 'source_tree\t%s\n' "${actual_tree}"
            printf 'base_sha\t%s\n' "${BASE_SHA}"
            printf 'windows_runner\twindows-2025\n'
            printf 'build_mode\tlocal-windows-msvc-no-rbe\n'
          } > "${NATIVE_TEST_REPORT}"

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-focused-current-ci-local-msvc

      - name: Download pinned public Windows voice inputs
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -Raw .github/scripts/voice-cygwin-snapshot.json | ConvertFrom-Json
          $pin = $manifest.archive
          $source = $manifest.sourceArchive
          $directory = Join-Path $env:RUNNER_TEMP "voice-cygwin-snapshot"
          New-Item -ItemType Directory -Path $directory | Out-Null
          gh release download $pin.tag --repo openai/codex --pattern $pin.name --pattern $source.name --dir $directory
          if ($LASTEXITCODE -ne 0) { throw "Cannot obtain the public Cygwin inputs and source" }
          $sourceFile = Join-Path $directory $source.name
          if ((Get-Item $sourceFile).Length -ne $source.bytes -or
              (Get-FileHash $sourceFile -Algorithm SHA256).Hash.ToLowerInvariant() -ne $source.sha256) {
            throw "Public Cygwin source archive mismatch"
          }
          "VOICE_CYGWIN_ARCHIVE=$(Join-Path $directory $pin.name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify and install pinned Windows voice build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.github/scripts/setup-voice-windows.ps1 -Target "x86_64-pc-windows-msvc" -SnapshotArchive $env:VOICE_CYGWIN_ARCHIVE
          if ($LASTEXITCODE -ne 0) { throw "Pinned Windows voice Bazel inputs could not be provisioned" }

      - name: Validate Windows host environment and exact checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $systemRoot = $env:SystemRoot
          if ([string]::IsNullOrWhiteSpace($systemRoot) -or
              -not [System.IO.Path]::IsPathRooted($systemRoot) -or
              -not (Test-Path -LiteralPath $systemRoot -PathType Container)) {
            throw "Windows SystemRoot must be a valid runner directory."
          }

          $resolvedSystemRoot = (Resolve-Path -LiteralPath $systemRoot).Path
          if ([string]::IsNullOrWhiteSpace($resolvedSystemRoot)) {
            throw "Windows SystemRoot could not be resolved to a directory."
          }
          "CODEX_BAZEL_SYSTEM_ROOT=$resolvedSystemRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $hostArchitecture = $env:PROCESSOR_ARCHITEW6432
          if ([string]::IsNullOrWhiteSpace($hostArchitecture)) {
            $hostArchitecture = $env:PROCESSOR_ARCHITECTURE
          }
          if ([string]::IsNullOrWhiteSpace($hostArchitecture)) {
            throw "Windows host architecture must be available from the runner."
          }
          "CODEX_BAZEL_PROCESSOR_ARCHITECTURE=$hostArchitecture" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $checkoutCommit = & git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0 -or @($checkoutCommit).Count -ne 1 -or
              $checkoutCommit -cnotmatch '^[0-9a-f]{40}$' -or
              $checkoutCommit -cne $env:SOURCE_SHA) {
            throw "The checked-out source must identify the dispatched source commit exactly."
          }
          $statusLines = @(& cmd.exe /d /c .\scripts\workspace-status.cmd)
          $statusExitCode = $LASTEXITCODE
          $commitLines = @($statusLines | Where-Object { $_.StartsWith('STABLE_GIT_COMMIT ', [StringComparison]::Ordinal) })
          if ($statusExitCode -ne 0 -or $commitLines.Count -ne 1 -or
              $commitLines[0] -cne "STABLE_GIT_COMMIT $($env:SOURCE_SHA)") {
            throw "Windows workspace status must identify the checked-out source exactly once."
          }

      - name: Run nine exact selectors in the required-CI local MSVC mode
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          selectors=(
            '//codex-rs/core:core-all-test|suite::subagent_notifications::subagent_stop_replaces_stop_and_skips_internal_subagents'
            '//codex-rs/core:core-all-test|suite::mcp_tool_cache::cached_mcp_startup_is_eager_for_root_and_lazy_for_subagents'
            '//codex-rs/core:core-all-test|suite::rmcp_client::stdio_image_responses_resize_large_image'
            '//codex-rs/ext/queue:queue-queue_service-test|rejected_queue_messages_are_consumed_without_retrying_or_blocking_followups'
            '//codex-rs/ext/queue:queue-queue_service-test|explicitly_started_rejected_queue_messages_are_consumed'
            '//codex-rs/voice-host:voice-host-installed_client-test|installed_client_rejects_mixed_builds_and_missing_helper'
            '//codex-rs/code-mode-host:code-mode-host-unit-tests|grpc::robustness_tests::concurrent_runtime_start_executes_cells_and_closes_sessions'
            '//codex-rs/codex-mcp:codex-mcp-unit-tests|runtime::tests::cached_bindings_follow_the_clients_catalog_revision'
            '//codex-rs/codex-mcp:codex-mcp-unit-tests|runtime::tests::cached_bindings_are_scoped_to_the_published_runtime'
          )
          failures=0
          index=0
          printf 'selector\ttarget\tstatus\tbazel_exit_code\tmatched_pass_lines\tearly_skip\ttest_result\tdiagnostics\n' >> "${NATIVE_TEST_REPORT}"

          for item in "${selectors[@]}"; do
            index=$((index + 1))
            target="${item%%|*}"
            selector="${item#*|}"
            log="${RUNNER_TEMP}/native-windows-selector-${index}.log"
            printf 'Running exact selector %s on %s\n' "${selector}" "${target}"

            if ./.github/scripts/run-bazel-ci.sh \
              --windows-cross-compile \
              -- \
              test \
              --nocache_test_results \
              --test_output=all \
              --test_sharding_strategy=disabled \
              --test_arg="${selector}" \
              --test_arg=--exact \
              --test_arg=--color=never \
              --test_arg=--show-output \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
              --workspace_status_command=./scripts/workspace-status.cmd \
              --build_metadata=COMMIT_SHA=${SOURCE_SHA} \
              --build_metadata=TAG_validation_host_sha=${EXPECTED_HOST_SHA} \
              --build_metadata=TAG_windows_validation_mode=current_ci_local_msvc \
              --action_env="SystemRoot=${CODEX_BAZEL_SYSTEM_ROOT}" \
              --host_action_env="SystemRoot=${CODEX_BAZEL_SYSTEM_ROOT}" \
              --action_env="PROCESSOR_ARCHITECTURE=${CODEX_BAZEL_PROCESSOR_ARCHITECTURE}" \
              --host_action_env="PROCESSOR_ARCHITECTURE=${CODEX_BAZEL_PROCESSOR_ARCHITECTURE}" \
              --inject_repository="voice_windows_tools=${VOICE_WINDOWS_BAZEL_REPOSITORY}" \
              --//third_party/voice:windows_installed_tools=@voice_windows_tools//:tools \
              -- \
              "${target}" >"${log}" 2>&1; then
              bazel_status=0
            else
              bazel_status=$?
            fi

            local_config_count="$(grep -Fxc 'BuildBuddy API key is not available; using local Bazel configuration.' "${log}" || true)"
            pass_line_count="$(grep -Fxc "test ${selector} ... ok" "${log}" || true)"
            early_skip=0
            if grep -Fq 'Skipping test because it cannot execute when network is disabled in a Codex sandbox.' "${log}" ||
              grep -Fq 'Skipping test in ' "${log}"; then
              early_skip=1
            fi
            result_line="$(grep -F 'test result:' "${log}" | tail -n 1 | tr '\t\r' '  ' | cut -c1-240 || true)"
            diagnostics="$(
              {
                if [[ "${early_skip}" -ne 0 ]]; then
                  printf 'execution_category=early_skip\n'
                fi
                grep -E '^(queue:|explicit:|child stop:|diagnostic_phase=)' "${log}" \
                  | tail -n 8 \
                  | cut -c1-256 \
                  | sed 's/^/fixture=/' || true
                if grep -Fq '!IsConfigurablePoolInitialized()' "${log}"; then
                  printf 'pa_fatal_guard=detected\n'
                fi
                grep -oE 'error\[E[0-9]{4}\]' "${log}" \
                  | sort -u \
                  | sed -E -n '1,4s/error\[E([0-9]{4})\]/rustc_error_code=E\1/p' || true
                if grep -Eq 'error: linking with .* failed|link\.exe.*failed' "${log}"; then
                  printf 'compiler_error_category=linker_failure\n'
                fi
                if grep -Fq 'error: failed to run custom build command' "${log}"; then
                  printf 'compiler_error_category=custom_build_script_failure\n'
                fi
                if grep -Fq 'error: could not compile' "${log}"; then
                  printf 'compiler_error_category=rustc_compile_failure\n'
                fi
                grep -F 'panicked at' "${log}" \
                  | tr '\\' '/' \
                  | grep -oE '(codex-rs/)?(core|ext/queue|voice-host|code-mode-host|code-mode-runtime|codex-mcp)/[^[:space:]:]+\.rs:[0-9]+:[0-9]+' \
                  | sed -E 's#^(codex-rs/)?#codex-rs/#' \
                  | sort -u \
                  | sed -n '1,3s/^/panic_source=/' || true
                grep -oE 'ExitStatus\([0-9]+\)' "${log}" \
                  | grep -oE '[0-9]+' \
                  | sort -u \
                  | sed -n '1,4s/^/child_exit_status=/' || true
              } | sed -n '1,16p' | tr '\t\r\n' '   ' | cut -c1-1024
            )"
            status=FAIL
            if [[ "${bazel_status}" -eq 0 && "${local_config_count}" == "1" &&
                  "${pass_line_count}" == "1" && "${early_skip}" -eq 0 &&
                  "${result_line}" == *"1 passed; 0 failed"* ]]; then
              status=PASS
            else
              failures=$((failures + 1))
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "${selector}" "${target}" "${status}" "${bazel_status}" "${pass_line_count}" "${early_skip}" "${result_line}" "${diagnostics}" >> "${NATIVE_TEST_REPORT}"
            printf '%s: %s (%s); Bazel exit=%s; exact pass lines=%s; early skip=%s; result=%s; diagnostics=%s\n' "${status}" "${selector}" "${target}" "${bazel_status}" "${pass_line_count}" "${early_skip}" "${result_line}" "${diagnostics}"
          done

          [[ "${failures}" -eq 0 ]]

      - name: Check formatting of the eight changed Rust files with pinned Rust 1.95
        if: always() && steps.verify_source.outcome == 'success'
        shell: pwsh
        run: |
          & rustup run 1.95.0 rustfmt --version *> $null
          if ($LASTEXITCODE -ne 0) {
            & rustup toolchain install 1.95.0 --profile minimal --component rustfmt
            if ($LASTEXITCODE -ne 0) {
              throw "Pinned minimal Rust 1.95 with rustfmt could not be installed."
            }
            & rustup run 1.95.0 rustfmt --version *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Pinned Rust 1.95 rustfmt remains unavailable after installation."
            }
          }

          & rustup run 1.95.0 rustfmt --check --edition 2024 --config-path codex-rs/rustfmt.toml --config 'imports_granularity=Item,skip_children=true' codex-rs/code-mode-host/src/grpc/robustness_tests.rs codex-rs/code-mode-runtime/src/v8_init.rs codex-rs/core/tests/suite/subagent_notifications.rs codex-rs/core/tests/suite/mcp_tool_cache.rs codex-rs/core/tests/suite/rmcp_client.rs codex-rs/ext/queue/tests/queue_service.rs codex-rs/state/src/runtime.rs codex-rs/state/src/sqlite/validation_tests.rs
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Rust 1.95 rustfmt check failed for the eight changed files."
          }

      - name: Check for a clean worktree
        if: always() && !cancelled() && steps.verify_source.outcome == 'success'
        uses: ./.github/actions/check-clean-worktree

      - name: Upload fixed-selector identity and result receipt
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-windows-fixed-selectors-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-windows-fixed-selectors-${{ github.run_id }}-${{ github.run_attempt }}.tsv
          if-no-files-found: warn
          retention-days: 3

  voice-loader-dependency-diagnostic:
    if: inputs.operation == 'voice-loader-diagnostic'
    name: Inspect required-CI gnullvm Voice PE dependencies on Windows 2025
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_HOST_SHA: ${{ inputs.expected_host_sha }}
      DIAGNOSTIC_SOURCE_SHA: dbd4fa5ed7b2612a5de57bade56c59e854097669
      DIAGNOSTIC_SOURCE_TREE: 7880f08c0d97de6c5fecd4028637bf9aae264d5b
      BASE_SHA: 83086188ae0614bd882818ff1aa23f3194962012
      BUILDBUDDY_API_KEY: ''

    steps:
      - name: Validate diagnostic dispatch identity before checkout
        shell: bash
        run: |
          set -euo pipefail
          expected_ref="refs/heads/validation/pr965-voice-loader-dbd4-20261021"
          expected_workflow_ref="sednalabs/codex/.github/workflows/native-windows-bazel-health.yml@${expected_ref}"
          [[ "${GITHUB_REPOSITORY}" == "sednalabs/codex" ]]
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${GITHUB_REF}" == "${expected_ref}" ]]
          [[ "${GITHUB_WORKFLOW_REF}" == "${expected_workflow_ref}" ]]
          [[ "${SOURCE_SHA}" == "${DIAGNOSTIC_SOURCE_SHA}" ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_HOST_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_SHA}" == "${EXPECTED_HOST_SHA}" ]]
          [[ "${EXPECTED_HOST_SHA}" != "${SOURCE_SHA}" ]]
          [[ -z "${BUILDBUDDY_API_KEY}" ]]

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact gnullvm source and initialize sanitized receipt
        id: verify_voice_source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualSha = (& git rev-parse --verify HEAD).Trim()
          $actualTree = (& git rev-parse --verify 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSha -cne $env:DIAGNOSTIC_SOURCE_SHA -or
              $actualTree -cne $env:DIAGNOSTIC_SOURCE_TREE) {
            throw "The diagnostic checkout does not match the fixed source identity."
          }
          & git merge-base --is-ancestor $env:BASE_SHA $actualSha
          if ($LASTEXITCODE -ne 0) { throw "The fixed baseline is not an ancestor of the diagnostic source." }
          $status = @(& git status --porcelain=v1)
          if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) {
            throw "The diagnostic source checkout must be clean before inspection."
          }
          $report = Join-Path $env:RUNNER_TEMP "voice-loader-dependencies-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT).tsv"
          "VOICE_DLL_REPORT=$report" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $lines = @(
            ('schema' + "`t" + 'focused-voice-loader-dependencies-v2'),
            ('repository' + "`t" + $env:GITHUB_REPOSITORY),
            ('workflow_host_sha' + "`t" + $env:EXPECTED_HOST_SHA),
            ('workflow_run_id' + "`t" + $env:GITHUB_RUN_ID),
            ('workflow_run_attempt' + "`t" + $env:GITHUB_RUN_ATTEMPT),
            ('source_sha' + "`t" + $actualSha),
            ('source_tree' + "`t" + $actualTree),
            ('base_sha' + "`t" + $env:BASE_SHA),
            ('windows_runner' + "`t" + 'windows-2025'),
            ('target_platform' + "`t" + 'windows_x86_64_gnullvm'),
            ('execution_host' + "`t" + 'local_windows_msvc_no_rbe'),
            ('build_only' + "`t" + 'true'),
            ('diagnostic_scope' + "`t" + 'production_helper_pe_only'),
            ('test_pe_not_inspected' + "`t" + 'true'),
            ('target' + "`t" + '//codex-rs/voice-host:codex-voice-host'),
            ('component' + "`t" + 'dll' + "`t" + 'x64_system32_file_or_api_set_name_observed' + "`t" + 'component_pe_dir_presence_observed' + "`t" + 'required_test_ci_path_presence_observed' + "`t" + 'workspace_root_presence_observed' + "`t" + 'copied_helper_system32_or_api_set_name_or_test_ci_path_observed')
          )
          Set-Content -LiteralPath $report -Value $lines -Encoding utf8
          "VOICE_DLL_REPORT=$report" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          cache-scope: bazel-focused-voice-loader-diagnostic

      - name: Download pinned public Windows voice inputs
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -Raw .github/scripts/voice-cygwin-snapshot.json | ConvertFrom-Json
          $pin = $manifest.archive
          $source = $manifest.sourceArchive
          $directory = Join-Path $env:RUNNER_TEMP "voice-cygwin-snapshot"
          New-Item -ItemType Directory -Path $directory | Out-Null
          gh release download $pin.tag --repo openai/codex --pattern $pin.name --pattern $source.name --dir $directory
          if ($LASTEXITCODE -ne 0) { throw "Cannot obtain the pinned public Cygwin inputs and source" }
          $sourceFile = Join-Path $directory $source.name
          if ((Get-Item $sourceFile).Length -ne $source.bytes -or
              (Get-FileHash $sourceFile -Algorithm SHA256).Hash.ToLowerInvariant() -ne $source.sha256) {
            throw "Public Cygwin source archive mismatch"
          }
          "VOICE_CYGWIN_ARCHIVE=$(Join-Path $directory $pin.name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned Windows voice build tools without token inheritance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.github/scripts/setup-voice-windows.ps1 -Target "x86_64-pc-windows-msvc" -SnapshotArchive $env:VOICE_CYGWIN_ARCHIVE
          if ($LASTEXITCODE -ne 0) { throw "Pinned Windows voice Bazel inputs could not be provisioned" }

      - name: Validate Windows host and exact workspace status
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $systemRoot = $env:SystemRoot
          if ([string]::IsNullOrWhiteSpace($systemRoot) -or
              -not [System.IO.Path]::IsPathRooted($systemRoot) -or
              -not (Test-Path -LiteralPath $systemRoot -PathType Container)) {
            throw "Windows SystemRoot must be a valid runner directory."
          }
          $resolvedSystemRoot = (Resolve-Path -LiteralPath $systemRoot).Path
          $hostArchitecture = $env:PROCESSOR_ARCHITEW6432
          if ([string]::IsNullOrWhiteSpace($hostArchitecture)) { $hostArchitecture = $env:PROCESSOR_ARCHITECTURE }
          if ([string]::IsNullOrWhiteSpace($hostArchitecture) -or
              [string]::IsNullOrWhiteSpace($env:CODEX_BAZEL_WINDOWS_PATH)) {
            throw "Windows host architecture and the required CI test PATH must be available."
          }
          "CODEX_BAZEL_SYSTEM_ROOT=$resolvedSystemRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CODEX_BAZEL_PROCESSOR_ARCHITECTURE=$hostArchitecture" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $checkoutCommit = (& git rev-parse --verify HEAD).Trim()
          $statusLines = @(& cmd.exe /d /c .\scripts\workspace-status.cmd)
          $statusExitCode = $LASTEXITCODE
          $commitLines = @($statusLines | Where-Object { $_.StartsWith('STABLE_GIT_COMMIT ', [StringComparison]::Ordinal) })
          if ($checkoutCommit -cne $env:SOURCE_SHA -or $statusExitCode -ne 0 -or
              $commitLines.Count -ne 1 -or $commitLines[0] -cne "STABLE_GIT_COMMIT $($env:SOURCE_SHA)") {
            throw "Windows workspace status must identify the exact checked-out source once."
          }

      - name: Build only the production Voice helper PE with required-CI gnullvm settings
        id: build_voice_outputs
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          [[ -z "${BUILDBUDDY_API_KEY:-}" ]]
          bazel_log="${RUNNER_TEMP}/voice-loader-bazel-build.log"
          bazel_args=(
            --platforms=//:windows_x86_64_gnullvm
            --host_platform=//:local_windows_msvc
            --workspace_status_command=./scripts/workspace-status.cmd
            --build_metadata=COMMIT_SHA=${SOURCE_SHA}
            --build_metadata=TAG_validation_host_sha=${EXPECTED_HOST_SHA}
            --build_metadata=TAG_windows_validation_mode=voice_loader_dependency_diagnostic
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1
            --action_env="SystemRoot=${CODEX_BAZEL_SYSTEM_ROOT}"
            --host_action_env="SystemRoot=${CODEX_BAZEL_SYSTEM_ROOT}"
            --action_env="PROCESSOR_ARCHITECTURE=${CODEX_BAZEL_PROCESSOR_ARCHITECTURE}"
            --host_action_env="PROCESSOR_ARCHITECTURE=${CODEX_BAZEL_PROCESSOR_ARCHITECTURE}"
            --inject_repository="voice_windows_tools=${VOICE_WINDOWS_BAZEL_REPOSITORY}"
            --//third_party/voice:windows_installed_tools=@voice_windows_tools//:tools
          )
          targets=(
            //codex-rs/voice-host:codex-voice-host
          )
          set +e
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --windows-cross-compile \
            -- \
            build \
            "${bazel_args[@]}" \
            -- \
            "${targets[@]}" 2>&1 | tee "${bazel_log}"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          bazel_status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"
          build_step_status="${bazel_status}"
          if [[ "${tee_status}" -ne 0 ]]; then
            echo "Failed to retain the focused Voice Bazel output." >&2
            if [[ "${build_step_status}" -eq 0 ]]; then
              build_step_status="${tee_status}"
            fi
          fi
          local_config_count="$(grep -Fxc 'BuildBuddy API key is not available; using local Bazel configuration.' "${bazel_log}" || true)"
          printf 'build_exit_code=%s\n' "${bazel_status}" >> "${VOICE_DLL_REPORT}"
          printf 'local_bazel_configuration_marker_count=%s\n' "${local_config_count}" >> "${VOICE_DLL_REPORT}"
          printf 'exit_code=%s\n' "${build_step_status}" >> "${GITHUB_OUTPUT}"
          if [[ "${local_config_count}" != 1 ]]; then
            echo "The diagnostic build did not prove the no-key local Bazel path." >&2
            exit 1
          fi
          if [[ "${build_step_status}" -ne 0 ]]; then
            if [[ "${bazel_status}" -ne 0 ]]; then
              echo "The focused Voice PE build failed; no PE inspection was performed." >&2
            fi
            exit "${build_step_status}"
          fi

      - name: Resolve the production Voice helper PE without executing it
        id: resolve_voice_outputs
        if: steps.build_voice_outputs.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          query_flags=(
            --platforms=//:windows_x86_64_gnullvm
            --host_platform=//:local_windows_msvc
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1
            --action_env="SystemRoot=${CODEX_BAZEL_SYSTEM_ROOT}"
            --host_action_env="SystemRoot=${CODEX_BAZEL_SYSTEM_ROOT}"
            --action_env="PROCESSOR_ARCHITECTURE=${CODEX_BAZEL_PROCESSOR_ARCHITECTURE}"
            --host_action_env="PROCESSOR_ARCHITECTURE=${CODEX_BAZEL_PROCESSOR_ARCHITECTURE}"
            --inject_repository="voice_windows_tools=${VOICE_WINDOWS_BAZEL_REPOSITORY}"
            --//third_party/voice:windows_installed_tools=@voice_windows_tools//:tools
          )
          query_output() {
            local target="$1"
            local suffix="$2"
            local log="${RUNNER_TEMP}/voice-loader-cquery-$3.log"
            if ! ./.github/scripts/run-bazel-ci.sh \
              --windows-cross-compile \
              -- \
              cquery \
              --output=files \
              "${query_flags[@]}" \
              -- \
              "${target}" >"${log}" 2>&1; then
              echo "Exact Voice output resolution failed." >&2
              return 1
            fi
            local local_config_count
            local_config_count="$(grep -Fxc 'BuildBuddy API key is not available; using local Bazel configuration.' "${log}" || true)"
            [[ "${local_config_count}" == 1 ]]
            local -a outputs=()
            mapfile -t outputs < <(tr -d '\r' < "${log}" | grep -Ei "^[^[:space:]].*\.${suffix}$")
            [[ "${#outputs[@]}" -eq 1 ]]
            [[ "${outputs[0]}" == bazel-out/* ]]
            printf '%s' "${outputs[0]}"
          }
          helper_pe="$(query_output '//codex-rs/voice-host:codex-voice-host' exe helper)"
          {
            printf 'VOICE_HELPER_PE=%s\n' "${helper_pe}"
          } >> "${GITHUB_ENV}"

      - name: Inspect production helper imports and exact CI resolution locations
        id: inspect_voice_pes
        if: steps.resolve_voice_outputs.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Resolve-Path -LiteralPath '.').Path
          $helperPe = (Resolve-Path -LiteralPath $env:VOICE_HELPER_PE).Path
          $x64SystemDirectory = Join-Path $env:SystemRoot 'System32'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'The standard Visual Studio locator is unavailable.' }
          $installations = @(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0 -or $installations.Count -ne 1) { throw 'The standard Windows C++ inspection toolchain was not uniquely located.' }
          $toolsetRoot = Join-Path $installations[0] 'VC\Tools\MSVC'
          $toolsets = @(Get-ChildItem -LiteralPath $toolsetRoot -Directory -ErrorAction Stop |
            Sort-Object { [version]$_.Name } -Descending)
          $dumpbin = $null
          foreach ($toolset in $toolsets) {
            $candidate = Join-Path $toolset.FullName 'bin\Hostx64\x64\dumpbin.exe'
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $dumpbin = (Resolve-Path -LiteralPath $candidate).Path
              break
            }
          }
          if ([string]::IsNullOrWhiteSpace($dumpbin)) { throw 'The standard x64 dumpbin executable was not found.' }

          $testPathEntries = @($env:CODEX_BAZEL_WINDOWS_PATH -split ';' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($testPathEntries.Count -eq 0) { throw 'The exact required-CI Windows test PATH is empty.' }
          function Get-PeImports([string]$Path) {
            $lines = & $dumpbin /DEPENDENTS $Path 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'The standard PE dependency inspection failed.' }
            $imports = @(
              foreach ($line in $lines) {
                $name = $line.Trim()
                if ($name -match '(?i)^[A-Za-z0-9_.+-]+\.dll$') { $name.ToLowerInvariant() }
              }
            ) | Sort-Object -Unique
            if ($imports.Count -eq 0) { throw 'The PE dependency inspection returned no import names.' }
            return $imports
          }
          function Test-SystemImport([string]$Name) {
            if ($Name -match '^(api-ms-win-|ext-ms-win-)') { return $true }
            return Test-Path -LiteralPath (Join-Path $x64SystemDirectory $Name) -PathType Leaf
          }
          function Test-PathImport([string]$Name) {
            foreach ($directory in $testPathEntries) {
              if (Test-Path -LiteralPath (Join-Path $directory $Name) -PathType Leaf) { return $true }
            }
            return $false
          }
          $rows = [System.Collections.Generic.List[string]]::new()
          foreach ($component in @(
            @{ Name = 'voice-helper'; Path = $helperPe }
          )) {
            $exeDirectory = Split-Path -Parent $component.Path
            foreach ($dll in (Get-PeImports $component.Path)) {
              $x64SystemImportObserved = Test-SystemImport $dll
              $componentPeDirectoryPresenceObserved = Test-Path -LiteralPath (Join-Path $exeDirectory $dll) -PathType Leaf
              $requiredTestCiPathPresenceObserved = Test-PathImport $dll
              $workspaceRootPresenceObserved = Test-Path -LiteralPath (Join-Path $workspace $dll) -PathType Leaf
              $copiedHelperSystemOrTestCiPathObserved = if ($component.Name -eq 'voice-helper') { [string]($x64SystemImportObserved -or $requiredTestCiPathPresenceObserved) } else { 'n/a' }
              $rows.Add(($component.Name, $dll, [string]$x64SystemImportObserved, [string]$componentPeDirectoryPresenceObserved, [string]$requiredTestCiPathPresenceObserved, [string]$workspaceRootPresenceObserved, $copiedHelperSystemOrTestCiPathObserved) -join "`t")
            }
          }
          Add-Content -LiteralPath $env:VOICE_DLL_REPORT -Value $rows.ToArray() -Encoding utf8
          'inspection_complete=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Finalize sanitized diagnostic status
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build_voice_outputs.outcome }}
          BUILD_EXIT_CODE: ${{ steps.build_voice_outputs.outputs.exit_code }}
          RESOLVE_OUTCOME: ${{ steps.resolve_voice_outputs.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect_voice_pes.outcome }}
        run: |
          if (Test-Path -LiteralPath $env:VOICE_DLL_REPORT -PathType Leaf) {
            Add-Content -LiteralPath $env:VOICE_DLL_REPORT -Value @(
              "build_step_outcome`t$env:BUILD_OUTCOME",
              "build_exit_code`t$env:BUILD_EXIT_CODE",
              "output_resolution_outcome`t$env:RESOLVE_OUTCOME",
              "pe_inspection_outcome`t$env:INSPECT_OUTCOME"
            ) -Encoding utf8
          }

      - name: Check for a clean worktree
        if: always() && !cancelled() && steps.verify_voice_source.outcome == 'success'
        uses: ./.github/actions/check-clean-worktree

      - name: Upload sanitized Voice dependency receipt only
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-windows-voice-dependencies-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/voice-loader-dependencies-${{ github.run_id }}-${{ github.run_attempt }}.tsv
          if-no-files-found: error
          retention-days: 1
