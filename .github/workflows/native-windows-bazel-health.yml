name: Focused native Windows Bazel validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit for this focused validation.
        required: true
        type: string
      expected_host_sha:
        description: Exact workflow-host commit read back before dispatch.
        required: true
        type: string

permissions:
  contents: read

jobs:
  focused-two-selectors-local-msvc-no-rbe:
    name: Focused Windows 2025 local MSVC selectors without RBE
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_HOST_SHA: ${{ inputs.expected_host_sha }}
      CANDIDATE_SHA: fb00a521c9eecff3b2cf66efd8a16eb0994e1aa9
      CANDIDATE_TREE: 0f70d5bfe1e196c0a9cb04e40c68a810efe01108
      BASE_SHA: 83086188ae0614bd882818ff1aa23f3194962012
      BUILDBUDDY_API_KEY: ''

    steps:
      - name: Validate dispatch identity before checkout
        shell: bash
        run: |
          set -euo pipefail
          expected_ref="refs/heads/validation/pr965-focused-windows-fb00a521"
          expected_workflow_ref="sednalabs/codex/.github/workflows/native-windows-bazel-health.yml@${expected_ref}"
          [[ "${GITHUB_REPOSITORY}" == "sednalabs/codex" ]]
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${GITHUB_REF}" == "${expected_ref}" ]]
          [[ "${GITHUB_WORKFLOW_REF}" == "${expected_workflow_ref}" ]]
          [[ "${SOURCE_SHA}" == "${CANDIDATE_SHA}" ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_HOST_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_SHA}" == "${EXPECTED_HOST_SHA}" ]]
          [[ "${EXPECTED_HOST_SHA}" != "${SOURCE_SHA}" ]]
          native_test_report="${RUNNER_TEMP}/native-windows-fixed-selectors-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tsv"
          printf 'NATIVE_TEST_REPORT=%s\n' "${native_test_report}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity and record run provenance
        id: verify_source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD)"
          actual_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          [[ "${actual_sha}" == "${CANDIDATE_SHA}" ]]
          [[ "${actual_tree}" == "${CANDIDATE_TREE}" ]]
          git merge-base --is-ancestor "${BASE_SHA}" "${actual_sha}"
          {
            printf 'schema\tfocused-native-windows-v3\n'
            printf 'repository\t%s\n' "${GITHUB_REPOSITORY}"
            printf 'workflow_ref\t%s\n' "${GITHUB_WORKFLOW_REF}"
            printf 'workflow_host_sha\t%s\n' "${EXPECTED_HOST_SHA}"
            printf 'workflow_run_id\t%s\n' "${GITHUB_RUN_ID}"
            printf 'workflow_run_attempt\t%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'source_sha\t%s\n' "${actual_sha}"
            printf 'source_tree\t%s\n' "${actual_tree}"
            printf 'base_sha\t%s\n' "${BASE_SHA}"
            printf 'windows_runner\twindows-2025\n'
            printf 'build_mode\tlocal-windows-msvc-no-rbe\n'
          } > "${NATIVE_TEST_REPORT}"

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-focused-source-consumers-local-msvc-no-rbe

      - name: Download pinned public Windows voice inputs
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -Raw .github/scripts/voice-cygwin-snapshot.json | ConvertFrom-Json
          $pin = $manifest.archive
          $source = $manifest.sourceArchive
          $directory = Join-Path $env:RUNNER_TEMP "voice-cygwin-snapshot"
          New-Item -ItemType Directory -Path $directory | Out-Null
          gh release download $pin.tag --repo openai/codex --pattern $pin.name --pattern $source.name --dir $directory
          if ($LASTEXITCODE -ne 0) { throw "Cannot obtain the public Cygwin inputs and source" }
          $sourceFile = Join-Path $directory $source.name
          if ((Get-Item $sourceFile).Length -ne $source.bytes -or
              (Get-FileHash $sourceFile -Algorithm SHA256).Hash.ToLowerInvariant() -ne $source.sha256) {
            throw "Public Cygwin source archive mismatch"
          }
          "VOICE_CYGWIN_ARCHIVE=$(Join-Path $directory $pin.name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify and install pinned Windows voice build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.github/scripts/setup-voice-windows.ps1 -Target "x86_64-pc-windows-msvc" -SnapshotArchive $env:VOICE_CYGWIN_ARCHIVE
          if ($LASTEXITCODE -ne 0) { throw "Pinned Windows voice Bazel inputs could not be provisioned" }

      - name: Validate Windows host environment and exact checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $systemRoot = $env:SystemRoot
          if ([string]::IsNullOrWhiteSpace($systemRoot) -or
              -not [System.IO.Path]::IsPathRooted($systemRoot) -or
              -not (Test-Path -LiteralPath $systemRoot -PathType Container)) {
            throw "Windows SystemRoot must be a valid runner directory."
          }

          $resolvedSystemRoot = (Resolve-Path -LiteralPath $systemRoot).Path
          if ([string]::IsNullOrWhiteSpace($resolvedSystemRoot)) {
            throw "Windows SystemRoot could not be resolved to a directory."
          }
          "CODEX_BAZEL_SYSTEM_ROOT=$resolvedSystemRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $hostArchitecture = $env:PROCESSOR_ARCHITEW6432
          if ([string]::IsNullOrWhiteSpace($hostArchitecture)) {
            $hostArchitecture = $env:PROCESSOR_ARCHITECTURE
          }
          if ([string]::IsNullOrWhiteSpace($hostArchitecture)) {
            throw "Windows host architecture must be available from the runner."
          }
          "CODEX_BAZEL_PROCESSOR_ARCHITECTURE=$hostArchitecture" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $checkoutCommit = & git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0 -or @($checkoutCommit).Count -ne 1 -or
              $checkoutCommit -cnotmatch '^[0-9a-f]{40}$' -or
              $checkoutCommit -cne $env:SOURCE_SHA) {
            throw "The checked-out source must identify the dispatched source commit exactly."
          }
          $statusLines = @(& cmd.exe /d /c .\scripts\workspace-status.cmd)
          $statusExitCode = $LASTEXITCODE
          $commitLines = @($statusLines | Where-Object { $_.StartsWith('STABLE_GIT_COMMIT ', [StringComparison]::Ordinal) })
          if ($statusExitCode -ne 0 -or $commitLines.Count -ne 1 -or
              $commitLines[0] -cne "STABLE_GIT_COMMIT $($env:SOURCE_SHA)") {
            throw "Windows workspace status must identify the checked-out source exactly once."
          }

      - name: Run two fixed selectors in the local Windows MSVC no-RBE mode
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          selectors=(
            '//codex-rs/windows-sandbox-rs:windows-sandbox-rs-helper_manifest-test|setup_helper_embeds_as_invoker_manifest'
            '//codex-rs/cli:cli-doctor_path_safety-test|startup_and_doctor_do_not_execute_path_helpers'
          )
          [[ "${#selectors[@]}" -eq 2 ]]
          failures=0
          index=0
          printf 'selector\ttarget\tstatus\tbazel_exit_code\ttee_exit_code\tmatched_pass_lines\tearly_skip\ttest_result\tdiagnostics\n' >> "${NATIVE_TEST_REPORT}"

          for item in "${selectors[@]}"; do
            index=$((index + 1))
            target="${item%%|*}"
            selector="${item#*|}"
            log="${RUNNER_TEMP}/native-windows-selector-${index}.log"
            printf 'Running exact selector %s on %s\n' "${selector}" "${target}"

            set +e
            ./.github/scripts/run-bazel-ci.sh \
              --windows-cross-compile \
              -- \
              test \
              --nocache_test_results \
              --test_output=all \
              --test_sharding_strategy=disabled \
              --test_arg="${selector}" \
              --test_arg=--exact \
              --test_arg=--color=never \
              --test_arg=--show-output \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
              --workspace_status_command=./scripts/workspace-status.cmd \
              --build_metadata=COMMIT_SHA=${SOURCE_SHA} \
              --build_metadata=TAG_validation_host_sha=${EXPECTED_HOST_SHA} \
              --build_metadata=TAG_windows_validation_mode=focused_two_selectors_local_msvc_no_rbe \
              --action_env="SystemRoot=${CODEX_BAZEL_SYSTEM_ROOT}" \
              --host_action_env="SystemRoot=${CODEX_BAZEL_SYSTEM_ROOT}" \
              --action_env="PROCESSOR_ARCHITECTURE=${CODEX_BAZEL_PROCESSOR_ARCHITECTURE}" \
              --host_action_env="PROCESSOR_ARCHITECTURE=${CODEX_BAZEL_PROCESSOR_ARCHITECTURE}" \
              --inject_repository="voice_windows_tools=${VOICE_WINDOWS_BAZEL_REPOSITORY}" \
              --//third_party/voice:windows_installed_tools=@voice_windows_tools//:tools \
              -- \
              "${target}" 2>&1 | tee "${log}"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            bazel_status="${pipeline_status[0]}"
            tee_status="${pipeline_status[1]}"
            if [[ "${tee_status}" -ne 0 ]]; then
              echo "Failed to retain selector ${index} Bazel output." >&2
            fi

            local_config_count="$(grep -Fxc 'BuildBuddy API key is not available; using local Bazel configuration.' "${log}" || true)"
            pass_line_count="$(grep -Fxc "test ${selector} ... ok" "${log}" || true)"
            early_skip=0
            if grep -Fq 'Skipping test because it cannot execute when network is disabled in a Codex sandbox.' "${log}" ||
              grep -Fq 'Skipping test in ' "${log}"; then
              early_skip=1
            fi
            result_line="$(grep -F 'test result:' "${log}" | tail -n 1 | tr '\t\r' '  ' | cut -c1-240 || true)"
            diagnostics="$(
              {
                if [[ "${early_skip}" -ne 0 ]]; then
                  printf 'execution_category=early_skip\n'
                fi
                grep -E '^(queue:|explicit:|child stop:|diagnostic_phase=)' "${log}" \
                  | tail -n 8 \
                  | cut -c1-256 \
                  | sed 's/^/fixture=/' || true
                if grep -Fq '!IsConfigurablePoolInitialized()' "${log}"; then
                  printf 'pa_fatal_guard=detected\n'
                fi
                grep -oE 'error\[E[0-9]{4}\]' "${log}" \
                  | sort -u \
                  | sed -E -n '1,4s/error\[E([0-9]{4})\]/rustc_error_code=E\1/p' || true
                if grep -Eq 'error: linking with .* failed|link\.exe.*failed' "${log}"; then
                  printf 'compiler_error_category=linker_failure\n'
                fi
                if grep -Fq 'error: failed to run custom build command' "${log}"; then
                  printf 'compiler_error_category=custom_build_script_failure\n'
                fi
                if grep -Fq 'error: could not compile' "${log}"; then
                  printf 'compiler_error_category=rustc_compile_failure\n'
                fi
                grep -F 'panicked at' "${log}" \
                  | tr '\\' '/' \
                  | grep -oE '(codex-rs/)?(core|ext/queue|voice-host|code-mode-host|code-mode-runtime|codex-mcp)/[^[:space:]:]+\.rs:[0-9]+:[0-9]+' \
                  | sed -E 's#^(codex-rs/)?#codex-rs/#' \
                  | sort -u \
                  | sed -n '1,3s/^/panic_source=/' || true
                grep -oE 'ExitStatus\([0-9]+\)' "${log}" \
                  | grep -oE '[0-9]+' \
                  | sort -u \
                  | sed -n '1,4s/^/child_exit_status=/' || true
              } | sed -n '1,16p' | tr '\t\r\n' '   ' | cut -c1-1024
            )"
            status=FAIL
            if [[ "${bazel_status}" -eq 0 && "${tee_status}" -eq 0 && "${local_config_count}" == "1" &&
                  "${pass_line_count}" == "1" && "${early_skip}" -eq 0 &&
                  "${result_line}" == *"1 passed; 0 failed"* ]]; then
              status=PASS
            else
              failures=$((failures + 1))
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "${selector}" "${target}" "${status}" "${bazel_status}" "${tee_status}" "${pass_line_count}" "${early_skip}" "${result_line}" "${diagnostics}" >> "${NATIVE_TEST_REPORT}"
            printf '%s: %s (%s); Bazel exit=%s; tee exit=%s; exact pass lines=%s; early skip=%s; result=%s; diagnostics=%s\n' "${status}" "${selector}" "${target}" "${bazel_status}" "${tee_status}" "${pass_line_count}" "${early_skip}" "${result_line}" "${diagnostics}"
          done

          [[ "${failures}" -eq 0 ]]

      - name: Check formatting of the changed Rust files with pinned Rust 1.95
        if: always() && steps.verify_source.outcome == 'success'
        shell: pwsh
        run: |
          & rustup run 1.95.0 rustfmt --version *> $null
          if ($LASTEXITCODE -ne 0) {
            & rustup toolchain install 1.95.0 --profile minimal --component rustfmt
            if ($LASTEXITCODE -ne 0) {
              throw "Pinned minimal Rust 1.95 with rustfmt could not be installed."
            }
            & rustup run 1.95.0 rustfmt --version *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Pinned Rust 1.95 rustfmt remains unavailable after installation."
            }
          }

          & rustup run 1.95.0 rustfmt --check --edition 2024 --config-path codex-rs/rustfmt.toml --config 'imports_granularity=Item,skip_children=true' codex-rs/core/tests/suite/subagent_notifications.rs codex-rs/ext/queue/tests/queue_service.rs codex-rs/windows-sandbox-rs/tests/helper_manifest.rs codex-rs/rmcp-client/src/perform_oauth_login.rs codex-rs/rmcp-client/tests/mcp_2026_mrtr.rs codex-rs/rmcp-client/tests/streamable_http_recovery/telemetry_tests.rs
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Rust 1.95 rustfmt check failed for the six changed Rust files."
          }

      - name: Check for a clean worktree
        if: always() && !cancelled() && steps.verify_source.outcome == 'success'
        uses: ./.github/actions/check-clean-worktree

      - name: Upload fixed-selector identity and result receipt
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-windows-fixed-selectors-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-windows-fixed-selectors-${{ github.run_id }}-${{ github.run_attempt }}.tsv
          if-no-files-found: warn
          retention-days: 3
