name: Windows delete boundary experiment

on:
  push:
    branches:
      - validation/windows-delete-boundary-20260718
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Full Windows sandbox unit suite
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          cache-scope: windows-delete-boundary-experiment

      - name: Run Windows sandbox unit suite
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-cross-compile \
            --remote-download-toplevel \
            -- \
            test \
            --skip_incompatible_explicit_targets \
            --local_test_jobs=1 \
            --test_output=errors \
            -- \
            //codex-rs/windows-sandbox-rs:windows-sandbox-rs-unit-tests
