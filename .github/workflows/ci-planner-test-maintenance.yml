name: CI planner fixture maintenance

on:
  push:
    branches:
      - ci/path-aware-blocking-checks

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.repository == 'sednalabs/codex' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v7
        with:
          ref: ci/path-aware-blocking-checks
          fetch-depth: 1

      - name: Replace stale CodeQL planner fixture
        shell: bash
        env:
          REPLACEMENT_ZLIB_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import zlib
          from pathlib import Path

          path = Path('.github/scripts/test_ci_planners.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '    def test_codeql_advanced_workflow_is_authoritative_hardened_setup(self) -> None:\n'
          end_marker = '    def test_closed_pr_run_canceller_preserves_post_merge_branch_runs(self) -> None:\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit('expected CodeQL test markers not found')
          replacement = zlib.decompress(base64.b64decode(os.environ['REPLACEMENT_ZLIB_B64'])).decode('utf-8')
          updated = text[:start] + replacement + text[end:]
          if updated == text:
              print('fixture already current')
              raise SystemExit(0)
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit fixture update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/scripts/test_ci_planners.py; then
            echo 'No fixture update required.'
            exit 0
          fi
          git config user.name 'Sedna CI maintenance'
          git config user.email 'ci-maintenance@users.noreply.github.com'
          git add .github/scripts/test_ci_planners.py
          git commit -m 'ci: update CodeQL planner contract test'
          git push origin HEAD:ci/path-aware-blocking-checks
