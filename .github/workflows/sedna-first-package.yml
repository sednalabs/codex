name: sedna-first-package
run-name: >-
  sedna-first-package
  [event=${{ github.event_name }} host=${{ github.sha }}]

on:
  pull_request:
    branches:
      - main
    paths:
      - ".bazelrc"
      - ".bazelversion"
      - ".cargo/**"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "codex-rs/**"
      - "justfile"
      - "scripts/build_codex_package.py"
      - "scripts/codex_package/**"
      - "sdk/python/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "rust-toolchain.toml"
    # Candidate code remains in an unprivileged pull_request context.
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      operation:
        description: Generate selected-tree outputs, or build and consume this protected main commit.
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - package

concurrency:
  group: sedna-first-package-${{ github.event.pull_request.number || github.ref }}-${{ inputs.operation || 'package' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  identity:
    name: Bind exact source and workflow host
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      source_tree: ${{ steps.identity.outputs.source_tree }}
      source_short: ${{ steps.identity.outputs.source_short }}
      package_version: ${{ steps.identity.outputs.package_version }}
      workflow_host_sha: ${{ steps.identity.outputs.workflow_host_sha }}
      workflow_host_tree: ${{ steps.identity.outputs.workflow_host_tree }}
      package_available: ${{ steps.identity.outputs.package_available }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable identities and package version
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_HOST_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          OPERATION_INPUT: ${{ inputs.operation }}
          SELECTED_BASE_SHA: be2e129ecd67d900c016eda12d5d193e33d9c3da
        run: |
          set -euo pipefail

          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The event source is not one exact lowercase 40-character commit SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${WORKFLOW_HOST_SHA}" ]]; then
            echo "The identity checkout does not match the workflow host SHA." >&2
            exit 1
          fi
          if ! git cat-file -e "${SOURCE_SHA}^{commit}"; then
            echo "The event source commit is not present in the workflow-host checkout." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${SOURCE_SHA}" "${WORKFLOW_HOST_SHA}"; then
            echo "The event source is not an ancestor of this workflow host." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Refusing to qualify a dirty source checkout." >&2
            git status --short >&2
            exit 1
          fi

          source_tree="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          workflow_host_tree="$(git rev-parse "${WORKFLOW_HOST_SHA}^{tree}")"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${PR_BASE_REF}" != "main" || "${PR_HEAD_REPOSITORY}" != "${REPOSITORY}" ]]; then
              echo "Only same-repository pull requests targeting main use this package route." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "${SELECTED_BASE_SHA}" "${SOURCE_SHA}"; then
              echo "The pull-request candidate is not descended from the selected be2e base." >&2
              exit 1
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${EVENT_REF}" != "refs/heads/main" || "${SOURCE_SHA}" != "${WORKFLOW_HOST_SHA}" ]]; then
              echo "Manual runs must use this protected main workflow-host commit as their source." >&2
              exit 1
            fi
            if [[ "${OPERATION_INPUT}" != "prepare" && "${OPERATION_INPUT}" != "package" ]]; then
              echo "Manual operation must be prepare or package." >&2
              exit 1
            fi
          else
            echo "Unsupported event for the package route." >&2
            exit 1
          fi

          source_short="$(git rev-parse --short=8 "${SOURCE_SHA}")"
          latest_tag="$(git tag --merged "${SOURCE_SHA}" --list 'v*-sedna.*' --sort=-version:refname | head -n 1)"
          if [[ -n "${latest_tag}" ]]; then
            base_version="${latest_tag#v}"
          else
            base_version="0.0.0-sedna.0"
          fi
          package_version="${base_version}-ci.${GITHUB_RUN_NUMBER}+g${source_short}"

          required_package_paths=(
            "justfile"
            "scripts/codex_package/test_cargo.py"
            "scripts/codex_package/test_layout.py"
            "scripts/codex_package/smoke_tests/pyproject.toml"
            "scripts/codex_package/smoke_tests/uv.lock"
            "scripts/codex_package/smoke_tests/test_codex_package.py"
            "scripts/codex_package/smoke_tests/fixtures.py"
            "scripts/codex_package/smoke_tests/conftest.py"
            "scripts/codex_package/smoke_tests/first_binary/test_tui_package_version.py"
            "scripts/codex_package/smoke_tests/first_binary/test_tui_agents_acceptance.py"
            "scripts/codex_package/smoke_tests/first_binary/test_agent_control_model_acceptance.py"
            "scripts/codex_package/smoke_tests/first_binary/test_agent_control_tui_acceptance.py"
            "scripts/codex_package/smoke_tests/first_binary/tui_pty.py"
            "sdk/python/tests/app_server_harness.py"
            "sdk/python/tests/test_app_server_harness_request_routing.py"
            "sdk/python/src/openai_codex/__init__.py"
          )
          missing_package_paths=()
          for path in "${required_package_paths[@]}"; do
            if ! git cat-file -e "${SOURCE_SHA}:${path}" 2>/dev/null; then
              missing_package_paths+=("${path}")
            fi
          done
          if ! justfile_contents="$(git show "${SOURCE_SHA}:justfile" 2>/dev/null)" || ! grep -Fq "assemble-codex-package" <<< "${justfile_contents}"; then
            missing_package_paths+=("justfile:assemble-codex-package")
          fi
          if [[ "${#missing_package_paths[@]}" -eq 0 ]]; then
            package_available=true
          else
            package_available=false
            echo "Package artifacts are unavailable for this exact source; required package inputs are missing:" >&2
            printf '  %s\n' "${missing_package_paths[@]}" >&2
            echo "::notice title=Package route not yet available::No package or consumer proof will be produced until the exact source includes the assembler and smoke-test inputs."
          fi

          {
            echo "source_sha=${SOURCE_SHA}"
            echo "source_tree=${source_tree}"
            echo "source_short=${source_short}"
            echo "package_version=${package_version}"
            echo "workflow_host_sha=${WORKFLOW_HOST_SHA}"
            echo "workflow_host_tree=${workflow_host_tree}"
            echo "package_available=${package_available}"
          } >> "${GITHUB_OUTPUT}"

  prepare-source:
    name: Generate exact-source locks and schemas
    if: ${{ needs.identity.outputs.package_available == 'true' }}
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    outputs:
      source_ready: ${{ steps.generate.outputs.source_ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact source for preparation
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.identity.outputs.source_tree }}
          WORKFLOW_HOST_SHA: ${{ needs.identity.outputs.workflow_host_sha }}
          WORKFLOW_HOST_TREE: ${{ needs.identity.outputs.workflow_host_tree }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${WORKFLOW_HOST_SHA}" || "$(git rev-parse HEAD^{tree})" != "${WORKFLOW_HOST_TREE}" ]]; then
            echo "The preparation checkout does not match the frozen workflow-host identity." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${SOURCE_SHA}^{tree}")" != "${SOURCE_TREE}" ]]; then
            echo "The preparation source does not match the frozen source tree." >&2
            exit 1
          fi
          git checkout --detach "${SOURCE_SHA}"
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" || -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Could not check out a clean exact source tree for preparation." >&2
            exit 1
          fi

      - name: Set up standard CI tools and Bazel
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Configure source-matched rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Set up Python for the generated SDK output
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.3"

      - name: Generate selected-source locks, schemas, and status snapshots
        id: generate
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          EXPECTED_SOURCE_TREE: ${{ needs.identity.outputs.source_tree }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${EXPECTED_SOURCE_SHA}" || "$(git rev-parse HEAD^{tree})" != "${EXPECTED_SOURCE_TREE}" ]]; then
            echo "The preparation checkout does not match the frozen source identity." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Refusing to generate outputs from a dirty source checkout." >&2
            git status --short >&2
            exit 1
          fi

          (cd codex-rs && cargo update --workspace)
          just write-config-schema
          (
            cd codex-rs
            CODEX_TEST_STATUS_START_DIAGNOSTIC=1 INSTA_UPDATE=always cargo test -p codex-tui --lib \
              status::tests::status_snapshot_shows_chatgpt_plan_without_email \
              -- --exact --nocapture
          )
          (
            cd codex-rs
            INSTA_UPDATE=always cargo test -p codex-tui --lib status::tests \
              -- --test-threads=1 --skip status::tests::status_snapshot_shows_chatgpt_plan_without_email
          )
          just write-app-server-schema
          just bazel-lock-update

          python3 scripts/codex_package/test_cargo.py
          python3 scripts/codex_package/test_layout.py
          git diff --check

          untracked="$(git ls-files --others --exclude-standard)"
          case "${untracked}" in
            "") ;;
            "codex-rs/app-server-protocol/schema/typescript/v2/WaitAgentOutcome.ts")
              git add -- "${untracked}"
              ;;
            *)
              echo "Unexpected untracked output from the fixed generators." >&2
              printf '%s\n' "${untracked}" >&2
              exit 1
              ;;
          esac
          git diff --check HEAD

          output_dir="${RUNNER_TEMP}/sedna-first-generated"
          mkdir -p "${output_dir}"
          git diff --binary HEAD > "${output_dir}/generated-outputs.patch"
          git diff --name-only HEAD > "${output_dir}/generated-paths.txt"
          git diff --stat HEAD > "${output_dir}/generated-stat.txt"
          if [[ -z "$(git diff --name-only HEAD)" ]]; then
            source_ready=true
          else
            source_ready=false
          fi
          echo "source_ready=${source_ready}" >> "${GITHUB_OUTPUT}"
          python3 - <<'PY' > "${output_dir}/generated-identity.json"
          import json
          import os
          import subprocess
          import sys

          payload = {
              "sourceCommit": os.environ["EXPECTED_SOURCE_SHA"],
              "sourceTree": os.environ["EXPECTED_SOURCE_TREE"],
              "workflowHostCommit": os.environ["GITHUB_SHA"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "generatedPaths": subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD"], text=True
              ).splitlines(),
          }
          json.dump(payload, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PY

      - name: Upload generated output for reviewed source intake
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-first-generated-${{ needs.identity.outputs.source_short }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sedna-first-generated/*
          if-no-files-found: error
          retention-days: 3

  package-unavailable:
    name: Package route unavailable for this exact source
    if: ${{ needs.identity.outputs.package_available != 'true' }}
    needs: identity
    runs-on: ubuntu-24.04
    steps:
      - name: Report missing package inputs without claiming artifact proof
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        run: |
          echo "Package preparation and package consumption are skipped for ${SOURCE_SHA}."
          echo "The identity job listed the missing assembler/smoke-test inputs; this is not package or consumer acceptance."

  build-package:
    name: Build exact Linux package pair (${{ matrix.target }})
    if: ${{ needs.identity.outputs.package_available == 'true' && needs.prepare-source.outputs.source_ready == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'package')) }}
    needs:
      - identity
      - prepare-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: x86_64
            binary_kind: x86-64
            loader: /lib64/ld-linux-x86-64.so.2
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: aarch64
            binary_kind: ARM aarch64
            loader: /lib/ld-linux-aarch64.so.1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 210
    env:
      CARGO_INCREMENTAL: "0"
      SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
      SOURCE_TREE: ${{ needs.identity.outputs.source_tree }}
      PACKAGE_VERSION: ${{ needs.identity.outputs.package_version }}
      WORKFLOW_HOST_SHA: ${{ needs.identity.outputs.workflow_host_sha }}
      WORKFLOW_HOST_TREE: ${{ needs.identity.outputs.workflow_host_tree }}
      TARGET: ${{ matrix.target }}
      BINARY_KIND: ${{ matrix.binary_kind }}
      LOADER: ${{ matrix.loader }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact source for packaging
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.identity.outputs.source_tree }}
          WORKFLOW_HOST_SHA: ${{ needs.identity.outputs.workflow_host_sha }}
          WORKFLOW_HOST_TREE: ${{ needs.identity.outputs.workflow_host_tree }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${WORKFLOW_HOST_SHA}" || "$(git rev-parse HEAD^{tree})" != "${WORKFLOW_HOST_TREE}" ]]; then
            echo "The package checkout does not match the frozen workflow-host identity." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${SOURCE_SHA}^{tree}")" != "${SOURCE_TREE}" ]]; then
            echo "The package source does not match the frozen source tree." >&2
            exit 1
          fi
          git checkout --detach "${SOURCE_SHA}"
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" || -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Could not check out a clean exact source tree for packaging." >&2
            exit 1
          fi

      - name: Prepare standard Linux CI build paths
        uses: ./.github/actions/setup-ci

      - name: Install Linux package build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Configure source-matched rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build canonical packages and shipped proxy
        working-directory: codex-rs
        shell: bash
        env:
          DIST_DIR: ${{ runner.temp }}/sedna-first-dist
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" || "$(git rev-parse HEAD^{tree})" != "${SOURCE_TREE}" ]]; then
            echo "The package checkout does not match the frozen source identity." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Refusing to package a dirty source checkout." >&2
            git status --short >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${WORKFLOW_HOST_SHA}^{tree}")" != "${WORKFLOW_HOST_TREE}" ]]; then
            echo "The workflow-host checkout does not match its frozen tree." >&2
            exit 1
          fi

          mkdir -p "${DIST_DIR}"
          cargo build --locked --target "${TARGET}" --release --bin codex-responses-api-proxy
          just --justfile ../justfile assemble-codex-package \
            --target "${TARGET}" \
            --variant codex \
            --package-version "${PACKAGE_VERSION}" \
            --cargo-profile release \
            --archive-output "${DIST_DIR}/codex-cli-${TARGET}.tar.gz" \
            --force
          just --justfile ../justfile assemble-codex-package \
            --target "${TARGET}" \
            --variant codex-app-server \
            --package-version "${PACKAGE_VERSION}" \
            --cargo-profile release \
            --archive-output "${DIST_DIR}/codex-app-server-${TARGET}.tar.gz" \
            --force

          install -Dm 0755 "${CARGO_TARGET_DIR}/${TARGET}/release/codex-responses-api-proxy" \
            "${DIST_DIR}/codex-responses-api-proxy"
          file "${CARGO_TARGET_DIR}/${TARGET}/release/codex" | grep -F "${BINARY_KIND}"
          file "${DIST_DIR}/codex-responses-api-proxy" | grep -F "${BINARY_KIND}"
          readelf -l "${CARGO_TARGET_DIR}/${TARGET}/release/codex" | grep -F "${LOADER}"
          "${DIST_DIR}/codex-responses-api-proxy" --help >/dev/null

          symbols_dir="${RUNNER_TEMP}/sedna-first-symbols"
          mkdir -p "${symbols_dir}"
          for binary in codex codex-app-server codex-code-mode-host; do
            objcopy --only-keep-debug \
              "${CARGO_TARGET_DIR}/${TARGET}/release/${binary}" \
              "${symbols_dir}/${binary}.debug"
          done
          tar -C "${symbols_dir}" -czf "${DIST_DIR}/symbols.tar.gz" .

          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "The package build changed tracked source or produced unexpected source files." >&2
            git status --short >&2
            exit 1
          fi

          python3 - <<'PY' > "${DIST_DIR}/release-manifest.json"
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          dist = Path(os.environ["DIST_DIR"])
          artifact_hashes = {}
          for path in sorted(dist.iterdir(), key=lambda item: item.name):
              if path.is_file() and path.name != "release-manifest.json":
                  digest = hashlib.sha256()
                  with path.open("rb") as artifact:
                      for chunk in iter(lambda: artifact.read(1024 * 1024), b""):
                          digest.update(chunk)
                  artifact_hashes[path.name] = digest.hexdigest()

          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sourceCommit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "sourceTree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "workflowHostCommit": os.environ["WORKFLOW_HOST_SHA"],
              "workflowHostTree": os.environ["WORKFLOW_HOST_TREE"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflow": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "target": os.environ["TARGET"],
              "packageVersion": os.environ["PACKAGE_VERSION"],
              "artifacts": artifact_hashes,
          }
          json.dump(payload, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PY

          (cd "${DIST_DIR}" && sha256sum codex-cli-*.tar.gz codex-app-server-*.tar.gz codex-responses-api-proxy symbols.tar.gz release-manifest.json > SHA256SUMS.txt)

      - name: Upload exact package, helper, and symbol artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-first-package-${{ needs.identity.outputs.source_short }}-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sedna-first-dist/*
          if-no-files-found: error
          retention-days: 30

  consume-package:
    name: Consume exact downloaded packages (${{ matrix.target }})
    if: ${{ needs.identity.outputs.package_available == 'true' && needs.prepare-source.outputs.source_ready == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'package')) }}
    needs:
      - identity
      - prepare-source
      - build-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: x86_64
            binary_kind: x86-64
            loader: /lib64/ld-linux-x86-64.so.2
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: aarch64
            binary_kind: ARM aarch64
            loader: /lib/ld-linux-aarch64.so.1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
      SOURCE_TREE: ${{ needs.identity.outputs.source_tree }}
      PACKAGE_VERSION: ${{ needs.identity.outputs.package_version }}
      WORKFLOW_HOST_SHA: ${{ needs.identity.outputs.workflow_host_sha }}
      WORKFLOW_HOST_TREE: ${{ needs.identity.outputs.workflow_host_tree }}
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact source for package consumption
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.identity.outputs.source_tree }}
          WORKFLOW_HOST_SHA: ${{ needs.identity.outputs.workflow_host_sha }}
          WORKFLOW_HOST_TREE: ${{ needs.identity.outputs.workflow_host_tree }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${WORKFLOW_HOST_SHA}" || "$(git rev-parse HEAD^{tree})" != "${WORKFLOW_HOST_TREE}" ]]; then
            echo "The consumer checkout does not match the frozen workflow-host identity." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${SOURCE_SHA}^{tree}")" != "${SOURCE_TREE}" ]]; then
            echo "The consumer source does not match the frozen source tree." >&2
            exit 1
          fi
          git checkout --detach "${SOURCE_SHA}"
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" || -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Could not check out a clean exact source tree for package consumption." >&2
            exit 1
          fi

      - name: Download the exact same-run architecture artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sedna-first-package-${{ needs.identity.outputs.source_short }}-${{ matrix.arch }}-${{ github.run_id }}
          path: dist

      - name: Verify artifact identity, hashes, and packaged architecture
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("dist/release-manifest.json").read_text())
          expected = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sourceCommit": os.environ["SOURCE_SHA"],
              "sourceTree": os.environ["SOURCE_TREE"],
              "workflowHostCommit": os.environ["WORKFLOW_HOST_SHA"],
              "workflowHostTree": os.environ["WORKFLOW_HOST_TREE"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "target": os.environ["TARGET"],
              "packageVersion": os.environ["PACKAGE_VERSION"],
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Artifact identity mismatch for {key}.")

          checksum_artifacts = {}
          for line in Path("dist/SHA256SUMS.txt").read_text().splitlines():
              digest, filename = line.split("  ", 1)
              if filename != "release-manifest.json":
                  checksum_artifacts[filename] = digest
          if manifest.get("artifacts") != checksum_artifacts:
              raise SystemExit("Release manifest artifact digests do not match SHA256SUMS.txt.")
          PY

          verification_dir="${RUNNER_TEMP}/sedna-first-verify"
          mkdir -p "${verification_dir}/cli" "${verification_dir}/app-server"
          tar -xzf "dist/codex-cli-${TARGET}.tar.gz" -C "${verification_dir}/cli"
          tar -xzf "dist/codex-app-server-${TARGET}.tar.gz" -C "${verification_dir}/app-server"
          for binary in \
            "${verification_dir}/cli/bin/codex" \
            "${verification_dir}/cli/bin/codex-code-mode-host" \
            "${verification_dir}/app-server/bin/codex-app-server" \
            "${verification_dir}/app-server/bin/codex-code-mode-host" \
            "dist/codex-responses-api-proxy"; do
            file "${binary}" | grep -F '${{ matrix.binary_kind }}'
            readelf -l "${binary}" | grep -F '${{ matrix.loader }}'
          done
          chmod 0755 dist/codex-responses-api-proxy
          test -x dist/codex-responses-api-proxy
          dist/codex-responses-api-proxy --help >/dev/null

      - name: Set up Python consumer environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.3"

      - name: Run existing package and exact packaged TUI consumers
        shell: bash
        env:
          PYTHONPATH: sdk/python/src:sdk/python/tests
        run: |
          set -euo pipefail
          smoke_project="scripts/codex_package/smoke_tests"
          uv sync --project "${smoke_project}" --frozen
          uv run --project "${smoke_project}" --frozen --no-sync pytest -q \
            scripts/codex_package/smoke_tests/test_codex_package.py \
            scripts/codex_package/smoke_tests/first_binary/test_tui_package_version.py \
            scripts/codex_package/smoke_tests/first_binary/test_tui_agents_acceptance.py \
            scripts/codex_package/smoke_tests/first_binary/test_agent_control_model_acceptance.py \
            scripts/codex_package/smoke_tests/first_binary/test_agent_control_tui_acceptance.py \
            sdk/python/tests/test_app_server_harness_request_routing.py \
            --compression gzip \
            --package-target "${TARGET}" \
            --cli-archive "dist/codex-cli-${TARGET}.tar.gz" \
            --app-server-archive "dist/codex-app-server-${TARGET}.tar.gz" \
            --symbols-archive "dist/symbols.tar.gz"
