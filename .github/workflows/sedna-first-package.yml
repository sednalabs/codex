name: sedna-first-package
run-name: >-
  sedna-first-package
  [event=${{ github.event_name }} host=${{ github.sha }}]

on:
  pull_request:
    branches:
      - main
    paths:
      - ".bazelrc"
      - ".bazelversion"
      - ".cargo/**"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "codex-rs/**"
      - "justfile"
      - "scripts/codex_package/**"
      - "sdk/python/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "rust-toolchain.toml"
    # Candidate code remains in an unprivileged pull_request context.
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      operation:
        description: Generate selected-tree outputs, build this protected main commit, or re-consume the exact reviewed 016 package artifacts.
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - package
          - consume-existing

concurrency:
  group: sedna-first-package-${{ github.event.pull_request.number || github.ref }}-${{ inputs.operation || 'package' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  identity:
    name: Bind exact source and workflow host
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      source_tree: ${{ steps.identity.outputs.source_tree }}
      source_short: ${{ steps.identity.outputs.source_short }}
      package_version: ${{ steps.identity.outputs.package_version }}
      workflow_host_sha: ${{ steps.identity.outputs.workflow_host_sha }}
      workflow_host_tree: ${{ steps.identity.outputs.workflow_host_tree }}
      package_available: ${{ steps.identity.outputs.package_available }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable identities and package version
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_HOST_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          OPERATION_INPUT: ${{ inputs.operation }}
          EXPECTED_PRODUCER_SOURCE_SHA: "016eb01eaa03727e5c2dfe2d31e4f4aab88badbe"
          EXPECTED_PRODUCER_SOURCE_TREE: "08af5e4f4f8697af5ea990b2015e90b0034aa7ce"
          EXPECTED_PRODUCER_PACKAGE_VERSION: "0.166.0+sedna.1013.g016eb01e"
          CONSUMER_PARENT_SHA: "dcaeb1486fe53bde7d842f96974aea14846f3950"
        run: |
          set -euo pipefail

          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The event source is not one exact lowercase 40-character commit SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${WORKFLOW_HOST_SHA}" ]]; then
            echo "The identity checkout does not match the workflow host SHA." >&2
            exit 1
          fi
          if ! git cat-file -e "${SOURCE_SHA}^{commit}"; then
            echo "The event source commit is not present in the workflow-host checkout." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${SOURCE_SHA}" "${WORKFLOW_HOST_SHA}"; then
            echo "The event source is not an ancestor of this workflow host." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Refusing to qualify a dirty source checkout." >&2
            git status --short >&2
            exit 1
          fi

          source_tree="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          workflow_host_tree="$(git rev-parse "${WORKFLOW_HOST_SHA}^{tree}")"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${PR_HEAD_REPOSITORY}" != "${REPOSITORY}" || "${PR_BASE_REF}" != "main" ]]; then
              echo "Only same-repository pull requests to main use this package route." >&2
              exit 1
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${SOURCE_SHA}" != "${WORKFLOW_HOST_SHA}" ]]; then
              echo "Manual runs require the selected ref as their exact source and workflow host." >&2
              exit 1
            fi
            if [[ "${OPERATION_INPUT}" != "prepare" && "${OPERATION_INPUT}" != "package" && "${OPERATION_INPUT}" != "consume-existing" ]]; then
              echo "Manual operation must be prepare, package, or consume-existing." >&2
              exit 1
            fi
            if [[ "${OPERATION_INPUT}" == "prepare" && "${EVENT_REF}" != refs/heads/* ]]; then
              echo "Manual preparation requires a branch ref." >&2
              exit 1
            fi
            if [[ "${OPERATION_INPUT}" == "package" && "${EVENT_REF}" != "refs/heads/main" ]]; then
              echo "Manual package builds and consumers require protected main." >&2
              exit 1
            fi
            if [[ "${OPERATION_INPUT}" == "consume-existing" ]]; then
              if [[ "${EVENT_REF}" != "refs/heads/work/upstream-convergence-0184-20261116" ]]; then
                echo "Existing-package consumption is limited to the exact convergence branch." >&2
                exit 1
              fi
              if [[ "$(git rev-parse "${WORKFLOW_HOST_SHA}^")" != "${CONSUMER_PARENT_SHA}" ]]; then
                echo "Existing-package consumption requires the reviewed consumer-only successor." >&2
                exit 1
              fi
              expected_changed_paths=(
                ".github/workflows/sedna-first-package.yml"
                "bazel/rules/testing/wine/BUILD.bazel"
                "codex-rs/core/tests/remote_env_windows/BUILD.bazel"
                "codex-rs/state/src/migrations_tests.rs"
                "scripts/codex_package/smoke_tests/test_codex_package.py"
              )
              mapfile -t actual_changed_paths < <(git diff --name-only "${EXPECTED_PRODUCER_SOURCE_SHA}" "${WORKFLOW_HOST_SHA}" | LC_ALL=C sort)
              mapfile -t expected_changed_paths < <(printf '%s\n' "${expected_changed_paths[@]}" | LC_ALL=C sort)
              if [[ "${actual_changed_paths[*]}" != "${expected_changed_paths[*]}" ]]; then
                echo "Existing-package consumption refuses any source delta beyond the reviewed test/workflow files." >&2
                printf '%s\n' "${actual_changed_paths[@]}" >&2
                exit 1
              fi
              expected_path_blobs=(
                "bazel/rules/testing/wine/BUILD.bazel 77faa6c3c44bd8d0fe550bd50d31e9823b1cc3f2"
                "codex-rs/core/tests/remote_env_windows/BUILD.bazel 9deacf76ebd73882627333402c87d847184e50bf"
                "codex-rs/state/src/migrations_tests.rs 221ce1085ebf568058be9e6910715e4f8cc18039"
                "scripts/codex_package/smoke_tests/test_codex_package.py 12afe7dd4785cc308782bc2ec0b4719c94ce60c2"
              )
              for expected_entry in "${expected_path_blobs[@]}"; do
                read -r path expected_blob_sha <<< "${expected_entry}"
                actual_blob_sha="$(git rev-parse "${WORKFLOW_HOST_SHA}:${path}")"
                if [[ "${actual_blob_sha}" != "${expected_blob_sha}" ]]; then
                  echo "Existing-package consumption refuses an unreviewed consumer input: ${path}." >&2
                  exit 1
                fi
              done
            fi
          else
            echo "Unsupported event for the package route." >&2
            exit 1
          fi

          source_short="$(git rev-parse --short=8 "${SOURCE_SHA}")"
          latest_tag="$(git tag --merged "${SOURCE_SHA}" --list 'v*-sedna.*' --sort=-version:refname | head -n 1)"
          tag_is_above_model_floor=false
          if [[ -n "${latest_tag}" ]]; then
            tag_core="${latest_tag#v}"
            tag_core="${tag_core%%[-+]*}"
            IFS=. read -r tag_major tag_minor tag_patch _ <<< "${tag_core}"
            if (( tag_major > 0 || tag_minor > 166 || (tag_minor == 166 && tag_patch > 0) )); then
              tag_is_above_model_floor=true
            fi
          fi

          if [[ "${tag_is_above_model_floor}" == "true" ]]; then
            base_version="${latest_tag#v}"
            if [[ "${base_version}" == *+* ]]; then
              base_build_metadata="${base_version#*+}"
              base_version="${base_version%%+*}"
              package_version="${base_version}-ci.${GITHUB_RUN_NUMBER}+${base_build_metadata}.g${source_short}"
            else
              package_version="${base_version}-ci.${GITHUB_RUN_NUMBER}+g${source_short}"
            fi
          else
            # The current upstream model catalog requires Codex 0.166.0 for
            # GPT-6.2. Keep that compatibility version while marking this as
            # an internal source build; do not claim a public release.
            package_version="0.166.0+sedna.${GITHUB_RUN_NUMBER}.g${source_short}"
          fi
          if [[ "${OPERATION_INPUT}" == "consume-existing" ]]; then
            package_version="${EXPECTED_PRODUCER_PACKAGE_VERSION}"
          fi

          required_package_paths=(
            "justfile"
            "scripts/codex_package/test_cargo.py"
            "scripts/codex_package/test_layout.py"
            "scripts/codex_package/smoke_tests/pyproject.toml"
            "scripts/codex_package/smoke_tests/uv.lock"
            "scripts/codex_package/smoke_tests/test_codex_package.py"
            "scripts/codex_package/smoke_tests/conftest.py"
            "scripts/codex_package/smoke_tests/first_binary/test_tui_package_version.py"
            "scripts/codex_package/smoke_tests/first_binary/test_tui_agents_acceptance.py"
            "scripts/codex_package/smoke_tests/first_binary/tui_pty.py"
          )
          missing_package_paths=()
          for path in "${required_package_paths[@]}"; do
            if ! git cat-file -e "${SOURCE_SHA}:${path}" 2>/dev/null; then
              missing_package_paths+=("${path}")
            fi
          done
          if ! justfile_contents="$(git show "${SOURCE_SHA}:justfile" 2>/dev/null)" || ! grep -Fq "assemble-codex-package" <<< "${justfile_contents}"; then
            missing_package_paths+=("justfile:assemble-codex-package")
          fi
          if [[ "${#missing_package_paths[@]}" -eq 0 ]]; then
            package_available=true
          else
            package_available=false
            echo "Package artifacts are unavailable for this exact source; required package inputs are missing:" >&2
            printf '  %s\n' "${missing_package_paths[@]}" >&2
            echo "::notice title=Package route not yet available::No package or consumer proof will be produced until the exact source includes the assembler and smoke-test inputs."
          fi

          {
            echo "source_sha=${SOURCE_SHA}"
            echo "source_tree=${source_tree}"
            echo "source_short=${source_short}"
            echo "package_version=${package_version}"
            echo "workflow_host_sha=${WORKFLOW_HOST_SHA}"
            echo "workflow_host_tree=${workflow_host_tree}"
            echo "package_available=${package_available}"
          } >> "${GITHUB_OUTPUT}"

  prepare-source:
    name: Generate exact-source locks and schemas
    if: ${{ needs.identity.result == 'success' && inputs.operation != 'consume-existing' }}
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    outputs:
      source_ready: ${{ steps.generate.outputs.source_ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact source for preparation
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.identity.outputs.source_tree }}
          WORKFLOW_HOST_SHA: ${{ needs.identity.outputs.workflow_host_sha }}
          WORKFLOW_HOST_TREE: ${{ needs.identity.outputs.workflow_host_tree }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${WORKFLOW_HOST_SHA}" || "$(git rev-parse HEAD^{tree})" != "${WORKFLOW_HOST_TREE}" ]]; then
            echo "The preparation checkout does not match the frozen workflow-host identity." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${SOURCE_SHA}^{tree}")" != "${SOURCE_TREE}" ]]; then
            echo "The preparation source does not match the frozen source tree." >&2
            exit 1
          fi
          git checkout --detach "${SOURCE_SHA}"
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" || -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Could not check out a clean exact source tree for preparation." >&2
            exit 1
          fi

      - name: Set up standard CI tools
        id: setup_ci
        uses: ./.github/actions/setup-ci

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1
          output-base: ${{ steps.setup_ci.outputs.bazel-output-base }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          cache-save: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/upstream-main') }}

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Configure source-matched rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Set up Python for the generated SDK output
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.3"

      - name: Generate selected-source locks, schemas, and status snapshots
        id: generate
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          EXPECTED_SOURCE_TREE: ${{ needs.identity.outputs.source_tree }}
          RUST_MIN_STACK: "8388608"
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${EXPECTED_SOURCE_SHA}" || "$(git rev-parse HEAD^{tree})" != "${EXPECTED_SOURCE_TREE}" ]]; then
            echo "The preparation checkout does not match the frozen source identity." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Refusing to generate outputs from a dirty source checkout." >&2
            git status --short >&2
            exit 1
          fi

          (cd codex-rs && cargo update --workspace)
          just write-config-schema
          (cd codex-rs && INSTA_UPDATE=always cargo test -p codex-tui --lib status::tests -- --skip app::sidebar_subagents::status::tests)
          just write-app-server-schema
          just bazel-lock-update

          python3 scripts/codex_package/test_cargo.py
          python3 scripts/codex_package/test_layout.py
          git diff --check

          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "${untracked}" ]]; then
            while IFS= read -r generated_path; do
              case "${generated_path}" in
                "codex-rs/app-server-protocol/schema/typescript/v2/WaitAgentOutcome.ts"|"codex-rs/app-server-protocol/schema/typescript/CollabAgentWaitCompletionReason.ts"|"codex-rs/app-server-protocol/schema/typescript/CollabAgentWaitReturnWhen.ts")
                  git add -- "${generated_path}"
                  ;;
                *)
                  echo "Unexpected untracked output from the fixed generators." >&2
                  printf '%s\n' "${generated_path}" >&2
                  exit 1
                  ;;
              esac
            done <<< "${untracked}"
          fi
          git diff --check HEAD

          output_dir="${RUNNER_TEMP}/sedna-first-generated"
          mkdir -p "${output_dir}"
          git diff --binary HEAD > "${output_dir}/generated-outputs.patch"
          git diff --name-only HEAD > "${output_dir}/generated-paths.txt"
          git diff --stat HEAD > "${output_dir}/generated-stat.txt"
          if [[ -z "$(git diff --name-only HEAD)" ]]; then
            source_ready=true
          else
            source_ready=false
          fi
          echo "source_ready=${source_ready}" >> "${GITHUB_OUTPUT}"
          python3 - <<'PY' > "${output_dir}/generated-identity.json"
          import json
          import os
          import subprocess
          import sys

          payload = {
              "sourceCommit": os.environ["EXPECTED_SOURCE_SHA"],
              "sourceTree": os.environ["EXPECTED_SOURCE_TREE"],
              "workflowHostCommit": os.environ["GITHUB_SHA"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "generatedPaths": subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD"], text=True
              ).splitlines(),
          }
          json.dump(payload, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PY

      - name: Upload generated output for reviewed source intake
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-first-generated-${{ needs.identity.outputs.source_short }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sedna-first-generated/*
          if-no-files-found: error
          retention-days: 3

  package-unavailable:
    name: Package artifacts unavailable for this exact source
    if: ${{ needs.identity.outputs.package_available != 'true' }}
    needs: identity
    runs-on: ubuntu-24.04
    steps:
      - name: Report package unavailability without claiming artifact proof
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        run: |
          echo "Package build and consumer checks are skipped for ${SOURCE_SHA}."
          echo "The identity job records why this exact source is not package-eligible; this is not package or consumer acceptance."

  build-package:
    name: Build exact Linux package pair (${{ matrix.target }})
    if: ${{ needs.identity.outputs.package_available == 'true' && needs.prepare-source.outputs.source_ready == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'package'))) }}
    needs:
      - identity
      - prepare-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: x86_64
            binary_kind: x86-64
            loader: /lib64/ld-linux-x86-64.so.2
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: aarch64
            binary_kind: ARM aarch64
            loader: /lib/ld-linux-aarch64.so.1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 210
    env:
      CARGO_INCREMENTAL: "0"
      # Use fewer simultaneous rustc processes on the public ARM runner while preserving the x86 default.
      CARGO_BUILD_JOBS: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '2' || '4' }}
      SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
      SOURCE_TREE: ${{ needs.identity.outputs.source_tree }}
      PACKAGE_VERSION: ${{ needs.identity.outputs.package_version }}
      WORKFLOW_HOST_SHA: ${{ needs.identity.outputs.workflow_host_sha }}
      WORKFLOW_HOST_TREE: ${{ needs.identity.outputs.workflow_host_tree }}
      TARGET: ${{ matrix.target }}
      BINARY_KIND: ${{ matrix.binary_kind }}
      LOADER: ${{ matrix.loader }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact source for packaging
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.identity.outputs.source_tree }}
          WORKFLOW_HOST_SHA: ${{ needs.identity.outputs.workflow_host_sha }}
          WORKFLOW_HOST_TREE: ${{ needs.identity.outputs.workflow_host_tree }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${WORKFLOW_HOST_SHA}" || "$(git rev-parse HEAD^{tree})" != "${WORKFLOW_HOST_TREE}" ]]; then
            echo "The package checkout does not match the frozen workflow-host identity." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${SOURCE_SHA}^{tree}")" != "${SOURCE_TREE}" ]]; then
            echo "The package source does not match the frozen source tree." >&2
            exit 1
          fi
          git checkout --detach "${SOURCE_SHA}"
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" || -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Could not check out a clean exact source tree for packaging." >&2
            exit 1
          fi

      - name: Prepare standard Linux CI build paths
        uses: ./.github/actions/setup-ci

      - name: Install Linux package build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Configure source-matched rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build canonical packages and shipped proxy
        working-directory: codex-rs
        shell: bash
        env:
          DIST_DIR: ${{ runner.temp }}/sedna-first-dist
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" || "$(git rev-parse HEAD^{tree})" != "${SOURCE_TREE}" ]]; then
            echo "The package checkout does not match the frozen source identity." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Refusing to package a dirty source checkout." >&2
            git status --short >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${WORKFLOW_HOST_SHA}^{tree}")" != "${WORKFLOW_HOST_TREE}" ]]; then
            echo "The workflow-host checkout does not match its frozen tree." >&2
            exit 1
          fi

          mkdir -p "${DIST_DIR}"
          printf 'Package target=%s runner_arch=%s cargo_jobs=%s\n' "${TARGET}" "$(uname -m)" "${CARGO_BUILD_JOBS}"
          if [[ "${TARGET}" == "aarch64-unknown-linux-gnu" ]]; then
            echo "ARM package runner resource snapshot:"
            printf 'cpu_count='; nproc
            grep -E '^(MemTotal|MemAvailable):' /proc/meminfo
            df -h "${RUNNER_TEMP}" "${GITHUB_WORKSPACE}"
            if [[ -r /proc/pressure/memory ]]; then cat /proc/pressure/memory; fi
          fi
          /usr/bin/time -f 'responses-api-proxy elapsed=%E max-rss-kb=%M exit=%x' \
            cargo build --locked --target "${TARGET}" --release --bin codex-responses-api-proxy
          /usr/bin/time -f 'codex-cli package elapsed=%E max-rss-kb=%M exit=%x' \
            just --justfile ../justfile assemble-codex-package \
              --target "${TARGET}" \
              --variant codex \
              --package-version "${PACKAGE_VERSION}" \
              --cargo-profile release \
              --archive-output "${DIST_DIR}/codex-cli-${TARGET}.tar.gz" \
              --force
          /usr/bin/time -f 'codex-app-server package elapsed=%E max-rss-kb=%M exit=%x' \
            just --justfile ../justfile assemble-codex-package \
              --target "${TARGET}" \
              --variant codex-app-server \
              --package-version "${PACKAGE_VERSION}" \
              --cargo-profile release \
              --archive-output "${DIST_DIR}/codex-app-server-${TARGET}.tar.gz" \
              --force

          install -Dm 0755 "${CARGO_TARGET_DIR}/${TARGET}/release/codex-responses-api-proxy" \
            "${DIST_DIR}/codex-responses-api-proxy"
          file "${CARGO_TARGET_DIR}/${TARGET}/release/codex" | grep -F "${BINARY_KIND}"
          file "${DIST_DIR}/codex-responses-api-proxy" | grep -F "${BINARY_KIND}"
          readelf -l "${CARGO_TARGET_DIR}/${TARGET}/release/codex" | grep -F "${LOADER}"
          "${DIST_DIR}/codex-responses-api-proxy" --help >/dev/null

          symbols_dir="${RUNNER_TEMP}/sedna-first-symbols"
          mkdir -p "${symbols_dir}"
          for binary in codex codex-app-server codex-code-mode-host codex-exec-server; do
            objcopy --only-keep-debug \
              "${CARGO_TARGET_DIR}/${TARGET}/release/${binary}" \
              "${symbols_dir}/${binary}.debug"
          done
          tar -C "${symbols_dir}" -czf "${DIST_DIR}/symbols.tar.gz" .

          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "The package build changed tracked source or produced unexpected source files." >&2
            git status --short >&2
            exit 1
          fi

          python3 - <<'PY' > "${DIST_DIR}/release-manifest.json"
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          dist = Path(os.environ["DIST_DIR"])
          artifact_hashes = {}
          for path in sorted(dist.iterdir(), key=lambda item: item.name):
              if path.is_file() and path.name != "release-manifest.json":
                  digest = hashlib.sha256()
                  with path.open("rb") as artifact:
                      for chunk in iter(lambda: artifact.read(1024 * 1024), b""):
                          digest.update(chunk)
                  artifact_hashes[path.name] = digest.hexdigest()

          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sourceCommit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "sourceTree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "workflowHostCommit": os.environ["WORKFLOW_HOST_SHA"],
              "workflowHostTree": os.environ["WORKFLOW_HOST_TREE"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflow": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "target": os.environ["TARGET"],
              "packageVersion": os.environ["PACKAGE_VERSION"],
              "artifacts": artifact_hashes,
          }
          json.dump(payload, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PY

          (cd "${DIST_DIR}" && sha256sum codex-cli-*.tar.gz codex-app-server-*.tar.gz codex-responses-api-proxy symbols.tar.gz release-manifest.json > SHA256SUMS.txt)

      - name: Upload exact package, helper, and symbol artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-first-package-${{ needs.identity.outputs.source_short }}-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sedna-first-dist/*
          if-no-files-found: error
          retention-days: 30

  consume-package:
    name: Consume exact downloaded packages (${{ matrix.target }})
    # Run each architecture's existing consumer after producers settle; a failed peer must not hide a successful artifact.
    if: ${{ always() && !cancelled() && needs.identity.result == 'success' && needs.identity.outputs.package_available == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.operation == 'consume-existing') || (needs.prepare-source.outputs.source_ready == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'package')))) }}
    needs:
      - identity
      - prepare-source
      - build-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: x86_64
            binary_kind: x86-64
            loader: /lib64/ld-linux-x86-64.so.2
            artifact_id: "14513981218"
            artifact_name: sedna-first-package-016eb01e-x86_64-44481500978
            artifact_digest: sha256:a84e8e1be049b0e1ab4513d77125f9a60c2f35e6ac03e49bc77a341a2d773b64
            artifact_size: "1031691830"
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: aarch64
            binary_kind: ARM aarch64
            loader: /lib/ld-linux-aarch64.so.1
            artifact_id: "14516977287"
            artifact_name: sedna-first-package-016eb01e-aarch64-44481500978
            artifact_digest: sha256:7cdd7a05e04aabf167ca6d149bd6753ac11e8888d29c0c136d24b7f2afade61a
            artifact_size: "1020725213"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
      SOURCE_TREE: ${{ needs.identity.outputs.source_tree }}
      PACKAGE_VERSION: ${{ needs.identity.outputs.package_version }}
      WORKFLOW_HOST_SHA: ${{ needs.identity.outputs.workflow_host_sha }}
      WORKFLOW_HOST_TREE: ${{ needs.identity.outputs.workflow_host_tree }}
      PACKAGE_SOURCE_SHA: ${{ inputs.operation == 'consume-existing' && '016eb01eaa03727e5c2dfe2d31e4f4aab88badbe' || needs.identity.outputs.source_sha }}
      PACKAGE_SOURCE_TREE: ${{ inputs.operation == 'consume-existing' && '08af5e4f4f8697af5ea990b2015e90b0034aa7ce' || needs.identity.outputs.source_tree }}
      PACKAGE_WORKFLOW_HOST_SHA: ${{ inputs.operation == 'consume-existing' && '42c3829a0f7179a1cfd28692e67bcdba1d20ebe9' || needs.identity.outputs.workflow_host_sha }}
      PACKAGE_WORKFLOW_HOST_TREE: ${{ inputs.operation == 'consume-existing' && '08af5e4f4f8697af5ea990b2015e90b0034aa7ce' || needs.identity.outputs.workflow_host_tree }}
      PACKAGE_RUN_ID: ${{ inputs.operation == 'consume-existing' && '44481500978' || github.run_id }}
      EXPECTED_ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_ARTIFACT_NAME: ${{ matrix.artifact_name }}
      EXPECTED_ARTIFACT_DIGEST: ${{ matrix.artifact_digest }}
      EXPECTED_ARTIFACT_SIZE: ${{ matrix.artifact_size }}
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact source for package consumption
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.identity.outputs.source_tree }}
          WORKFLOW_HOST_SHA: ${{ needs.identity.outputs.workflow_host_sha }}
          WORKFLOW_HOST_TREE: ${{ needs.identity.outputs.workflow_host_tree }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${WORKFLOW_HOST_SHA}" || "$(git rev-parse HEAD^{tree})" != "${WORKFLOW_HOST_TREE}" ]]; then
            echo "The consumer checkout does not match the frozen workflow-host identity." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${SOURCE_SHA}^{tree}")" != "${SOURCE_TREE}" ]]; then
            echo "The consumer source does not match the frozen source tree." >&2
            exit 1
          fi
          git checkout --detach "${SOURCE_SHA}"
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" || -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Could not check out a clean exact source tree for package consumption." >&2
            exit 1
          fi

      - name: Verify exact existing producer run and artifact
        if: ${{ inputs.operation == 'consume-existing' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: "44481500978"
          PRODUCER_SOURCE_SHA: "016eb01eaa03727e5c2dfe2d31e4f4aab88badbe"
          PRODUCER_SOURCE_TREE: "08af5e4f4f8697af5ea990b2015e90b0034aa7ce"
          PRODUCER_HOST_SHA: "42c3829a0f7179a1cfd28692e67bcdba1d20ebe9"
          PRODUCER_HOST_TREE: "08af5e4f4f8697af5ea990b2015e90b0034aa7ce"
          PRODUCER_BASE_SHA: "04a76a98ca1c6ebe79417fc5e904f7562c7a0a5b"
          EXPECTED_ARTIFACT_ID: ${{ matrix.artifact_id }}
          EXPECTED_ARTIFACT_NAME: ${{ matrix.artifact_name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ matrix.artifact_digest }}
          EXPECTED_ARTIFACT_SIZE: ${{ matrix.artifact_size }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          run_id = os.environ["PRODUCER_RUN_ID"]
          run = get_json(f"/actions/runs/{run_id}")
          expected_run = {
              "id": int(run_id),
              "name": "sedna-first-package [event=pull_request host=42c3829a0f7179a1cfd28692e67bcdba1d20ebe9]",
              "path": ".github/workflows/sedna-first-package.yml",
              "workflow_id": 378675771,
              "event": "pull_request",
              "head_branch": "work/upstream-convergence-0184-20261116",
              "head_sha": os.environ["PRODUCER_SOURCE_SHA"],
              "run_number": 1013,
              "status": "completed",
          }
          for key, expected in expected_run.items():
              if run.get(key) != expected:
                  raise SystemExit(f"Producer run identity mismatch: {key}.")
          if run.get("head_commit", {}).get("tree_id") != os.environ["PRODUCER_SOURCE_TREE"]:
              raise SystemExit("Producer source tree mismatch.")
          if run.get("repository", {}).get("full_name") != repository:
              raise SystemExit("Producer repository mismatch.")

          pull_requests = run.get("pull_requests", [])
          if len(pull_requests) != 1:
              raise SystemExit("Producer pull-request identity mismatch.")
          pull_request = pull_requests[0]
          if (
              pull_request.get("number") != 1039
              or pull_request.get("head", {}).get("ref") != "work/upstream-convergence-0184-20261116"
              or pull_request.get("head", {}).get("repo", {}).get("full_name") != repository
              or pull_request.get("base", {}).get("ref") != "main"
          ):
              raise SystemExit("Producer pull-request source or base mismatch.")

          host_sha = os.environ["PRODUCER_HOST_SHA"]
          host_commit = get_json(f"/commits/{host_sha}")
          if host_commit.get("sha") != host_sha:
              raise SystemExit("Producer workflow-host commit mismatch.")
          if host_commit.get("commit", {}).get("tree", {}).get("sha") != os.environ["PRODUCER_HOST_TREE"]:
              raise SystemExit("Producer workflow-host tree mismatch.")
          expected_parents = {
              os.environ["PRODUCER_BASE_SHA"],
              os.environ["PRODUCER_SOURCE_SHA"],
          }
          actual_parents = {
              parent.get("sha")
              for parent in host_commit.get("parents", [])
          }
          if actual_parents != expected_parents:
              raise SystemExit("Producer workflow-host ancestry mismatch.")

          producer_jobs = get_json(f"/actions/runs/{run_id}/jobs?per_page=100").get("jobs", [])
          expected_jobs = {
              "Build exact Linux package pair (x86_64-unknown-linux-gnu)",
              "Build exact Linux package pair (aarch64-unknown-linux-gnu)",
          }
          for name in expected_jobs:
              matches = [job for job in producer_jobs if job.get("name") == name]
              if (
                  len(matches) != 1
                  or matches[0].get("run_id") != int(run_id)
                  or matches[0].get("head_sha") != os.environ["PRODUCER_SOURCE_SHA"]
                  or matches[0].get("status") != "completed"
                  or matches[0].get("conclusion") != "success"
              ):
                  raise SystemExit("Producer architecture build did not succeed for the exact source.")

          artifacts = get_json(f"/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts", [])
          matches = [
              item
              for item in artifacts
              if str(item.get("id")) == os.environ["EXPECTED_ARTIFACT_ID"]
          ]
          if len(matches) != 1:
              raise SystemExit("Expected producer artifact ID was not unique.")
          artifact = matches[0]
          expected_artifact = {
              "name": os.environ["EXPECTED_ARTIFACT_NAME"],
              "digest": os.environ["EXPECTED_ARTIFACT_DIGEST"],
              "size_in_bytes": int(os.environ["EXPECTED_ARTIFACT_SIZE"]),
              "expired": False,
          }
          for key, expected in expected_artifact.items():
              if artifact.get(key) != expected:
                  raise SystemExit(f"Producer artifact metadata mismatch: {key}.")
          PY

      - name: Download the exact same-run architecture artifact
        if: ${{ inputs.operation != 'consume-existing' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sedna-first-package-${{ needs.identity.outputs.source_short }}-${{ matrix.arch }}-${{ github.run_id }}
          path: dist

      - name: Download the exact existing producer artifact
        if: ${{ inputs.operation == 'consume-existing' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ matrix.artifact_id }}
          repository: ${{ github.repository }}
          run-id: "44481500978"
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: dist

      - name: Verify artifact identity, hashes, and packaged architecture
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("dist/release-manifest.json").read_text())
          expected = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sourceCommit": os.environ["PACKAGE_SOURCE_SHA"],
              "sourceTree": os.environ["PACKAGE_SOURCE_TREE"],
              "workflowHostCommit": os.environ["PACKAGE_WORKFLOW_HOST_SHA"],
              "workflowHostTree": os.environ["PACKAGE_WORKFLOW_HOST_TREE"],
              "workflowRunId": os.environ["PACKAGE_RUN_ID"],
              "workflow": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["PACKAGE_RUN_ID"]}',
              "target": os.environ["TARGET"],
              "packageVersion": os.environ["PACKAGE_VERSION"],
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Artifact identity mismatch for {key}.")

          checksum_artifacts = {}
          for line in Path("dist/SHA256SUMS.txt").read_text().splitlines():
              digest, filename = line.split("  ", 1)
              if filename != "release-manifest.json":
                  checksum_artifacts[filename] = digest
          if manifest.get("artifacts") != checksum_artifacts:
              raise SystemExit("Release manifest artifact digests do not match SHA256SUMS.txt.")
          PY

          verification_dir="${RUNNER_TEMP}/sedna-first-verify"
          mkdir -p "${verification_dir}/cli" "${verification_dir}/app-server"
          tar -xzf "dist/codex-cli-${TARGET}.tar.gz" -C "${verification_dir}/cli"
          tar -xzf "dist/codex-app-server-${TARGET}.tar.gz" -C "${verification_dir}/app-server"
          for binary in \
            "${verification_dir}/cli/bin/codex" \
            "${verification_dir}/cli/bin/codex-code-mode-host" \
            "${verification_dir}/app-server/bin/codex-app-server" \
            "${verification_dir}/app-server/bin/codex-code-mode-host" \
            "dist/codex-responses-api-proxy"; do
            file "${binary}" | grep -F '${{ matrix.binary_kind }}'
            readelf -l "${binary}" | grep -F '${{ matrix.loader }}'
          done
          chmod 0755 dist/codex-responses-api-proxy
          test -x dist/codex-responses-api-proxy
          dist/codex-responses-api-proxy --help >/dev/null

      - name: Set up Python consumer environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.3"

      - name: Enable Linux sandbox prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run existing package and exact packaged TUI consumers
        shell: bash
        env:
          PYTHONPATH: sdk/python/src:sdk/python/tests
        run: |
          set -euo pipefail
          smoke_project="scripts/codex_package/smoke_tests"
          uv sync --project "${smoke_project}" --frozen
          uv run --project "${smoke_project}" --frozen --no-sync pytest -q \
            scripts/codex_package/smoke_tests/test_codex_package.py \
            scripts/codex_package/smoke_tests/first_binary/test_tui_package_version.py \
            scripts/codex_package/smoke_tests/first_binary/test_tui_agents_acceptance.py \
            --compression gzip \
            --package-target "${TARGET}" \
            --cli-archive "dist/codex-cli-${TARGET}.tar.gz" \
            --app-server-archive "dist/codex-app-server-${TARGET}.tar.gz" \
            --symbols-archive "dist/symbols.tar.gz"
