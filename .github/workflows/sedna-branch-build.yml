                      "manifest_path": manifests[name]["manifest_path"] if name in manifests else "/fixture/Cargo.toml",
                      "dependencies": [{"name": dep} for dep in row.get("dependencies", [])],
                  })
                  nodes.append({"id": ids[name], "dependencies": [ids[dep] for dep in row.get("dependencies", [])]})
              metadata = {"packages": packages, "resolve": {"nodes": nodes}, "workspace_members": list(ids.values())}
              return before, after, metadata, manifests

          controls = []
          validate(*fixture())
          controls.append("exact-lock-positive")
          # One transitive added external identity is joined through the new root.
          transitive = fixture()
          transitive[1]["package"].append({"name": "transitive", "version": "1", "source": "registry+fixture"})
          transitive[2]["packages"].append({"id": "fixture#transitive", "name": "transitive", "version": "1", "source": "registry+fixture"})
          transitive[2]["resolve"]["nodes"].append({"id": "fixture#transitive", "dependencies": []})
          transitive[2]["resolve"]["nodes"][-2]["dependencies"].append("fixture#transitive")
          transitive[1]["package"][-2]["dependencies"] = ["transitive"]
          transitive[2]["packages"][-2]["dependencies"] = [{"name": "transitive"}]
          validate(*transitive)
          controls.append("transitive-closure-positive")
          def negative(label, code, mutate):
              data = fixture()
              mutate(*data)
              try:
                  validate(*data)
              except ValueError as error:
                  if error.args != (code,):
                      raise AssertionError("control rejected at the wrong invariant") from None
              else:
                  raise AssertionError("negative control was accepted")
              controls.append(label)

          def set_old(field, value):
              return lambda b, a, m, f: a["package"][1].__setitem__(field, value)
          negative("old-local-version", "old-local-record", set_old("version", "9.0.0"))
          negative("old-local-checksum", "old-local-record", set_old("checksum", "c" * 64))
          negative("old-local-payload", "old-local-record", set_old("extra", True))
          negative("old-local-edge", "old-local-record", set_old("dependencies", []))
          negative("old-local-source", "local-package-set", set_old("source", "registry+fixture"))
          negative("tui-version", "tui-record", lambda b, a, m, f: a["package"][0].__setitem__("version", "9.0.0"))
          negative("tui-unrelated-edge", "tui-edges", lambda b, a, m, f: a["package"][0]["dependencies"].append("other"))
          negative("tui-missing-edge", "tui-edges", lambda b, a, m, f: a["package"][0]["dependencies"].remove("codex-browser-computer-use"))
          negative("tui-duplicate-edge", "tui-edges", lambda b, a, m, f: a["package"][0]["dependencies"].append("codex-browser-computer-use"))
          negative("missing-local", "local-package-set", lambda b, a, m, f: a["package"].pop(3))
          negative("extra-local", "local-package-set", lambda b, a, m, f: a["package"].append({"name": "extra-local", "version": package_version}))
          negative("wrong-local-version", "new-local-record", lambda b, a, m, f: a["package"][3].__setitem__("version", "9.0.0"))
          negative("wrong-local-payload", "new-local-record", lambda b, a, m, f: a["package"][3].__setitem__("checksum", "c" * 64))
          negative("wrong-local-dependency", "new-local-edges", lambda b, a, m, f: a["package"][3].__setitem__("dependencies", ["new-dep"]))
          negative("old-external-mutation", "old-external-record", lambda b, a, m, f: a["package"][2].__setitem__("checksum", "c" * 64))
          negative("old-external-loss", "old-external-record", lambda b, a, m, f: a["package"].pop(2))
          def add_unreachable(b, a, m, f):
