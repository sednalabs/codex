name: sedna-branch-build
run-name: >-
  sedna-branch-build
  [target=${{ inputs.ref || github.ref_name }} platform=${{ inputs.platform }} host_only=${{ inputs.host_only }}]

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: false
        type: string
      platform:
        description: Preview artifact platform
        required: true
        default: linux-x86_64
        type: choice
        options:
          - linux-x86_64
          - linux-aarch64
          - macos
      host_only:
        description: Build only the Linux x86_64 code-mode host helper
        required: false
        default: false
        type: boolean
      expected_workflow_host_sha:
        description: Exact reviewed temporary consumer workflow commit
        required: true
        type: string

concurrency:
  group: companion-r3-artifact-consumer-f1c7f8b-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  consume-fixed-companion:
    name: Consume the exact uploaded companion bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_SHA: f1c7f8b8829c6a5ea9a5bcd56b5fd64080ce7846
      SOURCE_TREE: 535021c53d47b16dd648137a0526a8944fa60bbd
      PRODUCER_RUN_ID: "39665703460"
      PRODUCER_RUN_ATTEMPT: "1"
      PRODUCER_RUN_NUMBER: "898"
      PRODUCER_ARTIFACT_ID: "12380664715"
      PRODUCER_ARTIFACT_NAME: sedna-branch-f1c7f8b8829c6a5ea9a5bcd56b5fd64080ce7846-f1c7f8b8-x86_64-unknown-linux-gnu
      PRODUCER_ARTIFACT_DIGEST: sha256:90f4e6cf6959fe29e683efa81e53d0593bda7d8e7a778f4e8f4a6c2fd8a83c76
      PRODUCER_ARTIFACT_SIZE: "337356406"
      PREVIEW_VERSION: 0.146.0-alpha.8-sedna.10+upstream.8593.ci.898.gf1c7f8b8
      EXPECTED_CLI_VERSION: codex-cli 0.146.0-alpha.8-sedna.10+upstream.8593.ci.898.gf1c7f8b8 (git:f1c7f8b8)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify the fixed consumer and source identities
        shell: bash
        env:
          EXPECTED_HOST: ${{ inputs.expected_workflow_host_sha }}
          REQUESTED_SOURCE: ${{ inputs.ref }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
          HOST_ONLY: ${{ inputs.host_only }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = sednalabs/codex
          test "${GITHUB_REF}" = refs/heads/validation/companion-r3-consumer-f1c7f8b
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_SHA}" = "${EXPECTED_HOST}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HOST}"
          test "$(git show -s --format=%P HEAD)" = "${SOURCE_SHA}"
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "${SOURCE_TREE}"
          test "$(git diff --name-only "${SOURCE_SHA}" HEAD)" = .github/workflows/sedna-branch-build.yml
          test "$(git rev-parse "${SOURCE_SHA}:.github/workflows/sedna-branch-build.yml")" = d2045cc9754996f59126bedf82d52afba2245db5
          test "${REQUESTED_SOURCE}" = "${SOURCE_SHA}"
          test "${REQUESTED_PLATFORM}" = linux-x86_64
          test "${HOST_ONLY}" = false
          consumer_dir=$(mktemp -d "${RUNNER_TEMP}/companion-r3-consumer.XXXXXX")
          echo "R3_CONSUMER_DIR=${consumer_dir}" >> "${GITHUB_ENV}"

      - name: Download and verify only the fixed official artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/sednalabs/codex/actions/runs/${PRODUCER_RUN_ID}" > "${R3_CONSUMER_DIR}/producer-run.json"
          gh api "repos/sednalabs/codex/actions/artifacts/${PRODUCER_ARTIFACT_ID}" > "${R3_CONSUMER_DIR}/artifact.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["R3_CONSUMER_DIR"])
          run = json.loads((root / "producer-run.json").read_text())
          artifact = json.loads((root / "artifact.json").read_text())
          expected_run = {
              "id": int(os.environ["PRODUCER_RUN_ID"]),
              "run_attempt": int(os.environ["PRODUCER_RUN_ATTEMPT"]),
              "run_number": int(os.environ["PRODUCER_RUN_NUMBER"]),
              "head_sha": os.environ["SOURCE_SHA"],
              "head_branch": "validation/companion-r3-f1c7f8b",
              "event": "workflow_dispatch",
              "path": ".github/workflows/sedna-branch-build.yml",
              "status": "completed",
              "conclusion": "success",
          }
          for key, value in expected_run.items():
              if run.get(key) != value:
                  raise SystemExit(f"Producer identity mismatch: {key}")
          if run["repository"]["full_name"] != "sednalabs/codex":
              raise SystemExit("Producer repository mismatch")
          expected_artifact = {
              "id": int(os.environ["PRODUCER_ARTIFACT_ID"]),
              "name": os.environ["PRODUCER_ARTIFACT_NAME"],
              "digest": os.environ["PRODUCER_ARTIFACT_DIGEST"],
              "size_in_bytes": int(os.environ["PRODUCER_ARTIFACT_SIZE"]),
              "expired": False,
          }
          for key, value in expected_artifact.items():
              if artifact.get(key) != value:
                  raise SystemExit(f"Artifact identity mismatch: {key}")
          if artifact["workflow_run"]["id"] != run["id"] or artifact["workflow_run"]["head_sha"] != run["head_sha"]:
              raise SystemExit("Artifact does not belong to the fixed producer")
          PY
          gh api "repos/sednalabs/codex/actions/artifacts/${PRODUCER_ARTIFACT_ID}/zip" > "${R3_CONSUMER_DIR}/artifact.zip"
          test "$(stat -c %s "${R3_CONSUMER_DIR}/artifact.zip")" = "${PRODUCER_ARTIFACT_SIZE}"
          printf '%s  %s\n' "${PRODUCER_ARTIFACT_DIGEST#sha256:}" "${R3_CONSUMER_DIR}/artifact.zip" | sha256sum --check --status

      - name: Verify the companion archive and isolated binary consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess
          import tarfile
          import zipfile

          root = Path(os.environ["R3_CONSUMER_DIR"])
          source = os.environ["SOURCE_SHA"]
          version = os.environ["PREVIEW_VERSION"]
          run_number = os.environ["PRODUCER_RUN_NUMBER"]
          suffixes = (f".ci.{run_number}.g{source[:8]}", f"-ci.{run_number}+g{source[:8]}")
          if version.count("+") != 1 or not version.endswith(suffixes):
              raise SystemExit("Preview version is not bound to the fixed producer run/source")
          expected_cli_version = f"codex-cli {version} (git:{source[:8]})"
          if os.environ["EXPECTED_CLI_VERSION"] != expected_cli_version:
              raise SystemExit("Frozen CLI oracle does not match the producer's source-derived display format")
          base = f"codex-sedna-preview-{version.replace('+', '__')}-x86_64-unknown-linux-gnu"
          outer_names = {f"{base}.tar.gz", f"{base}.json"}
          with zipfile.ZipFile(root / "artifact.zip") as archive:
              entries = archive.infolist()
              if len(entries) != 2 or {entry.filename for entry in entries} != outer_names:
                  raise SystemExit("Unexpected outer artifact members")
              for entry in entries:
                  kind = stat.S_IFMT(entry.external_attr >> 16)
                  if entry.is_dir() or kind not in (0, stat.S_IFREG):
                      raise SystemExit("Outer artifact member is not a regular file")
                  maximum = 64 * 1024 if entry.filename.endswith(".json") else 2 * int(os.environ["PRODUCER_ARTIFACT_SIZE"])
                  if entry.file_size > maximum:
                      raise SystemExit("Outer artifact member exceeds the fixed consumer budget")
                  with archive.open(entry) as incoming, (root / entry.filename).open("xb") as outgoing:
                      shutil.copyfileobj(incoming, outgoing, 1024 * 1024)
          manifest = json.loads((root / f"{base}.json").read_text())
          expected = {
              "repository": "sednalabs/codex",
              "commit": source,
              "ref": source,
              "previewVersion": version,
              "workflow": f"https://github.com/sednalabs/codex/actions/runs/{os.environ['PRODUCER_RUN_ID']}",
          }
          if set(manifest) != set(expected) | {"runtimeProofLauncherSha256"}:
              raise SystemExit("Unexpected companion manifest fields")
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Companion manifest mismatch: {key}")
          if not re.fullmatch(r"[0-9a-f]{64}", manifest["runtimeProofLauncherSha256"]):
              raise SystemExit("Invalid launcher digest")
          binaries = ("codex", "codex-code-mode-host", "codex-responses-api-proxy", "codex-runtime-proof-launcher")
          service = "systemd/codex-runtime-proof-claim.service"
          regular = {f"./{name}" for name in (*binaries, service)}
          directories = {".", "./systemd"}
          bundle = root / "bundle"
          bundle.mkdir(mode=0o700)
          (bundle / "systemd").mkdir(mode=0o700)
          with tarfile.open(root / f"{base}.tar.gz", "r:gz") as archive:
              entries = archive.getmembers()
              if len(entries) != 7 or {entry.name for entry in entries} != regular | directories:
                  raise SystemExit("Unexpected companion tar members")
              if sum(entry.size for entry in entries) > 4 * 1024**3:
                  raise SystemExit("Companion tar exceeds the fixed consumer budget")
              for entry in entries:
                  if entry.name in directories:
                      if not entry.isdir():
                          raise SystemExit("Expected companion directory")
                      continue
                  if not entry.isfile() or entry.issym() or entry.islnk():
                      raise SystemExit("Companion member is not a regular file")
                  incoming = archive.extractfile(entry)
                  if incoming is None:
                      raise SystemExit("Unreadable companion member")
                  with incoming, (bundle / entry.name[2:]).open("xb") as outgoing:
                      shutil.copyfileobj(incoming, outgoing, 1024 * 1024)
          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as incoming:
                  for block in iter(lambda: incoming.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()
          hashes = {name: digest(bundle / name) for name in binaries}
          if hashes["codex-runtime-proof-launcher"] != manifest["runtimeProofLauncherSha256"]:
              raise SystemExit("Packaged launcher does not match the source-bound manifest")
          source_service = subprocess.check_output(["git", "show", f"{source}:codex-rs/runtime-proof/{service}"])
          if digest(bundle / service) != hashlib.sha256(source_service).hexdigest():
              raise SystemExit("Packaged service does not match the fixed source")
          for name in binaries:
              path = bundle / name
              path.chmod(0o755)
              description = subprocess.check_output(["file", "--brief", str(path)], text=True)
              program_headers = subprocess.check_output(["readelf", "-l", str(path)], text=True)
              if "x86-64" not in description or "/lib64/ld-linux-x86-64.so.2" not in program_headers:
                  raise SystemExit("Packaged binary architecture or loader mismatch")
          isolated_home = root / "empty-home"
          isolated_home.mkdir(mode=0o700)
          (isolated_home / ".codex").mkdir(mode=0o700)
          child_env = {"PATH": "/usr/bin:/bin", "HOME": str(isolated_home), "CODEX_HOME": str(isolated_home / ".codex")}
          actual_version = subprocess.check_output([str(bundle / "codex"), "--version"], env=child_env, timeout=20, text=True).strip()
          if actual_version != os.environ["EXPECTED_CLI_VERSION"]:
              raise SystemExit("Packaged CLI display version does not match source-derived producer provenance")
          for name, arguments in (("codex", ["--help"]), ("codex", ["exec", "--help"]), ("codex", ["app-server", "--help"]), ("codex-code-mode-host", ["--help"]), ("codex-responses-api-proxy", ["--help"])):
              subprocess.run([str(bundle / name), *arguments], env=child_env, timeout=20, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          receipt = {
              "sourceCommit": source,
              "sourceTree": os.environ["SOURCE_TREE"],
              "producerWorkflowCommit": source,
              "producerRunId": os.environ["PRODUCER_RUN_ID"],
              "producerRunAttempt": os.environ["PRODUCER_RUN_ATTEMPT"],
              "producerRunNumber": run_number,
              "artifactId": os.environ["PRODUCER_ARTIFACT_ID"],
              "artifactName": os.environ["PRODUCER_ARTIFACT_NAME"],
              "artifactDigest": os.environ["PRODUCER_ARTIFACT_DIGEST"],
              "previewVersion": version,
              "cliDisplayVersion": actual_version,
              "consumerWorkflowCommit": os.environ["GITHUB_SHA"],
              "consumerRunId": os.environ["GITHUB_RUN_ID"],
              "consumerRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "binarySha256": hashes,
              "checks": {"officialZipDigest": True, "outerMembers": 2, "tarMembers": 7, "regularBinaries": 4, "launcherManifestDigest": True, "sourceService": True, "elfAndLoader": True, "isolatedVersionAndHelp": True},
              "outcome": "pass",
          }
          (root / "companion-artifact-consumer.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Upload only the compact companion consumer result
        uses: actions/upload-artifact@v7
        with:
          name: companion-artifact-consumer-${{ github.run_id }}
          path: ${{ env.R3_CONSUMER_DIR }}/companion-artifact-consumer.json
          if-no-files-found: error
          retention-days: 3

  metadata:
    if: ${{ false }}
    name: Resolve preview metadata
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      display_ref: ${{ steps.meta.outputs.display_ref }}
      preview_version: ${{ steps.meta.outputs.preview_version }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Compute preview version
        id: meta
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          DISPLAY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          HOST_ONLY: ${{ inputs.host_only }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [[ "${HOST_ONLY}" == "true" && "${PLATFORM}" != "linux-x86_64" ]]; then
            echo "The code-mode host-only artifact is supported only on linux-x86_64." >&2
            exit 1
          fi
          checkout_ref="${CHECKOUT_REF}"
          short_sha="$(git rev-parse --short=8 HEAD)"
          latest_tag="$(git tag --merged HEAD --list 'v*-sedna.*' --sort=-version:refname | head -n 1)"
          if [[ -n "${latest_tag}" ]]; then
            base_version="${latest_tag#v}"
          else
            base_version="0.0.0-sedna.0"
          fi

          branch_name="${DISPLAY_REF}"
          branch_slug="$(printf '%s' "${branch_name}" | tr '/:@ ' '-' | tr -cd '[:alnum:]._-' | cut -c1-48)"
          if [[ "${base_version}" == *+* ]]; then
            preview_version="${base_version}.ci.${GITHUB_RUN_NUMBER}.g${short_sha}"
          else
            preview_version="${base_version}-ci.${GITHUB_RUN_NUMBER}+g${short_sha}"
          fi

          {
            echo "checkout_ref=${checkout_ref}"
            echo "display_ref=${branch_name}"
            echo "preview_version=${preview_version}"
            echo "artifact_name=sedna-branch-${branch_slug}-${short_sha}"
          } >> "$GITHUB_OUTPUT"

  build-linux-x86_64:
    needs: metadata
    if: ${{ false }}
    uses: ./.github/workflows/_sedna-linux-rust.yml
    with:
      checkout_ref: ${{ needs.metadata.outputs.checkout_ref }}
      summary_title: Branch build
      setup_rusty_v8: true
      release_version: ${{ needs.metadata.outputs.preview_version }}
      target: x86_64-unknown-linux-gnu
      artifact_name: ${{ needs.metadata.outputs.artifact_name }}-x86_64-unknown-linux-gnu
      artifact_path: dist/*
      display_ref: ${{ needs.metadata.outputs.display_ref }}
      run_command: |
        if [[ '${{ inputs.host_only }}' == 'true' ]]; then
          source_status="$(git status --porcelain --untracked-files=normal)"
          if [[ -n "${source_status}" ]]; then
            echo "Refusing to build a preview from a dirty source tree." >&2
            printf '%s\n' "${source_status}" >&2
            exit 1
          fi
          source ../.github/scripts/validation-lanes/setup-rusty-v8.sh x86_64-unknown-linux-gnu
          cargo build --locked --target x86_64-unknown-linux-gnu --release --bin codex-code-mode-host
          mkdir -p ../dist

          stage_dir="${RUNNER_TEMP}/sedna-branch/x86_64-unknown-linux-gnu-host-only"
          file_version="${CODEX_RELEASE_VERSION//+/__}"
          archive_base="codex-sedna-preview-host-${file_version}-x86_64-unknown-linux-gnu"
          rm -rf "${stage_dir}"
          mkdir -p "${stage_dir}"
          install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex-code-mode-host" "${stage_dir}/codex-code-mode-host"

          file "${stage_dir}/codex-code-mode-host" | grep -F 'x86-64'
          readelf -l "${stage_dir}/codex-code-mode-host" | grep -F '/lib64/ld-linux-x86-64.so.2'
          "${stage_dir}/codex-code-mode-host" --help >/dev/null
          tar -C "${stage_dir}" -czf "../dist/${archive_base}.tar.gz" .
          (cd "${stage_dir}" && sha256sum codex-code-mode-host) > "../dist/${archive_base}.binary.sha256"
          (cd ../dist && sha256sum "${archive_base}.tar.gz") > "../dist/${archive_base}.tar.gz.sha256"

          python3 - <<'PY' > "../dist/${archive_base}.json"
        import hashlib
        import json
        import os
        import subprocess
        import sys

        binary_path = os.path.join(
            os.environ["RUNNER_TEMP"],
            "sedna-branch/x86_64-unknown-linux-gnu-host-only/codex-code-mode-host",
        )
        payload = {
            "repository": os.environ["GITHUB_REPOSITORY"],
            "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "workflowCommit": subprocess.check_output(
                ["git", "-C", "../.workflow-src", "rev-parse", "HEAD"], text=True
            ).strip(),
            "ref": os.environ["DISPLAY_REF"],
            "previewVersion": os.environ["CODEX_RELEASE_VERSION"],
            "artifact": "codex-code-mode-host",
            "binarySha256": "",
            "workflow": (
                f'{os.environ["GITHUB_SERVER_URL"]}/'
                f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
            ),
        }
        with open(binary_path, "rb") as binary_file:
            payload["binarySha256"] = hashlib.sha256(binary_file.read()).hexdigest()
        json.dump(payload, sys.stdout, indent=2)
        sys.stdout.write("\n")
        PY
          exit 0
        fi
        source_status="$(git status --porcelain --untracked-files=normal)"
        if [[ -n "${source_status}" ]]; then
          echo "Refusing to build a preview from a dirty source tree." >&2
          printf '%s\n' "${source_status}" >&2
          exit 1
        fi
        cargo build --locked --target x86_64-unknown-linux-gnu --release --bin codex --bin codex-code-mode-host --bin codex-responses-api-proxy --bin codex-runtime-proof-launcher
        mkdir -p ../dist

        stage_dir="${RUNNER_TEMP}/sedna-branch/x86_64-unknown-linux-gnu"
        file_version="${CODEX_RELEASE_VERSION//+/__}"
        archive_base="codex-sedna-preview-${file_version}-x86_64-unknown-linux-gnu"

        rm -rf "${stage_dir}"
        mkdir -p "${stage_dir}"

        install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex" "${stage_dir}/codex"
        install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex-code-mode-host" "${stage_dir}/codex-code-mode-host"
        install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex-responses-api-proxy" "${stage_dir}/codex-responses-api-proxy"
        install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex-runtime-proof-launcher" "${stage_dir}/codex-runtime-proof-launcher"
        install -Dm 0644 runtime-proof/systemd/codex-runtime-proof-claim.service "${stage_dir}/systemd/codex-runtime-proof-claim.service"

        file "${stage_dir}/codex" | grep -F 'x86-64'
        readelf -l "${stage_dir}/codex" | grep -F '/lib64/ld-linux-x86-64.so.2'
        version_output="$("${stage_dir}/codex" --version)"
        printf '%s\n' "${version_output}"
        if [[ "${version_output}" == *-dirty* ]]; then
          echo "Preview binary unexpectedly contains dirty git provenance." >&2
          exit 1
        fi
        "${stage_dir}/codex" --help >/dev/null
        "${stage_dir}/codex-code-mode-host" --help >/dev/null
        "${stage_dir}/codex" exec --help >/dev/null
        "${stage_dir}/codex" app-server --help >/dev/null
        "${stage_dir}/codex-responses-api-proxy" --help >/dev/null
        file "${stage_dir}/codex-runtime-proof-launcher" | grep -F 'x86-64'
        readelf -l "${stage_dir}/codex-runtime-proof-launcher" | grep -F '/lib64/ld-linux-x86-64.so.2'

        tar -czf "${GITHUB_WORKSPACE}/dist/${archive_base}.tar.gz" -C "${stage_dir}" .

        ARCHIVE_PATH="${GITHUB_WORKSPACE}/dist/${archive_base}.tar.gz" python3 - <<'PY' > "../dist/${archive_base}.json"
        import hashlib
        import json
        import os
        import subprocess
        import sys
        import tarfile

        payload = {
            "repository": os.environ["GITHUB_REPOSITORY"],
            "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "ref": os.environ["DISPLAY_REF"],
            "previewVersion": os.environ["CODEX_RELEASE_VERSION"],
            "workflow": (
                f'{os.environ["GITHUB_SERVER_URL"]}/'
                f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
            ),
        }
        launcher_path = os.path.join(
            os.environ["RUNNER_TEMP"],
            "sedna-branch/x86_64-unknown-linux-gnu/codex-runtime-proof-launcher",
        )
        with open(launcher_path, "rb") as launcher_file:
            payload["runtimeProofLauncherSha256"] = hashlib.sha256(launcher_file.read()).hexdigest()
        with tarfile.open(os.environ["ARCHIVE_PATH"], "r:gz") as archive:
            members = [
                member
                for member in archive.getmembers()
                if member.name in {"./codex-runtime-proof-launcher", "codex-runtime-proof-launcher"}
            ]
            if len(members) != 1 or not members[0].isfile():
                raise SystemExit("preview archive is missing the runtime-proof launcher")
            packaged_launcher = archive.extractfile(members[0])
            if packaged_launcher is None:
                raise SystemExit("preview archive runtime-proof launcher is unreadable")
            archive_digest = hashlib.sha256()
            for block in iter(lambda: packaged_launcher.read(1024 * 1024), b""):
                archive_digest.update(block)
            if archive_digest.hexdigest() != payload["runtimeProofLauncherSha256"]:
                raise SystemExit("preview archive runtime-proof launcher does not match its manifest")
        json.dump(payload, sys.stdout, indent=2)
        sys.stdout.write("\n")
        PY

  build-linux-aarch64:
    needs: metadata
    if: ${{ false }}
    uses: ./.github/workflows/_sedna-linux-rust.yml
    with:
      checkout_ref: ${{ needs.metadata.outputs.checkout_ref }}
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      summary_title: Branch build
      setup_rusty_v8: true
      release_version: ${{ needs.metadata.outputs.preview_version }}
      artifact_name: ${{ needs.metadata.outputs.artifact_name }}-aarch64-unknown-linux-gnu
      artifact_path: dist/*
      display_ref: ${{ needs.metadata.outputs.display_ref }}
      run_command: |
        source_status="$(git status --porcelain --untracked-files=normal)"
        if [[ -n "${source_status}" ]]; then
          echo "Refusing to build a preview from a dirty source tree." >&2
          printf '%s\n' "${source_status}" >&2
          exit 1
        fi
        cargo build --locked --target aarch64-unknown-linux-gnu --release --bin codex --bin codex-code-mode-host --bin codex-responses-api-proxy --bin codex-runtime-proof-launcher
        mkdir -p ../dist

        stage_dir="${RUNNER_TEMP}/sedna-branch/aarch64-unknown-linux-gnu"
        file_version="${CODEX_RELEASE_VERSION//+/__}"
        archive_base="codex-sedna-preview-${file_version}-aarch64-unknown-linux-gnu"

        rm -rf "${stage_dir}"
        mkdir -p "${stage_dir}"

        install -Dm 0755 "target/aarch64-unknown-linux-gnu/release/codex" "${stage_dir}/codex"
        install -Dm 0755 "target/aarch64-unknown-linux-gnu/release/codex-code-mode-host" "${stage_dir}/codex-code-mode-host"
        install -Dm 0755 "target/aarch64-unknown-linux-gnu/release/codex-responses-api-proxy" "${stage_dir}/codex-responses-api-proxy"
        install -Dm 0755 "target/aarch64-unknown-linux-gnu/release/codex-runtime-proof-launcher" "${stage_dir}/codex-runtime-proof-launcher"
        install -Dm 0644 runtime-proof/systemd/codex-runtime-proof-claim.service "${stage_dir}/systemd/codex-runtime-proof-claim.service"

        file "${stage_dir}/codex" | grep -F 'ARM aarch64'
        readelf -l "${stage_dir}/codex" | grep -F '/lib/ld-linux-aarch64.so.1'
        version_output="$("${stage_dir}/codex" --version)"
        printf '%s\n' "${version_output}"
        if [[ "${version_output}" == *-dirty* ]]; then
          echo "Preview binary unexpectedly contains dirty git provenance." >&2
          exit 1
        fi
        "${stage_dir}/codex" --help >/dev/null
        "${stage_dir}/codex-code-mode-host" --help >/dev/null
        "${stage_dir}/codex" exec --help >/dev/null
        "${stage_dir}/codex" app-server --help >/dev/null
        "${stage_dir}/codex-responses-api-proxy" --help >/dev/null
        file "${stage_dir}/codex-runtime-proof-launcher" | grep -F 'ARM aarch64'
        readelf -l "${stage_dir}/codex-runtime-proof-launcher" | grep -F '/lib/ld-linux-aarch64.so.1'

        tar -C "${stage_dir}" -czf "../dist/${archive_base}.tar.gz" .

        python3 - <<'PY' > "../dist/${archive_base}.json"
        import hashlib
        import json
        import os
        import subprocess
        import sys

        payload = {
            "repository": os.environ["GITHUB_REPOSITORY"],
            "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "ref": os.environ["DISPLAY_REF"],
            "previewVersion": os.environ["CODEX_RELEASE_VERSION"],
            "target": "aarch64-unknown-linux-gnu",
            "workflow": (
                f'{os.environ["GITHUB_SERVER_URL"]}/'
                f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
            ),
        }
        launcher_path = os.path.join(
            os.environ["RUNNER_TEMP"],
            "sedna-branch/aarch64-unknown-linux-gnu/codex-runtime-proof-launcher",
        )
        with open(launcher_path, "rb") as launcher_file:
            payload["runtimeProofLauncherSha256"] = hashlib.sha256(launcher_file.read()).hexdigest()
        json.dump(payload, sys.stdout, indent=2)
        sys.stdout.write("\n")
        PY

  build-macos:
    name: Build macOS preview - x86_64-apple-darwin
    needs: metadata
    if: ${{ false }}
    runs-on: macos-15-intel
    timeout-minutes: 210
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
      SCCACHE_CACHE_SIZE: 2G
      CODEX_RELEASE_REPOSITORY: ${{ github.repository }}
      CODEX_RELEASE_TAG_PREFIX: v
      CODEX_RELEASE_VERSION: ${{ needs.metadata.outputs.preview_version }}
      DISPLAY_REF: ${{ needs.metadata.outputs.display_ref }}
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Require the selected workflow ref for macOS previews
        if: ${{ inputs.ref != '' }}
        shell: bash
        run: |
          echo "macOS preview builds use the workflow's selected ref; leave the ref input empty." >&2
          exit 1

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-apple-darwin

      - name: Compute Rust cache keys
        id: lockhash
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(shasum -a 256 Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(shasum -a 256 rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/.rusty_v8/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: sedna-preview-cargo-home-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            sedna-preview-cargo-home-macos-15-intel-x86_64-apple-darwin-

      - name: Install sccache
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: sccache

      - name: Configure sccache backend
        id: sccache_backend
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/configure_sccache_backend.sh write-fallback

      - name: Enable sccache wrapper
        if: ${{ steps.sccache_backend.outputs.backend != 'off' }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(command -v sccache)"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Restore sccache cache
        if: ${{ steps.sccache_backend.outputs.backend == 'fallback' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sedna-preview-sccache-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}
          restore-keys: |
            sedna-preview-sccache-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-
            sedna-preview-sccache-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-apple-darwin

      - name: Build macOS preview binaries
        id: build_macos
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --target "${TARGET}" \
            --release \
            --bin codex \
            --bin codex-code-mode-host \
            --bin codex-responses-api-proxy

      - name: Stage ad hoc signed macOS preview artifact
        shell: bash
        run: |
          set -euo pipefail

          stage_dir="${RUNNER_TEMP}/sedna-branch/${TARGET}"
          dist_dir="${GITHUB_WORKSPACE}/dist"
          file_version="${CODEX_RELEASE_VERSION//+/__}"
          archive_base="codex-sedna-preview-${file_version}-${TARGET}"
          binaries=(codex codex-code-mode-host codex-responses-api-proxy)

          rm -rf "${stage_dir}"
          mkdir -p "${stage_dir}" "${dist_dir}"

          for binary in "${binaries[@]}"; do
            source_path="target/${TARGET}/release/${binary}"
            staged_path="${stage_dir}/${binary}"
            entitlements="${GITHUB_WORKSPACE}/.github/scripts/macos-signing/${binary}.entitlements.plist"
            install -m 0755 "${source_path}" "${staged_path}"
            "${GITHUB_WORKSPACE}/.github/scripts/macos-signing/sign_macos_code.sh" \
              --target "${staged_path}" \
              --identity - \
              --deep false \
              --identifier "${binary}" \
              --options runtime \
              --timestamp none \
              --entitlements "${entitlements}"
            codesign --verify --strict --verbose=2 "${staged_path}"
          done

          "${stage_dir}/codex" --version
          tar -C "${stage_dir}" -czf "${dist_dir}/${archive_base}.tar.gz" .

          python3 - <<'PY' > "${dist_dir}/${archive_base}.json"
          import json
          import os
          import subprocess
          import sys

          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "ref": os.environ["DISPLAY_REF"],
              "previewVersion": os.environ["CODEX_RELEASE_VERSION"],
              "target": os.environ["TARGET"],
              "signing": "ad-hoc",
              "notarized": False,
              "workflow": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/'
                  f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
              ),
          }
          json.dump(payload, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PY

          (
            cd "${dist_dir}"
            shasum -a 256 ./* > SHA256SUMS.txt
          )

      - name: Upload macOS preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}-x86_64-apple-darwin
          path: dist/*
          if-no-files-found: error
          retention-days: 3

      - name: Report sccache statistics
        if: ${{ always() && steps.sccache_backend.outputs.backend != 'off' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### sccache stats — x86_64-apple-darwin (release)"
            echo
            echo '```text'
            sccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Cargo home cache
        if: ${{ always() && !cancelled() && steps.build_macos.outcome == 'success' && steps.cache_cargo_home_restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/.rusty_v8/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: sedna-preview-cargo-home-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache
        if: ${{ always() && !cancelled() && steps.build_macos.outcome == 'success' && steps.sccache_backend.outputs.backend == 'fallback' && steps.sccache_backend.outputs.policy == 'write-fallback' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sedna-preview-sccache-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}
