name: sedna-branch-build

run-name: >-
  sedna-branch-build
  [mode=${{ inputs.mode }} preparation=${{ inputs.preparation_profile }} target=${{ inputs.target_sha }} base=${{ inputs.base_sha }}]

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build packages, prepare exact source diffs, or consume an existing verified package pair.
        required: true
        type: choice
        options:
          - build
          - prepare-only
          - consume-existing
        default: build
      target_sha:
        description: Exact 40-character product source commit SHA (T)
        required: true
        type: string
      base_ref:
        description: Base ref used to resolve the exact comparison base (B)
        required: true
        default: main
        type: string
      base_sha:
        description: Exact 40-character comparison base commit SHA (B)
        required: true
        type: string
      producer_run_id:
        description: Exact existing producer run ID for consume-existing mode.
        required: false
        default: ""
        type: string
      producer_workflow_host_sha:
        description: Exact existing producer workflow-host SHA for consume-existing mode.
        required: false
        default: ""
        type: string
      fixture_sha:
        description: Exact consumer-fixture source SHA for consume-existing mode.
        required: false
        default: ""
        type: string
      sdk_sha:
        description: Exact Python SDK source SHA for consume-existing mode.
        required: false
        default: ""
        type: string
      consumer_profile:
        description: Closed consumer test profile for consume-existing mode.
        required: false
        type: choice
        options:
          - pair
          - focused
          - full
        default: full
      preparation_profile:
        description: Closed source-preparation profile for prepare-only mode.
        required: false
        type: choice
        options:
          - cargo-schema
          - config-schema
          - tui-snapshots
          - control-plane
        default: cargo-schema

concurrency:
  group: sedna-branch-build/${{ inputs.mode }}/${{ inputs.target_sha }}/${{ inputs.base_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner_policy:
    name: Verify standard runner graph and exact identities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out workflow host (H)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .workflow-src
      - name: Validate immutable inputs and workflow host
        working-directory: .workflow-src
        shell: bash
        env:
          EXPECTED_H: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_WORKFLOW_HOST_SHA: ${{ inputs.producer_workflow_host_sha }}
          FIXTURE_SHA: ${{ inputs.fixture_sha }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
          PREPARATION_PROFILE: ${{ inputs.preparation_profile }}
        run: |
          set -euo pipefail
          case "${MODE}" in
            build|prepare-only|consume-existing) ;;
            *) echo "unsupported workflow mode" >&2; exit 1 ;;
          esac
          case "${PREPARATION_PROFILE}" in
            cargo-schema|config-schema|tui-snapshots|control-plane) ;;
            *) echo "unsupported preparation profile" >&2; exit 1 ;;
          esac
          if [[ "${MODE}" != "prepare-only" && "${PREPARATION_PROFILE}" != "cargo-schema" ]]; then
            echo "nondefault preparation profiles are restricted to prepare-only mode" >&2
            exit 1
          fi
          [[ "${EXPECTED_H}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "workflow host SHA must be a full lowercase commit SHA" >&2
            exit 1
          }
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "target_sha must be a full lowercase commit SHA" >&2
            exit 1
          }
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "base_sha must be a full lowercase commit SHA" >&2
            exit 1
          }
          [[ "${BASE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] || {
            echo "base_ref is not a safe Git ref" >&2
            exit 1
          }
          case "${MODE}" in
            consume-existing)
              [[ "${PRODUCER_RUN_ID}" =~ ^[1-9][0-9]*$ && "${PRODUCER_WORKFLOW_HOST_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
                echo "consume-existing producer identity is malformed" >&2; exit 1;
              }
              [[ "${FIXTURE_SHA}" =~ ^[0-9a-f]{40}$ && "${FIXTURE_SHA}" != "${TARGET_SHA}" ]] || {
                echo "consume-existing requires a distinct full fixture source SHA" >&2; exit 1;
              }
              [[ "${SDK_SHA}" =~ ^[0-9a-f]{40}$ && "${SDK_SHA}" != "${TARGET_SHA}" ]] || {
                echo "consume-existing requires a distinct full SDK source SHA" >&2; exit 1;
              }
              case "${CONSUMER_PROFILE}" in pair|focused|full) ;; *) echo "unsupported consumer profile" >&2; exit 1 ;; esac
              trusted_ref="refs/heads/reconstruct/first-binary-package-workflow-20261001"
              trusted_workflow_ref="sednalabs/codex/.github/workflows/sedna-branch-build.yml@${trusted_ref}"
              [[ "${GITHUB_REF}" == "${trusted_ref}" && "${GITHUB_REF_NAME}" == "reconstruct/first-binary-package-workflow-20261001" ]] || {
                echo "consume-existing is restricted to the trusted workflow-host branch" >&2; exit 1;
              }
              [[ "${GITHUB_SHA}" == "${EXPECTED_H}" && "${GITHUB_WORKFLOW_REF}" == "${trusted_workflow_ref}" ]] || {
                echo "consume-existing workflow host differs from the trusted dispatch ref" >&2; exit 1;
              }
              ;;
            build|prepare-only)
              [[ -z "${PRODUCER_RUN_ID}${PRODUCER_WORKFLOW_HOST_SHA}${FIXTURE_SHA}${SDK_SHA}" ]] || {
                echo "cross-run producer and source inputs are allowed only in consume-existing mode" >&2; exit 1;
              }
              [[ "${CONSUMER_PROFILE}" == "full" ]] || {
                echo "the consumer profile is configurable only in consume-existing mode" >&2; exit 1;
              }
              ;;
          esac
          actual_h="$(git rev-parse HEAD)"
          if [[ "${actual_h}" != "${EXPECTED_H}" ]]; then
            echo "workflow host checkout does not match H" >&2
            exit 1
          fi
          if [[ "${MODE}" == "consume-existing" ]]; then
            python3 .github/scripts/verify_existing_first_binary_producer.py --validate-accepted-inputs
          fi
      - name: Validate the closed source-preparation profile
        working-directory: .workflow-src
        env:
          MODE: ${{ inputs.mode }}
          PREPARATION_PROFILE: ${{ inputs.preparation_profile }}
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_WORKFLOW_HOST_SHA: ${{ inputs.producer_workflow_host_sha }}
          FIXTURE_SHA: ${{ inputs.fixture_sha }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          case "${PREPARATION_PROFILE}" in
            cargo-schema|config-schema)
              python3 .github/scripts/prepare_config_schema.py --validate-profile
              ;;
            tui-snapshots)
              python3 .github/scripts/prepare_tui_snapshots.py --validate-profile
              ;;
            control-plane)
              python3 .github/scripts/control_plane_preparation_route.py --validate-profile
              ;;
            *) echo "unsupported preparation profile" >&2; exit 1 ;;
          esac
      - name: Test config-schema preparation controls
        if: ${{ inputs.mode == 'prepare-only' && inputs.preparation_profile == 'config-schema' }}
        working-directory: .workflow-src
        run: python3 .github/scripts/test_prepare_config_schema.py -v
      - name: Test the closed control-plane preparation route
        if: ${{ inputs.mode == 'prepare-only' && inputs.preparation_profile == 'control-plane' }}
        working-directory: .workflow-src
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 .github/scripts/test_control_plane_preparation_route.py -v
      - name: Test TUI snapshot preparation controls
        if: ${{ inputs.mode == 'prepare-only' && inputs.preparation_profile == 'tui-snapshots' }}
        working-directory: .workflow-src
        run: python3 .github/scripts/test_prepare_tui_snapshots.py -v
      - name: Test static consumer contract regression controls
        if: ${{ inputs.mode != 'prepare-only' }}
        working-directory: .workflow-src
        run: python3 .github/scripts/test_first_binary_contracts.py -v
      - name: Check out exact selected consumer source for early contracts
        if: ${{ inputs.mode != 'prepare-only' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.mode == 'build' && inputs.target_sha || inputs.fixture_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .contract-source
          sparse-checkout: scripts/codex_package/smoke_tests/first_binary
      - name: Check out exact SDK source for early contracts
        if: ${{ inputs.mode == 'consume-existing' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sdk_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .contract-sdk
          sparse-checkout: sdk/python/tests
      - name: Check out exact historical producer workflow for early contracts
        if: ${{ inputs.mode == 'consume-existing' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.producer_workflow_host_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .contract-producer
          sparse-checkout: .github/workflows/sedna-branch-build.yml
          sparse-checkout-cone-mode: false
      - name: Check exact selected consumer contracts before package work
        if: ${{ inputs.mode != 'prepare-only' }}
        shell: bash
        env:
          EXPECTED_H: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          FIXTURE_SHA: ${{ inputs.fixture_sha }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_WORKFLOW_HOST_SHA: ${{ inputs.producer_workflow_host_sha }}
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
        run: |
          python3 .workflow-src/.github/scripts/check_first_binary_contracts.py \
            --workflow-root .workflow-src \
            --source-root .contract-source \
            --sdk-root .contract-sdk \
            --producer-root .contract-producer
      - name: Test the runner graph regression fixtures
        working-directory: .workflow-src
        shell: bash
        run: python3 .github/scripts/test_standard_runner_graph.py
      - name: Test the exact package provenance verifier fixtures
        if: ${{ !(inputs.mode == 'prepare-only' && inputs.preparation_profile == 'control-plane') }}
        working-directory: .workflow-src
        shell: bash
        run: python3 .github/scripts/test_verify_existing_first_binary_producer.py
      - name: Inspect every reachable workflow runner
        working-directory: .workflow-src
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check_standard_runner_graph.py \
            .github/workflows/sedna-branch-build.yml \
            .github/workflows/validation-named-tests.yml

  control_plane_preparation:
    name: Prepare control-plane source through the registered route
    if: ${{ inputs.mode == 'prepare-only' && inputs.preparation_profile == 'control-plane' }}
    needs:
      - runner_policy
    uses: ./.github/workflows/validation-control-plane-prep.yml
    permissions:
      contents: read
    with:
      target_sha: ${{ inputs.target_sha }}
      base_sha: ${{ inputs.base_sha }}
      base_ref: ${{ inputs.base_ref }}

  prepare-only:
    name: Prepare exact source schema diff
    if: ${{ inputs.mode == 'prepare-only' && inputs.preparation_profile != 'control-plane' }}
    needs:
      - runner_policy
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Initialize runner-local preparation paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'PRODUCT_ROOT=%s/product\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'LOCK_BEFORE=%s/Cargo.lock.before\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DIFF_OUT=%s/source-delta.patch\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out workflow host (H)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .workflow-src
      - name: Check out exact product source (T)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: product
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Verify H, B, T, and standard preparation architecture
        id: preparation_identity
        shell: bash
        env:
          EXPECTED_H: ${{ github.sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          MODE: ${{ inputs.mode }}
          PREPARATION_PROFILE: ${{ inputs.preparation_profile }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || {
            echo "lock/schema preparation requires standard ubuntu-24.04 x86_64" >&2
            exit 1
          }
          [[ "${EXPECTED_H}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          computer_use=false
          if [[ "${MODE}" == "prepare-only" && "${PREPARATION_PROFILE}" == "cargo-schema" && "${TARGET_SHA}" == "3cd6436609ad59eed7f174a8c3aa6e3a67c1dbec" ]]; then
            [[ "${BASE_SHA}" == "8389b61d82cb6fb936e4e500b977f31682441ffe" ]] || {
              echo "computer-use preparation requires its exact comparison base" >&2
              exit 1
            }
            computer_use=true
          fi
          actual_h="$(git -C .workflow-src rev-parse HEAD)"
          actual_t="$(git -C product rev-parse HEAD)"
          [[ "${actual_h}" == "${EXPECTED_H}" ]] || {
            echo "workflow host H does not match github.sha" >&2
            exit 1
          }
          [[ "${actual_t}" == "${TARGET_SHA}" ]] || {
            echo "product source T does not match target_sha" >&2
            exit 1
          }
          git -C product fetch --no-tags --depth=1 origin -- "${BASE_REF}"
          actual_b="$(git -C product rev-parse 'FETCH_HEAD^{commit}')"
          [[ "${actual_b}" == "${BASE_SHA}" ]] || {
            echo "comparison base B does not match base_sha" >&2
            exit 1
          }
          git -C product cat-file -e "${BASE_SHA}^{commit}"
          printf 'computer-use=%s\n' "${computer_use}" >> "$GITHUB_OUTPUT"
      - name: Install pinned just for the TUI snapshot preparation profile
        if: ${{ inputs.preparation_profile == 'tui-snapshots' }}
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: just@1.51.0
      - name: Install pinned cargo-nextest for the TUI snapshot preparation profile
        if: ${{ inputs.preparation_profile == 'tui-snapshots' }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103
      - name: Prepare the canonical config schema only
        if: ${{ inputs.preparation_profile == 'config-schema' }}
        working-directory: .workflow-src
        shell: bash
        env:
          EXPECTED_H: ${{ github.sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          MODE: ${{ inputs.mode }}
          PREPARATION_PROFILE: ${{ inputs.preparation_profile }}
        run: python3 .github/scripts/prepare_config_schema.py
      - name: Prepare review-pending TUI snapshots only
        if: ${{ inputs.preparation_profile == 'tui-snapshots' }}
        working-directory: .workflow-src
        shell: bash
        env:
          EXPECTED_H: ${{ github.sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          MODE: ${{ inputs.mode }}
          PREPARATION_PROFILE: ${{ inputs.preparation_profile }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/w16072-tui-snapshot-target
          INSTA_UPDATE: new
        run: python3 .github/scripts/prepare_tui_snapshots.py
      - name: Install the repository-pinned schema generator runtime
        if: ${{ inputs.preparation_profile == 'cargo-schema' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/schema-tools"
          "${RUNNER_TEMP}/schema-tools/bin/python" -m pip install "uv==0.11.3"
          echo "${RUNNER_TEMP}/schema-tools/bin" >> "${GITHUB_PATH}"
      - name: Snapshot the input lockfile
        if: ${{ inputs.preparation_profile == 'cargo-schema' }}
        shell: bash
        env:
          COMPUTER_USE_PREPARATION: ${{ steps.preparation_identity.outputs.computer-use }}
        run: |
          set -euo pipefail
          cp "${PRODUCT_ROOT}/codex-rs/Cargo.lock" "${LOCK_BEFORE}"
          sha256sum "${LOCK_BEFORE}" > "${RUNNER_TEMP}/Cargo.lock.before.sha256"
          if [[ "${COMPUTER_USE_PREPARATION}" == "true" ]]; then
            cp "${PRODUCT_ROOT}/MODULE.bazel.lock" "${RUNNER_TEMP}/MODULE.bazel.lock.before"
            sha256sum "${RUNNER_TEMP}/MODULE.bazel.lock.before" > "${RUNNER_TEMP}/MODULE.bazel.lock.before.sha256"
            python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ["PRODUCT_ROOT"])
          schema_paths = [
              "codex-rs/app-server-protocol/schema/precomputed/app-server-exports-stable.json.zst",
              "sdk/python/src/openai_codex/generated/v2_all.py",
              "sdk/python/src/openai_codex/generated/notification_registry.py",
              "sdk/python/src/openai_codex/api.py",
              "codex-rs/app-server-protocol/schema/typescript/",
              "codex-rs/app-server-protocol/schema/json/",
          ]
          paths = subprocess.check_output(
              ["git", "-C", str(root), "ls-files", "--cached", "-z", "--", *schema_paths]
          ).split(b"\0")
          inventory = {}
          for raw in paths:
              if not raw:
                  continue
              relative = raw.decode("utf-8", errors="strict")
              path = root / relative
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("schema input is not a regular tracked file")
              inventory[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          if not inventory or not set(schema_paths[:4]) <= inventory.keys():
              raise SystemExit("schema input inventory is incomplete")
          Path(os.environ["RUNNER_TEMP"], "computer-use-schema.before.json").write_text(
              json.dumps(inventory, sort_keys=True), encoding="utf-8"
          )
          PY
          fi
      - name: Refresh only workspace package records
        if: ${{ inputs.preparation_profile == 'cargo-schema' }}
        working-directory: product/codex-rs
        shell: bash
        run: cargo update --workspace
      - name: Generate the canonical app-server schema and SDK fixtures
        if: ${{ inputs.preparation_profile == 'cargo-schema' }}
        working-directory: product
        shell: bash
        run: python3 codex-rs/app-server-protocol/scripts/write_schema_fixtures.py
      - name: Resolve the exact computer-use Cargo graph without changing its lock
        if: ${{ steps.preparation_identity.outputs.computer-use == 'true' }}
        working-directory: product/codex-rs
        shell: bash
        run: cargo metadata --locked --format-version 1 > "${RUNNER_TEMP}/computer-use-cargo-metadata.json"
      - name: Check the closed computer-use lock and schema contract
        if: ${{ steps.preparation_identity.outputs.computer-use == 'true' }}
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          PREPARATION_PROFILE: ${{ inputs.preparation_profile }}
          PRODUCT_SHA: ${{ inputs.target_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import copy
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          target = "3cd6436609ad59eed7f174a8c3aa6e3a67c1dbec"
          base = "8389b61d82cb6fb936e4e500b977f31682441ffe"
          new_names = {"codex-android-computer-use", "codex-browser-computer-use"}
          package_version = "0.160.0-dev.sedna.1"

          def route(mode, profile, product, comparison):
              selected = (mode, profile, product) == ("prepare-only", "cargo-schema", target)
              if selected and comparison != base:
                  raise ValueError("wrong-base")
              return selected

          def reject(code):
              raise ValueError(code)

          def key(package):
              if not isinstance(package, dict):
                  reject("package-record")
              name, version, source = (package.get(field) for field in ("name", "version", "source"))
              if not all(isinstance(value, str) and value for value in (name, version)):
                  reject("package-record")
              if "source" in package and (not isinstance(source, str) or not source):
                  reject("package-record")
              return name, version, source

          def records(lock):
              rows = lock.get("package") if isinstance(lock, dict) else None
              if not isinstance(rows, list):
                  reject("package-record")
              indexed = {}
              for row in rows:
                  identity = key(row)
                  if identity in indexed:
                      reject("duplicate-lock-identity")
                  indexed[identity] = row
              return indexed

          def schema_equal(before, after):
              if not isinstance(before, dict) or not before or before != after:
                  reject("schema-inventory-or-bytes")

          def validate(before, after, metadata, manifests):
              old, current = records(before), records(after)
              if {k: v for k, v in before.items() if k != "package"} != {
                  k: v for k, v in after.items() if k != "package"
              }:
                  reject("lock-header")
              old_local = {row["name"]: row for row in old.values() if "source" not in row}
              local = {row["name"]: row for row in current.values() if "source" not in row}
              if len(old_local) != sum("source" not in row for row in old.values()):
                  reject("local-package-set")
              if len(local) != sum("source" not in row for row in current.values()):
                  reject("local-package-set")
              if new_names & old_local.keys() or local.keys() != old_local.keys() | new_names:
                  reject("local-package-set")
              if "codex-tui" not in old_local:
                  reject("old-local-record")
              for name, previous in old_local.items():
                  actual = local[name]
                  if name != "codex-tui":
                      if actual != previous:
                          reject("old-local-record")
                      continue
                  if {k: v for k, v in previous.items() if k != "dependencies"} != {
                      k: v for k, v in actual.items() if k != "dependencies"
                  }:
                      reject("tui-record")
                  if not all(isinstance(row.get("dependencies"), list) and all(
                      isinstance(dep, str) for dep in row["dependencies"]
                  ) for row in (previous, actual)):
                      reject("tui-edges")
                  if collections.Counter(actual["dependencies"]) != (
                      collections.Counter(previous["dependencies"]) + collections.Counter(new_names)
                  ):
                      reject("tui-edges")
              old_external = collections.Counter(
                  json.dumps(row, sort_keys=True) for row in old.values() if "source" in row
              )
              current_external = collections.Counter(
                  json.dumps(row, sort_keys=True) for row in current.values() if "source" in row
              )
              if old_external - current_external:
                  reject("old-external-record")
              packages = metadata.get("packages") if isinstance(metadata, dict) else None
              resolve = metadata.get("resolve") if isinstance(metadata, dict) else None
              if not isinstance(packages, list) or not isinstance(resolve, dict):
                  reject("metadata-package")
              by_id, by_key = {}, {}
              for package in packages:
                  identity = key({k: v for k, v in package.items() if k != "source" or v is not None})
                  identifier = package.get("id")
                  if not isinstance(identifier, str) or not identifier or identifier in by_id or identity in by_key:
                      reject("metadata-ambiguity")
                  by_id[identifier], by_key[identity] = package, identifier
              nodes = resolve.get("nodes")
              if not isinstance(nodes, list):
                  reject("metadata-node")
              graph = {}
              for node in nodes:
                  identifier, dependencies = node.get("id"), node.get("dependencies")
                  if identifier not in by_id or identifier in graph or not isinstance(dependencies, list):
                      reject("metadata-node")
                  if any(not isinstance(dep, str) for dep in dependencies) or len(set(dependencies)) != len(dependencies):
                      reject("metadata-node")
                  graph[identifier] = dependencies
              if any(dep not in by_id or dep not in graph for deps in graph.values() for dep in deps):
                  reject("unresolved-metadata-edge")
              if set(manifests) != new_names:
                  reject("new-local-manifest")
              roots = []
              for name in sorted(new_names):
                  manifest = manifests[name]
                  expected_key = (name, package_version, None)
                  row = local[name]
                  if key(row) != expected_key or set(row) != {"name", "version", "dependencies"}:
                      reject("new-local-record")
                  identifier = by_key.get(expected_key)
                  if identifier is None or identifier not in graph:
                      reject("new-local-metadata")
                  package = by_id[identifier]
                  if manifest.get("name") != name or manifest.get("version") != package_version:
                      reject("new-local-manifest")
                  if package.get("manifest_path") != manifest.get("manifest_path"):
                      reject("new-local-manifest")
                  if identifier not in metadata.get("workspace_members", []):
                      reject("new-local-metadata")
                  expected_deps = collections.Counter(manifest["dependencies"])
                  declared = package.get("dependencies")
                  if not isinstance(declared, list) or any(not isinstance(dep, dict) for dep in declared):
                      reject("new-local-metadata")
                  if collections.Counter(dep.get("name") for dep in declared) != expected_deps:
                      reject("new-local-metadata")
                  if collections.Counter(by_id[dep]["name"] for dep in graph[identifier]) != expected_deps:
                      reject("new-local-edges")
                  if not isinstance(row["dependencies"], list):
                      reject("new-local-edges")
                  locked_ids = []
                  for dependency in row["dependencies"]:
                      match = re.fullmatch(r"([^\s]+)(?: ([^\s]+))?(?: \((.+)\))?", dependency) if isinstance(dependency, str) else None
                      if match is None:
                          reject("new-local-edges")
                      dep_name, dep_version, dep_source = match.groups()
                      matches = [identity for identity in current if identity[0] == dep_name
                          and (dep_version is None or identity[1] == dep_version)
                          and (dep_source is None or identity[2] == dep_source)]
                      if len(matches) != 1 or matches[0] not in by_key:
                          reject("new-local-edges")
                      locked_ids.append(by_key[matches[0]])
                  if collections.Counter(locked_ids) != collections.Counter(graph[identifier]):
                      reject("new-local-edges")
                  roots.append(identifier)
              reachable, pending = set(), list(roots)
              while pending:
                  identifier = pending.pop()
                  if identifier in reachable:
                      continue
                  reachable.add(identifier)
                  pending.extend(graph[identifier])
              additions = current_external - old_external
              for serialized in additions:
                  identifier = by_key.get(key(json.loads(serialized)))
