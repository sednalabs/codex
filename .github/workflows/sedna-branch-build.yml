name: sedna-branch-build
run-name: >-
  sedna-branch-build
  [target=${{ inputs.ref || github.ref_name }} platform=${{ inputs.platform }} host_only=${{ inputs.host_only }}]

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: false
        type: string
      platform:
        description: Preview artifact platform
        required: true
        default: linux-x86_64
        type: choice
        options:
          - linux-x86_64
          - linux-aarch64
          - macos
      host_only:
        description: Build only the Linux x86_64 code-mode host helper
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}-${{ inputs.platform }}-${{ inputs.host_only }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve preview metadata
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      display_ref: ${{ steps.meta.outputs.display_ref }}
      preview_version: ${{ steps.meta.outputs.preview_version }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Compute preview version
        id: meta
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          DISPLAY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          HOST_ONLY: ${{ inputs.host_only }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [[ "${HOST_ONLY}" == "true" && "${PLATFORM}" != "linux-x86_64" ]]; then
            echo "The code-mode host-only artifact is supported only on linux-x86_64." >&2
            exit 1
          fi
          checkout_ref="${CHECKOUT_REF}"
          short_sha="$(git rev-parse --short=8 HEAD)"
          latest_tag="$(git tag --merged HEAD --list 'v*-sedna.*' --sort=-version:refname | head -n 1)"
          if [[ -n "${latest_tag}" ]]; then
            base_version="${latest_tag#v}"
          else
            base_version="0.0.0-sedna.0"
          fi

          branch_name="${DISPLAY_REF}"
          branch_slug="$(printf '%s' "${branch_name}" | tr '/:@ ' '-' | tr -cd '[:alnum:]._-' | cut -c1-48)"
          preview_version="${base_version}-ci.${GITHUB_RUN_NUMBER}+g${short_sha}"

          {
            echo "checkout_ref=${checkout_ref}"
            echo "display_ref=${branch_name}"
            echo "preview_version=${preview_version}"
            echo "artifact_name=sedna-branch-${branch_slug}-${short_sha}"
          } >> "$GITHUB_OUTPUT"

  build-linux-x86_64:
    needs: metadata
    if: ${{ inputs.platform == 'linux-x86_64' }}
    uses: ./.github/workflows/_sedna-linux-rust.yml
    with:
      checkout_ref: ${{ needs.metadata.outputs.checkout_ref }}
      summary_title: Branch build
      setup_rusty_v8: true
      release_version: ${{ needs.metadata.outputs.preview_version }}
      target: x86_64-unknown-linux-gnu
      artifact_name: ${{ needs.metadata.outputs.artifact_name }}-x86_64-unknown-linux-gnu
      artifact_path: dist/*
      display_ref: ${{ needs.metadata.outputs.display_ref }}
      run_command: |
        if [[ '${{ inputs.host_only }}' == 'true' ]]; then
          source_status="$(git status --porcelain --untracked-files=normal)"
          if [[ -n "${source_status}" ]]; then
            echo "Refusing to build a preview from a dirty source tree." >&2
            printf '%s\n' "${source_status}" >&2
            exit 1
          fi
          source ../.github/scripts/validation-lanes/setup-rusty-v8.sh x86_64-unknown-linux-gnu
          cargo build --locked --target x86_64-unknown-linux-gnu --release --bin codex-code-mode-host
          mkdir -p ../dist

          stage_dir="${RUNNER_TEMP}/sedna-branch/x86_64-unknown-linux-gnu-host-only"
          file_version="${CODEX_RELEASE_VERSION//+/__}"
          archive_base="codex-sedna-preview-host-${file_version}-x86_64-unknown-linux-gnu"
          rm -rf "${stage_dir}"
          mkdir -p "${stage_dir}"
          install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex-code-mode-host" "${stage_dir}/codex-code-mode-host"

          file "${stage_dir}/codex-code-mode-host" | grep -F 'x86-64'
          readelf -l "${stage_dir}/codex-code-mode-host" | grep -F '/lib64/ld-linux-x86-64.so.2'
          "${stage_dir}/codex-code-mode-host" --help >/dev/null
          tar -C "${stage_dir}" -czf "../dist/${archive_base}.tar.gz" .
          (cd "${stage_dir}" && sha256sum codex-code-mode-host) > "../dist/${archive_base}.binary.sha256"
          (cd ../dist && sha256sum "${archive_base}.tar.gz") > "../dist/${archive_base}.tar.gz.sha256"

          python3 - <<'PY' > "../dist/${archive_base}.json"
        import hashlib
        import json
        import os
        import subprocess
        import sys

        binary_path = os.path.join(
            os.environ["RUNNER_TEMP"],
            "sedna-branch/x86_64-unknown-linux-gnu-host-only/codex-code-mode-host",
        )
        payload = {
            "repository": os.environ["GITHUB_REPOSITORY"],
            "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "workflowCommit": subprocess.check_output(
                ["git", "-C", "../.workflow-src", "rev-parse", "HEAD"], text=True
            ).strip(),
            "ref": os.environ["DISPLAY_REF"],
            "previewVersion": os.environ["CODEX_RELEASE_VERSION"],
            "artifact": "codex-code-mode-host",
            "binarySha256": "",
            "workflow": (
                f'{os.environ["GITHUB_SERVER_URL"]}/'
                f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
            ),
        }
        with open(binary_path, "rb") as binary_file:
            payload["binarySha256"] = hashlib.sha256(binary_file.read()).hexdigest()
        json.dump(payload, sys.stdout, indent=2)
        sys.stdout.write("\n")
        PY
          exit 0
        fi
        source_status="$(git status --porcelain --untracked-files=normal)"
        if [[ -n "${source_status}" ]]; then
          echo "Refusing to build a preview from a dirty source tree." >&2
          printf '%s\n' "${source_status}" >&2
          exit 1
        fi
        cargo build --locked --target x86_64-unknown-linux-gnu --release --bin codex --bin codex-code-mode-host --bin codex-responses-api-proxy --bin codex-runtime-proof-launcher
        mkdir -p ../dist

        stage_dir="${RUNNER_TEMP}/sedna-branch/x86_64-unknown-linux-gnu"
        file_version="${CODEX_RELEASE_VERSION//+/__}"
        archive_base="codex-sedna-preview-${file_version}-x86_64-unknown-linux-gnu"

        rm -rf "${stage_dir}"
        mkdir -p "${stage_dir}"

        install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex" "${stage_dir}/codex"
        install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex-code-mode-host" "${stage_dir}/codex-code-mode-host"
        install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex-responses-api-proxy" "${stage_dir}/codex-responses-api-proxy"
        install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex-runtime-proof-launcher" "${stage_dir}/codex-runtime-proof-launcher"
        install -Dm 0755 runtime-proof/install_runtime_proof_launcher "${stage_dir}/install_runtime_proof_launcher"
        install -Dm 0644 runtime-proof/systemd/codex-runtime-proof-claim.service "${stage_dir}/systemd/codex-runtime-proof-claim.service"
        (cd "${stage_dir}" && sha256sum codex-runtime-proof-launcher > codex-runtime-proof-launcher.sha256)

        file "${stage_dir}/codex" | grep -F 'x86-64'
        readelf -l "${stage_dir}/codex" | grep -F '/lib64/ld-linux-x86-64.so.2'
        version_output="$("${stage_dir}/codex" --version)"
        printf '%s\n' "${version_output}"
        if [[ "${version_output}" == *-dirty* ]]; then
          echo "Preview binary unexpectedly contains dirty git provenance." >&2
          exit 1
        fi
        "${stage_dir}/codex" --help >/dev/null
        "${stage_dir}/codex-code-mode-host" --help >/dev/null
        "${stage_dir}/codex" exec --help >/dev/null
        "${stage_dir}/codex" app-server --help >/dev/null
        "${stage_dir}/codex-responses-api-proxy" --help >/dev/null
        file "${stage_dir}/codex-runtime-proof-launcher" | grep -F 'x86-64'
        readelf -l "${stage_dir}/codex-runtime-proof-launcher" | grep -F '/lib64/ld-linux-x86-64.so.2'

        smoke_target=/usr/libexec/codex
        if sudo test -e "${smoke_target}" || sudo test -L "${smoke_target}"; then
          echo "Refusing launcher install smoke because the fixed target already exists." >&2
          exit 1
        fi
        smoke_target_created=0
        smoke_package_dir=
        smoke_unsafe_package_dir=
        cleanup_installer_smoke() {
          if (( smoke_target_created == 1 )); then
            sudo rm -rf -- "${smoke_target}"
          fi
          if [[ -n "${smoke_package_dir}" ]]; then
            sudo rm -rf -- "${smoke_package_dir}"
          fi
          if [[ -n "${smoke_unsafe_package_dir}" ]]; then
            sudo rm -rf -- "${smoke_unsafe_package_dir}"
          fi
        }
        trap cleanup_installer_smoke EXIT
        sudo install -d -o root -g root -m 0700 -- "${smoke_target}"
        smoke_target_created=1
        if sudo "${stage_dir}/install_runtime_proof_launcher" >/dev/null 2>&1; then
          echo "The runtime-proof installer accepted user-owned package staging." >&2
          exit 1
        fi
        smoke_unsafe_package_dir="${stage_dir}/root-owned-installer-stage"
        sudo install -d -o root -g root -m 0700 -- "${smoke_unsafe_package_dir}"
        sudo install -o root -g root -m 0755 -- \
          "${stage_dir}/install_runtime_proof_launcher" \
          "${smoke_unsafe_package_dir}/install_runtime_proof_launcher"
        sudo install -o root -g root -m 0755 -- \
          "${stage_dir}/codex-runtime-proof-launcher" \
          "${smoke_unsafe_package_dir}/codex-runtime-proof-launcher"
        sudo install -o root -g root -m 0644 -- \
          "${stage_dir}/codex-runtime-proof-launcher.sha256" \
          "${smoke_unsafe_package_dir}/codex-runtime-proof-launcher.sha256"
        if sudo "${smoke_unsafe_package_dir}/install_runtime_proof_launcher" >/dev/null 2>&1; then
          echo "The runtime-proof installer accepted a root-owned stage under a user-controlled parent." >&2
          exit 1
        fi
        sudo rm -rf -- "${smoke_unsafe_package_dir}"
        smoke_unsafe_package_dir=
        smoke_package_dir="$(sudo mktemp -d /run/codex-runtime-proof-installer.XXXXXX)"
        sudo install -o root -g root -m 0755 -- \
          "${stage_dir}/install_runtime_proof_launcher" \
          "${smoke_package_dir}/install_runtime_proof_launcher"
        sudo install -o root -g root -m 0755 -- \
          "${stage_dir}/codex-runtime-proof-launcher" \
          "${smoke_package_dir}/codex-runtime-proof-launcher"
        sudo install -o root -g root -m 0644 -- \
          "${stage_dir}/codex-runtime-proof-launcher.sha256" \
          "${smoke_package_dir}/codex-runtime-proof-launcher.sha256"
        printf '%s\n' 'preserved predecessor fixture' > "${RUNNER_TEMP}/runtime-proof-launcher-predecessor"
        sudo install -o root -g root -m 0755 -- \
          "${RUNNER_TEMP}/runtime-proof-launcher-predecessor" \
          "${smoke_target}/codex-runtime-proof-launcher"
        predecessor_sha256="$(sha256sum "${RUNNER_TEMP}/runtime-proof-launcher-predecessor" | cut -d' ' -f1)"
        staged_launcher_sha256="$(sha256sum "${stage_dir}/codex-runtime-proof-launcher" | cut -d' ' -f1)"
        sudo "${smoke_package_dir}/install_runtime_proof_launcher"
        installed_launcher_sha256="$(sudo sha256sum "${smoke_target}/codex-runtime-proof-launcher" | cut -d' ' -f1)"
        rollback_sha256="$(sudo sha256sum "${smoke_target}/.codex-runtime-proof-launcher.rollback-${predecessor_sha256}" | cut -d' ' -f1)"
        [[ "${installed_launcher_sha256}" == "${staged_launcher_sha256}" ]]
        [[ "${rollback_sha256}" == "${predecessor_sha256}" ]]
        [[ "$(sudo stat -c '%u:%g:%a' -- "${smoke_target}")" == '0:0:711' ]]
        [[ "$(sudo stat -c '%u:%g:%a' -- "${smoke_target}/codex-runtime-proof-launcher")" == '0:0:755' ]]
        [[ "$(sudo stat -c '%u:%g:%a' -- "${smoke_target}/.codex-runtime-proof-launcher.rollback-${predecessor_sha256}")" == '0:0:600' ]]
        sudo rm -rf -- "${smoke_target}"
        smoke_target_created=0
        sudo rm -rf -- "${smoke_package_dir}"
        smoke_package_dir=
        if [[ -n "${smoke_unsafe_package_dir}" ]]; then
          sudo rm -rf -- "${smoke_unsafe_package_dir}"
          smoke_unsafe_package_dir=
        fi
        trap - EXIT

        tar -czf "${GITHUB_WORKSPACE}/dist/${archive_base}.tar.gz" -C "${stage_dir}" .

        ARCHIVE_PATH="${GITHUB_WORKSPACE}/dist/${archive_base}.tar.gz" python3 - <<'PY' > "../dist/${archive_base}.json"
        import hashlib
        import json
        import os
        import subprocess
        import sys
        import tarfile

        payload = {
            "repository": os.environ["GITHUB_REPOSITORY"],
            "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "ref": os.environ["DISPLAY_REF"],
            "previewVersion": os.environ["CODEX_RELEASE_VERSION"],
            "workflow": (
                f'{os.environ["GITHUB_SERVER_URL"]}/'
                f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
            ),
        }
        launcher_path = os.path.join(
            os.environ["RUNNER_TEMP"],
            "sedna-branch/x86_64-unknown-linux-gnu/codex-runtime-proof-launcher",
        )
        with open(launcher_path, "rb") as launcher_file:
            payload["runtimeProofLauncherSha256"] = hashlib.sha256(launcher_file.read()).hexdigest()
        installer_path = os.path.join(
            os.environ["RUNNER_TEMP"],
            "sedna-branch/x86_64-unknown-linux-gnu/install_runtime_proof_launcher",
        )
        with open(installer_path, "rb") as installer_file:
            payload["runtimeProofLauncherInstallerSha256"] = hashlib.sha256(
                installer_file.read()
            ).hexdigest()
        with tarfile.open(os.environ["ARCHIVE_PATH"], "r:gz") as archive:
            members = [
                member
                for member in archive.getmembers()
                if member.name in {"./codex-runtime-proof-launcher", "codex-runtime-proof-launcher"}
            ]
            if len(members) != 1 or not members[0].isfile():
                raise SystemExit("preview archive is missing the runtime-proof launcher")
            packaged_launcher = archive.extractfile(members[0])
            if packaged_launcher is None:
                raise SystemExit("preview archive runtime-proof launcher is unreadable")
            archive_digest = hashlib.sha256()
            for block in iter(lambda: packaged_launcher.read(1024 * 1024), b""):
                archive_digest.update(block)
            if archive_digest.hexdigest() != payload["runtimeProofLauncherSha256"]:
                raise SystemExit("preview archive runtime-proof launcher does not match its manifest")
            installer_members = [
                member
                for member in archive.getmembers()
                if member.name
                in {"./install_runtime_proof_launcher", "install_runtime_proof_launcher"}
            ]
            checksum_members = [
                member
                for member in archive.getmembers()
                if member.name
                in {"./codex-runtime-proof-launcher.sha256", "codex-runtime-proof-launcher.sha256"}
            ]
            if (
                len(installer_members) != 1
                or not installer_members[0].isfile()
                or installer_members[0].mode & 0o111 == 0
            ):
                raise SystemExit("preview archive is missing the runtime-proof installer")
            if len(checksum_members) != 1 or not checksum_members[0].isfile():
                raise SystemExit("preview archive is missing the runtime-proof launcher checksum")
            packaged_installer = archive.extractfile(installer_members[0])
            packaged_checksum = archive.extractfile(checksum_members[0])
            if packaged_installer is None or packaged_checksum is None:
                raise SystemExit("preview archive runtime-proof install inputs are unreadable")
            installer_digest = hashlib.sha256()
            for block in iter(lambda: packaged_installer.read(1024 * 1024), b""):
                installer_digest.update(block)
            if installer_digest.hexdigest() != payload["runtimeProofLauncherInstallerSha256"]:
                raise SystemExit("preview archive runtime-proof installer does not match its manifest")
            checksum_content = packaged_checksum.read().decode("ascii")
            expected_checksum = (
                f'{payload["runtimeProofLauncherSha256"]}  codex-runtime-proof-launcher\n'
            )
            if checksum_content != expected_checksum:
                raise SystemExit("preview archive launcher checksum does not match its manifest")
        json.dump(payload, sys.stdout, indent=2)
        sys.stdout.write("\n")
        PY

  build-linux-aarch64:
    needs: metadata
    if: ${{ inputs.platform == 'linux-aarch64' }}
    uses: ./.github/workflows/_sedna-linux-rust.yml
    with:
      checkout_ref: ${{ needs.metadata.outputs.checkout_ref }}
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      summary_title: Branch build
      setup_rusty_v8: true
      release_version: ${{ needs.metadata.outputs.preview_version }}
      artifact_name: ${{ needs.metadata.outputs.artifact_name }}-aarch64-unknown-linux-gnu
      artifact_path: dist/*
      display_ref: ${{ needs.metadata.outputs.display_ref }}
      run_command: |
        source_status="$(git status --porcelain --untracked-files=normal)"
        if [[ -n "${source_status}" ]]; then
          echo "Refusing to build a preview from a dirty source tree." >&2
          printf '%s\n' "${source_status}" >&2
          exit 1
        fi
        cargo build --locked --target aarch64-unknown-linux-gnu --release --bin codex --bin codex-code-mode-host --bin codex-responses-api-proxy --bin codex-runtime-proof-launcher
        mkdir -p ../dist

        stage_dir="${RUNNER_TEMP}/sedna-branch/aarch64-unknown-linux-gnu"
        file_version="${CODEX_RELEASE_VERSION//+/__}"
        archive_base="codex-sedna-preview-${file_version}-aarch64-unknown-linux-gnu"

        rm -rf "${stage_dir}"
        mkdir -p "${stage_dir}"

        install -Dm 0755 "target/aarch64-unknown-linux-gnu/release/codex" "${stage_dir}/codex"
        install -Dm 0755 "target/aarch64-unknown-linux-gnu/release/codex-code-mode-host" "${stage_dir}/codex-code-mode-host"
        install -Dm 0755 "target/aarch64-unknown-linux-gnu/release/codex-responses-api-proxy" "${stage_dir}/codex-responses-api-proxy"
        install -Dm 0755 "target/aarch64-unknown-linux-gnu/release/codex-runtime-proof-launcher" "${stage_dir}/codex-runtime-proof-launcher"
        install -Dm 0755 runtime-proof/install_runtime_proof_launcher "${stage_dir}/install_runtime_proof_launcher"
        install -Dm 0644 runtime-proof/systemd/codex-runtime-proof-claim.service "${stage_dir}/systemd/codex-runtime-proof-claim.service"
        (cd "${stage_dir}" && sha256sum codex-runtime-proof-launcher > codex-runtime-proof-launcher.sha256)

        file "${stage_dir}/codex" | grep -F 'ARM aarch64'
        readelf -l "${stage_dir}/codex" | grep -F '/lib/ld-linux-aarch64.so.1'
        version_output="$("${stage_dir}/codex" --version)"
        printf '%s\n' "${version_output}"
        if [[ "${version_output}" == *-dirty* ]]; then
          echo "Preview binary unexpectedly contains dirty git provenance." >&2
          exit 1
        fi
        "${stage_dir}/codex" --help >/dev/null
        "${stage_dir}/codex-code-mode-host" --help >/dev/null
        "${stage_dir}/codex" exec --help >/dev/null
        "${stage_dir}/codex" app-server --help >/dev/null
        "${stage_dir}/codex-responses-api-proxy" --help >/dev/null
        file "${stage_dir}/codex-runtime-proof-launcher" | grep -F 'ARM aarch64'
        readelf -l "${stage_dir}/codex-runtime-proof-launcher" | grep -F '/lib/ld-linux-aarch64.so.1'

        tar -C "${stage_dir}" -czf "../dist/${archive_base}.tar.gz" .

        ARCHIVE_PATH="../dist/${archive_base}.tar.gz" python3 - <<'PY' > "../dist/${archive_base}.json"
        import hashlib
        import json
        import os
        import subprocess
        import sys
        import tarfile

        payload = {
            "repository": os.environ["GITHUB_REPOSITORY"],
            "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "ref": os.environ["DISPLAY_REF"],
            "previewVersion": os.environ["CODEX_RELEASE_VERSION"],
            "target": "aarch64-unknown-linux-gnu",
            "workflow": (
                f'{os.environ["GITHUB_SERVER_URL"]}/'
                f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
            ),
        }
        launcher_path = os.path.join(
            os.environ["RUNNER_TEMP"],
            "sedna-branch/aarch64-unknown-linux-gnu/codex-runtime-proof-launcher",
        )
        with open(launcher_path, "rb") as launcher_file:
            payload["runtimeProofLauncherSha256"] = hashlib.sha256(launcher_file.read()).hexdigest()
        installer_path = os.path.join(
            os.environ["RUNNER_TEMP"],
            "sedna-branch/aarch64-unknown-linux-gnu/install_runtime_proof_launcher",
        )
        with open(installer_path, "rb") as installer_file:
            payload["runtimeProofLauncherInstallerSha256"] = hashlib.sha256(
                installer_file.read()
            ).hexdigest()
        archive_path = os.environ["ARCHIVE_PATH"]
        with tarfile.open(archive_path, "r:gz") as archive:
            for member_name, expected_digest in (
                ("codex-runtime-proof-launcher", payload["runtimeProofLauncherSha256"]),
                ("install_runtime_proof_launcher", payload["runtimeProofLauncherInstallerSha256"]),
            ):
                members = [
                    member
                    for member in archive.getmembers()
                    if member.name in {f"./{member_name}", member_name}
                ]
                if (
                    len(members) != 1
                    or not members[0].isfile()
                    or (member_name == "install_runtime_proof_launcher" and members[0].mode & 0o111 == 0)
                ):
                    raise SystemExit(f"preview archive is missing {member_name}")
                packaged_file = archive.extractfile(members[0])
                if packaged_file is None:
                    raise SystemExit(f"preview archive {member_name} is unreadable")
                digest = hashlib.sha256()
                for block in iter(lambda: packaged_file.read(1024 * 1024), b""):
                    digest.update(block)
                if digest.hexdigest() != expected_digest:
                    raise SystemExit(f"preview archive {member_name} does not match its manifest")
            checksum_members = [
                member
                for member in archive.getmembers()
                if member.name
                in {"./codex-runtime-proof-launcher.sha256", "codex-runtime-proof-launcher.sha256"}
            ]
            if len(checksum_members) != 1 or not checksum_members[0].isfile():
                raise SystemExit("preview archive is missing the runtime-proof launcher checksum")
            packaged_checksum = archive.extractfile(checksum_members[0])
            expected_checksum = (
                f'{payload["runtimeProofLauncherSha256"]}  codex-runtime-proof-launcher\n'
            )
            if packaged_checksum is None or packaged_checksum.read().decode("ascii") != expected_checksum:
                raise SystemExit("preview archive launcher checksum does not match its manifest")
        json.dump(payload, sys.stdout, indent=2)
        sys.stdout.write("\n")
        PY

  build-macos:
    name: Build macOS preview - x86_64-apple-darwin
    needs: metadata
    if: ${{ inputs.platform == 'macos' }}
    runs-on: macos-15-intel
    timeout-minutes: 210
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
      SCCACHE_CACHE_SIZE: 2G
      CODEX_RELEASE_REPOSITORY: ${{ github.repository }}
      CODEX_RELEASE_TAG_PREFIX: v
      CODEX_RELEASE_VERSION: ${{ needs.metadata.outputs.preview_version }}
      DISPLAY_REF: ${{ needs.metadata.outputs.display_ref }}
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Require the selected workflow ref for macOS previews
        if: ${{ inputs.ref != '' }}
        shell: bash
        run: |
          echo "macOS preview builds use the workflow's selected ref; leave the ref input empty." >&2
          exit 1

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-apple-darwin

      - name: Compute Rust cache keys
        id: lockhash
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(shasum -a 256 Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(shasum -a 256 rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/.rusty_v8/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: sedna-preview-cargo-home-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            sedna-preview-cargo-home-macos-15-intel-x86_64-apple-darwin-

      - name: Install sccache
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: sccache

      - name: Configure sccache backend
        id: sccache_backend
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/configure_sccache_backend.sh write-fallback

      - name: Enable sccache wrapper
        if: ${{ steps.sccache_backend.outputs.backend != 'off' }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(command -v sccache)"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Restore sccache cache
        if: ${{ steps.sccache_backend.outputs.backend == 'fallback' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sedna-preview-sccache-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}
          restore-keys: |
            sedna-preview-sccache-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-
            sedna-preview-sccache-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-apple-darwin

      - name: Build macOS preview binaries
        id: build_macos
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --target "${TARGET}" \
            --release \
            --bin codex \
            --bin codex-code-mode-host \
            --bin codex-responses-api-proxy

      - name: Stage ad hoc signed macOS preview artifact
        shell: bash
        run: |
          set -euo pipefail

          stage_dir="${RUNNER_TEMP}/sedna-branch/${TARGET}"
          dist_dir="${GITHUB_WORKSPACE}/dist"
          file_version="${CODEX_RELEASE_VERSION//+/__}"
          archive_base="codex-sedna-preview-${file_version}-${TARGET}"
          binaries=(codex codex-code-mode-host codex-responses-api-proxy)

          rm -rf "${stage_dir}"
          mkdir -p "${stage_dir}" "${dist_dir}"

          for binary in "${binaries[@]}"; do
            source_path="target/${TARGET}/release/${binary}"
            staged_path="${stage_dir}/${binary}"
            entitlements="${GITHUB_WORKSPACE}/.github/scripts/macos-signing/${binary}.entitlements.plist"
            install -m 0755 "${source_path}" "${staged_path}"
            "${GITHUB_WORKSPACE}/.github/scripts/macos-signing/sign_macos_code.sh" \
              --target "${staged_path}" \
              --identity - \
              --deep false \
              --identifier "${binary}" \
              --options runtime \
              --timestamp none \
              --entitlements "${entitlements}"
            codesign --verify --strict --verbose=2 "${staged_path}"
          done

          "${stage_dir}/codex" --version
          tar -C "${stage_dir}" -czf "${dist_dir}/${archive_base}.tar.gz" .

          python3 - <<'PY' > "${dist_dir}/${archive_base}.json"
          import json
          import os
          import subprocess
          import sys

          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "ref": os.environ["DISPLAY_REF"],
              "previewVersion": os.environ["CODEX_RELEASE_VERSION"],
              "target": os.environ["TARGET"],
              "signing": "ad-hoc",
              "notarized": False,
              "workflow": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/'
                  f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
              ),
          }
          json.dump(payload, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PY

          (
            cd "${dist_dir}"
            shasum -a 256 ./* > SHA256SUMS.txt
          )

      - name: Upload macOS preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}-x86_64-apple-darwin
          path: dist/*
          if-no-files-found: error
          retention-days: 3

      - name: Report sccache statistics
        if: ${{ always() && steps.sccache_backend.outputs.backend != 'off' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### sccache stats — x86_64-apple-darwin (release)"
            echo
            echo '```text'
            sccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Cargo home cache
        if: ${{ always() && !cancelled() && steps.build_macos.outcome == 'success' && steps.cache_cargo_home_restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/.rusty_v8/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: sedna-preview-cargo-home-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache
        if: ${{ always() && !cancelled() && steps.build_macos.outcome == 'success' && steps.sccache_backend.outputs.backend == 'fallback' && steps.sccache_backend.outputs.policy == 'write-fallback' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sedna-preview-sccache-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}
