            --target "${CODEX_TARGET}" \
            --variant codex \
            --cargo-profile release \
            --package-dir "${RUNNER_TEMP}/codex-package-${CODEX_TARGET}" \
            --force
          CODEX_REPO_ROOT="${PWD}" GITHUB_WORKSPACE="${PWD}" \
            bash .github/scripts/build-codex-package-archive.sh \
              --target "${CODEX_TARGET}" \
              --bundle primary \
              --entrypoint-dir "${CARGO_TARGET_DIR}/${CODEX_TARGET}/release" \
              --archive-dir "${CODEX_PACKAGE_OUT}"
          cargo build --manifest-path codex-rs/Cargo.toml --locked --release --target "${CODEX_TARGET}" \
            -p codex-responses-api-proxy
          install -Dm 0755 \
            "${CARGO_TARGET_DIR}/${CODEX_TARGET}/release/codex-responses-api-proxy" \
            "${CODEX_PACKAGE_OUT}/codex-responses-api-proxy"
          cp "${RUNNER_TEMP}/codex-package-${CODEX_TARGET}/codex-package.json" \
            "${CODEX_PACKAGE_OUT}/codex-package.json"
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Build modified the exact product source worktree; refusing artifact publication." >&2
            git status --short >&2
            exit 1
          fi
      - name: Write H/B/T and artifact digest manifest
        working-directory: product
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          WORKFLOW_HOST_SHA: ${{ github.sha }}
          RUNNER_LABEL: ubuntu-24.04-arm
          RUST_TARGET: aarch64-unknown-linux-gnu
          PRODUCT_ARCH: aarch64
          PACKAGE_OUT: ${{ runner.temp }}/codex-first-binary
        run: |
          set -euo pipefail
          WORKFLOW_HOST_SHA="$(git -C "${GITHUB_WORKSPACE}/.workflow-src" rev-parse HEAD)" \
          PRODUCT_SHA="$(git rev-parse HEAD)" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          package_out = Path(os.environ["PACKAGE_OUT"])
          target = os.environ["RUST_TARGET"]
          package_manifest = json.loads((package_out / "codex-package.json").read_text())
          if package_manifest.get("version") != "0.160.0-dev.sedna.1":
              raise SystemExit(
                  "package manifest is not the admitted source-derived development version"
              )

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()
          files = [
              f"codex-package-{target}.tar.zst",
              "codex-package.json",
              "codex-responses-api-proxy",
          ]
          digests = {}
          for name in files:
              path = package_out / name
              if not path.is_file():
                  raise SystemExit(f"required package artifact is missing: {name}")
              digests[name] = sha256_file(path)
          payload = {
              "schema_version": "sedna-first-binary-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/'
                  f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
              ),
              "workflow_host_sha": os.environ["WORKFLOW_HOST_SHA"],
              "product_sha": os.environ["PRODUCT_SHA"],
              "comparison_base_sha": os.environ["BASE_SHA"],
              "target": target,
              "architecture": os.environ["PRODUCT_ARCH"],
              "runner_label": os.environ["RUNNER_LABEL"],
              "package_version": package_manifest["version"],
              "artifacts_sha256": digests,
          }
          (package_out / "manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
