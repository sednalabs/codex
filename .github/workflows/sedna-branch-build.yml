      - name: Install only the pinned Bazel module resolver
        if: ${{ steps.preparation_identity.outputs.computer-use == 'true' }}
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: 1.28.1
          token: ""
      - name: Update and verify only the exact computer-use module lock
        if: ${{ steps.preparation_identity.outputs.computer-use == 'true' }}
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          unset BAZELISK_GITHUB_TOKEN
          [[ "$(cat .bazelversion)" == "9.0.0" ]] || {
            echo "module preparation requires the admitted Bazel 9.0.0" >&2
            exit 1
          }
          bazel_args=(--ignore_all_rc_files "--output_base=${RUNNER_TEMP}/computer-use-bazel")
          [[ "$(bazel "${bazel_args[@]}" version --gnu_format)" == "bazel 9.0.0" ]] || {
            echo "module resolver did not select Bazel 9.0.0" >&2
            exit 1
          }
          printf 'bazel 9.0.0\n' > "${RUNNER_TEMP}/computer-use-bazel-version.txt"
          bazel "${bazel_args[@]}" mod deps --lockfile_mode=update
          cp MODULE.bazel.lock "${RUNNER_TEMP}/MODULE.bazel.lock.after"
          bazel "${bazel_args[@]}" mod deps --lockfile_mode=error
          cmp MODULE.bazel.lock "${RUNNER_TEMP}/MODULE.bazel.lock.after"
      - name: Validate the lock delta and generated-path allowlist
        if: ${{ inputs.preparation_profile == 'cargo-schema' }}
        shell: bash
        env:
          WORKFLOW_HOST_SHA: ${{ github.sha }}
          PRODUCT_SHA: ${{ inputs.target_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          COMPUTER_USE_PREPARATION: ${{ steps.preparation_identity.outputs.computer-use }}
          MODE: ${{ inputs.mode }}
          PREPARATION_PROFILE: ${{ inputs.preparation_profile }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          root = Path(os.environ["PRODUCT_ROOT"])
          before_lock = Path(os.environ["LOCK_BEFORE"])
          after_lock = root / "codex-rs/Cargo.lock"
          computer_use = os.environ["COMPUTER_USE_PREPARATION"] == "true"
          closed_checks = None
          if computer_use:
              if (os.environ["MODE"], os.environ["PREPARATION_PROFILE"], os.environ["PRODUCT_SHA"], os.environ["BASE_SHA"]) != (
                  "prepare-only", "cargo-schema", "3cd6436609ad59eed7f174a8c3aa6e3a67c1dbec",
                  "8389b61d82cb6fb936e4e500b977f31682441ffe",
              ):
                  raise SystemExit("closed preparation identity changed before export")
              closed_checks = json.loads(Path(
                  os.environ["RUNNER_TEMP"], "computer-use-lock-validation.json"
              ).read_text(encoding="utf-8"))
              if hashlib.sha256(after_lock.read_bytes()).hexdigest() != closed_checks["cargo_lock_validated_sha256"]:
                  raise SystemExit("Bazel module resolution changed the validated Cargo.lock")
          with before_lock.open("rb") as stream:
              before = tomllib.load(stream)
          with after_lock.open("rb") as stream:
              after = tomllib.load(stream)

          with (root / "codex-rs/Cargo.toml").open("rb") as stream:
              workspace_manifest = tomllib.load(stream)
          package_version = workspace_manifest["workspace"]["package"]["version"]
          expected_package_version = "0.160.0-dev.sedna.1"
          if package_version != expected_package_version:
              raise SystemExit(
                  "workspace package version is not the admitted fork development version: "
                  f"{package_version!r}"
              )

          def external_packages(lock):
              return collections.Counter(
                  json.dumps(package, sort_keys=True, separators=(",", ":"))
                  for package in lock.get("package", [])
                  if "source" in package
              )

          def local_package_names(lock):
              return collections.Counter(
                  package["name"]
                  for package in lock.get("package", [])
                  if "source" not in package
              )

          before_external = external_packages(before)
          after_external = external_packages(after)
          if before_external - after_external:
              raise SystemExit(
                  "Cargo.lock refresh removed or changed an already-locked external dependency"
              )
          if not computer_use and local_package_names(before) != local_package_names(after):
              raise SystemExit("Cargo.lock refresh changed the local workspace package set")

          exact_files = {
              "codex-rs/Cargo.lock",
              "codex-rs/app-server-protocol/schema/precomputed/app-server-exports-stable.json.zst",
              "sdk/python/src/openai_codex/generated/v2_all.py",
              "sdk/python/src/openai_codex/generated/notification_registry.py",
              "sdk/python/src/openai_codex/api.py",
          }
          generated_prefixes = (
              "codex-rs/app-server-protocol/schema/typescript/",
              "codex-rs/app-server-protocol/schema/json/",
          )
          if computer_use:
              exact_files = {"codex-rs/Cargo.lock", "MODULE.bazel.lock"}
              generated_prefixes = ()

          status = subprocess.check_output(
              ["git", "-C", str(root), "status", "--porcelain=v1", "-z", "--untracked-files=all"]
          )
          changed_paths = []
          untracked_paths = []
          for entry in status.split(b"\0"):
              if not entry:
                  continue
              if len(entry) < 4 or entry[2:3] != b" ":
                  raise SystemExit(f"unrecognized git status record: {entry!r}")
              state = entry[:2].decode("ascii")
              path = entry[3:].decode("utf-8", errors="strict")
              if "R" in state or "C" in state:
                  raise SystemExit(f"rename/copy is outside generated-path contract: {path}")
              if path not in exact_files and not path.startswith(generated_prefixes):
                  raise SystemExit(f"generated path is outside explicit allowlist: {path}")
              changed_paths.append(path)
              if state == "??":
                  untracked_paths.append(path)
          if not computer_use and "codex-rs/Cargo.lock" not in changed_paths:
              raise SystemExit("Cargo.lock did not change; refusing to emit an incomplete prep artifact")
          if computer_use and not changed_paths:
              raise SystemExit("neither admitted lock changed; refusing an empty prep artifact")
          changed_paths = sorted(set(changed_paths))

          if untracked_paths:
              subprocess.run(
                  ["git", "-C", str(root), "add", "--intent-to-add", "--", *untracked_paths],
                  check=True,
              )
          diff = subprocess.check_output(
              ["git", "-C", str(root), "diff", "--binary", "--full-index", "--no-ext-diff", "HEAD", "--"]
          )
          diff_path = Path(os.environ["DIFF_OUT"])
          diff_path.write_bytes(diff)
          Path(os.environ["RUNNER_TEMP"], "changed-paths.txt").write_text(
              "".join(f"{path}\n" for path in changed_paths), encoding="utf-8"
          )
          Path(os.environ["RUNNER_TEMP"], "Cargo.lock.after").write_bytes(after_lock.read_bytes())
          lock_sha256 = hashlib.sha256(after_lock.read_bytes()).hexdigest()
          diff_sha256 = hashlib.sha256(diff).hexdigest()
          identity = {
              "schema_version": "sedna-cargo-schema-prep-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/'
                  f'actions/runs/{os.environ["GITHUB_RUN_ID"]}'
              ),
              "workflow_host_sha": os.environ["WORKFLOW_HOST_SHA"],
              "product_sha": os.environ["PRODUCT_SHA"],
              "comparison_base_sha": os.environ["BASE_SHA"],
              "runner_label": "ubuntu-24.04",
              "architecture": "x86_64",
              "package_version": package_version,
              "new_external_package_records": sum((after_external - before_external).values()),
              "cargo_lock_before_sha256": hashlib.sha256(before_lock.read_bytes()).hexdigest(),
              "cargo_lock_after_sha256": lock_sha256,
              "source_diff_sha256": diff_sha256,
              "changed_paths": changed_paths,
              "allowed_exact_paths": sorted(exact_files),
              "allowed_generated_prefixes": list(generated_prefixes),
          }
          if computer_use:
              temporary = Path(os.environ["RUNNER_TEMP"])
              module_before = temporary / "MODULE.bazel.lock.before"
              module_after = root / "MODULE.bazel.lock"
              if module_after.read_bytes() != (temporary / "MODULE.bazel.lock.after").read_bytes():
                  raise SystemExit("verified module lock changed before export")
              def tree(directory, revision):
                  return subprocess.check_output(
                      ["git", "-C", str(directory), "rev-parse", revision + "^{tree}"], text=True
                  ).strip()
              trees = {
                  "workflow_host_tree": tree(Path(os.environ["GITHUB_WORKSPACE"]) / ".workflow-src", "HEAD"),
                  "product_tree": tree(root, "HEAD"),
                  "comparison_base_tree": tree(root, os.environ["BASE_SHA"]),
              }
              if trees["product_tree"] != "2ac607f108d3e8ddd5df1eb7ac393d355de2a121" or trees["comparison_base_tree"] != "699cd8b075e3aeafff573557612cdb944eb75c0a":
                  raise SystemExit("closed preparation input trees differ")
              versions = {}
              for tool, expected in (("rustc", "1.95.0"), ("cargo", "1.95.0"), ("uv", "0.11.3")):
                  report = subprocess.check_output([tool, "--version"], text=True).strip()
                  if report.split()[:2] != [tool, expected]:
                      raise SystemExit("preparation tool version differs from its pin")
                  versions[tool] = report
              if (temporary / "computer-use-bazel-version.txt").read_text(encoding="utf-8") != "bazel 9.0.0\n":
                  raise SystemExit("Bazel version evidence is missing")
              identity.update(trees)
              identity.update({
                  "mode": os.environ["MODE"],
                  "preparation_profile": os.environ["PREPARATION_PROFILE"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "tool_versions": dict(versions, bazel="9.0.0"),
                  "setup_bazel_action": "bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86",
                  "bazelisk_version": "1.28.1",
                  "bazelisk_version_evidence": "pinned-setup-action-input",
                  "checkout_action": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
                  "rust_action": "dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582",
                  "upload_action": "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f",
                  "module_lock_before_sha256": hashlib.sha256(module_before.read_bytes()).hexdigest(),
                  "module_lock_after_sha256": hashlib.sha256(module_after.read_bytes()).hexdigest(),
                  "closed_computer_use_checks": closed_checks,
                  "commands": [
                      {"cwd": "product/codex-rs", "argv": ["cargo", "update", "--workspace"]},
                      {"cwd": "product", "argv": ["python3", "codex-rs/app-server-protocol/scripts/write_schema_fixtures.py"]},
                      {"cwd": "product/codex-rs", "argv": ["cargo", "metadata", "--locked", "--format-version", "1"]},
                      {"cwd": "product", "argv": ["bazel", "--ignore_all_rc_files", "--output_base=<runner.temp>/computer-use-bazel", "mod", "deps", "--lockfile_mode=update"]},
                      {"cwd": "product", "argv": ["bazel", "--ignore_all_rc_files", "--output_base=<runner.temp>/computer-use-bazel", "mod", "deps", "--lockfile_mode=error"]},
                  ],
              })
          Path(os.environ["RUNNER_TEMP"], "identity.json").write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Require the generated lockfile to be accepted as-is
        if: ${{ inputs.preparation_profile == 'cargo-schema' && steps.preparation_identity.outputs.computer-use != 'true' }}
        working-directory: product/codex-rs
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Upload exact lock, schema, and identity diff
        if: ${{ inputs.preparation_profile == 'cargo-schema' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-cargo-schema-prep-${{ inputs.target_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-delta.patch
            ${{ runner.temp }}/changed-paths.txt
            ${{ runner.temp }}/identity.json
            ${{ runner.temp }}/Cargo.lock.before
            ${{ runner.temp }}/Cargo.lock.before.sha256
            ${{ runner.temp }}/Cargo.lock.after
            ${{ steps.preparation_identity.outputs.computer-use == 'true' && format('{0}/MODULE.bazel.lock.before', runner.temp) || '' }}
            ${{ steps.preparation_identity.outputs.computer-use == 'true' && format('{0}/MODULE.bazel.lock.before.sha256', runner.temp) || '' }}
            ${{ steps.preparation_identity.outputs.computer-use == 'true' && format('{0}/MODULE.bazel.lock.after', runner.temp) || '' }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact config-schema source diff
        if: ${{ inputs.preparation_profile == 'config-schema' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-config-schema-prep-${{ inputs.target_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/schema.before.json
            ${{ runner.temp }}/schema.after.json
            ${{ runner.temp }}/source-delta.patch
            ${{ runner.temp }}/changed-paths.txt
            ${{ runner.temp }}/identity.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact pending TUI snapshot outputs and identity
        if: ${{ always() && inputs.preparation_profile == 'tui-snapshots' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-tui-snapshots-prep-${{ inputs.target_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w16072-tui-snapshot-artifact
          if-no-files-found: error
          retention-days: 30

  build-linux-x86_64:
    name: Package native Linux x86_64
    if: ${{ inputs.mode == 'build' }}
    needs:
      - runner_policy
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CODEX_TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Initialize runner-local build paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_TARGET_DIR=%s/codex-rust-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CODEX_REPO_ROOT=%s/product\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'CODEX_PACKAGE_OUT=%s/codex-first-binary\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out workflow host (H)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .workflow-src
      - name: Check out exact product source (T)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: product
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Verify H, B, T, and native architecture
        shell: bash
        env:
          EXPECTED_H: ${{ github.sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || {
            echo "x86_64 package job is not on a native x86_64 runner" >&2
            exit 1
          }
          actual_h="$(git -C .workflow-src rev-parse HEAD)"
          actual_t="$(git -C product rev-parse HEAD)"
          if [[ "${actual_h}" != "${EXPECTED_H}" || "${actual_t}" != "${TARGET_SHA}" ]]; then
            echo "workflow host H or product source T does not match the requested identity" >&2
            exit 1
          fi
          git -C product fetch --no-tags --depth=1 origin -- "${BASE_REF}"
          actual_b="$(git -C product rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "${actual_b}" != "${BASE_SHA}" ]]; then
            echo "comparison base does not resolve to the requested B SHA" >&2
            exit 1
          fi
          git -C product cat-file -e "${BASE_SHA}^{commit}"
      - name: Install Linux bwrap build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev
      - name: Build canonical package and same-source proxy sidecar
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${CODEX_PACKAGE_OUT}"
          CODEX_REPO_ROOT="${PWD}" python3 scripts/build_codex_package.py \
            --target "${CODEX_TARGET}" \
            --variant codex \
            --cargo-profile release \
            --package-dir "${RUNNER_TEMP}/codex-package-${CODEX_TARGET}" \
            --force
          CODEX_REPO_ROOT="${PWD}" GITHUB_WORKSPACE="${PWD}" \
            bash .github/scripts/build-codex-package-archive.sh \
              --target "${CODEX_TARGET}" \
              --bundle primary \
              --entrypoint-dir "${CARGO_TARGET_DIR}/${CODEX_TARGET}/release" \
              --archive-dir "${CODEX_PACKAGE_OUT}"
          cargo build --manifest-path codex-rs/Cargo.toml --locked --release --target "${CODEX_TARGET}" \
            -p codex-responses-api-proxy
          install -Dm 0755 \
            "${CARGO_TARGET_DIR}/${CODEX_TARGET}/release/codex-responses-api-proxy" \
            "${CODEX_PACKAGE_OUT}/codex-responses-api-proxy"
          cp "${RUNNER_TEMP}/codex-package-${CODEX_TARGET}/codex-package.json" \
            "${CODEX_PACKAGE_OUT}/codex-package.json"
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Build modified the exact product source worktree; refusing artifact publication." >&2
            git status --short >&2
            exit 1
          fi
      - name: Write H/B/T and artifact digest manifest
        working-directory: product
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          WORKFLOW_HOST_SHA: ${{ github.sha }}
          RUNNER_LABEL: ubuntu-24.04
          RUST_TARGET: x86_64-unknown-linux-gnu
          PRODUCT_ARCH: x86_64
          PACKAGE_OUT: ${{ runner.temp }}/codex-first-binary
        run: |
          set -euo pipefail
          WORKFLOW_HOST_SHA="$(git -C "${GITHUB_WORKSPACE}/.workflow-src" rev-parse HEAD)" \
          PRODUCT_SHA="$(git rev-parse HEAD)" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          package_out = Path(os.environ["PACKAGE_OUT"])
          target = os.environ["RUST_TARGET"]
          package_manifest = json.loads((package_out / "codex-package.json").read_text())
          if package_manifest.get("version") != "0.160.0-dev.sedna.1":
              raise SystemExit(
                  "package manifest is not the admitted source-derived development version"
              )

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()
          files = [
              f"codex-package-{target}.tar.zst",
              "codex-package.json",
              "codex-responses-api-proxy",
          ]
          digests = {}
          for name in files:
              path = package_out / name
              if not path.is_file():
                  raise SystemExit(f"required package artifact is missing: {name}")
              digests[name] = sha256_file(path)
          payload = {
              "schema_version": "sedna-first-binary-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/'
                  f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
              ),
              "workflow_host_sha": os.environ["WORKFLOW_HOST_SHA"],
              "product_sha": os.environ["PRODUCT_SHA"],
              "comparison_base_sha": os.environ["BASE_SHA"],
              "target": target,
              "architecture": os.environ["PRODUCT_ARCH"],
              "runner_label": os.environ["RUNNER_LABEL"],
              "package_version": package_manifest["version"],
              "artifacts_sha256": digests,
          }
          (package_out / "manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload package and same-source proxy evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-first-binary-${{ inputs.target_sha }}-x86_64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codex-first-binary/codex-package-x86_64-unknown-linux-gnu.tar.zst
            ${{ runner.temp }}/codex-first-binary/codex-package.json
            ${{ runner.temp }}/codex-first-binary/codex-responses-api-proxy
            ${{ runner.temp }}/codex-first-binary/manifest.json
          if-no-files-found: error
          retention-days: 7

