          negative("missing-metadata", "metadata-node", lambda b, a, m, f: m["packages"].pop())
          negative("missing-resolve-node", "unresolved-metadata-edge", lambda b, a, m, f: m["resolve"]["nodes"].pop())
          negative("unresolved-edge", "unresolved-metadata-edge", lambda b, a, m, f: m["resolve"]["nodes"][-1]["dependencies"].append("unknown"))
          negative("external-source-mismatch", "new-local-edges", lambda b, a, m, f: m["packages"][-1].__setitem__("source", "git+fixture"))
          negative("external-version-mismatch", "new-local-edges", lambda b, a, m, f: m["packages"][-1].__setitem__("version", "3.0.0"))
          negative("wrong-manifest", "new-local-manifest", lambda b, a, m, f: f["codex-browser-computer-use"].__setitem__("manifest_path", "/wrong/Cargo.toml"))
          negative("wrong-declared-edge", "new-local-metadata", lambda b, a, m, f: m["packages"][3].__setitem__("dependencies", []))
          negative("wrong-resolved-edge", "new-local-edges", lambda b, a, m, f: m["resolve"]["nodes"][3].__setitem__("dependencies", []))
          for values, selected in [
              (("prepare-only", "cargo-schema", target, base), True),
              (("prepare-only", "cargo-schema", "0" * 40, base), False),
              (("build", "cargo-schema", target, base), False),
              (("consume-existing", "cargo-schema", target, base), False),
              (("prepare-only", "config-schema", target, base), False),
              (("prepare-only", "tui-snapshots", target, base), False),
          ]:
              if route(*values) is not selected:
                  raise AssertionError("route control differs")
              controls.append("route-" + values[0] + "-" + values[1] + "-" + str(selected))
          try:
              route("prepare-only", "cargo-schema", target, "0" * 40)
          except ValueError as error:
              if error.args != ("wrong-base",):
                  raise
          else:
              raise AssertionError("wrong base was accepted")
          controls.append("route-wrong-base")
          schema = {
              "sdk/python/src/openai_codex/api.py": "a" * 64,
              "codex-rs/app-server-protocol/schema/typescript/fixture.ts": "b" * 64,
              "codex-rs/app-server-protocol/schema/json/fixture.json": "c" * 64,
          }
          schema_equal(schema, dict(schema))
          controls.append("schema-positive")
          mutations = {
              "bytes": dict(schema, **{"sdk/python/src/openai_codex/api.py": "d" * 64}),
              "add": dict(schema, **{"codex-rs/app-server-protocol/schema/json/new.json": "d" * 64}),
              "remove": {k: v for k, v in schema.items() if not k.endswith("fixture.ts")},
              "rename": {k.replace("fixture.ts", "renamed.ts"): v for k, v in schema.items()},
              "substitute": {k.replace("typescript/", "json/"): v for k, v in schema.items()},
          }
          for label, changed in mutations.items():
              try:
                  schema_equal(schema, changed)
