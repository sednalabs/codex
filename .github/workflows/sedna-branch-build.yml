                  raise AssertionError("schema negative was accepted")
              controls.append("schema-" + label)
          if not route(os.environ["MODE"], os.environ["PREPARATION_PROFILE"], os.environ["PRODUCT_SHA"], os.environ["BASE_SHA"]):
              raise SystemExit("closed computer-use route was not selected")
          root = Path(os.environ["PRODUCT_ROOT"])
          temporary = Path(os.environ["RUNNER_TEMP"])
          with Path(os.environ["LOCK_BEFORE"]).open("rb") as stream:
