                  raise SystemExit("schema output is not a unique regular file")
              inventory[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          schema_equal(json.loads((temporary / "computer-use-schema.before.json").read_text(encoding="utf-8")), inventory)
          checks.update({
              "controls_passed": len(controls), "control_names": controls,
              "schema_path_sha256": inventory,
              "cargo_lock_validated_sha256": hashlib.sha256((root / "codex-rs/Cargo.lock").read_bytes()).hexdigest(),
              "metadata_sha256": hashlib.sha256((temporary / "computer-use-cargo-metadata.json").read_bytes()).hexdigest(),
          })
          (temporary / "computer-use-lock-validation.json").write_text(
              json.dumps(checks, sort_keys=True), encoding="utf-8"
          )
          print(f"closed computer-use contract: {len(controls)} controls passed")
