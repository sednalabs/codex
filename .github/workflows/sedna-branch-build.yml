      - name: Upload package and same-source proxy evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-first-binary-${{ inputs.target_sha }}-aarch64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codex-first-binary/codex-package-aarch64-unknown-linux-gnu.tar.zst
            ${{ runner.temp }}/codex-first-binary/codex-package.json
            ${{ runner.temp }}/codex-first-binary/codex-responses-api-proxy
            ${{ runner.temp }}/codex-first-binary/manifest.json
          if-no-files-found: error
          retention-days: 7

  consume-linux-x86_64:
    name: Consume native Linux x86_64 package
    if: ${{ always() && needs.runner_policy.result == 'success' && (inputs.mode == 'consume-existing' || needs.build-linux-x86_64.result == 'success') }}
    needs:
      - runner_policy
      - build-linux-x86_64
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 180
    env:
      PRODUCT_ARCH: x86_64
      RUST_TARGET: x86_64-unknown-linux-gnu
      EXPECTED_RUNNER_LABEL: ubuntu-24.04
    steps:
      - name: Initialize runner-local consumer paths
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
        run: |
          set -euo pipefail
          printf 'PRODUCT_ROOT=%s/product\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'ARTIFACT_DIR=%s/first-binary-artifact\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CONSUMER_JUNIT=%s/first-binary-consumer-results.xml\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CONSUMER_CONTEXT=%s/first-binary-consumer-context.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CONSUMER_IDENTITY=%s/first-binary-build-identity.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PRODUCER_EVIDENCE=%s/first-binary-producer-evidence.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CONSUMER_RESULT=%s/first-binary-consumer-result.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'STATE_WITNESS_DIR=%s/state-history-witnesses\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          if [[ ("$MODE" == "consume-existing" && "$CONSUMER_PROFILE" == "focused") || ("$MODE" == "build" && "$CONSUMER_PROFILE" == "browser-diagnostic") ]]; then
            mkdir -m 700 -- "$RUNNER_TEMP/state-history-witnesses"
          fi
          if [[ "$MODE" == "consume-existing" || ("$MODE" == "build" && "$CONSUMER_PROFILE" == "browser-diagnostic") ]]; then
            printf 'FIXTURE_ROOT=%s/fixture-source\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            sdk_root="$GITHUB_WORKSPACE/sdk-source"
          else
            printf 'FIXTURE_ROOT=%s/product\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            sdk_root="$GITHUB_WORKSPACE/product"
          fi
          printf 'SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
          printf 'PYTHONPATH=%s/sdk/python/src:%s/sdk/python/tests\n' \
            "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
      - name: Check out workflow host (Hc)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .workflow-src
      - name: Check out exact product source (T)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: product
      - name: Check out exact consumer fixture source (Q)
        if: ${{ inputs.mode == 'consume-existing' || (inputs.mode == 'build' && inputs.consumer_profile == 'browser-diagnostic') }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.fixture_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: fixture-source
      - name: Check out exact Python SDK source (S)
        if: ${{ inputs.mode == 'consume-existing' || (inputs.mode == 'build' && inputs.consumer_profile == 'browser-diagnostic') }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sdk_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: sdk-source
      - name: Verify H, B, T, and native consumer architecture
        shell: bash
        env:
          EXPECTED_H: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          FIXTURE_SHA: ${{ inputs.fixture_sha }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || {
            echo "x86_64 consumer is not on its native standard runner" >&2
            exit 1
          }
          [[ "${EXPECTED_H}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${BASE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] || exit 1
          actual_h="$(git -C .workflow-src rev-parse HEAD)"
          [[ "${actual_h}" == "${EXPECTED_H}" ]] || {
            echo "workflow-host source Hc does not match the active dispatch" >&2
            exit 1
          }
          case "${GITHUB_REF}" in
            refs/heads/*) ;;
            *) echo "consumer qualification requires a branch dispatch" >&2; exit 1 ;;
          esac
          actual_t="$(git -C product rev-parse HEAD)"
          [[ "${actual_t}" == "${TARGET_SHA}" ]] || {
            echo "product source T does not match target_sha" >&2
            exit 1
          }
          git -C product fetch --no-tags --depth=1 origin -- "${BASE_REF}"
          actual_b="$(git -C product rev-parse 'FETCH_HEAD^{commit}')"
          [[ "${actual_b}" == "${BASE_SHA}" ]] || {
            echo "comparison base B does not match base_sha" >&2
            exit 1
          }
          git -C product cat-file -e "${BASE_SHA}^{commit}"
          if [[ "${MODE}" == "consume-existing" || ("${MODE}" == "build" && "${CONSUMER_PROFILE}" == "browser-diagnostic") ]]; then
            [[ "${FIXTURE_SHA}" =~ ^[0-9a-f]{40}$ && "${SDK_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$(git -C fixture-source rev-parse HEAD)" == "${FIXTURE_SHA}" ]] || {
              echo "fixture checkout Q does not match fixture_sha" >&2; exit 1;
            }
            [[ "$(git -C sdk-source rev-parse HEAD)" == "${SDK_SHA}" ]] || {
              echo "SDK checkout S does not match sdk_sha" >&2; exit 1;
            }
          fi
      - name: Verify dispatch run and select exactly one uploaded artifact by API
        if: ${{ inputs.mode == 'build' }}
        id: artifact_api
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          EXPECTED_H: ${{ github.sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          SHA = re.compile(r"[0-9a-f]{40}\Z")
          DIGEST = re.compile(r"sha256:[0-9a-f]{64}\Z")

          def fail(message: str) -> None:
              raise SystemExit(message)

          repository = os.environ["GITHUB_REPOSITORY"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              fail("invalid repository identity in runner environment")
          api_url = os.environ["API_URL"].rstrip("/")
          token = os.environ["GITHUB_TOKEN"]
          run_id_text = os.environ["EXPECTED_RUN_ID"]
          if not run_id_text.isdecimal():
              fail("invalid workflow run identity")
          run_id = int(run_id_text)
          expected_h = os.environ["EXPECTED_H"]
          target_sha = os.environ["TARGET_SHA"]
          base_sha = os.environ["BASE_SHA"]
          base_ref = os.environ["BASE_REF"]
          branch = os.environ["EXPECTED_BRANCH"]
          architecture = os.environ["PRODUCT_ARCH"]
          target = os.environ["RUST_TARGET"]
          runner_label = os.environ["EXPECTED_RUNNER_LABEL"]
          if not all(SHA.fullmatch(value) for value in (expected_h, target_sha, base_sha)):
              fail("invalid H/T/B SHA input")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]{0,199}", base_ref):
              fail("invalid comparison base ref")
          if not os.environ["GITHUB_REF"].startswith("refs/heads/"):
              fail("consumer workflow was not dispatched from a branch")

          def get_json(path: str) -> dict[str, object]:
              request = Request(
                  f"{api_url}{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2026-03-10",
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.loads(response.read())
              except HTTPError as error:
                  fail(f"GitHub Actions API returned HTTP {error.code} for {path}")
              except URLError as error:
                  fail(f"GitHub Actions API request failed for {path}: {error.reason}")

          run = get_json(f"/repos/{repository}/actions/runs/{run_id}")
          if run.get("id") != run_id:
              fail("Actions API run ID differs from the active workflow run")
          if run.get("event") != "workflow_dispatch":
              fail("consumer route requires an explicit workflow_dispatch event")
          workflow_id = run.get("workflow_id")
          if type(workflow_id) is not int or workflow_id <= 0:
              fail("Actions API run omitted a valid numeric workflow ID")
          workflow = get_json(f"/repos/{repository}/actions/workflows/{workflow_id}")
          if workflow.get("id") != workflow_id:
              fail("Actions API workflow ID differs from the active workflow run")
          if workflow.get("path") != ".github/workflows/sedna-branch-build.yml":
              fail("active Actions run is not the registered sedna-branch-build workflow")
          if run.get("head_sha") != expected_h or run.get("head_branch") != branch:
              fail("Actions API workflow host H or branch differs from the active dispatch")
          if os.environ["GITHUB_REF_NAME"] != branch:
              fail("workflow ref name differs from the requested branch identity")

          listing = get_json(f"/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100")
          artifacts = listing.get("artifacts")
          if not isinstance(artifacts, list) or listing.get("total_count") != len(artifacts):
              fail("artifact API listing is malformed or incomplete")
          expected_name = f"sedna-first-binary-{target_sha}-{architecture}-{run_id}"
          matches = [item for item in artifacts if item.get("name") == expected_name]
          if len(matches) != 1:
              fail("Actions API did not return exactly one expected package artifact")
          artifact = matches[0]
          association = artifact.get("workflow_run")
          if not isinstance(association, dict):
              fail("artifact API response omitted its workflow-run association")
          if (
              association.get("id") != run_id
              or association.get("head_sha") != expected_h
              or association.get("head_branch") != branch
          ):
              fail("artifact workflow association does not match exact H/run/branch")
          artifact_id = artifact.get("id")
          artifact_digest = artifact.get("digest")
          size = artifact.get("size_in_bytes")
          if type(artifact_id) is not int or artifact_id <= 0:
              fail("artifact API returned an invalid numeric artifact ID")
          if artifact.get("expired") is not False or type(size) is not int or size <= 0:
              fail("expected package artifact is expired or empty")
          if not isinstance(artifact_digest, str) or not DIGEST.fullmatch(artifact_digest):
              fail("artifact API omitted a valid SHA-256 digest")

          identity = {
              "schema_version": "sedna-first-binary-consumer-api-v1",
              "repository": repository,
              "workflow_path": workflow["path"],
              "event": run["event"],
              "workflow_host_sha": expected_h,
              "product_sha": target_sha,
              "comparison_base_ref": base_ref,
              "comparison_base_sha": base_sha,
              "branch": branch,
              "run_id": run_id,
              "artifact_id": artifact_id,
              "artifact_name": expected_name,
              "artifact_digest": artifact_digest,
              "artifact_size_bytes": size,
              "architecture": architecture,
              "target": target,
              "runner_label": runner_label,
          }
          Path(os.environ["CONSUMER_IDENTITY"]).write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"artifact_id={artifact_id}\n")
              output.write(f"artifact_name={expected_name}\n")
              output.write(f"artifact_digest={artifact_digest}\n")
          PY
      - name: Verify producer API evidence and write current consumer context
        id: verified_artifact
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          PRODUCT_ARCH: x86_64
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_WORKFLOW_HOST_SHA: ${{ inputs.producer_workflow_host_sha }}
          FIXTURE_SHA: ${{ inputs.fixture_sha }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
          CONSUMER_CONTEXT_OUT: ${{ runner.temp }}/first-binary-consumer-context.json
          PRODUCER_EVIDENCE_OUT: ${{ runner.temp }}/first-binary-producer-evidence.json
        run: python3 .workflow-src/.github/scripts/verify_existing_first_binary_producer.py
      - name: Download the API-verified artifact outside the checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.verified_artifact.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verified_artifact.outputs.producer_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/first-binary-artifact
          digest-mismatch: error
      - name: Install and verify the pinned consumer Python toolchain
        id: setup_uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12.14"
          enable-cache: false
      - name: Verify uv and managed Python versions
        shell: bash
        env:
          UV_MANAGED_PYTHON: "1"
          UV_VERSION: ${{ steps.setup_uv.outputs.uv-version }}
          UV_PATH: ${{ steps.setup_uv.outputs.uv-path }}
        run: |
          set -euo pipefail
          [[ "${UV_VERSION}" == "0.12.17" ]] || {
            echo "setup-uv did not resolve the pinned 0.12.17 release" >&2
            exit 1
          }
          [[ -x "${UV_PATH}" ]] || {
            echo "setup-uv did not expose an executable uv path" >&2
            exit 1
          }
          uv_report="$("${UV_PATH}" --version)"
          uv_version_pattern="^uv 0[.]12[.]17 \\(([0-9a-f]{9,40} [0-9]{4}-[0-9]{2}-[0-9]{2} )?${RUST_TARGET}\\)$"
          [[ "${uv_report}" =~ ${uv_version_pattern} ]] || {
            echo "uv executable release or native target does not match the pinned package consumer" >&2
            exit 1
          }
          "${UV_PATH}" python install 3.12.14
          selected_python="$("${UV_PATH}" run --no-project --python 3.12.14 python -c 'import platform; print(platform.python_version())')"
          [[ "${selected_python}" == "3.12.14" ]] || {
            echo "uv did not select the pinned Python 3.12.14 runtime" >&2
            exit 1
          }
      - name: Run packaged first-binary consumers and preserve pytest status
        if: ${{ inputs.mode == 'build' }}
        id: consumer_tests
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_WORKFLOW_HOST_SHA: ${{ inputs.producer_workflow_host_sha }}
          FIXTURE_SHA: ${{ inputs.fixture_sha }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          CONSUMER_JUNIT: ${{ runner.temp }}/first-binary-consumer-results.xml
          CONSUMER_CONTEXT: ${{ runner.temp }}/first-binary-consumer-context.json
          PRODUCER_EVIDENCE: ${{ runner.temp }}/first-binary-producer-evidence.json
          CONSUMER_RESULT: ${{ runner.temp }}/first-binary-consumer-result.json
          STATE_WITNESS_DIR: ${{ runner.temp }}/state-history-witnesses
          ARTIFACT_ID: ${{ steps.verified_artifact.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.verified_artifact.outputs.artifact_name }}
          CODEX_STATE_HISTORY_ACCEPTANCE: "1"
          UV_MANAGED_PYTHON: "1"
          UV_PATH: ${{ steps.setup_uv.outputs.uv-path }}
        run: |
          set -euo pipefail
          export TMPDIR="${RUNNER_TEMP}"
          TEST_ROOT="${FIXTURE_ROOT}/scripts/codex_package/smoke_tests/first_binary"
          case "${MODE}:${CONSUMER_PROFILE}" in
            build:browser-diagnostic)
              TEST_ARGS=("${TEST_ROOT}/test_tui_agents_acceptance.py::test_packaged_tui_browser_output_keeps_images_and_manifest_metadata_separate")
              PRODUCER_ARGS=(--workflow-host-sha "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}")
              FIXTURE_ARGS=()
              ;;
            build:*)
              TEST_ARGS=("${TEST_ROOT}")
              PRODUCER_ARGS=(--workflow-host-sha "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}")
              FIXTURE_ARGS=()
              ;;
            consume-existing:pair)
              TEST_ARGS=(
                "${TEST_ROOT}/state_history/test_state_history.py::test_packaged_historical_upgrade_and_reopen[fresh]"
                "${TEST_ROOT}/state_history/test_state_history.py::test_packaged_historical_rejection_preserves_preimage[bad_checksum]"
              )
              PRODUCER_ARGS=(
                --expected-producer-workflow-host-sha "${PRODUCER_WORKFLOW_HOST_SHA}"
                --expected-producer-run-id "${PRODUCER_RUN_ID}"
              )
              FIXTURE_ARGS=(
                --fixture-sha "${FIXTURE_SHA}"
                --consumer-context-file "${CONSUMER_CONTEXT}"
              )
              ;;
            consume-existing:full)
              TEST_ARGS=("${TEST_ROOT}")
              PRODUCER_ARGS=(
                --expected-producer-workflow-host-sha "${PRODUCER_WORKFLOW_HOST_SHA}"
                --expected-producer-run-id "${PRODUCER_RUN_ID}"
              )
              FIXTURE_ARGS=(
                --fixture-sha "${FIXTURE_SHA}"
                --consumer-context-file "${CONSUMER_CONTEXT}"
              )
              ;;
            *) echo "unsupported consumer mode/profile combination" >&2; exit 1 ;;
          esac
          set +e
          "${UV_PATH}" run --locked \
            --project "${SDK_ROOT}/sdk/python" \
            --group test \
            --python 3.12.14 \
            --with "zstandard==0.25.0" \
            pytest -q \
              --confcutdir="${TEST_ROOT}" \
              "${TEST_ARGS[@]}" \
              --artifact-dir "${ARTIFACT_DIR}" \
              --artifact-id "${ARTIFACT_ID}" \
              --artifact-name "${ARTIFACT_NAME}" \
              --target-sha "${TARGET_SHA}" \
              --base-ref "${BASE_REF}" \
              --base-sha "${BASE_SHA}" \
              "${PRODUCER_ARGS[@]}" \
              "${FIXTURE_ARGS[@]}" \
              --junitxml "${CONSUMER_JUNIT}"
          pytest_status=$?
          set -e
          if [[ "${CONSUMER_PROFILE}" == "browser-diagnostic" ]]; then
            PYTEST_EXIT_CODE="${pytest_status}" \
              python3 .workflow-src/.github/scripts/verify_existing_first_binary_producer.py \
                --verify-consumer-results
            exit 0
          fi
          PYTEST_EXIT_CODE="${pytest_status}" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import xml.etree.ElementTree as ET

          junit_path = Path(os.environ["CONSUMER_JUNIT"])
          context_path = Path(os.environ["CONSUMER_CONTEXT"])
          producer_path = Path(os.environ["PRODUCER_EVIDENCE"])
          result_path = Path(os.environ["CONSUMER_RESULT"])
          witness_dir = Path(os.environ["STATE_WITNESS_DIR"])
          consumer = json.loads(context_path.read_text(encoding="utf-8"))
          producer = json.loads(producer_path.read_text(encoding="utf-8"))
          pytest_exit = int(os.environ["PYTEST_EXIT_CODE"])
          issues: list[str] = []
          cases = []
          if junit_path.is_file():
              try:
                  cases = list(ET.parse(junit_path).getroot().iter("testcase"))
              except ET.ParseError:
                  issues.append("JUnit report is malformed")
          else:
              issues.append("pytest did not produce a JUnit report")
          failures = sum(len(case.findall("failure")) for case in cases)
          errors = sum(len(case.findall("error")) for case in cases)
          skipped = sum(len(case.findall("skipped")) for case in cases)
          if pytest_exit != 0:
              issues.append(f"pytest exited with status {pytest_exit}")
          if not cases:
              issues.append("JUnit report contains zero executed test cases")
          if failures or errors:
              issues.append(f"JUnit reports failures={failures} errors={errors}")
          if skipped:
              issues.append(f"JUnit reports {skipped} skipped cases")

          positive_prefix = "test_packaged_historical_upgrade_and_reopen"
          negative_prefix = "test_packaged_historical_rejection_preserves_preimage"
          expected_positive = {
              "fresh", "u23", "u55", "u56", "u57", "u58", "f56", "f57",
              "f58", "f_full", "f_alias_pair", "shift24", "shift29", "shift38",
              "shift45", "shift50",
          }
          expected_negative = {
              "bad_checksum", "mixed_ids", "missing_middle", "failed_row",
              "incomplete_f58", "partial_alias", "partial_upstream_schema", "unknown_id",
          }

          def labels(prefix: str) -> list[str]:
              result = []
              for case in cases:
                  name = case.attrib.get("name", "")
                  if name.startswith(prefix):
                      if not name.startswith(prefix + "[") or not name.endswith("]"):
                          issues.append("state-history JUnit name is not a parameterized case")
                          continue
                      result.append(name[len(prefix) + 1 : -1])
              return result

          positive = labels(positive_prefix)
          negative = labels(negative_prefix)
          mode = os.environ["MODE"]
          profile = os.environ["CONSUMER_PROFILE"]
          pair_positive = {"fresh"}
          pair_negative = {"bad_checksum"}
          if mode == "build" or profile == "full":
              if len(positive) != 16 or set(positive) != expected_positive:
                  issues.append("JUnit does not contain the exact 16 positive state-history cases")
              if len(negative) != 8 or set(negative) != expected_negative:
                  issues.append("JUnit does not contain the exact 8 negative state-history cases")
              expected_state = expected_positive | expected_negative
              expected_plain = {
                  "test_exact_single_artifact_and_native_layout",
                  "test_wrong_source_manifest_is_rejected_before_unpack",
                  "test_wrong_target_and_missing_helper_are_rejected",
                  "test_banner_native_client_and_same_source_proxy_execution",
                  "test_persistent_code_mode_and_reopen_from_real_package",
                  "test_missing_host_cannot_qualify_code_mode",
                  "test_model_receives_and_executes_root_only_agent_list",
                  "test_model_spawn_hidden_metadata_has_no_private_fields",
                  "test_visible_model_spawn_and_resumed_list_keep_stable_identity",
                  "test_actual_tui_agents_entry_has_initial_empty_search",
                  "test_actual_tui_nested_filter_clear_live_rename_and_replay",
                  "test_real_response_usage_joins_standard_rate_scenario_after_resume",
              }
          else:
              if positive != ["fresh"] or negative != ["bad_checksum"]:
                  issues.append("pair profile did not execute exactly its two required state-history cases")
              expected_state = pair_positive | pair_negative
              expected_plain = set()

          plain_names = {
              case.attrib.get("name", "") for case in cases
              if not case.attrib.get("name", "").startswith((positive_prefix, negative_prefix))
          }
          if plain_names != expected_plain:
              issues.append("JUnit plain-test inventory differs from the exact selected profile")
          expected_case_count = len(expected_state) + len(expected_plain)
          if len(cases) != expected_case_count:
              issues.append("JUnit executed-case count differs from the exact selected profile")

          witness_paths = sorted(witness_dir.glob("*.json")) if witness_dir.is_dir() else []
          witness_hashes: dict[str, str] = {}
          witness_cases: set[str] = set()
          witness_versions: set[str] = set()
          expected_cases = expected_state
          for path in witness_paths:
              try:
                  witness = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  issues.append("state-history witness JSON is missing or malformed")
                  continue
              case_name = witness.get("case")
              if not isinstance(case_name, str) or case_name not in expected_cases:
                  issues.append("state-history witness has an unexpected case identity")
                  continue
              witness_cases.add(case_name)
              expected_fields = {
                  "product_target_sha": producer["product_sha"],
                  "comparison_base_sha": producer["comparison_base_sha"],
                  "fixture_source_sha": os.environ["FIXTURE_SHA"] or producer["product_sha"],
                  "producer_workflow_host_sha": producer["workflow_host_sha"],
                  "producer_run_id": producer["run_id"],
                  "consumer_workflow_host_sha": consumer["workflow_host_sha"],
                  "consumer_run_id": consumer["run_id"],
                  "consumer_run_attempt": consumer["run_attempt"],
                  "artifact_id": producer["artifact_id"],
                  "artifact_name": producer["artifact_name"],
                  "target": producer["target"],
              }
              if any(witness.get(key) != value for key, value in expected_fields.items()):
                  issues.append(f"state-history witness {case_name} identity mismatch")
              if not isinstance(witness.get("package_archive_sha256"), str) or not re.fullmatch(r"[0-9a-f]{64}", witness["package_archive_sha256"]):
                  issues.append(f"state-history witness {case_name} package digest is malformed")
              if not isinstance(witness.get("package_version"), str) or not witness["package_version"]:
                  issues.append(f"state-history witness {case_name} package version is missing")
              elif isinstance(witness.get("package_version"), str):
                  witness_versions.add(witness["package_version"])
              witness_hashes[case_name] = hashlib.sha256(path.read_bytes()).hexdigest()
          if len(witness_paths) != len(expected_cases) or witness_cases != expected_cases:
              issues.append("state-history witness inventory differs from the exact selected profile")
          if len(witness_versions) > 1:
              issues.append("state-history witnesses report inconsistent package versions")

          test_result = {
              "schema_version": "sedna-first-binary-consumer-result-v1",
              "mode": mode,
              "profile": profile,
              "fixture_source_sha": os.environ["FIXTURE_SHA"] or producer["product_sha"],
              "sdk_source_sha": os.environ["SDK_SHA"] or producer["product_sha"],
              "consumer": consumer,
              "producer": producer,
              "pytest_exit_code": pytest_exit,
              "consumer_context_sha256": hashlib.sha256(context_path.read_bytes()).hexdigest(),
              "producer_evidence_sha256": hashlib.sha256(producer_path.read_bytes()).hexdigest(),
              "junit_sha256": hashlib.sha256(junit_path.read_bytes()).hexdigest()
              if junit_path.is_file() else None,
              "executed_cases": len(cases),
              "failures": failures,
              "errors": errors,
              "skipped": skipped,
              "state_history_positive_cases": len(positive),
              "state_history_negative_cases": len(negative),
              "state_history_witnesses": len(witness_hashes),
              "state_history_witness_sha256": dict(sorted(witness_hashes.items())),
              "issues": issues,
          }
          result_path.write_text(json.dumps(test_result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(
              "consumer test gate: "
              f"exit={pytest_exit} cases={len(cases)} failures={failures} "
              f"errors={errors} skipped={skipped} "
              f"state_positive={len(positive)} state_negative={len(negative)} "
              f"state_witnesses={len(witness_hashes)}"
          )
          for issue in issues:
              print(f"consumer test gate failed: {issue}", file=sys.stderr)
          if issues:
              raise SystemExit(1)
          PY
      - name: Check accepted package fixture modules for undefined names
        if: ${{ inputs.mode == 'consume-existing' && (inputs.consumer_profile == 'focused' || inputs.consumer_profile == 'full') }}
        shell: bash
        env:
          UV_MANAGED_PYTHON: "1"
          UV_PATH: ${{ steps.setup_uv.outputs.uv-path }}
        run: |
          set -euo pipefail
          "${UV_PATH}" run --locked \
            --project "${SDK_ROOT}/sdk/python" \
            --group test \
            --python 3.12.14 \
            ruff check \
              --select F821,F822,F823 \
              --output-format=github \
              "${FIXTURE_ROOT}/scripts/codex_package/smoke_tests/first_binary/test_agent_control_model_acceptance.py" \
              "${FIXTURE_ROOT}/scripts/codex_package/smoke_tests/first_binary/test_agent_control_tui_acceptance.py" \
              "${FIXTURE_ROOT}/scripts/codex_package/smoke_tests/first_binary/tui_pty.py"
      - name: Temporarily enable Linux user namespaces for existing-package consumers
        if: ${{ inputs.mode == 'consume-existing' && (inputs.consumer_profile == 'pair' || inputs.consumer_profile == 'full' || inputs.consumer_profile == 'focused') && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          set -euo pipefail
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          for value in "$current_userns" "$current_apparmor"; do
            case "$value" in
              ""|0|1) ;;
              *) echo "unexpected Linux user-namespace sysctl value" >&2; exit 1 ;;
            esac
          done
          printf 'CODEX_USERNS_CLONE_ORIGINAL=%s\n' "$current_userns" >> "$GITHUB_ENV"
          printf 'CODEX_APPARMOR_USERNS_ORIGINAL=%s\n' "$current_apparmor" >> "$GITHUB_ENV"
          if [[ -n "$current_userns" && "$current_userns" != "1" ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [[ -n "$current_apparmor" && "$current_apparmor" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          effective_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          effective_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [[ -n "$current_userns" && "$effective_userns" != "1" ]]; then
            echo "could not enable Linux user namespaces for the consumer" >&2
            exit 1
          fi
          if [[ -n "$current_apparmor" && "$effective_apparmor" != "0" ]]; then
            echo "could not enable AppArmor-compatible user namespaces for the consumer" >&2
            exit 1
          fi
      - name: Run existing-package consumers with explicit producer provenance
        if: ${{ inputs.mode == 'consume-existing' }}
        id: existing_consumer_tests
        shell: bash
        env:
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_WORKFLOW_HOST_SHA: ${{ inputs.producer_workflow_host_sha }}
          FIXTURE_SHA: ${{ inputs.fixture_sha }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          ARTIFACT_ID: ${{ steps.verified_artifact.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.verified_artifact.outputs.artifact_name }}
          UV_MANAGED_PYTHON: "1"
          CODEX_STATE_HISTORY_ACCEPTANCE: "1"
          UV_PATH: ${{ steps.setup_uv.outputs.uv-path }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          export TMPDIR="${RUNNER_TEMP}"
          test_root="${FIXTURE_ROOT}/scripts/codex_package/smoke_tests/first_binary"
          case "${CONSUMER_PROFILE}" in
            pair)
              test_args=(
                "${test_root}/state_history/test_state_history.py::test_packaged_historical_upgrade_and_reopen[fresh]"
                "${test_root}/state_history/test_state_history.py::test_packaged_historical_rejection_preserves_preimage[bad_checksum]"
              )
              ;;
            focused)
              test_args=(
                "${test_root}/test_agent_control_model_acceptance.py::test_packaged_model_nested_spawn_recovery_and_list_after_resume"
                "${test_root}/test_agent_control_model_acceptance.py::test_packaged_model_queue_only_message_does_not_wake_until_followup_and_exact_join"
                "${test_root}/test_agent_control_model_acceptance.py::test_packaged_model_goal_continuation_and_terminal_transition"
                "${test_root}/test_agent_control_tui_acceptance.py::test_packaged_tui_agents_details_render_configured_identity_and_unknown_effective_identity"
                "${test_root}/test_tui_agents_acceptance.py::test_actual_tui_agents_entry_has_initial_empty_search"
                "${test_root}/test_tui_agents_acceptance.py::test_actual_tui_nested_filter_clear_live_rename_and_replay"
              )
              ;;
            full) test_args=("${test_root}") ;;
            *) echo "unsupported consumer profile" >&2; exit 1 ;;
          esac
          set +e
          "${UV_PATH}" run --locked \
            --project "${SDK_ROOT}/sdk/python" \
            --group test \
            --python 3.12.14 \
            --with "zstandard==0.25.0" \
            pytest -q \
              --confcutdir="${test_root}" \
              "${test_args[@]}" \
              --artifact-dir "${ARTIFACT_DIR}" \
              --artifact-id "${ARTIFACT_ID}" \
              --artifact-name "${ARTIFACT_NAME}" \
              --target-sha "${TARGET_SHA}" \
              --base-ref "${BASE_REF}" \
              --base-sha "${BASE_SHA}" \
              --expected-producer-workflow-host-sha "${PRODUCER_WORKFLOW_HOST_SHA}" \
              --expected-producer-run-id "${PRODUCER_RUN_ID}" \
              --consumer-context-file "${CONSUMER_CONTEXT}" \
              --fixture-sha "${FIXTURE_SHA}" \
              --junitxml "${CONSUMER_JUNIT}"
          pytest_status=$?
          set -e
          PYTEST_EXIT_CODE="${pytest_status}" \
            python3 .workflow-src/.github/scripts/verify_existing_first_binary_producer.py \
              --verify-consumer-results
      - name: Upload consumer result and redacted state witnesses
        if: ${{ always() && inputs.mode == 'build' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-first-binary-consumer-${{ inputs.target_sha }}-x86_64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/first-binary-consumer-context.json
            ${{ runner.temp }}/first-binary-producer-evidence.json
            ${{ runner.temp }}/first-binary-consumer-result.json
            ${{ runner.temp }}/first-binary-consumer-results.xml
            ${{ runner.temp }}/state-history-witnesses/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Restore original Linux user-namespace settings
        if: ${{ always() && inputs.mode == 'consume-existing' && (inputs.consumer_profile == 'pair' || inputs.consumer_profile == 'full' || inputs.consumer_profile == 'focused') && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          set -euo pipefail
          original_userns="$(printenv CODEX_USERNS_CLONE_ORIGINAL || true)"
          original_apparmor="$(printenv CODEX_APPARMOR_USERNS_ORIGINAL || true)"
          if [[ -n "$original_userns" ]]; then
            sudo sysctl -w "kernel.unprivileged_userns_clone=$original_userns"
          fi
          if [[ -n "$original_apparmor" ]]; then
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$original_apparmor"
          fi
      - name: Upload existing-package consumer evidence
        if: ${{ always() && inputs.mode == 'consume-existing' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-first-binary-consumer-${{ inputs.target_sha }}-x86_64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/first-binary-consumer-context.json
            ${{ runner.temp }}/first-binary-producer-evidence.json
            ${{ runner.temp }}/first-binary-consumer-result.json
            ${{ runner.temp }}/first-binary-consumer-results.xml
            ${{ runner.temp }}/state-history-witnesses/*.json
          if-no-files-found: warn
          retention-days: 7

  sdk-parser:
    name: Verify exact SDK runtime-version parser selectors
    if: ${{ inputs.mode == 'consume-existing' }}
    needs:
      - runner_policy
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 45
    steps:
      - name: Initialize SDK parser evidence paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'SDK_ROOT=%s/sdk-source\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'SDK_PARSER_JUNIT=%s/first-binary-sdk-parser-results.xml\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SDK_PARSER_IDENTITY=%s/first-binary-sdk-parser-identity.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SDK_PARSER_STATUS=%s/first-binary-sdk-parser-status.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out workflow host (Hc)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .workflow-src
      - name: Check out exact Python SDK source (input-bound S)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sdk_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: sdk-source
      - name: Verify workflow host, SDK source, and native runner
        shell: bash
        env:
          EXPECTED_H: ${{ github.sha }}
          PRODUCT_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          FIXTURE_SHA: ${{ inputs.fixture_sha }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_WORKFLOW_HOST_SHA: ${{ inputs.producer_workflow_host_sha }}
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || {
            echo "SDK parser proof requires the native ubuntu-24.04 runner" >&2
            exit 1
          }
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || exit 1
          [[ "$GITHUB_REF" == "refs/heads/reconstruct/first-binary-package-workflow-20261001" ]] || exit 1
          [[ "$GITHUB_REF_NAME" == "reconstruct/first-binary-package-workflow-20261001" ]] || exit 1
          [[ "$GITHUB_WORKFLOW_REF" == "sednalabs/codex/.github/workflows/sedna-branch-build.yml@refs/heads/reconstruct/first-binary-package-workflow-20261001" ]] || exit 1
          [[ "$GITHUB_SHA" == "$EXPECTED_H" ]] || {
            echo "SDK parser workflow-host SHA differs from GITHUB_SHA" >&2
            exit 1
          }
          actual_h="$(git -C .workflow-src rev-parse HEAD)"
          [[ "$actual_h" == "$EXPECTED_H" ]] || {
            echo "SDK parser checkout does not match workflow-host Hc" >&2
            exit 1
          }
          [[ "$(git -C "$SDK_ROOT" rev-parse HEAD)" == "$SDK_SHA" ]] || {
            echo "SDK parser checkout does not match the requested SDK source SHA" >&2
            exit 1
          }
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          host_scripts = Path(os.environ["GITHUB_WORKSPACE"]) / ".workflow-src" / ".github" / "scripts"
          sys.path.insert(0, str(host_scripts))
          from verify_existing_first_binary_producer import sdk_test_plan

          plan = sdk_test_plan(os.environ["SDK_SHA"])
          record = {
              "schema_version": "sedna-first-binary-sdk-parser-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_path": ".github/workflows/sedna-branch-build.yml",
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_host_sha": os.environ["EXPECTED_H"],
              "consumer_run_id": os.environ["GITHUB_RUN_ID"],
              "consumer_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "product_sha": os.environ["PRODUCT_SHA"],
              "comparison_base_ref": os.environ["BASE_REF"],
              "comparison_base_sha": os.environ["BASE_SHA"],
              "fixture_sha": os.environ["FIXTURE_SHA"],
              "sdk_sha": os.environ["SDK_SHA"],
              "producer_run_id": os.environ["PRODUCER_RUN_ID"],
              "producer_workflow_host_sha": os.environ["PRODUCER_WORKFLOW_HOST_SHA"],
              "consumer_profile": os.environ["CONSUMER_PROFILE"],
              "runner_label": "ubuntu-24.04",
              "selectors": plan["selectors"],
              "expected_test_cases": plan["expected_test_cases"],
          }
          Path(os.environ["SDK_PARSER_IDENTITY"]).write_text(
              json.dumps(record, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Install the pinned SDK test toolchain
        id: sdk_setup_uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12.14"
          enable-cache: false
      - name: Verify pinned SDK test toolchain
        shell: bash
        env:
          UV_MANAGED_PYTHON: "1"
          UV_VERSION: ${{ steps.sdk_setup_uv.outputs.uv-version }}
          UV_PATH: ${{ steps.sdk_setup_uv.outputs.uv-path }}
        run: |
          set -euo pipefail
          [[ "$UV_VERSION" == "0.12.17" ]] || {
            echo "setup-uv did not resolve the pinned 0.12.17 release" >&2
            exit 1
          }
          [[ -x "$UV_PATH" ]] || {
            echo "setup-uv did not expose an executable uv path" >&2
            exit 1
          }
          uv_report="$("$UV_PATH" --version)"
          uv_version_pattern="^uv 0[.]12[.]17 \\(([0-9a-f]{9,40} [0-9]{4}-[0-9]{2}-[0-9]{2} )?x86_64-unknown-linux-gnu\\)$"
          [[ "$uv_report" =~ $uv_version_pattern ]] || {
            echo "SDK parser uv executable is not the pinned native release" >&2
            exit 1
          }
          "$UV_PATH" python install 3.12.14
          selected_python="$("$UV_PATH" run --no-project --python 3.12.14 python -c 'import platform; print(platform.python_version())')"
          [[ "$selected_python" == "3.12.14" ]] || {
            echo "SDK parser job did not select Python 3.12.14" >&2
            exit 1
          }
      - name: Run the exact SDK runtime-version and request-routing selectors
        id: sdk_pytest
        shell: bash
        env:
          UV_MANAGED_PYTHON: "1"
          UV_PATH: ${{ steps.sdk_setup_uv.outputs.uv-path }}
          SDK_SHA: ${{ inputs.sdk_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          host_scripts = Path(os.environ["GITHUB_WORKSPACE"]) / ".workflow-src" / ".github" / "scripts"
          sys.path.insert(0, str(host_scripts))
          from verify_existing_first_binary_producer import sdk_test_plan

          sdk_sha = os.environ["SDK_SHA"]
          plan = sdk_test_plan(sdk_sha)
          identity = json.loads(Path(os.environ["SDK_PARSER_IDENTITY"]).read_text(encoding="utf-8"))
          if identity.get("sdk_sha") != sdk_sha or identity.get("selectors") != plan["selectors"]:
              raise SystemExit("SDK parser identity does not match the closed selector plan")
          if identity.get("expected_test_cases") != plan["expected_test_cases"]:
              raise SystemExit("SDK parser identity does not match the exact test-case counts")
          sdk_root = Path(os.environ["SDK_ROOT"])
          command = [
              os.environ["UV_PATH"], "run", "--locked",
              "--project", str(sdk_root / "sdk/python"),
              "--group", "test", "--python", "3.12.14",
              "python", "-m", "pytest", "-q",
              *(str(sdk_root / selector) for selector in plan["selectors"]),
              "--junitxml", os.environ["SDK_PARSER_JUNIT"],
          ]
          completed = subprocess.run(command, check=False)
          result = {
              "schema_version": "sedna-first-binary-sdk-parser-status-v1",
              "pytest_exit_code": completed.returncode,
              "junit_path": os.environ["SDK_PARSER_JUNIT"],
          }
          Path(os.environ["SDK_PARSER_STATUS"]).write_text(
              json.dumps(result, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          raise SystemExit(completed.returncode)
          PY
      - name: Verify exact SDK case inventory and zero skips
        if: ${{ always() && inputs.mode == 'consume-existing' }}
        shell: bash
        env:
          SDK_SHA: ${{ inputs.sdk_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path

          host_scripts = Path(os.environ["GITHUB_WORKSPACE"]) / ".workflow-src" / ".github" / "scripts"
          sys.path.insert(0, str(host_scripts))
          from verify_existing_first_binary_producer import sdk_test_plan

          path = Path(os.environ["SDK_PARSER_JUNIT"])
          if not path.is_file():
              raise SystemExit("SDK parser JUnit output is missing")
          plan = sdk_test_plan(os.environ["SDK_SHA"])
          identity = json.loads(Path(os.environ["SDK_PARSER_IDENTITY"]).read_text(encoding="utf-8"))
          if identity.get("sdk_sha") != os.environ["SDK_SHA"]:
              raise SystemExit("SDK parser identity source SHA differs from the selected SDK source")
          if identity.get("selectors") != plan["selectors"] or identity.get("expected_test_cases") != plan["expected_test_cases"]:
              raise SystemExit("SDK parser identity does not match the closed selector plan")
          root = ET.parse(path).getroot()
          cases = list(root.iter("testcase"))
          observed = Counter(case.attrib.get("name", "").split("[", 1)[0] for case in cases)
          expected = Counter(plan["expected_test_cases"])
          skipped = sum(1 for case in cases if case.find("skipped") is not None)
          failed = sum(1 for case in cases if case.find("failure") is not None)
          errored = sum(1 for case in cases if case.find("error") is not None)
          print(f"SDK parser cases={len(cases)} expected={sum(expected.values())} skipped={skipped} failures={failed} errors={errored}")
          if observed != expected or skipped != 0 or failed != 0 or errored != 0:
              print(f"SDK parser inventory mismatch: observed={dict(observed)}", file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Upload exact SDK parser status and JUnit
        if: ${{ always() && inputs.mode == 'consume-existing' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-first-binary-sdk-parser-${{ inputs.sdk_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/first-binary-sdk-parser-identity.json
            ${{ runner.temp }}/first-binary-sdk-parser-status.json
            ${{ runner.temp }}/first-binary-sdk-parser-results.xml
          if-no-files-found: warn
          retention-days: 7
  consume-linux-aarch64:
    name: Consume native Linux ARM64 package
    if: ${{ always() && needs.runner_policy.result == 'success' && (inputs.mode == 'consume-existing' || needs.build-linux-aarch64.result == 'success') }}
    needs:
      - runner_policy
      - build-linux-aarch64
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
      contents: read
    timeout-minutes: 180
    env:
      PRODUCT_ARCH: aarch64
      RUST_TARGET: aarch64-unknown-linux-gnu
      EXPECTED_RUNNER_LABEL: ubuntu-24.04-arm
    steps:
      - name: Initialize runner-local consumer paths
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
        run: |
          set -euo pipefail
          printf 'PRODUCT_ROOT=%s/product\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'ARTIFACT_DIR=%s/first-binary-artifact\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CONSUMER_JUNIT=%s/first-binary-consumer-results.xml\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CONSUMER_CONTEXT=%s/first-binary-consumer-context.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CONSUMER_IDENTITY=%s/first-binary-build-identity.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PRODUCER_EVIDENCE=%s/first-binary-producer-evidence.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CONSUMER_RESULT=%s/first-binary-consumer-result.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'STATE_WITNESS_DIR=%s/state-history-witnesses\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          if [[ ("$MODE" == "consume-existing" && "$CONSUMER_PROFILE" == "focused") || ("$MODE" == "build" && "$CONSUMER_PROFILE" == "browser-diagnostic") ]]; then
            mkdir -m 700 -- "$RUNNER_TEMP/state-history-witnesses"
          fi
          if [[ "$MODE" == "consume-existing" || ("$MODE" == "build" && "$CONSUMER_PROFILE" == "browser-diagnostic") ]]; then
            printf 'FIXTURE_ROOT=%s/fixture-source\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            sdk_root="$GITHUB_WORKSPACE/sdk-source"
          else
            printf 'FIXTURE_ROOT=%s/product\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            sdk_root="$GITHUB_WORKSPACE/product"
          fi
          printf 'SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
          printf 'PYTHONPATH=%s/sdk/python/src:%s/sdk/python/tests\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
      - name: Check out workflow host (Hc)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .workflow-src
      - name: Check out exact product source (T)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: product
      - name: Check out exact consumer fixture source (Q)
        if: ${{ inputs.mode == 'consume-existing' || (inputs.mode == 'build' && inputs.consumer_profile == 'browser-diagnostic') }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.fixture_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: fixture-source
      - name: Check out exact Python SDK source (S)
        if: ${{ inputs.mode == 'consume-existing' || (inputs.mode == 'build' && inputs.consumer_profile == 'browser-diagnostic') }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sdk_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: sdk-source
      - name: Verify H, B, T, and native consumer architecture
        shell: bash
        env:
          EXPECTED_H: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          FIXTURE_SHA: ${{ inputs.fixture_sha }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "aarch64" ]] || {
            echo "ARM64 consumer is not on its native standard runner" >&2
            exit 1
          }
          [[ "${EXPECTED_H}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${BASE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] || exit 1
          actual_h="$(git -C .workflow-src rev-parse HEAD)"
          [[ "${actual_h}" == "${EXPECTED_H}" ]] || {
            echo "workflow-host source Hc does not match the active dispatch" >&2
            exit 1
          }
          case "${GITHUB_REF}" in
            refs/heads/*) ;;
            *) echo "consumer qualification requires a branch dispatch" >&2; exit 1 ;;
          esac
          actual_t="$(git -C product rev-parse HEAD)"
          [[ "${actual_t}" == "${TARGET_SHA}" ]] || {
            echo "product source T does not match target_sha" >&2
            exit 1
          }
          git -C product fetch --no-tags --depth=1 origin -- "${BASE_REF}"
          actual_b="$(git -C product rev-parse 'FETCH_HEAD^{commit}')"
          [[ "${actual_b}" == "${BASE_SHA}" ]] || {
            echo "comparison base B does not match base_sha" >&2
            exit 1
          }
          git -C product cat-file -e "${BASE_SHA}^{commit}"
          if [[ "${MODE}" == "consume-existing" || ("${MODE}" == "build" && "${CONSUMER_PROFILE}" == "browser-diagnostic") ]]; then
            [[ "${FIXTURE_SHA}" =~ ^[0-9a-f]{40}$ && "${SDK_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$(git -C fixture-source rev-parse HEAD)" == "${FIXTURE_SHA}" ]] || {
              echo "fixture checkout Q does not match fixture_sha" >&2; exit 1;
            }
            [[ "$(git -C sdk-source rev-parse HEAD)" == "${SDK_SHA}" ]] || {
              echo "SDK checkout S does not match sdk_sha" >&2; exit 1;
            }
          fi
      - name: Verify dispatch run and select exactly one uploaded artifact by API
        if: ${{ inputs.mode == 'build' }}
        id: artifact_api
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          EXPECTED_H: ${{ github.sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          SHA = re.compile(r"[0-9a-f]{40}\Z")
          DIGEST = re.compile(r"sha256:[0-9a-f]{64}\Z")

          def fail(message: str) -> None:
              raise SystemExit(message)

          repository = os.environ["GITHUB_REPOSITORY"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              fail("invalid repository identity in runner environment")
          api_url = os.environ["API_URL"].rstrip("/")
          token = os.environ["GITHUB_TOKEN"]
          run_id_text = os.environ["EXPECTED_RUN_ID"]
          if not run_id_text.isdecimal():
              fail("invalid workflow run identity")
          run_id = int(run_id_text)
          expected_h = os.environ["EXPECTED_H"]
          target_sha = os.environ["TARGET_SHA"]
          base_sha = os.environ["BASE_SHA"]
          base_ref = os.environ["BASE_REF"]
          branch = os.environ["EXPECTED_BRANCH"]
          architecture = os.environ["PRODUCT_ARCH"]
          target = os.environ["RUST_TARGET"]
          runner_label = os.environ["EXPECTED_RUNNER_LABEL"]
          if not all(SHA.fullmatch(value) for value in (expected_h, target_sha, base_sha)):
              fail("invalid H/T/B SHA input")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]{0,199}", base_ref):
              fail("invalid comparison base ref")
          if not os.environ["GITHUB_REF"].startswith("refs/heads/"):
              fail("consumer workflow was not dispatched from a branch")

          def get_json(path: str) -> dict[str, object]:
              request = Request(
                  f"{api_url}{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2026-03-10",
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.loads(response.read())
              except HTTPError as error:
                  fail(f"GitHub Actions API returned HTTP {error.code} for {path}")
              except URLError as error:
                  fail(f"GitHub Actions API request failed for {path}: {error.reason}")

          run = get_json(f"/repos/{repository}/actions/runs/{run_id}")
          if run.get("id") != run_id:
              fail("Actions API run ID differs from the active workflow run")
          if run.get("event") != "workflow_dispatch":
              fail("consumer route requires an explicit workflow_dispatch event")
          workflow_id = run.get("workflow_id")
          if type(workflow_id) is not int or workflow_id <= 0:
              fail("Actions API run omitted a valid numeric workflow ID")
          workflow = get_json(f"/repos/{repository}/actions/workflows/{workflow_id}")
          if workflow.get("id") != workflow_id:
              fail("Actions API workflow ID differs from the active workflow run")
          if workflow.get("path") != ".github/workflows/sedna-branch-build.yml":
              fail("active Actions run is not the registered sedna-branch-build workflow")
          if run.get("head_sha") != expected_h or run.get("head_branch") != branch:
              fail("Actions API workflow host H or branch differs from the active dispatch")
          if os.environ["GITHUB_REF_NAME"] != branch:
              fail("workflow ref name differs from the requested branch identity")

          listing = get_json(f"/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100")
          artifacts = listing.get("artifacts")
          if not isinstance(artifacts, list) or listing.get("total_count") != len(artifacts):
              fail("artifact API listing is malformed or incomplete")
          expected_name = f"sedna-first-binary-{target_sha}-{architecture}-{run_id}"
          matches = [item for item in artifacts if item.get("name") == expected_name]
          if len(matches) != 1:
              fail("Actions API did not return exactly one expected package artifact")
          artifact = matches[0]
          association = artifact.get("workflow_run")
          if not isinstance(association, dict):
              fail("artifact API response omitted its workflow-run association")
          if (
              association.get("id") != run_id
              or association.get("head_sha") != expected_h
              or association.get("head_branch") != branch
          ):
              fail("artifact workflow association does not match exact H/run/branch")
          artifact_id = artifact.get("id")
          artifact_digest = artifact.get("digest")
          size = artifact.get("size_in_bytes")
          if type(artifact_id) is not int or artifact_id <= 0:
              fail("artifact API returned an invalid numeric artifact ID")
          if artifact.get("expired") is not False or type(size) is not int or size <= 0:
              fail("expected package artifact is expired or empty")
          if not isinstance(artifact_digest, str) or not DIGEST.fullmatch(artifact_digest):
              fail("artifact API omitted a valid SHA-256 digest")

          identity = {
              "schema_version": "sedna-first-binary-consumer-api-v1",
              "repository": repository,
              "workflow_path": workflow["path"],
              "event": run["event"],
              "workflow_host_sha": expected_h,
              "product_sha": target_sha,
              "comparison_base_ref": base_ref,
              "comparison_base_sha": base_sha,
              "branch": branch,
              "run_id": run_id,
              "artifact_id": artifact_id,
              "artifact_name": expected_name,
              "artifact_digest": artifact_digest,
              "artifact_size_bytes": size,
              "architecture": architecture,
              "target": target,
              "runner_label": runner_label,
          }
          Path(os.environ["CONSUMER_IDENTITY"]).write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"artifact_id={artifact_id}\n")
              output.write(f"artifact_name={expected_name}\n")
              output.write(f"artifact_digest={artifact_digest}\n")
          PY
      - name: Verify producer API evidence and write current consumer context
        id: verified_artifact
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          PRODUCT_ARCH: aarch64
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_WORKFLOW_HOST_SHA: ${{ inputs.producer_workflow_host_sha }}
          FIXTURE_SHA: ${{ inputs.fixture_sha }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
          CONSUMER_CONTEXT_OUT: ${{ runner.temp }}/first-binary-consumer-context.json
          PRODUCER_EVIDENCE_OUT: ${{ runner.temp }}/first-binary-producer-evidence.json
        run: python3 .workflow-src/.github/scripts/verify_existing_first_binary_producer.py
      - name: Download the API-verified artifact outside the checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.verified_artifact.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verified_artifact.outputs.producer_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/first-binary-artifact
          digest-mismatch: error
      - name: Install and verify the pinned consumer Python toolchain
        id: setup_uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12.14"
          enable-cache: false
      - name: Verify uv and managed Python versions
        shell: bash
        env:
          UV_MANAGED_PYTHON: "1"
          UV_VERSION: ${{ steps.setup_uv.outputs.uv-version }}
          UV_PATH: ${{ steps.setup_uv.outputs.uv-path }}
        run: |
          set -euo pipefail
          [[ "${UV_VERSION}" == "0.12.17" ]] || {
            echo "setup-uv did not resolve the pinned 0.12.17 release" >&2
            exit 1
          }
          [[ -x "${UV_PATH}" ]] || {
            echo "setup-uv did not expose an executable uv path" >&2
            exit 1
          }
          uv_report="$("${UV_PATH}" --version)"
          uv_version_pattern="^uv 0[.]12[.]17 \\(([0-9a-f]{9,40} [0-9]{4}-[0-9]{2}-[0-9]{2} )?${RUST_TARGET}\\)$"
          [[ "${uv_report}" =~ ${uv_version_pattern} ]] || {
            echo "uv executable release or native target does not match the pinned package consumer" >&2
            exit 1
          }
          "${UV_PATH}" python install 3.12.14
          selected_python="$("${UV_PATH}" run --no-project --python 3.12.14 python -c 'import platform; print(platform.python_version())')"
          [[ "${selected_python}" == "3.12.14" ]] || {
            echo "uv did not select the pinned Python 3.12.14 runtime" >&2
            exit 1
          }
      - name: Run packaged first-binary consumers and preserve pytest status
        if: ${{ inputs.mode == 'build' }}
        id: consumer_tests
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
          FIXTURE_SHA: ${{ inputs.fixture_sha }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          WORKFLOW_HOST_SHA: ${{ github.sha }}
          ARTIFACT_ID: ${{ steps.artifact_api.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.artifact_api.outputs.artifact_name }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          CODEX_STATE_HISTORY_ACCEPTANCE: "1"
          UV_MANAGED_PYTHON: "1"
          UV_PATH: ${{ steps.setup_uv.outputs.uv-path }}
        run: |
          set -euo pipefail
          export TMPDIR="${RUNNER_TEMP}"
          TEST_ROOT="${FIXTURE_ROOT}/scripts/codex_package/smoke_tests/first_binary"
          case "${MODE}:${CONSUMER_PROFILE}" in
            build:browser-diagnostic)
              TEST_ARGS=("${TEST_ROOT}/test_tui_agents_acceptance.py::test_packaged_tui_browser_output_keeps_images_and_manifest_metadata_separate")
              PRODUCER_ARGS=(--workflow-host-sha "${WORKFLOW_HOST_SHA}" --run-id "${PRODUCER_RUN_ID}")
              FIXTURE_ARGS=()
              ;;
            build:*)
              TEST_ARGS=("${TEST_ROOT}")
              PRODUCER_ARGS=(--workflow-host-sha "${WORKFLOW_HOST_SHA}" --run-id "${PRODUCER_RUN_ID}")
              FIXTURE_ARGS=()
              ;;
            *) echo "unsupported consumer mode/profile combination" >&2; exit 1 ;;
          esac
          set +e
          "${UV_PATH}" run --locked \
            --project "${SDK_ROOT}/sdk/python" \
            --group test \
            --python 3.12.14 \
            --with "zstandard==0.25.0" \
            pytest -q \
              --confcutdir="${TEST_ROOT}" \
              "${TEST_ARGS[@]}" \
              --artifact-dir "${ARTIFACT_DIR}" \
              --artifact-id "${ARTIFACT_ID}" \
              --artifact-name "${ARTIFACT_NAME}" \
              --target-sha "${TARGET_SHA}" \
              --base-ref "${BASE_REF}" \
              --base-sha "${BASE_SHA}" \
              "${PRODUCER_ARGS[@]}" \
              "${FIXTURE_ARGS[@]}" \
              --junitxml "${CONSUMER_JUNIT}"
          pytest_status=$?
          set -e
          if [[ "${CONSUMER_PROFILE}" == "browser-diagnostic" ]]; then
            PYTEST_EXIT_CODE="${pytest_status}" \
              python3 .workflow-src/.github/scripts/verify_existing_first_binary_producer.py \
                --verify-consumer-results
            exit 0
          fi
          PYTEST_EXIT_CODE="${pytest_status}" python3 - "${CONSUMER_JUNIT}" "${CONSUMER_IDENTITY}" "${RUNNER_TEMP}" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          junit_path = Path(sys.argv[1])
          identity_path = Path(sys.argv[2])
          basetemp = Path(sys.argv[3])
          identity = json.loads(identity_path.read_text(encoding="utf-8"))
          pytest_exit = int(os.environ["PYTEST_EXIT_CODE"])
          issues: list[str] = []
          cases = []
          if junit_path.is_file():
              try:
                  cases = list(ET.parse(junit_path).getroot().iter("testcase"))
              except ET.ParseError:
                  issues.append("JUnit report is malformed")
          else:
              issues.append("pytest did not produce a JUnit report")
          failures = sum(len(case.findall("failure")) for case in cases)
          errors = sum(len(case.findall("error")) for case in cases)
          skipped = sum(len(case.findall("skipped")) for case in cases)
          if pytest_exit != 0:
              issues.append(f"pytest exited with status {pytest_exit}")
          if not cases:
              issues.append("JUnit report contains zero executed test cases")
          if failures or errors:
              issues.append(f"JUnit reports failures={failures} errors={errors}")
          if skipped:
              issues.append(f"JUnit reports {skipped} skipped cases")

          positive_prefix = "test_packaged_historical_upgrade_and_reopen"
          negative_prefix = "test_packaged_historical_rejection_preserves_preimage"
          expected_positive = {
              "fresh", "u23", "u55", "u56", "u57", "u58", "f56", "f57",
              "f58", "f_full", "f_alias_pair", "shift24", "shift29", "shift38",
              "shift45", "shift50",
          }
          expected_negative = {
              "bad_checksum", "mixed_ids", "missing_middle", "failed_row",
              "incomplete_f58", "partial_alias", "partial_upstream_schema", "unknown_id",
          }

          def labels(prefix: str) -> list[str]:
              result = []
              for case in cases:
                  name = case.attrib.get("name", "")
                  if name.startswith(prefix):
                      if not name.startswith(prefix + "[") or not name.endswith("]"):
                          issues.append("state-history JUnit name is not a parameterized case")
                          continue
                      result.append(name[len(prefix) + 1 : -1])
              return result

          positive = labels(positive_prefix)
          negative = labels(negative_prefix)
          if len(positive) != 16 or set(positive) != expected_positive:
              issues.append("JUnit does not contain the exact 16 positive state-history cases")
          if len(negative) != 8 or set(negative) != expected_negative:
              issues.append("JUnit does not contain the exact 8 negative state-history cases")

          witness_paths = sorted((basetemp / "state-history-witnesses").glob("*.json"))
          witness_hashes: dict[str, str] = {}
          witness_cases: set[str] = set()
          expected_cases = expected_positive | expected_negative
          for path in witness_paths:
              try:
                  witness = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  issues.append("state-history witness JSON is missing or malformed")
                  continue
              case_name = witness.get("case")
              if not isinstance(case_name, str) or case_name not in expected_cases:
                  issues.append("state-history witness has an unexpected case identity")
                  continue
              witness_cases.add(case_name)
              expected_fields = {
                  "product_target_sha": identity["product_sha"],
                  "comparison_base_sha": identity["comparison_base_sha"],
                  "fixture_source_sha": identity["product_sha"],
                  "producer_workflow_host_sha": identity["workflow_host_sha"],
                  "producer_run_id": identity["run_id"],
                  "consumer_workflow_host_sha": identity["workflow_host_sha"],
                  "consumer_run_id": identity["run_id"],
                  "consumer_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "artifact_id": identity["artifact_id"],
                  "artifact_name": identity["artifact_name"],
                  "target": identity["target"],
              }
              if any(witness.get(key) != value for key, value in expected_fields.items()):
                  issues.append(f"state-history witness {case_name} identity mismatch")
              witness_hashes[case_name] = hashlib.sha256(path.read_bytes()).hexdigest()
          if len(witness_paths) != 24 or witness_cases != expected_cases:
              issues.append("expected all 24 redacted state-history witness records")

          test_result = {
              "pytest_exit_code": pytest_exit,
              "junit_sha256": hashlib.sha256(junit_path.read_bytes()).hexdigest()
              if junit_path.is_file() else None,
              "executed_cases": len(cases),
              "failures": failures,
              "errors": errors,
              "skipped": skipped,
              "state_history_positive_cases": len(positive),
              "state_history_negative_cases": len(negative),
              "state_history_witnesses": len(witness_hashes),
              "state_history_witness_sha256": dict(sorted(witness_hashes.items())),
              "issues": issues,
          }
          identity["consumer_test_result"] = test_result
          identity_path.write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(
              "consumer test gate: "
              f"exit={pytest_exit} cases={len(cases)} failures={failures} "
              f"errors={errors} skipped={skipped} "
              f"state_positive={len(positive)} state_negative={len(negative)} "
              f"state_witnesses={len(witness_hashes)}"
          )
          for issue in issues:
              print(f"consumer test gate failed: {issue}", file=sys.stderr)
          if issues:
              raise SystemExit(1)
          PY
          PYTEST_EXIT_CODE="${pytest_status}" \
            python3 .workflow-src/.github/scripts/verify_existing_first_binary_producer.py \
              --verify-consumer-results
      - name: Upload consumer result and redacted state witnesses
        if: ${{ always() && inputs.mode == 'build' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-first-binary-consumer-${{ inputs.target_sha }}-aarch64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/first-binary-consumer-context.json
            ${{ runner.temp }}/first-binary-producer-evidence.json
            ${{ runner.temp }}/first-binary-consumer-result.json
            ${{ runner.temp }}/first-binary-consumer-results.xml
            ${{ runner.temp }}/state-history-witnesses/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Check accepted package fixture modules for undefined names
        if: ${{ inputs.mode == 'consume-existing' && (inputs.consumer_profile == 'focused' || inputs.consumer_profile == 'full') }}
        shell: bash
        env:
          UV_MANAGED_PYTHON: "1"
          UV_PATH: ${{ steps.setup_uv.outputs.uv-path }}
        run: |
          set -euo pipefail
          "${UV_PATH}" run --locked \
            --project "${SDK_ROOT}/sdk/python" \
            --group test \
            --python 3.12.14 \
            ruff check \
              --select F821,F822,F823 \
              --output-format=github \
              "${FIXTURE_ROOT}/scripts/codex_package/smoke_tests/first_binary/test_agent_control_model_acceptance.py" \
              "${FIXTURE_ROOT}/scripts/codex_package/smoke_tests/first_binary/test_agent_control_tui_acceptance.py" \
              "${FIXTURE_ROOT}/scripts/codex_package/smoke_tests/first_binary/tui_pty.py"
      - name: Temporarily enable Linux user namespaces for existing-package consumers
        if: ${{ inputs.mode == 'consume-existing' && (inputs.consumer_profile == 'pair' || inputs.consumer_profile == 'full' || inputs.consumer_profile == 'focused') && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          set -euo pipefail
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          for value in "$current_userns" "$current_apparmor"; do
            case "$value" in
              ""|0|1) ;;
              *) echo "unexpected Linux user-namespace sysctl value" >&2; exit 1 ;;
            esac
          done
          printf 'CODEX_USERNS_CLONE_ORIGINAL=%s\n' "$current_userns" >> "$GITHUB_ENV"
          printf 'CODEX_APPARMOR_USERNS_ORIGINAL=%s\n' "$current_apparmor" >> "$GITHUB_ENV"
          if [[ -n "$current_userns" && "$current_userns" != "1" ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [[ -n "$current_apparmor" && "$current_apparmor" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          effective_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          effective_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [[ -n "$current_userns" && "$effective_userns" != "1" ]]; then
            echo "could not enable Linux user namespaces for the consumer" >&2
            exit 1
          fi
          if [[ -n "$current_apparmor" && "$effective_apparmor" != "0" ]]; then
            echo "could not enable AppArmor-compatible user namespaces for the consumer" >&2
            exit 1
          fi
      - name: Run existing-package consumers with explicit producer provenance
        if: ${{ inputs.mode == 'consume-existing' }}
        id: existing_consumer_tests
        shell: bash
        env:
          CONSUMER_PROFILE: ${{ inputs.consumer_profile }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_WORKFLOW_HOST_SHA: ${{ inputs.producer_workflow_host_sha }}
          FIXTURE_SHA: ${{ inputs.fixture_sha }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          ARTIFACT_ID: ${{ steps.verified_artifact.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.verified_artifact.outputs.artifact_name }}
          UV_MANAGED_PYTHON: "1"
          CODEX_STATE_HISTORY_ACCEPTANCE: "1"
          UV_PATH: ${{ steps.setup_uv.outputs.uv-path }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          export TMPDIR="${RUNNER_TEMP}"
          test_root="${FIXTURE_ROOT}/scripts/codex_package/smoke_tests/first_binary"
          case "${CONSUMER_PROFILE}" in
            pair)
              test_args=(
                "${test_root}/state_history/test_state_history.py::test_packaged_historical_upgrade_and_reopen[fresh]"
                "${test_root}/state_history/test_state_history.py::test_packaged_historical_rejection_preserves_preimage[bad_checksum]"
              )
              ;;
            focused)
              test_args=(
                "${test_root}/test_agent_control_model_acceptance.py::test_packaged_model_nested_spawn_recovery_and_list_after_resume"
                "${test_root}/test_agent_control_model_acceptance.py::test_packaged_model_queue_only_message_does_not_wake_until_followup_and_exact_join"
                "${test_root}/test_agent_control_model_acceptance.py::test_packaged_model_goal_continuation_and_terminal_transition"
                "${test_root}/test_agent_control_tui_acceptance.py::test_packaged_tui_agents_details_render_configured_identity_and_unknown_effective_identity"
                "${test_root}/test_tui_agents_acceptance.py::test_actual_tui_agents_entry_has_initial_empty_search"
                "${test_root}/test_tui_agents_acceptance.py::test_actual_tui_nested_filter_clear_live_rename_and_replay"
              )
              ;;
            full) test_args=("${test_root}") ;;
            *) echo "unsupported consumer profile" >&2; exit 1 ;;
          esac
          set +e
          "${UV_PATH}" run --locked \
            --project "${SDK_ROOT}/sdk/python" \
            --group test \
            --python 3.12.14 \
            --with "zstandard==0.25.0" \
            pytest -q \
              --confcutdir="${test_root}" \
              "${test_args[@]}" \
              --artifact-dir "${ARTIFACT_DIR}" \
              --artifact-id "${ARTIFACT_ID}" \
              --artifact-name "${ARTIFACT_NAME}" \
              --target-sha "${TARGET_SHA}" \
              --base-ref "${BASE_REF}" \
              --base-sha "${BASE_SHA}" \
              --expected-producer-workflow-host-sha "${PRODUCER_WORKFLOW_HOST_SHA}" \
              --expected-producer-run-id "${PRODUCER_RUN_ID}" \
              --consumer-context-file "${CONSUMER_CONTEXT}" \
              --fixture-sha "${FIXTURE_SHA}" \
              --junitxml "${CONSUMER_JUNIT}"
          pytest_status=$?
          set -e
          PYTEST_EXIT_CODE="${pytest_status}" \
            python3 .workflow-src/.github/scripts/verify_existing_first_binary_producer.py \
              --verify-consumer-results
      - name: Restore original Linux user-namespace settings
        if: ${{ always() && inputs.mode == 'consume-existing' && (inputs.consumer_profile == 'pair' || inputs.consumer_profile == 'full' || inputs.consumer_profile == 'focused') && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          set -euo pipefail
          original_userns="$(printenv CODEX_USERNS_CLONE_ORIGINAL || true)"
          original_apparmor="$(printenv CODEX_APPARMOR_USERNS_ORIGINAL || true)"
          if [[ -n "$original_userns" ]]; then
            sudo sysctl -w "kernel.unprivileged_userns_clone=$original_userns"
          fi
          if [[ -n "$original_apparmor" ]]; then
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$original_apparmor"
          fi
      - name: Upload existing-package consumer evidence
        if: ${{ always() && inputs.mode == 'consume-existing' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sedna-first-binary-consumer-${{ inputs.target_sha }}-aarch64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/first-binary-consumer-context.json
            ${{ runner.temp }}/first-binary-producer-evidence.json
            ${{ runner.temp }}/first-binary-consumer-result.json
            ${{ runner.temp }}/first-binary-consumer-results.xml
            ${{ runner.temp }}/state-history-witnesses/*.json
          if-no-files-found: warn
          retention-days: 7
