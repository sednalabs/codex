                      reject("new-external-closure")
              return {
                  "old_local_records": len(old_local),
                  "old_external_records": sum(old_external.values()),
                  "new_local_names": sorted(new_names),
                  "new_external_records": sum(additions.values()),
                  "reachable_metadata_packages": len(reachable),
