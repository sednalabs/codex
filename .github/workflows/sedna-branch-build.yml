name: sedna-branch-build
run-name: >-
  sedna-branch-build
  [platform=${{ inputs.platform }} host_only=${{ inputs.host_only }} prepare_lock_only=${{ inputs.prepare_lock_only }}]

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA to build; omit to use the workflow commit
        required: false
        type: string
      platform:
        description: Preview artifact platform
        required: true
        default: linux-x86_64
        type: choice
        options:
          - linux-x86_64
          - linux-aarch64
          - linux-pair
          - macos
      host_only:
        description: Build only the Linux x86_64 code-mode host helper
        required: false
        default: false
        type: boolean
      prepare_lock_only:
        description: Generate a source-bound Cargo.lock delta without building binaries
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && (inputs.ref || github.sha) || github.ref_name }}-${{ inputs.platform }}-${{ inputs.host_only }}-${{ inputs.prepare_lock_only }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve preview metadata
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      display_ref: ${{ steps.meta.outputs.display_ref }}
      preview_version: ${{ steps.meta.outputs.preview_version }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      workflow_sha: ${{ steps.meta.outputs.workflow_sha }}
    steps:
      - name: Validate immutable source identity
        shell: bash
        env:
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source ref must be a full immutable 40-character commit SHA." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Compute preview version
        id: meta
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          HOST_ONLY: ${{ inputs.host_only }}
          PREPARE_LOCK_ONLY: ${{ inputs.prepare_lock_only }}
          PLATFORM: ${{ inputs.platform }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${HOST_ONLY}" == "true" && "${PLATFORM}" != "linux-x86_64" ]]; then
            echo "The code-mode host-only artifact is supported only on linux-x86_64." >&2
            exit 1
          fi
          if [[ "${PREPARE_LOCK_ONLY}" == "true" && ( "${HOST_ONLY}" == "true" || "${PLATFORM}" != "linux-x86_64" ) ]]; then
            echo "Cargo lock preparation requires linux-x86_64 mode with host_only disabled." >&2
            exit 1
          fi
          checkout_ref="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          base_version=""
          git fetch --quiet --no-tags https://github.com/openai/codex.git \
            '+refs/tags/rust-v*:refs/tags/rust-v*'
          while IFS= read -r candidate_tag; do
            if [[ "${candidate_tag}" =~ ^rust-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              base_version="${BASH_REMATCH[1]}"
              break
            fi
          done < <(git tag --merged HEAD --list 'rust-v*' --sort=-version:refname)
          if [[ -n "${base_version}" ]]; then
            preview_version="${base_version}-dev.sedna.${GITHUB_RUN_NUMBER}+g${short_sha}"
          else
            preview_version="0.0.0-dev.sedna.g${short_sha}"
          fi

          {
            echo "checkout_ref=${checkout_ref}"
            echo "display_ref=source-${short_sha}"
            echo "preview_version=${preview_version}"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "workflow_sha=${WORKFLOW_SHA}"
            echo "artifact_name=sedna-branch-${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out trusted package consumer
        if: ${{ inputs.platform == 'linux-pair' || inputs.prepare_lock_only }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .workflow-src

      - name: Validate package consumer boundaries
        if: ${{ inputs.platform == 'linux-pair' || inputs.prepare_lock_only }}
        working-directory: .workflow-src
        shell: bash
        run: python3 .github/scripts/test_verify_sedna_branch_package.py

  prepare-cargo-lock:
    name: Prepare exact source Cargo.lock delta
    needs: metadata
    if: ${{ inputs.prepare_lock_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .workflow-src

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          path: source

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Resolve only the exact local workspace lock addition
        working-directory: source/codex-rs
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ needs.metadata.outputs.workflow_sha }}
          EXPECTED_PREVIEW_VERSION: ${{ needs.metadata.outputs.preview_version }}
        run: |
          set -euo pipefail
          source_root="${GITHUB_WORKSPACE}/source"
          actual_source_sha="$(git -C "${source_root}" rev-parse HEAD)"
          source_tree="$(git -C "${source_root}" rev-parse 'HEAD^{tree}')"
          workflow_sha="$(git -C "${GITHUB_WORKSPACE}/.workflow-src" rev-parse HEAD)"
          if [[ "${actual_source_sha}" != "${EXPECTED_SOURCE_SHA}" || "${workflow_sha}" != "${EXPECTED_WORKFLOW_SHA}" ]]; then
            echo "lock preparation source or workflow identity mismatch." >&2
            exit 1
          fi
          if [[ -n "$(git -C "${source_root}" status --porcelain --untracked-files=normal)" ]]; then
            echo "lock preparation source checkout is not clean before metadata resolution." >&2
            exit 1
          fi
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          cargo metadata --format-version 1 >/dev/null
          git -C "${source_root}" diff --check
          mapfile -t changed_paths < <(git -C "${source_root}" diff --name-only)
          if [[ "${#changed_paths[@]}" -ne 1 || "${changed_paths[0]}" != "codex-rs/Cargo.lock" ]]; then
            echo "lock preparation changed an unexpected source path." >&2
            exit 1
          fi
          git -C "${source_root}" diff --binary -- codex-rs/Cargo.lock > "${RUNNER_TEMP}/Cargo.lock.patch"
          patch_bytes="$(wc -c < "${RUNNER_TEMP}/Cargo.lock.patch" | tr -d '[:space:]')"
          if [[ "${patch_bytes}" -eq 0 || "${patch_bytes}" -gt 65536 ]]; then
            echo "lock preparation delta size is outside the accepted bound." >&2
            exit 1
          fi
          SOURCE_TREE="${source_tree}" \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            GITHUB_SERVER_URL="${GITHUB_SERVER_URL}" \
            python3 - "${RUNNER_TEMP}/Cargo.lock.before" "${source_root}/codex-rs/Cargo.lock" "${RUNNER_TEMP}/Cargo.lock.patch" "${RUNNER_TEMP}/lock-delta.json" <<'PY'
          import collections
          import hashlib
          import json
          import os
          import sys
          import tomllib
          from pathlib import Path

          before_path, after_path, patch_path, output_path = map(Path, sys.argv[1:])
          before_text = before_path.read_bytes()
          after_text = after_path.read_bytes()
          before = tomllib.loads(before_text.decode("utf-8"))
          after = tomllib.loads(after_text.decode("utf-8"))

          def records(document, external):
              selected = [
                  package for package in document.get("package", [])
                  if bool(package.get("source")) == external
              ]
              return collections.Counter(
                  json.dumps(package, sort_keys=True, separators=(",", ":"))
                  for package in selected
              )

          before_external = records(before, True)
          after_external = records(after, True)
          if before_external != after_external:
              raise SystemExit("external Cargo.lock package records changed")
          before_local = {
              (package["name"], package["version"]): package
              for package in before.get("package", [])
              if not package.get("source")
          }
          after_local = {
              (package["name"], package["version"]): package
              for package in after.get("package", [])
              if not package.get("source")
          }
          added = set(after_local) - set(before_local)
          removed = set(before_local) - set(after_local)
          expected_added = {("codex-browser-computer-use", "0.0.0")}
          if removed or added != expected_added:
              raise SystemExit("unexpected local Cargo.lock package-set delta")
          for identity, before_package in before_local.items():
              after_package = after_local[identity]
              if identity == ("codex-tui", "0.0.0"):
                  expected_package = dict(before_package)
                  expected_package["dependencies"] = sorted(
                      [*before_package.get("dependencies", []), "codex-browser-computer-use"]
                  )
                  if after_package != expected_package:
                      raise SystemExit("unexpected codex-tui lock dependency delta")
              elif after_package != before_package:
                  raise SystemExit("an unrelated local Cargo.lock package record changed")
          package = after_local[next(iter(expected_added))]
          patch = patch_path.read_bytes()
          output = {
              "schema_version": "sedna-cargo-lock-delta-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_url": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}'
                  f'/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
              ),
              "source_sha": os.environ["EXPECTED_SOURCE_SHA"],
              "source_tree": os.environ["SOURCE_TREE"],
              "workflow_sha": os.environ["EXPECTED_WORKFLOW_SHA"],
              "preview_version": os.environ["EXPECTED_PREVIEW_VERSION"],
              "before_lock_sha256": hashlib.sha256(before_text).hexdigest(),
              "after_lock_sha256": hashlib.sha256(after_text).hexdigest(),
              "patch_sha256": hashlib.sha256(patch).hexdigest(),
              "patch_bytes": len(patch),
              "added_local_package": {"name": package["name"], "version": package["version"]},
              "updated_local_dependency": {
                  "package": "codex-tui",
                  "dependency": "codex-browser-computer-use",
              },
              "external_package_records_unchanged": True,
          }
          output_path.write_text(json.dumps(output, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload only the Cargo.lock patch and identity record
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}-cargo-lock-delta
          path: |
            ${{ runner.temp }}/Cargo.lock.patch
            ${{ runner.temp }}/lock-delta.json
          if-no-files-found: error
          retention-days: 3

  build-linux-x86_64:
    needs: metadata
    if: ${{ !inputs.prepare_lock_only && (inputs.platform == 'linux-x86_64' || inputs.platform == 'linux-pair') }}
    uses: ./.github/workflows/_sedna-linux-rust.yml
    with:
      checkout_ref: ${{ needs.metadata.outputs.checkout_ref }}
      persist_checkout_credentials: false
      summary_title: Branch build
      release_version: ${{ needs.metadata.outputs.preview_version }}
      target: x86_64-unknown-linux-gnu
      artifact_name: ${{ needs.metadata.outputs.artifact_name }}-x86_64-unknown-linux-gnu
      artifact_path: dist/*
      display_ref: ${{ needs.metadata.outputs.display_ref }}
      run_command: |
        if [[ '${{ inputs.host_only }}' == 'true' ]]; then
          source_status="$(git status --porcelain --untracked-files=normal)"
          if [[ -n "${source_status}" ]]; then
            echo "Refusing to build a preview from a dirty source tree." >&2
            printf '%s\n' "${source_status}" >&2
            exit 1
          fi
          source ../.github/scripts/validation-lanes/setup-rusty-v8.sh x86_64-unknown-linux-gnu
          cargo build --locked --target x86_64-unknown-linux-gnu --release --bin codex-code-mode-host
          mkdir -p ../dist

          stage_dir="${RUNNER_TEMP}/sedna-branch/x86_64-unknown-linux-gnu-host-only"
          file_version="${CODEX_RELEASE_VERSION//+/__}"
          archive_base="codex-sedna-preview-host-${file_version}-x86_64-unknown-linux-gnu"
          rm -rf "${stage_dir}"
          mkdir -p "${stage_dir}"
          install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex-code-mode-host" "${stage_dir}/codex-code-mode-host"

          file "${stage_dir}/codex-code-mode-host" | grep -F 'x86-64'
          readelf -l "${stage_dir}/codex-code-mode-host" | grep -F '/lib64/ld-linux-x86-64.so.2'
          "${stage_dir}/codex-code-mode-host" --help >/dev/null
          tar -C "${stage_dir}" -czf "../dist/${archive_base}.tar.gz" .
          (cd "${stage_dir}" && sha256sum codex-code-mode-host) > "../dist/${archive_base}.binary.sha256"
          (cd ../dist && sha256sum "${archive_base}.tar.gz") > "../dist/${archive_base}.tar.gz.sha256"

          python3 - <<'PY' > "../dist/${archive_base}.json"
        import hashlib
        import json
        import os
        import subprocess
        import sys

        binary_path = os.path.join(
            os.environ["RUNNER_TEMP"],
            "sedna-branch/x86_64-unknown-linux-gnu-host-only/codex-code-mode-host",
        )
        payload = {
            "repository": os.environ["GITHUB_REPOSITORY"],
            "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "workflowCommit": subprocess.check_output(
                ["git", "-C", "../.workflow-src", "rev-parse", "HEAD"], text=True
            ).strip(),
            "ref": os.environ["DISPLAY_REF"],
            "previewVersion": os.environ["CODEX_RELEASE_VERSION"],
            "artifact": "codex-code-mode-host",
            "binarySha256": "",
            "workflow": (
                f'{os.environ["GITHUB_SERVER_URL"]}/'
                f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
            ),
        }
        with open(binary_path, "rb") as binary_file:
            payload["binarySha256"] = hashlib.sha256(binary_file.read()).hexdigest()
        json.dump(payload, sys.stdout, indent=2)
        sys.stdout.write("\n")
        PY
          exit 0
        fi
        source_status="$(git status --porcelain --untracked-files=normal)"
        if [[ -n "${source_status}" ]]; then
          echo "Refusing to build a preview from a dirty source tree." >&2
          printf '%s\n' "${source_status}" >&2
          exit 1
        fi
        cargo build --locked --target x86_64-unknown-linux-gnu --release --bin codex --bin codex-code-mode-host --bin codex-responses-api-proxy
        mkdir -p ../dist

        stage_dir="${RUNNER_TEMP}/sedna-branch/x86_64-unknown-linux-gnu"
        file_version="${CODEX_RELEASE_VERSION//+/__}"
        archive_base="codex-sedna-preview-${file_version}-x86_64-unknown-linux-gnu"

        rm -rf "${stage_dir}"
        mkdir -p "${stage_dir}"

        install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex" "${stage_dir}/codex"
        install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex-code-mode-host" "${stage_dir}/codex-code-mode-host"
        install -Dm 0755 "target/x86_64-unknown-linux-gnu/release/codex-responses-api-proxy" "${stage_dir}/codex-responses-api-proxy"

        file "${stage_dir}/codex" | grep -F 'x86-64'
        readelf -l "${stage_dir}/codex" | grep -F '/lib64/ld-linux-x86-64.so.2'
        version_output="$("${stage_dir}/codex" --version)"
        printf '%s\n' "${version_output}"
        if [[ "${version_output}" == *-dirty* ]]; then
          echo "Preview binary unexpectedly contains dirty git provenance." >&2
          exit 1
        fi
        "${stage_dir}/codex" --help >/dev/null
        "${stage_dir}/codex" exec --help >/dev/null
        "${stage_dir}/codex" app-server --help >/dev/null
        "${stage_dir}/codex-code-mode-host" --help >/dev/null
        "${stage_dir}/codex-responses-api-proxy" --help >/dev/null
        for binary in codex codex-code-mode-host codex-responses-api-proxy; do
          (cd "${stage_dir}" && sha256sum "${binary}") > "../dist/${archive_base}.${binary}.sha256"
        done

        tar -C "${stage_dir}" -czf "../dist/${archive_base}.tar.gz" .
        (cd ../dist && sha256sum "${archive_base}.tar.gz") > "../dist/${archive_base}.tar.gz.sha256"

        ARCHIVE_BASE="${archive_base}" python3 - <<'PY' > "../dist/${archive_base}.json"
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess
        import sys

        dist = Path("../dist")
        archive = dist / f"{os.environ['ARCHIVE_BASE']}.tar.gz"
        binaries = {}
        for name in ("codex", "codex-code-mode-host", "codex-responses-api-proxy"):
            binary = Path(os.environ["RUNNER_TEMP"]) / "sedna-branch/x86_64-unknown-linux-gnu" / name
            binaries[name] = hashlib.sha256(binary.read_bytes()).hexdigest()
        payload = {
            "repository": os.environ["GITHUB_REPOSITORY"],
            "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "workflowCommit": subprocess.check_output(
                ["git", "-C", "../.workflow-src", "rev-parse", "HEAD"], text=True
            ).strip(),
          "previewVersion": os.environ["CODEX_RELEASE_VERSION"],
            "target": "x86_64-unknown-linux-gnu",
            "binaries": binaries,
            "archiveSha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
            "workflow": (
                f'{os.environ["GITHUB_SERVER_URL"]}/'
                f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
            ),
        }
        json.dump(payload, sys.stdout, indent=2)
        sys.stdout.write("\n")
        PY

  build-linux-aarch64:
    needs: metadata
    if: ${{ !inputs.prepare_lock_only && (inputs.platform == 'linux-aarch64' || inputs.platform == 'linux-pair') }}
    uses: ./.github/workflows/_sedna-linux-rust.yml
    with:
      checkout_ref: ${{ needs.metadata.outputs.checkout_ref }}
      persist_checkout_credentials: false
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      summary_title: Branch build
      release_version: ${{ needs.metadata.outputs.preview_version }}
      artifact_name: ${{ needs.metadata.outputs.artifact_name }}-aarch64-unknown-linux-gnu
      artifact_path: dist/*
      display_ref: ${{ needs.metadata.outputs.display_ref }}
      run_command: |
        source_status="$(git status --porcelain --untracked-files=normal)"
        if [[ -n "${source_status}" ]]; then
          echo "Refusing to build a preview from a dirty source tree." >&2
          printf '%s\n' "${source_status}" >&2
          exit 1
        fi
        cargo build --locked --target aarch64-unknown-linux-gnu --release --bin codex --bin codex-code-mode-host --bin codex-responses-api-proxy
        mkdir -p ../dist

        stage_dir="${RUNNER_TEMP}/sedna-branch/aarch64-unknown-linux-gnu"
        file_version="${CODEX_RELEASE_VERSION//+/__}"
        archive_base="codex-sedna-preview-${file_version}-aarch64-unknown-linux-gnu"

        rm -rf "${stage_dir}"
        mkdir -p "${stage_dir}"

        install -Dm 0755 "target/aarch64-unknown-linux-gnu/release/codex" "${stage_dir}/codex"
        install -Dm 0755 "target/aarch64-unknown-linux-gnu/release/codex-code-mode-host" "${stage_dir}/codex-code-mode-host"
        install -Dm 0755 "target/aarch64-unknown-linux-gnu/release/codex-responses-api-proxy" "${stage_dir}/codex-responses-api-proxy"

        file "${stage_dir}/codex" | grep -F 'ARM aarch64'
        readelf -l "${stage_dir}/codex" | grep -F '/lib/ld-linux-aarch64.so.1'
        version_output="$("${stage_dir}/codex" --version)"
        printf '%s\n' "${version_output}"
        if [[ "${version_output}" == *-dirty* ]]; then
          echo "Preview binary unexpectedly contains dirty git provenance." >&2
          exit 1
        fi
        "${stage_dir}/codex" --help >/dev/null
        "${stage_dir}/codex" exec --help >/dev/null
        "${stage_dir}/codex" app-server --help >/dev/null
        "${stage_dir}/codex-code-mode-host" --help >/dev/null
        "${stage_dir}/codex-responses-api-proxy" --help >/dev/null
        for binary in codex codex-code-mode-host codex-responses-api-proxy; do
          (cd "${stage_dir}" && sha256sum "${binary}") > "../dist/${archive_base}.${binary}.sha256"
        done

        tar -C "${stage_dir}" -czf "../dist/${archive_base}.tar.gz" .
        (cd ../dist && sha256sum "${archive_base}.tar.gz") > "../dist/${archive_base}.tar.gz.sha256"

        ARCHIVE_BASE="${archive_base}" python3 - <<'PY' > "../dist/${archive_base}.json"
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess
        import sys

        archive = Path("../dist") / f"{os.environ['ARCHIVE_BASE']}.tar.gz"
        binaries = {}
        for name in ("codex", "codex-code-mode-host", "codex-responses-api-proxy"):
            binary = Path(os.environ["RUNNER_TEMP"]) / "sedna-branch/aarch64-unknown-linux-gnu" / name
            binaries[name] = hashlib.sha256(binary.read_bytes()).hexdigest()
        payload = {
            "repository": os.environ["GITHUB_REPOSITORY"],
            "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "workflowCommit": subprocess.check_output(
                ["git", "-C", "../.workflow-src", "rev-parse", "HEAD"], text=True
            ).strip(),
          "previewVersion": os.environ["CODEX_RELEASE_VERSION"],
            "target": "aarch64-unknown-linux-gnu",
            "binaries": binaries,
            "archiveSha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
            "workflow": (
                f'{os.environ["GITHUB_SERVER_URL"]}/'
                f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
            ),
        }
        json.dump(payload, sys.stdout, indent=2)
        sys.stdout.write("\n")
        PY

  consume-linux-pair:
    name: Consume packaged ${{ matrix.target }} preview
    needs:
      - metadata
      - build-linux-x86_64
      - build-linux-aarch64
    if: ${{ !inputs.prepare_lock_only && inputs.platform == 'linux-pair' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out trusted package verifier
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .workflow-src

      - name: Download exact architecture artifact from this run
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}-${{ matrix.target }}
          path: ${{ runner.temp }}/sedna-preview-artifact

      - name: Verify packaged identity and included tools
        id: package_consumer
        continue-on-error: true
        working-directory: .workflow-src
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/sedna-preview-artifact
          EXPECTED_SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ needs.metadata.outputs.workflow_sha }}
          EXPECTED_PREVIEW_VERSION: ${{ needs.metadata.outputs.preview_version }}
          EXPECTED_TARGET: ${{ matrix.target }}
          RESULT_PATH: ${{ runner.temp }}/sedna-package-consumer-result.json
        run: python3 .github/scripts/verify_sedna_branch_package.py

      - name: Upload sanitized package-consumer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}-consumer-${{ matrix.target }}
          path: ${{ runner.temp }}/sedna-package-consumer-result.json
          if-no-files-found: error
          retention-days: 3

      - name: Preserve failed package-consumer result
        if: ${{ steps.package_consumer.outcome == 'failure' }}
        shell: bash
        run: exit 1

  build-macos:
    name: Build macOS preview - x86_64-apple-darwin
    needs: metadata
    if: ${{ !inputs.prepare_lock_only && inputs.platform == 'macos' }}
    runs-on: macos-15-intel
    timeout-minutes: 210
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
      SCCACHE_CACHE_SIZE: 2G
      CODEX_RELEASE_REPOSITORY: ${{ github.repository }}
      CODEX_RELEASE_TAG_PREFIX: v
      CODEX_RELEASE_VERSION: ${{ needs.metadata.outputs.preview_version }}
      DISPLAY_REF: ${{ needs.metadata.outputs.display_ref }}
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require the selected workflow ref for macOS previews
        if: ${{ inputs.ref != '' }}
        shell: bash
        run: |
          echo "macOS preview builds use the workflow's selected ref; leave the ref input empty." >&2
          exit 1

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-apple-darwin

      - name: Compute Rust cache keys
        id: lockhash
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(shasum -a 256 Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(shasum -a 256 rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/.rusty_v8/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: sedna-preview-cargo-home-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            sedna-preview-cargo-home-macos-15-intel-x86_64-apple-darwin-

      - name: Install sccache
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: sccache

      - name: Configure sccache backend
        id: sccache_backend
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/configure_sccache_backend.sh write-fallback

      - name: Enable sccache wrapper
        if: ${{ steps.sccache_backend.outputs.backend != 'off' }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(command -v sccache)"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Restore sccache cache
        if: ${{ steps.sccache_backend.outputs.backend == 'fallback' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sedna-preview-sccache-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}
          restore-keys: |
            sedna-preview-sccache-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-
            sedna-preview-sccache-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-apple-darwin

      - name: Build macOS preview binaries
        id: build_macos
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --target "${TARGET}" \
            --release \
            --bin codex \
            --bin codex-code-mode-host \
            --bin codex-responses-api-proxy

      - name: Stage ad hoc signed macOS preview artifact
        shell: bash
        run: |
          set -euo pipefail

          stage_dir="${RUNNER_TEMP}/sedna-branch/${TARGET}"
          dist_dir="${GITHUB_WORKSPACE}/dist"
          file_version="${CODEX_RELEASE_VERSION//+/__}"
          archive_base="codex-sedna-preview-${file_version}-${TARGET}"
          binaries=(codex codex-code-mode-host codex-responses-api-proxy)

          rm -rf "${stage_dir}"
          mkdir -p "${stage_dir}" "${dist_dir}"

          for binary in "${binaries[@]}"; do
            source_path="target/${TARGET}/release/${binary}"
            staged_path="${stage_dir}/${binary}"
            entitlements="${GITHUB_WORKSPACE}/.github/scripts/macos-signing/${binary}.entitlements.plist"
            install -m 0755 "${source_path}" "${staged_path}"
            "${GITHUB_WORKSPACE}/.github/scripts/macos-signing/sign_macos_code.sh" \
              --target "${staged_path}" \
              --identity - \
              --deep false \
              --identifier "${binary}" \
              --options runtime \
              --timestamp none \
              --entitlements "${entitlements}"
            codesign --verify --strict --verbose=2 "${staged_path}"
          done

          "${stage_dir}/codex" --version
          tar -C "${stage_dir}" -czf "${dist_dir}/${archive_base}.tar.gz" .

          python3 - <<'PY' > "${dist_dir}/${archive_base}.json"
          import json
          import os
          import subprocess
          import sys

          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "ref": os.environ["DISPLAY_REF"],
              "previewVersion": os.environ["CODEX_RELEASE_VERSION"],
              "target": os.environ["TARGET"],
              "signing": "ad-hoc",
              "notarized": False,
              "workflow": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/'
                  f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
              ),
          }
          json.dump(payload, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PY

          (
            cd "${dist_dir}"
            shasum -a 256 ./* > SHA256SUMS.txt
          )

      - name: Upload macOS preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}-x86_64-apple-darwin
          path: dist/*
          if-no-files-found: error
          retention-days: 3

      - name: Report sccache statistics
        if: ${{ always() && steps.sccache_backend.outputs.backend != 'off' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### sccache stats — x86_64-apple-darwin (release)"
            echo
            echo '```text'
            sccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Cargo home cache
        if: ${{ always() && !cancelled() && steps.build_macos.outcome == 'success' && steps.cache_cargo_home_restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/.rusty_v8/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: sedna-preview-cargo-home-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache
        if: ${{ always() && !cancelled() && steps.build_macos.outcome == 'success' && steps.sccache_backend.outputs.backend == 'fallback' && steps.sccache_backend.outputs.policy == 'write-fallback' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sedna-preview-sccache-macos-15-intel-x86_64-apple-darwin-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}
