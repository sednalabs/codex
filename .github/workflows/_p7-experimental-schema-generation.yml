name: _p7-experimental-schema-generation

on:
  push:
    branches:
      - repair/w14079-p7-schema-generation

permissions:
  contents: read

jobs:
  generate:
    name: Generate experimental app-server exports
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE_REF: 0b346684bc3ea12952ad89eef87afae0e6f0afe2
      BASE_REF: 0d0f73e7fd44ec0d5bc2dc0ba5625a8559ed8a9c
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact source and base inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$BASE_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_REF"
          git cat-file -e "$BASE_REF^{commit}"
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
      - name: Install just
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: just
      - name: Generate experimental schema fixture
        shell: bash
        run: |
          set -euo pipefail
          schema_root="$RUNNER_TEMP/app-server-schema"
          just write-app-server-schema --experimental --schema-root "$schema_root"
          test -f "$schema_root/precomputed/app-server-exports-experimental.json.zst"
          test "$(git status --porcelain=v1)" = ""
      - name: Collect generated artifact
        shell: bash
        run: |
          set -euo pipefail
          schema_root="$RUNNER_TEMP/app-server-schema"
          artifact_root="$RUNNER_TEMP/p7-experimental-schema-artifact"
          rm -rf "$artifact_root"
          mkdir -p "$artifact_root"
          cp "$schema_root/precomputed/app-server-exports-experimental.json.zst" "$artifact_root/"
          {
            printf 'repository=%s\n' "$(git remote get-url origin)"
            printf 'generator_head=%s\n' "$(git rev-parse HEAD)"
            printf 'source_candidate=%s\n' "$CANDIDATE_REF"
            printf 'base=%s\n' "$(git rev-parse "$BASE_REF^{commit}")"
            printf 'command=just write-app-server-schema --experimental --schema-root $RUNNER_TEMP/app-server-schema\n'
            printf 'path=codex-rs/app-server-protocol/schema/precomputed/app-server-exports-experimental.json.zst\n'
          } > "$artifact_root/manifest.txt"
      - name: Upload generated experimental fixture
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: p7-experimental-app-server-schema-${{ env.CANDIDATE_REF }}
          path: ${{ runner.temp }}/p7-experimental-schema-artifact
          if-no-files-found: error
