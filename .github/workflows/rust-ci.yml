name: PR965 rustfmt output

on:
  workflow_dispatch:
    inputs:
      expected_workflow_host_sha:
        description: Must match this dispatch ref's workflow-host commit SHA.
        required: true
        type: string

permissions:
  contents: read

jobs:
  rustfmt_output:
    name: Capture exact rustfmt output
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: bed5b976ca87b7e2a8e0f52962e5b50ba0cbb771
      SOURCE_TREE: 9f9ef4965630eae5145fa348c05831d6ccd45ad4
      SOURCE_BASE_SHA: 3af175593417f9a41b8615d4da0ff4c5d39539c4
      VALIDATION_REF: refs/heads/validation/pr965-rustfmt-output-bed5b976
    steps:
      - name: Validate workflow host and initialize output envelope
        id: host_binding
        shell: bash
        env:
          EXPECTED_WORKFLOW_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -uo pipefail
          output="$RUNNER_TEMP/rustfmt-output"
          mkdir -p "$output"
          trap 'status=$?; printf "host_binding_exit=%s\n" "$status" >> "$output/identity.txt"' EXIT
          allowed_repo_paths=(
            codex-rs/app-server/tests/suite/v2/multi_agent_v2_developer_instructions.rs
            codex-rs/code-mode-host/src/grpc/robustness_tests.rs
            codex-rs/code-mode-runtime/src/v8_init.rs
            codex-rs/core/src/session/tests.rs
            codex-rs/core/tests/suite/mcp_tool_cache.rs
            codex-rs/core/tests/suite/rmcp_client.rs
            codex-rs/core/tests/suite/subagent_notifications.rs
            codex-rs/ext/queue/tests/queue_service.rs
            codex-rs/linux-sandbox/tests/suite/managed_proxy.rs
            codex-rs/rollout/src/writer_lock.rs
            codex-rs/rollout/src/writer_lock_tests.rs
            codex-rs/state/src/runtime.rs
            codex-rs/state/src/sqlite/validation_tests.rs
            codex-rs/tui/src/app/daemon_menu_tests.rs
            codex-rs/tui/src/app/empty_state_animation_tests.rs
            codex-rs/tui/src/app/tests.rs
            codex-rs/tui/src/app/tests/active_reconnect_tests.rs
            codex-rs/tui/src/app/tests/realtime_requests.rs
            codex-rs/tui/src/history_cell/tests.rs
            codex-rs/tui/src/status/tests.rs
            codex-rs/tui/src/update_prompt.rs
          )
          printf '%s\n' "${allowed_repo_paths[@]}" | LC_ALL=C sort > "$output/allowed-paths.txt"
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'workflow_host_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow_host_ref=%s\n' "$GITHUB_REF"
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'source_tree=%s\n' "$SOURCE_TREE"
            printf 'format_path_base_sha=%s\n' "$SOURCE_BASE_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'run_url=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$output/identity.txt"
          set -e
          test "$GITHUB_REPOSITORY" = "sednalabs/codex"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "$VALIDATION_REF"
          [[ "$EXPECTED_WORKFLOW_HOST_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_WORKFLOW_HOST_SHA" = "$GITHUB_SHA"

      - name: Checkout exact source
        id: checkout
        if: ${{ steps.host_binding.outcome == 'success' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: sednalabs/codex
          ref: bed5b976ca87b7e2a8e0f52962e5b50ba0cbb771
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity
        id: source_identity
        if: ${{ steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rustfmt-output"
          trap 'status=$?; printf "source_identity_exit=%s\n" "$status" >> "$output/identity.txt"' EXIT
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$SOURCE_SHA"
          test "$actual_tree" = "$SOURCE_TREE"
          printf 'source_identity_match=true\n' >> "$output/identity.txt"

      - name: Require pristine source checkout
        id: pre_transform_clean
        if: ${{ steps.source_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rustfmt-output"
          trap 'status=$?; printf "pre_transform_clean_exit=%s\n" "$status" >> "$output/identity.txt"' EXIT
          worktree_clean=true
          index_clean=true
          untracked_clean=true
          git diff --quiet -- || worktree_clean=false
          git diff --cached --quiet -- || index_clean=false
          if [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            untracked_clean=false
          fi
          {
            printf 'pre_transform_worktree_clean=%s\n' "$worktree_clean"
            printf 'pre_transform_index_clean=%s\n' "$index_clean"
            printf 'pre_transform_untracked_clean=%s\n' "$untracked_clean"
          } >> "$output/identity.txt"
          if [[ "$worktree_clean" != true || "$index_clean" != true || "$untracked_clean" != true ]]; then
            printf 'pre_transform_clean_error=non-pristine-source-checkout\n' >> "$output/identity.txt"
            exit 1
          fi

      - name: Set up pinned Rust formatter
        id: rust_toolchain
        if: ${{ steps.pre_transform_clean.outcome == 'success' }}
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - name: Format exact changed Rust paths
        id: transform
        if: ${{ steps.rust_toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rustfmt-output"
          trap 'status=$?; printf "rustfmt_step_exit=%s\n" "$status" >> "$output/identity.txt"' EXIT
          printf 'rustc_version=%s\n' "$(rustc --version)" >> "$output/identity.txt"
          printf 'rustfmt_version=%s\n' "$(rustfmt --version)" >> "$output/identity.txt"

          mapfile -t allowed_repo_paths < "$output/allowed-paths.txt"
          rust_paths=()
          for path in "${allowed_repo_paths[@]}"; do
            [[ "$path" == codex-rs/* ]] || exit 1
            rust_paths+=("${path#codex-rs/}")
          done

          {
            printf 'rustfmt_command=rustfmt --edition 2024 --config-path rustfmt.toml --config imports_granularity=Item,skip_children=true'
            printf ' %s' "${rust_paths[@]}"
            printf '\n'
          } >> "$output/identity.txt"

          run_checked() {
            local label="$1"
            shift
            set +e
            "$@"
            local status=$?
            set -e
            printf '%s_exit=%s\n' "$label" "$status" >> "$output/identity.txt"
            return "$status"
          }

          cd "$GITHUB_WORKSPACE/codex-rs"
          run_checked rustfmt rustfmt --edition 2024 --config-path rustfmt.toml --config imports_granularity=Item,skip_children=true "${rust_paths[@]}" >/dev/null 2>&1

          declare -A allowed_paths=()
          for path in "${allowed_repo_paths[@]}"; do
            allowed_paths["$path"]=1
          done
          check_post_transform_state() {
            local staged_clean=true
            local untracked_clean=true
            git -C "$GITHUB_WORKSPACE" diff --cached --quiet -- || staged_clean=false
            if [[ -n "$(git -C "$GITHUB_WORKSPACE" ls-files --others --exclude-standard)" ]]; then
              untracked_clean=false
            fi
            printf 'post_transform_index_clean=%s\n' "$staged_clean" >> "$output/identity.txt"
            printf 'post_transform_untracked_clean=%s\n' "$untracked_clean" >> "$output/identity.txt"
            if [[ "$staged_clean" != true || "$untracked_clean" != true ]]; then
              printf 'post_transform_clean_error=staged-or-untracked-output\n' >> "$output/identity.txt"
              return 1
            fi
            return 0
          }
          check_output_scope() {
            local path
            local changed_paths
            local filtered_paths=()
            local unexpected_path_present=false
            changed_paths="$(git -C "$GITHUB_WORKSPACE" diff HEAD --name-only)"
            if [[ -z "$changed_paths" ]]; then
              : > "$output/changed-paths.txt"
            else
              while IFS= read -r path; do
                [[ -n "$path" ]] || continue
                if [[ -z "${allowed_paths[$path]+present}" ]]; then
                  unexpected_path_present=true
                else
                  filtered_paths+=("$path")
                fi
              done <<< "$changed_paths"
              if (( ${#filtered_paths[@]} )); then
                printf '%s\n' "${filtered_paths[@]}" > "$output/changed-paths.txt"
              else
                : > "$output/changed-paths.txt"
              fi
            fi
            printf 'unexpected_tracked_path_present=%s\n' "$unexpected_path_present" >> "$output/identity.txt"
            if [[ "$unexpected_path_present" == true ]]; then
              printf 'output_scope_error=unexpected-path\n' >> "$output/identity.txt"
              return 1
            fi
            git -C "$GITHUB_WORKSPACE" diff --binary HEAD -- "${allowed_repo_paths[@]}" > "$output/rustfmt.patch"
            return 0
          }

          run_checked post_transform_clean check_post_transform_state
          run_checked output_scope check_output_scope
          printf 'output_scope_check_exit=0\n' >> "$output/identity.txt"
          run_checked diff_check git -C "$GITHUB_WORKSPACE" diff --check >/dev/null 2>&1

      - name: Finalize exact output envelope
        if: always()
        shell: bash
        env:
          HOST_BINDING_OUTCOME: ${{ steps.host_binding.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SOURCE_IDENTITY_OUTCOME: ${{ steps.source_identity.outcome }}
          PRE_TRANSFORM_CLEAN_OUTCOME: ${{ steps.pre_transform_clean.outcome }}
          RUST_TOOLCHAIN_OUTCOME: ${{ steps.rust_toolchain.outcome }}
          TRANSFORM_OUTCOME: ${{ steps.transform.outcome }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rustfmt-output"
          finalizer_failed=false
          {
            printf 'host_binding_outcome=%s\n' "$HOST_BINDING_OUTCOME"
            printf 'checkout_outcome=%s\n' "$CHECKOUT_OUTCOME"
            printf 'source_identity_outcome=%s\n' "$SOURCE_IDENTITY_OUTCOME"
            printf 'pre_transform_clean_outcome=%s\n' "$PRE_TRANSFORM_CLEAN_OUTCOME"
            printf 'rust_toolchain_outcome=%s\n' "$RUST_TOOLCHAIN_OUTCOME"
            printf 'transform_outcome=%s\n' "$TRANSFORM_OUTCOME"
          } >> "$output/identity.txt"
          if [[ "$CHECKOUT_OUTCOME" == success && "$SOURCE_IDENTITY_OUTCOME" == success && "$PRE_TRANSFORM_CLEAN_OUTCOME" == success ]] && git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            mapfile -t allowed_repo_paths < "$output/allowed-paths.txt"
            declare -A allowed_paths=()
            for path in "${allowed_repo_paths[@]}"; do
              allowed_paths["$path"]=1
            done
            finalizer_index_clean=true
            finalizer_untracked_clean=true
            git -C "$GITHUB_WORKSPACE" diff --cached --quiet -- || finalizer_index_clean=false
            if [[ -n "$(git -C "$GITHUB_WORKSPACE" ls-files --others --exclude-standard)" ]]; then
              finalizer_untracked_clean=false
            fi
            {
              printf 'finalizer_post_transform_index_clean=%s\n' "$finalizer_index_clean"
              printf 'finalizer_post_transform_untracked_clean=%s\n' "$finalizer_untracked_clean"
            } >> "$output/identity.txt"
            if [[ "$finalizer_index_clean" != true || "$finalizer_untracked_clean" != true ]]; then
              printf 'finalizer_post_transform_clean_error=staged-or-untracked-output\n' >> "$output/identity.txt"
              finalizer_failed=true
            fi
            filtered_paths=()
            unexpected_path_present=false
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              if [[ -n "${allowed_paths[$path]+present}" ]]; then
                filtered_paths+=("$path")
              else
                unexpected_path_present=true
              fi
            done < <(git -C "$GITHUB_WORKSPACE" diff HEAD --name-only)
            if (( ${#filtered_paths[@]} )); then
              printf '%s\n' "${filtered_paths[@]}" > "$output/changed-paths.txt"
            else
              : > "$output/changed-paths.txt"
            fi
            printf 'finalizer_unexpected_tracked_path_present=%s\n' "$unexpected_path_present" >> "$output/identity.txt"
            if [[ "$unexpected_path_present" == true ]]; then
              printf 'finalizer_output_scope_error=unexpected-path\n' >> "$output/identity.txt"
              finalizer_failed=true
            fi
            git -C "$GITHUB_WORKSPACE" diff --binary HEAD -- "${allowed_repo_paths[@]}" > "$output/rustfmt.patch"
          fi
          if [[ "$finalizer_failed" == true ]]; then
            exit 1
          fi

      - name: Upload exact rustfmt output
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr965-rustfmt-output-${{ github.run_id }}
          path: ${{ runner.temp }}/rustfmt-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
