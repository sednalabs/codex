name: Native rollout writer Clippy validation

on:
  workflow_dispatch:
    inputs:
      expected_workflow_host_sha:
        description: Exact host SHA for this temporary Clippy validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollout-clippy:
    name: Clippy for the exact native rollout writer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TARGET_DIR: ${{ runner.temp }}/rollout-clippy-target
      CODEX_REPO_ROOT: ${{ github.workspace }}/source
    steps:
      - name: Verify workflow-host identity and dispatch binding
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          [[ "${#EXPECTED_HOST_SHA}" -eq 40 ]]
          [[ "$EXPECTED_HOST_SHA" != *[^0-9a-f]* ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_HOST_SHA" ]]
          [[ "$GITHUB_REPOSITORY" == "sednalabs/codex" ]]
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/validation/pr965-rollout-clippy-f382816a" ]]

      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: sednalabs/codex
          ref: f382816a2071467b5a79108b46fd8d0b44a8b0a7
          path: source
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source identity and initialize bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "f382816a2071467b5a79108b46fd8d0b44a8b0a7" ]]
          [[ "$(git -C source rev-parse 'HEAD^{tree}')" == "eeee27d8a5039d22213a71049e3c5d58cd8d9e9e" ]]
          [[ "$(git -C source rev-parse HEAD^)" == "2bc2447f9f40036dd65c28b5777728fb593f458a" ]]
          output="$RUNNER_TEMP/rollout-clippy-evidence"
          mkdir -p "$output"
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'source_sha=%s\n' "$(git -C source rev-parse HEAD)"
            printf 'source_tree=%s\n' "$(git -C source rev-parse 'HEAD^{tree}')"
            printf 'source_parent=%s\n' "$(git -C source rev-parse HEAD^)"
            printf 'workflow_host_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow_host_ref=%s\n' "$GITHUB_REF"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'run_url=%s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$output/identity.txt"
          printf 'clippy_status=not_run\n' > "$output/status.txt"

      - name: Set up pinned Rust and Clippy
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Run the fixed affected Clippy command
        working-directory: source/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rollout-clippy-evidence"
          {
            printf 'rustc=%s\n' "$(rustc --version)"
            printf 'cargo=%s\n' "$(cargo --version)"
            printf 'clippy=%s\n' "$(cargo clippy --version)"
          } > "$output/tool-versions.txt"
          printf '%s\n' 'cargo clippy --locked -p codex-rollout --lib --tests --all-features --target x86_64-unknown-linux-gnu --profile dev -- -D warnings' > "$output/command.txt"
          printf 'clippy_status=in_progress\n' > "$output/status.txt"
          set +e
          cargo clippy --locked -p codex-rollout --lib --tests --all-features --target x86_64-unknown-linux-gnu --profile dev -- -D warnings
          result=$?
          set -e
          {
            printf 'clippy_exit_code=%s\n' "$result"
            if [[ "$result" -eq 0 ]]; then
              printf 'clippy_status=success\n'
            else
              printf 'clippy_status=failure\n'
            fi
          } > "$output/status.txt"
          exit "$result"

      - name: Upload bounded Clippy evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rollout-clippy-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/rollout-clippy-evidence/
          if-no-files-found: error
          retention-days: 1
