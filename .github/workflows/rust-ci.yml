name: PR965 Rust format output

on:
  workflow_dispatch:
    inputs:
      expected_workflow_host_sha:
        description: Must match this dispatch's workflow-host commit SHA.
        required: true
        type: string

permissions:
  contents: read

jobs:
  format_output:
    name: Format exact retained failure paths
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: dc42bf2724a10f2408e77b22e4f65ec867e715a8
      SOURCE_TREE: e5b0e32bbb73fb32558f37a031d0583e54f8f89e
      VALIDATION_REF: refs/heads/validation/pr965-rustfmt-output-dc42bf
    steps:
      - name: Validate workflow-host identity and dispatch binding
        shell: bash
        env:
          EXPECTED_WORKFLOW_HOST_SHA: ${{ github.event.inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "sednalabs/codex"
          test "$GITHUB_REF" = "$VALIDATION_REF"
          [[ "$EXPECTED_WORKFLOW_HOST_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_WORKFLOW_HOST_SHA" = "$GITHUB_SHA"

      - name: Checkout exact formatter source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: sednalabs/codex
          ref: dc42bf2724a10f2408e77b22e4f65ec867e715a8
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git -C source rev-parse HEAD)"
          actual_tree="$(git -C source rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$SOURCE_SHA"
          test "$actual_tree" = "$SOURCE_TREE"

      - name: Set up pinned Rust formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - name: Format only the eight retained paths and emit patch
        shell: bash
        run: |
          set -euo pipefail
          cd source/codex-rs
          rustc --version
          rustfmt --version
          rustfmt --config skip_children=true \
            core/src/config/config_tests.rs \
            core/src/session/turn.rs \
            core/tests/suite/token_usage_rollout.rs \
            state/src/runtime/usage.rs \
            tui/src/app/tests/session_lifecycle_requests.rs \
            tui/src/chatwidget/tests/status_and_layout.rs \
            tui/src/lib.rs \
            utils/pty/src/unix_io.rs

          output="$RUNNER_TEMP/pr965-rustfmt-output"
          mkdir -p "$output"
          expected_paths="$(printf '%s\n' \
            codex-rs/core/src/config/config_tests.rs \
            codex-rs/core/src/session/turn.rs \
            codex-rs/core/tests/suite/token_usage_rollout.rs \
            codex-rs/state/src/runtime/usage.rs \
            codex-rs/tui/src/app/tests/session_lifecycle_requests.rs \
            codex-rs/tui/src/chatwidget/tests/status_and_layout.rs \
            codex-rs/tui/src/lib.rs \
            codex-rs/utils/pty/src/unix_io.rs)"
          changed_paths="$(git -C "$GITHUB_WORKSPACE/source" diff --name-only)"
          test "$changed_paths" = "$expected_paths"
          printf '%s\n' "$changed_paths" > "$output/changed-paths.txt"
          git -C "$GITHUB_WORKSPACE/source" diff --binary > "$output/rustfmt.patch"
          test -s "$output/rustfmt.patch"
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'source_tree=%s\n' "$SOURCE_TREE"
            printf 'workflow_host_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow_host_ref=%s\n' "$GITHUB_REF"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'run_url=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'rustc=%s\n' "$(rustc --version)"
            printf 'rustfmt=%s\n' "$(rustfmt --version)"
          } > "$output/identity.txt"

      - name: Upload exact formatter output
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr965-rustfmt-output-${{ github.run_id }}
          path: ${{ runner.temp }}/pr965-rustfmt-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
