name: PR965 Ruff format output

on:
  workflow_dispatch:
    inputs:
      expected_workflow_host_sha:
        description: Exact host SHA for this temporary formatter job
        required: true
        type: string

permissions:
  contents: read

jobs:
  format-output:
    name: Ruff formatting output for two retained files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: sednalabs/codex
          ref: c0f7fce70b15f195d05830e47a36a876380102ce
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify host and source identities
        shell: bash
        env:
          EXPECTED_HOST_SHA: ${{ inputs.expected_workflow_host_sha }}
        run: |
          set -euo pipefail
          [[ "${#EXPECTED_HOST_SHA}" -eq 40 ]]
          [[ "$EXPECTED_HOST_SHA" != *[^0-9a-f]* ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_HOST_SHA" ]]
          [[ "$GITHUB_REPOSITORY" == "sednalabs/codex" ]]
          [[ "$GITHUB_REF" == "refs/heads/validation/pr965-ruff-output-c0f7fc" ]]
          [[ "$(git -C source rev-parse HEAD)" == "c0f7fce70b15f195d05830e47a36a876380102ce" ]]
          [[ "$(git -C source rev-parse 'HEAD^{tree}')" == "ad18781a5c4d4b8df31d2d88a6e312a1d3f7a149" ]]

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.3"

      - name: Format only the two reported Python files
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ruff_version="$(uv run --frozen --project scripts ruff --version)"
          [[ "$ruff_version" == "ruff 0.15.13" ]]
          uv run --frozen --project scripts ruff format \
            .github/scripts/classify_ci_paths.py \
            .github/scripts/verify_native_visual_response_contract.py

          expected_paths=$(printf '%s\n' \
            .github/scripts/classify_ci_paths.py \
            .github/scripts/verify_native_visual_response_contract.py)
          changed_paths="$(git diff --name-only)"
          [[ "$changed_paths" == "$expected_paths" ]]

          artifact_dir="$RUNNER_TEMP/pr965-ruff-output"
          mkdir -p "$artifact_dir"
          git diff --binary > "$artifact_dir/ruff.patch"
          printf '%s\n' "$changed_paths" > "$artifact_dir/changed-paths.txt"
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'source_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'workflow_host_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow_host_ref=%s\n' "$GITHUB_REF"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'run_url=%s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'python=%s\n' "$(python --version)"
            printf 'uv=%s\n' "$(uv --version)"
            printf 'ruff=%s\n' "$ruff_version"
          } > "$artifact_dir/identity.txt"

      - name: Upload exact formatter output
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr965-ruff-output-${{ github.run_id }}
          path: ${{ runner.temp }}/pr965-ruff-output/
          if-no-files-found: error
          retention-days: 1
