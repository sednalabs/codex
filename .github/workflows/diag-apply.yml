name: Apply bounded diagnostic patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.head_ref == 'diag/goal-error-continuation-probe-20260821' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: diag/goal-error-continuation-probe-20260821
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          if [[ ! -f .github/scripts/diag_apply.py ]]; then
            echo "patch script not present yet"
            exit 0
          fi
          python3 .github/scripts/diag_apply.py
          cargo fmt --all --manifest-path codex-rs/Cargo.toml

      - name: Commit patch
        shell: bash
        run: |
          if [[ ! -f codex-rs/core/src/diagnostic_flags.rs ]]; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/core/src/lib.rs \
                  codex-rs/core/src/diagnostic_flags.rs \
                  codex-rs/core/src/session/turn.rs \
                  codex-rs/ext/goal/src/extension.rs \
                  codex-rs/ext/goal/src/runtime.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: add goal continuation diagnostic mode"
          git push origin HEAD:diag/goal-error-continuation-probe-20260821
