name: cancel-pr-runs

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    name: Cancel active runs for closed PR
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale runs for the closed PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const activeStatuses = ['queued', 'in_progress', 'requested', 'waiting', 'pending', 'action_required'];
            const pullRequest = context.payload.pull_request;
            const prNumber = pullRequest.number;
            const headBranch = pullRequest.head.ref;
            const headSha = pullRequest.head.sha;
            const baseBranch = pullRequest.base.ref;
            const currentRepo = `${owner}/${repo}`;
            const headRepo = pullRequest.head.repo.full_name;
            const protectedBranches = new Set(['main', 'upstream-main', baseBranch].filter(Boolean));
            const mayCancelHeadPushRuns = headRepo === currentRepo && !protectedBranches.has(headBranch);
            const candidates = [];
            for (const status of activeStatuses) {
              candidates.push(...await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, event: 'pull_request', status, per_page: 100 }));
              if (mayCancelHeadPushRuns) {
                candidates.push(...await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, branch: headBranch, event: 'push', status, per_page: 100 }));
              }
            }
            const seenRunIds = new Set();
            const runsToCancel = candidates.filter((run) => {
              if (seenRunIds.has(run.id)) return false;
              seenRunIds.add(run.id);
              const matchesPullRequest = run.event === 'pull_request' && Array.isArray(run.pull_requests) && run.pull_requests.some((pr) => pr.number === prNumber);
              const matchesBranchPush = mayCancelHeadPushRuns && run.event === 'push' && run.head_branch === headBranch && run.head_sha === headSha;
              return matchesPullRequest || matchesBranchPush;
            });
            for (const run of runsToCancel) {
              try { await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id }); }
              catch (error) { core.warning(`Failed to cancel run ${run.id}: ${error.message}`); }
            }
            core.info(`Post-merge push runs on ${baseBranch} are intentionally left running as the authoritative branch proof.`);
