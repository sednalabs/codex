name: "CodeQL Advanced"

on:
  push:
    branches: ["main", "upstream-main"]
  pull_request:
    branches: ["main", "upstream-main", "integration/**"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "21 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Queue attempts, post-merge pushes, scheduled scans, and manual dispatches
# must not share a key. Only a superseded PR head is safe to cancel.
concurrency:
  group: >-
    concurrency-group::${{ github.workflow }}::${{
      github.event_name == 'merge_group' &&
      format('merge-group-{0}', github.sha) ||
      github.event_name == 'pull_request' &&
      format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'push' &&
      format('push-{0}', github.sha) ||
      format('{0}-{1}', github.event_name, github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: CodeQL language planner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      run_analysis: ${{ steps.plan.outputs.run_analysis }}
      selected_languages: ${{ steps.plan.outputs.selected_languages }}
    steps:
      - name: Checkout PR head for path classification
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select CodeQL languages
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          emit_matrix() {
            local languages_json="$1"
            LANGUAGES_JSON="${languages_json}" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          languages = json.loads(os.environ["LANGUAGES_JSON"])
          configs = {
              "actions": ("none", "./.codeql-runtime/codeql-actions.yml"),
              "c-cpp": ("none", "./.github/codeql/codeql-config.yml"),
              "javascript-typescript": ("none", "./.github/codeql/codeql-config.yml"),
              "python": ("none", "./.github/codeql/codeql-config.yml"),
          }
          include = []
          for language in languages:
              if language == "rust":
                  # Rust's built-in security-and-quality suite has one summary
                  # query whose evaluation can dominate the standard runner's
                  # six-hour job limit. Keep the complete suite, but evaluate
                  # disjoint, collectively exhaustive source scopes in separate
                  # databases so no one query sees the monolithic workspace.
                  for scope in (
                      "codex-rs-core",
                      "codex-rs-tui",
                      "codex-rs-services",
                      "codex-rs-rest-a",
                      "codex-rs-rest-b",
                      "codex-rs-rest-c",
                      "codex-rs-rest-d",
                      "tools",
                  ):
                      include.append(
                          {
                              "language": language,
                              "build-mode": "none",
                              "config_file": f"./.codeql-runtime/codeql-rust-{scope}.yml",
                              "scope": scope,
                          }
                      )
              else:
                  include.append(
                      {
                          "language": language,
                          "build-mode": configs[language][0],
                          "config_file": configs[language][1],
                          "scope": "",
                      }
                  )
          if not include:
              # Keep the matrix structurally non-empty even though the analyze
              # job is disabled by run_analysis. This avoids empty-matrix edge
              # cases in GitHub's job expansion.
              include.append(
                  {
                      "language": "not-applicable",
                      "build-mode": "none",
                      "config_file": "./.github/codeql/codeql-config.yml",
                      "scope": "",
                  }
              )
          matrix = {"include": include}
          print(f"matrix={json.dumps(matrix, separators=(',', ':'))}")
          print(f"run_analysis={'true' if languages else 'false'}")
          print(f"selected_languages={','.join(languages) if languages else 'none'}")
          PY
          }

          full_languages='["actions","c-cpp","javascript-typescript","python","rust"]'

          # Scheduled scans, pushes, and manual runs keep full repository
          # coverage. Pull requests and merge-queue attempts are path scoped.
          if [[ '${{ github.event_name }}' != 'pull_request' && '${{ github.event_name }}' != 'merge_group' ]]; then
            emit_matrix "${full_languages}"
            exit 0
          fi

          if ! git fetch --no-tags --depth=1 origin "${BASE_SHA}"; then
            echo "::warning title=CodeQL path classification::Unable to fetch PR base; running every CodeQL language."
            emit_matrix "${full_languages}"
            exit 0
          fi

          if ! scope="$(python3 .github/scripts/classify_ci_paths.py --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}")"; then
            echo "::warning title=CodeQL path classification::Unable to classify PR paths; running every CodeQL language."
            emit_matrix "${full_languages}"
            exit 0
          fi

          languages="$(SCOPE_JSON="${scope}" python3 - <<'PY'
          import json
          import os
          print(json.dumps(json.loads(os.environ["SCOPE_JSON"])["codeql_languages"], separators=(",", ":")))
          PY
          )"
          emit_matrix "${languages}"

      - name: Summarize CodeQL scope
        shell: bash
        run: |
          {
            echo "### CodeQL scope"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- selected languages: \`${{ steps.plan.outputs.selected_languages }}\`"
            if [[ '${{ steps.plan.outputs.run_analysis }}' != 'true' ]]; then
              echo "- analysis: skipped because this PR does not change a CodeQL-scanned language surface"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: plan
    if: ${{ needs.plan.outputs.run_analysis == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchains for CodeQL
        if: ${{ matrix.language == 'rust' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          toolchains = {}
          for path in sorted(Path(".").glob("**/rust-toolchain*")):
              text = path.read_text(encoding="utf-8").strip()
              if text.startswith("["):
                  data = tomllib.loads(text)
                  toolchain = data["toolchain"]
                  channel = toolchain["channel"]
              else:
                  channel = text
              toolchains.setdefault(channel, set()).add("rust-src")

          for channel, components in sorted(toolchains.items()):
              command = [
                  "rustup",
                  "toolchain",
                  "install",
                  channel,
                  "--profile",
                  "minimal",
                  "--no-self-update",
              ]
              for component in sorted(components):
                  command.extend(["--component", component])
              subprocess.run(command, check=True)
          PY

      - name: Restore Rust dependency cache for CodeQL
        if: ${{ matrix.language == 'rust' }}
        id: cache_codeql_rust_cargo_home_restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: codeql-rust-cargo-home-v1-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml', 'tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain') }}
          restore-keys: |
            codeql-rust-cargo-home-v1-${{ runner.os }}-

      - name: Record Rust cache telemetry for CodeQL
        if: ${{ matrix.language == 'rust' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### CodeQL Rust cache telemetry"
            echo "- Cargo cache hit: ${{ steps.cache_codeql_rust_cargo_home_restore.outputs.cache-hit || 'false' }}"
            echo "- Cargo cache key: \`codeql-rust-cargo-home-v1-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml', 'tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain') }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prefetch Rust dependencies for CodeQL
        if: ${{ matrix.language == 'rust' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path codex-rs/Cargo.toml
          cargo fetch --locked --manifest-path tools/argument-comment-lint/Cargo.toml

      - name: Prepare scoped Rust CodeQL config
        if: ${{ matrix.language == 'rust' }}
        shell: bash
        env:
          RUST_SCOPE: ${{ matrix.scope }}
          RUST_CONFIG: ${{ matrix.config_file }}
        run: |
          set -euo pipefail
          case "${RUST_SCOPE}" in
            codex-rs-core)
              scope_paths=(codex-rs/core)
              scope_ignores=()
              ;;
            codex-rs-tui)
              scope_paths=(codex-rs/tui)
              scope_ignores=()
              ;;
            codex-rs-services)
              scope_paths=(
                codex-rs/app-server
                codex-rs/app-server-client
                codex-rs/app-server-daemon
                codex-rs/app-server-protocol
                codex-rs/app-server-test-client
                codex-rs/app-server-transport
                codex-rs/bwrap
                codex-rs/exec
                codex-rs/exec-server
                codex-rs/file-watcher
                codex-rs/http-client
                codex-rs/linux-sandbox
                codex-rs/network-proxy
                codex-rs/process-hardening
                codex-rs/sandboxing
                codex-rs/shell-command
                codex-rs/shell-escalation
                codex-rs/terminal-detection
                codex-rs/windows-sandbox-rs
              )
              scope_ignores=()
              ;;
            codex-rs-rest-a)
              scope_paths=(
                codex-rs/.cargo codex-rs/analytics codex-rs/arg0 codex-rs/browser-computer-use
                codex-rs/cloud-tasks codex-rs/code-mode-host codex-rs/codex-client
                codex-rs/collaboration-mode-templates codex-rs/core-api codex-rs/exec-server-protocol
                codex-rs/features codex-rs/git-utils codex-rs/lmstudio codex-rs/message-history
                codex-rs/ollama codex-rs/protocol codex-rs/rmcp-client codex-rs/secrets
                codex-rs/test-binary-support codex-rs/utils
              )
              scope_ignores=()
              ;;
            codex-rs-rest-b)
              scope_paths=(
                codex-rs/.config codex-rs/android-computer-use codex-rs/async-utils codex-rs/chatgpt
                codex-rs/cloud-tasks-client codex-rs/code-mode-protocol codex-rs/codex-experimental-api-macros
                codex-rs/config codex-rs/core-plugins codex-rs/execpolicy codex-rs/feedback codex-rs/hooks
                codex-rs/login codex-rs/model-provider codex-rs/otel codex-rs/realtime-webrtc codex-rs/rollout
                codex-rs/skills codex-rs/thread-manager-sample codex-rs/v8-poc
              )
              scope_ignores=()
              ;;
            codex-rs-rest-c)
              scope_paths=(
                codex-rs/agent-graph-store codex-rs/ansi-escape codex-rs/aws-auth codex-rs/cli
                codex-rs/cloud-tasks-mock-client codex-rs/codex-api codex-rs/codex-home codex-rs/connectors
                codex-rs/core-skills codex-rs/ext codex-rs/file-search codex-rs/install-context codex-rs/mcp-server
                codex-rs/model-provider-info codex-rs/plugin codex-rs/response-debug-context codex-rs/rollout-trace
                codex-rs/state codex-rs/thread-store codex-rs/vendor
              )
              scope_ignores=()
              ;;
            codex-rs-rest-d)
              scope_paths=(
                codex-rs/agent-identity codex-rs/apply-patch codex-rs/backend-client codex-rs/cloud-config
                codex-rs/code-mode codex-rs/codex-backend-openapi-models codex-rs/codex-mcp
                codex-rs/context-fragments codex-rs/docs codex-rs/external-agent-migration codex-rs/file-system
                codex-rs/keyring-store codex-rs/memories codex-rs/models-manager codex-rs/prompts
                codex-rs/responses-api-proxy codex-rs/scripts codex-rs/stdio-to-uds codex-rs/uds
                codex-rs/tools codex-rs/websocket-client
              )
              scope_ignores=()
              ;;
            tools)
              scope_paths=(tools)
              scope_ignores=()
              ;;
            *)
              echo "Unsupported Rust CodeQL scope: ${RUST_SCOPE}" >&2
              exit 1
              ;;
          esac
          mkdir -p "$(dirname "${RUST_CONFIG}")"
          {
            cat <<EOF
          name: codex-codeql-rust-${RUST_SCOPE}
          queries:
            - uses: security-and-quality
          paths:
          EOF
            printf '  - %s\n' "${scope_paths[@]}"
            cat <<'EOF'
          paths-ignore:
            - .github/codeql/rust-computer-use-contract/test/**
          EOF
            if ((${#scope_ignores[@]})); then
              printf '  - %s\n' "${scope_ignores[@]}"
            fi
            cat <<'EOF'
          threat-models: local
          EOF
          } > "${RUST_CONFIG}"

      - name: Prepare Actions CodeQL query pack config
        if: ${{ matrix.language == 'actions' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .codeql-runtime
          pack_path="./.github/codeql/actions-workflow-security"

          if [[ '${{ github.event_name }}' == 'pull_request' &&
            '${{ github.event.pull_request.head.repo.full_name }}' != '${{ github.repository }}' ]]; then
            trusted_root="${GITHUB_WORKSPACE}/.codeql-runtime/trusted-base"
            trusted_pack="./.codeql-runtime/trusted-base/.github/codeql/actions-workflow-security"
            mkdir -p "${trusted_root}"

            if git fetch --no-tags --depth=1 origin '${{ github.event.pull_request.base.sha }}' &&
              git archive '${{ github.event.pull_request.base.sha }}' .github/codeql/actions-workflow-security |
                tar -x -C "${trusted_root}"; then
              pack_path="${trusted_pack}"
            else
              echo "::warning title=CodeQL Actions query pack bootstrap::Trusted base query pack was unavailable; using the checked-out pack for this run."
            fi
          fi

          {
            echo "name: codex-codeql-actions-runtime"
            echo
            echo "queries:"
            echo "  - uses: security-and-quality"
            echo "  - uses: ${pack_path}"
            echo
            echo "threat-models: local"
          } > .codeql-runtime/codeql-actions.yml

      - name: Record CodeQL analysis resources
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### CodeQL analysis resources"
            echo "- language: \`${{ matrix.language }}\`"
            echo "- scope: \`${{ matrix.scope || 'all' }}\`"
            echo "- runner OS/arch: \`${RUNNER_OS}/${RUNNER_ARCH}\`"
            echo "- CPUs: \`$(nproc)\`"
            echo "- memory: \`$(awk '/MemTotal:/ {print $2 " kB"}' /proc/meminfo)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ matrix.config_file }}
          dependency-caching: ${{ github.event_name == 'pull_request' && 'restore' || 'full' }}

      # The compare API truncates at 300 files, so codeql-action cannot build
      # complete diff ranges for large upstream-sync pull requests by itself.
      - name: Restore complete CodeQL diff ranges for large pull requests
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files >= 300 }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          python3 .github/scripts/prepare_codeql_diff_ranges.py \
            --base "${BASE_SHA}" \
            --head "${GITHUB_SHA}" \
            > "${RUNNER_TEMP}/pr-diff-range.json"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: ${{ matrix.scope != '' && format('/language:{0}/{1}', matrix.language, matrix.scope) || format('/language:{0}', matrix.language) }}

      - name: Save Rust dependency cache for CodeQL
        if: ${{ always() && !cancelled() && matrix.language == 'rust' && steps.cache_codeql_rust_cargo_home_restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/upstream-main') }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: codeql-rust-cargo-home-v1-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml', 'tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain') }}

  results:
    name: CodeQL required gate
    needs:
      - plan
      - analyze
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Report CodeQL timing
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "### CodeQL timing" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            --jq '.jobs[]
              | select(.name | test("^(CodeQL language planner|Analyze \\(|CodeQL required gate)"))
              | "- \(.name): \(.status)/\(.conclusion // "") started=\(.started_at) completed=\(.completed_at // "")"' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          RUN_ANALYSIS: ${{ needs.plan.outputs.run_analysis }}
        run: |
          set -euo pipefail

          echo "plan    : ${PLAN_RESULT}"
          echo "analyze : ${ANALYZE_RESULT}"

          [[ "${PLAN_RESULT}" == "success" ]] || {
            echo 'CodeQL planner failed.' >&2
            exit 1
          }

          if [[ "${RUN_ANALYSIS}" == "true" ]]; then
            [[ "${ANALYZE_RESULT}" == "success" ]] || {
              echo 'Selected CodeQL analysis failed.' >&2
              exit 1
            }
          else
            [[ "${ANALYZE_RESULT}" == "skipped" ]] || {
              echo "CodeQL analysis was not selected but concluded unexpectedly: ${ANALYZE_RESULT}" >&2
              exit 1
            }
            echo 'No CodeQL language analysis was applicable to this PR.'
          fi
