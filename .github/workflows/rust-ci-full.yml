name: rust-ci-full
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-rmcp:
    name: w14235 PR901 recovery and consumer proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@v4
        with:
          repository: sednalabs/codex
          ref: 23215cb0ddeb7f56817713407df73ade2e897594
          fetch-depth: 1
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: PR901 recovery and cancellation tests
        run: |
          cd codex-rs
          cargo test --locked -p codex-rmcp-client --test streamable_http_recovery
          cargo test --locked -p codex-rmcp-client --test streamable_http_cancellation
      - name: Focused rmcp consumer checks
        run: bash .github/scripts/validation-lanes/rmcp-consumers-check.sh
