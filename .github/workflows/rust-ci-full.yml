name: rust-ci-full
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-rmcp:
    name: w14235 focused rmcp cancellation proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@v4
        with:
          repository: sednalabs/codex
          ref: a2923ddf09894266443a6e4d17a15b5f2e7c938d
          fetch-depth: 1
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: PR901 cancellation and recovery integration tests
        working-directory: codex-rs
        run: cargo test --locked -p codex-rmcp-client --test streamable_http_cancellation --test streamable_http_recovery
      - name: Focused rmcp consumer checks
        run: bash .github/scripts/validation-lanes/rmcp-consumers-check.sh
