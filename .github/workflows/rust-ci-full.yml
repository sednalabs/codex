name: rust-ci-full

on:
  workflow_call:
    inputs:
      include_windows:
        description: Run Windows matrix jobs
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      include_windows:
        description: Run Windows matrix jobs
        required: false
        type: boolean
        default: true

jobs:
  voice-cargo-linux:
    name: Voice Cargo routing — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 7a3d77474c9db4d26eb3cf6c146b99431c5c5d76
          persist-credentials: false
      - name: Record harness and product identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7a3d77474c9db4d26eb3cf6c146b99431c5c5d76
          echo "product_sha=$(git rev-parse HEAD)"
          echo "harness_sha=${GITHUB_SHA}"
      - uses: ./.github/actions/setup-ci
      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libcap-dev
      - name: Prepare pinned voice SDK for direct Cargo
        uses: ./.github/actions/setup-voice-cargo
        with:
          target: ${{ matrix.target }}
          cache-scope: rust-ci-full-voice-cargo-smoke
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Verify voice and system pkg-config routing
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          voice_pcdir="$(PKG_CONFIG_PATH="$RUNNER_TEMP/fake-pkgconfig" "$PKG_CONFIG" --variable=pcfiledir gstreamer-1.0)"
          case "$voice_pcdir" in
            "$PKG_CONFIG_LIBDIR"|"$PKG_CONFIG_LIBDIR"/*) ;;
            *) echo "voice module escaped SDK pkg-config directory: $voice_pcdir" >&2; exit 1 ;;
          esac
          "$PKG_CONFIG" --libs --cflags alsa
          "$PKG_CONFIG" --libs libcap
          mkdir -p "$RUNNER_TEMP/fake-pkgconfig"
          cat > "$RUNNER_TEMP/fake-pkgconfig/gstreamer-1.0.pc" <<'EOF'
          Name: hostile-fake-gstreamer
          Description: hostile fallback fixture
          Version: 0.0.0
          Libs: -lfake-gstreamer
          Cflags: -Ifake-gstreamer
          EOF
          voice_pcdir="$(PKG_CONFIG_PATH="$RUNNER_TEMP/fake-pkgconfig" "$PKG_CONFIG" --variable=pcfiledir gstreamer-1.0)"
          case "$voice_pcdir" in
            "$PKG_CONFIG_LIBDIR"|"$PKG_CONFIG_LIBDIR"/*) ;;
            *) echo "voice module used ambient fallback: $voice_pcdir" >&2; exit 1 ;;
          esac
      - name: Cargo-check focused voice consumers
        working-directory: codex-rs
        run: cargo check -p codex-voice-host -p codex-bwrap --target "${{ matrix.target }}"

  voice-cargo-macos:
    name: Voice Cargo routing — macOS
    runs-on: macos-15
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 7a3d77474c9db4d26eb3cf6c146b99431c5c5d76
          persist-credentials: false
      - name: Record harness and product identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7a3d77474c9db4d26eb3cf6c146b99431c5c5d76
          echo "product_sha=$(git rev-parse HEAD)"
          echo "harness_sha=${GITHUB_SHA}"
      - uses: ./.github/actions/setup-ci
      - name: Prepare pinned voice SDK for direct Cargo
        uses: ./.github/actions/setup-voice-cargo
        with:
          target: aarch64-apple-darwin
          cache-scope: rust-ci-full-voice-cargo-smoke
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin
      - name: Verify pinned voice pkg-config routing
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          voice_pcdir="$(PKG_CONFIG_PATH="$RUNNER_TEMP/fake-pkgconfig" "$PKG_CONFIG" --variable=pcfiledir gstreamer-1.0)"
          case "$voice_pcdir" in
            "$PKG_CONFIG_LIBDIR"|"$PKG_CONFIG_LIBDIR"/*) ;;
            *) echo "voice module escaped SDK pkg-config directory: $voice_pcdir" >&2; exit 1 ;;
          esac
      - name: Cargo-check focused voice consumer
        working-directory: codex-rs
        run: cargo check -p codex-voice-host --target aarch64-apple-darwin
