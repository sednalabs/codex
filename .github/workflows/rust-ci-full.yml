name: rust-ci-full
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-rmcp:
    name: w14235 focused rmcp consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@v4
        with:
          repository: sednalabs/codex
          ref: c8ab746b72c411d908705fb7c73c9297ebf08c6b
          fetch-depth: 1
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Focused recovery baseline
        working-directory: codex-rs
        run: cargo test --locked -p codex-rmcp-client --test streamable_http_recovery
