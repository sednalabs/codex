name: Apply admitted upstream SDK cohort

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  apply-sdk-cohort:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted helper candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: helper-checkout

      - name: Check out frozen source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5eb6ca6519b1a79e8997bf21321885de1fd9ed01
          fetch-depth: 1
          persist-credentials: false
          path: source-candidate

      - name: Verify source candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "${GITHUB_WORKSPACE}/source-candidate" rev-parse HEAD)" = 5eb6ca6519b1a79e8997bf21321885de1fd9ed01
          test "$(git -C "${GITHUB_WORKSPACE}/source-candidate" rev-parse HEAD^{tree})" = 7a4e9d32c7a13a22215335a850cf879e284fdc63

      - name: Download exact accepted source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-composition-34035744523-1
          github-token: ${{ github.token }}
          repository: sednalabs/codex
          run-id: 34035744523
          path: ${{ runner.temp }}/w13825-source-artifact

      - name: Apply SDK cohort and emit candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/w13825-sdk-candidate"
          python3 "${GITHUB_WORKSPACE}/helper-checkout/.github/scripts/apply-upstream-cohort.py" \
            --repo-root "${GITHUB_WORKSPACE}/source-candidate" \
            --artifact-dir "${RUNNER_TEMP}/w13825-source-artifact" \
            --output-dir "${RUNNER_TEMP}/w13825-sdk-candidate"

      - name: Upload successful candidate evidence (no push)
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: upstream-sdk-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w13825-sdk-candidate
          if-no-files-found: error
