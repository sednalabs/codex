name: Inspect accepted SDK and build-source composition

on:
  push:
    branches:
      - worker/w13825-sdk-build-consumer
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Exact reviewed consumer workflow commit
        required: true
        type: string
      expected_workflow_tree:
        description: Exact reviewed consumer workflow tree
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  composition-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REQUESTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha || '' }}
      REQUESTED_WORKFLOW_TREE: ${{ inputs.expected_workflow_tree || '' }}
      SDK_ARTIFACT_ID: "9992014028"
      SDK_ARTIFACT_NAME: upstream-sdk-candidate-34042133059-1
      SDK_ARTIFACT_SIZE: "451611604"
      SDK_ARTIFACT_DIGEST: sha256:bce7300bd77efe798a463d8006b4291049bfaff5b996c878853ebab95087d433
      SDK_ARTIFACT_RUN_ID: "34042133059"
      SDK_ARTIFACT_HEAD_SHA: 0384d8ae9205e142fa4b352256d8c85a9e05f8c4
      SDK_ARTIFACT_HEAD_BRANCH: worker/w13825-sdk-producer-validation-20260907
      BUILD_SOURCE_SHA: 54bcd76de2c0c30d655c99faf2e2c9cab271e18b
      BUILD_SOURCE_TREE: 6adcbddd3dde655a77a385fc75d5af9d39f90802
      BUILD_SOURCE_BRANCH: worker/w13825-build-source-authoring-20260907
    steps:
      - name: Check out exact reviewed metadata helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: helper-checkout

      - name: Verify run event and exact helper checkout
        shell: bash
        run: |
          set -euo pipefail
          helper="${GITHUB_WORKSPACE}/helper-checkout/.github/scripts/apply-upstream-cohort.py"
          workflow_sha="$(git -C "${GITHUB_WORKSPACE}/helper-checkout" rev-parse HEAD)"
          workflow_tree="$(git -C "${GITHUB_WORKSPACE}/helper-checkout" rev-parse HEAD^{tree})"
          test "${GITHUB_SHA}" = "${workflow_sha}"
          test -z "$(git -C "${GITHUB_WORKSPACE}/helper-checkout" status --porcelain)"
          python3 "${helper}" \
            --validate-runtime-only \
            --expected-workflow-sha "${workflow_sha}" \
            --expected-workflow-tree "${workflow_tree}" >/dev/null
          {
            printf 'EXPECTED_WORKFLOW_SHA=%s\n' "${workflow_sha}"
            printf 'EXPECTED_WORKFLOW_TREE=%s\n' "${workflow_tree}"
          } >>"${GITHUB_ENV}"

      - name: Verify exact accepted SDK artifact provider identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packet="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SDK_ARTIFACT_ID}" \
              --jq '[.id, .name, .size_in_bytes, .expired, .digest, .workflow_run.id, .workflow_run.head_branch, .workflow_run.head_sha, .workflow_run.repository_id, .workflow_run.head_repository_id] | @tsv'
          )"
          IFS=$'\t' read -r artifact_id artifact_name artifact_size expired artifact_digest run_id head_branch head_sha repository_id head_repository_id <<<"${packet}"
          test "${artifact_id}" = "${SDK_ARTIFACT_ID}"
          test "${artifact_name}" = "${SDK_ARTIFACT_NAME}"
          test "${artifact_size}" = "${SDK_ARTIFACT_SIZE}"
          test "${expired}" = false
          test "${artifact_digest}" = "${SDK_ARTIFACT_DIGEST}"
          test "${run_id}" = "${SDK_ARTIFACT_RUN_ID}"
          test "${head_branch}" = "${SDK_ARTIFACT_HEAD_BRANCH}"
          test "${head_sha}" = "${SDK_ARTIFACT_HEAD_SHA}"
          test "${repository_id}" = "${GITHUB_REPOSITORY_ID}"
          test "${head_repository_id}" = "${GITHUB_REPOSITORY_ID}"

      - name: Check out exact reviewed build source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 54bcd76de2c0c30d655c99faf2e2c9cab271e18b
          fetch-depth: 0
          persist-credentials: false
          path: source-candidate

      - name: Verify exact reviewed build-source checkout
        shell: bash
        run: |
          set -euo pipefail
          source_root="${GITHUB_WORKSPACE}/source-candidate"
          test "${BUILD_SOURCE_SHA}" = "$(git -C "${source_root}" rev-parse HEAD)"
          test "${BUILD_SOURCE_TREE}" = "$(git -C "${source_root}" rev-parse HEAD^{tree})"
          test "5eb6ca6519b1a79e8997bf21321885de1fd9ed01" = "$(git -C "${source_root}" show -s --format=%P HEAD)"
          test -z "$(git -C "${source_root}" status --porcelain)"
          remote_source="$({ git -C "${source_root}" ls-remote --heads origin "refs/heads/${BUILD_SOURCE_BRANCH}"; } | awk '{print $1}')"
          test "${remote_source}" = "${BUILD_SOURCE_SHA}"

      - name: Download exact accepted SDK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 9992014028
          github-token: ${{ github.token }}
          repository: sednalabs/codex
          run-id: 34042133059
          path: ${{ runner.temp }}/w13825-sdk-input
          merge-multiple: true

      - name: Emit complete content-free composition metadata
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/w13825-composition-metadata"
          receipt="$(
            python3 "${GITHUB_WORKSPACE}/helper-checkout/.github/scripts/apply-upstream-cohort.py" \
              --metadata-manifest-only \
              --repo-root "${GITHUB_WORKSPACE}/source-candidate" \
              --artifact-dir "${RUNNER_TEMP}/w13825-sdk-input" \
              --output-dir "${output_dir}" \
              --expected-workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
              --expected-workflow-tree "${EXPECTED_WORKFLOW_TREE}"
          )"
          manifest="${output_dir}/composition-tree-manifest.json"
          test -f "${manifest}"
          test "$(find "${output_dir}" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(jq -r '.schema' "${manifest}")" = sdk-build-content-free-tree-manifest
          test "$(jq -r '.status' "${manifest}")" = complete
          manifest_sha256="$(sha256sum "${manifest}" | awk '{print $1}')"
          manifest_size="$(stat -c '%s' "${manifest}")"
          test "${manifest_sha256}" = "$(jq -r '.manifest_sha256' <<<"${receipt}")"
          test "${manifest_size}" = "$(jq -r '.manifest_size_bytes | tostring' <<<"${receipt}")"
          test "${manifest_size}" -gt 0
          test "${manifest_size}" -le 16777216
          {
            printf 'file_sha256=%s\n' "${manifest_sha256}"
            printf 'file_size_bytes=%s\n' "${manifest_size}"
            printf 'manifest_identity_sha256=%s\n' "$(jq -r '.manifest_identity_sha256' <<<"${receipt}")"
          } >>"${GITHUB_OUTPUT}"
          printf 'CONTENT_FREE_TREE_MANIFEST=%s\n' "${receipt}"

      - name: Upload complete content-free composition metadata
        id: upload-metadata
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: upstream-composition-tree-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w13825-composition-metadata/composition-tree-manifest.json
          if-no-files-found: error
          compression-level: 9

      - name: Record exact uploaded metadata identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload-metadata.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-metadata.outputs.artifact-digest }}
          FILE_SHA256: ${{ steps.manifest.outputs.file_sha256 }}
          FILE_SIZE_BYTES: ${{ steps.manifest.outputs.file_size_bytes }}
          MANIFEST_IDENTITY_SHA256: ${{ steps.manifest.outputs.manifest_identity_sha256 }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[0-9]+$ ]]
          [[ "${ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${FILE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${FILE_SIZE_BYTES}" =~ ^[1-9][0-9]*$ ]]
          [[ "${MANIFEST_IDENTITY_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          jq -cn \
            --arg artifact_id "${ARTIFACT_ID}" \
            --arg artifact_digest "${ARTIFACT_DIGEST}" \
            --arg file_sha256 "${FILE_SHA256}" \
            --argjson file_size_bytes "${FILE_SIZE_BYTES}" \
            --arg manifest_identity_sha256 "${MANIFEST_IDENTITY_SHA256}" \
            '{schema:"sdk-build-content-free-tree-manifest-artifact",version:1,status:"uploaded",artifact_id:$artifact_id,artifact_digest:$artifact_digest,file_sha256:$file_sha256,file_size_bytes:$file_size_bytes,manifest_identity_sha256:$manifest_identity_sha256}' \
            | sed 's/^/CONTENT_FREE_TREE_ARTIFACT=/'
