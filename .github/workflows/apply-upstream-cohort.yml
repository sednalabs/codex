name: Apply admitted upstream SDK cohort

on:
  push:
    branches:
      - worker/w13825-sdk-producer-validation-20260907
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Exact reviewed producer workflow commit
        required: true
        type: string
      expected_workflow_tree:
        description: Exact reviewed producer workflow tree
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  apply-sdk-cohort:
    runs-on: ubuntu-latest
    env:
      REQUESTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha || '' }}
      REQUESTED_WORKFLOW_TREE: ${{ inputs.expected_workflow_tree || '' }}
      SDK_SOURCE_SHA: bc8884624330b6e681cfa3ce5fc575ce8298ed1b
      SDK_SOURCE_TREE: 1e143e2bc5964a4308d9a6f36ca3e2af028e79e9
      SDK_SOURCE_BRANCH: worker/w13825-sdk-source-authoring-20260906
    steps:
      - name: Check out exact reviewed helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: helper-checkout

      - name: Verify run event and exact helper checkout
        shell: bash
        run: |
          set -euo pipefail
          helper="${GITHUB_WORKSPACE}/helper-checkout/.github/scripts/apply-upstream-cohort.py"
          workflow_sha="$(git -C "${GITHUB_WORKSPACE}/helper-checkout" rev-parse HEAD)"
          workflow_tree="$(git -C "${GITHUB_WORKSPACE}/helper-checkout" rev-parse HEAD^{tree})"
          test "${GITHUB_SHA}" = "${workflow_sha}"
          test -z "$(git -C "${GITHUB_WORKSPACE}/helper-checkout" status --porcelain)"
          python3 "${helper}" \
            --validate-runtime-only \
            --expected-workflow-sha "${workflow_sha}" \
            --expected-workflow-tree "${workflow_tree}"
          {
            printf 'EXPECTED_WORKFLOW_SHA=%s\n' "${workflow_sha}"
            printf 'EXPECTED_WORKFLOW_TREE=%s\n' "${workflow_tree}"
          } >>"${GITHUB_ENV}"

      - name: Check out exact SDK source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bc8884624330b6e681cfa3ce5fc575ce8298ed1b
          fetch-depth: 2
          persist-credentials: false
          path: source-candidate

      - name: Verify exact SDK source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${SDK_SOURCE_SHA}" = "$(git -C "${GITHUB_WORKSPACE}/source-candidate" rev-parse HEAD)"
          test "${SDK_SOURCE_TREE}" = "$(git -C "${GITHUB_WORKSPACE}/source-candidate" rev-parse HEAD^{tree})"
          test "5eb6ca6519b1a79e8997bf21321885de1fd9ed01" = "$(git -C "${GITHUB_WORKSPACE}/source-candidate" show -s --format=%P HEAD)"
          test -z "$(git -C "${GITHUB_WORKSPACE}/source-candidate" status --porcelain)"
          remote_source="$({ git -C "${GITHUB_WORKSPACE}/source-candidate" ls-remote --heads origin "refs/heads/${SDK_SOURCE_BRANCH}"; } | awk '{print $1}')"
          test "${remote_source}" = "${SDK_SOURCE_SHA}"

      - name: Prove fail-closed event and input boundary
        shell: bash
        run: |
          set -euo pipefail
          helper="${GITHUB_WORKSPACE}/helper-checkout/.github/scripts/apply-upstream-cohort.py"
          expect_failure() {
            expected="$1"
            shift
            set +e
            output="$("$@" 2>&1)"
            status=$?
            set -e
            test "${status}" -ne 0
            grep -F -- "${expected}" <<<"${output}" >/dev/null
          }
          runtime_args=(
            python3 "${helper}"
            --validate-runtime-only
            --expected-workflow-sha "${EXPECTED_WORKFLOW_SHA}"
            --expected-workflow-tree "${EXPECTED_WORKFLOW_TREE}"
          )
          validation_ref=refs/heads/worker/w13825-sdk-producer-validation-20260907
          fixture_dir="${RUNNER_TEMP}/producer-event-fixtures"
          mkdir "${fixture_dir}"
          python3 - "${fixture_dir}" "${EXPECTED_WORKFLOW_SHA}" "${EXPECTED_WORKFLOW_TREE}" <<'PY'
          import copy
          import json
          import sys
          from pathlib import Path

          target = Path(sys.argv[1])
          workflow_sha = sys.argv[2]
          workflow_tree = sys.argv[3]
          push = {
              "ref": "refs/heads/worker/w13825-sdk-producer-validation-20260907",
              "before": "204fc215e54cba1fa409176d251423b1e31fa652",
              "after": workflow_sha,
              "created": False,
              "deleted": False,
              "forced": False,
              "head_commit": {"id": workflow_sha},
              "repository": {"full_name": "sednalabs/codex"},
          }
          fixtures = {"push-valid": push}
          mutations = {
              "push-wrong-repository": ("repository", {"full_name": "wrong/repository"}),
              "push-wrong-ref": ("ref", "refs/heads/main"),
              "push-wrong-before": ("before", "0" * 40),
              "push-wrong-after": ("after", "0" * 40),
              "push-forced": ("forced", True),
              "push-deleted": ("deleted", True),
              "push-created": ("created", True),
          }
          for name, (key, value) in mutations.items():
              fixture = copy.deepcopy(push)
              fixture[key] = value
              fixtures[name] = fixture
          dispatch = {
              "inputs": {
                  "expected_workflow_sha": workflow_sha,
                  "expected_workflow_tree": workflow_tree,
              },
              "repository": {"full_name": "sednalabs/codex"},
          }
          fixtures["dispatch-valid"] = dispatch
          dispatch_wrong_sha = copy.deepcopy(dispatch)
          dispatch_wrong_sha["inputs"]["expected_workflow_sha"] = "0" * 40
          fixtures["dispatch-wrong-sha"] = dispatch_wrong_sha
          for name, value in fixtures.items():
              (target / f"{name}.json").write_text(json.dumps(value) + "\n", encoding="utf-8")
          PY
          run_push_fixture() {
            env \
              GITHUB_EVENT_NAME=push \
              GITHUB_REF="${validation_ref}" \
              GITHUB_REPOSITORY=sednalabs/codex \
              GITHUB_SHA="${EXPECTED_WORKFLOW_SHA}" \
              GITHUB_EVENT_PATH="$1" \
              REQUESTED_WORKFLOW_SHA= \
              REQUESTED_WORKFLOW_TREE= \
              "${runtime_args[@]}"
          }
          run_dispatch_fixture() {
            env \
              GITHUB_EVENT_NAME=workflow_dispatch \
              GITHUB_REF="${validation_ref}" \
              GITHUB_REPOSITORY=sednalabs/codex \
              GITHUB_SHA="${EXPECTED_WORKFLOW_SHA}" \
              GITHUB_EVENT_PATH="$1" \
              REQUESTED_WORKFLOW_SHA="$2" \
              REQUESTED_WORKFLOW_TREE="${EXPECTED_WORKFLOW_TREE}" \
              "${runtime_args[@]}"
          }
          expect_failure "current repository mismatch" \
            env GITHUB_REPOSITORY=wrong/repository "${runtime_args[@]}"
          expect_failure "current event mismatch" \
            env GITHUB_EVENT_NAME=pull_request "${runtime_args[@]}"
          expect_failure "current ref mismatch" \
            env GITHUB_REF=refs/heads/main "${runtime_args[@]}"
          expect_failure "event repository mismatch" \
            run_push_fixture "${fixture_dir}/push-wrong-repository.json"
          expect_failure "push event ref mismatch" \
            run_push_fixture "${fixture_dir}/push-wrong-ref.json"
          expect_failure "push predecessor mismatch" \
            run_push_fixture "${fixture_dir}/push-wrong-before.json"
          expect_failure "push target mismatch" \
            run_push_fixture "${fixture_dir}/push-wrong-after.json"
          expect_failure "push event must not be forced" \
            run_push_fixture "${fixture_dir}/push-forced.json"
          expect_failure "push event must not delete ref" \
            run_push_fixture "${fixture_dir}/push-deleted.json"
          expect_failure "push event must update the existing ref" \
            run_push_fixture "${fixture_dir}/push-created.json"
          run_dispatch_fixture \
            "${fixture_dir}/dispatch-valid.json" \
            "${EXPECTED_WORKFLOW_SHA}" >/dev/null
          expect_failure "workflow dispatch SHA does not match run checkout" \
            run_dispatch_fixture \
              "${fixture_dir}/dispatch-wrong-sha.json" \
              0000000000000000000000000000000000000000
          expect_failure "repo-root must be absolute" \
            python3 "${helper}" \
              --repo-root source-candidate \
              --artifact-dir "${RUNNER_TEMP}/not-present" \
              --output-dir "${RUNNER_TEMP}/not-created" \
              --expected-workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
              --expected-workflow-tree "${EXPECTED_WORKFLOW_TREE}"

          extra_source="${RUNNER_TEMP}/extra-source"
          git clone --shared --no-checkout "${GITHUB_WORKSPACE}/source-candidate" "${extra_source}"
          git -C "${extra_source}" checkout --detach "${SDK_SOURCE_SHA}"
          git -C "${extra_source}" config user.name github-actions-for-negative-control
          git -C "${extra_source}" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          printf '\nnegative-control-only\n' >>"${extra_source}/.github/pull_request_template.md"
          git -C "${extra_source}" add .github/pull_request_template.md
          git -C "${extra_source}" commit -m "negative control: reject extra source path"
          empty_artifact="${RUNNER_TEMP}/empty-source-artifact"
          mkdir "${empty_artifact}"
          expect_failure "SDK source head mismatch" \
            python3 "${helper}" \
              --repo-root "${extra_source}" \
              --artifact-dir "${empty_artifact}" \
              --output-dir "${RUNNER_TEMP}/not-created" \
              --expected-workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
              --expected-workflow-tree "${EXPECTED_WORKFLOW_TREE}"

          test -z "$(grep -nE 'patch_base64|disposition_json|git[[:space:]]+apply' "${helper}" || true)"

      - name: Download exact accepted source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-composition-34035744523-1
          github-token: ${{ github.token }}
          repository: sednalabs/codex
          run-id: 34035744523
          path: ${{ runner.temp }}/w13825-source-artifact

      - name: Prove fail-closed evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          helper="${GITHUB_WORKSPACE}/helper-checkout/.github/scripts/apply-upstream-cohort.py"
          source_artifact="${RUNNER_TEMP}/w13825-source-artifact"
          make_fixture() {
            fixture="$1"
            mkdir "${fixture}"
            for source_path in "${source_artifact}"/*; do
              ln -s "${source_path}" "${fixture}/$(basename "${source_path}")"
            done
          }
          expect_failure() {
            expected="$1"
            shift
            set +e
            output="$("$@" 2>&1)"
            status=$?
            set -e
            test "${status}" -ne 0
            grep -F -- "${expected}" <<<"${output}" >/dev/null
          }

          staged_fixture="${RUNNER_TEMP}/tampered-staged"
          make_fixture "${staged_fixture}"
          rm "${staged_fixture}/staged-auto-merge.txt"
          cp "${source_artifact}/staged-auto-merge.txt" "${staged_fixture}/staged-auto-merge.txt"
          printf '\n' >>"${staged_fixture}/staged-auto-merge.txt"
          expect_failure "staged path-list digest mismatch" \
            python3 "${helper}" \
              --repo-root "${GITHUB_WORKSPACE}/source-candidate" \
              --artifact-dir "${staged_fixture}" \
              --output-dir "${RUNNER_TEMP}/tampered-staged-output" \
              --expected-workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
              --expected-workflow-tree "${EXPECTED_WORKFLOW_TREE}"

          provenance_fixture="${RUNNER_TEMP}/tampered-provenance"
          make_fixture "${provenance_fixture}"
          rm "${provenance_fixture}/provenance.json"
          python3 - "${source_artifact}/provenance.json" "${provenance_fixture}/provenance.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          value = json.loads(source.read_text(encoding="utf-8"))
          value["materialized_tree"] = "0" * 40
          target.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          expect_failure "source provenance digest mismatch" \
            python3 "${helper}" \
              --repo-root "${GITHUB_WORKSPACE}/source-candidate" \
              --artifact-dir "${provenance_fixture}" \
              --output-dir "${RUNNER_TEMP}/tampered-provenance-output" \
              --expected-workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
              --expected-workflow-tree "${EXPECTED_WORKFLOW_TREE}"

      - name: Apply SDK cohort and emit candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/helper-checkout/.github/scripts/apply-upstream-cohort.py" \
            --repo-root "${GITHUB_WORKSPACE}/source-candidate" \
            --artifact-dir "${RUNNER_TEMP}/w13825-source-artifact" \
            --output-dir "${RUNNER_TEMP}/w13825-sdk-candidate" \
            --expected-workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
            --expected-workflow-tree "${EXPECTED_WORKFLOW_TREE}"

      - name: Upload successful candidate evidence (no push)
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: upstream-sdk-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w13825-sdk-candidate
          if-no-files-found: error
