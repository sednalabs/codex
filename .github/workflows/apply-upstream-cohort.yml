name: Apply admitted upstream cohort

on:
  workflow_dispatch:
    inputs:
      cohort:
        description: Exact manifest cohort name
        required: true
        type: string
      disposition_json:
        description: Full data-only disposition receipt (base/upstream/manual/delete for every cohort path)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact frozen base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5eb6ca6519b1a79e8997bf21321885de1fd9ed01
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5eb6ca6519b1a79e8997bf21321885de1fd9ed01
          test "$(git rev-parse HEAD^{tree})" = 7a4e9d32c7a13a22215335a850cf879e284fdc63

      - name: Download exact accepted source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-composition-34035744523-1
          github-token: ${{ github.token }}
          repository: sednalabs/codex
          run-id: 34035744523
          path: source-artifact

      - name: Materialize disposition receipt
        shell: bash
        env:
          DISPOSITION_JSON: ${{ inputs.disposition_json }}
          COHORT: ${{ inputs.cohort }}
        run: |
          set -euo pipefail
          test -n "${DISPOSITION_JSON}"
          python3 - <<'PY'
          import json, os, pathlib
          value = json.loads(os.environ["DISPOSITION_JSON"])
          if not isinstance(value, dict) or value.get("cohort") != os.environ["COHORT"]:
              raise SystemExit("cohort input does not match disposition receipt")
          pathlib.Path("disposition.json").write_text(json.dumps(value, sort_keys=True, indent=2) + "\n")
          PY

      - name: Apply cohort and emit unsigned candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-upstream-cohort.py \
            --artifact-dir source-artifact \
            --disposition disposition.json \
            --output-dir candidate-artifact

      - name: Upload candidate evidence (no push)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: upstream-cohort-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-artifact
          if-no-files-found: error
