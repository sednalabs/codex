name: Build accepted SDK and build-source consumer

on:
  push:
    branches:
      - worker/w13825-sdk-build-consumer
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Exact reviewed consumer workflow commit
        required: true
        type: string
      expected_workflow_tree:
        description: Exact reviewed consumer workflow tree
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build-sdk-build-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REQUESTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha || '' }}
      REQUESTED_WORKFLOW_TREE: ${{ inputs.expected_workflow_tree || '' }}
      SDK_ARTIFACT_ID: "9992014028"
      SDK_ARTIFACT_NAME: upstream-sdk-candidate-34042133059-1
      SDK_ARTIFACT_SIZE: "451611604"
      SDK_ARTIFACT_DIGEST: sha256:bce7300bd77efe798a463d8006b4291049bfaff5b996c878853ebab95087d433
      SDK_ARTIFACT_RUN_ID: "34042133059"
      SDK_ARTIFACT_HEAD_SHA: 0384d8ae9205e142fa4b352256d8c85a9e05f8c4
      SDK_ARTIFACT_HEAD_BRANCH: worker/w13825-sdk-producer-validation-20260907
      BUILD_SOURCE_SHA: b8c1a1a176d30bec1c9265cae3d36c66a5dd3841
      BUILD_SOURCE_TREE: 654403d38b9ef1645ded58aa61d7f7bdff8bb083
      BUILD_SOURCE_BRANCH: worker/w13825-build-source-authoring-20260907
    steps:
      - name: Check out exact reviewed consumer helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: helper-checkout

      - name: Verify run event and exact helper checkout
        shell: bash
        run: |
          set -euo pipefail
          helper="${GITHUB_WORKSPACE}/helper-checkout/.github/scripts/apply-upstream-cohort.py"
          workflow_sha="$(git -C "${GITHUB_WORKSPACE}/helper-checkout" rev-parse HEAD)"
          workflow_tree="$(git -C "${GITHUB_WORKSPACE}/helper-checkout" rev-parse HEAD^{tree})"
          test "${GITHUB_SHA}" = "${workflow_sha}"
          test -z "$(git -C "${GITHUB_WORKSPACE}/helper-checkout" status --porcelain)"
          python3 "${helper}" \
            --validate-runtime-only \
            --expected-workflow-sha "${workflow_sha}" \
            --expected-workflow-tree "${workflow_tree}"
          {
            printf 'EXPECTED_WORKFLOW_SHA=%s\n' "${workflow_sha}"
            printf 'EXPECTED_WORKFLOW_TREE=%s\n' "${workflow_tree}"
          } >>"${GITHUB_ENV}"

      - name: Prove fail-closed event and path boundary
        shell: bash
        run: |
          set -euo pipefail
          helper="${GITHUB_WORKSPACE}/helper-checkout/.github/scripts/apply-upstream-cohort.py"
          expect_failure() {
            expected="$1"
            shift
            set +e
            output="$("$@" 2>&1)"
            status=$?
            set -e
            test "${status}" -ne 0
            grep -F -- "${expected}" <<<"${output}" >/dev/null
          }
          runtime_args=(
            python3 "${helper}"
            --validate-runtime-only
            --expected-workflow-sha "${EXPECTED_WORKFLOW_SHA}"
            --expected-workflow-tree "${EXPECTED_WORKFLOW_TREE}"
          )
          validation_ref=refs/heads/worker/w13825-sdk-build-consumer
          fixture_dir="${RUNNER_TEMP}/consumer-event-fixtures"
          mkdir "${fixture_dir}"
          python3 - "${fixture_dir}" "${EXPECTED_WORKFLOW_SHA}" "${EXPECTED_WORKFLOW_TREE}" <<'PY'
          import copy
          import json
          import sys
          from pathlib import Path

          target = Path(sys.argv[1])
          workflow_sha = sys.argv[2]
          workflow_tree = sys.argv[3]
          push = {
              "ref": "refs/heads/worker/w13825-sdk-build-consumer",
              "before": "d3e8c390c2440fc2feb27780bd7ceaeba66682ca",
              "after": workflow_sha,
              "created": False,
              "deleted": False,
              "forced": False,
              "head_commit": {"id": workflow_sha},
              "repository": {"full_name": "sednalabs/codex"},
          }
          fixtures = {"push-valid": push}
          mutations = {
              "push-wrong-repository": ("repository", {"full_name": "wrong/repository"}),
              "push-wrong-ref": ("ref", "refs/heads/main"),
              "push-wrong-before": ("before", "1" * 40),
              "push-wrong-after": ("after", "0" * 40),
              "push-forced": ("forced", True),
              "push-deleted": ("deleted", True),
              "push-created": ("created", True),
          }
          for name, (key, value) in mutations.items():
              fixture = copy.deepcopy(push)
              fixture[key] = value
              fixtures[name] = fixture
          dispatch = {
              "inputs": {
                  "expected_workflow_sha": workflow_sha,
                  "expected_workflow_tree": workflow_tree,
              },
              "repository": {"full_name": "sednalabs/codex"},
          }
          fixtures["dispatch-valid"] = dispatch
          dispatch_wrong_sha = copy.deepcopy(dispatch)
          dispatch_wrong_sha["inputs"]["expected_workflow_sha"] = "0" * 40
          fixtures["dispatch-wrong-sha"] = dispatch_wrong_sha
          for name, value in fixtures.items():
              (target / f"{name}.json").write_text(json.dumps(value) + "\n", encoding="utf-8")
          PY
          run_push_fixture() {
            env \
              GITHUB_EVENT_NAME=push \
              GITHUB_REF="${validation_ref}" \
              GITHUB_REPOSITORY=sednalabs/codex \
              GITHUB_SHA="${EXPECTED_WORKFLOW_SHA}" \
              GITHUB_EVENT_PATH="$1" \
              REQUESTED_WORKFLOW_SHA= \
              REQUESTED_WORKFLOW_TREE= \
              "${runtime_args[@]}"
          }
          run_dispatch_fixture() {
            env \
              GITHUB_EVENT_NAME=workflow_dispatch \
              GITHUB_REF="${validation_ref}" \
              GITHUB_REPOSITORY=sednalabs/codex \
              GITHUB_SHA="${EXPECTED_WORKFLOW_SHA}" \
              GITHUB_EVENT_PATH="$1" \
              REQUESTED_WORKFLOW_SHA="$2" \
              REQUESTED_WORKFLOW_TREE="${EXPECTED_WORKFLOW_TREE}" \
              "${runtime_args[@]}"
          }
          run_push_fixture "${fixture_dir}/push-valid.json" >/dev/null
          expect_failure "event repository mismatch" \
            run_push_fixture "${fixture_dir}/push-wrong-repository.json"
          expect_failure "push event ref mismatch" \
            run_push_fixture "${fixture_dir}/push-wrong-ref.json"
          expect_failure "push predecessor mismatch" \
            run_push_fixture "${fixture_dir}/push-wrong-before.json"
          expect_failure "push target mismatch" \
            run_push_fixture "${fixture_dir}/push-wrong-after.json"
          expect_failure "push event must not be forced" \
            run_push_fixture "${fixture_dir}/push-forced.json"
          expect_failure "push event must not delete ref" \
            run_push_fixture "${fixture_dir}/push-deleted.json"
          expect_failure "push event must fast-forward the existing consumer ref" \
            run_push_fixture "${fixture_dir}/push-created.json"
          run_dispatch_fixture \
            "${fixture_dir}/dispatch-valid.json" \
            "${EXPECTED_WORKFLOW_SHA}" >/dev/null
          expect_failure "workflow dispatch SHA does not match run checkout" \
            run_dispatch_fixture \
              "${fixture_dir}/dispatch-wrong-sha.json" \
              0000000000000000000000000000000000000000
          expect_failure "repo-root must be absolute" \
            python3 "${helper}" \
              --repo-root source-candidate \
              --artifact-dir "${RUNNER_TEMP}/not-present" \
              --output-dir "${RUNNER_TEMP}/not-created" \
              --expected-workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
              --expected-workflow-tree "${EXPECTED_WORKFLOW_TREE}"
          run_uv_fixture() {
            env \
              GITHUB_EVENT_NAME=push \
              GITHUB_REF="${validation_ref}" \
              GITHUB_REPOSITORY=sednalabs/codex \
              GITHUB_SHA="${EXPECTED_WORKFLOW_SHA}" \
              GITHUB_EVENT_PATH="${fixture_dir}/push-valid.json" \
              REQUESTED_WORKFLOW_SHA= \
              REQUESTED_WORKFLOW_TREE= \
              python3 "${helper}" \
                --validate-uv-identity "$1" \
                --expected-workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
                --expected-workflow-tree "${EXPECTED_WORKFLOW_TREE}"
          }
          plain_uv="$(run_uv_fixture 'uv 0.11.3')"
          test "$(jq -r '.status' <<<"${plain_uv}")" = ready
          test "$(jq -r '.identity.name' <<<"${plain_uv}")" = uv
          test "$(jq -r '.identity.version' <<<"${plain_uv}")" = 0.11.3
          test "$(jq -r '.identity.target' <<<"${plain_uv}")" = null
          suffixed_uv="$(run_uv_fixture 'uv 0.11.3 (x86_64-unknown-linux-gnu)')"
          test "$(jq -r '.status' <<<"${suffixed_uv}")" = ready
          test "$(jq -r '.identity.target' <<<"${suffixed_uv}")" = x86_64-unknown-linux-gnu
          expect_failure "uv:version-mismatch" \
            run_uv_fixture 'uv 0.11.4'
          expect_failure "uv:name-mismatch" \
            run_uv_fixture 'uvx 0.11.3'
          expect_failure "uv:malformed-identity" \
            run_uv_fixture 'uv 0.11.3 x86_64-unknown-linux-gnu'
          structure_fixture="$(
            python3 "${helper}" \
              --validate-manifest-structure-fixtures-only \
              --expected-workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
              --expected-workflow-tree "${EXPECTED_WORKFLOW_TREE}"
          )"
          test "$(jq -r '.status' <<<"${structure_fixture}")" = ready
          test "$(jq -r '.accepted_missing_target_count' <<<"${structure_fixture}")" = 0
          test "$(jq -r '.rejected_mismatch_kinds | join(",")' <<<"${structure_fixture}")" = dependency-path-target-missing,workspace-member-target-missing
          test "$(jq -r '.direct_dependency_case_count' <<<"${structure_fixture}")" = 4
          test "$(jq -r '.direct_dependency_table_coverage | join(",")' <<<"${structure_fixture}")" = dependencies,dev-dependencies,build-dependencies,target.cfg\(unix\).dependencies
          test "$(jq -r '.rejected_missing_targets | length' <<<"${structure_fixture}")" -ge 4
          test -z "$(grep -nE 'patch_base64|disposition_json|git[[:space:]]+apply' "${helper}" || true)"

      - name: Verify exact accepted SDK artifact provider identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packet="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SDK_ARTIFACT_ID}" \
              --jq '[.id, .name, .size_in_bytes, .expired, .digest, .workflow_run.id, .workflow_run.head_branch, .workflow_run.head_sha, .workflow_run.repository_id, .workflow_run.head_repository_id] | @tsv'
          )"
          IFS=$'\t' read -r artifact_id artifact_name artifact_size expired artifact_digest run_id head_branch head_sha repository_id head_repository_id <<<"${packet}"
          test "${artifact_id}" = "${SDK_ARTIFACT_ID}"
          test "${artifact_name}" = "${SDK_ARTIFACT_NAME}"
          test "${artifact_size}" = "${SDK_ARTIFACT_SIZE}"
          test "${expired}" = false
          test "${artifact_digest}" = "${SDK_ARTIFACT_DIGEST}"
          test "${run_id}" = "${SDK_ARTIFACT_RUN_ID}"
          test "${head_branch}" = "${SDK_ARTIFACT_HEAD_BRANCH}"
          test "${head_sha}" = "${SDK_ARTIFACT_HEAD_SHA}"
          test "${repository_id}" = "${GITHUB_REPOSITORY_ID}"
          test "${head_repository_id}" = "${GITHUB_REPOSITORY_ID}"

      - name: Check out exact reviewed build source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b8c1a1a176d30bec1c9265cae3d36c66a5dd3841
          fetch-depth: 0
          persist-credentials: false
          path: source-candidate

      - name: Verify exact reviewed build-source checkout
        shell: bash
        run: |
          set -euo pipefail
          source_root="${GITHUB_WORKSPACE}/source-candidate"
          test "${BUILD_SOURCE_SHA}" = "$(git -C "${source_root}" rev-parse HEAD)"
          test "${BUILD_SOURCE_TREE}" = "$(git -C "${source_root}" rev-parse HEAD^{tree})"
          test "22a0c45ee711dc5ce47847dc04cbc5e7e76507c0" = "$(git -C "${source_root}" show -s --format=%P HEAD)"
          test -z "$(git -C "${source_root}" status --porcelain)"
          remote_source="$({ git -C "${source_root}" ls-remote --heads origin "refs/heads/${BUILD_SOURCE_BRANCH}"; } | awk '{print $1}')"
          test "${remote_source}" = "${BUILD_SOURCE_SHA}"

      - name: Download exact accepted SDK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 9992014028
          github-token: ${{ github.token }}
          repository: sednalabs/codex
          run-id: 34042133059
          path: ${{ runner.temp }}/w13825-sdk-input
          merge-multiple: true

      - name: Preflight accepted execution inputs
        id: execution-inputs
        shell: bash
        run: |
          set -euo pipefail
          preflight_dir="${RUNNER_TEMP}/w13825-sdk-build-inputs"
          python3 "${GITHUB_WORKSPACE}/helper-checkout/.github/scripts/apply-upstream-cohort.py" \
            --prepare-inputs-only \
            --repo-root "${GITHUB_WORKSPACE}/source-candidate" \
            --artifact-dir "${RUNNER_TEMP}/w13825-sdk-input" \
            --preflight-dir "${preflight_dir}" \
            --expected-workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
            --expected-workflow-tree "${EXPECTED_WORKFLOW_TREE}"
          root_pnpm_version="$(
            jq -er \
              '.root_package.package_manager.version | select(type == "string" and test("^[0-9]+[.][0-9]+[.][0-9]+$"))' \
              "${preflight_dir}/execution-inputs.json"
          )"
          printf 'root_pnpm_version=%s\n' "${root_pnpm_version}" >>"${GITHUB_OUTPUT}"

      - name: Set up exact uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.3
          enable-cache: false

      - name: Set up accepted-root pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v5
        with:
          version: ${{ steps.execution-inputs.outputs.root_pnpm_version }}
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up repository-pinned Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          cache-save: false

      - name: Build, generate, test, and bundle exact consumer candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/helper-checkout/.github/scripts/apply-upstream-cohort.py" \
            --repo-root "${GITHUB_WORKSPACE}/source-candidate" \
            --artifact-dir "${RUNNER_TEMP}/w13825-sdk-input" \
            --preflight-dir "${RUNNER_TEMP}/w13825-sdk-build-inputs" \
            --output-dir "${RUNNER_TEMP}/w13825-sdk-build-candidate" \
            --expected-workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
            --expected-workflow-tree "${EXPECTED_WORKFLOW_TREE}"

      - name: Upload successful consumer candidate evidence (no push)
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: upstream-sdk-build-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w13825-sdk-build-candidate
          if-no-files-found: error

      - name: Upload bounded structural and lock failure evidence
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: upstream-sdk-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w13825-sdk-build-candidate/diagnostics
          if-no-files-found: ignore
