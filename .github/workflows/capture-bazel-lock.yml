name: capture-bazel-lock

on:
  push:
    branches:
      - dependabot/cargo/codex-rs/sentry-0.49.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: capture-bazel-lock
      - name: Update and capture Bzlmod lockfile
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/run_bazel_with_buildbuddy.py mod deps --lockfile_mode=update
          git diff -- MODULE.bazel.lock > "${RUNNER_TEMP}/MODULE.bazel.lock.patch"
      - name: Upload generated lockfile
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: generated-module-bazel-lock
          path: |
            MODULE.bazel.lock
            ${{ runner.temp }}/MODULE.bazel.lock.patch
