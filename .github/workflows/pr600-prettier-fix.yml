name: pr600-prettier-fix

on:
  push:
    branches:
      - docs/public-positioning-readme-20260813

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/public-positioning-readme-20260813
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format PR 600 Markdown
        run: pnpm exec prettier --write README.md docs/downstream-tool-surface-matrix.md

      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md docs/downstream-tool-surface-matrix.md; then
            echo "No formatting changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/downstream-tool-surface-matrix.md
          git commit -m "docs: format PR 600 markdown"
          git push origin HEAD:docs/public-positioning-readme-20260813
