name: Automatic-turn hardening once

on:
  push:
    paths:
      - '.github/auto-turn-hardening/apply'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply reviewed hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codex-rs/state/src/runtime/extension_storage/automatic_turns.rs')
          text = path.read_text()
          old = '''UPDATE usage_automatic_turns
SET outcome = ?,
    completed_at = strftime('%Y-%m-%dT%H:%M:%fZ','now')
WHERE turn_id = ?
'''
          new = '''UPDATE usage_automatic_turns
SET outcome = ?,
    completed_at = COALESCE(completed_at, strftime('%Y-%m-%dT%H:%M:%fZ','now'))
WHERE turn_id = ?
  AND outcome = 'started'
'''
          if text.count(old) != 1:
              raise SystemExit('completion SQL anchor mismatch')
          text = text.replace(old, new)
          text = text.replace('.fetch_one(runtime.usage_pool().as_ref())', '.fetch_one(runtime.usage_ledger_pool().as_ref())')
          if text.count('runtime.usage_pool()') != 0:
              raise SystemExit('usage_pool test references remain')
          marker = '''    #[tokio::test]
    async fn ordinary_user_message_is_not_projected_as_automatic() -> Result<()> {
'''
          test = '''    #[tokio::test]
    async fn automatic_turn_projection_keeps_first_terminal_outcome() -> Result<()> {
        let (runtime, _tmp_dir) = init_runtime().await?;
        let thread_id = ThreadId::new();
        let turn_id = "turn-auto-first-terminal";
        runtime
            .record_automatic_turn_event(&automatic_user_message(
                thread_id,
                "turn-trigger",
                turn_id,
                2,
                3,
            ))
            .await;
        runtime
            .complete_automatic_turn(turn_id, OUTCOME_REBLOCKED)
            .await?;
        let first = row(runtime.as_ref(), turn_id).await?;
        let first_completed_at = first
            .completed_at
            .clone()
            .expect("first terminal event should set completed_at");
        assert_eq!(first.outcome, OUTCOME_REBLOCKED);

        tokio::time::sleep(std::time::Duration::from_millis(10)).await;
        runtime
            .complete_automatic_turn(turn_id, OUTCOME_RECOVERED)
            .await?;

        let duplicate = row(runtime.as_ref(), turn_id).await?;
        assert_eq!(duplicate.outcome, OUTCOME_REBLOCKED);
        assert_eq!(
            duplicate.completed_at.as_deref(),
            Some(first_completed_at.as_str())
        );
        Ok(())
    }

'''
          if text.count(marker) != 1:
              raise SystemExit('test insertion anchor mismatch')
          text = text.replace(marker, test + marker)
          path.write_text(text)

          migration = Path('codex-rs/state/usage_migrations/0008_usage_automatic_turns.sql')
          sql = migration.read_text()
          redundant = '''CREATE INDEX IF NOT EXISTS usage_automatic_turns_thread_idx
    ON usage_automatic_turns(thread_id);
'''
          if sql.count(redundant) != 1:
              raise SystemExit('redundant index anchor mismatch')
          migration.write_text(sql.replace(redundant, ''))
          PY
          cd codex-rs
          cargo fmt -- --config imports_granularity=Item
          cd ..
          git diff --check
      - name: Commit and clean one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/auto-turn-hardening/apply .github/workflows/automatic-turn-hardening-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/state/src/runtime/extension_storage/automatic_turns.rs codex-rs/state/usage_migrations/0008_usage_automatic_turns.sql
          git commit -m 'fix: harden automatic-turn telemetry lifecycle'
          git push origin "HEAD:${GITHUB_REF_NAME}"
