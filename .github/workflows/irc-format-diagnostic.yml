name: IRC candidate formatting diagnostic
on:
  push:
    branches: [diag/irc-format-20261102]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Generate candidate formatting patch
        working-directory: codex-rs
        run: |
          cargo fmt -- --config imports_granularity=Item
          git diff --binary -- . > "$RUNNER_TEMP/irc-format.patch"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: irc-format-patch-${{ github.sha }}
          path: ${{ runner.temp }}/irc-format.patch
          if-no-files-found: error
