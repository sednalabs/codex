name: sdk-python-generate-v2-all

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit to generate from
        required: true
        type: string
      candidate_ref:
        description: Candidate ref recorded for provenance
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-v2-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      CANONICAL_REF: ""
      RUNTIME_PIN: openai-codex-cli-bin==0.144.4
      OUTPUT_PATH: sdk/python/src/openai_codex/generated/v2_all.py
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Assert exact checkout and clean preimage
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${CANDIDATE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
          [[ "${CANDIDATE_REF}" != refs/* ]]
          [[ "${CANDIDATE_REF}" != */ ]]
          git check-ref-format --branch "${CANDIDATE_REF}"
          test "${CANDIDATE_SHA}" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1)"
          remote_line="$(git ls-remote --heads origin "refs/heads/${CANDIDATE_REF}")"
          test "$(printf '%s\n' "${remote_line}" | sed '/^$/d' | wc -l)" = 1
          remote_sha="$(printf '%s\n' "${remote_line}" | awk '{print $1}')"
          remote_ref="$(printf '%s\n' "${remote_line}" | awk '{print $2}')"
          test "${remote_sha}" = "${CANDIDATE_SHA}"
          test "${remote_ref}" = "refs/heads/${CANDIDATE_REF}"
          echo "CANONICAL_REF=refs/heads/${CANDIDATE_REF}" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.3"

      - name: Generate Python v2_all artifact
        working-directory: sdk/python
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          dependencies = project.get("dependencies", [])
          matches = [item for item in dependencies if item == "openai-codex-cli-bin==0.144.4"]
          if len(matches) != 1:
              raise SystemExit(f"expected one pinned runtime dependency, found {len(matches)}")
          PY
          uv sync --group dev --frozen
          uv run --frozen --no-sync python scripts/update_sdk_artifacts.py generate-types

      - name: Enforce restricted generated diff
        shell: bash
        run: |
          set -euo pipefail
          expected="${OUTPUT_PATH}"
          changed="$(git status --porcelain=v1 | sed -E 's/^.. //')"
          test "${changed}" = "${expected}"
          test -f "${OUTPUT_PATH}"
          test ! -L "${OUTPUT_PATH}"
          test "$(stat -c '%a' "${OUTPUT_PATH}")" = 644
          test "$(git diff --name-only | wc -l)" = 1
          test "$(git diff --name-only)" = "${expected}"
          test -z "$(git diff --summary -- "${expected}")"
          git diff --diff-filter=T --quiet -- "${expected}"
          ! grep -nE '^(<<<<<<<|=======|>>>>>>>)' "${OUTPUT_PATH}"
          git diff --check

      - name: Write bounded provenance
        shell: bash
        run: |
          set -euo pipefail
          output_blob="$(git hash-object "${OUTPUT_PATH}")"
          python3 - "${output_blob}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "candidate_ref": os.environ["CANONICAL_REF"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "workflow_sha": os.environ["GITHUB_SHA"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "generator_command": "uv run --frozen --no-sync python scripts/update_sdk_artifacts.py generate-types",
              "runtime_pin": os.environ["RUNTIME_PIN"],
              "output_path": os.environ["OUTPUT_PATH"],
              "output_blob_sha": sys.argv[1],
              "artifact_identity": "sdk-python-v2-all-generated",
          }
          Path("sdk-python-v2-all-provenance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload generated artifact and provenance
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sdk-python-v2-all-generated
          retention-days: 7
          if-no-files-found: error
          path: |
            sdk/python/src/openai_codex/generated/v2_all.py
            sdk-python-v2-all-provenance.json
