name: Hosted SDK generation export

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  export:
    name: Export generated SDK patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - name: Generate SDK artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd sdk/python
          uv sync --group dev --frozen
          uv run --frozen --no-sync python scripts/update_sdk_artifacts.py generate-types
          cd ../..
          git diff --binary > generated-sdk.patch

      - name: Upload generated SDK patch
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hosted-generated-sdk-patch
          path: generated-sdk.patch
          if-no-files-found: warn
          retention-days: 1
