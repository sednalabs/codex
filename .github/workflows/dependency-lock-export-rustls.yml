name: Temporary rustls lock export

on:
  push:
    branches:
      - validation/dep-train-rustls-0-23-43-20260905
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact repository commit to regenerate from
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    name: Export exact rustls lock products
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_sha || '201a21935fd1b31bba75bbdfe8bed4b694271991' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ inputs.base_sha || '201a21935fd1b31bba75bbdfe8bed4b694271991' }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_BASE_SHA}"
          printf 'base_sha=%s\n' "${actual_sha}" > dependency-lock-export.identity

      - name: Regenerate Cargo rustls lock product
        working-directory: codex-rs
        shell: bash
        run: cargo update -p rustls@0.23.42 --precise 0.23.43

      - name: Verify generated Cargo lock
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Regenerate Bazel module lock product
        shell: bash
        run: bazel mod deps --lockfile_mode=update

      - name: Prove bounded generated set
        shell: bash
        run: |
          set -euo pipefail
          git diff --unified=0 -- codex-rs/Cargo.lock
          git diff --check
          printf 'guard=diff_check_pass\n'
          git diff --name-only > dependency-lock-export.paths
          expected_paths=$'MODULE.bazel.lock\ncodex-rs/Cargo.lock'
          test "$(cat dependency-lock-export.paths)" = "${expected_paths}"
          printf 'guard=paths_pass\n'
          cargo_lock_diff="$(git diff -- codex-rs/Cargo.lock)"
          ! grep -E -q '^[-+].*\b(h2|landlock|rtrb|sqlx|strum|serial_test|heck)\b' <<<"${cargo_lock_diff}"
          printf 'guard=forbidden_pass\n'
          changed_package_headers="$(git diff -- codex-rs/Cargo.lock | grep -E '^[-+]name = ' || true)"
          test -z "${changed_package_headers}"
          printf 'guard=headers_pass\n'
          test "$(grep -E -c '^[-+][[:space:]]*version =' <<<"${cargo_lock_diff}")" = 2
          test "$(grep -E -c '^[-+][[:space:]]*checksum =' <<<"${cargo_lock_diff}")" = 2
          printf 'guard=field_counts_pass\n'
          test "$(grep -F -c -- '-version = "0.23.42"' <<<"${cargo_lock_diff}")" = 1
          test "$(grep -F -c -- '+version = "0.23.43"' <<<"${cargo_lock_diff}")" = 1
          test "$(grep -F -c -- '-checksum = "3c54fcab019b409d04215d3a17cb438fd7fbf192ee61461f20f4fe18704bc138"' <<<"${cargo_lock_diff}")" = 1
          test "$(grep -F -c -- '+checksum = "0283386ce02abc0151e1761d08802dfe86c173b0b494af5cbc086574e453da06"' <<<"${cargo_lock_diff}")" = 1
          printf 'guard=exact_rustls_fields_pass\n'
          getrandom_old_count="$(grep -E -c '^- \"getrandom 0\.4\.3\",$' <<<"${cargo_lock_diff}")"
          getrandom_new_count="$(grep -E -c '^\+ \"getrandom 0\.3\.4\",$' <<<"${cargo_lock_diff}")"
          printf 'getrandom_old_count=%s new_count=%s\n' "${getrandom_old_count}" "${getrandom_new_count}"
          test "${getrandom_old_count}" = 1
          test "${getrandom_new_count}" = 1
          printf 'guard=exact_coupled_edge_pass\n'
          changed_cargo_line_count="$(grep -E '^[-+]' <<<"${cargo_lock_diff}" | grep -Ev '^(---|\+\+\+)' | wc -l | tr -d ' ')"
          test "${changed_cargo_line_count}" = 6
          printf 'guard=unexpected_lines_pass\n'
          git diff --binary > dependency-lock-export.patch
          cat dependency-lock-export.identity > dependency-lock-export.proof
          printf 'generated_head_sha=' >> dependency-lock-export.proof
          git rev-parse HEAD >> dependency-lock-export.proof
          printf 'changed_paths=' >> dependency-lock-export.proof
          paste -sd, dependency-lock-export.paths >> dependency-lock-export.proof
          printf 'diff_stat=' >> dependency-lock-export.proof
          git diff --stat | tr '\n' ' ' >> dependency-lock-export.proof
          printf '\n' >> dependency-lock-export.proof

      - name: Upload generated products and proof
        uses: actions/upload-artifact@v7
        with:
          name: dependency-lock-export-rustls-0.23.43
          path: |
            dependency-lock-export.patch
            dependency-lock-export.paths
            dependency-lock-export.identity
            dependency-lock-export.proof
          if-no-files-found: error
          retention-days: 7
