name: Hosted format export

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  export:
    name: Export formatter patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - name: Generate formatter patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path codex-rs/Cargo.toml
          uvx --from 'ruff==0.15.12' ruff format \
            sdk/python/scripts/update_sdk_artifacts.py \
            sdk/python/tests/test_artifact_workflow_and_binaries.py \
            sdk/python/tests/test_client_rpc_methods.py
          git diff --binary > format.patch

      - name: Upload formatter patch
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hosted-format-patch
          path: format.patch
          if-no-files-found: warn
          retention-days: 1
