name: Temporary Tonic lock refresh

on:
  push:
    branches:
      - codex/w14939-integration-970111-20261025
    paths:
      - codex-rs/Cargo.toml
      - codex-rs/code-mode-protocol/Cargo.toml
      - codex-rs/config/Cargo.toml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0

      - name: Update only the Tonic crate family
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo update -p tonic --precise 0.14.9
          cargo update -p tonic-prost --precise 0.14.9
          cargo update -p tonic-prost-build --precise 0.14.9
          cargo update -p tonic-build --precise 0.14.9

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: temporary-tonic-lock-${{ github.sha }}
          path: codex-rs/Cargo.lock
          if-no-files-found: error
          retention-days: 1
