name: blob-size-policy

on:
  workflow_call:

jobs:
  check:
    name: Blob size policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: openai/fence@f9751ca5d767dc0199e88733c2b286bd4800a008 # pin@v0.12.5
        with:
          mode: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine comparison range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # PR and merge-queue events inspect their exact proposed diff; main
          # pushes inspect only the commit range that just landed.
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "merge_group" ]]; then
            base="${MERGE_GROUP_BASE_SHA}"
            head="${CURRENT_SHA}"
          else
            base="${EVENT_BEFORE}"
            head="${CURRENT_SHA}"
          fi
          if [[ -z "${base}" || -z "${head}" ]]; then
            echo "::error::Unable to determine the exact blob-size comparison range." >&2
            exit 1
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Check changed blob sizes
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          python3 scripts/check_blob_size.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --max-bytes 512000 \
            --allowlist .github/blob-size-allowlist.txt

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
