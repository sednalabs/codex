name: Run argument comment lint
description: Run the prebuilt argument-comment-lint package on codex-rs.

inputs:
  target:
    description: Runner target retained for workflow compatibility.
    required: true
  buildbuddy-api-key:
    description: Unused compatibility input for older workflow call sites.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-ci

    - name: Install Linux build dependencies
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

    # The checked-in release DotSlash package still bundles cargo-dylint 5.0.0,
    # which resolves Clippy's removed `master` branch. Keep its lint library,
    # but use the fixed driver for this CI invocation.
    - name: Install compatible cargo-dylint
      shell: bash
      run: |
        set -euo pipefail
        install_root="$RUNNER_TEMP/argument-comment-lint-cargo-dylint"
        cargo install --locked cargo-dylint --version 6.3.2 --root "$install_root"
        cargo_dylint="$install_root/bin/cargo-dylint"
        if [[ -f "${cargo_dylint}.exe" ]]; then
          cargo_dylint="${cargo_dylint}.exe"
        fi
        test -f "$cargo_dylint"
        echo "CODEX_ARGUMENT_COMMENT_LINT_CARGO_DYLINT=$cargo_dylint" >> "$GITHUB_ENV"

    - name: Run prebuilt argument comment lint on codex-rs
      shell: bash
      run: |
        set -o pipefail

        run_lint() {
          local log_path="$1"
          ./tools/argument-comment-lint/run-prebuilt-linter.py -- --all-targets --ignore-rust-version 2>&1 | tee "${log_path}"
        }

        is_transient_cargo_fetch_failure() {
          local log_path="$1"
          grep -Eiq \
            'cargo metadata.*exited with an error|failed to get .* as a dependency|unable to update registry|download of .* failed|curl failed' \
            "${log_path}"
        }

        first_log="$(mktemp)"
        if run_lint "${first_log}"; then
          exit 0
        fi

        if ! is_transient_cargo_fetch_failure "${first_log}"; then
          exit 1
        fi

        echo "argument-comment-lint hit a transient Cargo fetch/metadata failure; retrying once" >&2
        retry_log="$(mktemp)"
        run_lint "${retry_log}"
