name: Set up pinned voice native dependencies for Cargo
description: Build the repository's pinned Bazel voice SDK and expose it to direct Cargo consumers.
inputs:
  target:
    description: Rust target triple
    required: true
  cache-scope:
    description: Bazel repository-cache namespace
    required: true
runs:
  using: composite
  steps:
    - name: Prepare Bazel CI
      uses: ./.github/actions/prepare-bazel-ci
      with:
        target: ${{ inputs.target }}
        cache-scope: ${{ inputs.cache-scope }}

    - name: Set up MSVC environment for voice Cargo (Windows)
      if: runner.os == 'Windows'
      uses: ./.github/actions/setup-msvc-env
      with:
        target: ${{ inputs.target }}

    - name: Download pinned Windows voice inputs
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $manifest = Get-Content -Raw .github/scripts/voice-cygwin-snapshot.json | ConvertFrom-Json
        $pin = $manifest.archive
        $source = $manifest.sourceArchive
        $directory = Join-Path $env:RUNNER_TEMP "voice-cygwin-snapshot"
        New-Item -ItemType Directory -Force -Path $directory | Out-Null
        gh release download $pin.tag --repo "${{ github.repository }}" --pattern $pin.name --pattern $source.name --dir $directory
        if ($LASTEXITCODE -ne 0) { throw "Cannot obtain pinned Windows voice inputs" }
        $sourceFile = Join-Path $directory $source.name
        if ((Get-Item $sourceFile).Length -ne $source.bytes -or
            (Get-FileHash $sourceFile -Algorithm SHA256).Hash.ToLowerInvariant() -ne $source.sha256) {
          throw "Pinned Windows voice source archive mismatch"
        }
        "VOICE_CYGWIN_ARCHIVE=$(Join-Path $directory $pin.name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install pinned Windows voice build tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & ./.github/scripts/setup-voice-windows.ps1 -Target "${{ inputs.target }}" -SnapshotArchive $env:VOICE_CYGWIN_ARCHIVE
        if (-not $env:SystemRoot) { throw "Windows SystemRoot is required" }
        "VOICE_WINDOWS_SYSTEM_ROOT=$env:SystemRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        $hostArch = $env:PROCESSOR_ARCHITEW6432
        if (-not $hostArch) { $hostArch = $env:PROCESSOR_ARCHITECTURE }
        if (-not $hostArch) { throw "Windows host architecture is required" }
        "VOICE_WINDOWS_HOST_ARCH=$hostArch" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Build pinned voice SDK for Cargo (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: ./.github/scripts/setup-voice-cargo.sh "${{ inputs.target }}"

    - name: Build pinned voice SDK for Cargo (Windows)
      if: runner.os == 'Windows'
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        BUILDBUDDY_API_KEY: ""
      run: |
        set -euo pipefail
        case "$TARGET" in
          x86_64-pc-windows-msvc) arch=x86_64 ;;
          aarch64-pc-windows-msvc) arch=aarch64 ;;
          *) echo "unsupported Windows voice target: $TARGET" >&2; exit 2 ;;
        esac
        export VOICE_ARCH="$arch"
        if [[ "$arch" == aarch64 ]]; then
          export BAZEL_HOST_JVM_ARG=-Xint
        fi
        python .github/scripts/watch_voice_bazel.py "$(cygpath -w "$BASH")" ./.github/scripts/run-bazel-ci.sh \
          --remote-download-toplevel \
          --print-failed-action-summary \
          --windows-msvc-host-platform \
          -- test -c opt \
          --platforms=//:local_windows_msvc \
          --extra_toolchains=@local_config_cc//:cc-toolchain-x64_windows,@local_config_cc//:cc-toolchain-arm64_windows,//third_party/voice:windows_pkg_config_toolchain,//third_party/voice:windows_cmake_toolchain \
          --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 \
          --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
          --inject_repository="voice_windows_tools=$VOICE_WINDOWS_BAZEL_REPOSITORY" \
          --//third_party/voice:windows_installed_tools=@voice_windows_tools//:tools \
          --action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT" \
          --host_action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT" \
          --action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH" \
          --host_action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH" \
          --output_groups=default,sdk \
          -- //third_party/voice:native_sdk //third_party/voice:native_link_windows_$arch

        bazel_bin="$(bazel info bazel-bin)"
        sdk="$bazel_bin/third_party/voice/native_runtime_windows_${arch}_sdk"
        native_lib="$bazel_bin/third_party/voice/native_link_windows_${arch}/lib"
        for path in "$sdk/lib/pkgconfig" "$native_lib" "$VOICE_PKG_CONFIG"; do
          [[ -e "$path" ]] || { echo "missing voice Cargo input: $path" >&2; exit 1; }
        done
        {
          echo "PKG_CONFIG=$VOICE_PKG_CONFIG"
          echo "PKG_CONFIG_LIBDIR=$sdk/lib/pkgconfig"
          echo "PKG_CONFIG_PATH="
          for key in GLIB_2_0 GOBJECT_2_0 GIO_2_0 GSTREAMER_1_0 GSTREAMER_BASE_1_0 GSTREAMER_APP_1_0 GSTREAMER_AUDIO_1_0; do
            echo "SYSTEM_DEPS_${key}_SEARCH_NATIVE=$native_lib"
          done
          for key in GSTREAMER_1_0 GSTREAMER_BASE_1_0 GSTREAMER_APP_1_0 GSTREAMER_AUDIO_1_0; do
            echo "SYSTEM_DEPS_${key}_LDFLAGS="
          done
        } >> "$GITHUB_ENV"
