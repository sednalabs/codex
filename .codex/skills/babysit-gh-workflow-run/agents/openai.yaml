interface:
  display_name: "Workflow Run Babysitter"
  short_description: "Watch GitHub Actions workflow runs and summarize failures"
  default_prompt: "Babysit a GitHub Actions run through one bundled blocking watcher invocation. Use `--watch-until-terminal` for delegated waits and `--watch-until-action` only when a repair owner should wake before the run completes. Do not add `--progress`, do not issue repeated `--once` snapshots, and do not invent raw GitHub polling loops. Gemini diagnosis is disabled by default and must remain off unless the operator deliberately requests `--gemini-diagnosis` for that exact invocation. Prefer exact run ids or digest-bound workflow/ref targets, allow the helper to follow the resolved run internally, and return only on terminal success, actionable failure, or a blocker requiring the parent."
