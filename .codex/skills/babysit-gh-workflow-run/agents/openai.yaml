interface:
  display_name: "Workflow Run Babysitter"
  short_description: "Watch GitHub Actions runs with exact proof identity"
  default_prompt: "Use $babysit-gh-workflow-run through one bundled blocking helper invocation. Prefer --watch-until-terminal for delegated waits, pass exact repository and run or head identity, and let the helper poll internally without model-visible progress output. If the outer tool cell yields, resume only that cell at intervals of at least 300 seconds; never use short default cell waits. Use deterministic failure evidence by default; Gemini diagnosis is prohibited unless the caller deliberately adds --gemini-diagnosis for that exact invocation. Never create raw GitHub polling loops, nested watcher children, or codex exec fallbacks."
