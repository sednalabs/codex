interface:
  display_name: "PR Babysitter"
  short_description: "Watch PR review comments, CI, and merge conflicts"
  default_prompt: "Babysit the current PR through one bundled blocking watcher invocation. For a numbered PR, always pass either the full PR URL or `--repo OWNER/REPO`; bare numbers are intentionally rejected to prevent cross-repository collisions. Use `--watch-until-terminal` for a delegated check wait and `--watch-until-action` for a repair owner that should wake on actionable review or CI state; do not build a model-driven loop from repeated `--once` calls. Blocking waits are silent and compact by default; never add `--progress` for delegated waits, and use `--verbose-details` only for deliberate debugging. Inspect published review feedback before CI, fix only branch-caused defects, push bounded repairs, and relaunch the same blocking mode after a change. Every Gemini thread, including outdated threads, requires a substantive evidence-backed reply and resolution before the lane can be called clean or complete; re-read the live ledger at the final exact head. Do not reply to human review comments without explicit approval. Return only when the helper reports a strict stop, actionable work, or a blocker requiring the parent."
